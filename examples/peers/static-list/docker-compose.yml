# loki-vl-proxy — peer fleet with static discovery
#
# Three proxy instances sharing a fixed peer list.  No external discovery
# service needed — each proxy knows all peers at startup.
#
# Usage:
#   export PEER_AUTH_TOKEN=$(openssl rand -hex 32)   # shared peer token, required
#   docker compose up -d
#   curl -H "X-Peer-Token: ${PEER_AUTH_TOKEN}" http://localhost:3100/_cache/peers
#   curl -H "X-Peer-Token: ${PEER_AUTH_TOKEN}" http://localhost:3101/_cache/peers
#   curl -H "X-Peer-Token: ${PEER_AUTH_TOKEN}" http://localhost:3102/_cache/peers
#
# The proxy is read-only: write logs to VictoriaLogs (no host port here; see README.md).
#
# Release images are signed with cosign (keyless) and carry build provenance; verify
# the proxy image before use: see SECURITY.md#verifying-releases
# (https://github.com/ReliablyObserve/loki-vl-proxy/blob/main/SECURITY.md#verifying-releases).
# Image tags are pinned to explicit versions; bump them deliberately.

services:

  # ── VictoriaLogs ───────────────────────────────────────────────────────────
  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - -retentionPeriod=7d
      - -storageDataPath=/vlogs
    volumes:
      - vlogs-data:/vlogs
    restart: unless-stopped
    healthcheck:
      # VictoriaLogs images are scratch-based from v1.52.0 (no shell, no wget);
      # the binary's -version exit path is the probe that works on every version.
      test: ["CMD", "/victoria-logs-prod", "-version"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── proxy-a ────────────────────────────────────────────────────────────────
  proxy-a:
    image: ghcr.io/reliablyobserve/loki-vl-proxy:2.34.1
    ports:
      - "3100:3100"
    command:
      - -backend=http://victorialogs:9428
      - -label-style=underscores
      - -metadata-field-mode=translated
      - -emit-structured-metadata=true
      - -patterns-enabled=true
      - -cache-ttl=60s
      - -cache-max=5000
      # Peer cache — static discovery
      - -peer-self=proxy-a:3100
      - -peer-discovery=static
      - -peer-static=proxy-a:3100,proxy-b:3100,proxy-c:3100
      - -peer-auth-token=${PEER_AUTH_TOKEN:?set PEER_AUTH_TOKEN}
      - -log-level=info
    depends_on:
      victorialogs:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── proxy-b ────────────────────────────────────────────────────────────────
  proxy-b:
    image: ghcr.io/reliablyobserve/loki-vl-proxy:2.34.1
    ports:
      - "3101:3100"
    command:
      - -backend=http://victorialogs:9428
      - -label-style=underscores
      - -metadata-field-mode=translated
      - -emit-structured-metadata=true
      - -patterns-enabled=true
      - -cache-ttl=60s
      - -cache-max=5000
      - -peer-self=proxy-b:3100
      - -peer-discovery=static
      - -peer-static=proxy-a:3100,proxy-b:3100,proxy-c:3100
      - -peer-auth-token=${PEER_AUTH_TOKEN:?set PEER_AUTH_TOKEN}
      - -log-level=info
    depends_on:
      victorialogs:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── proxy-c ────────────────────────────────────────────────────────────────
  proxy-c:
    image: ghcr.io/reliablyobserve/loki-vl-proxy:2.34.1
    ports:
      - "3102:3100"
    command:
      - -backend=http://victorialogs:9428
      - -label-style=underscores
      - -metadata-field-mode=translated
      - -emit-structured-metadata=true
      - -patterns-enabled=true
      - -cache-ttl=60s
      - -cache-max=5000
      - -peer-self=proxy-c:3100
      - -peer-discovery=static
      - -peer-static=proxy-a:3100,proxy-b:3100,proxy-c:3100
      - -peer-auth-token=${PEER_AUTH_TOKEN:?set PEER_AUTH_TOKEN}
      - -log-level=info
    depends_on:
      victorialogs:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vlogs-data:
