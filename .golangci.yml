version: "2"

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - unused
    - govet
    - misspell
    - gocyclo
    - depguard
    - dupl
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - (*encoding/json.Decoder).Decode
        - encoding/json.Unmarshal
        - encoding/json.Marshal
        - fmt.Fprintf
        - fmt.Fprintln
        - (*net/http.Request).ParseForm
        - io.Copy
        - (io.Closer).Close
        - (*os.File).Close
    gocyclo:
      min-complexity: 30
    # Layering: the LogQL and LogsQL syntax packages sit below the translator
    # and the proxy. logql may use logsql; logsql may use neither. Both may use
    # the stdlib and internal/querycorpus (a stdlib-only leaf). The physical-plan
    # operators sit beside them: the stdlib and logsql only, so the translator
    # and the logical plan can both build on them. Test files are
    # out of scope: a test in package logql cannot import the translator anyway.
    # The logical plan (queryplan) sits above logql and below the translator and
    # the proxy: it reads the LogQL AST and nothing else. The lowering (lower)
    # sits above the logical plan and the operators, and below the translator
    # and the proxy, which it never imports. The LogsQL builders both the
    # lowering and the string translator use (translate) read only the syntax
    # packages.
    depguard:
      rules:
        logql:
          list-mode: strict
          files:
            - "**/internal/logql/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/ReliablyObserve/Loki-VL-proxy/internal/logsql
            - github.com/ReliablyObserve/Loki-VL-proxy/internal/querycorpus
        logsql:
          list-mode: strict
          files:
            - "**/internal/logsql/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/ReliablyObserve/Loki-VL-proxy/internal/querycorpus
        queryplan:
          list-mode: strict
          files:
            - "**/internal/queryplan/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/ReliablyObserve/Loki-VL-proxy/internal/logql
        physical:
          list-mode: strict
          files:
            - "**/internal/queryplan/physical/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/ReliablyObserve/Loki-VL-proxy/internal/logsql
        lower:
          list-mode: strict
          files:
            - "**/internal/queryplan/lower/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/ReliablyObserve/Loki-VL-proxy/internal/logql
            - github.com/ReliablyObserve/Loki-VL-proxy/internal/logsql
            - github.com/ReliablyObserve/Loki-VL-proxy/internal/queryplan
            - github.com/ReliablyObserve/Loki-VL-proxy/internal/queryplan/physical
            - github.com/ReliablyObserve/Loki-VL-proxy/internal/translate
        translate:
          list-mode: strict
          files:
            - "**/internal/translate/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/ReliablyObserve/Loki-VL-proxy/internal/logql
            - github.com/ReliablyObserve/Loki-VL-proxy/internal/logsql
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocyclo
          - dupl
      # dupl guards the syntax packages only.
      - path-except: internal/(logql|logsql)/
        linters:
          - dupl

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
