version: 2
updates:
  # Keep GitHub Actions pinned to latest SHA-tagged versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Let new releases bake before opening a PR (supply-chain hardening).
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        patterns: ["*"]
    labels:
      - dependencies
      - github-actions

  # Keep Go modules up to date.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      go-minor:
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - go

  # Keep the builder base image up to date.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker

  # Keep the documentation website (Docusaurus) dependencies up to date.
  # Group everything into a single PR so transitive security bumps land
  # together instead of one PR per package.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      website-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      website-security:
        applies-to: security-updates
        patterns: ["*"]
    labels:
      - dependencies
      - website

  # Keep the e2e-ui screenshot tooling (Playwright) up to date.
  - package-ecosystem: npm
    directory: /test/e2e-ui
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      e2e-ui-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - testing

  # Keep the visual-smoke capture tooling (Playwright) up to date.
  - package-ecosystem: npm
    directory: /bench/visual
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      visual-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - testing

  # Keep the hash-pinned Pillow install for visual-smoke up to date.
  - package-ecosystem: pip
    directory: /bench/visual
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      visual-python-deps:
        patterns: ["*"]
    labels:
      - dependencies
      - testing

  # Keep the hash-pinned Semgrep install for the security scan up to date.
  - package-ecosystem: pip
    directory: /security
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      semgrep-deps:
        patterns: ["*"]
    labels:
      - dependencies
      - security

  # Keep the digest-pinned helper images in the test stacks up to date. The Loki,
  # VictoriaLogs and Grafana pins are owned by the compatibility matrix
  # (test/e2e-compat/compatibility-matrix.json) and must not be bumped on their own.
  - package-ecosystem: docker-compose
    directories:
      - /test/e2e-compat
      - /test/e2e-fleet
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "grafana/*"
      - dependency-name: "victoriametrics/*"
    groups:
      test-stack-images:
        patterns: ["*"]
    labels:
      - dependencies
      - docker
      - testing

  # Keep the example stacks' images up to date.
  - package-ecosystem: docker-compose
    directories:
      - /examples
      - /examples/peers/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      example-images:
        patterns: ["*"]
    labels:
      - dependencies
      - docker
