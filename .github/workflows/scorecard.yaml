name: Scorecard

# Publishes the OpenSSF Scorecard result for main to the public Scorecard API
# (https://scorecard.dev/viewer/?uri=github.com/ReliablyObserve/loki-vl-proxy),
# which the README badge reads. The per-pull-request guardrail runs in
# security-pr.yaml. Results are kept as an artifact, not uploaded to code
# scanning, so Scorecard findings do not enter the code-scanning merge gate.

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Publishing the result needs an OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: true

      - name: Upload result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: scorecard
          path: scorecard.json
          retention-days: 30
