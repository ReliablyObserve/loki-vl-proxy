name: PR evidence summary

# Read existing artifacts only; never execute PR code or downloaded scripts.
on:
  workflow_run:
    workflows: [CI, PR Quality Report, Perf A/B, Visual smoke, Loki Compatibility, Logs Drilldown Compatibility, VictoriaLogs Compatibility, Security PR]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pr-evidence-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  summarize:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # For workflow_run, github.sha is the trusted default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Summarize existing evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/pr_evidence.py --out "$RUNNER_TEMP/pr-quality-report.md"
          if [ -f "$RUNNER_TEMP/pr-quality-report.md" ]; then
            cat "$RUNNER_TEMP/pr-quality-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain summary and source identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pr-evidence-summary
          path: |
            ${{ runner.temp }}/pr-quality-report.md
            ${{ runner.temp }}/pr-quality-report.md.json
          if-no-files-found: ignore
