name: Visual smoke

# Per-pull-request visual proof: Grafana (Explore and Logs Drilldown) through the
# base build, the PR build and Loki on one fresh stack. A small fixed core set
# runs on every relevant change; the pages near the code the change touches
# (bench/visual/plan.py, from the conformance registry) run at 15m, 1h and 6h.
# Posts one sticky comment and fails the `visual-smoke` check on a base-vs-PR
# data difference, a panel that went empty, or an error banner only the PR
# shows. See bench/visual/README.md ("In CI").
#
# Three jobs; only the first runs the pull request's code (its npm, Go and Docker
# dependencies, its scripts), and it has a read-only token. The two jobs that hold
# a write token run code of the BASE branch (a sparse checkout of bench/visual at the
# base commit) and treat what the first job produced as untrusted data:
#   visual-smoke    read-only: plan, stack, capture, compare, gate
#   visual-publish  contents: write, same-repo PRs: validates the bounded
#                   inline montages and replaces pr-<N>/ on pr-visuals (publish.py of the base)
#   visual-comment  pull-requests: write, same-repo PRs: renders the sticky comment
#                   with visual_comment.py of the base, which escapes every string that
#                   comes from the pull request
# While the base branch has no publish.py or visual_comment.py (the pull request that adds
# them) nothing is published and the comment is a fixed text; the job summary has
# the table.
#
# An intended change of what Grafana shows is accepted by labelling the pull
# request `visual-change-expected` (adding or removing it re-runs this workflow).
#
# A baseline run (change scope: the `baseline` label, or a big shipped diff on a
# pull request into main) captures every page of bench/visual/spec.json at its
# own ranges (plan.py --all) instead of the pages the change selects. The captures
# are uploaded as `visual-baseline-candidate` and the comment ends with a "new
# baseline candidate" section. The bounded inline montages are published as
# review proof; the full candidate is never committed as an accepted baseline.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: visual-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: scope
    # The same trigger condition as visual-smoke, so a label that does not re-run it does not
    # start a scope run either.
    if: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'visual-change-expected' }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/change-scope.yaml  # zizmor: ignore[self-repository] workspace-relative form, as the workflow pin test and the pinned actionlint expect

  visual-smoke:
    name: visual-smoke
    needs: [scope]
    # Only runtime changes can produce a meaningful before/after Grafana proof.
    # A forced CI/baseline label does not make a docs or CI-only diff measurable.
    if: ${{ !cancelled() && needs.scope.outputs.evidence == 'true' && (github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'visual-change-expected') }}
    runs-on: ubuntu-latest
    # The planned pages of a change are a few captures; the baseline run captures every page.
    timeout-minutes: ${{ needs.scope.outputs.baseline == 'true' && 90 || 30 }}
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      artifact-url: ${{ steps.montage.outputs.artifact-url }}
    env:
      OUT: /tmp/visual-smoke
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      BASELINE: ${{ needs.scope.outputs.baseline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The base build comes from a worktree of the merge commit's first parent.
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the captures for this change
        id: plan
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          # HEAD is the PR merged onto the base; its first parent is that base.
          BASE="$(git rev-parse HEAD^1)"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          if [ "$BASELINE" = "true" ]; then
            python3 bench/visual/plan.py --all --base "$BASE" --out "$OUT/plan.json" > /dev/null
          else
            python3 bench/visual/plan.py --base "$BASE" --out "$OUT/plan.json" > /dev/null
          fi
          echo "run=$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["run"]).lower())' "$OUT/plan.json")" >> "$GITHUB_OUTPUT"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["captures"], "capture(s):", {k: v["ranges"] for k, v in d["entries"].items()} or "nothing to run")' "$OUT/plan.json"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        if: steps.plan.outputs.run == 'true'
        with:
          go-version: "1.27.3"
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        if: steps.plan.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bench/visual/package-lock.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        if: steps.plan.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-visual-${{ hashFiles('bench/visual/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-visual-

      - name: Install the capture tooling
        if: steps.plan.outputs.run == 'true'
        working-directory: bench/visual
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes -r requirements.txt
          npm ci --no-audit --no-fund
          # The runner's Chrome, as the e2e-ui jobs use; Playwright's own build otherwise.
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "PLAYWRIGHT_EXECUTABLE_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Capture and compare
        if: steps.plan.outputs.run == 'true'
        env:
          BASE: ${{ steps.plan.outputs.base }}
        run: |
          # A failure leaves error.json (or a missing capture): the verdict, not this step, decides.
          python3 bench/visual/ci_run.py --base "$BASE" --plan "$OUT/plan.json" --out "$OUT" \
            --head-label "$PR_HEAD" --project vs --workers 2 || true

      - name: Upload montages and results
        id: montage
        if: always() && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: visual-montage
          path: |
            ${{ env.OUT }}/montage/
            ${{ env.OUT }}/data/lvl-dd-logs-pill-multi-json/1h/*.json
            ${{ env.OUT }}/*.json
            ${{ env.OUT }}/*.md
            ${{ env.OUT }}/*.log
          if-no-files-found: ignore

      - name: Upload the baseline candidate
        # Never committed or published: the montages and the comparison of a run that measured every page.
        if: always() && steps.plan.outputs.run == 'true' && env.BASELINE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: visual-baseline-candidate
          path: |
            ${{ env.OUT }}/montage/
            ${{ env.OUT }}/plan.json
            ${{ env.OUT }}/compare.json
            ${{ env.OUT }}/pixeldiff.json
            ${{ env.OUT }}/meta.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Render the summary and the verdict
        id: verdict
        if: always()
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.montage.outputs.artifact-url }}
          BASE: ${{ steps.plan.outputs.base }}
          VISUAL_CHANGE_EXPECTED: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change-expected') }}
        run: |
          set -euo pipefail
          [ -f "$OUT/meta.json" ] || printf '{"base": "%s", "head": "%s"}\n' "$BASE" "$PR_HEAD" > "$OUT/meta.json"
          python3 bench/visual/visual_comment.py --out "$OUT" --mode artifact --repo "$REPO" --pr "$PR" --run-url "$RUN_URL" \
            --artifact-url "$ARTIFACT_URL" --md "$OUT/comment-summary.md" --verdict "$OUT/verdict.json" > /dev/null
          echo "exit=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["exit"])' "$OUT/verdict.json")" >> "$GITHUB_OUTPUT"
          # The step summary carries the table for every run, forks included (no comment there).
          cat "$OUT/comment-summary.md" >> "$GITHUB_STEP_SUMMARY"

      # Upload the existing verdict only; no new captures or comparisons.
      - name: Upload compact quality evidence
        if: always() && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: visual-quality-evidence
          path: |
            ${{ env.OUT }}/meta.json
            ${{ env.OUT }}/plan.json
            ${{ env.OUT }}/compare.json
            ${{ env.OUT }}/verdict.json
          if-no-files-found: ignore

      - name: Fail on regression
        if: steps.plan.outputs.run == 'true'
        env:
          CODE: ${{ steps.verdict.outputs.exit }}
        run: |
          case "$CODE" in
            0) echo "no visual regression" ;;
            1) echo "::error::Visual smoke: the PR changes the data Grafana receives, empties a panel or shows an error the base does not (see the PR comment)"; exit 1 ;;
            *) echo "::error::Visual smoke did not complete (exit ${CODE:-none}); see the PR comment, the log and the uploaded artifacts"; exit 1 ;;
          esac

  visual-publish:
    name: visual-publish
    needs: [scope, visual-smoke]
    # Same-repo PRs only: a fork's token cannot write. !cancelled(), not always(): a run
    # that a newer push cancelled must not overwrite the folder with stale images.
    # A baseline captures every page; publish only the bounded montages embedded
    # by the trusted base-branch renderer. The full set stays in run artifacts.
    if: "!cancelled() && needs.visual-smoke.result != 'skipped' && needs.visual-smoke.outputs.run == 'true' && github.event.pull_request.head.repo.full_name == github.repository"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    steps:
      # The base branch's code, not the pull request's: this job holds a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: bench/visual
          persist-credentials: false

      - name: Is there a publisher on the base branch?
        id: have
        run: |
          if [ ! -f bench/visual/publish.py ] || [ ! -f bench/visual/visual_comment.py ]; then
            echo "::notice::the base branch has no visual publisher or renderer yet; montages stay in the run artifact"
            echo "have=false" >> "$GITHUB_OUTPUT"
          elif python3 bench/visual/publish.py --help | grep -q -- --names-file && \
               python3 bench/visual/visual_comment.py --help | grep -q -- --images; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "bounded=true" >> "$GITHUB_OUTPUT"
          else
            # The older trusted base renderer already emits the exact inline
            # montage URLs. Stage only those files before calling its <=80-file
            # publisher; never run a PR-controlled script with this write token.
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "bounded=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: steps.have.outputs.have == 'true'
        with:
          name: visual-montage
          path: /tmp/visual-data

      - name: Publish the montages to pr-visuals
        id: publish
        if: steps.have.outputs.have == 'true'
        env:
          PUBLISH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOUNDED: ${{ steps.have.outputs.bounded }}
          VISUAL_CHANGE_EXPECTED: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change-expected') }}
        run: |
          set -euo pipefail
          if [ "$BOUNDED" = "true" ]; then
            # Both scripts come from the trusted base branch. The renderer chooses
            # the <=80 files it will embed; publish.py validates every untrusted
            # montage and the selection before replacing pr-<N>/.
            python3 bench/visual/visual_comment.py --out /tmp/visual-data --mode branch \
              --repo "$REPO" --pr "$PR" --run-url "$RUN_URL" \
              --md /tmp/visual-publish-comment.md --verdict /tmp/visual-publish-verdict.json \
              --images /tmp/visual-publish-images.json > /dev/null
            python3 bench/visual/publish.py publish --montage /tmp/visual-data/montage --pr "$PR" \
              --names-file /tmp/visual-publish-images.json --remote "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            # Compatibility with a trusted base before --images/--names-file:
            # render its own comment, then allowlist only its inline PNG names.
            python3 bench/visual/visual_comment.py --out /tmp/visual-data --mode branch \
              --repo "$REPO" --pr "$PR" --run-url "$RUN_URL" \
              --md /tmp/visual-publish-comment.md --verdict /tmp/visual-publish-verdict.json > /dev/null
            python3 - <<'PY'
          import os
          import pathlib
          import re
          import shutil
          import stat

          repo = os.environ["REPO"]
          pr = str(int(os.environ["PR"]))
          prefix = f"https://raw.githubusercontent.com/{repo}/pr-visuals/pr-{pr}/"
          markdown = pathlib.Path(os.environ.get("VISUAL_PREVIEW", "/tmp/visual-publish-comment.md")).read_text(encoding="utf-8")
          pattern = re.compile(r"!\[[^\]\n]*\]\(" + re.escape(prefix) + r"([A-Za-z0-9][A-Za-z0-9_.-]*\.png)\?v=[0-9a-f]{0,8}\)")
          names = sorted(set(pattern.findall(markdown)))
          if not names or len(names) > 80:
              raise SystemExit(f"trusted comment selected {len(names)} images; expected 1..80")
          source = pathlib.Path(os.environ.get("VISUAL_MONTAGE_DIR", "/tmp/visual-data/montage"))
          staged = pathlib.Path(os.environ.get("VISUAL_STAGED_DIR", "/tmp/visual-publish-selected"))
          staged.mkdir(mode=0o700)
          for name in names:
              path = source / name
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode) or info.st_size > 300_000:
                  raise SystemExit(f"invalid montage {name}")
              shutil.copyfile(path, staged / name)
          print(f"staged {len(names)} trusted-rendered inline montages")
          PY
            # The base publisher validates every staged file again and replaces
            # only this PR's folder on pr-visuals.
            python3 bench/visual/publish.py publish --montage /tmp/visual-publish-selected --pr "$PR" \
              --remote "https://github.com/${GITHUB_REPOSITORY}.git"
          fi

  visual-comment:
    name: visual-comment
    needs: [scope, visual-smoke, visual-publish]
    # A comment even when the gate failed; none for a fork (read-only token), a cancelled run
    # or a label that is not the gate's.
    if: "!cancelled() && needs.visual-smoke.result != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: bench/visual
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          name: visual-montage
          path: /tmp/visual-data

      - name: Render the comment with the base branch's renderer
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ needs.visual-smoke.outputs.artifact-url }}
          PUBLISHED: ${{ needs.visual-publish.outputs.published }}
          VISUAL_CHANGE_EXPECTED: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change-expected') }}
        run: |
          # Images only when the montages reached pr-visuals. The data is untrusted; the renderer escapes it.
          MODE=artifact; [ "$PUBLISHED" = "true" ] && MODE=branch
          if [ -f bench/visual/visual_comment.py ] && [ -d /tmp/visual-data ] && \
             python3 bench/visual/visual_comment.py --out /tmp/visual-data --mode "$MODE" --repo "$REPO" --pr "$PR" \
               --run-url "$RUN_URL" --artifact-url "$ARTIFACT_URL" --md /tmp/comment.md --verdict /tmp/verdict.json > /dev/null; then
            echo "rendered"
          else
            rm -f /tmp/comment.md
            echo "::notice::no renderer on the base branch, or it failed: posting the fixed text"
          fi

      - name: Publish sticky PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          RAN: ${{ needs.visual-smoke.outputs.run }}
          RESULT: ${{ needs.visual-smoke.result }}
          BASELINE: ${{ needs.scope.outputs.baseline }}
          PUBLISHED: ${{ needs.visual-publish.outputs.published }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- visual-smoke -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // A rendered file is the base branch's renderer's output. Without one (the base has no renderer yet,
            // or the job died) the comment is a fixed text that carries no data from the pull request;
            // the job summary of the run has the table.
            let body = fs.existsSync('/tmp/comment.md') ? fs.readFileSync('/tmp/comment.md', 'utf8')
              : `${marker}\n### ⚠️ Visual smoke: ${process.env.RESULT === 'success' ? 'passed' : 'see the run'}\n\nThe table for \`${context.payload.pull_request.head.sha.slice(0, 10)}\` is in the job summary of ${runUrl}.\n`;
            // The trusted older base renderer puts fix screenshots in collapsed
            // details. Open that section so every shipped fix is visible in the
            // CI comment; leave the full regression table collapsed as rendered.
            if (process.env.PUBLISHED === 'true') {
              const start = body.indexOf('#### Fix proof');
              const end = body.indexOf('#### Regression check', start);
              if (start >= 0 && end > start) {
                body = body.slice(0, start) + body.slice(start, end).replaceAll('<details><summary>', '<details open><summary>') + body.slice(end);
              }
              body = body.replace('<details><summary>Core set montages', '<details open><summary>Core set montages');
            }
            // A baseline run adds a fixed section pointing to the full candidate artifact.
            const candidate = process.env.BASELINE === 'true'
              ? `\n\n<details open><summary>🧭 New baseline candidate</summary>\n\nThis pull request got the baseline run: every page of \`bench/visual/spec.json\` was captured at its own ranges. The full candidate is the \`visual-baseline-candidate\` artifact of ${runUrl}; only bounded inline review images were published, and the candidate was not accepted as a baseline.\n\n</details>\n`
              : '';
            const text = body + candidate;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: text });
            } else if (process.env.RAN !== 'false') {
              // A docs- or CI-only change gets no new comment; an existing one is updated to say it was skipped.
              await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
            }
