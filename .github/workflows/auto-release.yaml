name: Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "docs/observability.md"
      - "README.md"
  workflow_dispatch:

# Releases queue; they never cancel each other. Merging a second pull request
# while a release is still running used to cancel that run, so a tag could be
# cut with no metadata pull request behind it, or a merge could get no release
# at all, and CHANGELOG sections then drifted from what each tag contained.
# Runs now stack in merge order and each cuts its own version from the
# [Unreleased] section as it stood at its own commit.
concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      next_version: ${{ steps.check.outputs.next_version }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
      release_sha: ${{ steps.reread.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Re-read main and its tags
        id: reread
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This run may have waited behind an earlier release. Take main and
          # the tags as they are now, so the version is computed after any
          # metadata pull request that landed while this run was queued.
          # The checkout keeps no credentials; a credential helper hands git the
          # read token from the environment for this one fetch.
          # shellcheck disable=SC2016 # git expands GIT_AUTH_TOKEN when it runs the helper
          GIT_AUTH_TOKEN="${READ_TOKEN}" git -c credential.helper= -c 'credential.helper=!f() { test "$1" = get && printf "username=x-access-token\npassword=%s\n" "${GIT_AUTH_TOKEN}"; }; f' fetch --force --tags origin main
          git checkout --detach origin/main
          echo "releasing from $(git rev-parse --short HEAD)"
          # Validation, tagging and publishing all use this commit, so the
          # release is built from the same main its version was computed from.
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine version bump
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -1 || echo "v0.0.0")
          # Tag names reach later jobs as outputs and are used in git and shell
          # commands there; refuse anything that is not plain vMAJOR.MINOR.PATCH.
          SEMVER_TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "${LATEST_TAG}" =~ ${SEMVER_TAG_RE} ]]; then
            echo "::error::latest release tag '${LATEST_TAG}' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          LATEST_VERSION="${LATEST_TAG#v}"
          CHART_VERSION="$(awk -F: '/^version:/ {v=$2; gsub(/[ "]/, "", v); print v; exit}' charts/loki-vl-proxy/Chart.yaml)"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $LATEST_TAG"

          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")
          FILES_CHANGED=$(git -c core.quotepath=false diff --name-only "${LATEST_TAG}..HEAD" 2>/dev/null || git -c core.quotepath=false diff --name-only HEAD~1)

          if echo "${HEAD_COMMIT_MSG:-}" | grep -qE '^docs: sync release metadata for v[0-9]'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping metadata sync commit"
            exit 0
          fi

          # Release only when something that ships changed since the last tag:
          # the binary, image, chart, dashboards or alert rules. Bench, tests,
          # the conformance registry, scripts, workflows, compose files,
          # examples, docs and the website never cut a release. An empty list
          # or any error counts as shipping, so the checks below stay the
          # deciding gate in that case.
          #
          # The metadata sync that follows every release rewrites the chart
          # version only. While the chart still carries the released version,
          # that edit says nothing about what changed since the tag. A chart
          # ahead of the tag is a deliberate release request, handled below.
          SCOPE_FILES="${FILES_CHANGED}"
          CHART_EDITS=$(git diff -U0 "${LATEST_TAG}..HEAD" -- charts/loki-vl-proxy/Chart.yaml 2>/dev/null \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' | grep -vE '^[+-](version|appVersion):' || true)
          if [ "${CHART_VERSION}" = "${LATEST_VERSION}" ] && [ -z "${CHART_EDITS}" ]; then
            SCOPE_FILES=$(printf '%s\n' "${FILES_CHANGED}" | grep -vx 'charts/loki-vl-proxy/Chart.yaml' || true)
          fi
          if [ -n "${FILES_CHANGED}" ] && [ -z "${SCOPE_FILES}" ]; then
            SHIPS="false"
          else
            SHIPS=$(printf '%s\n' "${SCOPE_FILES}" | python3 scripts/ci/change_scope.py --files-from - --ships \
              | sed -n 's/^ships=//p' || true)
            SHIPS="${SHIPS:-true}"
          fi

          if [ "${SHIPS}" = "false" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Nothing that ships changed since ${LATEST_TAG}; skipping release"
            exit 0
          fi

          UNRELEASED_LINES=$(awk '/^## \[Unreleased\]/{f=1; next} /^## \[/{if(f) exit} f && /^[[:space:]]*[^[:space:]]/' CHANGELOG.md | wc -l | tr -d ' ')
          if [ "${UNRELEASED_LINES}" -eq 0 ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG [Unreleased] section is empty; skipping release (add changelog entries to enable)"
            exit 0
          fi

          if echo "${CHART_VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            MAX_VERSION="$(printf '%s\n%s\n' "${LATEST_VERSION}" "${CHART_VERSION}" | sort -V | tail -1)"
            if [ "${MAX_VERSION}" = "${CHART_VERSION}" ] && [ "${CHART_VERSION}" != "${LATEST_VERSION}" ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "next_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
              echo "Chart version override detected: ${CHART_VERSION} (latest tag is ${LATEST_VERSION})"
              exit 0
            fi
          fi

          BUMP="none"
          PR_LABELS=""
          PR_LABELS_LOWER=""
          PR_TITLE=""
          PR_CHANGED_FILES=0
          PR_ADDITIONS=0
          PR_DELETIONS=0
          PR_TOTAL_CHURN=0
          # The squash-merge subject ends with "(#N)"; the body may name other PRs.
          PR_NUMBER="$(printf '%s\n' "${HEAD_COMMIT_MSG:-}" | head -1 | grep -oE '\(#[0-9]+\)$' | tr -dc '0-9' || true)"

          if [ -n "${PR_NUMBER}" ]; then
            PR_JSON="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}" || true)"
            if [ -n "$PR_JSON" ]; then
              PR_LABELS="$(echo "$PR_JSON" | jq -r '.labels[]?.name' || true)"
              PR_LABELS_LOWER="$(echo "$PR_LABELS" | tr '[:upper:]' '[:lower:]')"
              PR_TITLE="$(echo "$PR_JSON" | jq -r '.title // ""' || true)"
              PR_CHANGED_FILES="$(echo "$PR_JSON" | jq -r '.changed_files // 0' || echo 0)"
              PR_ADDITIONS="$(echo "$PR_JSON" | jq -r '.additions // 0' || echo 0)"
              PR_DELETIONS="$(echo "$PR_JSON" | jq -r '.deletions // 0' || echo 0)"
              PR_TOTAL_CHURN=$((PR_ADDITIONS + PR_DELETIONS))
              echo "PR #${PR_NUMBER} labels: ${PR_LABELS:-<none>}"
              echo "PR #${PR_NUMBER} title: ${PR_TITLE:-<none>}"
              echo "PR #${PR_NUMBER} changed_files=${PR_CHANGED_FILES} additions=${PR_ADDITIONS} deletions=${PR_DELETIONS} churn=${PR_TOTAL_CHURN}"

              if echo "$PR_LABELS_LOWER" | grep -qE '^no-release$'; then
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                echo "PR has no-release label; skipping release"
                exit 0
              fi

              if echo "$PR_LABELS_LOWER" | grep -qE '^release:major$'; then
                BUMP="major"
              elif echo "$PR_LABELS_LOWER" | grep -qE '^release:minor$'; then
                BUMP="minor"
              elif echo "$PR_LABELS_LOWER" | grep -qE '^release:patch$'; then
                BUMP="patch"
              elif echo "$PR_LABELS_LOWER" | grep -qE '^(breaking-change)$'; then
                BUMP="major"
              elif echo "$PR_LABELS_LOWER" | grep -qE '^(feature)$'; then
                BUMP="minor"
              elif echo "$PR_LABELS_LOWER" | grep -qE '^(bugfix|performance)$'; then
                BUMP="patch"
              fi

              # Size- and scope-aware automatic promotion:
              # large runtime-impacting PRs should bump at least minor.
              if [ "$BUMP" != "major" ]; then
                XL_SIZE="false"
                RUNTIME_SCOPE="false"
                LARGE_DIFF="false"

                if echo "$PR_LABELS_LOWER" | grep -qE '^size/(xl|xxl)$'; then
                  XL_SIZE="true"
                fi

                if echo "$PR_LABELS_LOWER" | grep -qE '^scope/(proxy|cache|translator|cli|helm|api)$'; then
                  RUNTIME_SCOPE="true"
                fi

                if [ "${PR_CHANGED_FILES}" -ge 20 ] || [ "${PR_TOTAL_CHURN}" -ge 1200 ]; then
                  LARGE_DIFF="true"
                fi

                if { [ "${XL_SIZE}" = "true" ] && [ "${RUNTIME_SCOPE}" = "true" ]; } || [ "${LARGE_DIFF}" = "true" ]; then
                  if [ "$BUMP" = "none" ] || [ "$BUMP" = "patch" ]; then
                    BUMP="minor"
                    echo "Auto-promoted bump to minor based on PR size/scope heuristic"
                  fi
                fi
              fi
            fi
          fi

          if [ "$BUMP" = "none" ]; then
            if echo "$COMMITS" | grep -qE 'BREAKING CHANGE|^feat.*!:|^fix.*!:'; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qE '^feat(\(|:)'; then
              BUMP="minor"
            elif echo "$COMMITS" | grep -qE '^(fix|perf|refactor|revert)(\(|:)'; then
              BUMP="patch"
            fi
          fi

          if [ "$BUMP" = "none" ]; then
            BUMP="patch"
            echo "No explicit release signal found; defaulting to patch bump for non-doc/ci changes"
          fi

          CURRENT="${LATEST_TAG#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          case "$BUMP" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac

          # Releases queue rather than cancel, so an earlier run may already have
          # cut this version while this one waited. Re-reading the tags above
          # normally moves LATEST_TAG past it; this is the belt-and-braces check
          # that two runs can never publish the same tag.
          if git rev-parse -q --verify "refs/tags/v${MAJ}.${MIN}.${PAT}" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v${MAJ}.${MIN}.${PAT} already exists; an earlier queued run cut it. Skipping."
            exit 0
          fi

          if ! [[ "${MAJ}.${MIN}.${PAT}" =~ ${SEMVER_RE} ]]; then
            echo "::error::computed version '${MAJ}.${MIN}.${PAT}' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "next_version=${MAJ}.${MIN}.${PAT}" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP -> v${MAJ}.${MIN}.${PAT}"

  validate-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_count: ${{ steps.metrics.outputs.tests }}
      coverage_pct: ${{ steps.metrics.outputs.coverage_pct }}
      code_lines: ${{ steps.metrics.outputs.code_lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Verify unreleased changelog section exists
        run: |
          set -euo pipefail
          chmod +x scripts/ci/extract_changelog_section.sh
          scripts/ci/extract_changelog_section.sh Unreleased CHANGELOG.md > /tmp/release-section.md
          test -s /tmp/release-section.md
          if ! grep -qE '^(### |- )' /tmp/release-section.md; then
            echo "Unreleased changelog section is empty"
            exit 1
          fi

      - name: Run release validation tests
        run: go test ./... -count=1

      - name: Collect validation metrics
        id: metrics
        run: |
          set -euo pipefail
          # One run gives both numbers; a failing test is named instead of failing the step silently.
          if ! go test ./... -count=1 -json -coverprofile=coverage.out > test-results.json 2> test-stderr.log; then
            echo "::error::unit tests failed while collecting release metrics"
            jq -r 'select(.Action=="fail" and .Test != null) | "\(.Package) \(.Test)"' test-results.json | sort -u
            jq -r 'select(.Action=="output" and .Test != null) | .Output' test-results.json | grep -E -- '--- FAIL|_test\.go:[0-9]+:' | head -50 || true
            tail -20 test-stderr.log || true
            exit 1
          fi
          TESTS=$(jq -r 'select(.Action=="pass" and .Test != null) | .Test' test-results.json | wc -l | tr -d ' ')
          COV=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          CODE_LINES=$(git ls-files '*.go' | xargs wc -l | tail -1 | awk '{print $1}')
          {
            echo "tests=${TESTS}"
            echo "coverage_pct=${COV}"
            echo "code_lines=${CODE_LINES}"
          } >> "$GITHUB_OUTPUT"

      - name: Helm lint
        run: helm lint charts/loki-vl-proxy/

  publish-release:
    needs: [prepare-release, validate-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      HAS_RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' }}
      HAS_GHCR_PACKAGE_ADMIN_TOKEN: ${{ secrets.GHCR_PACKAGE_ADMIN_TOKEN != '' }}
      RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
    steps:
      - name: Refuse to publish from other refs
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *) echo "::error::releases are published only from main or a v* tag"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          # The checkout only reads. The bot token is handed to the one step that
          # pushes, through a credential helper, and never lands in the git config.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          # No restored cache in the job that publishes release artifacts: nothing
          # a pull request or branch run saved can reach what ships.
          cache: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v4.1.4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Extract release metadata
        id: meta
        env:
          NEXT_VERSION: ${{ needs.prepare-release.outputs.next_version }}
          LATEST_TAG: ${{ needs.prepare-release.outputs.latest_tag }}
        run: |
          set -euo pipefail
          # Everything below, and every later step, takes the version and tags
          # from here, so they are checked before they are used anywhere.
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+$'
          SEMVER_TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "${NEXT_VERSION}" =~ ${SEMVER_RE} ]]; then
            echo "::error::release version '${NEXT_VERSION}' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          if ! [[ "${LATEST_TAG}" =~ ${SEMVER_TAG_RE} ]]; then
            echo "::error::previous release tag '${LATEST_TAG}' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          VERSION="${NEXT_VERSION}"
          TAG="v${VERSION}"
          PREV_TAG="${LATEST_TAG}"
          chmod +x scripts/ci/extract_changelog_section.sh
          chmod +x scripts/ci/materialize_unreleased.sh
          NOTES_FILE="$(mktemp)"
          SECTION_FILE="$(mktemp)"
          scripts/ci/materialize_unreleased.sh "${VERSION}" "$(date +%Y-%m-%d)" CHANGELOG.md
          scripts/ci/extract_changelog_section.sh "${VERSION}" CHANGELOG.md > "$SECTION_FILE"
          git checkout -- CHANGELOG.md
          cat "$SECTION_FILE" > "$NOTES_FILE"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prev_tag=${PREV_TAG}"
            echo "build_time=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "${RELEASE_SHA}")"
            echo "notes_file=${NOTES_FILE}"
          } >> "$GITHUB_OUTPUT"
      - name: Create release tag
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          WORKFLOW_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to tag '${TAG}': not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          # Run git against github.com with a token that a credential helper reads
          # from the environment for this one command. The token is never put in
          # a URL, in the git config or in a derived value that needs masking.
          git_as() {
            local token="$1"
            shift
            # shellcheck disable=SC2016 # git expands GIT_AUTH_TOKEN when it runs the helper
            GIT_AUTH_TOKEN="${token}" git -c credential.helper= -c 'credential.helper=!f() { test "$1" = get && printf "username=x-access-token\npassword=%s\n" "${GIT_AUTH_TOKEN}"; }; f' "$@"
          }
          PRIMARY_TOKEN="${RELEASE_PR_TOKEN:-$WORKFLOW_TOKEN}"
          PRIMARY_ACTOR="RELEASE_PR_TOKEN"
          if [ -z "${RELEASE_PR_TOKEN:-}" ]; then
            PRIMARY_ACTOR="GITHUB_TOKEN"
          fi
          git_as "${PRIMARY_TOKEN}" fetch --tags origin
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
            if [ "$(git rev-list -n1 "${TAG}")" != "${RELEASE_SHA}" ]; then
              echo "::error::tag ${TAG} exists on another commit"
              exit 1
            fi
          else
            git tag "${TAG}" "${RELEASE_SHA}"
            if ! git_as "${PRIMARY_TOKEN}" push origin "refs/tags/${TAG}"; then
              if [ "${PRIMARY_ACTOR}" = "RELEASE_PR_TOKEN" ]; then
                echo "::warning::Tag push with RELEASE_PR_TOKEN failed; retrying with GITHUB_TOKEN"
                echo "::warning::The tag ruleset allows only the release bot to create v* tags, so this retry is expected to be rejected unless the ruleset changed"
                git_as "${WORKFLOW_TOKEN}" push origin "refs/tags/${TAG}"
              else
                echo "::error::Tag push failed with GITHUB_TOKEN. Creating v* tags needs RELEASE_PR_TOKEN (the release bot); GITHUB_TOKEN is rejected by the tag ruleset."
                exit 1
              fi
            fi
          fi

      - name: Build release binaries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "dev" ]; then
            echo "refusing to build release binaries with VERSION='${VERSION}'" >&2
            exit 1
          fi
          REVISION="${RELEASE_SHA}"
          mkdir -p dist
          # -trimpath and a build time taken from the release commit make the
          # binaries reproducible from the tag (see SECURITY.md).
          for GOOS_GOARCH in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${GOOS_GOARCH%/*}"
            GOARCH="${GOOS_GOARCH#*/}"
            OUT="dist/loki-vl-proxy-${GOOS}-${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.revision=${REVISION} -X main.buildTime=${BUILD_TIME}" \
              -o "$OUT" ./cmd/proxy
          done
          cd dist && sha256sum loki-vl-proxy-* > checksums.txt

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Generate SBOMs for the release binaries
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          # One SPDX JSON document per binary. checksums.txt was written before
          # this step, so the SBOM files are never listed in it.
          for BIN in dist/loki-vl-proxy-linux-amd64 dist/loki-vl-proxy-linux-arm64 \
                     dist/loki-vl-proxy-darwin-amd64 dist/loki-vl-proxy-darwin-arm64; do
            "${SYFT}" scan "file:${BIN}" -o "spdx-json=${BIN}.spdx.json" -q
          done

      - name: Attest binary build provenance
        id: attest-binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Attest SBOM for linux/amd64
        id: attest-sbom-linux-amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/loki-vl-proxy-linux-amd64
          sbom-path: dist/loki-vl-proxy-linux-amd64.spdx.json

      - name: Attest SBOM for linux/arm64
        id: attest-sbom-linux-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/loki-vl-proxy-linux-arm64
          sbom-path: dist/loki-vl-proxy-linux-arm64.spdx.json

      - name: Attest SBOM for darwin/amd64
        id: attest-sbom-darwin-amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/loki-vl-proxy-darwin-amd64
          sbom-path: dist/loki-vl-proxy-darwin-amd64.spdx.json

      - name: Attest SBOM for darwin/arm64
        id: attest-sbom-darwin-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/loki-vl-proxy-darwin-arm64
          sbom-path: dist/loki-vl-proxy-darwin-arm64.spdx.json

      - name: Sign the release checksums
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Package Helm chart
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          helm package charts/loki-vl-proxy \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination dist

      - name: Login Helm to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_PASSWORD}" | helm registry login ghcr.io \
            --username "${REGISTRY_USER}" \
            --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.HAS_DOCKERHUB == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker image tags
        id: image-tags
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAMES="ghcr.io/${OWNER_LC}/loki-vl-proxy"
          if [ "${HAS_DOCKERHUB}" = "true" ]; then
            IMAGE_NAMES="${IMAGE_NAMES},docker.io/reliablyobserve/loki-vl-proxy"
          fi
          {
            echo "ghcr_image=ghcr.io/${OWNER_LC}/loki-vl-proxy"
            echo "image_names=${IMAGE_NAMES}"
            echo "tags<<EOF"
            echo "ghcr.io/${OWNER_LC}/loki-vl-proxy:${VERSION}"
            echo "ghcr.io/${OWNER_LC}/loki-vl-proxy:latest"
            if [ "${HAS_DOCKERHUB}" = "true" ]; then
              echo "docker.io/reliablyobserve/loki-vl-proxy:${VERSION}"
              echo "docker.io/reliablyobserve/loki-vl-proxy:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The image is pushed by digest only. The version tags are created after the
      # image is signed and attested (see "Publish the image tags").
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,"name=${{ steps.image-tags.outputs.image_names }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ needs.prepare-release.outputs.release_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Sign the container image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          GHCR_IMAGE: ${{ steps.image-tags.outputs.ghcr_image }}
        run: |
          set -euo pipefail
          # Sign by digest, never by tag. The index digest is the same in every
          # registry the build pushed to.
          cosign sign --yes "${GHCR_IMAGE}@${IMAGE_DIGEST}"
          if [ "${HAS_DOCKERHUB}" = "true" ]; then
            cosign sign --yes "docker.io/reliablyobserve/loki-vl-proxy@${IMAGE_DIGEST}"
          fi

      - name: Attest container image provenance (GHCR)
        id: attest-image-ghcr
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image-tags.outputs.ghcr_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest container image provenance (Docker Hub)
        id: attest-image-dockerhub
        if: ${{ env.HAS_DOCKERHUB == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/reliablyobserve/loki-vl-proxy
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Publish the image tags
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.image-tags.outputs.tags }}
        run: |
          set -euo pipefail
          # Tags point at the already signed and attested index digest.
          while IFS= read -r TAG_REF; do
            [ -n "${TAG_REF}" ] || continue
            docker buildx imagetools create --tag "${TAG_REF}" "${TAG_REF%:*}@${IMAGE_DIGEST}"
            PUBLISHED="$(docker buildx imagetools inspect "${TAG_REF}" --format '{{.Manifest.Digest}}')"
            if [ "${PUBLISHED}" != "${IMAGE_DIGEST}" ]; then
              echo "::error::${TAG_REF} resolves to ${PUBLISHED}, expected ${IMAGE_DIGEST}"
              exit 1
            fi
          done <<< "${TAGS}"

      - name: Publish Helm chart to GHCR
        id: chart_ghcr
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if ! PUSH_OUT="$(helm push "dist/loki-vl-proxy-${VERSION}.tgz" "oci://ghcr.io/${OWNER_LC}/charts" 2>&1)"; then
            echo "${PUSH_OUT}"
            exit 1
          fi
          echo "${PUSH_OUT}"
          # helm prints "Pushed: <ref>:<tag>" and "Digest: sha256:<hex>" (to stderr in Helm 4).
          DIGEST="$(printf '%s\n' "${PUSH_OUT}" | sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' | head -n1)"
          PUSHED="$(printf '%s\n' "${PUSH_OUT}" | sed -n 's/^Pushed: //p' | head -n1)"
          if [ -z "${DIGEST}" ] || [ -z "${PUSHED}" ]; then
            echo "::error::could not read the pushed chart reference and digest from helm output"
            exit 1
          fi
          REF="${PUSHED%:*}"
          {
            echo "digest=${DIGEST}"
            echo "ref=${REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Sign the Helm chart (GHCR)
        env:
          CHART_REF: ${{ steps.chart_ghcr.outputs.ref }}
          CHART_DIGEST: ${{ steps.chart_ghcr.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${CHART_REF}@${CHART_DIGEST}"

      - name: Sign the Helm chart archive
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # The archive attached to the release gets its own keyless signature
          # bundle, so it can be verified with cosign verify-blob and no registry.
          cosign sign-blob --yes --bundle "dist/loki-vl-proxy-${VERSION}.tgz.sigstore.json" "dist/loki-vl-proxy-${VERSION}.tgz"

      - name: Attest Helm chart provenance
        id: attest-chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/loki-vl-proxy-*.tgz

      - name: Ensure GHCR Helm chart package is public
        env:
          GH_TOKEN: ${{ secrets.GHCR_PACKAGE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          OWNER_LC="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          PKG="charts%2Floki-vl-proxy"
          if [ "${HAS_GHCR_PACKAGE_ADMIN_TOKEN}" != "true" ]; then
            echo "::warning::GHCR_PACKAGE_ADMIN_TOKEN not configured. Helm chart visibility cannot be enforced automatically."
            echo "::warning::Set package visibility to public manually: ghcr.io/${OWNER_LC}/charts/loki-vl-proxy"
            exit 0
          fi
          gh api -X PATCH "/orgs/${OWNER}/packages/container/${PKG}/visibility" -f visibility=public >/dev/null
          echo "Ensured public visibility for ghcr.io/${OWNER_LC}/charts/loki-vl-proxy"

      - name: Collect provenance bundles, image SBOMs and digests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GHCR_IMAGE: ${{ steps.image-tags.outputs.ghcr_image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          CHART_GHCR_REF: ${{ steps.chart_ghcr.outputs.ref }}
          CHART_GHCR_DIGEST: ${{ steps.chart_ghcr.outputs.digest }}
          BUNDLE_BINARIES: ${{ steps.attest-binaries.outputs.bundle-path }}
          BUNDLE_CHART: ${{ steps.attest-chart.outputs.bundle-path }}
          BUNDLE_IMAGE_GHCR: ${{ steps.attest-image-ghcr.outputs.bundle-path }}
          BUNDLE_IMAGE_DH: ${{ steps.attest-image-dockerhub.outputs.bundle-path }}
          BUNDLE_SBOM_LINUX_AMD64: ${{ steps.attest-sbom-linux-amd64.outputs.bundle-path }}
          BUNDLE_SBOM_LINUX_ARM64: ${{ steps.attest-sbom-linux-arm64.outputs.bundle-path }}
          BUNDLE_SBOM_DARWIN_AMD64: ${{ steps.attest-sbom-darwin-amd64.outputs.bundle-path }}
          BUNDLE_SBOM_DARWIN_ARM64: ${{ steps.attest-sbom-darwin-arm64.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # The SBOM BuildKit attached to the pushed index, per platform. Read by
          # digest, so it is the document of the image that was signed and attested.
          IMAGE_SBOM_JSON="${RUNNER_TEMP}/image-sbom.json"
          for ATTEMPT in 1 2 3; do
            if docker buildx imagetools inspect "${GHCR_IMAGE}@${IMAGE_DIGEST}" --format '{{ json .SBOM }}' > "${IMAGE_SBOM_JSON}"; then
              break
            fi
            if [ "${ATTEMPT}" = 3 ]; then
              echo "::error::could not read the image SBOM from ${GHCR_IMAGE}@${IMAGE_DIGEST}"
              exit 1
            fi
            sleep $((ATTEMPT * 5))
          done
          export IMAGE_SBOM_JSON
          bash scripts/ci/collect_release_assets.sh

      - name: Append verification details to the release notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES_FILE: ${{ steps.meta.outputs.notes_file }}
          GHCR_IMAGE: ${{ steps.image-tags.outputs.ghcr_image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          CHART_GHCR_REF: ${{ steps.chart_ghcr.outputs.ref }}
          CHART_GHCR_DIGEST: ${{ steps.chart_ghcr.outputs.digest }}
        run: |
          set -euo pipefail
          F='```'
          ID_RE='^https://github\.com/'"${GITHUB_REPOSITORY}"'/\.github/workflows/(auto-release|release)\.yaml@refs/(heads/main|tags/v.+)$'
          DH_IMAGE=""
          if [ "${HAS_DOCKERHUB}" = "true" ]; then
            DH_IMAGE="docker.io/reliablyobserve/loki-vl-proxy"
          fi
          {
            echo
            echo "## Verify this release"
            echo
            echo "Container image (multi-arch index digest):"
            echo
            echo "- \`${GHCR_IMAGE}@${IMAGE_DIGEST}\`"
            if [ -n "${DH_IMAGE}" ]; then
              echo "- \`${DH_IMAGE}@${IMAGE_DIGEST}\`"
            fi
            echo
            echo "Helm chart (OCI digest):"
            echo
            echo "- \`${CHART_GHCR_REF}@${CHART_GHCR_DIGEST}\`"
            echo
            echo "Verify the image signature and build provenance, then the release checksums:"
            echo
            echo "${F}sh"
            echo "cosign verify ${GHCR_IMAGE}@${IMAGE_DIGEST} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '${ID_RE}'"
            echo "gh attestation verify oci://${GHCR_IMAGE}@${IMAGE_DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo "cosign verify-blob --bundle checksums.txt.sigstore.json \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '${ID_RE}' checksums.txt"
            echo "sha256sum -c checksums.txt --ignore-missing"
            echo "gh attestation verify loki-vl-proxy-linux-amd64 --repo ${GITHUB_REPOSITORY}"
            echo "${F}"
            echo
            echo "The release also attaches the evidence for checking it without the GitHub attestation API: \`loki-vl-proxy-${VERSION}.intoto.jsonl\` (build provenance of the binaries, the chart and the image, and the SBOM attestation of each binary, as one Sigstore bundle per line), \`loki-vl-proxy-${VERSION}.tgz.sigstore.json\` (cosign signature of the chart archive), \`loki-vl-proxy-image-${VERSION}-linux-<arch>.spdx.json\` (the SBOM of the image for each platform) and \`image-digests.txt\` (the image and chart references above). For example:"
            echo
            echo "${F}sh"
            echo "gh attestation verify loki-vl-proxy-linux-amd64 --bundle loki-vl-proxy-${VERSION}.intoto.jsonl --repo ${GITHUB_REPOSITORY}"
            echo "cosign verify-blob --bundle loki-vl-proxy-${VERSION}.tgz.sigstore.json \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '${ID_RE}' loki-vl-proxy-${VERSION}.tgz"
            echo "${F}"
            echo
            echo "Every signature and attestation is recorded in Sigstore's public transparency log. The full procedure, including reproducing a binary from the tag, is in [SECURITY.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/SECURITY.md#verifying-releases)."
          } >> "${NOTES_FILE}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3  # zizmor: ignore[superfluous-actions] softprops/action-gh-release attaches the signed assets; replacing it with gh release is a separate change
        # The SPDX SBOMs of the binaries (dist/loki-vl-proxy-<os>-<arch>.spdx.json)
        # are matched by the binary globs below, so they are not listed a second
        # time. None of the other globs overlaps another.
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.meta.outputs.notes_file }}
          files: |
            dist/loki-vl-proxy-linux-*
            dist/loki-vl-proxy-darwin-*
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/loki-vl-proxy-*.tgz
            dist/loki-vl-proxy-*.tgz.sigstore.json
            dist/loki-vl-proxy-*.intoto.jsonl
            dist/loki-vl-proxy-image-*.spdx.json
            dist/image-digests.txt

      - name: Prepare release metadata branch
        id: metadata
        env:
          METADATA_PUSH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' && secrets.RELEASE_PR_TOKEN || github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TEST_COUNT: ${{ needs.validate-release.outputs.test_count }}
          COVERAGE_PCT: ${{ needs.validate-release.outputs.coverage_pct }}
          CODE_LINES: ${{ needs.validate-release.outputs.code_lines }}
        run: |
          set -euo pipefail
          if [ "${HAS_RELEASE_PR_TOKEN}" != "true" ]; then
            echo "::warning::RELEASE_PR_TOKEN is not configured. The metadata branch is pushed with the job token and no pull request is opened for it."
          fi
          chmod +x scripts/ci/sync_release_metadata.sh
          scripts/ci/sync_release_metadata.sh "${VERSION}" "$(date +%Y-%m-%d)" "${TEST_COUNT}" "${COVERAGE_PCT}" "${CODE_LINES}" . "${GITHUB_REPOSITORY}"

          CHART_VERSION="$(awk -F: '/^version:/ {v=$2; gsub(/[ "]/, "", v); print v; exit}' charts/loki-vl-proxy/Chart.yaml)"
          CHART_APP_VERSION="$(awk -F: '/^appVersion:/ {v=$2; gsub(/[ "]/, "", v); print v; exit}' charts/loki-vl-proxy/Chart.yaml)"
          if [ "${CHART_VERSION}" != "${VERSION}" ] || [ "${CHART_APP_VERSION}" != "${VERSION}" ]; then
            echo "::error::Chart.yaml version/appVersion mismatch after metadata sync: version=${CHART_VERSION} appVersion=${CHART_APP_VERSION} expected=${VERSION}"
            exit 1
          fi

          if git diff --quiet --exit-code -- CHANGELOG.md README.md docs/observability.md charts/loki-vl-proxy/Chart.yaml; then
            echo "release metadata already synced"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="release/metadata-v${VERSION}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          # The commit is made through GitHub's API (createCommitOnBranch), which
          # signs it: the metadata PR then passes the signed-commit rule like any
          # other PR, with no admin bypass. A local git commit here is unsigned.
          FILES="$(git diff --name-only -- CHANGELOG.md README.md docs/observability.md charts/loki-vl-proxy/Chart.yaml)"
          chmod +x scripts/ci/commit_via_api.sh
          # shellcheck disable=SC2086 # FILES is a newline-separated list of fixed repo paths
          if ! METADATA_SHA="$(GH_TOKEN="${METADATA_PUSH_TOKEN}" scripts/ci/commit_via_api.sh "${GITHUB_REPOSITORY}" "${BRANCH}" "$(git rev-parse HEAD)" "docs: sync release metadata for v${VERSION}" ${FILES})"; then
            echo "::warning::Unable to push release metadata branch ${BRANCH}. Skipping metadata PR automation for this release."
            echo "::warning::Verify RELEASE_PR_TOKEN permissions (contents:write and pull_requests:write) to re-enable metadata sync automation."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release metadata commit ${METADATA_SHA} on ${BRANCH} (signed by GitHub)"

      - name: Open the release metadata pull request and arm auto-merge
        if: steps.metadata.outputs.has_changes == 'true'
        env:
          # The bot token is given to this step only. A pull request opened with
          # the job's own token does not start the pull_request workflows, so it
          # could never pass its required checks.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # The release itself is already published: a problem here warns and the
          # run goes on, so the metadata pull request can be opened by hand.
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::release version '${VERSION}' is not a plain semver; skipping the metadata pull request"
            exit 0
          fi
          BRANCH="release/metadata-v${VERSION}"
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::RELEASE_PR_TOKEN is not configured; open the pull request from ${BRANCH} to main by hand and enable auto-merge"
            echo "Release metadata v${VERSION}: branch \`${BRANCH}\` is pushed, no pull request was opened (RELEASE_PR_TOKEN is not configured)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          open_number() {
            gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --base main --state open \
              --json number --jq '.[0].number // empty'
          }
          NUMBER="$(open_number)"
          if [ -z "${NUMBER}" ]; then
            BODY="$(printf '%s\n' \
              "Sync release metadata files for v${VERSION} after the automated release:" \
              "" \
              "- CHANGELOG materialization" \
              "- Helm chart version and appVersion" \
              "- README release badges")"
            if ! gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${BRANCH}" \
              --title "docs: sync release metadata for v${VERSION}" --body "${BODY}"; then
              echo "::warning::could not open the pull request from ${BRANCH}; open it by hand"
              exit 0
            fi
            NUMBER="$(open_number)"
          fi
          if [ -z "${NUMBER}" ]; then
            echo "::warning::no open pull request found for ${BRANCH}; open it by hand"
            exit 0
          fi
          # Auto-merge merges the pull request by itself once the maintainer
          # approves it and the required checks pass. Nothing merges before that.
          if gh pr merge "${NUMBER}" --repo "${GITHUB_REPOSITORY}" --auto --squash; then
            echo "Release metadata v${VERSION}: pull request #${NUMBER} is open with auto-merge armed; it merges after the maintainer's approval and the required checks." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not arm auto-merge on pull request #${NUMBER}; enable it by hand"
            echo "Release metadata v${VERSION}: pull request #${NUMBER} is open, auto-merge could not be armed." >> "$GITHUB_STEP_SUMMARY"
          fi
