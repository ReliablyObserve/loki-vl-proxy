name: Security PR

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "docs/observability.md"
      - "charts/loki-vl-proxy/Chart.yaml"
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-static:
    name: Security / static
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect \
            --source . \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
        if: ${{ always() && hashFiles('gitleaks.sarif') != '' }}
        with:
          sarif_file: gitleaks.sarif

      - name: Gosec
        run: |
          # gosec v2.29.0 pins golang.org/x/tools v0.49.0, which cannot read Go 1.27.2's
          # standard-library export data ("export data version 5 is greater than maximum
          # supported version 4") and reports every package as having type errors. Build it
          # with x/tools v0.52.0 until a gosec release carries a newer x/tools.
          tooldir="$(mktemp -d)"
          (cd "$tooldir" && go mod init gosec-build >/dev/null 2>&1 \
            && go get github.com/securego/gosec/v2/cmd/gosec@v2.29.0 golang.org/x/tools@v0.52.0 \
            && go build -o "$(go env GOPATH)/bin/gosec" github.com/securego/gosec/v2/cmd/gosec)
          # Start with the higher-signal rule set and burn down the exclusions over time.
          # G118/G704/G705 (taint analysis, added after v2.22) are excluded on review:
          #   G704 flags cmd/healthcheck fetching http://localhost:$HEALTH_PORT/ready
          #        (loopback only, operator-set port) as SSRF;
          #   G705 flags cached JSON bodies written with Content-Type application/json
          #        as XSS (not HTML);
          #   G118 flags the drilldown field batcher goroutine, which intentionally
          #        outlives any single request so batches can be shared across callers.
          "$(go env GOPATH)/bin/gosec" \
            -exclude=G104,G108,G115,G118,G301,G302,G304,G306,G402,G404,G704,G705 \
            -exclude-generated \
            -exclude-dir=bench \
            -fmt sarif \
            -out gosec.sarif \
            ./...

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
        if: ${{ always() && hashFiles('gosec.sarif') != '' }}
        with:
          sarif_file: gosec.sarif

      - name: Trivy filesystem scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            aquasec/trivy:0.71.0 \
            fs . \
            --ignorefile .trivyignore.yaml \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-fs.sarif \
            --exit-code 1 \
            --skip-version-check

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' }}
        with:
          sarif_file: trivy-fs.sarif

      - name: actionlint
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color

      - name: zizmor
        run: |
          # Offline: no GitHub token, no network audits. The reviewed exceptions are inline
          # `# zizmor: ignore[rule] <reason>` comments; any other finding fails the step.
          # The SARIF run exits 0 on findings, so the second run is the gate.
          zizmor_image=ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            "$zizmor_image" \
            --offline --no-progress \
            --format sarif \
            .github/workflows > zizmor.sarif
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            "$zizmor_image" \
            --offline --no-progress \
            --format plain \
            .github/workflows

      - name: Upload zizmor SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
        if: ${{ always() && hashFiles('zizmor.sarif') != '' }}
        with:
          sarif_file: zizmor.sarif

      - name: hadolint
        run: |
          docker run --rm \
            -i \
            -v "$PWD/.hadolint.yaml:/root/.config/hadolint.yaml:ro" \
            hadolint/hadolint:v2.12.0 < Dockerfile

      - name: OpenSSF Scorecard
        continue-on-error: true
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Evaluate the PR/push commit, not the default branch HEAD.
          # For pull_request events GITHUB_SHA is the synthetic merge commit;
          # for push events it is the pushed commit — both reflect what will land.
          # Keep this image on the Scorecard version bundled by the
          # ossf/scorecard-action pin in scorecard.yaml (v2.5.0 bundles v5.6.0);
          # Dependabot does not update images used by docker run.
          docker run --rm \
            -e GITHUB_AUTH_TOKEN="${GITHUB_AUTH_TOKEN}" \
            ghcr.io/ossf/scorecard:v5.6.0@sha256:c0a21a1c33a2d8819937d0a8a62e6f4189c800639abd9f0bfbe61c90c71fae90 \
            --repo="github.com/${GITHUB_REPOSITORY}" \
            --commit="${GITHUB_SHA}" \
            --format json \
            --show-details > scorecard.json

      - name: Enforce Scorecard guardrails
        if: hashFiles('scorecard.json') != ''
        run: |
          python3 scripts/ci/check_scorecard.py scorecard.json \
            --min-overall 5.0 \
            --require-check Dangerous-Workflow=10 \
            --require-check Binary-Artifacts=10 \
            --require-check CI-Tests=8 \
            --require-check SAST=7

      - name: Upload security static artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: security-static
          if-no-files-found: ignore
          path: |
            gitleaks.sarif
            gosec.sarif
            trivy-fs.sarif
            zizmor.sarif
            scorecard.json

  security-runtime:
    name: Security / runtime
    runs-on: ubuntu-latest
    needs: [security-static]
    env:
      PROXY_IMAGE: loki-vl-proxy:security-ci
      PROXY_BASE_URL: http://127.0.0.1:13100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.PROXY_IMAGE }}
          load: true
          cache-from: type=gha,scope=security-proxy
          cache-to: type=gha,mode=max,scope=security-proxy

      - name: Start e2e stack
        working-directory: test/e2e-compat
        run: |
          docker compose up -d --no-build
          ../../scripts/ci/wait_e2e_stack.sh 180

      - name: Run security regressions
        run: ./scripts/ci/run_security_regressions.sh

      - name: ZAP baseline
        run: ./scripts/ci/run_zap_scan.sh baseline

      - name: Upload runtime security artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: security-runtime
          path: |
            security-reports/zap

      - name: Tear down e2e stack
        if: always()
        working-directory: test/e2e-compat
        run: docker compose down -v
