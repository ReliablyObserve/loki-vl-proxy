name: Release

# Manual republish of an existing release tag: binaries, SBOMs, provenance,
# signatures, the image (GHCR and Docker Hub) and the Helm chart.
#
# dry_run (default false) runs every step that builds, scans, signs or collects
# and publishes nothing: no tag, release, registry push, Docker Hub, chart push,
# attestation or metadata branch. The image is built to an OCI archive and
# scanned from it, signatures use a throwaway key with no transparency log
# upload, and the outputs are kept as a run artifact. Every step that publishes
# carries `if: ${{ !inputs.dry_run }}` (scripts/ci/tests/test_release_pipeline_wiring.py).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.26.0
        required: true
        type: string
      dry_run:
        description: Run every step but publish nothing (no tag, release, push, attestation or metadata branch)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      HAS_RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' }}
      HAS_GHCR_PACKAGE_ADMIN_TOKEN: ${{ secrets.GHCR_PACKAGE_ADMIN_TOKEN != '' }}
      DRY_RUN: ${{ inputs.dry_run }}
      # The dry run's throwaway signing key and outputs; nothing there leaves the run but the artifact.
      DRY_RUN_DIR: /tmp/release-dry-run
    steps:
      - name: Refuse to publish from other refs
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *)
              # A dry run publishes nothing, so a branch that changes this workflow can try it before it merges.
              if [ "${DRY_RUN}" = "true" ]; then
                echo "::notice::dry run from ${GITHUB_REF}: nothing is published"
                exit 0
              fi
              echo "::error::releases are published only from main or a v* tag"; exit 1 ;;
          esac

      # The tag is typed by whoever dispatches the run. Accept only a plain
      # release tag before it is used as a git ref or anywhere in a script.
      - name: Validate the release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "${INPUT_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH, for example v0.26.0"
            exit 1
          fi
          echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"

      # An immutable release locks its assets once it is published. Republishing a
      # tag replaces the release assets, and by then the image and chart tags have
      # already been pointed at the rebuilt artifacts, so on an immutable release
      # the run would change those tags and then fail. Refuse before anything is
      # built or pushed. A release cut before immutable releases were turned on,
      # and a tag with no release yet, are unaffected.
      - name: Refuse to republish an immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The REST field works with any gh version on the runner. A draft is not
          # returned by this endpoint, so a re-run that finishes a draft goes on.
          if ! IMMUTABLE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.immutable // false' 2>&1)"; then
            case "${IMMUTABLE}" in
              *"HTTP 404"*) echo "No published release for ${TAG}; continuing."; exit 0 ;;
              *) echo "::error::could not read the release for ${TAG}: ${IMMUTABLE}"; exit 1 ;;
            esac
          fi
          if [ "${IMMUTABLE}" = "true" ]; then
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice::${TAG} is an immutable release; a dry run replaces nothing and goes on."
              exit 0
            fi
            echo "::error::${TAG} is an immutable release, so its assets cannot be replaced. Publish a new version instead."
            exit 1
          fi

      # Only an existing tag is released: the ref is spelled as a tag so a branch
      # of the same name can never be picked up. The checkout does not keep the
      # token; the one step that pushes gets the bot token through a credential helper.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          # No restored cache in the job that publishes release artifacts: nothing
          # a pull request or branch run saved can reach what ships.
          cache: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.4

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3

      - name: Extract version
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The checkout is the tag itself; refuse a tag that moved or is missing.
          if [ "$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::${TAG} is not a tag of the checked out commit"
            exit 1
          fi
          VERSION="${TAG#v}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | grep -vx "$TAG" | head -1 || true)
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prev_tag=${PREV_TAG}"
            echo "revision=$(git rev-parse HEAD)"
            echo "build_time=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Render release notes
        id: release_notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/extract_changelog_section.sh
          NOTES_FILE="$(mktemp)"
          if ! scripts/ci/extract_changelog_section.sh "${VERSION}" CHANGELOG.md > "$NOTES_FILE"; then
            echo "::warning::No changelog section found for ${VERSION}; using fallback release notes"
            {
              echo "## ${VERSION}"
              echo
              echo "- republish release artifacts and container images for existing tag ${VERSION}"
            } > "$NOTES_FILE"
          fi
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ steps.version.outputs.revision }}
          BUILD_TIME: ${{ steps.version.outputs.build_time }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "dev" ]; then
            echo "refusing to build release binaries with VERSION='${VERSION}'" >&2
            exit 1
          fi
          mkdir -p dist
          # -trimpath and a build time taken from the release commit make the
          # binaries reproducible from the tag (see SECURITY.md).
          for GOOS_GOARCH in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${GOOS_GOARCH%/*}"
            GOARCH="${GOOS_GOARCH#*/}"
            OUT="dist/loki-vl-proxy-${GOOS}-${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.revision=${REVISION} -X main.buildTime=${BUILD_TIME}" \
              -o "$OUT" ./cmd/proxy
          done
          cd dist && sha256sum loki-vl-proxy-* > checksums.txt

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Generate SBOMs for the release binaries
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          # One SPDX JSON document per binary. checksums.txt was written before
          # this step, so the SBOM files are never listed in it.
          for BIN in dist/loki-vl-proxy-linux-amd64 dist/loki-vl-proxy-linux-arm64 \
                     dist/loki-vl-proxy-darwin-amd64 dist/loki-vl-proxy-darwin-arm64; do
            "${SYFT}" scan "file:${BIN}" -o "spdx-json=${BIN}.spdx.json" -q
          done

      # Loki is AGPL-3.0 and its parser is used only by the test oracle under test/oracle/loki, which no release
      # binary links (internal/querycorpus TestProductModuleHasNoOracleDependency holds the proxy's go.mod and
      # go.sum to it). A binary whose SBOM names a Loki package stops the release.
      - name: Check that no release binary contains a Loki package
        run: |
          set -euo pipefail
          shopt -s nullglob
          sboms=(dist/*.spdx.json)
          if [ "${#sboms[@]}" -eq 0 ]; then
            echo "::error::no SBOM to check in dist/"
            exit 1
          fi
          if grep -l 'github.com/grafana/loki' "${sboms[@]}"; then
            echo "::error::a release binary's SBOM names github.com/grafana/loki; the proxy must not contain Loki's code"
            exit 1
          fi

      - name: Attest binary build provenance
        id: attest-binaries
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Attest SBOM for linux/amd64
        id: attest-sbom-linux-amd64
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/loki-vl-proxy-linux-amd64
          sbom-path: dist/loki-vl-proxy-linux-amd64.spdx.json

      - name: Attest SBOM for linux/arm64
        id: attest-sbom-linux-arm64
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/loki-vl-proxy-linux-arm64
          sbom-path: dist/loki-vl-proxy-linux-arm64.spdx.json

      - name: Attest SBOM for darwin/amd64
        id: attest-sbom-darwin-amd64
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/loki-vl-proxy-darwin-amd64
          sbom-path: dist/loki-vl-proxy-darwin-amd64.spdx.json

      - name: Attest SBOM for darwin/arm64
        id: attest-sbom-darwin-arm64
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/loki-vl-proxy-darwin-arm64
          sbom-path: dist/loki-vl-proxy-darwin-arm64.spdx.json

      - name: Create a throwaway signing key (dry run)
        if: ${{ inputs.dry_run }}
        env:
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          mkdir -p "${DRY_RUN_DIR}"
          # A key that exists only in this run: a dry run signs with it, never with the release identity.
          (cd "${DRY_RUN_DIR}" && cosign generate-key-pair --output-key-prefix throwaway)

      - name: Sign the release checksums
        env:
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            cosign sign-blob --yes --key "${DRY_RUN_DIR}/throwaway.key" --tlog-upload=false --use-signing-config=false \
              --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
            exit 0
          fi
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Package Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          helm package charts/loki-vl-proxy \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination dist

      - name: Login Helm to GHCR
        if: ${{ !inputs.dry_run }}
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_PASSWORD}" | helm registry login ghcr.io \
            --username "${REGISTRY_USER}" \
            --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.HAS_DOCKERHUB == 'true' && !inputs.dry_run }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker image tags
        id: image-tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAMES="ghcr.io/${OWNER_LC}/loki-vl-proxy"
          if [ "${HAS_DOCKERHUB}" = "true" ]; then
            IMAGE_NAMES="${IMAGE_NAMES},docker.io/reliablyobserve/loki-vl-proxy"
          fi
          {
            echo "ghcr_image=ghcr.io/${OWNER_LC}/loki-vl-proxy"
            echo "image_names=${IMAGE_NAMES}"
            echo "tags<<EOF"
            echo "ghcr.io/${OWNER_LC}/loki-vl-proxy:${VERSION}"
            if [ "${HAS_DOCKERHUB}" = "true" ]; then
              echo "docker.io/reliablyobserve/loki-vl-proxy:${VERSION}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The same build, written to an OCI archive instead of a registry: the image, its provenance and its SBOM.
      - name: Build the Docker image (dry run)
        id: build_dry
        if: ${{ inputs.dry_run }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/release-dry-run/image.oci.tar
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ steps.version.outputs.revision }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # The image is pushed by digest only. The version tags are created after the
      # image is signed and attested (see "Publish the image tags").
      - name: Build and push Docker image
        id: build
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,"name=${{ steps.image-tags.outputs.image_names }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ steps.version.outputs.revision }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Release gate. The rebuilt image exists only as an untagged digest here. It
      # is scanned (both platforms) before it is signed or attested and before the
      # image tags and the chart are pushed, so a finding leaves the tags that
      # users pull pointing at the previous artifacts. The scanner and its ignore
      # file come from the commit this workflow runs from, as an older tag may not
      # contain them.
      - name: Scan the pushed image with Trivy
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          IMAGE_REF: ${{ steps.image-tags.outputs.ghcr_image }}@${{ steps.build.outputs.digest || steps.build_dry.outputs.digest }}
        run: |
          set -euo pipefail
          # A dry run scans the OCI archive the build wrote; a release scans the pushed digest.
          if [ "${DRY_RUN}" = "true" ]; then
            export IMAGE_ARCHIVE="${DRY_RUN_DIR}/image.oci.tar"
          fi
          mkdir -p "${RUNNER_TEMP}/trivy-config"
          git show "${WORKFLOW_SHA}:scripts/ci/scan_release_image.sh" > "${RUNNER_TEMP}/scan_release_image.sh"
          git show "${WORKFLOW_SHA}:.trivyignore.yaml" > "${RUNNER_TEMP}/trivy-config/.trivyignore.yaml"
          IGNORE_FILE="${RUNNER_TEMP}/trivy-config/.trivyignore.yaml" bash "${RUNNER_TEMP}/scan_release_image.sh"

      - name: Sign the container image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.build_dry.outputs.digest }}
          GHCR_IMAGE: ${{ steps.image-tags.outputs.ghcr_image }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            # No registry: the index digest is signed as a blob with the throwaway key, kept in the artifact.
            printf '%s@%s\n' "${GHCR_IMAGE}" "${IMAGE_DIGEST}" > "${DRY_RUN_DIR}/image-digest.txt"
            cosign sign-blob --yes --key "${DRY_RUN_DIR}/throwaway.key" --tlog-upload=false --use-signing-config=false \
              --bundle "${DRY_RUN_DIR}/image-digest.txt.sigstore.json" "${DRY_RUN_DIR}/image-digest.txt"
            exit 0
          fi
          # Sign by digest, never by tag. The index digest is the same in every
          # registry the build pushed to.
          cosign sign --yes "${GHCR_IMAGE}@${IMAGE_DIGEST}"
          if [ "${HAS_DOCKERHUB}" = "true" ]; then
            cosign sign --yes "docker.io/reliablyobserve/loki-vl-proxy@${IMAGE_DIGEST}"
          fi

      - name: Attest container image provenance (GHCR)
        id: attest-image-ghcr
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image-tags.outputs.ghcr_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest container image provenance (Docker Hub)
        id: attest-image-dockerhub
        if: ${{ env.HAS_DOCKERHUB == 'true' && !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/reliablyobserve/loki-vl-proxy
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Publish the image tags
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.image-tags.outputs.tags }}
        run: |
          set -euo pipefail
          # Tags point at the already signed and attested index digest.
          while IFS= read -r TAG_REF; do
            [ -n "${TAG_REF}" ] || continue
            docker buildx imagetools create --tag "${TAG_REF}" "${TAG_REF%:*}@${IMAGE_DIGEST}"
            PUBLISHED="$(docker buildx imagetools inspect "${TAG_REF}" --format '{{.Manifest.Digest}}')"
            if [ "${PUBLISHED}" != "${IMAGE_DIGEST}" ]; then
              echo "::error::${TAG_REF} resolves to ${PUBLISHED}, expected ${IMAGE_DIGEST}"
              exit 1
            fi
          done <<< "${TAGS}"

      - name: Publish Helm chart to GHCR
        id: chart_ghcr
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if ! PUSH_OUT="$(helm push "dist/loki-vl-proxy-${VERSION}.tgz" "oci://ghcr.io/${OWNER_LC}/charts" 2>&1)"; then
            echo "${PUSH_OUT}"
            exit 1
          fi
          echo "${PUSH_OUT}"
          # helm prints "Pushed: <ref>:<tag>" and "Digest: sha256:<hex>" (to stderr in Helm 4).
          DIGEST="$(printf '%s\n' "${PUSH_OUT}" | sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' | head -n1)"
          PUSHED="$(printf '%s\n' "${PUSH_OUT}" | sed -n 's/^Pushed: //p' | head -n1)"
          if [ -z "${DIGEST}" ] || [ -z "${PUSHED}" ]; then
            echo "::error::could not read the pushed chart reference and digest from helm output"
            exit 1
          fi
          REF="${PUSHED%:*}"
          {
            echo "digest=${DIGEST}"
            echo "ref=${REF}"
          } >> "$GITHUB_OUTPUT"

      # The dry run's chart reference and digest come from the packaged archive: what a push would name.
      - name: Chart reference and digest (dry run)
        id: chart_dry
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "ref=ghcr.io/${OWNER_LC}/charts/loki-vl-proxy"
            echo "digest=sha256:$(sha256sum "dist/loki-vl-proxy-${VERSION}.tgz" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Sign the Helm chart (GHCR)
        if: ${{ !inputs.dry_run }}
        env:
          CHART_REF: ${{ steps.chart_ghcr.outputs.ref }}
          CHART_DIGEST: ${{ steps.chart_ghcr.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${CHART_REF}@${CHART_DIGEST}"

      - name: Login Helm to Docker Hub
        if: ${{ env.HAS_DOCKERHUB == 'true' && !inputs.dry_run }}
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_PASSWORD}" | helm registry login registry-1.docker.io \
            --username "${REGISTRY_USER}" \
            --password-stdin

      - name: Publish Helm chart to Docker Hub
        id: chart_dockerhub
        if: ${{ env.HAS_DOCKERHUB == 'true' && !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! PUSH_OUT="$(helm push "dist/loki-vl-proxy-${VERSION}.tgz" "oci://registry-1.docker.io/reliablyobserve/charts" 2>&1)"; then
            echo "${PUSH_OUT}"
            exit 1
          fi
          echo "${PUSH_OUT}"
          # helm prints "Pushed: <ref>:<tag>" and "Digest: sha256:<hex>" (to stderr in Helm 4).
          DIGEST="$(printf '%s\n' "${PUSH_OUT}" | sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' | head -n1)"
          PUSHED="$(printf '%s\n' "${PUSH_OUT}" | sed -n 's/^Pushed: //p' | head -n1)"
          if [ -z "${DIGEST}" ] || [ -z "${PUSHED}" ]; then
            echo "::error::could not read the pushed chart reference and digest from helm output"
            exit 1
          fi
          REF="docker.io/${PUSHED#registry-1.docker.io/}"
          REF="${REF%:*}"
          {
            echo "digest=${DIGEST}"
            echo "ref=${REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Sign the Helm chart (Docker Hub)
        if: ${{ env.HAS_DOCKERHUB == 'true' && !inputs.dry_run }}
        env:
          CHART_REF: ${{ steps.chart_dockerhub.outputs.ref }}
          CHART_DIGEST: ${{ steps.chart_dockerhub.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${CHART_REF}@${CHART_DIGEST}"

      - name: Sign the Helm chart archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            cosign sign-blob --yes --key "${DRY_RUN_DIR}/throwaway.key" --tlog-upload=false --use-signing-config=false \
              --bundle "dist/loki-vl-proxy-${VERSION}.tgz.sigstore.json" "dist/loki-vl-proxy-${VERSION}.tgz"
            exit 0
          fi
          # The archive attached to the release gets its own keyless signature
          # bundle, so it can be verified with cosign verify-blob and no registry.
          cosign sign-blob --yes --bundle "dist/loki-vl-proxy-${VERSION}.tgz.sigstore.json" "dist/loki-vl-proxy-${VERSION}.tgz"

      - name: Attest Helm chart provenance
        id: attest-chart
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/loki-vl-proxy-*.tgz

      - name: Ensure GHCR Helm chart package is public
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GHCR_PACKAGE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          OWNER_LC="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          PKG="charts%2Floki-vl-proxy"
          if [ "${HAS_GHCR_PACKAGE_ADMIN_TOKEN}" != "true" ]; then
            echo "::warning::GHCR_PACKAGE_ADMIN_TOKEN not configured. Helm chart visibility cannot be enforced automatically."
            echo "::warning::Set package visibility to public manually: ghcr.io/${OWNER_LC}/charts/loki-vl-proxy"
            exit 0
          fi
          gh api -X PATCH "/orgs/${OWNER}/packages/container/${PKG}/visibility" -f visibility=public >/dev/null
          echo "Ensured public visibility for ghcr.io/${OWNER_LC}/charts/loki-vl-proxy"

      - name: Collect provenance bundles, image SBOMs and digests
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          GHCR_IMAGE: ${{ steps.image-tags.outputs.ghcr_image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.build_dry.outputs.digest }}
          CHART_GHCR_REF: ${{ steps.chart_ghcr.outputs.ref || steps.chart_dry.outputs.ref }}
          CHART_GHCR_DIGEST: ${{ steps.chart_ghcr.outputs.digest || steps.chart_dry.outputs.digest }}
          CHART_DH_REF: ${{ steps.chart_dockerhub.outputs.ref }}
          CHART_DH_DIGEST: ${{ steps.chart_dockerhub.outputs.digest }}
          SYFT: ${{ steps.syft.outputs.cmd }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          BUNDLE_BINARIES: ${{ steps.attest-binaries.outputs.bundle-path }}
          BUNDLE_CHART: ${{ steps.attest-chart.outputs.bundle-path }}
          BUNDLE_IMAGE_GHCR: ${{ steps.attest-image-ghcr.outputs.bundle-path }}
          BUNDLE_IMAGE_DH: ${{ steps.attest-image-dockerhub.outputs.bundle-path }}
          BUNDLE_SBOM_LINUX_AMD64: ${{ steps.attest-sbom-linux-amd64.outputs.bundle-path }}
          BUNDLE_SBOM_LINUX_ARM64: ${{ steps.attest-sbom-linux-arm64.outputs.bundle-path }}
          BUNDLE_SBOM_DARWIN_AMD64: ${{ steps.attest-sbom-darwin-amd64.outputs.bundle-path }}
          BUNDLE_SBOM_DARWIN_ARM64: ${{ steps.attest-sbom-darwin-arm64.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # The SBOM BuildKit attached to the pushed index, per platform. Read by
          # digest, so it is the document of the image that was signed and attested.
          IMAGE_SBOM_JSON="${RUNNER_TEMP}/image-sbom.json"
          if [ "${DRY_RUN}" = "true" ]; then
            # No registry to read the BuildKit SBOM from: each platform of the OCI archive is scanned with the
            # same Syft as the binaries, in the shape imagetools prints ({"linux/<arch>": {"SPDX": {...}}}).
            for PLATFORM in linux/amd64 linux/arm64; do
              "${SYFT}" scan "oci-archive:${DRY_RUN_DIR}/image.oci.tar" --platform "${PLATFORM}" -o "spdx-json=${RUNNER_TEMP}/sbom-${PLATFORM#linux/}.json" -q
            done
            jq -n --slurpfile a "${RUNNER_TEMP}/sbom-amd64.json" --slurpfile b "${RUNNER_TEMP}/sbom-arm64.json" \
              '{"linux/amd64": {"SPDX": $a[0]}, "linux/arm64": {"SPDX": $b[0]}}' > "${IMAGE_SBOM_JSON}"
          fi
          for ATTEMPT in 1 2 3; do
            [ "${DRY_RUN}" = "true" ] && break
            if docker buildx imagetools inspect "${GHCR_IMAGE}@${IMAGE_DIGEST}" --format '{{ json .SBOM }}' > "${IMAGE_SBOM_JSON}"; then
              break
            fi
            if [ "${ATTEMPT}" = 3 ]; then
              echo "::error::could not read the image SBOM from ${GHCR_IMAGE}@${IMAGE_DIGEST}"
              exit 1
            fi
            sleep $((ATTEMPT * 5))
          done
          export IMAGE_SBOM_JSON
          # A tag cut before the collector existed does not contain it, so it is
          # taken from the commit the workflow itself runs from.
          git show "${WORKFLOW_SHA}:scripts/ci/collect_release_assets.sh" > "${RUNNER_TEMP}/collect_release_assets.sh"
          bash "${RUNNER_TEMP}/collect_release_assets.sh"

      - name: Append verification details to the release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
          GHCR_IMAGE: ${{ steps.image-tags.outputs.ghcr_image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.build_dry.outputs.digest }}
          CHART_GHCR_REF: ${{ steps.chart_ghcr.outputs.ref || steps.chart_dry.outputs.ref }}
          CHART_GHCR_DIGEST: ${{ steps.chart_ghcr.outputs.digest || steps.chart_dry.outputs.digest }}
          CHART_DH_REF: ${{ steps.chart_dockerhub.outputs.ref }}
          CHART_DH_DIGEST: ${{ steps.chart_dockerhub.outputs.digest }}
        run: |
          set -euo pipefail
          F='```'
          ID_RE='^https://github\.com/'"${GITHUB_REPOSITORY}"'/\.github/workflows/(auto-release|release)\.yaml@refs/(heads/main|tags/v.+)$'
          DH_IMAGE=""
          if [ "${HAS_DOCKERHUB}" = "true" ]; then
            DH_IMAGE="docker.io/reliablyobserve/loki-vl-proxy"
          fi
          {
            echo
            echo "## Verify this release"
            echo
            echo "Container image (multi-arch index digest):"
            echo
            echo "- \`${GHCR_IMAGE}@${IMAGE_DIGEST}\`"
            if [ -n "${DH_IMAGE}" ]; then
              echo "- \`${DH_IMAGE}@${IMAGE_DIGEST}\`"
            fi
            echo
            echo "Helm chart (OCI digest):"
            echo
            echo "- \`${CHART_GHCR_REF}@${CHART_GHCR_DIGEST}\`"
            if [ -n "${DH_IMAGE}" ]; then
              echo "- \`${CHART_DH_REF}@${CHART_DH_DIGEST}\`"
            fi
            echo
            echo "Verify the image signature and build provenance, then the release checksums:"
            echo
            echo "${F}sh"
            echo "cosign verify ${GHCR_IMAGE}@${IMAGE_DIGEST} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '${ID_RE}'"
            echo "gh attestation verify oci://${GHCR_IMAGE}@${IMAGE_DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo "cosign verify-blob --bundle checksums.txt.sigstore.json \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '${ID_RE}' checksums.txt"
            echo "sha256sum -c checksums.txt --ignore-missing"
            echo "gh attestation verify loki-vl-proxy-linux-amd64 --repo ${GITHUB_REPOSITORY}"
            echo "${F}"
            echo
            echo "The release also attaches the evidence for checking it without the GitHub attestation API: \`loki-vl-proxy-${VERSION}.intoto.jsonl\` (build provenance of the binaries, the chart and the image, and the SBOM attestation of each binary, as one Sigstore bundle per line), \`loki-vl-proxy-${VERSION}.tgz.sigstore.json\` (cosign signature of the chart archive), \`loki-vl-proxy-image-${VERSION}-linux-<arch>.spdx.json\` (the SBOM of the image for each platform) and \`image-digests.txt\` (the image and chart references above). For example:"
            echo
            echo "${F}sh"
            echo "gh attestation verify loki-vl-proxy-linux-amd64 --bundle loki-vl-proxy-${VERSION}.intoto.jsonl --repo ${GITHUB_REPOSITORY}"
            echo "cosign verify-blob --bundle loki-vl-proxy-${VERSION}.tgz.sigstore.json \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '${ID_RE}' loki-vl-proxy-${VERSION}.tgz"
            echo "${F}"
            echo
            echo "Every signature and attestation is recorded in Sigstore's public transparency log. The full procedure, including reproducing a binary from the tag, is in [SECURITY.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/SECURITY.md#verifying-releases)."
          } >> "${NOTES_FILE}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.3  # zizmor: ignore[superfluous-actions] softprops/action-gh-release attaches the signed assets; replacing it with gh release is a separate change
        # The SPDX SBOMs of the binaries (dist/loki-vl-proxy-<os>-<arch>.spdx.json)
        # are matched by the binary globs below, so they are not listed a second
        # time. None of the other globs overlaps another.
        #
        # The action creates the release as a draft, uploads every file, and only
        # then publishes it, so assets are never added to a published release.
        # That order is what GitHub's immutable releases need, and once a release
        # is published a missing asset can no longer be added: a pattern that
        # matches nothing therefore fails the step, before the draft is created.
        with:
          fail_on_unmatched_files: true
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          files: |
            dist/loki-vl-proxy-linux-*
            dist/loki-vl-proxy-darwin-*
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/loki-vl-proxy-*.tgz
            dist/loki-vl-proxy-*.tgz.sigstore.json
            dist/loki-vl-proxy-*.intoto.jsonl
            dist/loki-vl-proxy-image-*.spdx.json
            dist/image-digests.txt

      # The dry run's stand-in for the release: every file the release would attach must exist, as
      # fail_on_unmatched_files requires, and the whole set is kept as the run's artifact.
      - name: Check the release assets (dry run)
        if: ${{ inputs.dry_run }}
        env:
          NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for glob in 'dist/loki-vl-proxy-linux-*' 'dist/loki-vl-proxy-darwin-*' dist/checksums.txt dist/checksums.txt.sigstore.json \
                      'dist/loki-vl-proxy-*.tgz' 'dist/loki-vl-proxy-*.tgz.sigstore.json' 'dist/loki-vl-proxy-*.intoto.jsonl' \
                      'dist/loki-vl-proxy-image-*.spdx.json' dist/image-digests.txt; do
            # shellcheck disable=SC2206 # the glob is expanded on purpose
            matched=( ${glob} )
            if [ "${#matched[@]}" -eq 0 ]; then
              echo "::error::no release asset matches ${glob}"
              exit 1
            fi
          done
          cosign verify-blob --key "${DRY_RUN_DIR}/throwaway.pub" --insecure-ignore-tlog=true \
            --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          cp "${NOTES_FILE}" "${DRY_RUN_DIR}/release-notes.md"
          cp -R dist "${DRY_RUN_DIR}/dist"
          rm -f "${DRY_RUN_DIR}/throwaway.key"
          find dist "${DRY_RUN_DIR}" -maxdepth 1 -type f | sort | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the dry run's outputs
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: release-dry-run
          # The image archive stays out: its digest, scan and SBOMs are in the artifact.
          path: |
            /tmp/release-dry-run
            !/tmp/release-dry-run/image.oci.tar
            !/tmp/release-dry-run/*.key
          if-no-files-found: ignore

      - name: Prepare release metadata branch
        id: metadata
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' && secrets.RELEASE_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ "${HAS_RELEASE_PR_TOKEN}" != "true" ]; then
            echo "::warning::RELEASE_PR_TOKEN is not configured. The metadata branch is pushed with the job token and no pull request is opened for it."
          fi
          # Generated against the current tip of main, from the entries the tag
          # shipped (scripts/ci/release_metadata.py), and committed through the
          # API, which signs it.
          if ! python3 scripts/ci/release_metadata.py prepare --version "${VERSION}" --github-output "$GITHUB_OUTPUT" --body-file "${RUNNER_TEMP}/metadata-body.md"; then
            echo "::warning::Unable to push the release metadata branch. Skipping metadata PR automation for this release."
            echo "::warning::Verify RELEASE_PR_TOKEN permissions (contents:write and pull_requests:write) to re-enable metadata sync automation."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the release metadata pull request and arm auto-merge
        if: ${{ !inputs.dry_run && steps.metadata.outputs.has_changes == 'true' }}
        env:
          # The bot token is given to this step only. A pull request opened with
          # the job's own token does not start the pull_request workflows, so it
          # could never pass its required checks.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The release itself is already published: a problem here warns and the
          # run goes on, so the metadata pull request can be opened by hand.
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::release version '${VERSION}' is not a plain semver; skipping the metadata pull request"
            exit 0
          fi
          BRANCH="release/metadata-v${VERSION}"
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::RELEASE_PR_TOKEN is not configured; open the pull request from ${BRANCH} to main by hand and enable auto-merge"
            echo "Release metadata v${VERSION}: branch \`${BRANCH}\` is pushed, no pull request was opened (RELEASE_PR_TOKEN is not configured)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          open_number() {
            gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --base main --state open \
              --json number --jq '.[0].number // empty'
          }
          NUMBER="$(open_number)"
          if [ -z "${NUMBER}" ]; then
            BODY_FILE="${RUNNER_TEMP}/metadata-body.md"
            if [ ! -f "${BODY_FILE}" ]; then
              printf 'Sync release metadata files for v%s after the automated release.\n' "${VERSION}" > "${BODY_FILE}"
            fi
            cat "${BODY_FILE}" >> "$GITHUB_STEP_SUMMARY"
            if ! gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${BRANCH}" \
              --title "docs: sync release metadata for v${VERSION}" --body-file "${BODY_FILE}"; then
              echo "::warning::could not open the pull request from ${BRANCH}; open it by hand"
              exit 0
            fi
            NUMBER="$(open_number)"
          fi
          if [ -z "${NUMBER}" ]; then
            echo "::warning::no open pull request found for ${BRANCH}; open it by hand"
            exit 0
          fi
          # Auto-merge merges the pull request by itself once the maintainer
          # approves it and the required checks pass. Nothing merges before that.
          if gh pr merge "${NUMBER}" --repo "${GITHUB_REPOSITORY}" --auto --squash; then
            echo "Release metadata v${VERSION}: pull request #${NUMBER} is open with auto-merge armed; it merges after the maintainer's approval and the required checks." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not arm auto-merge on pull request #${NUMBER}; enable it by hand"
            echo "Release metadata v${VERSION}: pull request #${NUMBER} is open, auto-merge could not be armed." >> "$GITHUB_STEP_SUMMARY"
          fi
