name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "docs/observability.md"
      - "charts/loki-vl-proxy/Chart.yaml"
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reports which lanes of jobs the pull request needs (product, stack, perf;
  # nested, so product implies stack implies perf). A job skips only when this
  # job succeeds with its lane "false"; a scope failure or an empty output runs
  # it. Product jobs carry the product gate. Jobs that start a compose stack
  # carry the stack gate (`image`) or, when they also follow `test`, the stack
  # gate written out below, so a change that only touches a stack config runs
  # the stack without the unit tests. Jobs that depend on `test` otherwise skip
  # with it.
  scope:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/change-scope.yaml  # zizmor: ignore[self-repository] the $/ form is rejected by the pinned actionlint

  test:
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.outputs.product != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # internal/proxy can exceed 20 minutes under -race with coverage on a
      # contended hosted runner; keep the complete suite and allow headroom.
      #
      # -json keeps every test's outcome: the conformance job reads the
      # ./internal/... part of it (its evidence check) instead of running the
      # unit tests a second time. The log shows the package lines as it runs and,
      # on a failure, the output of each failing test.
      - name: Unit tests
        run: |
          set -o pipefail
          status=0
          go test ./... -count=1 -race -timeout=35m -coverprofile=coverage.out -json \
            | tee unit-results-full.json \
            | jq -rR --unbuffered 'fromjson? | select(.Action == "output" and .Test == null) | .Output | rtrimstr("\n") | select(. != "PASS" and (startswith("coverage:") | not))' \
            || status=$?
          # The outcome of every test of ./internal/... (the set the conformance gate checks), without the output.
          jq -c 'select(.Test != null and (.Action == "pass" or .Action == "fail" or .Action == "skip")
                        and (.Package | startswith("github.com/ReliablyObserve/Loki-VL-proxy/internal/")))
                 | {Action, Package, Test, Elapsed}' unit-results-full.json > unit-results.json
          if [ "$status" -ne 0 ]; then
            echo "::group::failing tests"
            jq -r 'select(.Action == "fail") | "\(.Package)\t\(.Test // "")"' unit-results-full.json | sort -u | tee failed.tsv
            echo "::endgroup::"
            jq -Rn '[inputs] | map({(.): true}) | add // {}' failed.tsv > failed.json
            jq -r --slurpfile failed failed.json \
              'select(.Action == "output") | select($failed[0][.Package + "\t" + (.Test // "")]) | .Output | rtrimstr("\n")' \
              unit-results-full.json | head -400
          fi
          exit "$status"

      - name: Upload failed unit-test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: unit-results-diagnostics
          path: unit-results-full.json
          if-no-files-found: ignore

      - name: Coverage report
        run: go tool cover -func=coverage.out | tail -1

      - name: Cache package coverage guard
        run: |
          set -euo pipefail
          go test ./internal/cache -coverprofile=coverage-cache.out -count=1 >/dev/null
          cache_cov="$(go tool cover -func=coverage-cache.out | awk 'END {gsub("%","",$3); print $3}')"
          echo "internal/cache coverage: ${cache_cov}%"
          awk -v cov="${cache_cov}" 'BEGIN {
            min=79.0
            if (cov+0 < min) {
              printf "FAIL: internal/cache coverage %.2f%% is below guard %.1f%%\n", cov+0, min
              exit 1
            }
          }'

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage-cache.out

      - name: Upload unit test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: unit-results
          path: unit-results.json
          retention-days: 1
          if-no-files-found: error

  tuple-contract:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Tuple contract gate (default 2-tuple + categorize-labels 3-tuple)
        run: go test ./internal/proxy -run '^TestTupleContract_' -count=1

  fuzz-smoke:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true

      # --- internal/proxy ---
      - name: Fuzz smoke (structured metadata normalization)
        run: go test ./internal/proxy -run '^$' -fuzz=FuzzNormalizeMetadataPairsFromJSON -fuzztime=12s

      - name: Fuzz smoke (merged categorized stream contract)
        run: go test ./internal/proxy -run '^$' -fuzz=FuzzMergeLokiQueryResponsesStructuredMetadataContract -fuzztime=12s

      - name: Fuzz smoke (parse Loki duration)
        run: go test ./internal/proxy -run '^$' -fuzz=FuzzParseLokiDuration -fuzztime=12s

      - name: Fuzz smoke (parse timestamp)
        run: go test ./internal/proxy -run '^$' -fuzz=FuzzParseTimestamp -fuzztime=12s

      - name: Fuzz smoke (series key from metric)
        run: go test ./internal/proxy -run '^$' -fuzz=FuzzSeriesKeyFromMetric -fuzztime=20s -timeout=60s

      - name: Fuzz smoke (parse value to float)
        run: go test ./internal/proxy -run '^$' -fuzz=FuzzParseValueToFloat -fuzztime=12s

      - name: Fuzz smoke (Loki error type)
        run: go test ./internal/proxy -run '^$' -fuzz=FuzzLokiErrorType -fuzztime=12s

      - name: Fuzz smoke (format VL step)
        run: go test ./internal/proxy -run '^$' -fuzz=FuzzFormatVLStep -fuzztime=12s

      - name: Fuzz smoke (normalize metadata pairs)
        run: go test ./internal/proxy -run '^$' -fuzz='^FuzzNormalizeMetadataPairs$' -fuzztime=12s

      - name: Fuzz smoke (combine binary metric results scalar path)
        run: go test ./internal/proxy -run '^$' -fuzz=FuzzCombineBinaryMetricResultsScalarPath -fuzztime=12s

      - name: Fuzz smoke (parse original range metric spec)
        run: go test ./internal/proxy -run '^$' -fuzz=FuzzParseOriginalRangeMetricSpec -fuzztime=12s

      - name: Fuzz smoke (parse legacy rules path)
        run: go test ./internal/proxy -run '^$' -fuzz=FuzzParseLegacyRulesPath -fuzztime=20s

      - name: Fuzz smoke (extract log patterns)
        # Anchored regex: FuzzExtractLogPatternsFromWindowEntries shares the
        # FuzzExtractLogPatterns prefix, so an unanchored match selects both
        # and Go's fuzz runner refuses (multi-match error).
        run: go test ./internal/proxy -run '^$' -fuzz='^FuzzExtractLogPatterns$' -fuzztime=12s

      - name: Fuzz smoke (extract log patterns from window entries)
        run: go test ./internal/proxy -run '^$' -fuzz='^FuzzExtractLogPatternsFromWindowEntries$' -fuzztime=12s

      - name: Fuzz smoke (json error filter split predicate)
        run: go test ./internal/proxy -run '^$' -fuzz='^FuzzJSONValidSplitPredicate$' -fuzztime=12s

      - name: Fuzz smoke (Loki client error mapping)
        run: go test ./internal/proxy -run '^$' -fuzz='^FuzzLokiClientError$' -fuzztime=12s

      - name: Fuzz smoke (proxy lifecycle leaves no goroutines)
        run: go test ./internal/proxy -run '^$' -fuzz='^FuzzProxyLifecycleNoGoroutineLeak$' -fuzztime=12s

      - name: Fuzz smoke (topk and bottomk per step)
        run: go test ./internal/proxy -run '^$' -fuzz=FuzzTopKPerStep -fuzztime=20s -timeout=60s

      - name: Fuzz smoke (settled steps parse, merge and write-back)
        run: go test ./internal/proxy -run '^$' -fuzz='^FuzzQueryStepsRoundTrip$' -fuzztime=12s

      - name: Fuzz smoke (sliding sum without cut vs per-stream fold)
        run: go test ./internal/proxy -run '^$' -fuzz='^FuzzSlidingWithoutCut$' -fuzztime=12s

      - name: Fuzz smoke (sliding quantile vs window sort)
        run: go test ./internal/proxy -run '^$' -fuzz='^FuzzQuantileSlider$' -fuzztime=12s

      - name: Fuzz smoke (quantile counts time sort)
        run: go test ./internal/proxy -run '^$' -fuzz='^FuzzSortQuantileSamples$' -fuzztime=12s

      - name: Fuzz smoke (rate_counter one-sample proof vs Loki)
        run: go test ./internal/proxy -run '^$' -fuzz='^FuzzRateCounterOneSample$' -fuzztime=12s

      # --- internal/translator ---
      - name: Fuzz smoke (translate LogQL)
        run: go test ./internal/translator -run '^$' -fuzz=FuzzTranslateLogQL -fuzztime=12s

      - name: Fuzz smoke (parse binary metric expr)
        run: go test ./internal/translator -run '^$' -fuzz=FuzzParseBinaryMetricExpr -fuzztime=12s

      - name: Fuzz smoke (is scalar)
        run: go test ./internal/translator -run '^$' -fuzz=FuzzIsScalar -fuzztime=12s

      - name: Fuzz smoke (translate with stream fields)
        run: go test ./internal/translator -run '^$' -fuzz=FuzzTranslateWithStreamFields -fuzztime=20s -timeout=60s

      - name: Fuzz smoke (selector and label-filter regexp anchoring)
        run: go test ./internal/translator -run '^$' -fuzz=FuzzSelectorRegexpFilter -fuzztime=12s

      - name: Fuzz smoke (binary expressions)
        run: go test ./internal/translator -run '^$' -fuzz=FuzzBinaryExpressions -fuzztime=12s

      - name: Fuzz smoke (sanitize label name)
        run: go test ./internal/translator -run '^$' -fuzz=FuzzSanitizeLabelName -fuzztime=12s

      # --- internal/cache ---
      - name: Fuzz smoke (hash ring get)
        run: go test ./internal/cache -run '^$' -fuzz=FuzzHashRingGet -fuzztime=12s

      - name: Fuzz smoke (cache get/set)
        run: go test ./internal/cache -run '^$' -fuzz=FuzzCacheGetSet -fuzztime=12s

      # --- internal/rulesmigrate ---
      - name: Fuzz smoke (rules migrate convert)
        run: go test ./internal/rulesmigrate -run '^$' -fuzz=FuzzConvertWithOptions -fuzztime=12s

  race-stress-shard:
    # Dedicated race-detector gate for concurrency hot paths. Catches issues
    # like the v1.55.1 production race in extractLogPatternsFromWindowEntries
    # (postprocess.go:390 read vs stream_processing.go:319 write) that the
    # default unit-test pass missed because no test exercised the windowed +
    # derivedFields + autodetect combination.
    #
    # internal/proxy alone takes ~7 minutes under -race, so its top-level tests
    # are split into three deterministic shards (checksum of the test name over
    # the sorted `go test -list` output) that run in parallel, each with its own 8m
    # budget. The `other` entry carries the remaining packages and the verbose
    # concurrent-regression step so no proxy shard does.
    name: race-stress-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, other]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Select this shard's internal/proxy tests
        if: matrix.shard != 'other'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Shard by a stable checksum of the test name (not the list index) so
          # a shard keeps the same tests when unrelated tests are added. The
          # "30:" salt was picked to balance measured -race test time across
          # the shards and to keep the two heaviest sliding-window tests apart.
          go test -list '.*' ./internal/proxy/ | grep -E '^(Test|Fuzz)' | LC_ALL=C sort \
            | while read -r t; do printf '%s %s\n' "$(printf '30:%s' "$t" | cksum | cut -d' ' -f1)" "$t"; done \
            | awk -v shard="$SHARD" '$1 % 3 == shard % 3 { print $2 }' > shard-tests.txt
          echo "shard $SHARD: $(wc -l < shard-tests.txt) tests"
          test -s shard-tests.txt
          echo "^($(paste -sd'|' shard-tests.txt))\$" > shard-run.txt

      - name: Race-detector tests (internal/proxy shard)
        if: matrix.shard != 'other'
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=8m -run "$(cat shard-run.txt)" ./internal/proxy/

      - name: Race-detector tests (cache, middleware, observability)
        if: matrix.shard == 'other'
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=8m \
            ./internal/cache/... \
            ./internal/middleware/... \
            ./internal/observability/...
          # internal/proxy subpackages, if any
          mapfile -t pkgs < <(go list ./internal/proxy/... | grep -v '/internal/proxy$' || true)
          if [ "${#pkgs[@]}" -gt 0 ]; then go test -race -count=1 -timeout=8m "${pkgs[@]}"; fi

      - name: Concurrent regression tests (verbose, race)
        if: matrix.shard == 'other'
        # Targeted re-run of the tests that specifically reproduce known races
        # so a failure points straight at the affected helper without grep.
        run: |
          go test -race -count=1 -v -timeout=2m \
            -run '^Test(SnapshotEntriesForPatterns_|RequestSampler_ConcurrentShouldLogIsRaceFree|AsyncHandler_|DetectFieldSummariesStream_Concurrent|HandleSeries_Concurrent)' \
            ./internal/proxy/ ./internal/observability/

  race-stress:
    # Aggregate gate keeping the original `race-stress` check name stable for
    # branch protection; fails unless every shard succeeded.
    # The shards are skipped, and that is a pass, only when the scope job says
    # no product path changed. A skipped shard on a product pull request (for
    # example because `test` failed) or an empty scope output fails the gate.
    if: always()
    runs-on: ubuntu-latest
    needs: [scope, race-stress-shard]
    steps:
      - name: Require all race-stress shards to pass
        env:
          SHARD_RESULT: ${{ needs.race-stress-shard.result }}
          PRODUCT: ${{ needs.scope.outputs.product }}
        run: |
          if [ "$SHARD_RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$SHARD_RESULT" = "skipped" ] && [ "$PRODUCT" = "false" ]; then
            echo "Skipped: no product path changed"
            exit 0
          fi
          echo "race-stress shards: $SHARD_RESULT (scope product=$PRODUCT)"
          exit 1

  # Builds the proxy image once for the jobs that run a stack (tuple-smoke,
  # e2e-compat, e2e-fleet, e2e-ui): each loads this artifact instead of building
  # the same image (about 45 s of build and cache export per job). It does not
  # wait for `test`, so the image is ready when they start.
  image:
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.outputs.stack != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: ./Dockerfile
          tags: loki-vl-proxy:ci
          outputs: type=docker,dest=${{ runner.temp }}/proxy-image.tar
          cache-from: type=gha,scope=e2e-proxy
          cache-to: type=gha,mode=max,scope=e2e-proxy

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: proxy-image
          path: ${{ runner.temp }}/proxy-image.tar
          retention-days: 1
          if-no-files-found: error

  tuple-smoke:
    runs-on: ubuntu-latest
    needs: [scope, test, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.scope.outputs.product == 'false' && needs.scope.outputs.stack == 'true')) }}
    env:
      PROXY_IMAGE: loki-vl-proxy:tuple-smoke
      PROXY_URL: http://127.0.0.1:13100
      PROXY_URL_CATEGORIZED: http://127.0.0.1:13102
      SMOKE_QUERY: '{app="e2e-test"}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published

      # Built once by the `image` job.
      - name: Download proxy image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: proxy-image
          path: ${{ runner.temp }}/proxy-image

      - name: Load proxy image
        run: |
          docker load --input "$RUNNER_TEMP/proxy-image/proxy-image.tar"
          docker tag loki-vl-proxy:ci "$PROXY_IMAGE"

      - name: Start e2e stack
        working-directory: test/e2e-compat
        run: |
          for attempt in 1 2 3; do
            if docker compose up -d --no-build; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "docker compose up failed after ${attempt} attempts"
              exit 1
            fi
            echo "docker compose up failed (attempt ${attempt}), retrying in 10s..."
            sleep 10
          done
          ../../scripts/ci/wait_e2e_stack.sh 180

      - name: Seed smoke data
        run: go test -v -tags=e2e -run '^TestSetup_IngestLogs$' ./test/e2e-compat/

      - name: Run tuple smoke script
        run: ./scripts/smoke-test.sh

      - name: Tear down e2e stack
        if: always()
        working-directory: test/e2e-compat
        run: docker compose down -v

  bench:
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.outputs.product != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Run benchmarks
        run: |
          go test ./internal/proxy/ -bench . -benchmem -run "^$" -count=3 -timeout=120s \
            | tee bench-results.txt

      - name: Run label/field scale benchmarks (regression guard)
        run: |
          go test ./internal/proxy/ -run "^$" -bench 'BenchmarkProxy_Label(Keys|Values)_Scale_' -benchmem -count=1 -benchtime=200ms \
            | tee bench-label-fields.txt

          awk '
            /^BenchmarkProxy_Label(Keys|Values)_Scale_.*ns\/op/ {
              bench=$1
              sub(/-[0-9]+$/, "", bench)
              # go test benchmark line format:
              # BenchmarkXxx-4  12345  999.9 ns/op  321 B/op  7 allocs/op
              printf "%s\t%s\t%s\t%s\n", bench, $3, $5, $7
            }
          ' bench-label-fields.txt > bench-label-fields.tsv

          expected=12
          actual=$(wc -l < bench-label-fields.tsv | tr -d " ")
          if [ "$actual" -ne "$expected" ]; then
            echo "FAIL: expected ${expected} parsed benchmark rows, got ${actual}"
            cat bench-label-fields.tsv
            exit 1
          fi

          awk -F'\t' '
            BEGIN { fail=0 }
            {
              name=$1
              ns=$2+0
              size=0
              tmp=name
              sub(/^.*_/, "", tmp)
              if (tmp ~ /^[0-9]+$/) {
                size=tmp+0
              }

              # Scale-aware catastrophic bounds:
              # smaller sets should stay tighter, large sets get wider headroom.
              # LabelKeys cache-bypass at 10k keys may run in the low single-digit ms
              # range on noisy shared runners due to large slice materialization/sort;
              # keep this guard catastrophic (regression detection), not flaky.
              limit=100000
              if (size <= 10) {
                limit=50000
              } else if (size <= 100) {
                limit=100000
              } else if (size <= 1000) {
                limit=250000
              } else if (size > 1000) {
                limit=600000
              }
              if (name ~ /BenchmarkProxy_LabelKeys_Scale_CacheBypass\/keys_10000$/) {
                limit=3000000
              }

              if (ns > limit) {
                printf "FAIL: %s exceeded ns/op threshold %.0f (got %.2f)\n", name, limit, ns
                fail=1
              }
            }
            END { exit fail }
          ' bench-label-fields.tsv

      - name: Publish label/field benchmark summary
        run: |
          {
            echo "### Label/Field Scale Benchmarks"
            echo ""
            echo "| Benchmark | ns/op | B/op | allocs/op |"
            echo "|---|---:|---:|---:|"
            awk -F'\t' '{printf "| `%s` | %s | %s | %s |\n", $1, $2, $3, $4}' bench-label-fields.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run patterns scale benchmarks (regression guard)
        run: |
          go test ./internal/proxy/ -run "^$" -bench 'BenchmarkProxy_Patterns_Scale_' -benchmem -count=1 -benchtime=200ms \
            | tee bench-patterns.txt

          awk '
            /^BenchmarkProxy_Patterns_Scale_.*ns\/op/ {
              bench=$1
              sub(/-[0-9]+$/, "", bench)
              printf "%s\t%s\t%s\t%s\n", bench, $3, $5, $7
            }
          ' bench-patterns.txt > bench-patterns.tsv

          expected=6
          actual=$(wc -l < bench-patterns.tsv | tr -d " ")
          if [ "$actual" -ne "$expected" ]; then
            echo "FAIL: expected ${expected} parsed pattern benchmark rows, got ${actual}"
            cat bench-patterns.tsv
            exit 1
          fi

          awk -F'\t' '
            BEGIN {
              fail=0
              # Small synthetic scales can invert by a few percent on shared runners.
              # Keep the guard strict for real regressions, but tolerate minor noise.
              slowdown_tolerance=1.10
            }
            {
              name=$1
              ns=$2+0
              scale=name
              sub(/^.*\/lines_/, "", scale)
              if (name ~ /CacheBypass/) {
                bypass[scale]=ns
              } else if (name ~ /CacheHit/) {
                hit[scale]=ns
              }
            }
            END {
              for (s in bypass) {
                if (!(s in hit)) {
                  printf "FAIL: missing cache-hit benchmark for lines_%s\n", s
                  fail=1
                  continue
                }
                ratio=hit[s] / bypass[s]
                if (ratio > slowdown_tolerance) {
                  printf "FAIL: cache hit is materially slower than bypass for lines_%s (hit=%.2f ns/op bypass=%.2f ns/op ratio=%.3f tolerance=%.2f)\n", s, hit[s], bypass[s], ratio, slowdown_tolerance
                  fail=1
                } else if (ratio >= 1) {
                  printf "WARN: cache hit is slightly slower than bypass for lines_%s but within runner-noise tolerance (hit=%.2f ns/op bypass=%.2f ns/op ratio=%.3f)\n", s, hit[s], bypass[s], ratio
                }
              }
              exit fail
            }
          ' bench-patterns.tsv

      - name: Publish patterns benchmark summary
        run: |
          {
            echo "### Patterns Scale Benchmarks"
            echo ""
            echo "| Benchmark | ns/op | B/op | allocs/op |"
            echo "|---|---:|---:|---:|"
            awk -F'\t' '{printf "| `%s` | %s | %s | %s |\n", $1, $2, $3, $4}' bench-patterns.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run cache benchmarks (regression guard)
        run: |
          go test ./internal/cache -run "^$" -bench 'BenchmarkCache_(Get_Hit|SetWithTTL|TopHotKeys)$|BenchmarkPeerCache_(ThreePeers_ShadowCopyHit|ReadAheadCycle_Bounded)$' -benchmem -count=1 -benchtime=200ms \
            | tee bench-cache.txt

          awk '
            /^Benchmark(Cache_Get_Hit|Cache_SetWithTTL|Cache_TopHotKeys|PeerCache_ThreePeers_ShadowCopyHit|PeerCache_ReadAheadCycle_Bounded)-[0-9]+/ {
              bench=$1
              sub(/-[0-9]+$/, "", bench)
              printf "%s\t%s\t%s\t%s\n", bench, $3, $5, $7
            }
          ' bench-cache.txt > bench-cache.tsv

          expected=5
          actual=$(wc -l < bench-cache.tsv | tr -d " ")
          if [ "$actual" -ne "$expected" ]; then
            echo "FAIL: expected ${expected} parsed cache benchmark rows, got ${actual}"
            cat bench-cache.tsv
            exit 1
          fi

          awk -F'\t' '
            BEGIN {
              fail=0
            }
            {
              name=$1
              ns=$2+0
              b=$3+0
              a=$4+0

              if (name ~ /BenchmarkCache_Get_Hit$/ && ns > 2000) {
                printf "FAIL: %s exceeded ns/op threshold 2000 (got %.2f)\n", name, ns
                fail=1
              }
              if (name ~ /BenchmarkCache_SetWithTTL$/ && ns > 3000) {
                printf "FAIL: %s exceeded ns/op threshold 3000 (got %.2f)\n", name, ns
                fail=1
              }
              if (name ~ /BenchmarkPeerCache_ThreePeers_ShadowCopyHit$/ && ns > 3000) {
                printf "FAIL: %s exceeded ns/op threshold 3000 (got %.2f)\n", name, ns
                fail=1
              }
              if (name ~ /BenchmarkCache_TopHotKeys$/) {
                if (ns > 15000000) {
                  printf "FAIL: %s exceeded ns/op threshold 15000000 (got %.2f)\n", name, ns
                  fail=1
                }
                if (b > 10000000) {
                  printf "FAIL: %s exceeded B/op threshold 10000000 (got %.0f)\n", name, b
                  fail=1
                }
                if (a > 200) {
                  printf "FAIL: %s exceeded allocs/op threshold 200 (got %.0f)\n", name, a
                  fail=1
                }
              }
              if (name ~ /BenchmarkPeerCache_ReadAheadCycle_Bounded$/) {
                if (ns > 25000000) {
                  printf "FAIL: %s exceeded ns/op threshold 25000000 (got %.2f)\n", name, ns
                  fail=1
                }
                if (b > 12000000) {
                  printf "FAIL: %s exceeded B/op threshold 12000000 (got %.0f)\n", name, b
                  fail=1
                }
                if (a > 5000) {
                  printf "FAIL: %s exceeded allocs/op threshold 5000 (got %.0f)\n", name, a
                  fail=1
                }
              }
            }
            END { exit fail }
          ' bench-cache.tsv

      - name: Publish cache benchmark summary
        run: |
          {
            echo "### Cache Benchmarks"
            echo ""
            echo "| Benchmark | ns/op | B/op | allocs/op |"
            echo "|---|---:|---:|---:|"
            awk -F'\t' '{printf "| `%s` | %s | %s | %s |\n", $1, $2, $3, $4}' bench-cache.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run stats translation benchmarks (regression guard)
        run: |
          go test ./internal/proxy/ -run "^$" -bench 'BenchmarkStatsTranslation_' -benchmem -count=1 -benchtime=200ms \
            | tee bench-stats-translation.txt

          awk '
            /^BenchmarkStatsTranslation_.*ns\/op/ {
              bench=$1
              sub(/-[0-9]+$/, "", bench)
              printf "%s\t%s\t%s\t%s\n", bench, $3, $5, $7
            }
          ' bench-stats-translation.txt > bench-stats-translation.tsv

          expected=5
          actual=$(wc -l < bench-stats-translation.tsv | tr -d " ")
          if [ "$actual" -ne "$expected" ]; then
            echo "FAIL: expected ${expected} stats-translation benchmark rows, got ${actual}"
            cat bench-stats-translation.tsv
            exit 1
          fi

          awk -F'\t' '
            BEGIN { fail=0 }
            {
              name=$1; ns=$2+0
              # translateStatsResponseLabels: fastjson parse + map rebuild per series.
              # Small (10 series × 60 pts) must stay under 500 µs on shared runners.
              # Large (100 series × 60 pts) must stay under 5 ms on shared runners.
              # addUnderscorefallbackByLabels: pure string search + slice append, must stay < 5 µs.
              limit=0
              if (name ~ /Small/) { limit=500000 }
              if (name ~ /Large/) { limit=5000000 }
              if (name ~ /addUnderscorefallbackByLabels/) { limit=5000 }
              if (limit > 0 && ns > limit) {
                printf "FAIL: %s ns/op %.2f exceeds threshold %.0f — performance regression detected\n", name, ns, limit
                fail=1
              }
            }
            END { exit fail }
          ' bench-stats-translation.tsv

      - name: Publish stats translation benchmark summary
        run: |
          {
            echo "### Stats Translation Benchmarks"
            echo ""
            echo "| Benchmark | ns/op | B/op | allocs/op |"
            echo "|---|---:|---:|---:|"
            awk -F'\t' '{printf "| `%s` | %s | %s | %s |\n", $1, $2, $3, $4}' bench-stats-translation.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run load tests
        run: |
          go test ./internal/proxy/ -run "TestLoad" -v -timeout=120s -count=1 \
            | tee load-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: benchmarks
          path: |
            bench-results.txt
            bench-label-fields.txt
            bench-label-fields.tsv
            bench-patterns.txt
            bench-patterns.tsv
            bench-cache.txt
            bench-cache.tsv
            bench-stats-translation.txt
            bench-stats-translation.tsv
            load-results.txt

      - name: Check for performance regressions
        run: |
          # Extract key metrics and fail if below thresholds
          echo "=== Benchmark Summary ==="
          grep "Benchmark" bench-results.txt | head -10

          echo ""
          echo "=== Load Test Summary ==="
          grep -E "Throughput|Errors|Live heap" load-results.txt

          # Fail if high-concurrency test has errors
          if grep -q "Errors: [1-9]" load-results.txt; then
            echo "FAIL: Load test had errors"
            exit 1
          fi

  conformance:
    name: conformance
    # Downstream of `test`: its unit results feed the evidence check, so this job
    # does not run the unit tests again (only the few that differ under -race). Like every job that needs `test` it is
    # skipped when `test` fails or is skipped.
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # Unit results feed the evidence check: an item whose state claims
      # `proven` must have a test that declares it and passed in this run (the
      # `test` job's run, under -race).
      - name: Unit test results of the test job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: unit-results
          path: unit-results

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true

      # A few tests skip or assert less under the race detector (the metadata scan
      # simulations, the buffered-read allocation bounds): they run once more here,
      # plain, and their outcome replaces the -race one in the gate, as when this job
      # ran every unit test without -race.
      - name: Tests that behave differently under the race detector
        # The gate decides; this step only names the failing tests.
        run: |
          scripts/ci/race_sensitive_tests.sh unit-results/race-sensitive.json || \
            echo "::warning::tests run without the race detector failed; the conformance gate decides whether that matters"

      - name: Conformance gate
        run: python3 scripts/ci/check_conformance.py --go-results unit-results/unit-results.json --go-results unit-results/race-sensitive.json

      - name: Visual-proof harness unit tests (plan, gate and comment, publish)
        run: python3 -m unittest discover -s bench/visual/tests

      - name: Differential parity harness unit tests (corpus, diff, clusters)
        run: python3 -m unittest discover -s bench/parity/tests

      - name: Registry report for this change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python3 conformance/scripts/pr_report.py --base "origin/$BASE_REF" \
            | tee "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: gofmt -s (Go Report Card parity)
        run: |
          unformatted=$(find . -name "*.go" -not -path "*/vendor/*" -not -path "*/node_modules/*" -print0 | xargs -0 gofmt -s -l)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.14.0
          args: --timeout=5m

      # The checks below verify the infra itself. They run on every pull
      # request, so a pull request that skips the product jobs is still checked.
      - name: Verify dashboard and alerting assets are synced to chart
        run: ./scripts/ci/sync_observability_assets.sh --check

      - name: Unit tests (quality gate policy)
        run: python3 -m unittest scripts.ci.tests.test_check_quality_gate scripts.ci.tests.test_collect_quality_metrics scripts.ci.tests.test_check_changelog_pr scripts.ci.tests.test_commit_via_api scripts.ci.tests.test_workflow_pins scripts.ci.tests.test_tool_pins scripts.ci.tests.test_release_pr_validation scripts.ci.tests.test_change_scope scripts.ci.tests.test_scope_wiring scripts.ci.tests.test_go_toolchain_pins scripts.ci.tests.test_race_sensitive_tests scripts.ci.tests.test_collect_release_assets scripts.ci.tests.test_scan_release_image scripts.ci.tests.test_cancel_conflicted_pr_runs scripts.ci.tests.test_conformance_scope scripts.ci.tests.test_check_conformance_reports

      # bench/ is a separate Go module, so the root ./... of the test job does not
      # cover it. Its tests include the drift guard that keeps the benchmark Loki
      # configs equal to the CI one, the only check a change to those configs has.
      - name: Benchmark harness vet and tests (bench module)
        working-directory: bench
        run: |
          go vet ./...
          go test ./... -count=1 -race

      # The A/B harness is proved by perf-smoke, which a change to it runs; its unit
      # tests run here so that a pull request that skips the Go jobs still runs them.
      - name: A/B harness unit tests (selection, PR comment, history)
        run: python3 -m unittest discover -s bench/ab/tests

      - name: Verify generated configuration and limits reference
        run: go run ./cmd/configdoc -check

      - name: README support policy matches the VictoriaLogs version matrix
        run: go test ./internal/logsql -run '^TestVictoriaLogsSupportPolicy$' -count=1

      - name: Validate Docker Compose files
        run: ./scripts/ci/validate_compose.sh

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t loki-vl-proxy:test .

      - name: Verify binary runs
        run: |
          docker run --rm loki-vl-proxy:test -help 2>&1 || true

  e2e-compat-group:
    runs-on: ubuntu-latest
    needs: [scope, test, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.scope.outputs.product == 'false' && needs.scope.outputs.stack == 'true')) }}
    env:
      PROXY_IMAGE: loki-vl-proxy:e2e-ci
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: core
            pattern: '^(TestSetup_IngestLogs|TestCompat_.*|TestExtended_.*|TestChaining_.*|TestAlertingCompat_.*|TestExplore_HTTPQueryRangeContracts|TestLokiFunctions_.*|TestGrafanaDatasourceCatalogAndHealth|TestProxyCompatibilitySurface|TestPinnedCompatibilityMatrixMatchesCompose)$'
          - name: drilldown
            pattern: '^(TestSetup_IngestLogs|TestDrilldown_.*|TestFeature_(IndexStats|IndexVolume|IndexVolumeRange|DrilldownClusterLevelOrFilters|MultitenantDrilldownClusterLevelOrFilters)|TestDrilldownTrackScore|TestLokiTrackScore|TestVLTrackScore)$'
          - name: otel-edge
            pattern: '^(TestSetup_IngestEdgeCaseData|TestSetup_IngestRichData|TestOTel.*|TestStructuredMetadata_.*|TestQueryDirection_UnderscoreProxy|TestDetectedFields_UnderscoreProxy|TestSeries_UnderscoreProxy|TestMixedLabels_UnderscoreProxy|TestLokiVsProxy_LabelParity|TestGrafanaDrilldown_UnderscoreProxy|TestLabelDeduplication|TestLabelTranslation_EdgeCases|TestOTelCompatibilityScore|TestEdge_.*|TestComplex_.*)$'
          - name: tail-multitenancy
            pattern: '^(TestSetup_IngestLogs|TestFeature_Multitenancy_.*|TestVLCapability_ExtraStreamFiltersTenantSemantics|TestHardeningLive_TenantLabel.*|TestFeature_AdminDebugEndpoints_DefaultClosed|TestFeature_Tail_.*|TestFeature_QueryAnalytics_Endpoint|TestFeature_SecurityHeaders|TestFeature_MetricsEndpoint|TestFeature_GzipCompression|TestFeature_NoGzipWithoutAccept|TestFeature_DerivedFields_TraceIDInJSON|TestFeature_ResponseStructureConsistency|TestFeature_QueryRange_vs_Query_Consistency|TestFeature_InstantVectorExpression_Compatibility|TestEdge_ConcurrentIdenticalQueries|TestEdge_LongQueryString|TestEdge_CombinedFilterTypes|TestEdge_EmptyResults|TestEdge_RapidSequentialQueries|TestEdge_InstantQuery)$'
          - name: semantics
            pattern: '^(TestSetup_IngestLogs|TestQuerySemanticsMatrixManifest|TestQuerySemanticsOperationsInventory|TestQuerySemanticsMatrix|TestGrafanaClickout_.*|TestMissingOps_.*|TestRangeMetricCompatibility.*|TestLogQL_Exhaustive_.*|TestPipeline_.*|TestEdge_DropErrorInstantQueryReturnsAggregatedResult|TestEdge_DetectedFieldsAfterJsonDropPipelineIncludesJsonFields)$'
    name: e2e-compat (${{ matrix.group.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published

      # Built once by the `image` job.
      - name: Download proxy image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: proxy-image
          path: ${{ runner.temp }}/proxy-image

      - name: Load proxy image
        run: |
          docker load --input "$RUNNER_TEMP/proxy-image/proxy-image.tar"
          docker tag loki-vl-proxy:ci "$PROXY_IMAGE"

      - name: Start e2e stack
        working-directory: test/e2e-compat
        run: |
          docker compose up -d --no-build
          ../../scripts/ci/wait_e2e_stack.sh 180

      - name: Run compatibility tests
        id: compat
        env:
          GROUP_PATTERN: ${{ matrix.group.pattern }}
        run: |
          set -euo pipefail
          # 10 min: parity tests wait up to 90 s each for a fresh Loki to answer
          # range metric queries for their new streams (Loki's fresh-stack blank
          # window); two such waits plus the rest of `core` overran 5 min.
          OUTPUT="$(go test -v -tags=e2e -timeout=600s -count=1 -run "$GROUP_PATTERN" ./test/e2e-compat/ 2>&1)" || status=$?
          status="${status:-0}"
          echo "$OUTPUT"
          # Extract all compatibility scores and compute overall
          SCORES=$(echo "$OUTPUT" | grep -oP 'Score: \K\d+/\d+ \(\d+\.\d+%\)' || true)
          TOTAL_PASS=0
          TOTAL_ALL=0
          if [ -n "$SCORES" ]; then
            while IFS= read -r line; do
              PASS=$(echo "$line" | grep -oP '^\d+')
              ALL=$(echo "$line" | grep -oP '/\K\d+')
              TOTAL_PASS=$((TOTAL_PASS + PASS))
              TOTAL_ALL=$((TOTAL_ALL + ALL))
            done <<< "$SCORES"
          fi
          if [ "$TOTAL_ALL" -gt 0 ]; then
            PCT=$(echo "scale=1; $TOTAL_PASS * 100 / $TOTAL_ALL" | bc)
            echo "COMPAT_PCT=${PCT}%" >> "$GITHUB_OUTPUT"
            echo "COMPAT_DETAIL=${TOTAL_PASS}/${TOTAL_ALL}" >> "$GITHUB_OUTPUT"
            echo "Compatibility: ${TOTAL_PASS}/${TOTAL_ALL} (${PCT}%)"
          else
            echo "COMPAT_PCT=N/A" >> "$GITHUB_OUTPUT"
            echo "COMPAT_DETAIL=no tests ran" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Tear down e2e stack
        if: always()
        working-directory: test/e2e-compat
        run: docker compose down -v

  e2e-compat:
    runs-on: ubuntu-latest
    needs: [scope, e2e-compat-group]
    # The groups are skipped, and that is a pass, only when the scope job says
    # no stack path changed (and so no product path either). A skipped group on
    # a product or stack pull request (for example because `test` failed) or an
    # empty scope output fails the gate.
    if: always()
    steps:
      - name: Aggregate grouped compat result
        env:
          GROUP_RESULT: ${{ needs.e2e-compat-group.result }}
          PRODUCT: ${{ needs.scope.outputs.product }}
          STACK: ${{ needs.scope.outputs.stack }}
        run: |
          if [ "$GROUP_RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$GROUP_RESULT" = "skipped" ] && [ "$PRODUCT" = "false" ] && [ "$STACK" = "false" ]; then
            echo "Skipped: no stack or product path changed"
            exit 0
          fi
          echo "One or more grouped e2e-compat checks did not pass: $GROUP_RESULT (scope product=$PRODUCT stack=$STACK)"
          exit 1

  e2e-fleet:
    runs-on: ubuntu-latest
    needs: [scope, test, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.scope.outputs.product == 'false' && needs.scope.outputs.stack == 'true')) }}
    env:
      PROXY_IMAGE: loki-vl-proxy:fleet-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published

      # Built once by the `image` job.
      - name: Download proxy image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: proxy-image
          path: ${{ runner.temp }}/proxy-image

      - name: Load proxy image
        run: |
          docker load --input "$RUNNER_TEMP/proxy-image/proxy-image.tar"
          docker tag loki-vl-proxy:ci "$PROXY_IMAGE"

      - name: Start 3-proxy fleet with VictoriaLogs and Loki
        working-directory: test/e2e-fleet
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          docker compose ps

      # TestFleetPeerCacheProof restarts and recreates the proxies itself with
      # `docker compose` from test/e2e-fleet (same project as the step above).
      - name: Run fleet cache tests
        env:
          FLEET_PROOF_REPORT: ${{ runner.temp }}/fleet-peer-cache-proof.json
        run: go test -v -tags=e2e -timeout=20m -run '^(TestFleetSmoke_QueryRangeWarmHitIncrementsCacheMetrics|TestFleetPeerCacheProof|TestFleet_QueryRangeSettledStepsReachPeers)$' ./test/e2e-fleet/

      - name: Upload fleet peer cache proof report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: fleet-peer-cache-proof
          path: ${{ runner.temp }}/fleet-peer-cache-proof.json
          if-no-files-found: ignore

      - name: Fleet logs on failure
        if: failure()
        working-directory: test/e2e-fleet
        run: docker compose --profile edge logs --no-color --tail=300

      - name: Tear down fleet
        if: always()
        working-directory: test/e2e-fleet
        run: docker compose --profile edge down -v

  e2e-ui:
    runs-on: ubuntu-latest
    needs: [scope, test, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.scope.outputs.product == 'false' && needs.scope.outputs.stack == 'true')) }}
    env:
      PROXY_IMAGE: loki-vl-proxy:e2e-ui
    strategy:
      fail-fast: false
      matrix:
        # Each shard pays for a stack start (about 70 s), so the 9 former shards
        # (one tag or spec each) are merged into 5 that keep the same tests: the
        # critical path stays explore-core. `commands` holds one `playwright test`
        # option list per line; the shards together select exactly the tests the 9
        # selected before (checked with `playwright test --list`).
        shard:
          - name: explore-core
            commands: |
              --grep @explore-core
          - name: regression-datasource
            commands: |
              --grep @regression
              tests/datasource.spec.ts
          - name: drilldown-core-tail
            commands: |
              --grep @drilldown-core|@explore-tail
          - name: comprehensive-drilldown-mt
            commands: |
              --grep @comprehensive-ui|@drilldown-mt
          - name: ops-mt
            commands: |
              --grep @explore-ops|@explore-mt
    name: e2e-ui (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
          cache: npm  # zizmor: ignore[cache-poisoning] test dependencies only; nothing from this job is published
          cache-dependency-path: test/e2e-ui/package-lock.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6  # zizmor: ignore[cache-poisoning] Playwright browser cache; nothing from this job is published
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('test/e2e-ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-

      # Built once by the `image` job.
      - name: Download proxy image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: proxy-image
          path: ${{ runner.temp }}/proxy-image

      - name: Load proxy image
        run: |
          docker load --input "$RUNNER_TEMP/proxy-image/proxy-image.tar"
          docker tag loki-vl-proxy:ci "$PROXY_IMAGE"

      - name: Start e2e stack (with log generator for UI tests)
        working-directory: test/e2e-compat
        run: |
          docker compose --profile ui up -d --no-build
          ../../scripts/ci/wait_e2e_stack.sh 180

      - name: Resolve UI browser
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "PLAYWRIGHT_EXECUTABLE_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
            echo "Using runner browser at $CHROME_BIN"
          else
            echo "No system Chrome/Chromium binary found; falling back to Playwright browser download"
          fi

      - name: Install UI test dependencies
        working-directory: test/e2e-ui
        run: |
          npm ci
          if [ -z "${PLAYWRIGHT_EXECUTABLE_PATH:-}" ]; then
            npx playwright install chromium
          fi

      - name: Run Grafana UI e2e tests
        working-directory: test/e2e-ui
        env:
          GRAFANA_URL: http://127.0.0.1:3002
          PROXY_URL: http://127.0.0.1:13100
          SHARD_COMMANDS: ${{ matrix.shard.commands }}
        run: |
          # Each line of the shard's commands is a short option list (for example
          # --grep @regression): split it into words, then pass each word through
          # quoted. One `playwright test` run per line; every line runs even when an
          # earlier one failed, and the step fails if any did. With more than one
          # line, each run keeps its report and results in its own run-N folder.
          status=0
          count="$(grep -c . <<< "$SHARD_COMMANDS")"
          n=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            n=$((n + 1))
            read -r -a shard_args <<< "$line"
            if [ "$count" -gt 1 ]; then
              PLAYWRIGHT_HTML_REPORT="playwright-report/run-$n" npx playwright test --output="test-results/run-$n" "${shard_args[@]}" || status=$?
            else
              npx playwright test "${shard_args[@]}" || status=$?
            fi
          done <<< "$SHARD_COMMANDS"
          exit "$status"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: playwright-report-${{ matrix.shard.name }}
          path: |
            test/e2e-ui/playwright-report
            test/e2e-ui/test-results
          if-no-files-found: ignore

      - name: Tear down e2e stack
        if: always()
        working-directory: test/e2e-compat
        run: docker compose down -v

  stress-tests:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Stress tests (concurrency + race detector)
        run: |
          go test -tags=stress -race -parallel=16 -timeout=120s -v ./internal/proxy/ \
            -run '^(TestTranslation|TestCoalescer|TestRangeMetric)' \
            | tee stress-results.txt

      - name: Upload stress test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: stress-results
          path: stress-results.txt

  memory-leak-tests:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Memory-leak tests (bounded heap growth + race detector)
        run: |
          go test -tags=memleak -race -run 'TestMemLeak_' -timeout=10m -v ./internal/proxy/ \
            | tee memleak-results.txt

      - name: Upload memory-leak test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: memleak-results
          path: memleak-results.txt

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Helm lint
        run: helm lint charts/loki-vl-proxy/

      - name: Helm template quoted args regression
        run: helm template loki-vl-proxy charts/loki-vl-proxy -f scripts/ci/helm-quoted-args-values.yaml >/dev/null

      - name: Helm template env alias regression
        run: helm template loki-vl-proxy charts/loki-vl-proxy -f scripts/ci/helm-env-alias-values.yaml >/dev/null

      - name: Helm ↔ binary flag parity
        run: ./scripts/ci/validate_helm_flags.sh

      - name: Helm existingSecret values
        run: ./scripts/ci/validate_helm_secrets.sh
