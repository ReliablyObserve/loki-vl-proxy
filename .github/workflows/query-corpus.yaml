name: Query Corpus

# Builds the query corpus of main from one full, uncached test run: every query
# a test or a client sends in, with the tests it comes from, the LogsQL sent to
# VictoriaLogs, the goldens and a summary of the counts. The PR quality report
# compares a PR's corpus with the one cached here for its base commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: query-corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corpus:
    name: Build the query corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.4"
          cache: true
          # The VictoriaLogs parse oracle is a module of its own; its downloads join the cache.
          cache-dependency-path: |
            go.sum
            test/oracle/vl/go.sum
            test/oracle/vl/go.v*.sum
            test/oracle/loki/go.sum

      # The same test run as the PR quality report (go test ./... -count=1), so
      # a PR's corpus and its base corpus come from the same set of tests.
      - name: Record the queries the tests send in
        env:
          LVP_QUERY_CORPUS_DIR: /tmp/query-corpus-capture
        run: |
          mkdir -p "$LVP_QUERY_CORPUS_DIR"
          # internal/proxy alone runs about 10 minutes on a hosted runner, Go's default per-binary timeout.
          go test -tags corpuscapture ./... -count=1 -timeout=30m

      - name: Build the corpus
        env:
          LVP_QUERY_CORPUS_DIR: /tmp/query-corpus-capture
          LVP_QUERY_CORPUS_OUT: /tmp/query-corpus/query-corpus.jsonl.gz
        run: |
          mkdir -p /tmp/query-corpus
          go test ./internal/querycorpus -run '^TestBuildQueryCorpus$' -count=1 -v | tee -a "$GITHUB_STEP_SUMMARY"

      # VictoriaLogs' own parser on the goldens, the sent LogsQL and its test cases, per matrix version. The
      # verdicts sit beside the corpus, so pull requests based on this commit compare with them.
      - name: Check the corpus with VictoriaLogs' and Loki's parsers
        # The corpus is still saved when an oracle fails: pull requests then compare without its verdicts.
        continue-on-error: true
        env:
          LVP_RUN_ORACLES: "1"
          LVP_QUERY_CORPUS_OUT: /tmp/query-corpus/query-corpus.jsonl.gz
        run: |
          go test ./internal/querycorpus -run '^TestVLOracle$' -count=1 -v
          go test ./internal/proxy -run '^TestLokiOracle$' -count=1 -v
          # The Loki differential of log queries: the live oracles must answer what its recorded answers hold.
          LVP_LOKI_DIFF_CHECK=1 go test ./internal/querycorpus -run '^TestPlanMatchesLokiOnLogQueries$' -count=1 -v
          # The Loki differential of metric queries: Loki's engine and VictoriaLogs' own query handlers must answer
          # what its recorded answers hold.
          LVP_LOKI_DIFF_CHECK=1 go test ./internal/querycorpus -run '^TestPlanMatchesLokiOnMetricQueries$' -count=1 -v -timeout=30m
          # The grammar sweep records Loki's and VictoriaLogs' answers to the queries enumerated from the LogQL
          # grammar again and compares them with conformance/registry/grammar-sweep.json (the default size, which
          # fails when a recording no longer matches the known differences), then sweeps the nightly size and
          # reports it (the full recordings are not committed).
          go test ./internal/querycorpus -run '^TestGrammarSweep$' -count=1 -v
          LVP_GRAMMAR_SWEEP_SIZE=full go test ./internal/querycorpus -run '^TestGrammarSweep$' -count=1 -v

      - name: Save the corpus for pull requests based on this commit
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6  # zizmor: ignore[cache-poisoning] a gzipped list of test queries read as data by the PR quality report; nothing from this job is published
        with:
          path: /tmp/query-corpus
          key: query-corpus-v1-${{ github.sha }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: query-corpus
          path: |
            /tmp/query-corpus/query-corpus.jsonl.gz
            /tmp/query-corpus/query-corpus.summary.json
            /tmp/query-corpus/query-corpus.vl-*.jsonl.gz
            /tmp/query-corpus/query-corpus.vl-*.constructs.json
            /tmp/query-corpus/query-corpus.loki-*
