name: VictoriaLogs Compatibility

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "docs/observability.md"
      - "charts/loki-vl-proxy/Chart.yaml"
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * 1"

permissions:
  contents: read

jobs:
  scope:
    name: scope
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/change-scope.yaml  # zizmor: ignore[self-repository] workspace-relative form, as the workflow pin test and the pinned actionlint expect

  vl-matrix-source:
    runs-on: ubuntu-latest
    outputs:
      vl_versions: ${{ steps.matrix.outputs.vl_versions }}
      pinned_loki_image: ${{ steps.matrix.outputs.pinned_loki_image }}
      pinned_vl_image: ${{ steps.matrix.outputs.pinned_vl_image }}
      pinned_grafana_image: ${{ steps.matrix.outputs.pinned_grafana_image }}
      vl_image_repo: ${{ steps.matrix.outputs.vl_image_repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - id: matrix
        run: |
          set -euo pipefail
          m=test/e2e-compat/compatibility-matrix.json
          vl_versions=$(jq -ce '.stack.victorialogs.matrix_versions' "$m")
          pinned_loki_image=$(jq -er '.stack.loki | select(.image_repo and .pinned_version) | "\(.image_repo):\(.pinned_version)"' "$m")
          pinned_vl_image=$(jq -er '.stack.victorialogs | select(.image_repo and .pinned_version) | "\(.image_repo):\(.pinned_version)"' "$m")
          pinned_grafana_image=$(jq -er '.stack.grafana | select(.image_repo and .pinned_version) | "\(.image_repo):\(.pinned_version)"' "$m")
          vl_image_repo=$(jq -er '.stack.victorialogs.image_repo | select(. != null)' "$m")
          {
            echo "vl_versions=$vl_versions"
            echo "pinned_loki_image=$pinned_loki_image"
            echo "pinned_vl_image=$pinned_vl_image"
            echo "pinned_grafana_image=$pinned_grafana_image"
            echo "vl_image_repo=$vl_image_repo"
          } >> "$GITHUB_OUTPUT"

  vl-pinned:
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.vl-matrix-source.result == 'success' && (needs.scope.outputs.stack != 'false' || contains(format(',{0},', needs.scope.outputs.jobs), ',compat-vl/vl-pinned,')) }}
    needs: [vl-matrix-source, scope]
    runs-on: ubuntu-latest
    env:
      LOKI_IMAGE: ${{ needs.vl-matrix-source.outputs.pinned_loki_image }}
      VICTORIALOGS_IMAGE: ${{ needs.vl-matrix-source.outputs.pinned_vl_image }}
      GRAFANA_IMAGE: ${{ needs.vl-matrix-source.outputs.pinned_grafana_image }}
      PROXY_IMAGE: loki-vl-proxy:compat-vl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.PROXY_IMAGE }}
          load: true
          cache-from: type=gha,scope=compat-proxy
          cache-to: type=gha,mode=max,scope=compat-proxy
      - name: Start pinned stack
        working-directory: test/e2e-compat
        run: |
          docker compose up -d --no-build
          ../../scripts/ci/wait_e2e_stack.sh 180
      - name: Run VictoriaLogs compatibility score
        run: go test -v -tags=e2e -run '^(TestVLTrackScore|TestVLCapability_.*)$' ./test/e2e-compat/
      - name: Tear down pinned stack
        if: always()
        working-directory: test/e2e-compat
        run: docker compose down -v

  vl-matrix:
    # Weekly, and on demand (workflow_dispatch) so a compose or matrix change can
    # be validated across every supported VictoriaLogs version before it ships.
    # Also on a baseline run (change scope: the `baseline` label, or a big shipped
    # diff on a pull request into main): the whole version matrix, not only the
    # pinned tuple. An empty or failed scope output is not "true", so a doubt runs
    # nothing extra.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.scope.outputs.baseline == 'true'
    needs: [vl-matrix-source, scope]
    runs-on: ubuntu-latest
    # Each version runs the range-metric table on top of the compatibility
    # checks; bound a hung stack well below the 6 hour default.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        vl_version: ${{ fromJson(needs.vl-matrix-source.outputs.vl_versions) }}
    env:
      LOKI_IMAGE: ${{ needs.vl-matrix-source.outputs.pinned_loki_image }}
      GRAFANA_IMAGE: ${{ needs.vl-matrix-source.outputs.pinned_grafana_image }}
      PROXY_IMAGE: loki-vl-proxy:compat-vl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.PROXY_IMAGE }}
          load: true
          cache-from: type=gha,scope=compat-proxy
          cache-to: type=gha,mode=max,scope=compat-proxy
      - name: Start matrix stack
        working-directory: test/e2e-compat
        env:
          VICTORIALOGS_IMAGE: ${{ format('{0}:{1}', needs.vl-matrix-source.outputs.vl_image_repo, matrix.vl_version) }}
        run: |
          docker compose up -d --no-build
          ../../scripts/ci/wait_e2e_stack.sh 180
      - name: Run VictoriaLogs compatibility score
        env:
          VICTORIALOGS_IMAGE: ${{ format('{0}:{1}', needs.vl-matrix-source.outputs.vl_image_repo, matrix.vl_version) }}
        # The score plus the checks whose outcome depends on how the
        # VictoriaLogs version words or stores things: OTLP severity as
        # detected_level, the status of rejected queries (parse errors), and the
        # range-metric table compared with Loki (bucket edges, offsets, unwrap).
        run: go test -v -tags=e2e -timeout=25m -run '^(TestSetup_IngestLogs|TestVLTrackScore|TestVLCapability_.*|TestCompat_DetectedLevelQueryRange|TestCompat_RejectedQueryStatusParity|TestCompat_Unwrap.*|TestRangeMetric.*|TestGrafanaClickout_.*)$' ./test/e2e-compat/
      - name: Tear down matrix stack
        if: always()
        working-directory: test/e2e-compat
        env:
          VICTORIALOGS_IMAGE: ${{ format('{0}:{1}', needs.vl-matrix-source.outputs.vl_image_repo, matrix.vl_version) }}
        run: docker compose down -v
