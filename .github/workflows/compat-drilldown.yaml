name: Logs Drilldown Compatibility

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "docs/observability.md"
      - "charts/loki-vl-proxy/Chart.yaml"
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 1"

permissions:
  contents: read

jobs:
  scope:
    name: scope
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/change-scope.yaml  # zizmor: ignore[self-repository] workspace-relative form, as the workflow pin test and the pinned actionlint expect

  drilldown-matrix-source:
    runs-on: ubuntu-latest
    outputs:
      drilldown_versions: ${{ steps.matrix.outputs.drilldown_versions }}
      grafana_runtime_profiles: ${{ steps.matrix.outputs.grafana_runtime_profiles }}
      grafana_pr_runtime_profiles: ${{ steps.matrix.outputs.grafana_pr_runtime_profiles }}
      pinned_loki_image: ${{ steps.matrix.outputs.pinned_loki_image }}
      pinned_vl_image: ${{ steps.matrix.outputs.pinned_vl_image }}
      pinned_grafana_image: ${{ steps.matrix.outputs.pinned_grafana_image }}
      grafana_image_repo: ${{ steps.matrix.outputs.grafana_image_repo }}
      plugins_preinstall: ${{ steps.matrix.outputs.plugins_preinstall }}
      vl_datasource_plugin: ${{ steps.matrix.outputs.vl_datasource_plugin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - id: matrix
        run: |
          set -euo pipefail
          m=test/e2e-compat/compatibility-matrix.json
          drilldown_versions=$(jq -ce '.stack.logs_drilldown_contract.matrix_versions' "$m")
          grafana_runtime_profiles=$(jq -ce '.stack.grafana.runtime_profiles' "$m")
          grafana_pr_runtime_profiles=$(jq -ce '.stack.grafana.runtime_profiles | map(select((.run_on_pr // false) == true))' "$m")
          pinned_loki_image=$(jq -er '.stack.loki | select(.image_repo and .pinned_version) | "\(.image_repo):\(.pinned_version)"' "$m")
          pinned_vl_image=$(jq -er '.stack.victorialogs | select(.image_repo and .pinned_version) | "\(.image_repo):\(.pinned_version)"' "$m")
          pinned_grafana_image=$(jq -er '.stack.grafana | select(.image_repo and .pinned_version) | "\(.image_repo):\(.pinned_version)"' "$m")
          grafana_image_repo=$(jq -er '.stack.grafana.image_repo | select(. != null)' "$m")
          plugins_preinstall=$(jq -er '.stack.grafana.plugins | select(. != null) | to_entries | map("\(.key)@\(.value.pinned_version)") | join(",")' "$m")
          vl_datasource_plugin=$(jq -er '.stack.grafana.plugins["victoriametrics-logs-datasource"].pinned_version | select(. != null) | "victoriametrics-logs-datasource@\(.)"' "$m")
          {
            echo "drilldown_versions=$drilldown_versions"
            echo "grafana_runtime_profiles=$grafana_runtime_profiles"
            echo "grafana_pr_runtime_profiles=$grafana_pr_runtime_profiles"
            echo "pinned_loki_image=$pinned_loki_image"
            echo "pinned_vl_image=$pinned_vl_image"
            echo "pinned_grafana_image=$pinned_grafana_image"
            echo "grafana_image_repo=$grafana_image_repo"
            echo "plugins_preinstall=$plugins_preinstall"
            echo "vl_datasource_plugin=$vl_datasource_plugin"
          } >> "$GITHUB_OUTPUT"

  drilldown-pinned-runtime:
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.drilldown-matrix-source.result == 'success' && (needs.scope.outputs.stack != 'false' || contains(format(',{0},', needs.scope.outputs.jobs), ',compat-drilldown/drilldown-pinned-runtime,')) }}
    needs: [drilldown-matrix-source, scope]
    runs-on: ubuntu-latest
    env:
      LOKI_IMAGE: ${{ needs.drilldown-matrix-source.outputs.pinned_loki_image }}
      VICTORIALOGS_IMAGE: ${{ needs.drilldown-matrix-source.outputs.pinned_vl_image }}
      GRAFANA_IMAGE: ${{ needs.drilldown-matrix-source.outputs.pinned_grafana_image }}
      GRAFANA_PLUGINS_PREINSTALL: ${{ needs.drilldown-matrix-source.outputs.plugins_preinstall }}
      PROXY_IMAGE: loki-vl-proxy:compat-drilldown
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.4"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.PROXY_IMAGE }}
          load: true
          cache-from: type=gha,scope=compat-proxy
          cache-to: type=gha,mode=max,scope=compat-proxy
      - name: Start pinned stack
        working-directory: test/e2e-compat
        run: |
          docker compose up -d --no-build
          ../../scripts/ci/wait_e2e_stack.sh 180
      - name: Run Drilldown compatibility score
        run: go test -v -tags=e2e -run '^TestDrilldownTrackScore$' ./test/e2e-compat/
      - name: Tear down pinned stack
        if: always()
        working-directory: test/e2e-compat
        run: docker compose down -v

  drilldown-grafana-pr-matrix:
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.drilldown-matrix-source.result == 'success' && (needs.scope.outputs.stack != 'false' || contains(format(',{0},', needs.scope.outputs.jobs), ',compat-drilldown/drilldown-grafana-pr-matrix,')) }}
    needs: [drilldown-matrix-source, scope]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.drilldown-matrix-source.outputs.grafana_pr_runtime_profiles) }}
    env:
      LOKI_IMAGE: ${{ needs.drilldown-matrix-source.outputs.pinned_loki_image }}
      VICTORIALOGS_IMAGE: ${{ needs.drilldown-matrix-source.outputs.pinned_vl_image }}
      GRAFANA_IMAGE: ${{ format('{0}:{1}', needs.drilldown-matrix-source.outputs.grafana_image_repo, matrix.version) }}
      # A runtime profile may name the Logs Drilldown version its Grafana family can run (drilldown_plugin_version);
      # every other profile preinstalls the plugin pins of stack.grafana.plugins.
      GRAFANA_PLUGINS_PREINSTALL: ${{ matrix.drilldown_plugin_version && format('{0},grafana-lokiexplore-app@{1}', needs.drilldown-matrix-source.outputs.vl_datasource_plugin, matrix.drilldown_plugin_version) || needs.drilldown-matrix-source.outputs.plugins_preinstall }}
      PROXY_IMAGE: loki-vl-proxy:compat-drilldown
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.4"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.PROXY_IMAGE }}
          load: true
          cache-from: type=gha,scope=compat-proxy
          cache-to: type=gha,mode=max,scope=compat-proxy
      - name: Start Grafana ${{ matrix.profile }} stack (${{ matrix.version }})
        working-directory: test/e2e-compat
        run: |
          docker compose up -d --no-build
          ../../scripts/ci/wait_e2e_stack.sh 180
      - name: Run Grafana ${{ matrix.profile }} profile
        env:
          TEST_REGEX: ${{ matrix.test_regex }}
        run: go test -v -tags=e2e -run "$TEST_REGEX" ./test/e2e-compat/
      - name: Tear down Grafana ${{ matrix.profile }} stack
        if: always()
        working-directory: test/e2e-compat
        run: docker compose down -v

  drilldown-contract-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: drilldown-matrix-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        drilldown_version: ${{ fromJson(needs.drilldown-matrix-source.outputs.drilldown_versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Check Drilldown app contracts
        env:
          DRILLDOWN_VERSION: ${{ matrix.drilldown_version }}
        run: bash scripts/compat/check-drilldown-contracts.sh "$DRILLDOWN_VERSION"

  drilldown-grafana-runtime-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: drilldown-matrix-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.drilldown-matrix-source.outputs.grafana_runtime_profiles) }}
    env:
      LOKI_IMAGE: ${{ needs.drilldown-matrix-source.outputs.pinned_loki_image }}
      VICTORIALOGS_IMAGE: ${{ needs.drilldown-matrix-source.outputs.pinned_vl_image }}
      GRAFANA_IMAGE: ${{ format('{0}:{1}', needs.drilldown-matrix-source.outputs.grafana_image_repo, matrix.version) }}
      # A runtime profile may name the Logs Drilldown version its Grafana family can run (drilldown_plugin_version);
      # every other profile preinstalls the plugin pins of stack.grafana.plugins.
      GRAFANA_PLUGINS_PREINSTALL: ${{ matrix.drilldown_plugin_version && format('{0},grafana-lokiexplore-app@{1}', needs.drilldown-matrix-source.outputs.vl_datasource_plugin, matrix.drilldown_plugin_version) || needs.drilldown-matrix-source.outputs.plugins_preinstall }}
      PROXY_IMAGE: loki-vl-proxy:compat-drilldown
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.4"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.PROXY_IMAGE }}
          load: true
          cache-from: type=gha,scope=compat-proxy
          cache-to: type=gha,mode=max,scope=compat-proxy
      - name: Start Grafana runtime stack (${{ matrix.profile }})
        working-directory: test/e2e-compat
        run: |
          docker compose up -d --no-build
          ../../scripts/ci/wait_e2e_stack.sh 180
      - name: Run Grafana runtime compatibility profile
        env:
          TEST_REGEX: ${{ matrix.test_regex }}
        run: go test -v -tags=e2e -run "$TEST_REGEX" ./test/e2e-compat/
      - name: Tear down Grafana runtime stack
        if: always()
        working-directory: test/e2e-compat
        run: docker compose down -v
