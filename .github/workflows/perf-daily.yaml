name: Perf daily

# Daily full A/B run from main: the last release, main and Loki on a fresh
# stack, every shape set over its ranges up to 24h. Results, the append-only
# history and the trend report are delivered through a bot pull request on
# the rolling branch bench/daily-perf (never pushed to main). See
# bench/ab/README.md.
#
# A scheduled run is skipped when nothing it measures changed on main since
# the commit the history's newest full measurement was taken at (an open daily
# PR's days included): no new run, no new or updated pull request. A manual
# dispatch always runs.
#
# The run compares each set's newest history line with the previous one and
# reports regressions, improvements and the ratchet (bench/ab/history/ratchet.json,
# rows as good as Loki) at the top of the daily pull request and in the job
# summary. A regression or a lost ratchet row turns the run red, which is the
# notification; nothing else is opened or labelled.
#
# A pull request that edits this pipeline runs a short validation instead
# (control set, 1h, 3 runs): it writes the files on the runner and shows the
# trend report in the job summary, but opens no pull request.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      sets:
        description: "comma-separated shape sets (empty: all)"
        required: false
        default: ""
      max_range:
        description: "longest range to run and seed"
        required: false
        default: "24h"
      runs:
        description: "runs per shape x range x target"
        required: false
        default: "7"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/perf-daily.yaml"
      - "bench/ab/daily.py"
      - "bench/ab/history.py"
      - "bench/ab/pr_smoke.py"
      - "bench/ab/stack.py"
      - "bench/ab/perf_matrix.py"
      - "bench/ab/report.py"
      - "bench/ab/docker-compose.ab.yml"
      - "test/e2e-compat/log-generator.py"

permissions:
  contents: read

concurrency:
  group: perf-daily-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests that edit the pipeline: a short run with a read-only token.
  validate:
    name: perf-daily
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OUT: /tmp/ab-daily
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Run the daily A/B (validation size)
        run: python3 bench/ab/daily.py --out "$OUT" --sets control --max-range 1h --runs 3

      - name: Publish trend
        if: always()
        run: |
          # Alerts are shown here and never fail a pull request's validation.
          if [ -f "$OUT/alerts.md" ]; then cat "$OUT/alerts.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f bench/ab/history/trend.md ]; then cat bench/ab/history/trend.md >> "$GITHUB_STEP_SUMMARY"; fi
          git status --short

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: perf-daily
          path: |
            ${{ env.OUT }}/*.json
            ${{ env.OUT }}/*.log
            ${{ env.OUT }}/*.md
            bench/ab/results/daily-*.json
            bench/ab/history/
          if-no-files-found: ignore

  daily:
    name: perf-daily
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
    env:
      OUT: /tmp/ab-daily
      BRANCH: bench/daily-perf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main
          # The baseline is the newest release tag; it builds from a worktree.
          fetch-depth: 0
          # The checkout only reads. The step that pushes gets the bot token as
          # a request header and nothing keeps a token in the git config.
          persist-credentials: false

      - name: Carry history an unmerged daily PR already holds
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          # History is append-only and only these PRs write it, so the open
          # branch's copy is main's plus the days not merged yet. Only the
          # lines: ratchet.json comes from main (a row removed there by hand
          # must not come back) plus what this run adds.
          HEADER="$(printf 'x-access-token:%s' "${READ_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${HEADER}"
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${HEADER}" fetch --no-tags origin "$BRANCH" 2>/dev/null; then
            git checkout FETCH_HEAD -- ':(glob)bench/ab/history/*.jsonl' || true
          fi

      - name: Skip when nothing measured changed
        id: measured
        if: github.event_name == 'schedule'
        run: |
          # What a day measures: the proxy's code, the harness and its shapes,
          # the stack Loki and VictoriaLogs run in, the seed and this workflow.
          # The daily reports, history, docs and Go test files are not part of it.
          MEASURED=(cmd internal pkg go.mod go.sum ':(exclude,glob)**/*_test.go'
                    bench/ab ':(exclude)bench/ab/results' ':(exclude)bench/ab/history'
                    ':(exclude)bench/ab/tests' ':(exclude)bench/ab/README.md'
                    test/e2e-compat/docker-compose.yml test/e2e-compat/loki-local-config.yaml
                    test/e2e-compat/log-generator.py .github/workflows/perf-daily.yaml)
          LAST="$(python3 bench/ab/history.py last-commit || true)"
          if [ -n "$LAST" ] && git cat-file -e "${LAST}^{commit}" 2>/dev/null \
             && git diff --quiet "$LAST" HEAD -- "${MEASURED[@]}"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: nothing measured changed on main since ${LAST:0:10}, the commit the last daily run measured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        if: steps.measured.outputs.run != 'false'
        with:
          go-version: "1.27.3"
          # No restored cache in the job that holds the bot token: nothing a pull
          # request or branch run saved can run inside it.
          cache: false

      - name: Run the daily A/B
        if: steps.measured.outputs.run != 'false'
        env:
          SETS: ${{ inputs.sets }}
          MAX_RANGE: ${{ inputs.max_range || '24h' }}
          RUNS: ${{ inputs.runs || '7' }}
        run: python3 bench/ab/daily.py --out "$OUT" --sets "$SETS" --max-range "$MAX_RANGE" --runs "$RUNS"

      - name: Publish trend
        if: always() && steps.measured.outputs.run != 'false'
        run: |
          if [ -f bench/ab/history/trend.md ]; then cat bench/ab/history/trend.md >> "$GITHUB_STEP_SUMMARY"; fi
          git status --short

      - name: Upload run artifacts
        if: always() && steps.measured.outputs.run != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: perf-daily
          path: |
            ${{ env.OUT }}/*.json
            ${{ env.OUT }}/*.log
            ${{ env.OUT }}/*.md
            bench/ab/results/daily-*.json
            bench/ab/history/
          if-no-files-found: ignore

      - name: Open or update the daily report PR
        id: pr
        if: steps.measured.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' && secrets.RELEASE_PR_TOKEN || github.token }}
          PUSH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' && secrets.RELEASE_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Run git against github.com with the token sent as a request header
          # for this one command. The token is never put in a URL or in the git
          # config, and the checkout above did not keep one.
          HEADER="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${HEADER}"
          # bench/ab/history includes trend.md and ratchet.json.
          FILES=(bench/ab/results bench/ab/history conformance/registry/generated/perf-evidence.json
                 conformance/reports/performance.md conformance/reports/gaps.md)
          # The job summary gets every alert; the pull request body (65,536
          # characters at most) the first of them.
          ALERTS=""
          if [ -f "$OUT/alerts.md" ]; then
            cat "$OUT/alerts.md" >> "$GITHUB_STEP_SUMMARY"
            ALERTS="$(cat "$OUT/alerts-body.md" 2>/dev/null || cat "$OUT/alerts.md")"
          fi
          if [ -z "$(git status --porcelain -- "${FILES[@]}")" ]; then
            echo "nothing changed"
            exit 0
          fi
          DATE="$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- "${FILES[@]}"
          git commit -m "bench: daily performance report ${DATE}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${HEADER}" push origin "$BRANCH" --force
          TITLE="bench: daily performance report ${DATE}"
          BODY="$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "$ALERTS" \
            "Daily A/B run from \`main\` ($(git rev-parse --short HEAD^1)): the last release vs \`main\` vs Loki direct on a fresh stack, every shape set over its ranges up to 24h." \
            "Updates \`bench/ab/results/daily-*.json\`, appends \`bench/ab/history/*.jsonl\`, regenerates \`bench/ab/history/trend.md\`, updates \`bench/ab/history/ratchet.json\` and the registry performance evidence. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "Merging keeps the history continuous; an unmerged day is carried into the next day's PR.")"
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
            PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          fi
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Arm auto-merge on the daily report PR
        if: steps.pr.outputs.number != ''
        env:
          # The bot token only: a pull request the job's own token opened does not
          # start the pull_request workflows, so it could not pass its checks.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Auto-merge merges the pull request by itself once the maintainer
          # approves it and the required checks pass. Nothing merges before that.
          # The report is already published as a PR: a problem here only warns.
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::RELEASE_PR_TOKEN is not configured; enable auto-merge on pull request #${PR_NUMBER} by hand"
            exit 0
          fi
          if ! gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash; then
            echo "::warning::could not arm auto-merge on pull request #${PR_NUMBER}; enable it by hand"
          fi

      - name: Fail on regressions
        # Also when the pull request step failed: the alerts are in $OUT, and
        # without them the step has nothing to do.
        if: ${{ !cancelled() && steps.measured.outputs.run != 'false' }}
        run: |
          # Red run = the notification. Regressions are transitions since the
          # previous run; a ratchet loss stays red until fixed or the row is
          # removed from ratchet.json by hand.
          [ -f "$OUT/alerts.json" ] || exit 0
          python3 - "$OUT/alerts.json" <<'PY'
          import json, sys
          a = json.load(open(sys.argv[1]))
          # GitHub shows ten annotations per step; the job summary has them all.
          shown = 0
          for key in ("regressions", "ratchet_lost"):
              for r in a[key]:
                  if shown < 10:
                      print(f"::error title=perf {key}::{r['set']} / {r['shape']} / {r['range']}: {r['detail']} ({r['commits']})")
                  shown += 1
          if shown > 10:
              print(f"{shown - 10} more in the job summary")
          sys.exit(1 if a["regressions"] or a["ratchet_lost"] else 0)
          PY
