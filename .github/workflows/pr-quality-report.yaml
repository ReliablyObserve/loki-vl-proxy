name: PR Quality Report

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# The report runs as parallel jobs that meet in `report` (the required check):
#   plan           - what this pull request needs measured (perf smoke, query corpus) and which test jobs run;
#   snapshot-tests - the unit tests with coverage of both trees, sharded like the CI test shards (the
#                    base tree's only when its saved count is missing);
#   snapshot-compat - the compatibility scores of both trees, one compose stack each;
#   head           - the PR's snapshot: merges its test shards, adds the compatibility scores and builds the
#                    query corpus and runs the oracles over it;
#   base           - the base commit's snapshot: its saved test count or merged test shards, and its scores;
#   perf           - the benchmarks and the load test of both trees, on one runner, because
#                    throughput and CPU timings are only comparable on the same machine;
#   report         - merges the snapshots, renders the report, enforces the gate and comments.
jobs:
  scope:
    name: scope
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/change-scope.yaml  # zizmor: ignore[self-repository] workspace-relative form, as the workflow pin test and the pinned actionlint expect

  plan:
    needs: [scope]
    # The base-vs-PR snapshots and load benchmarks measure runtime changes.
    # Forced CI on docs or workflow files does not need this report.
    if: ${{ !cancelled() && (needs.scope.outputs.evidence == 'true' || contains(format(',{0},', needs.scope.outputs.jobs), ',pr-quality-report/report,')) }}
    runs-on: ubuntu-latest
    outputs:
      run_perf: ${{ steps.perf-scope.outputs.run_perf }}
      query_corpus: ${{ steps.perf-scope.outputs.query_corpus }}
      tests_matrix: ${{ steps.tests-plan.outputs.matrix }}
      base_sharded: ${{ steps.tests-plan.outputs.base_sharded }}
      test_shards: ${{ steps.tests-plan.outputs.shards }}
      test_shard_count: ${{ steps.tests-plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect perf-sensitive scope
        id: perf-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          FILES="$(git diff --name-only "${BASE_SHA}..${HEAD_SHA}")"
          RUN_PERF=false
          if echo "$FILES" | grep -E '^(cmd/|internal/|pkg/)' | grep -Eqv '(_test\.go$|/testdata/)' \
            || echo "$FILES" | grep -Eq '^(go\.mod|go\.sum|Dockerfile|scripts/ci/(collect_quality_metrics\.sh|check_quality_gate\.py|load_abab\.py))$'; then
            RUN_PERF=true
          fi
          echo "run_perf=${RUN_PERF}" >> "$GITHUB_OUTPUT"
          # A PR that changes query code (the query plan included) or the tests and specs that send
          # queries (or the collection of the corpus itself) gets the query corpus built from its uncached test run, and the oracles run.
          QUERY_CORPUS=false
          if echo "$FILES" | grep -Eq '^(internal/(logql|logsql|translator|translate|proxy|querycorpus|queryplan|rulesmigrate)/|test/|conformance/registry/|bench/(ab|visual)/|scripts/ci/(collect_quality_metrics\.sh|go_test_unit\.sh|merge_unit_shards\.py|merge_coverprofile\.py|test_shards\.py|test-shard-weights\.tsv)$|\.github/workflows/pr-quality-report\.yaml$)'; then
            QUERY_CORPUS=true
          fi
          echo "query_corpus=${QUERY_CORPUS}" >> "$GITHUB_OUTPUT"
          {
            echo "### PR quality scope"
            if [ "${RUN_PERF}" = "true" ]; then
              echo "- perf smoke: enabled"
            else
              echo "- perf smoke: skipped (no perf-sensitive files changed)"
            fi
            if [ "${QUERY_CORPUS}" = "true" ]; then
              echo "- query corpus: enabled"
            else
              echo "- query corpus: skipped (no query code, tests or specs changed)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The base commit's test count and coverage depend only on that commit, so a later run of this pull request
      # against the same base reads them back from the cache (the base job). Only when they are not there is the
      # base tree's test suite run, in shards beside the PR's.
      - name: Look for the base commit's saved test count and coverage
        id: base-tests
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: /tmp/pr-base-tests.json
          key: pr-quality-base-tests-${{ hashFiles('scripts/ci/collect_quality_metrics.sh', 'scripts/ci/pr_evidence.py') }}-${{ github.event.pull_request.base.sha }}
          lookup-only: true

      # Shards 1-N each run a share of the top-level tests of internal/proxy and internal/querycorpus (the packages that
      # are nearly all of the time, split by scripts/ci/test_shards.py as in the CI test shards); `rest` runs every
      # other package. The snapshot jobs read the shard names from this job's output.
      - name: Plan the test shards
        id: tests-plan
        env:
          BASE_TESTS_CACHED: ${{ steps.base-tests.outputs.cache-hit }}
        run: |
          set -euo pipefail
          count=6
          trees='["head","base"]'
          base_sharded=true
          if [ "$BASE_TESTS_CACHED" = "true" ]; then
            trees='["head"]'
            base_sharded=false
          fi
          shards="rest $(seq -s ' ' 1 "$count")"
          {
            echo "count=${count}"
            echo "shards=${shards}"
            echo "base_sharded=${base_sharded}"
            echo "matrix=$(jq -nc --argjson trees "$trees" --arg shards "$shards" \
              '{include: [$trees[] as $t | ($shards | split(" "))[] as $s | {tree: $t, shard: $s}]}')"
          } >> "$GITHUB_OUTPUT"
          echo "- test shards: ${count} + rest; trees: ${trees}" >> "$GITHUB_STEP_SUMMARY"

  # The unit tests with coverage of a tree, in parallel jobs. Each job runs a share of the top-level tests of
  # internal/proxy and internal/querycorpus (or, for `rest`, every other package) through scripts/ci/go_test_unit.sh,
  # the runner of the CI test shards, without -race and with -count=1. The base tree's jobs run only when its saved
  # test count is missing (plan). A job does not fail when its tests do: it records the exit status of its `go test`
  # and the head and base jobs report the failure as the single collection did.
  snapshot-tests:
    name: snapshot-tests (${{ matrix.tree }} ${{ matrix.shard }})
    needs: [scope, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.tests_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.4"
          cache: true  # zizmor: ignore[cache-poisoning] test run only, nothing from this job is published

      - name: Check out the base commit
        if: matrix.tree == 'base'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git worktree add /tmp/loki-vl-proxy-base "$BASE_SHA"

      # The query corpus (the PR's tree only) is recorded by the same run: the corpuscapture build records every query
      # a test sends in, to one file per test binary, which the head job joins and builds the corpus from.
      - name: Run this shard's tests
        id: tests
        shell: bash
        env:
          TREE: ${{ matrix.tree }}
          UNIT_SHARD: ${{ matrix.shard }}
          UNIT_SHARDS: ${{ needs.plan.outputs.test_shard_count }}
          UNIT_RACE: "0"
          UNIT_COUNT1: "1"
          UNIT_TIMEOUT: 18m
          UNIT_TAGS: ${{ matrix.tree == 'head' && needs.plan.outputs.query_corpus == 'true' && 'corpuscapture' || '' }}
          # absolute: the runner changes into the tree under test
          UNIT_SHARD_DIR: ${{ github.workspace }}/shard-out
          COVERPROFILE: ${{ github.workspace }}/shard-out/coverage.out
          RECORD_CORPUS: ${{ matrix.tree == 'head' && needs.plan.outputs.query_corpus == 'true' && 'true' || 'false' }}
        run: |
          set -uo pipefail
          mkdir -p shard-out
          if [ "$TREE" = base ]; then export UNIT_ROOT=/tmp/loki-vl-proxy-base; fi
          if [ "$RECORD_CORPUS" = true ]; then
            mkdir -p shard-out/recordings
            export LVP_QUERY_CORPUS_DIR="$PWD/shard-out/recordings"
          fi
          status=0
          scripts/ci/go_test_unit.sh > events-full.json || status=$?
          echo "$status" > shard-out/test-exit-code
          # The outcome of every test (and every failed package), without the output.
          jq -cR 'fromjson? | select(.Action == "fail" or (.Test != null and (.Action == "pass" or .Action == "skip")))
                  | {Action, Package, Test, Elapsed}' events-full.json > shard-out/unit-results.json
          if [ "$status" -ne 0 ]; then
            echo "::warning::the tests of ${TREE} shard ${UNIT_SHARD} failed (exit ${status}); the report shows the failure"
            echo "::group::failing tests"
            jq -rR 'fromjson? | select(.Action == "fail") | "\(.Package)\t\(.Test // "")"' events-full.json | sort -u | tee failed.tsv
            echo "::endgroup::"
            jq -Rn '[inputs] | map({(.): true}) | add // {}' failed.tsv > failed.json
            jq -rR --slurpfile failed failed.json \
              'fromjson? | select(.Action == "output") | select($failed[0][.Package + "\t" + (.Test // "")]) | .Output | rtrimstr("\n")' \
              events-full.json | head -400
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Upload this shard's results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pr-quality-tests-${{ matrix.tree }}-${{ matrix.shard }}
          path: shard-out/
          retention-days: 1
          if-no-files-found: error

      - name: Upload failed test diagnostics
        if: steps.tests.outputs.status != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pr-quality-diagnostics-tests-${{ matrix.tree }}-${{ matrix.shard }}
          path: events-full.json
          if-no-files-found: ignore

      - name: Clean up base worktree
        if: always() && matrix.tree == 'base'
        run: git worktree remove --force /tmp/loki-vl-proxy-base || true

  # The compatibility scores of a tree: each against its own compose stack (the proxy image is built from the PR's
  # Dockerfile for both, as before).
  snapshot-compat:
    name: snapshot-compat (${{ matrix.tree }})
    needs: [scope, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tree: [head, base]
    env:
      PROXY_IMAGE: loki-vl-proxy:pr-quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.4"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.PROXY_IMAGE }}
          load: true
          cache-from: type=gha,scope=pr-quality-proxy
          cache-to: type=gha,mode=max,scope=pr-quality-proxy

      - name: Check out the base commit
        if: matrix.tree == 'base'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git worktree add /tmp/loki-vl-proxy-base "$BASE_SHA"

      - name: Measure the compatibility scores
        env:
          WORKSPACE: ${{ github.workspace }}
          TREE: ${{ matrix.tree }}
          PROXY_IMAGE: ${{ env.PROXY_IMAGE }}
          QUALITY_COMPAT_ONLY: "1"
          QUALITY_DIAGNOSTICS_DIR: /tmp/pr-quality-diagnostics/compat-${{ matrix.tree }}
        run: |
          set -euo pipefail
          root="$WORKSPACE"
          if [ "$TREE" = base ]; then root=/tmp/loki-vl-proxy-base; fi
          (cd "$root" && bash "$WORKSPACE/scripts/ci/collect_quality_metrics.sh" "/tmp/pr-${TREE}-compat.json")

      - name: Upload the compatibility scores
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pr-quality-compat-${{ matrix.tree }}
          if-no-files-found: error
          path: /tmp/pr-${{ matrix.tree }}-compat.json

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pr-quality-diagnostics-compat-${{ matrix.tree }}
          if-no-files-found: ignore
          path: /tmp/pr-quality-diagnostics/

      - name: Clean up base worktree
        if: always() && matrix.tree == 'base'
        run: git worktree remove --force /tmp/loki-vl-proxy-base || true

  head:
    needs: [scope, plan, snapshot-tests, snapshot-compat]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.4"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published
          # The VictoriaLogs parse oracle is a module of its own; its downloads join the cache.
          cache-dependency-path: |
            go.sum
            test/oracle/vl/go.sum
            test/oracle/vl/go.v*.sum
            test/oracle/loki/go.sum

      # The corpus main's push run built for the base commit (query-corpus.yaml): the PR's corpus is compared
      # with it. A miss (main has not built it yet) compares and gates nothing; the counts are still shown.
      - name: Restore the base commit's query corpus
        if: needs.plan.outputs.query_corpus == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: /tmp/query-corpus
          key: query-corpus-v1-${{ github.event.pull_request.base.sha }}

      # A shard that left nothing (its job failed) is a collection that failed: the snapshot job below reads what is
      # there, and the report fails with the snapshot-tests job.
      - name: Download the PR's test shards
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: pr-quality-tests-head-*
          path: /tmp/head-tests

      - name: Download the PR's compatibility scores
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pr-quality-compat-head
          path: /tmp/head-compat

      - name: Collect the PR quality snapshot
        env:
          WORKSPACE: ${{ github.workspace }}
          # The perf job measures the benchmarks and the load test of both trees together.
          QUALITY_SKIP_PERF: "1"
          QUALITY_TESTS_FROM: /tmp/head-tests
          QUALITY_TESTS_PREFIX: pr-quality-tests-head-
          QUALITY_TESTS_SHARDS: ${{ needs.plan.outputs.test_shards }}
          QUALITY_COMPAT_FROM: /tmp/head-compat/pr-head-compat.json
          QUALITY_QUERY_CORPUS_OUT: ${{ needs.plan.outputs.query_corpus == 'true' && '/tmp/pr-head-query-corpus.jsonl.gz' || '' }}
          QUALITY_QUERY_CORPUS_BASE: /tmp/query-corpus/query-corpus.jsonl.gz
          QUALITY_DIAGNOSTICS_DIR: /tmp/pr-quality-diagnostics/head
        run: bash "$WORKSPACE/scripts/ci/collect_quality_metrics.sh" /tmp/pr-head-quality.json

      - name: Upload the PR snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pr-quality-head
          if-no-files-found: error
          path: |
            /tmp/pr-head-quality.json
            /tmp/pr-head-query-corpus.jsonl.gz
            /tmp/pr-head-query-corpus.summary.json
            /tmp/pr-head-query-corpus.vl-*.jsonl.gz
            /tmp/pr-head-query-corpus.vl-*.constructs.json
            /tmp/pr-head-query-corpus.loki-*

      # The resolved query plan against Loki's own syntax tree (test/oracle/loki facts): outer grouping, offsets,
      # parser and drop stages, on every plan-corpus query both parsers accept. A difference fails this job, and
      # report fails with it.
      - name: Compare the query plan with Loki's tree
        if: needs.plan.outputs.query_corpus == 'true'
        env:
          LVP_RUN_ORACLES: "1"
        run: go test ./internal/queryplan -run '^TestPlanMatchesLokiOracle$' -count=1 -v

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pr-quality-diagnostics-head
          if-no-files-found: ignore
          path: /tmp/pr-quality-diagnostics/

  base:
    needs: [scope, plan, snapshot-tests, snapshot-compat]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.4"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published
          # The VictoriaLogs parse oracle is a module of its own; its downloads join the cache.
          cache-dependency-path: |
            go.sum
            test/oracle/vl/go.sum
            test/oracle/vl/go.v*.sum
            test/oracle/loki/go.sum

      # The base commit's test count and coverage depend only on that commit, so
      # a later run of this pull request against the same base reads them back
      # instead of running every test again. (Timings are not cached: see the perf job.)
      - name: Restore the base commit's test count and coverage
        id: base-tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6  # zizmor: ignore[cache-poisoning] JSON measurements read as data by the quality script; no cached code executes
        with:
          path: /tmp/pr-base-tests.json
          key: pr-quality-base-tests-${{ hashFiles('scripts/ci/collect_quality_metrics.sh', 'scripts/ci/pr_evidence.py') }}-${{ github.event.pull_request.base.sha }}

      # Without a saved count the snapshot-tests jobs ran the base tree's tests in shards (plan).
      - name: Download the base tree's test shards
        if: needs.plan.outputs.base_sharded == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: pr-quality-tests-base-*
          path: /tmp/base-tests

      - name: Download the base tree's compatibility scores
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pr-quality-compat-base
          path: /tmp/base-compat

      - name: Check out the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git worktree add /tmp/loki-vl-proxy-base "$BASE_SHA"

      - name: Collect the base quality snapshot
        env:
          WORKSPACE: ${{ github.workspace }}
          BASE_TESTS_CACHE_HIT: ${{ steps.base-tests.outputs.cache-hit }}
          QUALITY_TESTS_FROM: ${{ needs.plan.outputs.base_sharded == 'true' && '/tmp/base-tests' || '' }}
          QUALITY_TESTS_PREFIX: pr-quality-tests-base-
          QUALITY_TESTS_SHARDS: ${{ needs.plan.outputs.test_shards }}
          QUALITY_COMPAT_FROM: /tmp/base-compat/pr-base-compat.json
        run: |
          set -euo pipefail
          (
            cd /tmp/loki-vl-proxy-base
            # The base corpus comes from the main-branch run, not from here.
            QUALITY_DIAGNOSTICS_DIR=/tmp/pr-quality-diagnostics/base \
              QUALITY_TESTS_SNAPSHOT=/tmp/pr-base-tests.json \
              QUALITY_QUERY_CORPUS_OUT='' \
              QUALITY_SKIP_PERF=1 \
              bash "$WORKSPACE/scripts/ci/collect_quality_metrics.sh" /tmp/pr-base-quality.json
          )
          # Save them for the next run unless the collection fell back to zeros.
          if [ "$BASE_TESTS_CACHE_HIT" != "true" ] && jq -e '.tests.count > 0' /tmp/pr-base-quality.json >/dev/null; then
            jq -c '.tests' /tmp/pr-base-quality.json > /tmp/pr-base-tests.json
          fi

      - name: Upload the base snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pr-quality-base
          if-no-files-found: error
          path: /tmp/pr-base-quality.json

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pr-quality-diagnostics-base
          if-no-files-found: ignore
          path: /tmp/pr-quality-diagnostics/

      - name: Clean up base worktree
        if: always()
        run: git worktree remove --force /tmp/loki-vl-proxy-base || true

  perf:
    needs: [scope, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_perf == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27.4"
          cache: true  # zizmor: ignore[cache-poisoning] test stack only, its images are loaded and never published
          # The VictoriaLogs parse oracle is a module of its own; its downloads join the cache.
          cache-dependency-path: |
            go.sum
            test/oracle/vl/go.sum
            test/oracle/vl/go.v*.sum
            test/oracle/loki/go.sum

      - name: Check out the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git worktree add /tmp/loki-vl-proxy-base "$BASE_SHA"

      - name: Measure both trees
        env:
          WORKSPACE: ${{ github.workspace }}
          # The load test is measured below with base and head alternating, not once per tree.
          QUALITY_SKIP_LOAD: "1"
          QUALITY_PERF_ONLY: "1"
          QUALITY_QUERY_CORPUS_OUT: ""
        run: |
          set -euo pipefail
          # Base and PR are measured in this job, on this runner, every time:
          # throughput and CPU timings are only comparable on the same machine.
          # (A base snapshot cached from another runner made unchanged code
          # look 40% slower or faster depending on which machine measured it.)
          bash "$WORKSPACE/scripts/ci/collect_quality_metrics.sh" /tmp/pr-head-perf.json
          (cd /tmp/loki-vl-proxy-base && bash "$WORKSPACE/scripts/ci/collect_quality_metrics.sh" /tmp/pr-base-perf.json)
          # The high-concurrency load test runs on both trees alternately (base, head,
          # base, head, ...) so a slow or fast stretch of the runner hits both alike. One
          # run per tree, minutes apart, differed by 28-34% on identical code.
          python3 "$WORKSPACE/scripts/ci/load_abab.py" \
            --base-dir /tmp/loki-vl-proxy-base --head-dir "$WORKSPACE" \
            --base-json /tmp/pr-base-perf.json --head-json /tmp/pr-head-perf.json

      - name: Upload the performance of both trees
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pr-quality-perf
          if-no-files-found: error
          path: |
            /tmp/pr-base-perf.json
            /tmp/pr-head-perf.json

      - name: Clean up base worktree
        if: always()
        run: git worktree remove --force /tmp/loki-vl-proxy-base || true

  report:
    needs: [scope, plan, snapshot-tests, snapshot-compat, head, base, perf]
    if: ${{ !cancelled() && (needs.scope.outputs.evidence == 'true' || contains(format(',{0},', needs.scope.outputs.jobs), ',pr-quality-report/report,')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # report is the required check: a failed snapshot job (its oracle step included) fails it, even when its
      # artifact was uploaded before the failure. A skipped perf job (no perf-sensitive change) is fine.
      - name: Require the snapshot jobs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TESTS_RESULT: ${{ needs.snapshot-tests.result }}
          COMPAT_RESULT: ${{ needs.snapshot-compat.result }}
          HEAD_RESULT: ${{ needs.head.result }}
          BASE_RESULT: ${{ needs.base.result }}
          PERF_RESULT: ${{ needs.perf.result }}
        run: |
          set -euo pipefail
          for r in "plan=$PLAN_RESULT" "snapshot-tests=$TESTS_RESULT" "snapshot-compat=$COMPAT_RESULT" "head=$HEAD_RESULT" "base=$BASE_RESULT"; do
            [ "${r#*=}" = "success" ] || { echo "::error::job ${r%%=*} ended ${r#*=}"; exit 1; }
          done
          case "$PERF_RESULT" in success|skipped) ;; *) echo "::error::job perf ended $PERF_RESULT"; exit 1 ;; esac

      - name: Download the head snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pr-quality-head
          path: /tmp

      - name: Download the base snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pr-quality-base
          path: /tmp

      - name: Download the perf snapshot
        if: needs.perf.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pr-quality-perf
          path: /tmp

      - name: Merge the snapshots and render the report
        env:
          WORKSPACE: ${{ github.workspace }}
          PERF_RESULT: ${{ needs.perf.result }}
        run: |
          set -euo pipefail
          # Each snapshot job produced its tree's tests, coverage and compatibility; the perf
          # job produced both trees' performance. A skipped perf job leaves "skipped" in place.
          if [ "$PERF_RESULT" = "success" ]; then
            for tree in base head; do
              jq --slurpfile perf "/tmp/pr-${tree}-perf.json" '.performance = $perf[0].performance' \
                "/tmp/pr-${tree}-quality.json" > "/tmp/pr-${tree}-quality.json.new"
              mv "/tmp/pr-${tree}-quality.json.new" "/tmp/pr-${tree}-quality.json"
            done
          fi

          python3 scripts/ci/pr_evidence.py --provenance /tmp/quality-meta.json

          bash "$WORKSPACE/scripts/ci/render_pr_report.sh" \
            /tmp/pr-base-quality.json \
            /tmp/pr-head-quality.json \
            /tmp/pr-quality-report.md

          cat /tmp/pr-quality-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce quality gate
        run: |
          python3 scripts/ci/check_quality_gate.py \
            /tmp/pr-base-quality.json \
            /tmp/pr-head-quality.json

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pr-quality-report
          if-no-files-found: ignore
          path: |
            /tmp/pr-base-quality.json
            /tmp/pr-head-quality.json
            /tmp/pr-quality-report.md
            /tmp/quality-meta.json
            /tmp/pr-head-query-corpus.jsonl.gz
            /tmp/pr-head-query-corpus.summary.json
            /tmp/pr-head-query-corpus.vl-*.jsonl.gz
            /tmp/pr-head-query-corpus.vl-*.constructs.json
            /tmp/pr-head-query-corpus.loki-*

      - name: Publish sticky PR comment
        # Fork PRs run with a read-only token — skip silently rather than failing.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const body = fs.readFileSync('/tmp/pr-quality-report.md', 'utf8');
            const marker = '<!-- pr-quality-report -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      # The workflow_run publisher uses trusted main code. While this PR adds
      # the matrix renderer, main cannot show its new section yet; this bounded
      # bridge comment is published only when the base lacks that section.
      - name: Publish query semantics catalog proof
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/query_semantics_comment.py /tmp/pr-base-quality.json /tmp/pr-head-quality.json "$PR_NUMBER"
