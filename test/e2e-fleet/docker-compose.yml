version: "3.8"

# Fleet cache e2e test: 3 proxy instances with peer discovery + disk cache,
# VictoriaLogs as their backend and Loki as the reference the rebuilt answers
# are compared with.
# Usage:
#   docker compose up -d --build
#   go test -v -tags=e2e -timeout=15m -run '^TestFleetPeerCacheProof$' ./test/e2e-fleet/
#
# The peer cache proof restarts and recreates proxies itself with
# `docker compose` from this directory, so run it with the same
# COMPOSE_PROJECT_NAME / DOCKER_CONTEXT (and the overrides below) the stack
# was started with. Host ports, images and container names can be overridden
# to run a second, isolated copy of the stack:
#   FLEET_VL_PORT, FLEET_LOKI_PORT, FLEET_PROXY_{A,B,C}_PORT,
#   VICTORIALOGS_IMAGE, LOKI_IMAGE, PROXY_IMAGE, FLEET_NAME_PREFIX
# and the test reads FLEET_VL_URL, FLEET_LOKI_URL and FLEET_PROXY_{A,B,C}_URL.

services:
  victorialogs:
    image: ${VICTORIALOGS_IMAGE:-victoriametrics/victoria-logs:v1.52.0}
    container_name: ${FLEET_NAME_PREFIX:-fleet}-vl
    ports:
      - "${FLEET_VL_PORT:-9428}:9428"
    command:
      - "-storageDataPath=/vlogs"
      - "-retentionPeriod=1d"
      - "-httpListenAddr=:9428"
    volumes:
      - vl-data:/vlogs
    healthcheck:
      # VictoriaLogs images are scratch-based from v1.52.0 (no shell, no wget);
      # the binary's -version exit path is the probe that works on every version.
      test: ["CMD", "/victoria-logs-prod", "-version"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  # Reference Loki: the answers the fleet rebuilds from VictoriaLogs after
  # every proxy lost its caches are compared with Loki's for the same lines.
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.9}
    container_name: ${FLEET_NAME_PREFIX:-fleet}-loki
    user: "0:0"
    ports:
      - "${FLEET_LOKI_PORT:-3110}:3100"
    command:
      - -config.file=/etc/loki/local-config.yaml
      # The fixture is hours old: Loki serves it from the store after /flush.
      - -validation.reject-old-samples.max-age=168h
    volumes:
      - ../e2e-compat/loki-local-config.yaml:/etc/loki/local-config.yaml:ro
    # Loki 3.7.x images have no shell or wget; the test polls /ready.
    healthcheck:
      disable: true

  proxy-a:
    image: ${PROXY_IMAGE:-loki-vl-proxy:fleet-local}
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: ${FLEET_NAME_PREFIX:-fleet}-proxy-a
    # The disk tier lives on an anonymous volume: a restart keeps it (memory
    # lost, disk kept) and `docker compose rm -sfv` drops it (disk lost).
    # root so the proxy can write the volume Docker creates root-owned.
    user: root
    ports:
      - "${FLEET_PROXY_A_PORT:-3100}:3100"
    command:
      - "-listen=:3100"
      - "-backend=http://victorialogs:9428"
      - "-log-level=debug"
      - "-cache-ttl=30s"
      - "-cache-max=20000"
      - "-disk-cache-path=/cache/proxy-a.db"
      - "-disk-cache-compress=true"
      - "-disk-cache-flush-size=10"
      - "-disk-cache-flush-interval=1s"
      - "-peer-self=proxy-a:3100"
      - "-peer-write-through=true"
      - "-peer-discovery=static"
      - "-peer-static=proxy-a:3100,proxy-b:3100,proxy-c:3100"
      - "-peer-auth-token=e2e-test-token"
      - "-server.admin-auth-token=e2e-test-token"
      - "-server.register-instrumentation=true"
      # No background label scans: the peer cache proof counts every
      # VictoriaLogs call a replica makes.
      - "-labels-cache-warm=false"
      # Snapshots a replica that lost its disk warms from its peers.
      - "-patterns-persist-path=/cache/patterns.json"
      - "-patterns-persist-interval=2s"
      - "-patterns-startup-stale-threshold=10m"
      - "-patterns-startup-peer-warm-timeout=5s"
      - "-label-values-indexed-cache=true"
      - "-label-values-index-persist-path=/cache/label-values-index.json"
      - "-label-values-index-persist-interval=2s"
      - "-label-values-index-startup-stale-threshold=10m"
      - "-label-values-index-startup-peer-warm-timeout=5s"
    volumes:
      - /cache
    depends_on:
      victorialogs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  proxy-b:
    image: ${PROXY_IMAGE:-loki-vl-proxy:fleet-local}
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: ${FLEET_NAME_PREFIX:-fleet}-proxy-b
    # The disk tier lives on an anonymous volume: a restart keeps it (memory
    # lost, disk kept) and `docker compose rm -sfv` drops it (disk lost).
    # root so the proxy can write the volume Docker creates root-owned.
    user: root
    ports:
      - "${FLEET_PROXY_B_PORT:-3101}:3100"
    command:
      - "-listen=:3100"
      - "-backend=http://victorialogs:9428"
      - "-log-level=debug"
      - "-cache-ttl=30s"
      - "-cache-max=20000"
      - "-disk-cache-path=/cache/proxy-b.db"
      - "-disk-cache-compress=true"
      - "-disk-cache-flush-size=10"
      - "-disk-cache-flush-interval=1s"
      - "-peer-self=proxy-b:3100"
      - "-peer-write-through=true"
      - "-peer-discovery=static"
      - "-peer-static=proxy-a:3100,proxy-b:3100,proxy-c:3100"
      - "-peer-auth-token=e2e-test-token"
      - "-server.admin-auth-token=e2e-test-token"
      - "-server.register-instrumentation=true"
      # No background label scans: the peer cache proof counts every
      # VictoriaLogs call a replica makes.
      - "-labels-cache-warm=false"
      # Snapshots a replica that lost its disk warms from its peers.
      - "-patterns-persist-path=/cache/patterns.json"
      - "-patterns-persist-interval=2s"
      - "-patterns-startup-stale-threshold=10m"
      - "-patterns-startup-peer-warm-timeout=5s"
      - "-label-values-indexed-cache=true"
      - "-label-values-index-persist-path=/cache/label-values-index.json"
      - "-label-values-index-persist-interval=2s"
      - "-label-values-index-startup-stale-threshold=10m"
      - "-label-values-index-startup-peer-warm-timeout=5s"
    volumes:
      - /cache
    depends_on:
      victorialogs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  proxy-c:
    image: ${PROXY_IMAGE:-loki-vl-proxy:fleet-local}
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: ${FLEET_NAME_PREFIX:-fleet}-proxy-c
    # The disk tier lives on an anonymous volume: a restart keeps it (memory
    # lost, disk kept) and `docker compose rm -sfv` drops it (disk lost).
    # root so the proxy can write the volume Docker creates root-owned.
    user: root
    ports:
      - "${FLEET_PROXY_C_PORT:-3102}:3100"
    command:
      - "-listen=:3100"
      - "-backend=http://victorialogs:9428"
      - "-log-level=debug"
      - "-cache-ttl=30s"
      - "-cache-max=20000"
      - "-disk-cache-path=/cache/proxy-c.db"
      - "-disk-cache-compress=true"
      - "-disk-cache-flush-size=10"
      - "-disk-cache-flush-interval=1s"
      - "-peer-self=proxy-c:3100"
      - "-peer-write-through=true"
      - "-peer-discovery=static"
      - "-peer-static=proxy-a:3100,proxy-b:3100,proxy-c:3100"
      - "-peer-auth-token=e2e-test-token"
      - "-server.admin-auth-token=e2e-test-token"
      - "-server.register-instrumentation=true"
      # No background label scans: the peer cache proof counts every
      # VictoriaLogs call a replica makes.
      - "-labels-cache-warm=false"
      # Snapshots a replica that lost its disk warms from its peers.
      - "-patterns-persist-path=/cache/patterns.json"
      - "-patterns-persist-interval=2s"
      - "-patterns-startup-stale-threshold=10m"
      - "-patterns-startup-peer-warm-timeout=5s"
      - "-label-values-indexed-cache=true"
      - "-label-values-index-persist-path=/cache/label-values-index.json"
      - "-label-values-index-persist-interval=2s"
      - "-label-values-index-startup-stale-threshold=10m"
      - "-label-values-index-startup-peer-warm-timeout=5s"
    volumes:
      - /cache
    depends_on:
      victorialogs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

volumes:
  vl-data:
