id: vl-extra-filters-max-query-len
kind: version_gated_capability
since: v1.54
generated:
  used_in: 0

description: |
  From VictoriaLogs v1.54.0 (#1923) the extra_filters and extra_stream_filters
  args count against -search.maxQueryLen (16384 bytes by default) like the
  query arg: a longer one answers 400 ("arg length cannot exceed
  -search.maxQueryLen"). Up to v1.53.x they had no length limit, and a deeply
  nested filter in them could crash VictoriaLogs (or vlselect).
proxy_usage: |
  The proxy sends extra_stream_filters for tenant-label routing (one
  {"<label>":"<tenant>"} object, injectTenantLabelFilter in
  internal/proxy/multitenant.go) and extra_filters for the detected_level
  stream split (a fixed list of level fields, detected_level_levelless.go), the
  JSON-line placeholder exclusion (the placeholder _msg text and one label name
  the query itself holds, json_line_keys.go) and the parse-risk probes
  (ordered_json_metric.go, ordered_json_unparsed_row.go). Each is a short fixed
  filter plus at most one name or value taken from the request, so it reaches
  the limit only when the query or the tenant id already does, and VictoriaLogs
  rejects such a query arg on every version. A tenant filter VictoriaLogs
  refuses fails the request (Loki's 500 through the error layer); it never
  falls back to an unfiltered read.
fallback: |
  None needed on a supported version: the proxy's own filters stay far below
  the limit. A deployment that lowers -search.maxQueryLen below a few hundred
  bytes refuses the proxy's queries on every version.
proves: []
