id: window-bounds-and-step-alignment
state: partial
reason: |
  semantics/offset-sample-timestamps is written and wired: an offset modifier
  moves the window and leaves the sample timestamps on Loki's grid, on range and
  instant queries, proven by unit tests and an e2e case against live Loki. The
  remaining cases named by this behaviour — lower-bound-exclusive, step-alignment,
  tumbling-relabel, range-smaller-than-step, grafana-24h-split and
  resolution-limit-11000 — have no case files yet. Step alignment is
  semantics/query-range-step-alignment: the opt-in -align-queries-with-step
  moves metric query_range bounds down to the step grid as Loki's
  align_queries_with_step does, proven by unit tests and an e2e case against
  the stack's aligning Loki.
