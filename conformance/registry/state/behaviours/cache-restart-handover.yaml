reason: |
  Unit-proven in internal/cache and internal/proxy; the stack proof is
  TestFleet_RestartHandoverKeepsTheResponseCacheWarm (test/e2e-fleet, CI job
  e2e-fleet). The chart options (cacheHandover.*: flags, grace period, preStop
  sleep, startup probe, one-replica-at-a-time rollout settings, disk cache
  required) are rendered by TestCacheHandoverChartOptions (test/helm, CI job
  helm), and the disk cache's startup window and progress deadline by
  TestDiskCacheStartupWindowAndProgressDeadline; a real rollout on Kubernetes
  is not run, and neither the restore nor the index rebuild is measured on a
  network volume (the EBS targets are emulated and estimated). Not covered
  yet: the hand-over of hot keys to peers when a replica's disk is new.
