loki_behaviour: |
  Loki's read API never answers 401 itself: authentication is the gateway's job
  in front of it. The proxy writes 401 only on its admin and peer-cache routes
  (not Loki routes) when their token is missing or wrong, so there is no Loki
  answer to compare. A Loki client never reaches these routes.
precedence: []   # failure classes Loki evaluates before this one
consumers: |
  Operators and peer proxies read it; Grafana and Logs Drilldown never call these routes.
