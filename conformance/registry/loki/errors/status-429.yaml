id: status-429
status: 429
error_type: bad_data
generated:   # rewritten by conformance/scripts/error_registry.py
  proxy_call_sites: 1
  dynamic_sites: 0
  literal_messages:
    - "metrics scrape already in progress"
  loki_messages: ["msg-queue-full"]
  recorded_rows: 0
  comparable_rows: 0
  matching_rows: 0

loki_behaviour: |
  Loki answers a full query queue with 429 `too many outstanding requests`
  (msg-queue-full). It needs load to reach, so no single recorded request holds
  it; the text and status are Loki's fixed ones and the error-layer gate holds
  the proxy's answer to them (TestErrorLayer_NoVictoriaLogsLeak, the vl429 mode).
precedence: []   # failure classes Loki evaluates before this one
consumers: |
  Grafana shows `too many outstanding requests` and retries the panel when the user refreshes.
cases: []        # case ids that assert status, errorType, message and headers together
