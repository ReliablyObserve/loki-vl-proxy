id: status-408
status: 408
error_type: bad_data
generated:
  proxy_call_sites: 0
  dynamic_sites: 0
  literal_messages:


loki_behaviour: |
  Loki v3.7.9 never answers a read request with 408: a request that ends
  while the query runs is 499 "the request was cancelled by the client" when
  the client cancelled it and 504 "request timed out, decrease the duration
  of the request or add more label matchers (prefer exact match over regex
  match) to reduce the amount of data processed" when its deadline (the
  tenant's query_timeout) passed (pkg/util/server/error.go:26-27, :103-107).
  The windowed log query_range path answered 408 with Go's context text
  while it waited to retry a failed window batch; it now answers through the
  error layer, and the proxy writes 408 nowhere.
precedence: []   # failure classes Loki evaluates before this one
consumers: |
  Grafana shows the 504 text in the panel or Explore error; a cancelled
  request has no client left to read the 499.
cases:
  - semantics/error-layer-cancel-deadline
