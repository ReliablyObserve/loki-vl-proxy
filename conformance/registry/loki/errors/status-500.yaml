id: status-500
status: 500
error_type: internal
generated:
  proxy_call_sites: 6
  dynamic_sites: 2
  literal_messages:
    - "failed to marshal rules response: %v"
    - "failed to merge multi-tenant response: "

loki_behaviour: |
  Loki v3.7.9 answers any failed querier or storage call it cannot classify
  with 500 and its own text (pkg/util/server/error.go:124-128), a message over
  the gRPC size limit with 500 ResourceExhausted (:93-100). This is the status
  the single error layer gives every failed VictoriaLogs call (refused, reset,
  VictoriaLogs 4xx/5xx other than a query rejection, a front proxy's 502/503,
  a truncated or malformed body) and every documented proxy buffer limit, with
  Loki-shaped text and no VictoriaLogs text. TestErrorLayer_NoVictoriaLogsLeak
  holds the cells that do not yet; error-layer-known-leaks.json lists them.
precedence: []   # failure classes Loki evaluates before this one
consumers: |
  TODO: how Grafana Explore and Logs Drilldown render it.
cases:
  - semantics/error-layer-backend-failure-status
  - semantics/error-layer-internal-go-text
  - semantics/error-layer-silent-success
