loki_behaviour: |
  Loki v3.7.7 answers 400 as `text/plain` with the error's own message for a
  LogQL parse error, a limit the query exceeds, a pipeline error (a metric
  sample carrying `__error__`: `logqlmodel.PipelineError`, see
  semantics/pipeline-error-text-parity for the exact text), a blocked query
  and an unsupported one (`serverutil.ClientHTTPStatusAndError`). The body is
  the message alone, `Content-Type: text/plain; charset=utf-8`, `X-Content-Type-Options:
  nosniff`, no JSON envelope and no trailing newline (`serverutil.WriteError`,
  pkg/util/server/error.go:46-52; reached through the query frontend,
  pkg/lokifrontend/frontend/transport/handler.go:141). The proxy writes the
  same bytes on every query, metadata and tail-upgrade route
  (semantics/error-layer-body-shape) and matches the message text where a
  case proves it. Loki writes JSON only where its own handler does: the
  ruler's Prometheus rules and alerts API (`{"status","data","errorType",
  "error"}`, pkg/ruler/base/api.go:106-123) and format_query
  (`{"status":"invalid-query","error"}`, pkg/loki/format_query_handler.go);
  the compactor's delete API and the ruler's rule-group API use Go's
  http.Error (text and a newline). An unwrap conversion error
  (semantics/unwrap-conversion-error) is answered as Loki writes it,
  text/plain.
precedence: []   # failure classes Loki evaluates before this one
consumers: |
  Grafana shows the message text in the panel or Explore error; Logs
  Drilldown shows it in the affected panel.
cases:
  - semantics/pipeline-error-text-parity
  - semantics/vector-aggregation-over-log-selector-status
  - semantics/unwrap-conversion-error
  - semantics/error-layer-body-shape
  - limits/row-limit-error-names-flag
