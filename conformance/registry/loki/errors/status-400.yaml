id: status-400
status: 400
error_type: bad_data
generated:
  proxy_call_sites: 64
  dynamic_sites: 34
  literal_messages:
    - "absent_over_time: missing range window"
    - "end must be after start"
    - "failed to translate query: "
    - "invalid aggregation %s without unwrap"
    - "invalid end timestamp"
    - "invalid end timestamp: "
    - "invalid label values URL"
    - "invalid range metric query"
    - "invalid range selector"
    - "invalid start timestamp"
    - "invalid start timestamp: "
    - "invalid step"
    - "missing field name in URL"
    - "multi-tenant fanout exceeds limit of %d tenants"
    - "parse error : invalid regex in label_replace: %v"
    - "query parameter required"
    - "query parameter required for delete"
    - "unexpected literal for logical/set binary operation"
    - "unsupported instant aggregation target"
    - "unsupported metric query: range aggregations require compatible unwrap or translator support"

loki_behaviour: |
  Loki v3.7.7 answers 400 as `text/plain` with the error's own message for a
  LogQL parse error, a limit the query exceeds, a pipeline error (a metric
  sample carrying `__error__`: `logqlmodel.PipelineError`, see
  semantics/pipeline-error-text-parity for the exact text), a blocked query
  and an unsupported one (`serverutil.ClientHTTPStatusAndError`). The proxy
  keeps its JSON envelope (`status`, `errorType: bad_data`, `error`) and
  matches the message text where a case proves it.
precedence: []   # failure classes Loki evaluates before this one
consumers: |
  Grafana shows the message text in the panel or Explore error; Logs
  Drilldown shows it in the affected panel.
cases:
  - semantics/pipeline-error-text-parity
