id: status-503
status: 503
error_type: timeout
generated:   # rewritten by conformance/scripts/error_registry.py
  proxy_call_sites: 0
  dynamic_sites: 0
  literal_messages: []
  loki_messages: []
  recorded_rows: 0
  comparable_rows: 0
  matching_rows: 0

loki_behaviour: |
  Loki answers 503 only from its own readiness and ring checks, never for a
  failed query; a full queue is 429 "too many outstanding requests"
  (pkg/queue/queue.go:21). The error layer answers an open circuit breaker,
  a guard rejection and VictoriaLogs' or a front proxy's 503 with Loki's 500,
  and a cancelled stats slot wait with 499. The -max-concurrent admission cap of
  the rate limiter answers Loki's full-queue 429 too (msg-queue-full), the flag
  in the log line only; only the ruler's own status passes through.
  TestErrorLayer_NoVictoriaLogsLeak lists the cells.
precedence: []   # failure classes Loki evaluates before this one
consumers: |
  Grafana shows the text; the proxy writes no 503 of its own.
cases:
  - semantics/error-layer-backend-failure-status
