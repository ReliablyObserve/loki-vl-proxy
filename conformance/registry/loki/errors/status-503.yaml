id: status-503
status: 503
error_type: timeout
generated:
  proxy_call_sites: 5
  dynamic_sites: 3
  literal_messages:
    - "request cancelled waiting for stats_query_range slot"

loki_behaviour: |
  Loki answers 503 only from its own readiness and ring checks, never for a
  failed query; a full queue is 429 "too many outstanding requests"
  (pkg/queue/queue.go:21). The proxy's 503 (circuit breaker, guard rejection,
  VictoriaLogs' or a front proxy's 503 copied through, stats slot wait) is a
  leak unless it is a registry-listed proxy limit naming its flag;
  TestErrorLayer_NoVictoriaLogsLeak lists the cells.
precedence: []   # failure classes Loki evaluates before this one
consumers: |
  TODO: how Grafana Explore and Logs Drilldown render it.
cases:
  - semantics/error-layer-backend-failure-status
