loki_behaviour: |
  Loki answers a method a route does not serve (PUT, DELETE, PATCH, HEAD,
  OPTIONS on every read route) with 405 and no body and no Content-Type
  (msg-method-not-allowed; the largest group of recorded rows). POST is accepted
  on every read route. The proxy writes the status alone for the same methods.
