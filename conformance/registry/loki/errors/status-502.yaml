id: status-502
status: 502
error_type: unavailable
generated:
  proxy_call_sites: 11
  dynamic_sites: 4
  literal_messages:
    - "VL delete failed: "
    - "cold backend error: "
    - "failed to merge hot+cold results"
    - "failed to read cold response"
    - "hot backend error: "
    - "invalid ruler backend response: %v"

loki_behaviour: |
  Loki never answers 502 for a failed backend: a querier or storage failure is
  500 (pkg/util/server/error.go:124-128). A 502 from the proxy is a leak unless
  it is a registry-listed, documented proxy limit naming its flag; today it is
  the default of statusFromUpstreamErr and of every badRequestStatusOr(err, 502)
  site, and the answer of -backend-max-buffered-response-bytes and
  -manual-range-metric-row-limit. TestErrorLayer_NoVictoriaLogsLeak lists the
  cells (error-layer-known-leaks.json); the list may only shrink.
precedence: []   # failure classes Loki evaluates before this one
consumers: |
  TODO: how Grafana Explore and Logs Drilldown render it.
cases:
  - semantics/error-layer-backend-failure-status
  - semantics/error-layer-transport-text
  - semantics/error-layer-cancel-deadline
  - semantics/error-layer-proxy-limit-status
