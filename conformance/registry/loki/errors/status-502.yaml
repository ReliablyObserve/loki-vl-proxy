id: status-502
status: 502
error_type: unavailable
generated:   # rewritten by conformance/scripts/error_registry.py
  proxy_call_sites: 0
  dynamic_sites: 0
  literal_messages: []
  loki_messages: []
  recorded_rows: 0
  comparable_rows: 0
  matching_rows: 0

loki_behaviour: |
  Loki never answers 502 for a failed backend: a querier or storage failure is
  500 (pkg/util/server/error.go:124-128). A 502 from the proxy is a leak unless
  it is a registry-listed, documented proxy limit naming its flag. The error
  layer (lokiClientError, writeErr) answers every failed backend call with 500
  and the proxy's limits with 500 naming their flag, on the rules, alerts and
  delete routes too (the ruler's JSON and http.Error shapes, never the
  backend's status or body). TestErrorLayer_NoVictoriaLogsLeak lists the cells
  (error-layer-known-leaks.json); the list may only shrink.
precedence: []   # failure classes Loki evaluates before this one
consumers: |
  Grafana shows the proxy limit's text; a 502 that is not a documented limit is a leak the gate lists.
cases:
  - semantics/error-layer-backend-failure-status
  - semantics/error-layer-transport-text
  - semantics/error-layer-cancel-deadline
  - semantics/error-layer-proxy-limit-status
