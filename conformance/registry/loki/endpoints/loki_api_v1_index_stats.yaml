victorialogs:
  # Confirmed by the differential runner at runtime; the generated block above
  # is a static approximation. Say what VictoriaLogs answers natively, what the
  # proxy has to compute, and why VictoriaLogs cannot do that part.
  native: []
  transformed: []
  vl_cannot: |
    VictoriaLogs has no chunks and no ingested-bytes accounting: one stats row
    (`count() entries, count_uniq_hash(_stream_id) streams`) gives the window's
    exact streams and lines; chunks is the stream count and bytes 100 per
    entry (quality/index-stats-bytes-and-chunks).
