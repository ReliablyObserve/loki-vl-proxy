id: parser-logfmt
kind: parser
logql: "logfmt"
loki_constant: OpParserTypeLogfmt
generated:
  supported_by_proxy: true
  seen_in:
    - internal/logql/parser.go
    - internal/logql/stage_validate.go
    - internal/proxy/drilldown.go
    - internal/proxy/ordered_json_metric.go
    - internal/proxy/query_translation.go
    - internal/translator/translator.go

semantics: |
  The live query-semantics matrix checks a parsed `level="error"` filter,
  `count_over_time` over that filtered stream, and an outer `sum by (app)`
  against Loki. The bare range result only requires nonempty responses because
  parsed-label series identity is an accepted deviation; the outer aggregation
  is compared by exact labels, timestamps, and values. This is not exhaustive
  logfmt edge-case coverage.
victorialogs: |
  The matrix sends the same parser/filter/range queries through the proxy to
  VictoriaLogs and to Loki. It checks availability for the bare parser metric
  and strict parity after the outer aggregation; dynamic parsed-label identity
  remains described by the linked registry case.
consumers: [api]
cases:
  - parsed-identity/dynamic-key-parsers
victorialogs_candidates:
  - id: pipe-unpack-logfmt
    since: v1.40.0
    emitted_by_proxy: true
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null
