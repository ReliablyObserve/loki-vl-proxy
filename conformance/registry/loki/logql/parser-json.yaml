id: parser-json
kind: parser
logql: "json"
loki_constant: OpParserTypeJSON
generated:
  supported_by_proxy: true
  seen_in:
    - internal/logql/parser.go
    - internal/logql/stage_validate.go
    - internal/proxy/drilldown.go
    - internal/proxy/ordered_json_metric.go
    - internal/proxy/query_translation.go
    - internal/translator/translator.go

semantics: |
  The live query-semantics matrix checks parsed-field equality, numeric and
  regular-expression filters, a filtered `count_over_time`, and an outer
  `sum by (app)` against Loki. Those cases use the generated API fixture and
  assert exact metric labels, timestamps, and values. Malformed input and
  parser-error filtering are covered by the linked semantics cases; these
  checks do not claim exhaustive JSON edge-case parity.
victorialogs: |
  The matrix sends the same parsed-field query to the proxy backed by
  VictoriaLogs and to Loki, checking the proxy's current translation and
  evaluation path. Native-stat eligibility and parser-error behavior remain
  constrained by the linked semantic cases.
consumers: [api]
cases:
  - semantics/json-filter-pushdown-without-error-drop
  - semantics/json-error-filter-metric-split-pushdown
victorialogs_candidates:
  - id: pipe-unpack-json
    since: v1.40.0
    emitted_by_proxy: true
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null
