id: parser-regexp
kind: parser
logql: "regexp"
loki_constant: OpParserTypeRegexp
generated:
  supported_by_proxy: true
  seen_in:
    - internal/logql/parser.go
    - internal/logql/semantic.go
    - internal/logql/stage_validate.go
    - internal/logql/translate.go
    - internal/proxy/drilldown.go
    - internal/proxy/drilldown_burst_coalescer.go

semantics: |
  The live query-semantics matrix checks a capture-filtered metric range and
  an outer `sum by (app)` against Loki. Its fixture has a captured status on
  each matching line, and both cases compare exact metric labels, timestamps,
  and values. Partial-match series behavior is tracked separately by the linked
  registry case; this matrix does not claim to close that difference.
victorialogs: |
  The matrix sends the same capture/filter/range queries through the proxy to
  VictoriaLogs and to Loki and compares complete metric results. The partial-
  capture identity difference remains open in its dedicated registry case.
consumers: [api]
cases:
  - parsed-identity/regexp-partial-match-series-count
victorialogs_candidates:
  - id: pipe-extract-regexp
    since: v1.40.0
    emitted_by_proxy: true
