id: parser-pattern
kind: parser
logql: "pattern"
loki_constant: OpParserTypePattern
generated:
  supported_by_proxy: true
  seen_in:
    - internal/logql/parser.go
    - internal/logql/translate.go
    - internal/proxy/multitenant.go
    - internal/proxy/patterns.go
    - internal/proxy/postprocess.go
    - internal/translator/translator.go

semantics: |
  The live query-semantics matrix checks a pattern-extracted numeric status
  filter, `count_over_time` over the filtered stream, and an outer
  `sum by (app)` against Loki. The cases assert exact metric labels,
  timestamps, and values, using the generated nginx fixture. Missing captures,
  nonmatching lines, and parser ordering remain outside this bounded coverage.
victorialogs: |
  The matrix sends the same pattern parser query to the proxy backed by
  VictoriaLogs and to Loki, then checks the filtered metric and outer
  aggregation. It proves only the declared generated-fixture cases, not full
  pattern-parser parity.
consumers: [api]
cases: []
victorialogs_candidates:
  - id: pipe-extract
    since: v1.40.0
    emitted_by_proxy: true
