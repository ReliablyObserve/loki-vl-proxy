id: filter-ip
kind: filter
logql: "ip"
loki_constant: OpFilterIP
generated:
  supported_by_proxy: true
  seen_in:
    - internal/logql/ip_filter.go
    - internal/logql/parser.go

semantics: |
  `label = ip("pattern")` and `label != ip("pattern")` (and `|= ip(...)` /
  `!= ip(...)` on the line) match an address Loki reads out of the value
  against one address, a CIDR or a same-family range. Observed against Loki
  3.7.9 (registry cases below): a line without the label is dropped under both
  operators; a whole-address value is in or out of the pattern; an address
  inside other text is read out of it (semantics/ip-label-filter-embedded-address);
  a line its parser rejected keeps going with `__error__` under both operators
  (semantics/ip-filter-keeps-parser-error-lines), so a metric over it answers
  Loki's pipeline error unless `__error__=""` drops it.
victorialogs: |
  An IPv4 pattern is `ipv4_range(lo, hi)` on a block of values VictoriaLogs
  stores as addresses (`value_type(ipv4)`, a compare of numbers), and on any
  other block the regexp of the `ip()` line filter (translate.IPLineFilterRegex)
  run on the field after a substring prefilter (the fixed octets, an
  alternation of a few first octets, or the dot of an address), which reads an
  address alone or inside other text as Loki's scan does, after two short
  regexps that decide most values (decision ip-filter-ipv4-exact-walk-split); `field:*` is the
  `!=` presence. An IPv6 pattern is `ipv6_range(lo, hi)` on the field, guarded so
  only values Loki reads as that same whole address match (IPv6 starting with
  a group, five characters or more, no zone), so it keeps a subset of Loki's
  lines for an address inside other text (translate.IPLabelFilter). Log
  queries and the `| json` / `| logfmt` metric stats pushdown emit the same
  filter; the metric plan's row evaluator matches it with a Go mirror of that
  LogsQL (DropCondition.Matches), so rows, pushdown and logs agree.
consumers: [explore, datasource]
cases:
  - semantics/ip-label-filter-missing-label
  - semantics/ip-filter-json-stats-pushdown
  - semantics/ip-filter-keeps-parser-error-lines
  - semantics/ip-filter-ipv4-after-hex-colon
decisions:
  - id: ip-filter-typed-in-metric-plans
    chosen: |
      Label filter stages carry a typed expression (name, operator, value, value
      kind) from the parser; the | json / | logfmt metric plan reads it, renders
      an ip() leaf with the shared translate.IPLabelFilter in the stats pushdown and
      matches it on rows with a Go mirror of that same LogsQL.
    over: [declining ip() filters to the native route (instant queries then read every selected row), moving the test reference of Loki's address scan into the binary (Loki-derived code)]
    why: |
      The plan re-parsed the stage text as a stream selector, which lost that the
      value was ip("..."), and compared the label with the text ip(10.2.0.0/16):
      every ip() metric after a parser answered no series. Declining kept the
      answers right but turned instant queries into raw-row reads, which the
      metric rule forbids; a mirror of the LogsQL keeps one definition for logs,
      pushdown and rows, proven equal by a differential against the VictoriaLogs
      filter emulation.
    evidence: 'compose stack, Loki 3.7.9, VictoriaLogs v1.53.0, 2026-11-07: 7 shapes x 1h/24h query_range equal to Loki; instant [1h] equal; instant [24h] 251,728 vs Loki 251,677 (main: empty) with the controls off by the same stack data gap; zero raw-row reads'
    code: [internal/logql/label_filter_expr.go, internal/logql/parser.go, internal/translator/ip_label_filter.go, internal/translator/label_matcher_regexp.go, internal/proxy/ordered_json_metric.go]
    tests: [TestCompat_IPLabelFilterJSONMetric, TestIPLabelFilterCondition_MatchesLogsQL, TestIPLabelFilterCondition_TextForm, FuzzIPLabelFilterConditionMatchesLogsQL, TestCompileOrderedJSONLabelFilterShapes]
    history:
      - date: '2026-11-07'
        what: '`sum(count_over_time({service_name="api-gateway"} | json | ip=ip("10.2.0.0/16") [1m]))` and the A/B shapes IP4/IP5'
        measured: 'Loki 10,819 lines over 1h, proxy no series, on query and query_range, since #1105 (also at #1145 and on main)'
        cause: 'the ordered-JSON metric plan rebuilt the filter from the stage text and compared strings'
        effect: 'parity run 2026-11-07 clusters 4ebfd2c5 and e1528358; the perf rows IP4/IP5 timed an empty answer'
        fixed_by: '#1156'
        after: 'equal to Loki point for point; stats pushdown with ipv4_range, no raw-row read; cached v1 answers fenced by the ip-label-filter-v2 response key'
    quality: |
      ip() metrics after | json or | logfmt equal Loki on query and query_range,
      ungrouped and grouped, = and != and ranges; the row evaluator, the pushdown
      and the log path answer alike (differential, edge table, fuzz).
    performance:
      tracked: ['ip-label-filter IP4, IP5']
      bound: 'perf block max_ratio 2.0, target 1.0; green at Loki speed or below'
  - id: ip-filter-ipv4-exact-walk-split
    chosen: |
      An IPv4 pattern is read with an exact regexp that follows Loki's walk from
      the last character no run holds (translate ipv4LineRegexps exact), and the
      line and label filters check two short regexps before it (ipv4Split):
      direct (an address of the pattern right after such a character, always a
      match) OR (guard (an address of the pattern after a hex digit, a colon or a
      dot) AND exact).
    over: [the exact regexp alone (18% to 22% slower than the old regexp on plain service lines), a short address-like guard (cheaper to parse, but 40% to 60% slower than base on near misses such as 10.0.0.12 for 10.0.0.1), the old regexp that judged the characters right before the address (wrong after hex digits and colons)]
    why: |
      Loki's scan starts afresh after any character outside hex digits, colons
      and dots, so a regexp from there is exact, but crossing every stretch of hex
      digits, colons and dots costs more than a plain search. Most matching lines
      have the address right after such a character, and most lines that hold the
      pattern's literal without a match have no address of the pattern after a
      hex digit, a colon or a dot, so the exact regexp runs on few lines.
      VictoriaLogs evaluates an OR branch only on undecided rows and an AND branch
      only on kept rows (lib/logstorage filter_or.go, filter_and.go, v1.53.0).
    evidence: 'Loki oracle (ipfilter) on 52,000 line-grid lines, 2026-11-15: every IPv4 line equal to Loki (main: 1,221 differ). Go regexp, GOMAXPROCS=4, n=8, base 55632c966: the line filter costs 48% to 82% less per line on service, hex and 1.5 KB / 4.5 KB JSON lines; VictoriaLogs parses three regexps per query (22 to 33 us for 10.0.0.1, 55 to 117 us for 0.0.0.0/0)'
    code: [internal/translate/ip_line_v4.go, internal/translate/ip_label_filter.go, internal/translate/linefilter.go]
    tests: [TestIPLineFilterMatchesLoki, TestIPv4WalkMatchesLoki, TestIPv4LineRegexMatchesWalk, TestIPv4SplitMatchesExact, TestIPv4LineRegexWalkEdges, FuzzIPv4LineRegexLikeLoki]
    quality: |
      Every IPv4 line of the recorded grid answers like Loki under |= and !=, as
      a line filter and as a label filter on text values; the split equals the
      exact regexp on every grid and random line (test and fuzz).
    performance:
      tracked: ['BenchmarkIPv4LineFilter', 'BenchmarkIPv4LineRegexpParse', 'ip-label-filter IP4, IP5']
      bound: 'per-line cost of the line filter at or below the old regexp for every line set; perf block max_ratio 2.0, target 1.0'
victorialogs_candidates:
  - id: pipe-filter
    since: v1.40.0
    emitted_by_proxy: true
