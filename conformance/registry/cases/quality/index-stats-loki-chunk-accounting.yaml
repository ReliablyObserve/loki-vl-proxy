id: quality/index-stats-loki-chunk-accounting
title: Loki's index/stats entries are pro-rated chunk counts summed over every copy it reads; the proxy's equal Loki's own count_over_time (upstream)
proves:
  - loki_api_v1_index_stats
consumer: drilldown
why: |
  Loki's /index/stats entries are chunk metadata, not a line count. A chunk
  that straddles the window adds its entries (and bytes) pro rata by time
  (pkg/storage/stores/shipper/indexshipper/tsdb/index/chunk.go:262-267,
  pkg/util/time.go:136-154; unflushed chunks pkg/ingester/instance.go:809-814),
  and every copy of a chunk Loki reads is added: the TSDB files before
  compaction (tsdb/index_client.go:195-207), the ingesters and the store
  (pkg/ingester/ingester.go:1439-1463, pkg/storage/async_store.go:167-171,
  whose TODO names the inflation), the 24h splits
  (pkg/storage/stores/index/stats/stats.go:17-28) and the index-stats results
  cache, which pro-rates a cached answer to a shorter window
  (pkg/querier/queryrange/index_stats_cache.go:34-48). On a stack whose
  ingesters retained flushed chunks, entries were 3x Loki's own
  `sum(count_over_time(...))` over the window, which equals the proxy's
  entries. The proxy counts the window's lines exactly in VictoriaLogs
  (`stats count()`), which is Loki's answer when every chunk lies inside the
  window and is read once (TestDrilldown_IndexStatsLikeLoki).

  The differential run marks an entries difference as Loki's chunk accounting
  only when Loki's count_over_time equals the proxy's entries, and a streams
  difference only when Loki's own /series count equals the proxy's streams
  (quality/index-stats-streams-differ).
request:
  method: GET
  path: /loki/api/v1/index/stats
  params:
    query: '{env="production"}'
    start: 'now-1h'
    end: 'now'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [streams, entries]
  expect: |
    Entries equal to Loki's count_over_time; equal to Loki's index/stats where
    every chunk lies inside the window and is read once.
gap:
  status: upstream
  impact: drilldown-visible
  effort: S
  area: 'none (Loki chunk index accounting)'
  loki: 'pkg/storage/stores/shipper/indexshipper/tsdb/index/chunk.go:262-267 pro rata; pkg/storage/async_store.go:167-171 and pkg/storage/stores/index/stats/stats.go:17-28 copies summed'
  proxy: 'exact counts'
  planned_test: 'bench/parity cross-check (run.py loki_counts_itself); TestDrilldown_IndexStatsLikeLoki (test/e2e-compat, group drilldown)'
  clusters:
    - 00a34ca2
