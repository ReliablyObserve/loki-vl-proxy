id: quality/line-filtered-byte-fold-projection-unverified
title: Line-filtered byte folds lack a source-controlled identity-projection proof (open)
pending: true
proves:
  - metric-series-identity
  - loki_api_v1_query_range
consumer: explore
why: |
  Outer avg/count/stddev by level of bytes_over_time/bytes_rate on a parserless error-line filter differ. Both the sample fold and number/identity of input series require source-controlled comparison; no structured-metadata owner-kept inference is made.

  This is evidence debt against the existing identity policy, not a new
  identity policy, waiver, or accepted difference. The raw Loki/proxy
  numeric discrepancy does not establish whether the permitted projection
  explains the result. Do not project the final aggregate and call it equal.

  Required proof: obtain the identical source rows, with their original
  stream labels, structured metadata, parsed keys and timestamps. Apply
  only the already permitted identity projection to those source rows
  BEFORE the range function, time-window selection and vector aggregation.
  Then execute the same function/window/fold on both projected inputs.
  Record the full and projected identities, counts and values. Any
  remaining difference remains a product defect; no new axis is waived.

  Recorded in conformance/registry/generated/parity-discovery.json at
  ref 4a63b99e, recorded 2026-11-21T14:20:35Z, over
  [1795265520, 1795269120]. The actual representative request below
  retains its original bounds and categorize-labels encoding.
  The scope contains 6 clusters and 12 confirmed
  request records. Complete query examples and comparison facets remain
  in that snapshot, indexed by gap.clusters; counts are observed request
  counts, not passing coverage or newly added fixtures.

  Representative recorded facet: {"level": "error"} @1795267140.0: loki 482.9046052631579 proxy 661.2747747747743

  The full response bodies and source-row identity trace are not present
  in the discovery snapshot. Preserve that proof gap until replay or the
  original response evidence establishes the complete contract.
  Original requests/facets: GitHub Actions run 44910591975,
  parity-refresh artifact 14714026577:
  https://github.com/ReliablyObserve/loki-vl-proxy/actions/runs/44910591975/artifacts/14714026577
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    end: '1795269120'
    query: avg by (level) (bytes_over_time({namespace="prod"} |= "error" [5m]))
    start: '1795265520'
    step: '60'
  headers:
    X-Scope-OrgID: '0'
    X-Loki-Response-Encoding-Flags: categorize-labels
  precondition: Original dual-written parity-refresh rows and source profile are available at these recorded bounds.
    Empty results on a different window are not a proof.
  verify:
    blocked_by: fixture
    reason: "The original paired namespace=prod lines containing error, their byte content and stream identities at 1795265520..1795269120 are required to verify bytes_over_time before avg; the verifier does not restore that historical source."
compare:
  mode: observed
  fields:
    - status
    - series
    - values
  values:
    status: 200
  expect: Prove the output using the existing permitted projection of identical source rows before the range function,
    time window and vector aggregation; preserve the raw observed difference. This is not permission for a new projection
    or a waiver.
gap:
  status: open
  impact: explore-visible
  effort: M
  area: Source-controlled identity projection proof and existing typed AST/planner evaluation
  loki: HTTP 200 with the recorded values or timestamped points on the original source rows.
  proxy: HTTP 200 with the recorded difference; no implementation fix or coverage closure is claimed.
  planned_test: Expand the existing registry-driven Loki/VictoriaLogs replay using identical source-row projections
    before functions/windows/aggregations; retain full raw and projected comparisons.
  clusters:
