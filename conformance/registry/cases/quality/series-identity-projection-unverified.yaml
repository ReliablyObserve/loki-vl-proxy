id: quality/series-identity-projection-unverified
pending: true
title: Metric identity-policy projection lacks full source, point, window and limit proof (open)
proves:
  - metric-series-identity
consumer: explore
evidence: needs recording
why: |
  The full differential run on 2026-11-21, source ref 4a63b99e, recorded
  these 137 series clusters over 276 encoded requests. Both backends returned
  200 and every retained facet is labels or series: Loki has labels absent
  from the proxy and more series. None of these scoped requests has a
  proxy-only label or the observed 10000-series plateau. The original
  requests, exact bounds, statuses and all facets are in the parity-refresh
  artifact of https://github.com/ReliablyObserve/loki-vl-proxy/actions/runs/44910591975
  (run/results.jsonl); the committed summary is
  conformance/registry/generated/parity-discovery.json, recorded at
  2026-11-21T14:20:35Z over [1795265520, 1795269120]. Full response bodies
  were not retained, so these observations do not prove point equality.

  The observations resemble the existing stream-metadata identity policy
  (metric-identity/structured-metadata-splits-series) and bare JSON/logfmt
  identity policy (parsed-identity/dynamic-key-parsers). Those policies remain
  defined by their own cases. This case grants no policy, owner-kept status
  or waiver, and does not extend either accepted scope. Its open gap is that
  the complete answer has not been proven to be exactly the permitted
  projection: a missing series, changed point, wrong bound or hidden limit
  cannot be excused by counting fewer labels alone.

  Verification must use identical source rows and the actual effective
  identity profile. Apply only the already-approved identity transformation
  to the SOURCE before the range function, outer aggregation, evaluation
  windows and series limits. A comparison that drops labels and sums Loki's
  finished vectors is insufficient: the scoped queries include avg, min,
  max, first, quantile and stddev over time, whose results generally cannot
  be reconstructed from the finished series after identity was chosen.
  Record source-count controls, every retained label and timestamp/value,
  duplicate multiplicity, lookback boundaries, step alignment, empty/error
  outcomes, warnings and effective caps. Compare plain and categorize-labels
  requests over the recorded range and instant axes. The representative
  request below is the original range request, not a substitute oracle.

  Close this quality gap only after each scoped answer either passes that
  full operation-aware projection proof or is reassigned to a separately
  evidenced behavioral gap. Do not count these rows as Loki-equal, fixed or
  owner-kept merely because this ownership entry exists. Requests with
  proxy-only _msg, an additional 10000-series cut, non-200 status, other
  differing facets or another policy profile are outside this case.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: sort(bytes_rate({service_name="api-gateway"} | json [5m]))
    start: '1795265520'
    end: '1795269120'
    step: '60'
  headers:
    X-Scope-OrgID: '0'
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields:
    - status
    - series
    - labels
    - values
    - timestamps
    - warnings
    - limits
  expect: |
    Full permitted identity-policy projection evaluated from identical
    source rows before nonlinear functions, windows and caps. Every retained
    identity and point, error, warning and effective limit must be checked;
    the current label/series summaries are not this proof.
gap:
  status: open
  impact: explore-visible
  effort: L
  area: conformance identity-policy evidence; existing query-semantics matrix and metric differential fixtures
  loki: full source labels and metric points must be retained as the reference before applying any separately approved
    identity policy
  proxy: 137 historical series clusters resemble existing identity policies but lack complete permitted-projection
    proof
  planned_test: Extend the existing TestQuerySemanticsMatrix and metric differential source fixtures with operation-aware
    policy projection controls and replay every scoped query
