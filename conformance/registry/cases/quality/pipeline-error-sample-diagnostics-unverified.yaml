why: |-
  These seven exact instant/range observations all return HTTP 400 on both sides, but the error-text facets differ. JSONParserErr appears under topk/sort; SampleExtractionErr appears under a grouped max of max_over_time. The excerpts cannot establish whether only the selected failing row differs or whether labels, categories or conversion details were lost. Loki can select another failing sample across shards; this alone cannot authorize accepting an arbitrary error. Closure requires complete DTOs and an independently recorded set of permissible failing samples on identical rows, with exact error kind, detail and label provenance. The existing documented failing-row selection behavior is not expanded.

  Observed in conformance/registry/generated/parity-discovery.json at ref 4a63b99e, recorded 2026-11-21T14:20:35Z, window 1795265520..1795269120. Original request parameters and facets are retained by GitHub Actions run 44910591975, artifact 14714026577: https://github.com/ReliablyObserve/loki-vl-proxy/actions/runs/44910591975/artifacts/14714026577. The discovery snapshot and gap.clusters retain the exact query membership. Complete response-body goldens were not retained. This is an open proof obligation, not a fix, an extension of a default identity policy or a waiver for additional queries.
