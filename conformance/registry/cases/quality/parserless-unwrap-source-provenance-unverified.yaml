why: |-
  These exact parserless unwrap requests also contain predicates before unwrap. Both the filter input and the unwrapped value can depend on whether a field came from the line, stream or structured metadata. Loki returns no series where the proxy returns series. Existing open contracts semantics/unwrap-parserless-reads-stored-field and semantics/label-filter-before-parser-reads-ingest-json-key provide separate controls, but the retained excerpts cannot isolate the first differing stage. Closure requires identical raw rows with explicit field provenance and per-stage predicate/value checks; neither the filter nor unwrap may be credited without this evidence. This is a scoped proof gap, not permission to expose body keys before a parser.

  Observed in conformance/registry/generated/parity-discovery.json at ref 4a63b99e, recorded 2026-11-21T14:20:35Z, window 1795265520..1795269120. Original request parameters and facets are retained by GitHub Actions run 44910591975, artifact 14714026577: https://github.com/ReliablyObserve/loki-vl-proxy/actions/runs/44910591975/artifacts/14714026577. The discovery snapshot and gap.clusters retain the exact query membership. Complete response-body goldens were not retained. This is an open proof obligation, not a fix, an extension of a default identity policy or a waiver for additional queries.
