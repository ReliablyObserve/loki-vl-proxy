id: quality/label-cache-aged-labels-kept
title: Labels that age out of the window are never dropped from the merged label cache (open)
proves:
  - data-probing-and-freshness
  - loki_api_v1_labels
consumer: explore
why: |
  Loki's /labels is bounded by the requested window: label names of streams
  without samples in the window are not listed once Loki reads them from its
  store. The proxy merged new label names into its cached list
  (mergeLabelsIntoCache) and never removed one, so a label whose last stream
  left the window stayed listed for as long as the cache key (the window
  start bucketed to 5m, 1h or 6h) kept being refreshed. Loki lists a
  just-pushed stream's label outside its samples' window
  (quality/labels-just-pushed-stream-before-window), so an e2e fixture pushed
  during the test cannot show the aged-out answer against Loki; the
  proxy-side behaviour is pinned by TestStoreLabelsCache_ReplacesExisting and
  TestHandleLabels_RefreshReplacesCachedAnswer.
request:
  method: GET
  path: /loki/api/v1/labels
  params:
    start: 'now-5m'
    end: 'now'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [data]
  expect: |
    The labels Loki lists for the window: a label whose streams have no
    samples in the window and that Loki reads from its store is not listed;
    a cached answer never adds labels a later listing of the window dropped.
gap:
  status: open
  impact: explore-visible
  effort: S
  area: 'internal/proxy/label_metadata.go storeLabelsCache (was mergeLabelsIntoCache)'
  loki: 'pkg/querier/querier.go Label (window-bounded)'
  proxy: 'union never shrinks'
  planned_test: 'an e2e against Loki once a fixture can be made old in Loki''s sense (see quality/labels-just-pushed-stream-before-window)'
  clusters: []
