id: versions/capabilities-floor-vs-matrix
title: logsql.Capabilities treated VictoriaLogs below v1.40 as unsupported while the matrix claimed v1.30 (fixed)
proves:
  - loki-compatible-profile
consumer: operator
why: |
  internal/logsql/capabilities.go returns the zero capability set for versions
  before v1.40 (no pipe or stats function assumed), while
  test/e2e-compat/compatibility-matrix.json lists v1.30.0 onwards as
  supported. A v1.30-v1.39 backend therefore ran the conservative paths (or
  none) for features the matrix called supported.

  Fixed by the support policy change: the supported lines are v1.4x and v1.5x
  (floor v1.40.0), the matrix lists the latest 3 releases of each line, the
  `-backend-min-version` default is v1.40.0, and the proxy warns at startup
  for any detected version below the floor whatever the flag says.
  TestVictoriaLogsSupportPolicy keeps the floor, the matrix, the Helm value
  and the capability profiles in step.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum by (level) (count_over_time({env="production"}[5m]))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [status, series]
  expect: |
    Same answers on every matrix version (the matrix now starts at the floor).
gap:
  status: fixed
  fixed_by: "#659"
  impact: edge
  effort: M
  area: 'internal/logsql/capabilities.go:47 + test/e2e-compat/compatibility-matrix.json'
  loki: 'n/a (backend capability)'
  proxy: 'zero capability set below v1.40, which is now outside the supported lines'
  planned_test: 'TestVictoriaLogsSupportPolicy + TestCapabilitiesFor (internal/logsql)'
  clusters: []
