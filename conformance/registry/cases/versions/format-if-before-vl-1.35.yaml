id: versions/format-if-before-vl-1.35
title: `format if (...)` drops the destination field on VictoriaLogs before v1.35 (open, version-gated)
proves:
  - loki-compatible-profile
consumer: explore
why: |
  LogsQL `format if (...)` keeps rows the condition rejects without the
  destination field only from VictoriaLogs v1.35; earlier versions drop the
  field unless `skip_empty_results` is set. Translations that emit `format if`
  (line_format / label_format with conditions) lose the field on v1.30-v1.34.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{service_name="api-gateway"} | json | label_format lvl="{{.level}}"'
    start: 'now-15m'
    end: 'now'
    limit: '10'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [streams.values]
  expect: |
    The same labels on every matrix version.
gap:
  status: open
  impact: edge
  effort: S
  area: 'internal/translator (format emission) + logsql.Capabilities gate'
  loki: 'pkg/logql/log/fmt.go label_format/line_format'
  proxy: 'field missing on VictoriaLogs < v1.35'
  planned_test: 'unit test for the capability fallback + one e2e group on v1.34'
  clusters: []
