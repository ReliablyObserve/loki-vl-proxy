id: profiles/json-line-stored-without-line
title: A JSON line pushed without _msg is stored without its line (documented)
proves:
  - loki-compatible-profile
  - loki_api_v1_query_range
consumer: explore
why: |
  A Promtail- or Alloy-style Loki push of a JSON line carries no _msg key.
  VictoriaLogs' Loki push endpoint (v1.30.0 (measured before the support change) and v1.52.0 alike, measured
  2026-10-02) parses the line, stores each key as a field (nested objects as
  dotted names, numbers as strings) and sets _msg to "missing _msg field;
  see https://docs.victoriametrics.com/victorialogs/keyconcepts/#message-field".
  Key order, value types and nesting are lost, and the fields of the line
  cannot be told from the push's structured metadata. Every `| json` metric
  path (the stats pushdown, its parse-risk probes and the row evaluator)
  reads the line from _msg, so such rows count as lines that are not JSON. The proxy rebuilds the
  line from every stored field (structured metadata included), reports them
  as structured metadata without a parser and as parsed labels after
  `| json` or `| logfmt`. Loki returns the original line and no labels from
  it without a parser.

  The proxy cannot recover the line on the read path. Two setups:

  * Option A, the supported setup: push with
    `/insert/loki/api/v1/push?disable_message_parsing=1` (or start VictoriaLogs
    with `-loki.disableMessageParsing`). VictoriaLogs stores the line in _msg
    verbatim and only the structured metadata as fields (verified on v1.30.0
    and v1.52.0), after which every case in profiles/stage-field-exposure
    applies.
  * Option B, `-json-line-fields-as-line-keys` (off by default): every stored
    field of a row whose _msg is the placeholder (VictoriaLogs' built-in one or
    `-backend-default-msg-value`) is read as a key of the row's JSON line. A
    log response classifies the row against the line rebuilt from its fields:
    no label without a parser, parsed labels after `| json` or a json
    extraction list, none from `| logfmt` (an extraction list's names empty),
    label filters on a key no stage exposes drop the row. A query whose every
    log selector reads a label no stage can give such a line (an unwrap, or a
    label filter an empty value fails, after `| logfmt` or without a parser)
    leaves those rows out in VictoriaLogs with one `extra_filters` filter
    (`NOT _msg:="<placeholder>" OR {<label>!=""}`), so
    `max_over_time(... | logfmt amount | unwrap amount [5m])` answers only the
    logfmt streams, as Loki does. `| json` metric queries read such a row as a
    valid JSON object (the parse-risk probes leave it out, the stats split
    keeps it). Structured metadata pushed beside such a line is stored among
    its keys and hidden with the flag on, which is why it is opt-in.
    Measured with the flag on (TestJSONLineFieldsMatchLoki, VictoriaLogs
    v1.49.0 and v1.53.0 against Loki's engine and pipeline oracles): 176 of 208
    runs match Loki, against 66 with the flag off. Still different with the
    flag on: line filters (`|=`, `|~`) read the stored placeholder; a label
    filter an empty value passes, before any parser, reads the stored field;
    `| logfmt` groups such a line by its stored fields where Loki groups it
    under empty values; structured metadata pushed beside the line is hidden;
    number types, nesting and key order of the pushed line are lost.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{app="promtail-json-<ts>"}'
    start: now-5m
    end: now
    limit: "10"
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: exact
  fields: [streams.values, metadata_categories]
  expect: |
    The original line and Loki's label categories (not met: see why).
gap:
  status: documented
  impact: explore-visible
  effort: L
  area: 'client push configuration (disable_message_parsing=1); -json-line-fields-as-line-keys (internal/proxy/json_line_keys.go); docs/KNOWN_ISSUES.md'
  loki: 'the pushed line is returned verbatim'
  proxy: 'line rebuilt from stored fields'
  planned_test: 'cases/profiles/stage-field-exposure with disable_message_parsing pushes'
  note: 'Option B tests: TestJSONLineFieldsMatchLoki (internal/querycorpus; flag off: answers pinned byte for byte; flag on: Loki engine and pipeline oracles, VictoriaLogs v1.49.0 and v1.53.0), TestJSONLineFieldsRepeatServedFromCache, and TestPlaceholderExclusionDecision, TestJSONLineKeysOffChangesNothing, FuzzPlaceholderExclusion (internal/proxy).'
  clusters: []
