id: profiles/grafana-shows-loki-error-text
title: Grafana shows the proxy's query error with Loki's exact text
proves:
  - loki-compatible-profile
  - status-400
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki answers a rejected query with its message as a text/plain body.
  Grafana's Loki datasource (pkg/tsdb/loki/api.go readLokiError /
  makeLokiError) displays the "message" field of a JSON error body and falls
  back to the raw body, and wraps a non-2xx resource answer (Logs Drilldown)
  as {"message": <that text>}. The proxy's error envelope used to be JSON, so
  Explore displayed the whole object until a "message" field was added. The
  error body is now Loki's own: the message alone as text/plain, which Grafana
  shows verbatim on both paths. -error-response-message-field is deprecated
  and ignored.
request:
  method: POST
  path: /api/ds/query
  params:
    expr: "{env=\"production\"} | json | pipeline=`metrics/prometheus` | k8s.namespace.name=`monitoring`"
  headers: {}
compare:
  mode: exact
  fields: [results.A.status, results.A.error]
  expect: |
    Through Grafana, the proxy datasource and Loki (direct) both answer 400
    with the same results.A.error text.
