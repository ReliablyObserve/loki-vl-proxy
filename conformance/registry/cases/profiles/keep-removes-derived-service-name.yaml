id: profiles/keep-removes-derived-service-name
title: `| keep` removes service_name the proxy derived for a stream without one (fixed)
proves:
  - service-name-derivation
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki's keep stage deletes every non-special label not named in its list,
  including service_name (pkg/logql/log/keep_labels.go). The proxy derives
  service_name on the read path for rows whose stream has none and adds it
  after the pipeline, so `| keep a, b` still shows service_name.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{namespace="prod"} | json | keep level'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: exact
  fields: [streams.stream]
  expect: |
    Only the kept labels.
gap:
  status: fixed
  fixed_by: 90dc4542842eb4c03fea851b52bbda94dce08910
  impact: explore-visible
  effort: S
  area: 'internal/proxy service_name derivation after keep/drop'
  loki: 'pkg/logql/log/keep_labels.go:15-44 KeepLabels.Process'
  proxy: 'translated stream labels now obey bare keep/drop even when absent from the stored _stream'
  planned_test: 'TestCompat_KeepRemovesDerivedServiceName (test/e2e-compat, group semantics)'
  note: 'Reproduced on main a1d16276 against Loki 3.7.9; the paired E2E fixture checks default and categorize-labels responses. The separate structured-metadata keep case remains open.'
  clusters:
    - 0acfebdb
    - 3e6bb855
    - 59ebda99
    - 7af7ff7b
    - 8ae09281
