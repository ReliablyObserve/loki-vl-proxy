id: profiles/json-extraction-list-exposes-only-listed
title: Extraction lists (`| json msg="msg"`, `| logfmt op`) expose only selected fields (fixed)
proves:
  - loki-compatible-profile
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki's extraction-list parsers expose only the listed keys. When a preserved
  JSON or logfmt line also had a projected `level` body field in VictoriaLogs,
  the proxy exposed that unlisted field as a log or metric-series label. The
  projected field is still available internally to derive `detected_level`.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{app="matrix-extraction-list",case="json"} | json msg="msg"'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: exact
  fields: [streams.stream, streams.values, parsed labels, structured metadata, matrix.metric, matrix.values]
  expect: |
    The named JSON parser exposes msg but not level; the named logfmt parser
    exposes op but not level. Grafana's count_over_time volume query also
    groups by detected_level without an unlisted level. Full parsers remain
    a separate control.
gap:
  status: fixed
  fixed_by: cf203629987b042cb2edb5022c77d6cf1a121c45
  impact: explore-visible
  effort: S
  area: 'internal/proxy stage-field exposure (extraction lists)'
  loki: 'pkg/logql/log/parser.go:671-700 JSONExpressionParser.Process (listed ids only)'
  proxy: 'unlisted projected line level is hidden from extraction-list log and metric output while retained for detected_level'
  planned_test: 'TestCompat_JSONExtractionListExposesOnlyListed and TestQuerySemanticsMatrix (test/e2e-compat, group core)'
  note: 'Reproduced on main 8d5c553a and compared against Loki 3.7.9 on the existing playground. The shared preserved-line fixture covers JSON and logfmt log queries and grouped range metrics in the typed matrix, with full-parser controls; focused E2E also checks default and categorize-labels responses. Missing original line on a separate VL ingest path remains profiles/json-line-stored-without-line.'
  clusters:
    - 7dac2581
