id: profiles/keep-structured-metadata-key
title: `| keep` retains a mapped structured-metadata key (fixed)
proves:
  - loki-compatible-profile
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki keeps `deployment_environment` when a log line carries that structured
  metadata. VictoriaLogs can store the same attribute as either
  `deployment.environment` or `deployment_environment`; the old keep
  projection requested only the latter and dropped the dotted field.
  The proxy now projects both spellings and exposes only Loki's label name.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{service_name="checkout-svc"} | keep deployment_environment'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [streams.values, structuredMetadata]
  expect: |
    deployment_environment kept.
gap:
  status: fixed
  fixed_by: "#971"
  impact: explore-visible
  effort: S
  area: 'internal/translator/translator.go translateKeepStage, internal/proxy response caches'
  loki: 'pkg/logql/log/keep_labels.go:15-44'
  proxy: 'keeps mapped and pre-normalized field names; versions old keep-response cache entries'
  planned_test: 'TestCompat_KeepStructuredMetadataKey (test/e2e-compat core) and explore-keep-structured-metadata (visual fix proof)'
  note: 'Reproduced on main 6159745f with a dual-ingest fixture; all four ordinary/categorized keep queries differed before and matched Loki after the fix. Visual smoke seeds the dotted stored field separately.'
  clusters:
    - 4e8cf844
