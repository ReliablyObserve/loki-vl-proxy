id: severity/detected-level-filter-json-level
title: '`| detected_level=` filters select different lines than Loki (JSON-level lines, stream level precedence) (fixed)'
proves:
  - severity-detected-level-derivation
  - loki_api_v1_query_range
consumer: drilldown
why: |
  Loki stores detected_level at ingest (v3.7.9 pkg/distributor/
  field_detection.go extractLogLevel:96-127): a level stream label first,
  then structured metadata, then the OTLP severity number, then the line's
  JSON or logfmt level key, then its first bounded level keyword
  (detectLevelFromLogLine:388-403), else `unknown`. A filter on it selects
  every line of that level.

  The proxy rendered a `| detected_level <op> "v"` stage before any parser as
  `| unpack_logfmt | filter level <op> v`: a line's logfmt `level=` key
  overwrote the stored stream label, and a line with no level never matched
  `unknown`. On the stack, `{env="production"} | detected_level!="info"` and
  `=~"error|warn"` kept worker-service lines (stream level=info, logfmt
  level=error) as an `info` series, dropped cache-redis lines (stream
  level=debug, logfmt level=info), and `detected_level="unknown"` returned 0
  lines where Loki returns 119; the per-service rate and topk of errors
  counted worker-service. The metric path computed detected_level with the
  chain for the grouping and still filtered on the overwritten level.

  The stage now compares the value the detected_level chain derives
  (translator.BuildDetectedLevelFilter) with Loki's label-filter semantics:
  log queries filter a scratch value that is deleted again, metric queries
  write detected_level with the grouping chain once. A regexp-free
  prefilter keeps the chain off rows that cannot match. A filter after a
  parser, drop, keep or label_format stage keeps its rendering
  (severity/detected-level-stage-side-effects).

  The extra version="v1" series the Drilldown labels tab still showed with a
  level pill on the visual stack is the grouping, not the filter: with an
  emulated VictoriaLogs over the stack's api-gateway shape, the proxy's
  per-step counts of v1 and v2 add up to Loki's v2. It is
  semantics/stream-label-shadowed-by-ingest-json-key.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{namespace="prod"} | detected_level="warn"'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [streams.values]
  expect: |
    Every warn line, as Loki selects.
gap:
  status: fixed
  fixed_by: '#1037'
  impact: drilldown-visible
  effort: M
  area: 'internal/translator/translator.go detectedLevelStageFilter, internal/translator/detected_level_logsql.go BuildDetectedLevelFilter'
  loki: 'pkg/distributor/field_detection.go extractLogLevel (v3.7.9) stores detected_level as structured metadata; the filter reads it'
  proxy: 'the filter compares the chain-derived detected_level, the value the response derivation shows'
  planned_test: 'TestCompat_DetectedLevelFilterJSONLevel (test/e2e-compat, group core); TestDetectedLevelFilterAnswersLikeLoki, TestDetectedLevelFilterDifferential, FuzzDetectedLevelFilterLikeLoki, TestDetectedLevelFilterThroughHandlersLikeLoki (internal/proxy)'
  clusters: []
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null
