id: severity/detected-level-stage-side-effects
title: keep/drop detected_level and a detected_level filter change other labels (open)
proves:
  - severity-exposure-surfaces
  - loki_api_v1_query_range
consumer: explore
why: |
  The proxy now matches Loki for `| keep detected_level` and
  `| drop detected_level` across stored level fields and stream labels, in
  both ordinary and categorize-labels responses. A bare
  `| detected_level!=""` also matches on streams without that label.
  Two related cases remain open: `| drop level` changes a derived
  detected_level computed from stored structured metadata, and a bare
  detected_level filter omits a stream carrying that label. Both were
  exposed by extending the same live Loki comparison fixture.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{service_name="api-gateway"} | drop detected_level'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [streams.stream]
  expect: |
    Loki's labels.
gap:
  status: open
  impact: explore-visible
  effort: S
  area: 'internal/proxy/detected_level.go, internal/translator/translator.go (derived level after drop/filter)'
  loki: 'pkg/logql/log/keep_labels.go, drop_labels.go (detected_level is ordinary structured metadata)'
  proxy: 'keep/drop detected_level corrected; drop level and label-collision filter remain open'
  planned_test: 'TestCompat_DetectedLevelKeepDrop (test/e2e-compat core); extend it for drop level and stream-label filter after their implementation'
  note: 'The older bare-filter parsed-field leak no longer reproduces on main at 6159745f. The two remaining failures reproduce with the existing dual-ingest fixture and are not asserted as passing.'
  clusters:
    - 89a7162d
    - ab9cc1fc
    - f737ddd5
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null
