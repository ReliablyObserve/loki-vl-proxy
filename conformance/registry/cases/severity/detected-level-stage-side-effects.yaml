id: severity/detected-level-stage-side-effects
title: detected_level pipeline filters and later stage side effects (open)
proves:
  - severity-exposure-surfaces
  - loki_api_v1_query_range
consumer: explore
why: |
  The proxy matches Loki for bare `| keep detected_level`,
  `| drop detected_level`, `| drop level`, and presence filters
  `| detected_level!=""` / `| detected_level=""` across stored level
  fields, stream labels, and ordinary or categorize-labels responses.
  A value filter behind a parser, a formatting stage or a drop or keep that
  leaves the label, and any value filter on a removed label, selects Loki's
  entries (semantics/level-filter-after-stage). Value filters behind a stage
  that writes the label remain open: a drop or keep matcher on it, a
  `label_format` from or to it, a parser after it was removed (the line's key
  of that name becomes the label) and unpack still filter the stored or parsed
  level field, and a label_format target may be classified as a parsed label
  instead of Loki's structured metadata.

  The differential run of 2026-11-04 (proxy 69d07019, Loki v3.7.9,
  VictoriaLogs v1.53.0) shows two more on a line whose level is structured
  metadata `level=Warning` on Loki and a stored field on VictoriaLogs
  (`{service_name="visual-detected-level-stage"}`): `| keep
  detected_level_extracted` keeps the `level` label Loki drops, and `| keep
  detected_level` with plain encoding answers 4 entries on Loki and 2 on the
  proxy.

  The run of 2026-11-07 (proxy a3ad4c1b) records `| keep detected_level` as
  a different difference: Loki returns `detected_level` in the entries'
  structured metadata and the proxy does not (cluster a4c74036).
corpus:
  size: 2
  dimensions:
    shapes:
      - query: '{service_name="worker-service"} | logfmt | detected_level="error"'
      - query: '{service_name="api-gateway"} | drop detected_level'
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{service_name="visual-detected-level-stage"} | keep detected_level'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [status, streams.stream, streams.values]
  expect: |
    Loki's entries, each with detected_level in its structured metadata.
gap:
  status: open
  impact: explore-visible
  effort: S
  area: 'internal/proxy/detected_level.go, internal/translator/translator.go, internal/proxy/loki_profile.go (derived value filters and stage ordering)'
  loki: 'detected_level is ordinary structured metadata, so keep and drop act on it'
  proxy: 'bare keep/drop, presence filters and value filters before or behind stages that leave the label corrected; value filters behind a stage that writes it and later label_format ordering remain open'
  planned_test: 'TestCompat_DetectedLevelKeepDrop and TestCompat_DetectedLevelPresenceFilters (test/e2e-compat core); extend the live Loki comparison for exact-value filters and label_format ordering when fixed'
  note: 'The remaining value-filter and label_format differences reproduce with the existing dual-ingest fixture; they are not asserted as passing.'
  clusters:
    - 3bf7d7dd
    - 877ff75b
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null
