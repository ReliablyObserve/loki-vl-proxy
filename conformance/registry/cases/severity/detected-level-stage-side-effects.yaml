id: severity/detected-level-stage-side-effects
title: detected_level pipeline filters and later stage side effects (open)
proves:
  - severity-exposure-surfaces
  - loki_api_v1_query_range
consumer: explore
why: |
  The proxy matches Loki for bare `| keep detected_level`,
  `| drop detected_level`, `| drop level`, and presence filters
  `| detected_level!=""` / `| detected_level=""` across stored level
  fields, stream labels, and ordinary or categorize-labels responses.
  An exact value filter that no parser, line rewrite or label stage
  precedes compares the same per-entry derived value the response path
  exposes (severity/detected-level-filter-json-level). Value filters after
  a parser, drop, keep or label_format stage, and later
  `label_format detected_level=...` stage ordering, remain open: after
  `| logfmt` or `| json` the filter still reads the parsed level key
  (`{service_name="worker-service"} | logfmt | detected_level="error"`
  keeps lines Loki labels info, whose logfmt `level` becomes
  `level_extracted`), and a label_format target may be classified as a
  parsed label instead of Loki's structured metadata.

  The differential run of 2026-11-04 (proxy 69d07019, Loki v3.7.9,
  VictoriaLogs v1.53.0) shows two more on a line whose level is structured
  metadata `level=Warning` on Loki and a stored field on VictoriaLogs
  (`{service_name="visual-detected-level-stage"}`): `| keep
  detected_level_extracted` keeps the `level` label Loki drops, and `| keep
  detected_level` with plain encoding answers 4 entries on Loki and 2 on the
  proxy.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{service_name="api-gateway"} | drop detected_level'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [streams.stream]
  expect: |
    Loki's labels.
gap:
  status: open
  impact: explore-visible
  effort: S
  area: 'internal/proxy/detected_level.go, internal/translator/translator.go, internal/proxy/loki_profile.go (derived value filters and stage ordering)'
  loki: 'pkg/logql/log/keep_labels.go, drop_labels.go (detected_level is ordinary structured metadata)'
  proxy: 'bare keep/drop, presence filters and value filters before any stage corrected; value filters after a parser, drop, keep or label_format and later label_format ordering remain open'
  planned_test: 'TestCompat_DetectedLevelKeepDrop and TestCompat_DetectedLevelPresenceFilters (test/e2e-compat core); extend the live Loki comparison for exact-value filters and label_format ordering when fixed'
  note: 'The remaining value-filter and label_format differences reproduce with the existing dual-ingest fixture; they are not asserted as passing.'
  clusters:
    - 3bf7d7dd
    - 877ff75b
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null
