id: limits/range-metric-step-adapt
title: A range metric query whose read at the requested step passes a proxy read bound is answered at the smallest whole multiple of its step that fits, with Loki's warning
pending: true
proves:
  - loki_api_v1_query_range
  - heavy-metric-fetch-bounds
consumer: explore
why: |
  Issue #1795, the adaptive step. The proxy reads a range metric as a bucket
  grid: (range + window) / gcd(step, window) buckets per series. Past
  11,000 buckets it reads the raw rows of the window instead. Grafana's step
  over a short range (about 50 ms over 80 s) with a [1h] window is 73,600
  buckets, so the shapes that the window recurrence does not serve read raw
  rows. A busy window then passes -manual-range-metric-row-limit or
  -backend-max-buffered-response-bytes, and the proxy answered Loki's limit
  error (400 `limit reached while evaluating the query`, 500
  `rpc error: code = ResourceExhausted ...`) where Loki answers 200. This
  covered per-stream count_over_time, unwrap sum/avg/max/quantile, topk over
  `| json`, binary operations and several parser stages (measured with
  real VictoriaLogs, rankedParserFixture).

  The step layer (internal/proxy/step_adapt.go, read_budget.go
  effectiveStepMultiple) serves the request as sent first. Only a limit error
  of such a read, which the step sizes, makes it serve the request again at
  the smallest whole multiple k of the step whose reads fit: every window
  within the bucket bound, and a read that failed within the bound at most
  -range-metric-step-budget-bytes of its buckets. The timestamps of the
  effective request are timestamps of Loki's answer at the requested step:
  multiples of k x step with -align-queries-with-step, start + j x k x step
  without it. The windows stay what the query says, so every value is Loki's
  at that time. At 50 ms over [1h] the step is 400 ms. At 53 ms it is 19.08 s,
  because no multiple of 53 ms shares a larger factor with the hour. The
  answer carries Loki's warnings field and the header X-Proxy-Step-Adjusted.
  It is counted by loki_vl_proxy_step_adjusted_total and never cached as
  such.

  Unchanged:
  - a request that fits, byte for byte, with the same VictoriaLogs calls;
  - Loki's own limits and errors;
  - an answer that would pass the bytes the proxy sends at the requested step;
  - instant and log queries, /index/volume_range and /patterns, whose points
    depend on the step;
  - windows that follow the step ($__auto).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum by (peer_ip) (sum_over_time({app="edge-json"} | json | unwrap bytes [1h]))'
    start: '2025-12-31T23:58:40Z'
    end: '2026-01-01T00:00:00Z'
    step: '50ms'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: exact
  expect: |
    200 with one warning `step raised from 50ms to 400ms to fit the query
    limits`; every point is Loki's (recorded Loki engine at 50 ms) at its time,
    every time on Loki's grid and on the effective grid, and every point of
    Loki's answer on the effective grid present (VictoriaLogs v1.49 and v1.54,
    bounds on and off the step grid). With -range-metric-step-mode=off the
    limit error main answers; a request that fits with the mode off is the
    same bytes from the same VictoriaLogs requests in adaptive mode.
loki_parity: |
  Loki answers at the requested step (its engine evaluates each step from
  the lines). The proxy answers fewer points at Loki's times and values and
  says so in Loki's warnings field. This is a recorded intended difference
  (decision range-metric-step-adapt): it replaces a limit error, never an
  answer.
