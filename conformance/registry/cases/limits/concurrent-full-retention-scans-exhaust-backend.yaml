id: limits/concurrent-full-retention-scans-exhaust-backend
title: Concurrent full-retention metadata scans and raw-row fetches OOM-kill VictoriaLogs
proves:
  - backend-admission-and-heavy-query-queueing
consumer: any
why: |
  On 2026-09-23 the e2e VictoriaLogs (v1.52.0, 8 GiB container limit,
  `-memory.allowedBytes=3GiB`, `-search.maxConcurrentRequests=64`) was
  OOM-killed three times in seven minutes (docker `oom` + `die exit=137` at
  20:09:57Z, 20:12:32Z and 20:16:36Z) while ten proxy replicas, two A/B
  sessions and an owner's Drilldown session queried it. Its own slow-query
  log names what was running: before every kill, several concurrent
  `/select/logsql/stream_field_names?query=*` calls over the whole 7-day
  retention (63-96 s each, then queue timeouts) from seven proxy
  containers, and 3 h-24 h raw-row fetches (`env:="production" | limit
  1000001`, the raw-row evaluator's fetch on v1.92.0 for a `| json` metric
  with a label filter before the parser, 862 MB per 3 h). Memory sat at
  6.4-6.6 GiB before the first and third kills and rose 2.8 -> 6.9 GiB in
  21 s before the second, while a raw fetch, a 7-day inventory scan and a
  3 h stats query with `unpack_logfmt` ran back to back.

  Reproduced one at a time with a memory watchdog, on the same data: one
  7-day `stream_field_names` takes 8.5 s with flat memory; one 3 h raw
  fetch (862 MB) takes 3.9 s and +0.9 GiB transient with a fast reader,
  flat with a reader that consumes rows at the proxy's pace. No single
  query reaches the limit: the kill is the sum of concurrent scans that
  VictoriaLogs admits (64) without accounting for their memory, which its
  documentation of `-search.maxConcurrentRequests` warns about ("many
  concurrently executed requests may require high amounts of memory").
  Loki direct answers the same LogQL without distress: `/labels` over 7
  days in 12 ms, the metric shapes in 0.5-21 s.

  Two of the proxy's own choices feed it. The stream-field inventory
  (`stream_field_names`) is fetched over the whole retention when
  `-metadata-default-lookback=0`, as the e2e stack runs, and once per
  replica; and metadata lookups are deliberately outside the heavy-query
  limiter (limits/metadata-not-queued), so nothing bounds how many
  full-retention scans reach VictoriaLogs at once. The raw-row fetch is
  bounded (it counts as heavy: at most -backend-max-concurrent-heavy-queries
  per replica), but the bound is per replica.

  Mitigations, in order of leverage: (1) VictoriaLogs-side, lower
  `-search.maxConcurrentRequests` from 64 to a number the memory limit can
  carry (v1.52.0 has no per-query memory bound; `-memory.allowedBytes`
  covers caches only); (2) proxy-side, count `stream_field_names` and
  `field_names` over at least -backend-heavy-query-min-range as heavy, or
  serve the inventory refresh from one replica-wide singleflight with a
  bounded lookback instead of the whole retention; (3) stack-side, set
  `-metadata-default-lookback` above 0. This case records the finding and
  the proposal; the pushdown work in the same change removes the raw-row
  fetch for label filters before the parser
  (semantics/label-filter-before-parser-pushdown), which was one of the
  scans in flight.
request:
  method: GET
  path: /loki/api/v1/labels
  params:
    start: now-7d
    end: now
  headers:
    X-Scope-OrgID: "0"
  precondition: |
    Several proxy replicas refresh their stream-field inventory over the
    whole retention at once while long-range raw-row fetches run.
compare:
  mode: exact
  fields: [status]
  expect: |
    VictoriaLogs must stay up (RestartCount unchanged) and /labels must
    answer 200; today the backend is OOM-killed under this concurrency.
