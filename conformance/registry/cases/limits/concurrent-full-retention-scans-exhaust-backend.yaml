id: limits/concurrent-full-retention-scans-exhaust-backend
title: Concurrent full-retention metadata scans stay bounded instead of OOM-killing VictoriaLogs
proves:
  - backend-admission-and-heavy-query-queueing
consumer: any
why: |
  On 2026-09-23 the e2e VictoriaLogs (v1.52.0, 8 GiB container limit,
  `-memory.allowedBytes=3GiB`, `-search.maxConcurrentRequests=64`) was
  OOM-killed three times in seven minutes (docker `oom` + `die exit=137` at
  20:09:57Z, 20:12:32Z and 20:16:36Z) while ten proxy replicas, two A/B
  sessions and an owner's Drilldown session queried it. Its slow-query log
  names what ran before every kill: seven proxy containers sent
  `/select/logsql/stream_field_names?query=*` over the whole 7-day retention
  at the same moment (63-96 s each, then queue timeouts), beside 3 h-24 h
  raw-row fetches (`env:="production" | limit 1000001`, the v1.92.0 raw-row
  evaluator, since pushed down). A recorder sampling the container every 5 s
  saw 2.3 -> 6.3 GiB in 27 s during the first wave and 2.8 -> 6.9 GiB in 21 s
  before the second kill.

  Measured one at a time on the same data: one 7-day `stream_field_names`
  scan holds 0.8 GiB for 8.8 s; three at once hold 2 GiB more and take 16 s
  each (concurrency buys memory, not throughput); a 24 h scan is 3.3 s, 6 h
  is 1.2 s; `field_names` over 7 days is 0.23 s (column index); a 7-day
  `stream_field_values` is 9.4 s and 0.8 GiB; a 7-day `streams` listing is
  11.8 s, 0.6 GiB and a 492 MB body. Sent through the v1.93.0 proxy, seven
  distinct 7-day /labels and /label/env/values requests at once took the
  container from 1.7 to 6.4 GiB in 18 s (aborted by a watchdog). No single
  query reaches the limit: the kill is the sum of the scans VictoriaLogs
  admits, and v1.52.0 has no per-query memory bound (`-memory.allowedBytes`
  covers caches only). Loki answers the same requests from its index:
  /labels over 7 days in 12 ms.

  The replicas coincided because the label keep-warm loop warms the 1h, 6h,
  24h and 7d presets at a fixed interval (three quarters of the labels TTL)
  from a common start, and a 7-day warm-up that timed out under the
  contention (60 s budget) was retried on every tick, so the waves repeated
  every 3m45s until the backend died. Metadata lookups were deliberately
  outside the heavy-query limiter (limits/metadata-not-queued), so nothing
  bounded how many full-retention scans reached VictoriaLogs at once, and
  `-metadata-default-lookback=0` on the e2e stack made every unbounded
  /labels a full-retention scan on top.

  The proxy now bounds long-range metadata listings with their own limiter,
  -backend-max-concurrent-metadata-scans (limits/metadata-scan-queue-429):
  background inventory work skips instead of waiting when the slots are
  busy, a failed preset warm-up backs off (one interval, doubling to an
  hour), and the keep-warm interval is jittered so replicas drift apart.
  Under the same seven-way storm the fixed build holds VictoriaLogs at
  3.0 -> 4.1 GiB, answers five requests and rejects two with the documented
  429, and the 7-day label list is unchanged.
request:
  method: GET
  path: /loki/api/v1/labels
  params:
    start: now-7d
    end: now
  headers:
    X-Scope-OrgID: "0"
  precondition: |
    Several proxy replicas refresh their stream-field inventory over the
    whole retention at once, or several users open a 7-day label browser at
    the same moment.
compare:
  mode: exact
  fields: [status]
  expect: |
    VictoriaLogs stays up (RestartCount unchanged), a short-range /labels
    keeps answering 200 throughout, every long-range request is answered
    with 200 or the documented 429 naming -backend-max-concurrent-metadata-scans,
    and the 7-day label list still carries every label Loki reports.
