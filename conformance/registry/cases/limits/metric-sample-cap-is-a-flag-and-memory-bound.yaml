id: limits/metric-sample-cap-is-a-flag-and-memory-bound
title: The samples a proxy-evaluated metric answer may hold are an operator flag, bounded by the process memory limit
pending: true
proves:
  - operator-configurable-limits
  - loki_api_v1_query_range
consumer: operator
why: |
  The proxy evaluates some metric queries itself (a mixed `| json | logfmt` count, a
  parser-direct range metric) and refused any answer past one million samples with a
  compiled-in constant. Loki has no such cap: a high-cardinality count over 12h to 24h
  (about 140k series of ten points, 1.3 million samples) is answered by Loki and was
  answered 500 by the proxy, with no flag to change it (limits/every-cap-is-a-flag).
  The cap is now -ordered-json-metric-max-samples, default 10,000,000. A request holds
  its samples at about 96 bytes each while it is evaluated, so the effective cap is
  also lowered to a quarter of the runtime memory limit (GOMEMLIMIT) and never goes
  below the one million samples the proxy always had. Past the cap the answer is
  Loki's response-too-large 500 and the request error log line names the flag and its
  value; the client text is Loki's, never a flag.
request:
  scope: build
  entry: effectiveMetricSampleLimit
compare:
  mode: exact
  expect: |
    The flag is declared, documented in the generated reference and the Helm values, and a
    negative value is rejected at startup naming the flag; 0 selects the default. The
    effective cap is min(flag, GOMEMLIMIT / 4 / 96) and at least 1,000,000. An answer
    past it is Loki's ResourceExhausted 500 with limit_flag=-ordered-json-metric-max-samples;
    an answer below it is built.
