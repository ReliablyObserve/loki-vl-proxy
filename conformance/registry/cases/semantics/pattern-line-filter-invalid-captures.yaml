id: semantics/pattern-line-filter-invalid-captures
title: A pattern line filter with consecutive or named captures is Loki's 400 with Loki's text (fixed)
pending: true
proves:
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: api
why: |
  Loki parses the pattern of a `|>` or `!>` filter with pattern.ParseLineFilter
  (pkg/logql/log/pattern/pattern.go:36-52), which rejects two captures in a row
  (validateNoConsecutiveCaptures) and any capture that has a name
  (validateNoNamedCaptures; only `<_>` is allowed), so the query is a 400 before
  any data is read:
  `|> "<_><_>"` answers `parse error : stage '|> "<_><_>"' : found consecutive
  capture '<_><_>': invalid expression`, and `|> "<foo>"` and `|> "<_> <foo>"`
  answer `parse error : stage '|> "<foo>"' : named captures are not allowed:
  found '<foo>'` (Loki 3.7.7, measured on an isolated stack).

  The proxy validates neither. Measured on VictoriaLogs v1.52.0 against the same
  data, base build and this branch: `|> "<_><_>"` was a 200 with every line and
  is now a 400 whose text is VictoriaLogs' extract error ("missing delimiter
  between <__lvp_pf0_1> and <__lvp_pf0_2>", with the proxy's scratch field
  names), so the status agrees with Loki by accident and the body does not;
  `|> "<foo>"` and `|> "<_> <foo>"` were a 200 with no line (the name read as
  literal text) and are now a 200 with every line (the name read as a capture).
  None of the three is a query Loki answers, so no valid query changed.

  Fixed: the LogQL validation reads each pattern with the shared pattern
  lexer (logql.LinePatternNodes) and rejects two captures in a row (reported
  first within a pattern) and any capture other than `<_>`, with Loki's text;
  a `|>` chain is read in order and a `!>` chain, which Loki builds as one
  `!>` per alternative, from its last alternative. Recorded with the Loki
  oracle (test/oracle/loki pipeline, Loki's exported pipeline build) on a grid
  of 418 queries: every status equal, and every text equal where the line
  filter stands alone; where Loki quotes a run of line filters see
  semantics/line-filter-error-quotes-the-run. The `| pattern` parser keeps
  its named captures.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{service_name="api-gateway"} |> "<_><_>"'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [status, error_text]
  expect: |
    Loki's 400 parse error.
gap:
  status: fixed
  impact: api-only
  effort: S
  area: 'internal/logql line_pattern_validate.go (patternLineFilterError), line_pattern.go (LinePatternNodes)'
  loki: 'pattern line filter patterns: no captures in a row, only <_> (recorded with the Loki oracle pipeline command)'
  proxy: 'the LogQL validation rejects them with Loki''s text before anything is translated'
  planned_test: 'TestCompat_PatternLineFilterInvalidCaptures (test/e2e-compat, group core); TestPatternLineFilterValidationMatchesLoki (internal/logql)'
  fixed_by: '#1239'
  visual: none
  visual_reason: 'a 400 parse error, which Grafana shows as the error text only; the e2e test compares the status and the body bytes with Loki for log and metric queries'
  clusters:
    - d3337db8
