id: semantics/unwrap-per-series-identity-raw-rows
title: A function taken per series (avg, max, min, stddev, stdvar, quantile over time, rate_counter) under sum, sum by, max, min or avg reads the stream and every parsed label as the series (open)
pending: true
proves:
  - metric-series-identity
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  Only sum over rate, sum_over_time, count and the bytes functions is evaluated
  on the folded samples (pkg/logql/syntax/ast.go:1612-1642 canInjectVectorGrouping).
  Every other function under a vector aggregation is evaluated per series, the
  stream plus the labels a parser extracts less the unwrapped one
  (pkg/logql/log/metrics_extraction.go:150-178), and the aggregation then folds
  those values (pkg/logql/evaluator.go:435-529). VictoriaLogs stats cannot name
  the parsed labels, so the proxy approximates the series by `_stream` (the raw
  `| json` and rate_counter evaluators) or `_stream, _msg` (the stats pipeline of
  an instant logfmt query), and a `sum by (a)` over such a function groups the
  inner stats by `a` alone (unwrapInnerGrouping). Measured on an isolated stack
  (Loki 3.7.7, VictoriaLogs v1.52.0, generator data; every payment-service line
  has its own transaction id, so each line is a series of its own in Loki):
    * `sum by (level) (max_over_time({app="payment-service"} | logfmt | unwrap amount [5m]))`
      instant at t=1791665700: Loki 1.07126e+06, proxy 9965.18 (the maximum per
      level, not the sum of the per-series maxima); tumbling and sliding the
      same factor (and the window gaps of semantics/unwrap-over-time-range-windows);
    * `sum(avg_over_time({app="api-gateway"} | json | unwrap duration_ms [5m]))`
      instant: Loki 1.21215e+06, proxy 388600 (a value per stream);
    * `sum(rate_counter({app="payment-service"} | logfmt | unwrap amount [5m]))`
      instant: Loki 0, proxy 19506.7 (rate_counter of one sample is 0 in Loki).
  stddev and stdvar over time too (Loki engine oracle, VictoriaLogs v1.53.0 and
  v1.49.0, two json streams per app, TestStddevStdvarMatchLoki):
    * `sum by (app) (stddev_over_time({job="json"} | json | unwrap duration_ms [5m]))`
      instant: Loki 2775.98, proxy 1389.15 (the deviation of the app's pooled
      samples), on every request kind;
    * `sum(stddev_over_time({job="json"} | json | unwrap duration_ms [5m]))` and the
      stdvar form: the instant query matches, a range query answers 0 (a deviation
      per line) where Loki sums the streams' deviations.
  The shape is right since semantics/unwrap-rate-ungrouped-sum-per-stream (one
  series; main answered 273-2704): the values are not. Related, open:
  parsed-identity/dynamic-key-parsers (the series identity of a parser).

  Partly fixed (this change): the series identity is a property of the data, not of the query (two
  lines are one series when they agree on the stream, the stored level and every
  parsed label less the unwrapped one, whatever their values; a line with a key
  of its own is a series of its own), so the plan names it in VictoriaLogs. For a
  json or logfmt parser of every key with no keep, drop or format, under sum,
  max, min or avg (by labels or none) over avg, max, min, stddev, stdvar and
  quantile over time, the lowering unpacks the line a second time
  under a prefix of its own, deletes every spelling of the unwrapped label, packs
  the rest with the stored level and detected_level and hashes it
  (lower.DynamicUnwrapIdentity). The stats then take the function per series
  (the stream and the hash) and the aggregation over the series in VictoriaLogs,
  on query and on query_range with the range up to the step. quantile_over_time
  and a range longer than the step need each series' samples: one stats read
  over the fetch span counts the rows and the distinct series hashes first. When they are equal (every line a series of its own) each window holds
  at most one sample of a series and the function has a closed form (the value,
  or 0 for stddev, stdvar and rate_counter), answered as sum by (C) over
  sum_over_time, or max, min or avg over time by (C), from VictoriaLogs' stats.
  Otherwise quantile reads each series' value counts, bounded by the series limit
  (-max-stats-query-series: a query with more series fails with Loki's series
  limit error, where Loki would answer), and a range longer than the step keeps
  the stream's series of the window evaluator (still open). The proxy serves
  these queries from the
  lowering (UnwrapDynamicIdentity, behind -query-plan-lowering); answers cached
  before are fenced.

  Proven against the Loki engine oracle and VictoriaLogs v1.53.0 and v1.49.0,
  through the handlers, on instant, step = range, step < range and step > range:
  TestKeepUnwrapIdentityMatchLoki (every line a series of its own: no keep shape
  of the function list differs any more), TestStddevStdvarMatchLoki (every line of
  a stream one series: the sum, sum by, max by and avg by forms match) and
  TestUnwrapDynamicIdentityMatchLoki (both cases in one stream, lines that are
  the same text, a parsed label more, a nested object, keys in either order, a
  detected_level that differs between lines, lines that do not parse, logfmt and
  json). Still open: a range longer than the step when the series are not all of
  one sample (the window evaluator merges the step buckets of streams);
  rate_counter, which keeps its own one-sample proof for logfmt; a label filter
  between the parser and the unwrap under the
  Loki profile (semantics/unwrap-per-series-identity-label-filter); first and
  last over a range longer than the step (semantics/unwrap-first-last-range-longer-than-step);
  rate_counter's extrapolated value (semantics/unwrap-rate-counter-window-extrapolation).
  Not modelled: structured metadata other than the level fields, a line that
  holds one key twice, and more than -max-stats-query-series series of several
  samples each on the routes that read each series.
corpus:
  size: 4
  dimensions:
    shapes:
      - query: 'sum(avg_over_time({app="api-gateway"} | json | unwrap duration_ms [5m]))'
      - query: 'sum by (level) (max_over_time({app="payment-service"} | logfmt | unwrap amount [5m]))'
      - query: 'sum(stddev_over_time({app="api-gateway"} | json | unwrap duration_ms [5m]))'
      - query: 'sum(rate_counter({app="payment-service"} | logfmt | unwrap amount [5m]))'
request:
  method: GET
  path: /loki/api/v1/query
  params:
    query: 'sum by (level) (max_over_time({app="payment-service"} | logfmt | unwrap amount [5m]))'
    time: 'now'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, values]
  expect: |
    Loki's sum of the per-series maxima per level.
gap:
  status: open
  impact: explore-visible
  effort: L
  area: 'internal/queryplan/lower unwrap_dynamic.go (DynamicUnwrapIdentity, the identity pipes), unwrap.go; internal/proxy query_lowering.go (lowerDynamicIdentity), query_translation.go (dynamicUnwrapIdentity), range_metric_compat.go (the stats, raw-row and native routes), quantile_histogram.go (withQuantileShape), vector_agg_fold.go (the sum fold)'
  loki: 'pkg/logql/evaluator.go:435-529 VectorAggEvaluator.Next; pkg/logql/log/metrics_extraction.go:150-178 labelSampleExtractor (series = stream + parsed labels)'
  proxy: 'the value per stream and hash of the parsed labels, then the aggregation over the series'
  planned_test: 'TestUnwrapDynamicIdentityMatchLoki, TestKeepUnwrapIdentityMatchLoki, TestStddevStdvarMatchLoki (internal/querycorpus, Loki engine and VictoriaLogs oracles); TestDynamicUnwrapIdentity, TestDynamicUnwrapIdentityLowering, FuzzDynamicUnwrapIdentity (internal/queryplan/lower); TestDynamicIdentityServedFromPlan, TestDynamicIdentityHandlersReadThePlan (internal/proxy); e2e: TestCompat_UnwrapPerSeriesIdentity (test/e2e-compat, group core) to add'
  note: 'Found while fixing semantics/unwrap-rate-ungrouped-sum-per-stream, on origin/main e173e40b. VictoriaLogs stats group by named fields only: the lowering names the parsed labels by a hash of the line unpacked under a prefix.'
  clusters:
    - 0e2f0a0c
    - 4bec4ad3
    - c254b66a
    - c733db50
    - db7a21cd
