id: semantics/unwrap-per-series-identity-raw-rows
title: A function taken per series (avg, max, min, stddev, stdvar over time, rate_counter) under sum or sum by uses the stream as the series (open, partly fixed - avg to stdvar on query and on every range and step)
pending: true
proves:
  - metric-series-identity
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  Only sum over rate, sum_over_time, count and the bytes functions is evaluated
  on the folded samples.
  Every other function under a vector aggregation is evaluated per series, the
  stream plus the labels a parser extracts less the unwrapped one, and the aggregation then folds
  those values. VictoriaLogs stats cannot name
  the parsed labels, so the proxy approximates the series by `_stream` (the raw
  `| json` and rate_counter evaluators) or `_stream, _msg` (the stats pipeline of
  an instant logfmt query), and a `sum by (a)` over such a function groups the
  inner stats by `a` alone (unwrapInnerGrouping). Measured on an isolated stack
  (Loki 3.7.7, VictoriaLogs v1.52.0, generator data; every payment-service line
  has its own transaction id, so each line is a series of its own in Loki):
    * `sum by (level) (max_over_time({app="payment-service"} | logfmt | unwrap amount [5m]))`
      instant at t=1791665700: Loki 1.07126e+06, proxy 9965.18 (the maximum per
      level, not the sum of the per-series maxima); tumbling and sliding the
      same factor (and the window gaps of semantics/unwrap-over-time-range-windows);
    * `sum(avg_over_time({app="api-gateway"} | json | unwrap duration_ms [5m]))`
      instant: Loki 1.21215e+06, proxy 388600 (a value per stream);
    * `sum(rate_counter({app="payment-service"} | logfmt | unwrap amount [5m]))`
      instant: Loki 0, proxy 19506.7 (rate_counter of one sample is 0 in Loki).
  stddev and stdvar over time too (Loki engine oracle, VictoriaLogs v1.53.0 and
  v1.49.0, two json streams per app, TestStddevStdvarMatchLoki):
    * `sum by (app) (stddev_over_time({job="json"} | json | unwrap duration_ms [5m]))`
      instant: Loki 2775.98, proxy 1389.15 (the deviation of the app's pooled
      samples), on every request kind;
    * `sum(stddev_over_time({job="json"} | json | unwrap duration_ms [5m]))` and the
      stdvar form: the instant query matches, a range query answers 0 (a deviation
      per line) where Loki sums the streams' deviations.
  The shape is right since semantics/unwrap-rate-ungrouped-sum-per-stream (one
  series; main answered 273-2704): the values are not. Related, open:
  parsed-identity/dynamic-key-parsers (the series identity of a parser).

  Partly fixed: the series identity is a property of the data, not of the
  query (two lines are one series when they agree on the stream, the stored
  level and every parsed label less the unwrapped one, whatever their values; a
  line with a key of its own is a series of its own), so the plan names it in
  VictoriaLogs. For a json or logfmt parser of every key with no keep, drop or
  format, under sum, max, min or avg (by labels or none) over avg, max, min,
  stddev and stdvar over time, the lowering unpacks the line a second time under
  a prefix of its own, deletes every spelling of the unwrapped label, writes the
  rest with the stored level, detected_level and the stream as one value sorted
  by name (set_stream_fields, whatever the key order of the line:
  semantics/unwrap-identity-key-order) and hashes it
  (lower.DynamicUnwrapIdentity). The stats then take the function per series
  (the hash) and the aggregation over the series in VictoriaLogs, in one stats
  query, on query and on query_range with the range up to the step. The proxy
  serves these queries from the lowering (UnwrapDynamicIdentity, behind
  -query-plan-lowering); answers cached before are fenced.

  A binary operation of such operands reads the same series: the binary route
  evaluates each operand as a request of its own (proxyBinaryLogQL), so each
  identity operand groups its stats by the hash exactly as it does alone, on
  both sides, against a number, nested, with on, ignoring and group_left
  matching, with bool, and under an aggregation over the operation; the
  operation then joins Loki's series. Each operand decides its window on its
  own range, so an operand whose range is the step keeps the hash when the
  other operand's range is longer (dynamicIdentityWindows does not mark a
  binary operation as a whole). The response key fence reads the plan at any
  depth (lower.WritesDynamicUnwrapIdentity): a binary operation, a ranking or a
  label_replace over an identity operand is fenced too, since the operand's
  answer changed. Proven by TestUnwrapDynamicIdentityMatchLoki (eleven binary
  rows, Loki engine oracle, VictoriaLogs v1.53.0 and v1.49.0: every row matches
  Loki on instant, step = range and step > range),
  TestDynamicIdentityBinaryOperandsReadTheHash and
  FuzzDynamicIdentityFenceMatchesPlan.

  Proven against the Loki engine oracle and VictoriaLogs v1.53.0 and v1.49.0,
  through the handlers, on instant, step = range, step > range and step < range:
  TestKeepUnwrapIdentityMatchLoki (every line a series of its own),
  TestStddevStdvarMatchLoki (every line of a stream one series: the sum, sum by,
  max by and avg by forms) and TestUnwrapDynamicIdentityMatchLoki (both cases in
  one stream, lines that are the same text, a parsed label more, a nested
  object, keys in either order, a detected_level that differs between lines,
  lines that do not parse, logfmt and json).

  After an extraction list of plain keys (`| logfmt amount, route`) the
  series are fields of the row (the stream, its stored level fields and the
  listed labels), and on a range longer than the step VictoriaLogs groups each
  step bucket by them; the window evaluator merges each series' buckets into
  its window and folds the aggregation after the windows
  (listedIdentityWindows). Recorded with Loki's engine on VictoriaLogs v1.49.0
  and v1.53.0: TestExtractionListIdentityMatchLoki goes from 55 to 82 of 149
  runs matching at step < range (27 queries: sum, sum by, avg and avg by over
  avg, max, min, stddev and stdvar over time, logfmt and json lists), and
  TestUnwrapDynamicValueFormsMatchLoki's 45 extraction-list rows at step <
  range match. `sum(stdvar_over_time({...} | logfmt amount | unwrap amount
  [5m]))` answered 0 at a step of one minute (each line its own series, each
  step bucket read as the window). A clause by level or detected_level keeps
  the stream's series (the level of a line is read from raw rows there).
  A listed label of many values over a long range (`| logfmt amount, user_id`
  over hours) is read in time chunks under -manual-range-metric-row-limit,
  each with the range before it, and folded chunk by chunk (decision
  metric-series-identity/extraction-list-window-chunks):
  TestListedWindowChunksMatchLoki holds six hours at steps of 15 s and 7 s to
  Loki's answers, read whole and in 37-38 chunks.

  A range longer than the step (step < range, sliding windows) reads the same
  series: the request is marked before it is translated (dynamicIdentityWindows,
  identityAheadKey), the lowering writes the series hash before the unwrap gate
  (lower.Profile IdentityAhead), and VictoriaLogs takes the function's partial
  aggregates per series hash and per anchored bucket in one call per time chunk
  (the chunks of the extraction list's windows, listed_window_chunks.go). In
  the same scan it folds the series that lie wholly in one bucket of the read
  (lower.SeriesFold, decision
  metric-series-identity/parser-identity-sliding-windows-bucket-merge), on
  /select/logsql/query with the bounds stats_query_range reads for the read's
  grid (stats_query_range adds the bucket to every stats pipe, so none could
  group a series across buckets): the bucket stats by the bucket, the grouping
  and the hash; a stats pipe by the grouping and the hash counts each series'
  buckets and keeps its bucket rows; a series in one bucket whose value is
  finite (not a NaN line's) is folded, every other series' rows are read back
  (unroll); the last stats pipe passes the kept series' partials through and
  adds up (or takes the extreme of) the folded values and counts them. The line
  is unpacked once (lower.SeriesFoldBase) and the hash computed once. The proxy
  reads the rows back into stats_query_range's answer shape (seriesFoldRead.matrix).
  The window evaluator merges
  each kept series' buckets into Loki's windows (t-range, t] and adds a folded
  row to every window that holds its bucket, weighted by its count, in the outer
  sum, max, min or avg (foldAccumulator.addPartial), which drops the hash. The
  bounds sent are the ones stats_query_range reads, bucket for bucket
  (TestSeriesFoldBoundsMatchStatsQueryRange on v1.49.0 and v1.53.0), and a
  window lies in the read that answers it, so a series spanning two chunks folds
  in each, exactly. The proxy reads the folded rows and the spanning series'
  partials, never raw rows: a key of its own on every line costs about what the
  stream's series did, and the spanning series are bounded by the chunks' read
  budget (-manual-range-metric-row-limit or the tenant's series limit). The
  folded buckets depend on the read's window, so the stats extent cache does not
  keep them; identical reads in flight share one call (seriesFoldPost). max by
  (L) of max_over_time and min by (L) of min_over_time are the extreme of the
  group's samples whatever the series and keep the stream's grouping. An
  unwrapped label named like a reserved VictoriaLogs field in another case
  (`_TIME`), whose gate is written in the outbound guard's form, keeps the
  stream's series on such a window (lower.DynamicIdentityAhead). Answers cached
  before are fenced (@unwrap-dynamic-identity-v2). Proven by
  TestSeriesFoldMatchLoki (Loki engine oracle, VictoriaLogs v1.53.0 and v1.49.0:
  16 queries over a data set of a request id per line, a mixed one with
  repeated series, request ids logged twice, a NaN and a stream without a level,
  and one where every series spans buckets, steps of 60 s, 20 s, 7 s and 120 s
  and bounds off the grid; every run matches Loki in one folded read, and the
  spanning set read in time chunks under a budget of 600 series answers the one
  read's answer byte for byte),
  TestUnwrapDynamicIdentityMatchLoki at step < range,
  TestDynamicIdentityWindowsMatchLokiReference and FuzzSeriesFold (generated rows
  and windows, a range the step does not divide, bounds off the step's grid, json
  and logfmt, by the stream, by a parsed label and none, the fold against the
  series read one by one, v1.49.0 and v1.53.0 emulated, no raw rows read),
  TestSeriesFoldSpanningChunks, TestSeriesFoldMemoryBound,
  TestDynamicIdentityWindowsFoldBeyondSeriesLimit,
  TestDynamicIdentityWindowCacheReuse (repeat = 0 VictoriaLogs calls) and
  TestFirstLastWindowCoalesced (identical cold requests make one call).

  Still open: rate_counter and quantile_over_time
  (semantics/unwrap-quantile-sum-by-group-quantile) keep their previous series;
  an infinite value under avg by: Loki's mean of the group is NaN or the
  infinity by the order it visits the series in, which differed between two
  recordings of the same data and which the series hash does not keep (the
  differential leaves the infinity out of its data); first and last over a
  range longer than the step (semantics/unwrap-first-last-range-longer-than-step);
  rate_counter's extrapolated value (semantics/unwrap-rate-counter-window-extrapolation);
  an identity under a ranking or a label_replace over a range longer than the
  step keeps the stream's series.
  Not modelled: structured metadata other than the level fields and a line that
  holds one key twice.
corpus:
  size: 5
  dimensions:
    shapes:
      - query: 'sum(avg_over_time({app="api-gateway"} | json | unwrap duration_ms [5m]))'
      - query: 'sum by (level) (max_over_time({app="payment-service"} | logfmt | unwrap amount [5m]))'
      - query: 'sum(stddev_over_time({app="api-gateway"} | json | unwrap duration_ms [5m]))'
      - query: 'sum(rate_counter({app="payment-service"} | logfmt | unwrap amount [5m]))'
      - query: 'sum by (app) (max_over_time({app="api-gateway"} | json | unwrap duration_ms [5m])) - sum by (app) (min_over_time({app="api-gateway"} | json | unwrap duration_ms [5m]))'
request:
  method: GET
  path: /loki/api/v1/query
  params:
    query: 'sum by (level) (max_over_time({app="payment-service"} | logfmt | unwrap amount [5m]))'
    time: 'now'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, values]
  expect: |
    Loki's sum of the per-series maxima per level.
gap:
  status: open
  impact: explore-visible
  effort: L
  area: 'internal/queryplan/lower unwrap_dynamic.go (DynamicUnwrapIdentity, the identity pipes, IdentityAhead), unwrap.go; internal/proxy query_lowering.go (lowerDynamicIdentity), query_translation.go, unwrap_dynamic_identity.go (dynamicUnwrapIdentity, dynamicIdentityWindows), range_metric_compat.go (the instant stats route, the window route of the hash); the window evaluator (unwrap_samples.go, listed_window_chunks.go) for a range longer than the step'
  loki: 'the vector aggregation folds per series values, a series being the stream plus the parsed labels (measured on Loki 3.7.7, in this case)'
  proxy: 'the value per stream and hash of the parsed labels, then the aggregation over the series'
  planned_test: 'TestSeriesFoldMatchLoki, TestSeriesFoldBoundsMatchStatsQueryRange, TestUnwrapDynamicIdentityMatchLoki, TestKeepUnwrapIdentityMatchLoki, TestStddevStdvarMatchLoki (internal/querycorpus, Loki engine and VictoriaLogs oracles); TestDynamicUnwrapIdentity, TestDynamicUnwrapIdentityLowering, FuzzDynamicUnwrapIdentity (internal/queryplan/lower); TestDynamicIdentityServedFromPlan, TestDynamicIdentityHandlersReadThePlan, TestDynamicIdentityBinaryOperandsReadTheHash, TestDynamicIdentityBinaryOperandContext, TestDynamicIdentityCacheKeysFenced, FuzzDynamicIdentityFenceMatchesPlan (internal/proxy); e2e: TestCompat_UnwrapPerSeriesIdentity (test/e2e-compat, group core, binary rows and the sliding, longer and non-multiple ranges included; the sliding rows written, not yet run on a stack); TestDynamicIdentityWindowsMatchLokiReference, FuzzSeriesFold, TestSeriesFoldSpanningChunks, TestSeriesFoldMemoryBound, TestDynamicIdentityWindowsKeepExtremes, TestDynamicIdentityWindowsFoldBeyondSeriesLimit, TestDynamicIdentityWindowCacheReuse (internal/proxy), TestDynamicUnwrapIdentityAhead, TestSeriesFoldPipes, TestSeriesFoldBase, TestSeriesFoldKeepsFlag (internal/queryplan/lower), TestSeriesFoldCountingForm, TestSeriesFoldQueryParams, TestSeriesFoldMatrix (internal/proxy), TestEmulatorSeriesFold (internal/testutil/vlemu)'
  note: 'Found while fixing semantics/unwrap-rate-ungrouped-sum-per-stream, on origin/main e173e40b. VictoriaLogs stats group by named fields only: the lowering names the parsed labels by a hash of the line unpacked under a prefix.'
