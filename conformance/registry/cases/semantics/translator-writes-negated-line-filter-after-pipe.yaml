id: semantics/translator-writes-negated-line-filter-after-pipe
title: "The string translator writes a negated line filter after a parser or format pipe as a bare filter, which VictoriaLogs rejects (open)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  A line filter may follow any stage in LogQL. For `{a="b"} | regexp "(?P<a>x)" != "x"` the string translator writes
  `a:="b" | extract_regexp "(?P<a>x)" != "x"`, and VictoriaLogs v1.49.0 and v1.53.0 reject it
  (`unexpected token after [extract_regexp "(?P<a>x)"]: "!="; expecting '|' or ')'`). The same holds for `!~`, `!= ... or ...`, `!= ip(...)` and chains of `!=`, after a regexp or pattern parser (and after a keep with a matcher).
  Loki accepts every one of them (Loki oracle, check command). The positive filters (`|=`, `|~`) after the same stages are not rejected. The query plan writes a pipe filter.

  Found by the grammar sweep (internal/querycorpus TestGrammarSweep, answers recorded with the Loki oracle, Loki 3.7.9, and the VictoriaLogs oracle, v1.49.0 and v1.53.0; conformance/registry/grammar-sweep.json holds the queries of each class). The sweep compares the proxy's validation and plan with Loki's parser and tree, and the texts the plan and the translator write with VictoriaLogs' parser; it sends no HTTP request, so what a client receives is for the e2e proof to confirm when the case is promoted.
request:
  scope: query-grammar
  entry: "TestGrammarSweep (internal/querycorpus): the class of conformance/registry/grammar-sweep.json cased semantics/translator-writes-negated-line-filter-after-pipe"
  setup: "Send as the query of /loki/api/v1/query_range (start now-15m, end now, step 60s): {app=\"x\"} | regexp \"(?P<a>x)\" != \"x\" . The query is kept out of the plan corpus while the difference is open (the plan ratchets count the corpus rows); promote it to an HTTP request with the e2e proof when it is fixed."
compare:
  mode: observed
  fields: [status, error_text]
  expect: "The lines the filter keeps, as Loki's."
gap:
  status: open
  impact: explore-visible
  effort: M
  area: "internal/translator (frozen): closes when the plan serves the construct"
  loki: "a line filter after any stage"
  proxy: "a bare negated filter after a pipe"
  planned_test: 'TestGrammarSweep (internal/querycorpus: the class of conformance/registry/grammar-sweep.json that names this case holds the queries; it shrinks as the proxy follows Loki)'
  visual: none
  visual_reason: 'a grammar corner no Grafana panel sends, found by the grammar sweep'
  clusters: []
