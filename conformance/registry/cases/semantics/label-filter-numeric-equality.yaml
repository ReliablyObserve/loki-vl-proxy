id: semantics/label-filter-numeric-equality
title: Numeric label equality has empty-value, overflow and collision gaps (open)
pending: true
proves:
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  Numeric label comparisons use the literal's kind: Go float parsing for a
  number, duration parsing for a duration and bytes conversion for a size.
  For example, 5, 5.0, 05 and 5e0 compare equal to 5; 5_0 means 50, not 5.
  A value that cannot convert remains visible with __error__=LabelFilterErr.
  Missing labels and present empty parsed values are different cases.

  After a json or logfmt parser, the served query plan uses numeric range
  comparisons guarded by the literal's syntax plus exact unit spellings.
  The spelling patterns share unit aliases and leading zeros. Queries before
  a parser, unsupported literals and other parser kinds remain separate gaps.

  TestNumericEqualityAfterParserMatchesLoki records 81 queries across number,
  duration and bytes values, including parser key normalization and stream
  collisions. On VictoriaLogs v1.49.0 and v1.54.0, its 7,286 line decisions
  contain 126 differences for the plan and 2,244 for the frozen translator.
  Native error classification restores 1,160 decisions from the earlier
  1,286 losses without dropping a previously correct row or adding a wrong
  row. Remaining losses: 66 present-empty, 28 float-overflow and 32
  sanitized/extracted-key decisions. These rows count for every operator.
  The former count of 30 excluded equality error rows and was not parity.
  This storage-level comparison does not measure error labels or metric HTTP
  errors. TestCompat_NumericEqualityLikeLoki compares the actual log API.

  Still open: conversion-error retention outside the supported single-parser,
  plain-key equality pipeline, present empty json
  values, several-unit durations outside VictoriaLogs' supported spellings,
  fractional truncation beyond the exact-spelling domain and signed literals.
  The corresponding error behavior is tracked by
  semantics/label-filter-numeric-error-label. Full API error propagation,
  source error keys, stage order and evaluated-window gaps are checked by
  TestCompat_NumericEqualityLikeLoki; process-oracle details are recorded by
  TestNumericLabelFilterErrorStageOrder.

  Live verification on Loki 3.7.10 and VictoriaLogs 1.54.0 uses the same
  357 rows and 81 queries: VL matches its store oracle on 81/81 query row
  sets, Loki HTTP matches the direct pipeline oracle on 77/81. The four
  differences are 1.5MiB equality/inequality after json/logfmt. Loki's public
  parser prints that literal as 1.6MB; reparsing changes its numeric meaning.
  This upstream round-trip difference is kept separate from proxy row losses;
  the original pipeline answers are not replaced. Raw HTTP and public-API
  evidence: bench/numeric-equality/results/2026-11-20/live-grid.jsonl.gz.

  The numeric-equality log and count pages in bench/visual/spec.json capture
  the scoped change. The dated proof's visual-comparison.json holds three
  matching Grafana query payloads against Loki, and reports ancillary resource
  differences separately. The case remains open on its unproved axes.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{app="x"} | m=5'
    start: 'now-15m'
    end: 'now'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [streams.values]
  expect: |
    Every line whose m is numerically 5 (5, 5.0), as Loki answers.
gap:
  status: open
  impact: explore-visible
  effort: L
  area: 'internal/translator translateSingleLabelFilter (= and != with a number written as an exact text match); the plan (internal/queryplan/lower/label_filter_numeric_eq.go) writes the numeric comparison after a json or logfmt parser'
  loki: 'label filters against a number literal compare numerically'
  proxy: 'single json/logfmt parser and plain-key numeric equality preserve nonempty grammar conversion failures, their labels and metric errors; 126/7286 storage decisions remain different (empty, overflow, sanitized/extracted keys); other parser/stage/literal forms retain their existing paths'
  planned_test: 'TestNumericEqualityAfterParserMatchesLoki (81 recorded queries, exact remaining-loss digest); TestNumericEqualityServedFromPlan; TestNumericLabelFilterErrorStageOrder; TestCompat_NumericEqualityLikeLoki (core CI); matrix json_numeric_equality_range, json_numeric_equality_outer_sum, logfmt_numeric_equality_range'
  clusters: []
