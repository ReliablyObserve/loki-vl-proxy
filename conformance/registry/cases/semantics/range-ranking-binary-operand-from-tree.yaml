id: semantics/range-ranking-binary-operand-from-tree
title: topk, bottomk, sort, stddev and stdvar over a binary operation on query_range answer the operation, as on query (fixed)
pending: true
proves:
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  The post-aggregation route (parseInstantMetricPostAggQuery) evaluates a
  ranking, sort, stddev or stdvar itself over the answer of its operand. On an
  instant query a binary operand is evaluated from its parsed tree, operand by
  operand (the binary route). On query_range the route took the string
  translator's text for the whole operand instead, and that text misreads
  several binary operations:
    - a parenthesis in a quoted value (`!= "("`, `|= ")"`, `pod!="("`): the
      translator counts it in its top-level operator scan and writes the left
      operand alone, so `topk(1, count_over_time({..} != "(" [1m]) * 2)` ranked
      the counts without the `* 2` (on raw rows), `stddev(.. * 2)` answered
      half Loki's deviation and `topk(1, sum by (pod) (..) * 2)` answered 500;
    - a chain (`.. * 2 + 1`): split at its first operator;
    - bool (`> bool 4`) and a vector(n) operand: dropped;
    - a `sum by` operand of a tumbling window under a number: the answer was
      stamped one step early.
  Loki evaluates the binary operation at every step and ranks or folds its
  samples, on query_range as on query.

  On both routes a label_replace inside the binary operand was applied twice:
  once by the operand's own request and again, from the markers of the
  translator's text for the whole operand, over the ranking's answer
  (`topk(1, label_replace(.., "pod", "x-$1", "pod", "(.*)") * 2)` answered
  pod="x-x-p1"). The operands now apply their own calls only.

  The range route now decides from the parsed operand: a binary operation is
  evaluated by the binary route (each operand a query of its own, a chained
  operand its own binary operation), as on query. Found while triaging
  FuzzBinOpLowering (2026-11-17): the bare binary operation and a chain at the
  top of a query were already right, as they take the binary route.

  Recorded with Loki's engine (TestRankingOverBinaryOperandMatchesRecordedLoki,
  internal/proxy, emulated VictoriaLogs v1.49.0 and v1.53.0): 15 shapes over
  five operands (three quoted texts, a matcher, a control), 1m and 5m windows,
  query and query_range at a 15s and a 60s step, 450 requests. Before the change,
  on each version, every range answer at the 15s step differed (the control
  too: the first step was missing), most at the 60s step, and the instant
  answers of the two label_replace shapes.
corpus:
  size: 5
  dimensions:
    shapes:
      - query: 'topk(2, count_over_time({env="production"} != "(" [5m]) * 2)'
      - query: 'stddev(count_over_time({env="production"} != ")" [5m]) * 2)'
      - query: 'topk(2, count_over_time({env="production"}[5m]) * 2 + 1)'
      - query: 'stddev(count_over_time({env="production"}[5m]) > bool 4)'
      - query: 'topk(1, sum by (app) (count_over_time({env="production"}[1m])) * 2)'
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'topk(2, count_over_time({env="production"} != "(" [5m]) * 2)'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [status, series labels, values]
  expect: |
    The two largest series of twice the line count at each step, as Loki answers.
gap:
  status: fixed
  fixed_by: '#1614'
  impact: explore-visible
  effort: S
  area: 'internal/proxy metric_agg.go handleRangeMetricPostAggregation and handleInstantMetricPostAggregation (the binary operand of a ranking, sort, stddev or stdvar)'
  loki: 'the binary operation is evaluated at each step, then ranked or folded'
  proxy: 'the same: a binary operand is evaluated from its parsed tree by the binary route, on query_range as on query, and a label_replace inside it is applied once'
  planned_test: 'TestRankingOverBinaryOperandMatchesRecordedLoki (internal/proxy; recorded Loki engine answers, VictoriaLogs v1.49.0 and v1.53.0); an e2e row against Loki in test/e2e-compat (group semantics) after the stack check'
  visual: none
  visual_reason: 'hand-written queries: Grafana and Drilldown build no ranking over a binary operation; the series and values are compared with recorded Loki answers'
  clusters: []
