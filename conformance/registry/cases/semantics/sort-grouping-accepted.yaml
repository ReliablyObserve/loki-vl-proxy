id: semantics/sort-grouping-accepted
title: "sort and sort_desc with a grouping clause are accepted where Loki rejects them (open)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  Loki's oracle answers "parse error : sort and sort_desc doesn't allow grouping by " for `sort_desc by (a) (rate({a="b"}[5m]))` (and for sort).
  The proxy's validation accepts it and the translator writes the aggregation with the grouping.

  Found by the grammar sweep (internal/querycorpus TestGrammarSweep, answers recorded with the Loki oracle, Loki 3.7.9, and the VictoriaLogs oracle, v1.49.0 and v1.53.0; conformance/registry/grammar-sweep.json holds the queries of each class). The sweep compares the proxy's validation and plan with Loki's parser and tree, and the texts the plan and the translator write with VictoriaLogs' parser; it sends no HTTP request, so what a client receives is for the e2e proof to confirm when the case is promoted.
request:
  scope: query-grammar
  entry: "TestGrammarSweep (internal/querycorpus): the class of conformance/registry/grammar-sweep.json cased semantics/sort-grouping-accepted"
  setup: "Send as the query of /loki/api/v1/query_range (start now-15m, end now, step 60s): sort_desc by (a) (rate({app=\"x\"}[5m])) . The query is kept out of the plan corpus while the difference is open (the plan ratchets count the corpus rows); promote it to an HTTP request with the e2e proof when it is fixed."
compare:
  mode: observed
  fields: [status, error_text]
  expect: "Loki's 400: sort and sort_desc doesn't allow grouping by."
gap:
  status: open
  impact: api-only
  effort: S
  area: "internal/logql validation of sort and sort_desc"
  loki: "400 for a grouping clause on sort and sort_desc"
  proxy: "accepted"
  planned_test: 'TestGrammarSweep (internal/querycorpus: the class of conformance/registry/grammar-sweep.json that names this case holds the queries; it shrinks as the proxy follows Loki)'
  visual: none
  visual_reason: 'a grammar corner no Grafana panel sends, found by the grammar sweep'
  clusters: []
