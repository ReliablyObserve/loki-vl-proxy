id: semantics/vector-call-blank-before-parenthesis-as-query
title: 'A vector(n) operand spelled with blanks around its parenthesis is answered from the constant, as Loki reads it (fixed: the request rewrite writes vector(n) before the binary route reads the operand)'
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  LogQL allows blanks between tokens, so `rate({app="a"}[5m]) + vector (1)` is
  the same binary operation as `rate({app="a"}[5m]) + vector(1)`: Loki's parser
  reads a VectorExpr for both (the Loki oracle `facts`, 2026-11-12, which also
  accepts `vector( 1 )`).

  The proxy's parser reads both as vector(1) too, but the binary route
  recognises the operand by its text: evaluateBinaryLogQLOperand matches
  `vector(` followed by a number (vectorLiteralRE), answers that from the
  constant, and sends any other operand through the query handlers as a query.
  `vector (1)` is the second kind: the handlers translate the text as a phrase
  search, which is not a metric query. With the route-parity harness's stub
  VictoriaLogs (internal/proxy runRoute, 2026-11-12) `rate(..) + vector(1)`
  answers 200 under every request profile and `rate(..) + vector (1)` answers
  400 on an instant request and 500 or 200 (by the stub's data) on a range
  request.

  The query plan reads the call as Loki does, and its lowering of a binary
  operation turns this spelling away (lower.screenVectorOperands, BinOp operand
  spelling) so it never differs from the route; the same blank before a range
  function's parenthesis is semantics/translator-reads-blank-before-range-call-as-text.

  In a chain (an operand that is itself a binary operation) the route evaluates
  each operation on its own and reads each vector(n) from its printed text the
  same way, so `vector (2) > on(x) (rate(..) * 2)` and `(vector (2) + rate(..)) * 2`
  answer 400 on an instant request and 500 on a range request through the
  proxy's binary route (emulated VictoriaLogs, internal/proxy, 2026-11-17). The
  lowering turns the spelling away at any depth of a chain too
  (lower.screenChainVectors; FuzzBinOpLowering found the miss, 2026-11-17).

  Fixed in the proxy (#PRNUM): the request rewrite that writes keywords in
  lower case and drops comments (lowercaseQueryKeywords) also writes the
  metric calls and parentheses of a query Loki accepts in one spelling
  (logql.CanonicalSpelling): no blank between a metric call's name and its
  parenthesis or right inside it, no parentheses around a call or around a
  binary operation no operator reads. Every handler, the translation and the
  response key then read the query Loki reads. Loki's parser reads each
  respelled query as the query (the Loki oracle, TestCanonicalSpellingMatchesLoki:
  the 58 plan-corpus rows the rewrite changes and a grid of 186 spellings), and
  the proxy's answers through the routes are Loki's engine answers for the
  query as sent, with the requests and the cached answer of the spelling
  without the blank (TestCanonicalSpelling_AnswersMatchLokiEngine,
  TestCanonicalSpelling_SameVictoriaLogsRequests). The string translator still
  misreads the spelling; it no longer receives it.
corpus:
  size: 3
  dimensions:
    shapes:
      - query: 'rate({env="production"}[5m]) + vector (1)'
      - query: 'vector ( 2 ) * sum by (app) (rate({env="production"}[5m]))'
      - query: '(vector (2) + sum by (app) (rate({env="production"}[5m]))) * 2'
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'rate({env="production"}[5m]) + vector (1)'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
  verify:
    blocked_by: fixture
    reason: "rate(...) keeps its labels and a label-less vector(1) matches none of its series (no on()), so Loki answers empty here and so does the proxy: the request cannot show the difference on any stack; a left operand without labels (sum(rate(...)) + vector (1)) would, and changing the query is a plan corpus row change left to its own change"
compare:
  mode: observed
  fields: [status, series labels, values]
  expect: |
    The series of rate({env="production"}[5m]) with 1 added, as for vector(1).
gap:
  status: fixed
  fixed_by: "#PRNUM"
  impact: edge
  effort: S
  area: 'internal/logql canonical_spelling.go (CanonicalSpelling), applied by internal/proxy http_utils.go lowercaseQueryKeywords (requestQueryText) before any handler'
  loki: 'blanks between the tokens of a call do not change it'
  proxy: 'the request rewrite writes vector(n) without the blanks before the binary route reads the operand, which it answers from the constant'
  planned_test: 'TestPlanDelegatesVectorLiteralOperands (the screen, chains included) and TestBinaryOperandsPhysicalReadsVectorLiteralLikeTheHandler (the route); TestVectorOperandLoweringMatchesLoki records that Loki accepts the spelling; an e2e row against Loki when the plan serves binary operations; TestCanonicalSpelling and FuzzCanonicalSpelling (internal/logql), TestCanonicalSpellingMatchesLoki (internal/querycorpus, recorded Loki parser answers), TestCanonicalSpelling_AnswersMatchLokiEngine and TestCanonicalSpelling_SameVictoriaLogsRequests (internal/proxy, recorded Loki engine answers)'
  visual: none
  visual_reason: 'Grafana writes no blank before a function parenthesis; hand-written queries can'
  clusters: []
