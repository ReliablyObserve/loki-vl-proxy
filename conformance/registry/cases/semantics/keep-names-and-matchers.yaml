id: semantics/keep-names-and-matchers
title: '`| keep` with matchers, alone or beside bare names, answers other labels, entries and metric series than Loki (fixed)'
pending: true
proves:
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  Loki's keep stage keeps a label when its name is listed bare, or when a
  matcher on that name matches its value, and removes every other label of the
  entry: stream label, structured metadata and parsed label alike. Keep stages
  apply one after the other, a parser after a stage adds labels the stage did
  not see, later stages read only what the stage left, and the series of a metric
  query are the labels the stages leave.

  The proxy applies the stages in order to each entry. VictoriaLogs' fields
  projection keeps a matcher-named field whatever its value, so the plan blanks
  the rejected values behind the projection when a later stage of a log query
  reads the name, and always under a metric query, whose series it then groups
  by the kept names. A selector that already holds the name to an accepted value
  needs no blanking. Behind a parser, a keep and the stages after it read a
  stream label from its stored value, which the plan keeps through the
  projection.
corpus:
  size: 38
  dimensions:
    shapes:
      - query: '{app="x"} | keep app, level="error"'
      - query: '{app="x", level="error"} | keep level="error", app'
      - query: '{app="x", level="info"} | keep app, level="error"'
      - query: '{app="x"} | json | keep status="500", msg, level'
      - query: '{app="x"} | logfmt | keep method="GET", status'
      - query: '{app="x"} | keep trace_id=~"tr-.*", app'
      - query: '{app="x"} | keep app, app="nope"'
      - query: '{app="x"} | keep app, level="a=b"'
      - query: '{app="x"} | keep app, level!~"e|\\d!\"x", level="warn"'
      - query: '{app="x", env="prod"} | keep env!="prod", app'
      - query: '{app="x"} | keep user_id!~"u1", app'
      - query: '{app="x"} | keep level="warn", app | level="warn"'
      - query: '{app="x"} | keep level="error", app | level="warn"'
      - query: '{app="x"} | keep level="error", app | level!="warn"'
      - query: '{app="x"} | keep app | level="warn"'
      - query: '{app="x"} | keep level!="warn", app | level="warn"'
      - query: '{app="x"} | keep trace_id=~"tr-1.*", app | trace_id!=""'
      - query: '{app="x"} | keep level="error", app | drop level="warn"'
      - query: '{app="x"} | keep level="error", app | line_format "{{.level}}"'
      - query: '{app="x"} | logfmt'
      - query: '{app="x"} | logfmt | keep level="info", app | level="info"'
      - query: '{app="x"} | logfmt | keep level, app | level="info"'
      - query: '{app="x"} | json | keep level="warn", app | level="warn"'
      - query: '{app="x"} | json | level="warn"'
      - query: '{app="x"} | logfmt | level="info"'
      - query: '{app="x"} | keep app | json'
      - query: '{app="x"} | json'
      - query: '{app="x"} | keep level="error", app | logfmt'
      - query: '{app="x"} | keep app, level | keep level="error"'
      - query: '{app="x", level="info"} | keep level="info", level="a", app'
      - query: '{app="x"} | logfmt | keep level_extracted="error", app'
      - query: '{app="x"} | keep level="error", app | json'
      - query: '{app="x"} | json | keep level_extracted="error", app'
      - query: '{app="x", level="info"} | keep level="error"'
      - query: '{app="x", level="info"} | keep level="a", level="info", app'
      - query: 'count_over_time({app="x"} | keep app, level="error" [5m])'
      - query: 'sum by (level) (count_over_time({app="x"} | keep app, level="error" [5m]))'
      - query: 'sum by (level) (count_over_time({app="x"} | keep level="error", app | level="warn" [5m]))'
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{app="x", level="info"} | keep app, level="error"'
    start: 'now-1h'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [streams.stream labels]
  expect: |
    Loki's label sets.
