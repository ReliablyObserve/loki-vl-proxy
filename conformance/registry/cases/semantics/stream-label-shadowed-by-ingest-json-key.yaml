id: semantics/stream-label-shadowed-by-ingest-json-key
title: A metric grouped by a stream label that a JSON line's key shadows in VictoriaLogs groups by the stream label, like Loki (fixed)
pending: true
proves:
  - parser-error-and-label-collision
  - loki_api_v1_query_range
consumer: drilldown
why: |
  The Logs Drilldown labels tab with a level pill sends
  `sum(count_over_time({service_name="api-gateway" ,version != ""} | detected_level="error" [$__auto])) by (version)`.
  On the visual stack (1h) Loki answered one series, version="v2"; the proxy
  answered two, version="v1" and version="v2", whose counts add up to Loki's
  per step. The api-gateway streams carry the stream label version="v2" and
  every JSON line a "version" key of v1 or v2.

  VictoriaLogs' Loki push API unpacks a JSON line's keys into fields after the
  stream labels (VictoriaLogs v1.49.0 and v1.53.0 app/vlinsert/loki/
  loki_json.go parseJSONRequest, addMsgField), and a block keeps the last value
  written for a name (lib/logstorage/block.go mustInitFromRows): the stored
  field `version` holds the line's value, while `_stream` keeps the label.
  Loki v3.7.9 groups a metric by the stream label: structured metadata or a
  parsed key named like a stream label is renamed name_extracted
  (pkg/logql/log/labels.go:390-397 Add, parser.go:152-154), so the plain name
  reads the stream label (labels.go:293-314 getWithCategory). The proxy
  grouped by the stored field, so every line whose key differs from its
  stream label was counted under the line's value. The same holds without the
  pill and for any grouping by such a label.

  Fixed: for a metric query without a parser stage, every label it groups by
  (by (...), in a vector or range aggregation) is restored: the translation
  writes the label's value from `_stream` back into the field before the
  query's first pipe: an anchored extract_regexp over the whole tags of
  `_stream` (a name inside another tag's value or a longer name ending in it
  never matches) and an extract that unquotes the value, keeping the stored
  field when the stream has no such label (structured metadata, a field
  VictoriaLogs did not take into the stream). VictoriaLogs runs both once per
  run of equal `_stream` values, that is once per block; no VictoriaLogs call
  is added, no stream label listing is needed (the names come from the query
  text, so the translation and every cache key are the same on every replica
  from the first request on), and no measured shape changes route. A label
  the stream lacks costs one regexp per block and keeps its value. The pipes
  were run on VictoriaLogs
  v1.49.0 and v1.53.0's own pipe code (shadowed, missing, first and last tag,
  names inside values, quotes, backslashes, commas).

  Not covered, each open: selector matchers on such a label
  (semantics/stream-label-selector-shadowed-by-ingest-json-key); the level
  names the detected_level derivation reads
  (semantics/stream-level-shadowed-by-ingest-json-key); `| json` metric plans
  and log-query filters after a parser
  (semantics/stream-label-shadowed-after-json-parser); a query with a parser
  keeps the listing-gated restore of
  semantics/plain-name-after-parser-reads-stream-label.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum(count_over_time({service_name="api-gateway" ,version != ""} | detected_level="error" [5s])) by (version)'
    start: 'now-1h'
    end: 'now'
    step: '5'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, values]
  expect: |
    One series per stream label value (version="v2" on the stack) with Loki's counts.
gap:
  status: fixed
  fixed_by: '#1065'
  impact: drilldown-visible
  effort: M
  area: 'internal/translator/plain_stream_labels.go streamTagRestorePipes, withStreamTagRestore; internal/translator/translator.go metric pipeline; internal/proxy/plain_stream_labels.go plainStreamLabelNames, groupingNames; internal/proxy/range_metric_compat.go queryUsesParserStages'
  loki: 'pkg/logql/log/labels.go:293-314 getWithCategory, 390-397 Add (a colliding name becomes name_extracted); pkg/logql/log/parser.go:152-154'
  proxy: 'the stream label value restored from _stream before the first pipe of a metric query'
  planned_test: 'TestCompat_StreamLabelShadowedByIngestJSONKey (test/e2e-compat, group core; written, not yet run); TestStreamLabelShadowedByIngestJSONKeyLikeLoki, TestStreamLabelShadowedByIngestJSONKeyDifferential, TestStreamTagRestoreFirstRequestWithoutListing, TestStreamTagRestoreSameOnEveryReplica, TestStreamTagRestoreNames (internal/proxy); TestStreamTagRestoreEdgeCases, TestStreamTagRestorePlacementAndStrip, FuzzStreamTagRestoreLikeLoki (internal/translator)'
  clusters: []
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null
