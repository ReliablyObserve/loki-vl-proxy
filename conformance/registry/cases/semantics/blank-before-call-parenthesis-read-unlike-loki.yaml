id: semantics/blank-before-call-parenthesis-read-unlike-loki
title: A tab, a line feed or a carriage return between an unwrap conversion, approx_topk or an ip() label filter and its parenthesis is answered unlike the spelling without it (open; label_replace and sort_desc spelled so are fixed)
pending: true
proves:
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: api
why: |
  Loki's lexer looks ahead over the blanks it skips for a call's parenthesis:
  `label_replace<TAB>(rate({app="a"}[1m]), "a", "b", "c", "d")`,
  `sum_over_time({app="a"} | unwrap bytes<TAB>(a) [1m])`, `sort_desc<TAB>(...)`,
  `approx_topk<TAB>(...)` and `{app="a"} | x = ip<TAB>("1.2.3.4")` are the query
  without the blank (Loki oracle, check command: the same expression;
  internal/logql testdata/keyword-blank-loki.jsonl.gz). The proxy's parser
  reads them as Loki does (TestKeywordBlankMatchesLoki), but the requests and
  answers differ from the spelling without the blank: the handlers and the
  string translator match the name and the parenthesis together.

  An ip() line filter spelled so (`{app="a"} |= ip<TAB>("1.2.3.4")`, `|= ip  (…)`) is
  served from the plan (the default) with the requests and the answer of
  `|= ip("1.2.3.4")`; the string translator, which serves it with
  `-query-plan-lowering=false`, reads `ip (` as the word filter "ip" and a phrase
  VictoriaLogs rejects. The VictoriaLogs oracle's typed-selector
  pair holds the translator to the spelling without the blank
  (internal/querycorpus TestTypedPairOfIPCallBlankIsTheUnspacedOnes).

  Found by the keyword blank sweep (internal/proxy
  TestKeywordBlankRequestsEqualSpaced pins these rows; a range function and
  vector() spelled so are semantics/translator-reads-blank-before-range-call-as-text
  and semantics/vector-call-blank-before-parenthesis-as-query).

  label_replace, sort_desc and the other metric calls spelled so are fixed
  (#PRNUM): the request rewrite writes a metric call without the blanks before
  its parenthesis before any handler reads the query (logql.CanonicalSpelling),
  so they get the requests and the answer of the spelling without them (the
  keyword blank sweep's known rows fell from 343 to 56). What is left:
  approx_topk, whose arguments the proxy's parser keeps as text (the rewrite
  leaves a call it does not read alone), and two spellings inside a pipeline,
  which the rewrite does not respell: an unwrap conversion
  (`| unwrap bytes<TAB>(a)`, 42 rows) and an ip() label filter
  (`| x = ip<TAB>("1.2.3.4")`, 7 rows); approx_topk is the other 7.
request:
  scope: query-grammar
  entry: "TestKeywordBlankRequestsEqualSpaced (internal/proxy): the rows pinned to this case"
  setup: "Send as the query of /loki/api/v1/query_range (start now-1h, end now, step 60s): sum_over_time({app=\"api-gateway\"} | unwrap bytes<TAB>(size) [5m]), with a tab before the parenthesis. The query is kept out of the plan corpus while the difference is open (the plan ratchets count the corpus rows); promote it to an HTTP request with the e2e proof when it is fixed."
compare:
  mode: observed
  fields: [status, data]
  expect: |
    The answer of the same query without the tab.
gap:
  status: open
  impact: edge
  effort: S
  area: 'internal/proxy handlers and the string translator (an unwrap conversion''s, approx_topk''s or an ip() label filter''s name and its parenthesis are matched as one text)'
  loki: 'the lexer reads a call name followed by any blank it skips and a parenthesis as the call'
  proxy: 'the requests and the answer differ from the spelling without the blank'
  planned_test: 'TestKeywordBlankRequestsEqualSpaced (internal/proxy, pinned rows); TestKeywordBlankMatchesLoki (internal/logql, recorded Loki answers); TestTypedPairOfIPCallBlankIsTheUnspacedOnes (internal/querycorpus, the ip() line filter typed-selector pair)'
  visual: none
  visual_reason: 'a spelling no Grafana panel writes'
  clusters: []
