id: semantics/error-layer-backend-text
title: VictoriaLogs error messages reach the client on the ruler passthrough (open)
proves:
  - status-400
  - status-500
  - status-502
  - status-503
consumer: any
why: |
  Loki never answers with storage or backend text: its querier failure is
  500 with Loki's text, a bad query 400 with its parse error. The error layer
  now answers every VictoriaLogs error body with Loki's text: 500 `Internal
  Server Error`, 400 `failed to parse the log query` (logqlmodel.ErrParse,
  pkg/logqlmodel/error.go:13) for a query VictoriaLogs rejects as unparsable,
  429 `too many outstanding requests`; VictoriaLogs' message stays in the log
  line. 15 cells remain on the rules and alerts routes, which copy the
  ruler's non-2xx body verbatim. Drilldown stats failures use the same
  sanitized error path as direct clients.
request:
  scope: internal
  entry: lokiClientError, (*Proxy).writeErr, writeBackendError, writeGrafanaStatsFailure
  setup: |
    TestErrorLayer_NoVictoriaLogsLeak: a fake VictoriaLogs (and ruler) that fails
    every call in one of 14 modes (VictoriaLogs 400 parse and memory-limit
    errors, 422, 500, a 502/503 from a proxy in front, 429 queue full,
    connection refused and reset, a reply after -backend-timeout, a client
    cancellation, a 200 body cut off mid-stream, a malformed 200 body, a valid
    body above -backend-max-buffered-response-bytes), driven through 21 client
    routes (query_range log, sliding rate, stats, Drilldown stats, unwrap
    rate_counter, json; query; series; labels; label values; detected_fields,
    detected_field values, detected_labels; index stats, volume, volume_range,
    Drilldown volume_range; patterns; tail; rules; alerts). The cells that
    fail this class are listed in conformance/registry/error-layer-known-leaks.json.
    TestCompat_ErrorLayerLikeLoki repeats the main modes against the stack's
    VictoriaLogs through a fault-injecting forwarder and compares with Loki.
compare:
  mode: exact
  fields: [status, errorType, body, headers]
  expect: |
    No VictoriaLogs text (messages, flags, LogsQL, `_stream`, `_msg`, `VL`,
    `VictoriaLogs`, `backend returned`) or front-proxy page in the body or the
    headers; Loki's status and wording for the failure mode.
gap:
  status: open
  impact: explore-visible
  effort: M
  area: 'internal/proxy/http_utils.go writeError/writeBackendError/writeGrafanaStatsFailure; alerting.go passthrough'
  loki: 'pkg/util/server/error.go:56-130; pkg/logql/syntax parse errors for 400'
  proxy: 'ruler non-2xx body copied (alerting.go)'
  planned_test: 'TestErrorLayer_NoVictoriaLogsLeak (internal/proxy) and TestCompat_ErrorLayerLikeLoki (test/e2e-compat, group core)'
