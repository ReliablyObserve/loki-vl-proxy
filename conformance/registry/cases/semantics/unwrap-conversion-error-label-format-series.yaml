id: semantics/unwrap-conversion-error-label-format-series
title: 'The SampleExtractionErr answer names the series with the labels a label_format before the unwrap writes'
pending: true
proves:
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  A metric over `| logfmt | label_format w="{{.n}}" | unwrap v` meets a value of v
  the conversion rejects: Loki answers 400 with its pipeline error, and the series
  the error names holds w as the stage writes it (the value of n), recorded with
  Loki's engine (TestUnwrapConversionErrorMatchesRecordedLoki, the label_format
  shape). The conversion-error check re-derives the line's labels as Loki does: a
  rename and a copy of one label ({{.name}}) are applied; any other template leaves
  that label out of the series, since the check does not evaluate templates; a
  stage that writes the unwrapped label itself is not reproduced (the metric's
  own answer stands). Before, the check kept the line's own value of the label.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum_over_time({service_name="api-gateway"} | logfmt | label_format route_copy="{{.route}}" | unwrap duration(status) [5m])'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [status, body]
  expect: |
    400 text/plain with Loki's pipeline error; the series names route_copy with the value of route.
