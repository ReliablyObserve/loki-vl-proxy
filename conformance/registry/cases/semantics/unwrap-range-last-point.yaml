id: semantics/unwrap-range-last-point
title: A grouped unwrap range metric has the sample at `end`, like Loki (fixed)
proves:
  - window-bounds-and-step-alignment
  - loki_api_v1_query_range
consumer: explore
why: |
  `sum by (level) (max_over_time({service_name="api-gateway"} | json | unwrap
  status | __error__="" [5m]))` over an hour at 60s has 61 samples on Loki
  (start..end inclusive, pkg/logql/range_vector.go step iteration) and had 60 on
  the proxy, which dropped the sample at end; the same for sum_over_time and
  avg_over_time by app over `| json | unwrap duration_ms`, and for min_over_time.

  Root cause: sum, avg, max and min over time with unwrap are answered by
  VictoriaLogs' native stats_query_range, whose bucket labelled T holds the lines
  of [T, T+step). Loki's sample at T is the window (T-range, T]. The proxy sent
  the request's start and end through unchanged (buildStatsQueryRangeParams
  extends the end by one step), so the point labelled `end` was the bucket after
  `end`: a log source that stops at `end` (live data, queried at now) has no line
  there and the sample was missing. Log range functions (rate, count_over_time,
  bytes functions) with range == step already fetch from start-step, relabel every
  bucket onto the evaluation time it closes and keep [start, end]
  (statsRateRangeEqualsStepShift, relabelSnappedTumblingStatsQueryRange); their
  sliding windows are evaluated from anchored buckets by the window evaluator,
  which reads (t-range, t].

  Fixed: statsRateRangeEqualsStepShift also covers sum, avg, min and max over time
  with unwrap, for any range (logRangeFunctions classifies them): the request is
  fetched on anchored step buckets (edge, edge+step] from start-step and relabelled
  to the evaluation time each closes. A source with a line in every step has a
  sample at start, start+step, ... end. For a range equal to the step that bucket
  is exactly Loki's window, so the samples and the values are Loki's (the
  tumbling half of semantics/unwrap-over-time-range-windows is thereby fixed too,
  pinned by TestUnwrapOverTimeTumblingMatchesLoki). For a range longer or shorter
  than the step the point is the step-sized bucket and not the window (now the
  last step of it, (t-step, t], instead of the step after t), so its value
  differs and whether a step has a sample follows the step bucket and not (t-range,
  t]: a source with a line every few minutes under [5m] at step 60 misses the steps
  whose last minute is empty, and a [30s] range at step 60 has samples Loki does
  not. The window merge of semantics/unwrap-over-time-range-windows answers a
  range other than the step now, so this shift serves those only in the forms
  that row lists as residuals.

  Not covered, same defect: stddev_over_time and stdvar_over_time with unwrap take
  the same native bucket path and still drop the sample at end
  (semantics/unwrap-stddev-stdvar-range-last-point).

  VictoriaLogs before v1.45 (no stats_query_range offset) with a start that is
  not a multiple of the step cannot place these buckets (tumblingBucketsAligned):
  sum, avg, max and min over time then take the window evaluator's raw-row
  fallback, which reads (t-range, t] (semantics/unwrap-over-time-range-windows);
  stddev and stdvar are still labelled on the epoch grid
  (semantics/native-buckets-epoch-grid-unaligned-start-v140).

  In the differential run this shows only as a secondary difference of
  requests whose primary difference is the parser series identity, so those
  clusters are owned by parsed-identity/dynamic-key-parsers; this case claims
  none and was measured by hand.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum by (level) (max_over_time({service_name="api-gateway"} | json | unwrap status | __error__="" [5m]))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [timestamps]
  expect: |
    61 samples including end.
gap:
  status: fixed
  fixed_by: "#727"
  impact: explore-visible
  effort: S
  area: 'internal/proxy metric_binary.go (statsRateRangeEqualsStepShift, logRangeFunctions: unwrap sum/avg/min/max over time)'
  loki: 'pkg/logql/range_vector.go step iteration start..end inclusive; range_vector.go:102-189 batchRangeVectorIterator window (t-range, t]'
  proxy: 'native step buckets fetched from start-step and relabelled onto the evaluation times, start..end inclusive'
  planned_test: 'TestUnwrapOverTimeRangeEmitsEndSample and TestUnwrapOverTimeTumblingMatchesLoki (internal/proxy); TestCompat_UnwrapRangeEndSample (test/e2e-compat, group semantics)'
  clusters: []
