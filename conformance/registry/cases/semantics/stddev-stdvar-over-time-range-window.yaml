id: semantics/stddev-stdvar-over-time-range-window
title: stddev and stdvar over time with unwrap and a range that is not the step answer Loki's window (fixed)
pending: true
proves:
  - window-bounds-and-step-alignment
  - loki_api_v1_query_range
consumer: explore
why: |
  Residual of semantics/stddev-stdvar-over-time-step-bucket. With a range longer or
  shorter than the step, `stddev_over_time(... | unwrap duration_ms [5m]) by (app)`
  at step 60 answered the step-sized bucket that VictoriaLogs labels T, so the [5m]
  window was ignored: the answer equalled the [1m] one (measured: the proxy's [5m] and
  [1m] answers were the same series; Loki's differ), one step late. With a range
  shorter than the step the bucket was the whole step, not the range ending at T.

  Fixed, a range longer than the step: the window evaluator reads, per bucket of
  gcd(step, range) from one range before the start, the mean, the sample count and
  the population standard deviation of the bucket's samples (VictoriaLogs' avg, count
  and stddev, all three in v1.49 and v1.53), and merges the buckets of each window
  (T-range, T]: each bucket holds n*d^2 about its own mean and n*(m-M)^2 more about
  the window's mean M, so the window's variance is exact where the sum of squares less
  the squared sum would cancel. The three results of a bucket are paired by their
  VictoriaLogs group and time, and the groups of one series (the unwrap gate's value
  kinds) combine per bucket. stdvar_over_time, which the translator writes as the
  deviation squared, takes the same windows and is squared after them.

  Fixed, a range shorter than the step: stddev and stdvar over time are read like
  sum, avg, min and max over time, from the step buckets fetched from start-step with
  the window phase filter, so a bucket (T-step, T] keeps only the lines of (T-range, T]
  and is relabelled to T.

  The query plan's route rule routes stddev over time the same way (the window, the
  bucket, the counted conversion flag), held to the handlers by the route parity test.

  Proven against the Loki engine oracle and VictoriaLogs v1.53.0 and v1.49.0
  (TestStddevStdvarMatchLoki, 39 shapes x instant, step = range, step < range and
  step > range): step < range went from 6 of 39 runs matching Loki to 29, step > range
  from 6 to 31, step = range from 29 to 31 and instant from 29 to 31, with the rest held
  by semantics/stdvar-grouped-pooled-variance, semantics/unwrap-per-series-identity-raw-rows
  and semantics/aggregation-over-range-by-not-applied. An aggregation over a range
  aggregation with its own by keeps the step buckets on a sliding window, as before.
corpus:
  size: 4
  dimensions:
    shapes:
      - query: 'stddev_over_time({app="api-gateway"} | json | unwrap duration_ms [5m]) by (app)'
      - query: 'stdvar_over_time({app="api-gateway"} | logfmt | unwrap duration_ms [5m]) by (app)'
      - query: 'stddev_over_time({app="api-gateway"} | unwrap duration_ms [7m]) by (pod)'
      - query: 'max by (pod) (stddev_over_time({app="api-gateway"} | unwrap duration_ms [1m]))'
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'stddev_over_time({app="api-gateway"} | json | unwrap duration_ms [5m]) by (app)'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [timestamps, values]
  expect: |
    Loki's samples at every step, the values equal to 1e-9 relative.
gap:
  status: fixed
  fixed_by: "this change"
  impact: explore-visible
  effort: M
  area: 'internal/proxy unwrap_samples.go (deviationBucketStats, deviationPartials, mergeDeviationBuckets, unwrapWindowBuckets), range_metric_compat.go (handleStatsCompatRange for a stats query answered as translated), metric_binary.go (logRangeFunctions); internal/queryplan/lower route.go (routeUnwrapOps)'
  loki: 'the window (t-range, t] of every evaluation time'
  proxy: 'the window merged from per-bucket mean, count and deviation for a longer range; the phase-filtered step bucket for a shorter one'
  planned_test: 'TestStddevStdvarMatchLoki (internal/querycorpus, Loki engine and VictoriaLogs oracles); TestMergeDeviationBucketsIsTheWindowsVariance, TestDeviationPartialsPairByGroupAndBucket, FuzzMergeDeviationBuckets, TestMetricRouteRangeFunctionEdges and TestMetricRouteVectorUnwrapEdges (internal/proxy); TestRouteDecidesTheWindows (internal/queryplan/lower)'
  clusters: []
