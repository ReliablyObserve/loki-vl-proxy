id: semantics/metric-unread-line-format-template-error
title: "A line_format with an invalid template in a metric query that no later stage reads is rejected; Loki leaves it out and answers (open)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  Loki drops a line_format from a metric query's pipeline when no later stage reads the line (the Loki oracle builds metric pipelines that way, observed on the stack: `count_over_time({...} | line_format "{{.a" [5m])` answers 200). The oracle's check answers accept for
  `rate({a="b"} | line_format "{{.x"[5m])`. The proxy answers its template error ("stage ... invalid line template: template: line:1: unclosed action"). The proxy validates eagerly by design for log queries (semantics/eager-pipeline-validation); this is the metric case.

  Found by the grammar sweep (internal/querycorpus TestGrammarSweep, answers recorded with the Loki oracle, Loki 3.7.9, and the VictoriaLogs oracle, v1.49.0 and v1.53.0; conformance/registry/grammar-sweep.json holds the queries of each class). The sweep compares the proxy's validation and plan with Loki's parser and tree, and the texts the plan and the translator write with VictoriaLogs' parser; it sends no HTTP request, so what a client receives is for the e2e proof to confirm when the case is promoted.
request:
  scope: query-grammar
  entry: "TestGrammarSweep (internal/querycorpus): the class of conformance/registry/grammar-sweep.json cased semantics/metric-unread-line-format-template-error"
  setup: "Send as the query of /loki/api/v1/query_range (start now-15m, end now, step 60s): rate({app=\"x\"} | line_format \"{{.x\" [5m]) . The query is kept out of the plan corpus while the difference is open (the plan ratchets count the corpus rows); promote it to an HTTP request with the e2e proof when it is fixed."
compare:
  mode: observed
  fields: [status, error_text]
  expect: "Loki's 200 for a metric query whose line_format no later stage reads."
gap:
  status: open
  impact: edge
  effort: S
  area: "internal/logql pipeline validation (metric queries)"
  loki: "an unread line_format is not built"
  proxy: "the template is parsed and its error returned"
  planned_test: 'TestGrammarSweep (internal/querycorpus: the class of conformance/registry/grammar-sweep.json that names this case holds the queries; it shrinks as the proxy follows Loki)'
  visual: none
  visual_reason: 'a grammar corner no Grafana panel sends, found by the grammar sweep'
  clusters: []
