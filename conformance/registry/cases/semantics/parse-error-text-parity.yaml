id: semantics/parse-error-text-parity
title: Invalid queries fail on both sides, with different error text or status (open)
proves:
  - loki_api_v1_query_range
  - loki-compatible-profile
consumer: explore
why: |
  Both sides reject the query, but the proxy's message is its own parser's
  (`parse error : logql: expected duration ...`, `unexpected token ...`), a
  VictoriaLogs message (`cannot parse query arg ...`, `missing | stats pipe`,
  422) or a proxy-specific one (`unsupported instant aggregation target`,
  `sum() requires a range metric inside`) where Loki writes `parse error at
  line N, col M: syntax error: unexpected ...`. Grafana shows the error text
  to the user (cases profiles/grafana-shows-loki-error-text).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sort({app="api-gateway"})'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [status, error_text]
  expect: |
    Loki's status and text.
gap:
  status: open
  impact: grafana-datasource
  effort: L
  area: 'internal/logql parser error messages (Loki''s goyacc messages and positions) + VictoriaLogs error mapping'
  loki: 'pkg/logql/syntax/parser.go ParseError (line, col) and syntax.y'
  proxy: 'own / VictoriaLogs text, 422 for some'
  planned_test: 'TestCompat_ParseErrorText corpus (test/e2e-compat, bad_request_status_parity_test.go)'
