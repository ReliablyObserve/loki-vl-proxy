id: semantics/vector-aggregation-over-log-selector-status
title: topk, bottomk, sort, sort_desc and stddev over a bare log selector answer 500 where Loki answers a 400 parse error (fixed)
pending: true
proves:
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki's grammar only allows a metric expression inside a vector aggregation
  (pkg/logql/syntax/syntax.y:176-185 vectorAggregationExpr: `vectorOp (
  metricExpr )`), so `topk(5, {app="api-gateway"})` fails to parse with
  `parse error at line 1, col 28: syntax error: unexpected )` and a 400.

  The differential run of 2026-11-04 (proxy 69d07019, Loki v3.7.9,
  VictoriaLogs v1.53.0) shows the proxy answering query_range with a 500
  `Internal Server Error`:
    * `sort({app="api-gateway",env="production"})`: Loki 400, proxy 500;
    * `topk(2, {app="api-gateway",env="production"})`: Loki 400, proxy 500;
    * `stddev({namespace="prod"})` and `bottomk(1, {...})`: the same.
  The proxy sends the selector to VictoriaLogs, which rejects a query with no
  `| stats` pipe (422); the run of 2026-10-05 showed that 422 to the client,
  and since the error layer (#913, #999) the proxy answers a failed backend
  call as 500. The instant route answers 400 with other text
  (semantics/parse-error-text-parity). The fix is to reject the shape in the
  proxy's parser with Loki's parse error, before any VictoriaLogs call.

  Fixed (internal/logql/parser.go parseVectorAggregation): a log expression
  (a selector, with or without a pipeline or parentheses) inside any vector
  aggregation followed by its closing parenthesis fails with Loki's
  `syntax error: unexpected )` at that parenthesis (line and column counted
  in characters, as Loki's lexer counts them; Loki's own test:
  pkg/logql/syntax/parser_test.go:689-690). query and query_range answer it
  as 400 text/plain before any VictoriaLogs call. A log range inside a
  vector aggregation (`sum({app="x"}[5m])`) keeps its previous text.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'topk(2, {app="api-gateway",env="production"})'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [status, error_text]
  expect: |
    Loki's 400 `parse error at line 1, col N: syntax error: unexpected )`.
gap:
  status: fixed
  fixed_by: '#1106'
  impact: explore-visible
  effort: S
  area: 'internal/logql/parser.go parseVectorAggregation (vector aggregation operand must be a metric expression)'
  loki: 'pkg/logql/syntax/syntax.y:176-185 (vectorAggregationExpr takes a metricExpr); pkg/logql/syntax/parser_test.go:689-690'
  proxy: 'Loki''s 400 and text on query and query_range'
  planned_test: 'TestCompat_VectorAggregationOverLogSelector (test/e2e-compat, group core), query and query_range'
  clusters:
    - 0d1dce34
    - 1b5c3c20
    - 2ae8dfb7
