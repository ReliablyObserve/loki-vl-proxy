id: semantics/error-coalescing-no-inherited-cancel
title: A follower whose request is alive never answers with the leader's cancellation or deadline
proves:
  - error-coalescing-and-error-cache
  - backend-deadlines-and-cancellation
consumer: any
pending: true
why: |
  Loki answers 499 or 504 only for a query whose own context was cancelled or
  ran out of time. A shared run is the flight's (leadFlight, #1821): the leader's
  client going away leaves it, and it is cancelled only when the last request
  waiting on it went away, so followers get its answer from the one
  VictoriaLogs call. It keeps the leader's deadline: when that ends the run,
  the followers that still wait start again.
request:
  scope: internal
  entry: serveFlight, Coalescer.do
  setup: |
    A leader whose client cancels while VictoriaLogs holds its call and eight
    followers wait; a coalesced VictoriaLogs call whose first caller's deadline
    ends it while a follower without a deadline waits.
compare:
  mode: exact
  expect: |
    The run goes on after the leader's client left: every follower gets its
    answer from one VictoriaLogs call; the coalescer's follower whose leader's
    deadline ended the call gets a new call's answer, not context deadline
    exceeded.
