id: semantics/error-layer-cancel-deadline
title: A tail whose VictoriaLogs call times out or is cancelled ends the way Loki's does, with Loki's texts (fixed)
pending: true
proves:
  - backend-deadlines-and-cancellation
  - status-502
consumer: any
why: |
  Loki answers a cancelled request with 499 "the request was cancelled by
  the client" and a deadline with 504 "request timed out, decrease the
  duration of the request or add more label matchers (prefer exact match
  over regex match) to reduce the amount of data processed"
  (pkg/util/server/error.go:26-27, :103-107). The error layer now answers
  both with Loki's status and text on every HTTP route, the raw-row metric
  paths and rules/alerts included (they answered 502 before). The windowed
  log query_range path (-query-range-windowing) answered a request that ended
  while it waited to retry a failed window batch with 408 and Go's text
  ("context canceled", "context deadline exceeded"); it now answers 499 and
  504 with Loki's texts through the error layer, in both waits (the batch
  backoff and the single-window retry). No cell remains (2 before). A tail
  whose first VictoriaLogs probe exceeds -backend-timeout is answered before
  the upgrade with 504 and the full deadline text (a close frame holds 123
  bytes, so the full text only fits an HTTP body). A tail whose VictoriaLogs
  stream call is still waiting for headers after the upgrade closes with 1011
  and Loki's text cut to the 123 bytes a close frame holds. A client that goes
  away while the tail's VictoriaLogs call runs gets nothing, because it is
  gone; the proxy drops the VictoriaLogs stream, which the gate checks, and
  the same when it leaves while the tail waits to retry a failed call
  (semantics/tail-survives-backend-outage). A timed-out stream or poll is a
  failure a retry can fix: the close comes when -tail.backend-retry-window
  (30s) is spent.
request:
  scope: internal
  entry: (*Proxy).fail and writeFailure (internal/proxy/http_utils.go, the error layer's one writer; internal/lokierr typed errors), lokiClientError, (*Proxy).writeErr, writeBackendError, writeGrafanaStatsFailure
  setup: |
    TestErrorLayer_NoVictoriaLogsLeak: a fake VictoriaLogs (and ruler) that fails
    every call in one of 14 modes (VictoriaLogs 400 parse and memory-limit
    errors, 422, 500, a 502/503 from a proxy in front, 429 queue full,
    connection refused and reset, a reply after -backend-timeout, a client
    cancellation, a 200 body cut off mid-stream, a malformed 200 body, a valid
    body above -backend-max-buffered-response-bytes), driven through 21 client
    routes (query_range log, sliding rate, stats, Drilldown stats, unwrap
    rate_counter, json; query; series; labels; label values; detected_fields,
    detected_field values, detected_labels; index stats, volume, volume_range,
    Drilldown volume_range; patterns; tail; rules; alerts). The cells that
    fail this class are listed in conformance/registry/error-layer-known-leaks.json.
    On the tail route client_cancel closes the websocket once VictoriaLogs'
    tail is called and waits for the proxy to drop that call.
    TestErrorLayer_WindowRetryCancelDeadline drives the windowed log
    query_range into both retry waits (VictoriaLogs answers every window with
    a retryable 502) and ends the request there, by a client cancel and by the
    tenant's query_timeout, with the gate's own classes.
    TestCompat_ErrorLayerLikeLoki repeats the main modes against the stack's
    VictoriaLogs through a fault-injecting forwarder and compares with Loki.
compare:
  mode: exact
  fields: [status, errorType, body, headers]
  expect: |
    499 with Loki's cancel text and 504 with Loki's deadline text on every route.
gap:
  status: fixed
  fixed_by: TBD-PR
  impact: explore-visible
  visual: none
  visual_reason: 'A tail whose VictoriaLogs call fails ends in a websocket close frame, which needs a failing backend and no Grafana panel renders; the gate and the tail failure-mode test assert the close frame.'
  effort: S
  area: 'internal/proxy/http_utils.go badRequestStatusOr (route ctx errors through statusFromUpstreamErr) and writeError; internal/proxy/tail.go preflightTailAccess, closeTailWithError'
  loki: 'pkg/util/server/error.go:26-27, :103-107'
  proxy: 'tail: 504 before the upgrade when the probe exceeds -backend-timeout, 1011 with Loki text after it; a cancelled client releases the VictoriaLogs stream'
  planned_test: 'TestErrorLayer_NoVictoriaLogsLeak (internal/proxy) and TestCompat_ErrorLayerLikeLoki (test/e2e-compat, group core)'
