id: semantics/detected-level-pipes-known-differences
title: The detected_level pipes read level keys in a fixed order, do not decode logfmt like Loki and overwrite a detected_level stream label (open)
proves:
  - loki_api_v1_query_range
consumer: explore
why: |
  The native metric route (`sum by (detected_level) (count_over_time({...}
  [1m]))` over a plain selector, which Logs Drilldown sends, and Explore's
  plain-selector volume shape) computes detected_level in VictoriaLogs with
  translator.BuildDetectedLevelChain. Those pipes read the level keys of a body
  in a fixed order, do not search nested objects other than `log.level`, stop
  at nothing in a line VictoriaLogs cannot parse as a whole, fold only ASCII
  in the keyword scan, and write the derived level over a stored
  `detected_level`, where Loki takes the first level key in document order,
  searches objects at depth 1, keeps the keys read before a syntax error, folds
  Unicode and keeps a detected_level stream label as stored.

  The pipes also read the stored level fields in one list order without
  telling a stream label from structured metadata, where Loki and the raw-row
  evaluator read the stream's before the metadata: a stream `severity=error`
  with metadata `level=info` is error in Loki and info on the pipes. The JSON
  pipeline guard does not see it (an exact probe is an OR over pairs of names,
  and a cheap one would send every stream labelled severity to the raw-row
  evaluator), so it is recorded here too; the e2e and unit probe
  `stream severity before stored level metadata` assert the raw-row
  evaluator's answer only.

  Three more lines the pipes read differently, which no guard probe sees
  (an exact one would need a logfmt decoder per line):
  - A logfmt level key in another case, `msg="error x" LvL=warn`: Loki's
    decoder compares keys without case and reads `warn`, `unpack_logfmt` is
    case-sensitive and the keyword scan says `error`. Loki answers `warn`
    (measured on v3.7.7); the pushdown and this route answer `error`.
  - A logfmt syntax error before the level key,
    `msg="unterminated error level=info`: Loki's decoder stops at the error
    and the line falls to the keyword scan, `error` (measured); the pipes skip
    the error and read `level=info`.
  - A row VictoriaLogs unpacked from a JSON body (stored without a message,
    `{"level":"notice","msg":"error later"}` pushed with message parsing on),
    whose stored `level=notice` the pipes keep as the word `notice`, where Loki
    keeps the line and gives `error` (measured; the same on main).
  The raw-row evaluator reads the first two like Loki
  (TestOrderedJSONDetectedLevelKnownDifferences); the pushdown and the native
  route keep the pipes' value.

  Measured against Loki v3.7.7 on VictoriaLogs v1.52.0 with the e2e probe
  fixtures: `{"msg":"x","severity":"error","level":"info"}` is error in Loki and
  info in the proxy; a stream with the label `detected_level="INFO"` is INFO in
  Loki and info in the proxy; a stream `severity=error` with metadata
  `level=info` is error in Loki and under `| json`, and info under
  `| json | drop __error__`. Logs Drilldown's detected_level breakdown
  (`| json | drop __error__, __error_details__ | detected_level != ""`) is not
  on this route: the label translator maps detected_level to level, so the
  native histogram is never exact for it and the JSON pipeline route answers.
  The JSON pipeline route (`| json`, #760) probes
  for these lines and answers them with the raw-row evaluator, which is exact;
  the native route has no raw-row fallback for them.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum by (detected_level) (count_over_time({app="json-level-probe"}[1m]))'
    start: now-10m
    end: now
    step: "60"
  headers:
    X-Scope-OrgID: "0"
  precondition: |
    A line holding `severity` before `level` with different values, a stream
    with a detected_level label, a stream `severity` with metadata `level`, a
    logfmt line with `LvL=warn` or a syntax error before its level key, or a
    row VictoriaLogs unpacked from a JSON body with a stored `level`.
compare:
  mode: exact
  fields: [series_labels, values]
  expect: |
    Loki: error for the line with severity first; INFO for the labelled stream;
    warn for `LvL=warn`; error for the unterminated line and for the unpacked
    row. Proxy: info for the first two, error for `LvL=warn`, info for the
    unterminated line, notice for the unpacked row.
gap:
  status: open
  impact: edge
  effort: M
  area: 'internal/translator detected_level_logsql.go BuildDetectedLevelChain; internal/proxy native metric route'
  loki: 'pkg/distributor/field_detection.go getLevelUsingJSONParser (document order, depth < 2), labels.go (detected_level_extracted)'
  proxy: 'BuildDetectedLevelChain reads keys in its list order and overwrites detected_level; the JSON pipeline route guards these lines instead'
  planned_test: 'an e2e on plain-selector probe lines once the route probes and falls back to a raw-row or keyed evaluation'
  clusters: []
