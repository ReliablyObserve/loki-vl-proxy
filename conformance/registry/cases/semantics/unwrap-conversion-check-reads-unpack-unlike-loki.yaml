id: semantics/unwrap-conversion-check-reads-unpack-unlike-loki
title: "The unwrap conversion check reads an unpack as Loki does"
pending: true
proves:
  - parser-unpack
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  The proxy's unwrap conversion check runs the parser stages over a line itself (unwrap_conversion_error.go,
  unwrapParseLine). For unpack it promoted the string keys of any line holding the text "_entry" and set no error on
  a line that is not JSON, so a sum_over_time over an unwrapped label answered 400 SampleExtractionErr where Loki
  answers: a line with a numeric, object or nested `_entry` gave the check a label Loki does not promote. It now
  reads labels only from a packed line (an object whose top-level `_entry` is a string) and marks a line that is no
  JSON object. Held to Loki by TestUnpackSumMatchesLoki (job=uw and job=uwbad, VictoriaLogs v1.49.0 and v1.54.0),
  TestUnwrapPackedLabelsMatchRecordedLoki and TestCompat_UnpackSumsLikeLoki.

  Not covered, and visible in the values: the unwrapped metric itself still reads the labels VictoriaLogs'
  unpack_json makes, which come from any JSON line (semantics/translator-writes-unpack-as-unpack-json).
request:
  scope: query-grammar
  entry: "TestUnpackSumMatchesLoki (internal/querycorpus): sum_over_time over job=uw"
  setup: "Send an unwrapped sum_over_time over an unpack of a line whose _entry is a number and whose value is text."
compare:
  mode: exact
  fields: [status, error_text, values]
  expect: "Loki's status."
gap:
  status: fixed
  fixed_by: "#1758"
  impact: edge
  effort: S
  area: 'internal/proxy/unwrap_conversion_error.go (unwrapParseLine, ParserUnpack); internal/proxy/unpack_parser_error.go (unwrapPackedLabels)'
  loki: 'labels only from a line with a top-level string _entry; JSONParserErr on a line that is no object'
  proxy: 'the same'
  planned_test: 'TestUnpackSumMatchesLoki (internal/querycorpus); TestUnwrapPackedLabelsMatchRecordedLoki (internal/proxy); TestCompat_UnpackSumsLikeLoki (test/e2e-compat, group semantics)'
  clusters: []
