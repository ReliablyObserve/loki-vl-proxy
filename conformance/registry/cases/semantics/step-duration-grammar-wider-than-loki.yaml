id: semantics/step-duration-grammar-wider-than-loki
title: the proxy accepted step durations Loki rejects (`1.5s`, `500us`, `1h30m5.5s`) where Loki answers 400 (fixed)
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  Loki v3.7.9 reads a step as float seconds, else with the Prometheus
  model.ParseDuration: whole-number units from
  ms up to y, in descending order, no fractions and no us or ns. `1.5s` and
  `500us` are 400 `cannot parse "<step>" to a valid duration`. The proxy reads
  steps with Go's time.ParseDuration first (parsePositiveStepDuration), so it
  answers them. Grafana does not send these forms; an API client could.

  Fixed (#1419): a step is read with Loki's grammar (float seconds, else whole-number units in descending order), so `1.5s`, `500us` and `1h30m5.5s` are Loki's 400 `cannot parse "<step>" to a valid duration`. Loki's answer is recorded live for `1.5s`; the other two follow the same grammar rule and the same text.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum(count_over_time({app="api-gateway"}[1m]))'
    start: '1800000000'
    end: '1800000600'
    step: '1.5s'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [status, errorType, message]
  expect: |
    HTTP 400 `cannot parse "1.5s" to a valid duration`, as Loki.
gap:
  status: fixed
  fixed_by: '#1419'
  impact: api-only
  effort: S
  area: 'internal/proxy/time_utils.go parsePositiveStepDuration (shared with window parsing)'
  loki: 'a step is float seconds, else whole-number Prometheus duration units in descending order; 1.5s and 500us are a 400 (live case runs of 2026-11-14, in this case)'
  proxy: '400 cannot parse "<step>" to a valid duration, as Loki'
  planned_test: 'TestStepGrammarIsLokis and TestRequestParamAnswers (internal/proxy)'
  note: 'Verified 2026-11-14 on build 726dfb48f against Loki 3.7.9 and VictoriaLogs v1.53.0 (two live case runs, same data on both sides): step=1.5s answers 400 `cannot parse "1.5s" to a valid duration` on both sides.'
  clusters: []
