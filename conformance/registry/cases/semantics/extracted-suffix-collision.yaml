id: semantics/extracted-suffix-collision
title: A parsed key named like a stream label is renamed with _extracted in query results (fixed; detected_fields decision unchanged)
proves:
  - parser-error-and-label-collision
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki's parsers rename a parsed key that equals a stream label's name with the
  `_extracted` suffix, so the stream label keeps its value (`| json` on a line
  holding `level` beside the stream label `level` yields `level_extracted`).
  The proxy returned the parsed key under the stream label's name (or not at
  all), so Explore showed one `level` where Loki shows `level` and
  `level_extracted`, and grouping or filtering on `level_extracted` found
  nothing. Fixed for log entries, label filters and stats grouping on the
  renamed label, and bare `| drop` / `| keep` of it.

  The /detected_fields list of `level_extracted`, `version_extracted` and the
  like is not part of this case (semantics/detected-fields-extracted-suffix);
  the owner's stamped decision (profiles/detected-fields-no-extracted-suffix)
  covers only service / service.name there. A filter or grouping on the plain
  name is semantics/plain-name-after-parser-reads-stream-label, and a parsed
  key against structured metadata is profiles/parsed-key-colliding-with-
  structured-metadata.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{service_name="otel-collector"} | json | logfmt | drop __error__, __error_details__'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [streams.values, parsed labels]
  expect: |
    Loki's parsed labels including level_extracted.
gap:
  status: fixed
  fixed_by: "#660"
  impact: explore-visible
  effort: M
  area: 'internal/proxy stage-field exposure (parsed-label naming)'
  loki: 'pkg/logql/log/parser.go:25 duplicateSuffix; :152 json, :342 logfmt, :696 json expression'
  proxy: 'parsed key merged into the stream label''s name'
  planned_test: 'TestCompat_ExtractedSuffixOnParsedCollision (test/e2e-compat, group core); proxy TestLogQuery_ParsedKeyNamedLikeStreamLabelGetsExtractedSuffix; translator TestExtractedSuffixLabelFilter'
  note: |
    Fixed for log entries (buffered, streamed, windowed and tail paths, both encodings), label filters
    (single and `or` / `and` chains, extraction lists, after line_format) and stats grouping on
    name_extracted, bare drop/keep of it, and the bare-parser metric series labels. Not changed:
    metric series that name every parsed key (owner-kept parsed-identity/dynamic-key-parsers), a pattern
    capture whose value equals the stream label's, two parsers in one query (semantics/two-parsers-keep-one), comma-joined and parenthesised label filters
    (semantics/label-filter-expression-syntax).
  clusters:
    - 8c96e500
    - a9078b6e
    - bfd206cd
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null
