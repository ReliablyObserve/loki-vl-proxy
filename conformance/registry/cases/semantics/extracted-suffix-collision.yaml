id: semantics/extracted-suffix-collision
title: A parsed key named like a stream label is renamed with _extracted in query results (open; detected_fields decision unchanged)
proves:
  - parser-error-and-label-collision
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki's parsers rename a parsed key that equals a stream label or structured-
  metadata name with the `_extracted` suffix, so the stored label keeps its
  value (`| json` on a line holding `level` beside the stream label `level`
  yields `level_extracted`). The proxy returns the parsed key under the stream
  label's name (or not at all), so Explore shows one `level` where Loki shows
  `level` and `level_extracted`, and grouping or filtering on
  `level_extracted` finds nothing.

  This is the query-result side only. The owner's stamped decision that
  /detected_fields lists `service` / `service.name` without the suffix stays
  (documented deviation detected-fields-no-extracted-suffix); structured
  metadata named like a stream label is profiles/structured-metadata-label-
  collision.

  The same collision shows in /detected_fields: Loki lists level_extracted and
  version_extracted for a JSON line holding level and version beside stream
  labels of those names, and the proxy does not. Only service / service.name
  is covered by the owner's detected_fields decision (profiles/detected-
  fields-no-extracted-suffix); the other `_extracted` fields are this gap.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{service_name="otel-collector"} | json | logfmt | drop __error__, __error_details__'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [streams.values, parsed labels]
  expect: |
    Loki's parsed labels including level_extracted.
gap:
  status: open
  impact: explore-visible
  effort: M
  area: 'internal/proxy stage-field exposure (parsed-label naming)'
  loki: 'pkg/logql/log/parser.go:25 duplicateSuffix; :152 json, :342 logfmt, :696 json expression'
  proxy: 'parsed key merged into the stream label''s name'
  planned_test: 'TestCompat_ExtractedSuffixOnParsedCollision (test/e2e-compat, group semantics)'
  note: 'Measured on main at fcaccfcc, before #652 rewrote the tail and log-row label conversion; recheck the behaviour on the current code before fixing.'
