id: semantics/stage-after-unwrap-accepted
title: "A stage after `unwrap` in a range aggregation (`| unwrap c | drop __error__`) is accepted where Loki answers a syntax error (fixed)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  Loki accepts only label filters after an unwrap. The Loki oracle answers "parse error at line 1, col 34: syntax error: unexpected drop, expecting IDENTIFIER or (" for
  `rate({a="b"} | json | unwrap c | drop __error__[5m])` (also keep, parsers and formats after an unwrap). The proxy's validation accepts it; the plan and the translator write the stage.

  Found by the grammar sweep (internal/querycorpus TestGrammarSweep, answers recorded with the Loki oracle, Loki 3.7.9, and the VictoriaLogs oracle, v1.49.0 and v1.53.0; conformance/registry/grammar-sweep.json holds the queries of each class). The sweep compares the proxy's validation and plan with Loki's parser and tree, and the texts the plan and the translator write with VictoriaLogs' parser; it sends no HTTP request, so what a client receives is for the e2e proof to confirm when the case is promoted.

  Fixed: after an unwrap inside a range aggregation only label filters are read; a parser, format, drop, keep,
  decolorize or second unwrap stage is Loki's `unexpected <stage>, expecting IDENTIFIER or (`, a line filter
  `unexpected |=, expecting RANGE or |` (`expecting )` after the range), at Loki's line and column, unless a stage
  before it fails as Loki builds it while it parses (a regexp or pattern parser, a label filter, drop or keep regex),
  which comes first as in Loki (internal/logql TestRangeAndUnwrapGrammarMatchLoki, recorded with the Loki oracle).

request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'rate({app="x"} | json | unwrap c | drop __error__ [5m])'
    start: now-15m
    end: now
    step: "60"
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [status, error_text]
  values:
    status: 400
  expect: "Loki's 400 syntax error at the stage after unwrap."
gap:
  status: fixed
  fixed_by: TBD-PR
  impact: api-only
  effort: S
  area: "internal/logql parser parseUnwrap (stages after the unwrap)"
  loki: "only label filters follow an unwrap"
  proxy: "only label filters follow an unwrap; any other stage is Loki's 400 with its text"
  planned_test: "TestRangeAndUnwrapGrammarMatchLoki (internal/logql), TestLogQLGrammarRejectsBeforeVictoriaLogs (internal/proxy), TestGrammarSweep (internal/querycorpus)"
  visual: none
  visual_reason: 'a grammar corner no Grafana panel sends, found by the grammar sweep'
  clusters: []
