id: semantics/json-label-spelling-probe
title: A key Loki spells into the filtered label differently keeps the raw evaluator
proves:
  - parser-error-and-label-collision
consumer: any
why: |
  Loki v3.7.7's JSON parser trims the spaces around a key, prepends an
  underscore to a leading digit, replaces every rune outside `[A-Za-z0-9_]`
  with an underscore (`sanitizeLabelKey`) and joins the sanitized keys of
  nested objects with an underscore, skipping blank keys
  (`buildSanitizedPrefixFromBuffer`). VictoriaLogs `unpack_json` keeps keys
  raw and joins nesting with a dot. So `{"service-version":"1"}`,
  `{"service.version":"1"}`, `{"service version":"1"}` and
  `{"service":{"version":"1"}}` all yield `service_version` in Loki and
  nothing of that name in VictoriaLogs, and a line holding both spellings
  makes Loki keep the first one it reads. The logfmt decoder sanitizes keys
  the same way (`service-version=1`).

  A key-spelling probe (`| limit 1` over the range, beside the partial-parse
  probe) finds such a line. Its lines are drawn through VictoriaLogs' word
  index: a key that Loki reads into the label differs from it only where
  the label has underscores, so the key (or the parent key of a nesting)
  starts with the label's first piece, and so does the word VictoriaLogs'
  tokenizer cuts there, whatever follows it (an ASCII separator ends the
  word; an underscore or a non-ASCII letter or digit, which Loki also
  sanitizes to an underscore, continues it): `_msg:"service"*`, a prefix
  filter answered from the token index. A label starting with an
  underscore (Loki prefixes a leading digit or sanitizes a leading rune)
  also admits a key starting with a non-ASCII rune by regexp. Among those
  lines a flat regexp matches a key spelled with a rune other than an
  underscore where the label or a piece of it has one (`sanitizeLabelKey`),
  spaces around a key (Loki trims them) or a blank key (Loki skips it), and
  a loose regexp locates the keys of each nested split in order. Nesting is
  then verified by VictoriaLogs' own parser: a sentinel key is spliced into
  the object (`replace_regexp`) and `unpack_json` is asked for the sentinel
  and for every dotted name a split can take (`service.version`;
  `k8s.pod_name`, `k8s_pod.name`, `k8s.pod.name`), so
  `{"service":{"name":"api"},"version":"v1"}` (the e2e generator's
  api-gateway shape) is not a match and `{"service":{"version":"1"}}` is,
  whatever the siblings hold; a line the sentinel is missing from did not
  parse as a whole, so Loki may have read the keys before the syntax error,
  and counts as a match (a superset, which only costs the fallback). One
  matching line in the range keeps the exact raw-row evaluator, whose parser
  mirrors Loki's. Labels with more than six underscores are not pushed down
  (the split enumeration is 2^n).

  The first version of this probe located the nested key with a
  balanced-brace regexp; VictoriaLogs spent a third of a second preparing
  that regexp on every query, twice per probe, so a Drilldown or Explore
  breakdown by `service_version` cost 0.7 s at 1 h whatever the data, and
  Explore's two-filter volume 1.1-1.4 s. Measured on the shared stack: 0.7 s
  to 0.14-0.25 s at 1 h; at 24 h the probes read only the indexed lines.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum by (level, detected_level) (count_over_time({app="json-filter-nested"} | json | service_version=`0.96.0` | pipeline=`logs/loki` | drop __error__ [1m]))'
    start: now-9h
    end: now-8h
    step: "60"
  headers:
    X-Scope-OrgID: "0"
  precondition: |
    The stream holds a line `{"service":{"version":"0.96.0"},"pipeline":"logs/loki"}`.
compare:
  mode: exact
  fields: [status, series_labels, values]
  expect: |
    HTTP 200 with Loki's series and values; the probe matches, the bucket
    query is discarded and the raw-row evaluator answers, so
    `loki_vl_proxy_parser_metric_evaluations_total{evaluator="raw_rows",reason="probe"}`
    rises by one.
