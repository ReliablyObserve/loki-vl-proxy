id: semantics/unwrap-over-time-range-windows
title: sum, avg, max and min over time with unwrap answer Loki's window on query_range for a range longer than the step (fixed)
proves:
  - window-bounds-and-step-alignment
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki evaluates `sum_over_time`, `avg_over_time`, `max_over_time` and
  `min_over_time` over unwrap on the window (t-range, t] for every step
  (pkg/logql/range_vector.go:102-189 batchRangeVectorIterator.Next, load: the
  lower bound is exclusive, the evaluation time inclusive;
  range_vector.go:371-420 the functions).

  Range == step is fixed with semantics/unwrap-range-last-point (anchored step
  buckets relabelled onto the evaluation time each closes), range < step with
  semantics/unwrap-over-time-short-range-windows (the window phase filter keeps
  only the lines of (t-range, t] in the step bucket).

  Range > step was answered from one VictoriaLogs step bucket per point
  (statsRateRangeEqualsStepShift treats every range of these functions as the
  step, and shouldUseManualRangeMetricCompat kept them off the window
  evaluator): the value was the step (t-step, t], not the window. Measured on an
  isolated stack (Loki 3.7.7, VictoriaLogs v1.52.0, generator data),
  `sum(sum_over_time({app="payment-service"} | logfmt | unwrap amount [5m]))` at
  step 60 and t=1791665280: Loki 9.84307e+06, proxy 2.00257e+06 (one step of
  the five in the window); with an emulated VictoriaLogs,
  `sum_over_time({app="uw"} | unwrap amount [150s])` at step 2m gave 725.875
  where Loki has 942.125. Whether a step had a sample followed the step bucket
  too: a line every 4.5 minutes under [5m] at step 60 gave 13 samples where Loki
  has 61.

  Fixed: a range longer than the step goes to the window evaluator
  (unwrapWindowBuckets). VictoriaLogs answers, per series, buckets of the
  greatest common divisor of range and step anchored at the request
  (stats_query_range with the offset argument), each holding the partial
  aggregate of its lines (the sum, the maximum or the minimum of the converted
  value; VictoriaLogs answers only a bucket that holds a line, so the point is
  the presence) and, for avg, their count; the proxy merges the buckets of every
  window (mergeUnwrapBuckets): the sum, the sum over the window's count for avg,
  the extreme for max and min, and a sample only where the window holds a line.
  `max by (L) (max_over_time(...))` and `min by (L) (min_over_time(...))`, L
  possibly empty, are the extreme of the group's lines in the window whatever
  the series are (pkg/logql/range_vector.go:405-420, VectorAggEvaluator.Next):
  VictoriaLogs groups those buckets by L (unwrapGroupPushdown), with no series
  per stream or line read, also over a JSON parser, and Loki's series limit
  counts the groups (pkg/logql/engine.go:530-590 JoinSampleVector).
  Windows overlap when the range is longer than the step, so one VictoriaLogs
  bucket per point cannot hold a window, and VictoriaLogs has no sliding-window
  stats: the merge in the proxy reads aggregated buckets only (series times
  buckets, bounded by the stats response limit), never raw rows. The outer
  aggregations are the ones the evaluator already applies after the window: a
  sum by labels or none, topk and bottomk, label_replace, a binary operation, a
  count, min, max or avg by labels (foldVectorAggregations), and a labelled
  `without` as the outermost aggregation (withWithoutFold); the reads before an
  outer fold are bounded by the raw-row budget, as for a `without`, and Loki's
  series limit applies to the folded answer. A grid of more than 11,000 buckets
  (a range that the step does not divide, say [5m] at step 86.4s: 2.4s buckets)
  is answered by the raw-row evaluator, bounded by
  -manual-range-metric-row-limit, which reads the same window
  (semantics/lower-bound-exclusive). Instant queries were already exact.

  This supersedes #740 (fix/unwrap-over-time-range-windows), whose duplicated
  range == step commits are on main, and includes #570
  (semantics/lower-bound-exclusive).

  Not covered: the forms whose series VictoriaLogs groups per stream and line
  under an outer aggregation, nested aggregations the evaluator does not apply
  and an empty `without ()` keep the native step buckets
  (semantics/unwrap-over-time-range-windows-residual-forms).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum(sum_over_time({app="payment-service"} | logfmt | unwrap amount [5m]))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, values]
  expect: |
    One series, Loki's window sum at every step.
gap:
  status: fixed
  fixed_by: TBD-PR
  impact: explore-visible
  effort: M
  area: 'internal/proxy unwrap_samples.go unwrapWindowBuckets, unwrapBucketAgg, mergeUnwrapBuckets; range_metric_compat.go handleStatsCompatRange, buildHitsRangeMetricMatrix'
  loki: 'pkg/logql/range_vector.go:102-189 batchRangeVectorIterator (window (t-range, t]); range_vector.go:371-420 sumOverTime, avgOverTime, maxOverTime, minOverTime'
  proxy: 'anchored gcd(range, step) buckets of the partial aggregate and the sample count, merged per window'
  planned_test: 'TestUnwrapOverTimeWindowsDifferential, TestUnwrapOverTimeRangeWindowEdgeCases, TestUnwrapOverTimeRawWindowBounds (internal/proxy); TestCompat_UnwrapOverTimeRangeWindows (test/e2e-compat, group core)'
  note: 'Range == step fixed with semantics/unwrap-range-last-point, range < step with semantics/unwrap-over-time-short-range-windows. Supersedes #740; includes #570.'
  clusters: []
