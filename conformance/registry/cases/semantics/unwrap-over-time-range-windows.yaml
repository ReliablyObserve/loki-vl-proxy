id: semantics/unwrap-over-time-range-windows
title: sum, avg, max and min over time with unwrap answer Loki's window on query_range (fixed)
proves:
  - window-bounds-and-step-alignment
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki evaluates `sum_over_time`, `avg_over_time`, `max_over_time` and
  `min_over_time` over unwrap on the window (t-range, t] for every step
  (pkg/logql/range_vector.go:148-189 batchRangeVectorIterator.load: the lower
  bound is exclusive, the evaluation time inclusive; range_vector.go:371-425
  sumOverTime, avgOverTime, maxOverTime, minOverTime). The proxy answered them
  with VictoriaLogs' stats_query_range buckets of the step
  (shouldUseManualRangeMetricCompat sent them to the native path, whose comment
  assumes range == step), so for a range other than the step the value was one
  step-sized bucket, not the window, and on sparse data whether a step had a
  sample followed that bucket too.
  Measured on an isolated stack (Loki 3.7.7, VictoriaLogs v1.52.0, generator
  data), `sum(sum_over_time({app="payment-service"} | logfmt | unwrap amount [5m]))`
  sliding (step 60) Loki 9.84307e+06 at t=1791665280, proxy 2.00257e+06 (about a
  fifth: one step of the five in the window); one line every 4.5 minutes at step
  60: `[5m]` proxy 13 samples vs Loki 61, `[30s]` proxy 13 vs Loki 7. The same
  for avg/max/min over `| json | unwrap duration_ms` grouped `sum by (level)`;
  the instant query is exact.
  Range == step is fixed with semantics/unwrap-range-last-point: the request is
  fetched on anchored step buckets (edge, edge+step] from start-step and
  relabelled onto the evaluation time each closes (statsRateRangeEqualsStepShift
  covers these functions, logRangeFunctions), so the labels, the end sample and
  the values are Loki's (TestUnwrapOverTimeTumblingMatchesLoki). This row is the
  range != step half.

  Fixed: for a range other than the step, the manual window evaluator answers
  these functions from anchored stats_query_range buckets (unwrapWindowBuckets,
  unwrapBucketAgg): VictoriaLogs returns per series and per bucket the sum, max
  or min of the gated unwrap value with count() (gcd(step, range) buckets
  anchored at start-range with the stats offset; a range shorter than the step
  takes one step per bucket with the lines outside the windows filtered out by
  windowPhaseFilter), and the proxy merges the buckets of each window
  (mergeUnwrapBuckets: sum, sum over the window's count for avg, max, min; a
  sample only where the window holds a line). These partial aggregates merge
  exactly; the unwrap gate and its conversion-error counter ride along. An
  ungrouped sum of avg, max or min folds the per-stream windows
  (foldUngroupedSum) and its per-stream buckets do not count against
  -max-stats-query-series (Loki counts the one folded series). Bounds as for
  rate with unwrap: VictoriaLogs before v1.45 with an anchor off the bucket's
  epoch grid, and more than 11,000 buckets, use the raw-row evaluator, reading
  (t-range, t] for these functions too; on those versions this includes a range
  equal to the step with a start off the step grid, which read epoch-grid
  buckets before (tumblingBucketsAligned;
  semantics/native-buckets-epoch-grid-unaligned-start-v140, which stddev and
  stdvar keep). A first or last over time can plug
  into the same merge (the first or last present bucket of the window) once its
  bucket stats exist.

  Residuals, still answered from native step buckets (their windows stay one
  step bucket for a range other than the step), registered apart:
    * an ungrouped `sum` or a `sum without (...)` of avg, max or min over a
      parser query (semantics/unwrap-over-time-parser-series-windows);
    * an outer aggregation other than sum (`max by`, `min by`, `avg by`,
      `count by`) around these functions
      (semantics/manual-range-outer-aggregation-dropped);
    * stddev_over_time and stdvar_over_time with unwrap: a variance merged from
      bucket sums of squares cancels where Loki's Welford update does not, and
      VictoriaLogs has no per-bucket M2
      (semantics/unwrap-stddev-stdvar-range-last-point).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum(sum_over_time({app="payment-service"} | logfmt | unwrap amount [5m]))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, values]
  expect: |
    One series, Loki's window sum at every step.
gap:
  status: fixed
  fixed_by: "#TBD"
  impact: explore-visible
  effort: M
  area: 'internal/proxy range_metric_compat.go handleStatsCompatRange, buildHitsRangeMetricMatrix, collectRangeMetricHits; unwrap_samples.go unwrapWindowBuckets, unwrapBucketAgg, mergeUnwrapBuckets'
  loki: 'pkg/logql/range_vector.go:148-189 batchRangeVectorIterator.load (window (t-range, t]); range_vector.go:371-425 sumOverTime, avgOverTime, maxOverTime, minOverTime'
  proxy: 'anchored stats buckets of sum/max/min and count merged per window'
  planned_test: 'TestCompat_UnwrapOverTimeRangeWindows (test/e2e-compat, group core); TestUnwrapOverTimeWindowsDifferential, TestUnwrapOverTimeSparseSamplePresence, TestUnwrapOverTimeUngroupedSumIgnoresSeriesLimit, TestUnwrapOverTimeResidualShapesKeepStatsBuckets and TestUnwrapOverTimeRangeEmitsEndSample (internal/proxy)'
  note: 'Range == step fixed with semantics/unwrap-range-last-point. Found while fixing semantics/unwrap-rate-ungrouped-sum-per-stream, on origin/main e173e40b. The instant path matches Loki. The e2e is written and not yet run.'
  clusters: []
