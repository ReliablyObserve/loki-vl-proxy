id: semantics/without-fold-detected-level-unknown
title: sum, max and topk without over an unwrap function after an extraction list label a series detected_level="unknown" where Loki keeps the stream's level (open)
pending: true
proves:
  - loki_api_v1_query_range
consumer: explore
why: |
  A without aggregation removes only the labels it names
  (pkg/logql/evaluator.go:435-529 VectorAggEvaluator.Next); detected_level,
  set on every line at ingestion, stays on the series.

  The differential run of 2026-11-04 (proxy 69d07019, Loki v3.7.9,
  VictoriaLogs v1.53.0):
    * `sum without (pod) (max_over_time({app="payment-service"} | logfmt
      amount | unwrap amount [5m]))` (and `sum_over_time`, `max without`,
      `topk(5, sum without ...)`, `topk without (pod) (1, rate(...))`): the
      same number of series on both sides; Loki's series carry
      `detected_level="error"` (the stream's level), the proxy's
      `detected_level="unknown"`.
  The without fold of an extraction-list unwrap
  (semantics/unwrap-sum-without-collapses) rebuilds the series labels from
  the named parsed keys and does not derive detected_level from the stream.
  These are the own requests of two fixed cases
  (semantics/unwrap-sum-without-collapses, #739, and
  semantics/topk-bottomk-without-strips-label, #736); the label is likely
  the work of #750 (a metric's series carry detected_level, "unknown"
  included), merged after both, and is to be confirmed when the fix is
  made.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum without (pod) (max_over_time({app="payment-service"} | logfmt amount | unwrap amount [5m]))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [series]
  expect: |
    Loki's label sets, detected_level included.
gap:
  status: open
  impact: explore-visible
  effort: S
  area: 'internal/proxy without fold of extraction-list unwrap metrics (parsedSeriesLabels, applyWithoutGrouping)'
  loki: 'pkg/logql/evaluator.go:435-529 (without keeps every unnamed label, detected_level included)'
  proxy: 'detected_level="unknown" on the folded series'
  planned_test: 'TestCompat_WithoutFoldKeepsDetectedLevel (test/e2e-compat, group core)'
  clusters:
    - 0ca18300
    - f2591a31
    - f25c53a6
