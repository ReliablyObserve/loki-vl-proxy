id: semantics/parenthesized-log-range
title: A parenthesized log expression under a range function fails translation (open)
proves:
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  LogQL allows `rate(({namespace="prod"} |= "error")[5m])` and
  `count_over_time(({...} |~ "x")[1m])`; Loki answers them like the
  unparenthesized form. The proxy sends VictoriaLogs a query it cannot parse
  (`cannot parse query arg ... missing whitespace or ':'`, HTTP 400) on range
  queries and answers instant ones with `log queries are not supported as an
  instant query type`.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'count_over_time(({namespace="prod"} |~ ".+bar")[5m])'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [status]
  expect: |
    200 with Loki's series.
gap:
  status: open
  impact: explore-visible
  effort: S
  area: 'internal/logql parser / internal/translator (LogRangeExpr with parenthesized left side)'
  loki: 'pkg/logql/syntax/syntax.y logRangeExpr: OPEN_PARENTHESIS logExpr CLOSE_PARENTHESIS RANGE'
  proxy: '400 (VictoriaLogs parse error) / instant 400'
  planned_test: 'TestCompat_ParenthesizedLogRange (test/e2e-compat, group semantics)'
