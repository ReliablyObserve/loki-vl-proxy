id: semantics/parenthesized-log-range
title: A parenthesized log expression under a range function evaluates like the plain form
proves:
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  LogQL allows `rate(({namespace="prod"} |= "error")[5m])` and
  `count_over_time(({...} |~ "x")[1m])`; Loki answers them like the
  unparenthesized form (syntax.y logRangeExpr: parentheses around the selector
  and pipeline, or around the whole range expression, an offset, an unwrap
  before or after the range, a pipeline after the range). The proxy parses every
  form Loki accepts, rewrites it to the plain form before translation, and
  rejects what Loki rejects with Loki's status and error text.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'count_over_time(({namespace="prod"} |~ ".+bar")[5m])'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [status]
  expect: |
    200 with Loki's series; Loki's 400 and error text for the forms Loki rejects.
gap:
  status: fixed
  fixed_by: "#669"
  impact: explore-visible
  effort: S
  area: 'internal/logql/parser.go (parseLogRange), internal/logql/canonical.go, internal/proxy/query_translation.go'
  loki: 'pkg/logql/syntax/syntax.y logRangeExpr: OPEN_PARENTHESIS selector [pipelineExpr] [unwrapExpr] CLOSE_PARENTHESIS RANGE [offsetExpr]'
  proxy: 'parsed and rewritten to the plain range form (logql.CanonicalizeLogRanges)'
  planned_test: 'TestCompat_ParenthesizedLogRange (test/e2e-compat, group core)'
  clusters:
    - 26eda2af
    - 27527d05
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: true
  locked_since: '2026-10-27'
  effort_exception: null
