id: semantics/approx-topk-opaque-plan
title: "approx_topk is kept as text by the parser and the plan: no pipeline, offset or operation in its tree, and a grouping error with another text (open)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  Loki accepts `approx_topk(2, rate({a="b"}[5m]))`: its tree has the operation approx_topk over a range aggregation with a log pipeline and offset 0. The proxy's parser keeps the call as opaque text
  (logql.OpaqueMetricExpr), so the query plan has no outer operation, no pipeline and no offsets for it (the sweep compares them with the Loki oracle's facts command), and the translator
  writes the whole text as a phrase search that VictoriaLogs v1.49.0 and v1.53.0 reject. With a grouping clause Loki answers
  "parse error : grouping not allowed for approx_topk aggregation" and the proxy "syntax error: unexpected without, expecting (".

  Found by the grammar sweep (internal/querycorpus TestGrammarSweep, answers recorded with the Loki oracle, Loki 3.7.9, and the VictoriaLogs oracle, v1.49.0 and v1.53.0; conformance/registry/grammar-sweep.json holds the queries of each class). The sweep compares the proxy's validation and plan with Loki's parser and tree, and the texts the plan and the translator write with VictoriaLogs' parser; it sends no HTTP request, so what a client receives is for the e2e proof to confirm when the case is promoted.
request:
  scope: query-grammar
  entry: "TestGrammarSweep (internal/querycorpus): the class of conformance/registry/grammar-sweep.json cased semantics/approx-topk-opaque-plan"
  setup: "Send as the query of /loki/api/v1/query_range (start now-15m, end now, step 60s): approx_topk(2, rate({app=\"x\"}[5m])) . The query is kept out of the plan corpus while the difference is open (the plan ratchets count the corpus rows); promote it to an HTTP request with the e2e proof when it is fixed."
compare:
  mode: observed
  fields: [status, error_text]
  expect: "Loki's answer for approx_topk: its series, and Loki's 400 for a grouping clause."
gap:
  status: open
  impact: api-only
  effort: M
  area: "internal/logql (opaque metric calls) and internal/queryplan (Opaque node)"
  loki: "a typed vector aggregation over a range aggregation"
  proxy: "opaque text; no typed tree and no VictoriaLogs query"
  planned_test: 'TestGrammarSweep (internal/querycorpus: the class of conformance/registry/grammar-sweep.json that names this case holds the queries; it shrinks as the proxy follows Loki)'
  visual: none
  visual_reason: 'a grammar corner no Grafana panel sends, found by the grammar sweep'
  clusters: []
