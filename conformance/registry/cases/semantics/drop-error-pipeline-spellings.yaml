id: semantics/drop-error-pipeline-spellings
title: '`| drop __error__` after a parser keeps the lines the parser fails on, in every spelling of the range pipeline'
pending: true
proves:
  - loki_api_v1_query_range
consumer: explore
why: |
  A metric over `| json | drop __error__` counts every line, including the
  ones the parser fails on: the drop removes the error label, not the lines.
  Loki accepts the range's pipeline in three spellings: inside the range,
  written after it (`count_over_time({...}[1m] | json | drop __error__)`), and
  as a parenthesised log query (`count_over_time(({...} | json | drop
  __error__)[1m])`). The proxy reads the drop-error opt-in from the query's
  resolved logical plan (queryplan.Resolve), which finds the range's pipeline
  in every spelling, where the text check it replaces missed the last two.
  This case pins that all three answer like Loki and like each other, with
  the step equal to the range and shorter than it.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum(count_over_time({service_name="api-gateway"}[1m] | json | drop __error__))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [status, matrix.values]
  expect: |
    200 with Loki's values: every line counted, the same for each spelling.
