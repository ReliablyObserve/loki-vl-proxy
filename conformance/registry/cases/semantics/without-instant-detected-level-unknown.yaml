id: semantics/without-instant-detected-level-unknown
title: an instant without answer retains the detected_level=unknown label Loki puts on a stream with no level
proves:
  - metric-series-identity
  - loki_api_v1_query
consumer: explore
why: |
  `sum without (route) (count_over_time({app=~"uwsum-lf-.+"}[5m]))` at /query keeps
  every label of the stream but `route`. For a stream with no `level` label Loki
  3.7.7 labels the series `detected_level="unknown"` next to the stream labels
  (app, service_name). The proxy now groups native stats by the derived level
  and retains it in the instant answer. A stream with a stored level label has
  `level` and `detected_level` on both.

  Measured on the e2e fixtures (streams with only an `app` label; Loki 3.7.7 and
  VictoriaLogs v1.52.0 on an isolated stack) originally exposed the missing
  label. The no-level fixture now shows the proxy and Loki return the same
  labels and values for instant `sum without` over count and rate.
request:
  method: GET
  path: /loki/api/v1/query
  params:
    query: 'sum without (route) (count_over_time({app=~"uwsum-lf-.+"}[5m]))'
    time: 'now'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series labels]
  expect: |
    detected_level="unknown" on every series of a stream with no level label.
gap:
  status: fixed
  impact: explore-visible
  effort: S
  area: 'internal/proxy instant stats answer labels (the stream-derived label set of an instant vector; the range path adds detected_level in buildMetricSeriesEntry)'
  loki: 'detected_level is a label of every stream when log level discovery is on (unknown without a level)'
  proxy: 'the instant vector has the stream labels without detected_level'
  fixed_by: '#750'
  visual: none
  visual_reason: 'The regression is specific to the instant /query API; the visual Explore graph captures /query_range. The exact instant API response is compared with Loki in TestCompat_DetectedLevelUnknownInStatsAnswers.'
  note: 'TestCompat_DetectedLevelUnknownInStatsAnswers compares instant without count/rate grouping against pinned Loki without normalizing the label. Unwrap max_over_time under without is outside this case and retains its separate gap.'
  clusters: []
