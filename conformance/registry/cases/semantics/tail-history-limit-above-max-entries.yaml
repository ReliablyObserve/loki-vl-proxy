id: semantics/tail-history-limit-above-max-entries
title: 'A tail limit above max_entries_limit_per_query reads at most that many history entries (Loki''s answer not recorded)'
pending: true
proves:
  - loki_api_v1_tail
consumer: api
why: |
  A tail's history is the newest `limit` entries since `start`
  (semantics/tail-history-start-limit). The proxy holds the history read to
  the tenant's max_entries_limit_per_query (-max-entries-limit-per-query,
  -tenant-limits; 0 is unlimited), so the rows it buffers before the first
  frame stay bounded, as a query_range answer's are. It does not refuse the
  request: no recorded Loki answer shows a tail refused above that limit,
  and the compose stack's Loki runs with max_entries_limit_per_query 0, so
  the case cannot be observed there. A recording against a Loki with a
  non-zero limit decides whether Loki refuses the upgrade (as query_range
  does with `max entries limit per query exceeded`) or sends fewer entries.
request:
  method: GET
  path: /loki/api/v1/tail
  params:
    query: '{service_name="api-gateway"}'
    limit: '20000'
  headers:
    X-Scope-OrgID: "0"
  setup: |
    TestTailHistory_NewestEntriesSinceStartBeforeLiveLikeLoki and
    TestTailHistory_LimitDefaultsLikeLoki (internal/proxy) set the limit to
    10 and request 50: the history holds the newest 10 entries on every tail
    mode.
compare:
  mode: observed
  fields: [status, streams.values]
  expect: |
    The upgrade succeeds and the history holds at most
    max_entries_limit_per_query entries.
