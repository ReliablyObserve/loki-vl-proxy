id: semantics/loki-build-phase-window
title: "A pipeline stage Loki refuses to build fails a request only over a window Loki builds it for (recorded)"
pending: true
proves:
  - loki-error-phases
consumer: api
why: |
  Recorded over HTTP from the stack's pinned Loki (3.7.9) serving a fixture of the 10 minutes before the recording
  (internal/lokierr/testdata/loki_build_phase.jsonl, 64 rows, error-answers-record with test/errorrecord -ingest):

  - A line_format or label_format template, a line filter regex or pattern, a json expression and an ip() label
    filter that do not build answer 400 over any window that reaches the last three hours, as log and metric
    queries, on query_range and query, also with a selector no stream matches and a line filter no line passes.
  - The same queries answer 200 with an empty result over a window that ends five hours or more before the
    recording (the fresh Loki's store holds nothing there), up to and past the 72h retention.
  - Over that old window, a request error (an instant log query, a limit that is not a number, the 11,000 points
    resolution, the query length), a parser action (a pattern parser) and the tree checks (a range grouping, sort
    with a grouping, the empty-compatible selector) still answer 400.
  - A selector or label filter regex error is the same parse error on /labels and /series; a stage error there is
    `only label matchers are supported`.

  The proxy validates every stage at parse time and answers 400 over any window. Not recorded yet: an old window
  whose store holds lines of the selector (the fixture is too young to be flushed), which a stack with days of
  data shows.
request:
  scope: query-grammar
  entry: "TestLokiBuildPhaseWindowRecorded (internal/proxy): every recorded row held to the window rule"
  setup: "The rows of internal/lokierr/testdata/loki_build_phase.jsonl; error-answers-record records them again."
compare:
  mode: exact
  fields: [status, error_text]
  expect: "Loki's status for every row: 400 over a window reaching the last three hours, 200 empty over an older empty window, 400 for the request, action and tree errors over any window."
