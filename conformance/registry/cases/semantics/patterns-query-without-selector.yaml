id: semantics/patterns-query-without-selector
title: "/patterns given a valid query with no stream selector answers Loki's empty success (fixed)"
pending: true
proves:
  - loki_api_v1_patterns
consumer: api
why: |
  A Loki that serves data answers `/loki/api/v1/patterns?query=1 + 1` and `query=vector(1)` with
  `200 {"status":"success","data":[]}` (Content-Type `application/json; charset=UTF-8`): rows r0291 and r1600 of
  internal/lokierr/testdata/loki_error_answers.jsonl, recorded by test/errorrecord from a Loki 3.7.9 that held data
  (state "serving"). A Loki that had just started with no data answered `400 only label matchers are supported`,
  and the other selector routes (labels, label values, series, index stats, index volume, detected_labels) keep that
  400 in both states. The proxy answered the 400.

  Fixed: a valid query that reads no stream selector anywhere (literals, `vector(n)`, their arithmetic and
  aggregations) is answered on /patterns with Loki's empty success from the parsed query, before the response cache
  and any VictoriaLogs call (internal/proxy/patterns_no_selector.go). A success is not compared byte for byte by the
  replay (the proxy's security headers differ from Loki's), so the two rows are marked not comparable and
  TestPatternsQueryWithoutSelectorAnswersLikeLoki holds the status, Content-Type and body to the recording.
request:
  method: GET
  path: /loki/api/v1/patterns
  params:
    query: '1 + 1'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [status, body]
  expect: |
    Loki's 200 with an empty data array.
gap:
  status: fixed
  fixed_by: TBD-PR
  impact: api-only
  effort: S
  area: 'internal/proxy /patterns query validation'
  loki: '200 {"status":"success","data":[]}'
  proxy: '200 {"status":"success","data":[]}, without a VictoriaLogs call'
  planned_test: 'TestPatternsQueryWithoutSelectorAnswersLikeLoki, TestHasStreamSelector (internal/proxy); TestCompat_ErrorAnswersLikeLoki (test/e2e-compat) once the success rows are compared live'
  visual: none
  visual_reason: 'Logs Drilldown always sends a stream selector to /patterns'
  clusters: []
