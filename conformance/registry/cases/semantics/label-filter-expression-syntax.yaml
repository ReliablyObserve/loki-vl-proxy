id: semantics/label-filter-expression-syntax
title: Comma-joined and parenthesized label-filter expressions are rejected (open)
proves:
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki accepts `| foo>=5,bar<25ms` (comma = and) and grouped expressions `| (
  status_code < 500 and status_code > 200) or latency >= 250ms`. The proxy
  fails them: VictoriaLogs parse errors from the translated filter (`cannot
  parse ... probably, the whole string must be put into quotes`) or its own
  `syntax error: unexpected |`.

  Two causes. The parser (internal/logql) required an identifier after `|`, so
  a parenthesized filter was rejected with the generic `unexpected |`. The
  translator (internal/translator) split a filter only at lowercase ` or ` and
  ` and ` outside parentheses and handed everything else to the single-filter
  translation, which read `a="1", b="2"` as the label a with the value `"1",
  b="2"` (a 200 with the wrong lines), `(status>=500 or duration_ms>1000),
  method="GET"` as a garbled field name (the VictoriaLogs parse error), and
  `a="1" b="2"` the same way.

  Loki's labelFilter rule (pkg/logql/syntax/syntax.y:302) gives AND and OR a
  precedence (AND above OR, both left associative) and COMMA and the juxtaposed
  `labelFilter labelFilter` none, so goyacc always shifts: the right operand of
  a comma or of a juxtaposition is the rest of the group. `a, b or c` is `a and
  (b or c)` and `a or b, c` is `a or (b and c)`. Both sides read the stage with
  one grammar (translator.ParseLabelFilterExpr): the parser rejects with Loki's
  token, expected-token list, line and column, and the translator emits every
  binary node parenthesized, each filter translated like a stand-alone stage.
  A metric query keeps the grouped filter in front of `| stats`. A stage with
  several filters has no single field identity, so the latest-wins dedupe of
  repeated Drilldown clicks leaves it alone, and a line filter (`!=`, `!~`)
  after a complete label filter starts a line filter stage as in Loki.

  Known, not changed here: a numeric comparison on a value that is not a
  number keeps the line in Loki (it sets `__error__`) and drops it in
  VictoriaLogs, for a single filter as for a group. The value of every label
  filter has the kind Loki's grammar wants (syntax.y:328-356): a string after
  =~ and !~; a string, number, duration, bytes size or ip("...") after = and
  !=; a number, duration or bytes size after ==, <, <=, > and >=. A single
  filter with a wrongly typed value (`duration > "1s"`, `ok=true`, `a =~ 5`)
  used to pass to VictoriaLogs and is now Loki's 400 (Breaking, noted in the
  CHANGELOG).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{service_name="api-gateway"} | json | (status>=500 or duration_ms>1000), method="GET"'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [status, streams.values]
  expect: |
    200 with Loki's lines.
