id: semantics/non-sum-vector-aggregation-unreduced
title: max, min, count and avg over a range function are one series per group on query_range, like Loki (fixed)
proves:
  - metric-series-identity
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki folds a vector aggregation to one series per group at every step:
  `max(count_over_time({service_name="api-gateway"}[5m]))` is one series, `max
  by (level) (...)` one per level. On the range path the proxy returns the
  inner per-stream series unreduced (2160 series for that selector over an
  hour, label sets of the streams) for max, min, count and avg with or without
  `by`, including a grouping on a label no stream has (`max by (baz) (...)`:
  Loki 1 series, proxy 10656) and nested inside sum (`sum(max(rate(...)))`).
  sum and stddev reduce correctly; the instant path reduces but folds over
  streams (see metric-identity/structured-metadata-splits-series).

  Root cause: since #582 the translation of count, min, max and avg is the
  two-stage `stats by (<by>, _stream, level) <fn> as __lvp_inner | stats [by
  (<by>)] max(__lvp_inner)`. VictoriaLogs runs both stages for an instant query
  and for a tumbling window (range == step), so those were right. A window that
  is not the step is evaluated by the proxy's range evaluator, which builds its
  spec from the first stats pipe only (parseStatsCompatSpec) and so returned
  that pipe's series, one per stream, without the outer operator. `without`
  was right because the post-processing of its marker folds the series. A nested
  aggregation (`sum(max(rate(...)))`) had a second fault: only the outermost
  operator was stripped to find the range function, so the evaluator counted
  lines where the query asked for a rate.

  Fix: the proxy applies the query's vector aggregations to the series its
  evaluator returns, per step, the way VectorAggEvaluator.Next does (each series
  falls into the group its labels name, `by` keeping the listed labels, none
  keeping none; count is the number of series with a sample at the step, avg a
  running mean, min and max the extreme), innermost first, and checks
  max_query_series on that answer as Loki does. The first stats pipe stays a
  VictoriaLogs stats query (one row per series and bucket), so no raw rows are
  read for it; a sliding window needs the per-series window before any fold, so
  VictoriaLogs cannot do the fold. parseOriginalRangeMetricSpec strips every
  aggregation above the range function.

  Not changed (separate causes, not part of this row): stddev and stdvar
  (semantics/stddev-stdvar-grouped-values: the translation has no series level),
  quantile_over_time under count, min, max and avg (the translation groups the
  rows by the label before taking the quantile), `group(...)` (Loki 3.7.7 has no
  such operator and rejects it), a nested aggregation with an outer `by` on an
  instant query or a tumbling window (the label is dropped), the detected_level
  label VictoriaLogs stats answers do not carry, and a line exactly on a window
  edge on VictoriaLogs v1.40.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'max(count_over_time({service_name="api-gateway"}[5m]))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [series, values]
  expect: |
    One series, Loki's maximum per step.
