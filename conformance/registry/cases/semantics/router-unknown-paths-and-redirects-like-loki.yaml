id: semantics/router-unknown-paths-and-redirects-like-loki
title: Unknown paths answer 404 page not found and paths Loki cleans answer an empty 301 (fixed)
pending: true
proves:
  - loki_api_v1_labels
  - status-404
consumer: any
why: |
  Loki's router redirects a path it would clean (a repeated slash, a . or ..
  element) with an empty-bodied 301, before it looks for a route or checks the
  method, and answers a path no route matches with `404 page not found`. The
  proxy answered the cleaned paths 307 (Go's mux), and answered
  /label/a/b/values, /label/ and /detected_field/x 400 with its own text,
  because those two routes were registered as subtrees and parsed the path
  themselves.

  Fixed: SecurityHeadersMiddleware, which every shipped request passes first,
  answers the 301 (Location is the cleaned path with the query string kept;
  no body, no Content-Type, no nosniff); the two name routes are registered as
  /label/{name}/values and /detected_field/{name}/values, and a name that
  holds an encoded slash is another path (404). The mux's own not-found answer
  was already Loki's text.
request:
  method: GET
  path: /loki//api/v1/labels
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: exact
  fields: [status, headers, body]
  expect: |
    301 with no body for //, /./ and /../ paths; 404 `404 page not found` for
    /loki/api/v1/label/a/b/values, /label/, /detected_field/, /detected_field/a.
gap:
  status: fixed
  fixed_by: 'router checks (internal/proxy/route_gate.go)'
  impact: api-only
  effort: S
  area: 'internal/proxy/route_gate.go redirectUncleanPath, pathSlashes; route patterns in proxy.go'
  loki: 'recorded Loki 3.7.9 answers r1151, r1159, r1163, r1343-r1368 (internal/lokierr/testdata/loki_error_answers.jsonl)'
  proxy: '301 with no body; 404 page not found'
  planned_test: 'TestLokiRouterPaths, TestLokiRouterRedirectLocation, TestPathIsCleanMatchesPathClean, FuzzLokiRouter, TestLokiErrorAnswersReplay (internal/proxy)'
