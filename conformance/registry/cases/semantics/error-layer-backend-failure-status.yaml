id: semantics/error-layer-backend-failure-status
title: A failed ruler call is answered with the ruler's own status instead of Loki's 500 (open)
proves:
  - status-500
  - status-502
  - status-503
  - status-derived
consumer: any
why: |
  Loki answers a failed querier or storage call with 500
  (pkg/util/server/error.go:124-128), a full queue with 429 "too many
  outstanding requests" (pkg/queue/queue.go:21). The error layer now does the
  same on every VictoriaLogs-backed route: VictoriaLogs' 400/422 for a query
  it could not execute, its 500, a front proxy's 502/503, refused and reset
  connections, truncated and malformed bodies answer 500; VictoriaLogs' 429
  answers Loki's 429; the 502/503 fallbacks are gone. 14 cells remain (167
  before), all on the rules and alerts routes, which pass the ruler's non-2xx
  status and body through. The Drilldown partial reply turns every stats
  failure into 200 (see error-layer-silent-success).
request:
  scope: internal
  entry: lokiClientError, (*Proxy).writeErr, writeBackendError, writeGrafanaStatsFailure
  setup: |
    TestErrorLayer_NoVictoriaLogsLeak: a fake VictoriaLogs (and ruler) that fails
    every call in one of 14 modes (VictoriaLogs 400 parse and memory-limit
    errors, 422, 500, a 502/503 from a proxy in front, 429 queue full,
    connection refused and reset, a reply after -backend-timeout, a client
    cancellation, a 200 body cut off mid-stream, a malformed 200 body, a valid
    body above -backend-max-buffered-response-bytes), driven through 21 client
    routes (query_range log, sliding rate, stats, Drilldown stats, unwrap
    rate_counter, json; query; series; labels; label values; detected_fields,
    detected_field values, detected_labels; index stats, volume, volume_range,
    Drilldown volume_range; patterns; tail; rules; alerts). The cells that
    fail this class are listed in conformance/registry/error-layer-known-leaks.json.
    TestCompat_ErrorLayerLikeLoki repeats the main modes against the stack's
    VictoriaLogs through a fault-injecting forwarder and compares with Loki.
compare:
  mode: exact
  fields: [status, errorType, body, headers]
  expect: |
    500 internal for a failed backend call; 429 with "too many outstanding
    requests" for a full queue; 400 bad_data for a VictoriaLogs parse rejection
    of proxy-built LogsQL; every error in the JSON envelope with the errorType
    of its status.
gap:
  status: open
  impact: explore-visible
  effort: M
  area: 'internal/proxy/http_utils.go statusFromUpstreamErr/statusFromBackendErr/badRequestStatusOr/lokiErrorType and their call sites'
  loki: 'pkg/util/server/error.go:56-130; pkg/queue/queue.go:21'
  proxy: 'rules and alerts copy the ruler's non-2xx status (alerting.go)'
  planned_test: 'TestErrorLayer_NoVictoriaLogsLeak (internal/proxy) and TestCompat_ErrorLayerLikeLoki (test/e2e-compat, group core)'
