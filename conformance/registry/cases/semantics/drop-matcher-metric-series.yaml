id: semantics/drop-matcher-metric-series
title: 'A metric over a drop matcher keeps one series per stream with the dropped value (open)'
pending: true
proves:
  - loki_api_v1_query
  - loki_api_v1_query_range
consumer: explore
why: |
  A drop matcher writes no VictoriaLogs pipe, and a metric query groups by the
  stream, which still holds the label: the series are not merged by the labels the
  drop leaves.
request:
  scope: keep and drop stages
  entry: "a count_over_time over a drop level equals warn stage"
  setup: "count_over_time with a drop matcher on a stream label, level, detected_level or service_name"
compare:
  mode: observed
  fields: [series labels, values]
  expect: "Loki's answer."
gap:
  status: open
  impact: explore-visible
  effort: M
  area: 'internal/queryplan/lower metricDropPipes'
  loki: 'the matched label leaves the series, which merge'
  proxy: 'one series per stream with the label'
  planned_test: 'TestKeepMatchersMetricMatchLoki (internal/querycorpus)'
  clusters: []
