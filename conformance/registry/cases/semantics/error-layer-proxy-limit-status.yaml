id: semantics/error-layer-proxy-limit-status
title: Index stats answers the buffered-response limit with Loki's message size text (open)
proves:
  - status-502
  - limits/series-limit-error
consumer: any
why: |
  The proxy's limits (-backend-max-buffered-response-bytes,
  -manual-range-metric-row-limit, -binary-metric-max-arrays, the admission
  queues, the rate limits) are typed errors of the Loki class they belong to.
  A client reads Loki's status and text for the class and never a flag name;
  the request error log line carries the flag (`limit_flag`) and its setting
  (`limit_value`), and its `upstream_error` the operator wording.
  Loki's message-size limit is a 500 ResourceExhausted
  (pkg/util/server/error.go:93-100), which is how every buffer limit answers
  (`rpc error: code = ResourceExhausted desc = grpc: trying to send message
  larger than max (N vs. LIMIT)`), never 502. Its query limits
  (logqlmodel.ErrLimit) answer 400, which is how the row limit, the binary
  evaluation budgets and the multi-tenant fanout answer
  (`limit reached while evaluating the query`; limits/row-limit-answers-loki-limit-text).
  Its full queue is 429 `too many outstanding requests`, which is how the
  heavy-query and metadata-scan queues, the per-client rate limit and the
  -max-concurrent cap answer. Bench shape U9 (`sum(rate_counter(... | logfmt |
  unwrap amount [5m]))`, 502 at 24h before; Loki answers 200 there because it
  does not read raw rows) is a separate parity fix. Volume and volume_range
  (Explore and Logs Drilldown) read VictoriaLogs' stats answer within the
  limit and answer the same message size text.
  1 cell remains (7 before): index stats reads its one-row stats answer
  through the request coalescer, which does not apply the limit, so a body
  that is not that row fails to decode and answers `Internal Server Error`.
request:
  scope: internal
  entry: (*Proxy).fail and writeFailure (internal/proxy/http_utils.go, the error layer's one writer; internal/lokierr typed errors), lokiClientError, (*Proxy).writeErr, writeBackendError, writeGrafanaStatsFailure
  setup: |
    TestBinaryEvaluationBudget_LokiLimitAnswer: binary expressions (a join, a
    join under sum, a comparison with a scalar, a set operation; query and
    query_range) over -binary-metric-max-arrays=1 and
    -binary-metric-max-operand-bytes=16 answer 400 with Loki's limit text.
    TestLimitAnswersAreLokisTextAndLogTheFlag: every limit and queue class
    answers Loki's text with no flag, and the log line names the flag. TestErrorLayer_NoVictoriaLogsLeak: a fake VictoriaLogs (and ruler) that fails
    every call in one of 14 modes (VictoriaLogs 400 parse and memory-limit
    errors, 422, 500, a 502/503 from a proxy in front, 429 queue full,
    connection refused and reset, a reply after -backend-timeout, a client
    cancellation, a 200 body cut off mid-stream, a malformed 200 body, a valid
    body above -backend-max-buffered-response-bytes), driven through 21 client
    routes (query_range log, sliding rate, stats, Drilldown stats, unwrap
    rate_counter, json; query; series; labels; label values; detected_fields,
    detected_field values, detected_labels; index stats, volume, volume_range,
    Drilldown volume_range; patterns; tail; rules; alerts). The cells that
    fail this class are listed in conformance/registry/error-layer-known-leaks.json.
    TestCompat_ErrorLayerLikeLoki repeats the main modes against the stack's
    VictoriaLogs through a fault-injecting forwarder and compares with Loki.
compare:
  mode: exact
  fields: [status, errorType, body, headers]
  expect: |
    A documented proxy buffer limit answers 500 with Loki's message size text,
    a query limit (the raw-row limit, the binary evaluation budgets) 400 with
    Loki's `limit reached while evaluating the query`, a full queue or a rate
    limit 429 `too many outstanding requests`; never 502, and no flag in the
    body. The log line names the flag.
gap:
  status: open
  impact: explore-visible
  effort: S
  area: 'internal/proxy/label_handlers.go computeIndexStatsResult (vlPostCoalesced)'
  loki: 'pkg/util/server/error.go:93-100'
  proxy: '500 Internal Server Error on index stats (coalesced read, no buffered-bytes bound)'
  planned_test: 'TestErrorLayer_NoVictoriaLogsLeak (internal/proxy) and TestCompat_ErrorLayerLikeLoki (test/e2e-compat, group core)'
