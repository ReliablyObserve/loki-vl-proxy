id: semantics/ip-filter-precision
title: ip() filters are approximated with regular expressions (documented)
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  Loki matches ip() line and label filters by parsing addresses, prefixes and
  ranges. The proxy translates them to VictoriaLogs regular expressions; exact
  matching of all IPv6, non-octet CIDR and range forms is not established and
  label ip() filters need further work (KNOWN_ISSUES).

  IPv4 line filters now answer like Loki on the whole recorded grid
  (semantics/ip-line-filter-ipv4-like-loki). IPv6 line filters stay
  approximated (below, and why they stay so): Loki's IPv6 reading depends on the line around the address
  (`::1  ` matches ::1, `x ::1` and `[::1]` do not, `2001:db8::1` matches at
  the end of a line) and accepts every spelling of the address (case, zero
  padding, `::` placement); 2,764 IPv6 lines of the grid still differ, a count
  TestIPLineFilterMatchesLoki lets only fall.

  The specification is known: the scan Loki applies (a run of address
  characters from the first position that looks like the start of an IPv4 or
  IPv6 address, parsed with netip.ParseAddr and tested against the pattern) is
  written down as a reference in the tests and answers exactly what Loki
  answers on all 89,144 recorded line and label cases and 15,000 more random
  ones (the Loki oracle `process` and `ipfilter` commands). An exact IPv6
  regexp of it exists in two parts, the textual forms of the addresses of a
  prefix (zero padding, either case, any `::`, a dotted quad) and the context
  of the scan (a hex or dotted prefix moves where the scan starts, a failed
  IPv4 run skips a character, five characters must remain). The first part was
  built and is exact against ParseAddr; as VictoriaLogs regexps these forms
  are 2 to 14 KB and cost 7 to 50 times what today's IPv6 forms cost on
  VictoriaLogs (600k rows: label 20 to 67 ms today against 145 to 430 ms, line
  14 to 37 ms against 260 to 800 ms), and VictoriaLogs stores no IPv6 column
  type that a block-level dispatch could use. A form that costs more than the
  one it replaces is not shipped (owner rule: no regression), so the IPv6
  differences stay a documented ratchet until a cheaper exact form exists.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{service_name="nginx-ingress"} |= ip("10.0.0.0/9")'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [streams.values]
  expect: |
    Loki's lines.
gap:
  status: documented
  impact: edge
  effort: M
  area: 'internal/proxy/postprocess.go:84 ip filtering'
  loki: 'pkg/logql/log/ip.go'
  proxy: 'regexp approximation'
  planned_test: 'TestCompat_IPFilterForms (test/e2e-compat, group semantics)'
  clusters: []
