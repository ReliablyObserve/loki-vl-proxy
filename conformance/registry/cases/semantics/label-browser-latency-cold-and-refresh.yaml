id: semantics/label-browser-latency-cold-and-refresh
title: Label browser answers stay fast on never-queried and refreshed windows
proves:
  - loki_api_v1_labels
  - loki_api_v1_label_name_values
consumer: explore
why: |
  Grafana's label filter dropdown and Explore's label browser call /labels
  and /label/<name>/values over the dashboard range whenever they open, and
  every refresh asks again for a window moved by a few seconds; once the
  move crosses the response cache's time bucket (5 minutes up to 6 h, an
  hour up to 48 h, 6 hours beyond) the answer is computed again. Loki
  answers from its index in 0.01-0.3 s whatever the range. VictoriaLogs has
  to list label names and values by reading the range: before the label
  inventory (semantics/label-inventory-exact-and-incremental) a
  never-queried /labels took 0.6 s over 1 h, 5.7 s over 6 h, 21.6 s over
  24 h and 35 s over 7 days on the e2e stack, and every refresh past the
  cache bucket paid it again (0.4 s over 1 h, 2.9 s over 6 h, 5 s over 24 h,
  20 s over 7 days, measured on the same data).

  Measured on the e2e stack on 2026-09-29 (one request at a time, answers of
  both builds identical in every run): on a running replica, a
  never-queried /labels takes 0.55 s over 1 h, 0.11 s over 6 h and 1.7 s
  over 24 h instead of 1.1, 1.3 and 6.6 s; a refresh past the cache bucket
  takes 0.09 s (1 h), 0.09 s (6 h), 0.05 s (24 h) and 0.38 s (7 d) instead of
  0.38, 2.9, 5.0 and 20.4 s, and /label/env/values 0.16 s, 0.32 s, 0.16 s
  instead of 0.81, 6.6 and 4.7 s. A replica's very first 7-day listing, with
  nothing cached anywhere, still reads the whole range (19.9 s against
  23.4 s): only its buckets make the next windows cheap, and the keep-warm
  loop fills them for the 1 h to 7 d presets.

  A window moved back by an hour or more has new unaligned ends that no
  earlier request cached: each end was an edge plus up to three minute and
  eleven 5-minute buckets, about 19 VictoriaLogs calls per 24h /labels, five
  rounds at four in parallel. In the perf A/B of 2026-11-25 (loki-defaults,
  runs 45611003635 and 45633797620) the shape "refresh labels (label
  browser)", which moves its 24h window back 3617 s per run, took 306 and
  273 ms warm against Loki's 64 and 66 ms with 20 calls per request, and its
  6h window (moved back 317 s) 21-56 ms against 2-3 ms. Since 2026-11-25 the
  names-only /labels listing answers those pieces from the hour that holds
  them (semantics/label-inventory-exact-and-incremental): 2.7-12 calls and
  70-94 listed minutes per moved 24h request, depending on where its ends
  sit in their hours (12 near now, where the right end of the first moved
  window lies in an hour that ended less than an hour ago and is read as
  before), and 3 calls and 60 minutes for a refresh across an hour boundary,
  instead of 19 calls and 120 minutes each; first loads unchanged
  (BenchmarkLabelsShiftedWindow, decision
  labels-names-only-ends-from-their-hours in data-probing-and-freshness).

  With the memory answers of semantics/label-inventory-exact-and-incremental
  (2026-11-25, decision labels-memory-answers-at-loki-granularity) the moved
  windows of this shape make no VictoriaLogs call on the request path. On
  the e2e stack (Loki 3.7.10 aligned profile, VictoriaLogs v1.54, data of
  2026-11-24/25), timed per request with interleaved targets over three
  rounds, the warm p50 was 0.50-0.55 ms (1h), 0.50-0.52 ms (6h) and
  0.26-0.63 ms (24h) against Loki's 1.31-2.50, 1.32-1.40 and 1.08-1.64 ms and
  base's 28.8-42.7, 22.3-23.9 and 0.3-119.6 ms (base's low 24h figures are
  response cache hits of windows an earlier round asked).

  Implemented in internal/proxy/metadata_inventory.go (the bucketed
  inventory, coverFinePieces) and internal/proxy/label_metadata.go
  (warmMetadataCacheOnStartup, warmLabelWindows, labelKeepWarmSchedule).
request:
  method: GET
  path: /loki/api/v1/labels
  params:
    start: now-7d
    end: now
  headers:
    X-Scope-OrgID: "0"
  precondition: |
    A replica that has answered or warmed the 7-day preset once, then windows
    moved past the response cache's time bucket (what Grafana refreshes
    send) and windows no request asked for before.
  verify:
    blocked_by: moved_window
    reason: "asks with windows moved past the response cache bucket, timed"
compare:
  mode: exact
  fields: [status, data]
  expect: |
    The same label names and values as one full-range listing; a window
    moved by seconds or by minutes reads only its edges and the buckets
    nobody has cached from VictoriaLogs (bench/ab set metadata-inventory:
    refresh shapes over 1h-7d answer in well under a second, never-queried
    windows inside the warmed range close to that).
loki_parity: |
  Loki's /labels and /label/{name}/values read the index, so their latency does not depend on the range; the proxy
  matches the answer exactly and gets the latency close for every window
  inside what it has scanned once.
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: true
  locked_since: '2026-10-27'
  effort_exception: null
