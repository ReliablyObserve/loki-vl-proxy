id: semantics/error-layer-internal-go-text
title: A tail stream that breaks after the upgrade closes with Loki's error, not a bare disconnect or Go reader wording (fixed)
pending: true
proves:
  - status-500
  - status-502
consumer: any
why: |
  Loki's client text for a failed call is its own
  (pkg/util/server/error.go:124-128). The error layer now answers truncated,
  malformed and oversized VictoriaLogs bodies with Loki's 500 text on every
  HTTP route; the decoder or scanner error (`unexpected EOF`, `invalid
  character ...`, `scanning VL response: ...`) goes to the log line only.
  The proxy's own 500s that wrote an error's text go through the error layer
  too: a multi-tenant merge that cannot decode a tenant's answer (`failed to
  merge multi-tenant response: invalid character ...`), the merge of a
  binary aggregation's split halves, and the tenant limits YAML encoder
  (`/config/tenant/v1/limits`, which keeps http.Error's shape) answer
  `Internal Server Error`, or the limit text naming its flag. No cell remains
  (3 before). A native tail whose VictoriaLogs stream breaks, ends or carries
  a line above the scanner's cap after the websocket upgrade used to drop the
  connection without a close frame, so clients saw their library's
  `unexpected EOF`; it now closes with 1011 and `Internal Server Error`. The
  polling tail ends the same way when a poll fails or its body is not JSON.
  A failure a retry can fix (the stream ends or breaks, a poll fails) closes
  the tail only once -tail.backend-retry-window (30s) is spent; a body that
  is not JSON and a line above the scanner's cap close it at once
  (semantics/tail-survives-backend-outage).
request:
  scope: internal
  entry: lokiClientError, (*Proxy).writeErr, writeBackendError, writeGrafanaStatsFailure
  setup: |
    TestErrorLayer_NoVictoriaLogsLeak: a fake VictoriaLogs (and ruler) that fails
    every call in one of 14 modes (VictoriaLogs 400 parse and memory-limit
    errors, 422, 500, a 502/503 from a proxy in front, 429 queue full,
    connection refused and reset, a reply after -backend-timeout, a client
    cancellation, a 200 body cut off mid-stream, a malformed 200 body, a valid
    body above -backend-max-buffered-response-bytes), driven through 21 client
    routes (query_range log, sliding rate, stats, Drilldown stats, unwrap
    rate_counter, json; query; series; labels; label values; detected_fields,
    detected_field values, detected_labels; index stats, volume, volume_range,
    Drilldown volume_range; patterns; tail; rules; alerts). The cells that
    fail this class are listed in conformance/registry/error-layer-known-leaks.json.
    TestCompat_ErrorLayerLikeLoki repeats the main modes against the stack's
    VictoriaLogs through a fault-injecting forwarder and compares with Loki.
compare:
  mode: exact
  fields: [status, errorType, body, headers]
  expect: |
    No Go decoder, scanner or reader wording; Loki's 500.
gap:
  status: fixed
  fixed_by: TBD-PR
  impact: explore-visible
  visual: none
  visual_reason: 'A tail whose VictoriaLogs call fails ends in a websocket close frame, which needs a failing backend and no Grafana panel renders; the gate and the tail failure-mode test assert the close frame.'
  effort: S
  area: 'internal/proxy/http_utils.go writeError (map unknown errors to one Loki text); internal/proxy/tail.go forwardNativeTail, streamSyntheticTail'
  loki: 'pkg/util/server/error.go:124-128'
  proxy: 'tail: a stream end or failed poll that outlasts -tail.backend-retry-window, a malformed body and an oversize line close 1011 with the error layer text (closeTailWithError)'
  planned_test: 'TestErrorLayer_NoVictoriaLogsLeak (internal/proxy) and TestCompat_ErrorLayerLikeLoki (test/e2e-compat, group core)'
