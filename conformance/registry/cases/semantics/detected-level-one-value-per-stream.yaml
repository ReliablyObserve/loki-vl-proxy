id: semantics/detected-level-one-value-per-stream
title: "Every metric series built from one stream carries the same detected_level, the stream's normalised level, whatever the query type or step, as Loki does (fixed)"
pending: true
proves:
  - metric-series-identity
  - severity-detected-level-derivation
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  Loki derives detected_level when a line is ingested, and a stream whose own
  fields hold a level gives every line one value: the first level key Loki
  reads (level, LEVEL, Level, log.level, severity, ..., lvl), normalised (live
  Loki answers level="Debug" with debug, normalises Warning to warn and ERR to
  error, and keeps lvl="x" as x: testdata/detected_level_golden.json). Every
  metric series built from that stream carries that value.

  The proxy builds those series on several paths. Plain range functions carry
  the detected_level that VictoriaLogs computes with the chain the proxy sends.
  VictoriaLogs v1.49.0 and v1.53.0 (their own storage and engine) answer error,
  error, warn, x, debug and fatal for streams labelled level="ERROR",
  severity="error", LEVEL="warning", lvl="x", level="Debug" and
  Severity="fatal" (testdata/detected_level_vl_chain_answers.json). Those paths
  were right already; an emulator that read only the level field made them
  look wrong in unit tests.

  The proxy-side paths copied the level label as stored and read no other
  level key:
  - the bare-parser stats read by stream (`count_over_time({...} | logfmt [5m])`
    and `sort(rate({...} | json [1m]))` on query_range);
  - the raw-row reads (`rate({...} | json [1m])`, an instant `| logfmt` count);
  - the stats answers relabelled by stream (an unwrap at a step the range
    divides, `sum without (pod) (rate({...} | json amount | unwrap amount [5m]))`
    at step 300).
  So a stream labelled level="ERROR" said ERROR there and error on the chain
  paths. A stream labelled severity, LEVEL or lvl had no detected_level label
  at all there (the "no detected_level at all" answer of `sort(rate(... | json
  [1m]))` at step 60 is this case; a stream with level="error" was right).

  Fixed: those paths take detected_level from the stream's level fields, else
  from the row's level field, normalised (ensureStreamDetectedLevel,
  streamDetectedLevel; the order of the log read path's deriveRowLevel). The level label keeps its stored value, as in Loki. A
  present detected_level is kept. The LogsQL sent and the VictoriaLogs calls
  do not change. Answers cached before the fix are fenced
  (@stream-level-series-v2, then v3 below, which also covers every metric query with a
  parser stage).

  Two more paths read the stored level ahead of the stream (2026-11-15, live
  Loki 3.7.9: a stream labelled severity="error" whose lines carry structured
  metadata level="debug" is error, the stream label first, then structured
  metadata, then the body; level="ERROR" over a JSON body is error):
  - the chain VictoriaLogs runs (every chain-served metric query, the
    `| detected_level` filters) read its level fields by name, stored and
    stream fields alike, so level="debug" won over the stream's severity and
    the series said debug. One pipe now marks the rows whose stream holds a
    level field (`format if ({level!=""} OR ...) "1" as __dl_t`, one stream
    per block), and on those rows each pick reads its field only from the
    stream (`(-__dl_t:* OR {f!=""})`); only where two or more level names are
    known, so a presence of one sends the chain unchanged. VictoriaLogs v1.49.0 and v1.53.0 answer
    error for that row and Loki's value for every recorded row, and every
    text survives their clone (testdata/detected_level_vl_chain_answers.json,
    TestPlanTextsSurviveVictoriaLogsClone). Fenced: @stream-level-series-v3
    now covers every metric query and every query naming detected_level.
  - the raw-row reads (`sum without (pod) (rate({...} | json amount | unwrap
    amount [5m]))` at an instant and step 60, `sort(rate({...} | json [1m]))`
    at an instant and step 300) copied the row's level field into
    detected_level. VictoriaLogs answers a raw row with the stream fields as
    fields, so a stream labelled level="ERROR" said ERROR (Debug for
    level="Debug"), and a stream label lost to a stored level. They now take
    the stream's level fields first, then the row's level field, normalised.

  The sweep of 14 query types x instant, step 60 and step 300 x 12 streams
  (TestDetectedLevelSweepMatchesLoki, Loki engine answers recorded, the proxy
  over VictoriaLogs v1.49.0 and v1.53.0 themselves; status, error text,
  which queries answer series and the detected_level of each): 403 of 504
  rows equal to Loki on each version (origin/main 306, this change before the
  two paths 382), no row equal before and different now, and no series with
  another detected_level than Loki's.

  Not covered:
  - a stream with no level field read by a per-stream stats read: Loki
    decides per line from the body or structured metadata, which a series per
    stream cannot split; those series carry no detected_level
    (semantics/detected-level-stream-stats-without-level, open).
  - `sort(rate({...} | json [1m]))` over lines that are not JSON answers 200
    where Loki answers its JSONParserErr 400 (an error-path change of its own).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sort(rate({service_name="payment-service"} | json [1m]))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series]
  expect: "Every series carries the detected_level of its stream (error, info), as Loki answers, and the same value as count_over_time and rate of the same streams."
gap:
  status: fixed
  fixed_by: TBD-PR
  impact: explore-visible
  effort: S
  area: "internal/proxy ensureStreamDetectedLevel (fetchBareParserStatsBuckets, logQueryStreamDescriptorMiss, levelGroupingRequest.apply), buildMetricSeriesEntry (raw-row reads); internal/translate storedLevelPicks and internal/queryplan/lower levelChainPipes (the chain)"
  loki: "one detected_level per stream, normalised, on every query type"
  proxy: "the same: the stream's level fields, else the row's level field, normalised; the chain reads the stream's level fields first"
  planned_test: 'TestDetectedLevelSweepMatchesLoki (internal/proxy, 14 query types x 3 forms x 12 streams against recorded Loki engine answers; LVP_RUN_ORACLES=1 also over VictoriaLogs v1.49.0 and v1.53.0), TestOneDetectedLevelPerStreamAcrossQueryTypes (internal/proxy, 13 query types at an instant and steps 60 and 300, VictoriaLogs v1.49.0 and v1.53.0), TestVLChainDetectedLevelMatchesVictoriaLogs (recorded VictoriaLogs answers), TestStreamLevelPickFields, TestDetectedLevelChainReadsStreamFieldsFirst, TestEnsureStreamDetectedLevelEdges, TestLevelGroupingApplyStreamRule, TestStreamLevelOneValueFence, TestStreamLevelSeriesFenceCoversParserShapes, FuzzEnsureStreamDetectedLevel'
  visual: none
  visual_reason: 'a label value of a series in Explore; the label sets are compared in the tests and by the per-case verifier'
  clusters: []
