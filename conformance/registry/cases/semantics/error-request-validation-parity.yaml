id: semantics/error-request-validation-parity
title: "Requests Loki rejects are answered 200, or with other wording, by the proxy (open: methods, routes, format_query, the unrecorded order of some parameter checks)"
pending: true
proves:
  - loki_api_v1_query_range
  - status-400
consumer: any
why: |
  The error body shape is Loki's on every route (semantics/error-layer-body-shape).
  A route-by-route capture against Loki v3.7.9 found requests Loki rejects
  that the proxy does not, or rejects with different text. Measured on the
  e2e data with the same request sent to both:
  Request parameters (fixed except for what is listed below):
  Loki checks the parameters of a read request before it looks at the query's
  pipeline, its limits' answers or its storage, and answers the first invalid one
  with a fixed 400. The proxy forwarded most of them to VictoriaLogs (which
  answered `failed to parse the log query`), accepted others (`step=0`, `limit=abc`,
  `direction=bad`, an end before the start, `since=abc`, a range over
  max_query_length on the volume, patterns' and detected-field routes) and
  answered a bad `start` with its own text.

  Loki's answers to 666 requests are recorded over HTTP (Loki 3.7.9:
  internal/proxy/testdata/loki_request_param_answers.jsonl), and
  TestRequestParamAnswers replays every comparable row against the proxy: the
  status, Content-Type, X-Content-Type-Options and text of each rejection byte for
  byte, and that each request Loki accepts is accepted. The rows cover every
  parameter of every route with valid and invalid values, and the pairs of errors
  that show which check Loki makes first.

  What each route checks is what a recorded row shows (TestEveryParamCheckIsRecorded):
  start, end, time and since, step and interval, limit, direction, aggregateBy and
  delay_for; an end before the start (an equal end is served); the 11,000-point
  resolution; max_query_length. Where Loki accepts every form (limit on series,
  labels and patterns, step and interval on the instant query, end before start on
  labels, label values, series and patterns) the proxy accepts it. A start, end or
  time is read as Loki reads it (an integer of up to ten characters is seconds, a
  longer one nanoseconds, a decimal point means float seconds, anything else RFC
  3339, no trimming), which makes `now` and `now-1h` invalid, as in Loki. The text
  of a number that does not parse is the standard library's own error for the raw
  value (internal/lokierr builds it from the *strconv.NumError of the same parse).
  `since` sets the window of a request without a start, and the query statistics
  report that window (they were zero).

  Recorded order, checked by a row for each pair: on query_range end, then start,
  then limit, then step (step, limit and direction before the query's syntax); on
  the instant query limit, then direction, then time, then the query's syntax;
  max_query_length after the 11,000-point resolution, and after the query's syntax
  on query_range but before the selector on the metadata routes; on tail the
  query's syntax first, then the parameters.

  Not recorded, so not asserted as Loki's (the proxy keeps the order listed in
  internal/proxy/request_params.go): since against end, start and limit; direction
  against step and interval; the instant query's time against its direction; tail's
  limit, delay_for, end and start among themselves; max_query_length against limit;
  the volume routes' aggregateBy against limit. `since` is not checked on
  detected_labels and detected_field/{name}/values, and the 11,000-point
  resolution not on detected_fields, because no recorded row sends them there.

  Still different, listed in requestParamKnownDifferences
  (internal/proxy/request_params_test.go): an integer time of 11 to 18 digits is
  read by the rest of the proxy by its magnitude (milliseconds, microseconds)
  where Loki reads nanoseconds (so a metric `query` with `time=32503680000` is
  refused with the proxy's out-of-range 400 where Loki answers 200); a log query
  whose stage does not compile is reported with its parse error before the
  parameters on tail, where Loki reports it after them (the parser has to say
  which phase rejected the query); max_entries_limit_per_query (the recorded Loki
  has none; the proxy's default is 10000).

  Still open here: any HTTP method is served where Loki's router
  answers 405 with no body; format_query echoes its query instead of
  parsing it (Loki: 400 `{"status":"invalid-query","error":...}` as
  application/json); the rules API accepts `type=xyz` (Loki: 400 `not
  supported value "xyz"`). The success
  bodies of rules, alerts and buildinfo also differ from Loki's.
  Delete (pkg/loki/modules.go:1936-1938): Loki serves PUT and POST (create),
  GET (list) and DELETE (cancel); the proxy implements the create and answers
  GET and DELETE with a bodyless 405. Ruler cancel and deadline are Loki's
  500 `server_error` with Go's `context canceled`; the proxy answers the 500
  with its own cancel and deadline texts. The legacy rule views' store failure
  and empty answer are their own rows (semantics/ruler-store-failure-status,
  semantics/ruler-empty-list-status).
  Loki's answers to these requests are recorded over HTTP, one row per Loki
  error class and route (internal/lokierr/testdata/loki_error_answers.jsonl).
  internal/lokierr renders each recorded message byte for byte from typed
  inputs (TestConstructorsRenderLokiRecordedAnswers), and
  TestLokiErrorAnswersReplay replays every row against the proxy; the rows
  that still differ are listed in
  conformance/registry/error-layer-known-differences.json, which may only
  shrink. The tenant rows were recorded with Loki's auth disabled and are
  not compared yet.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{app="api-gateway"}'
    start: 'now-1h'
    end: 'now'
    step: '0'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [status, headers, body]
  expect: |
    Loki's status, Content-Type and text.
gap:
  status: open
  impact: api-only
  effort: M
  area: 'internal/proxy request validation per route (query_range_steps, patterns, label_handlers, volume, tail, alerting) and routeHandler method checks'
  loki: 'pkg/querier/queryrange/queryrangebase/query_range.go and pkg/loghttp/params.go parameter parsing; pkg/loki/modules.go Methods("GET","POST") routes'
  proxy: '200 with data, or a different message'
  planned_test: 'TestRequestParamAnswers (replay of 666 recorded parameter rows), FuzzRequestParamChecks (the checks against a model of the recorded rules) and TestLokiErrorAnswersReplay (internal/proxy); TestCompat_ErrorBodyLikeLoki exact parameter rows (test/e2e-compat, group core)'
