id: semantics/without-comparison-inside-ignored
title: sum without over a range function filtered by a comparison inside the aggregation ignores the filter (open)
proves:
  - metric-series-identity
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  `sum without (pod) (rate({app="payment-service"} | logfmt | unwrap amount [5m]) > 0.33)`
  filters the series of the inner vector before the sum on Loki: a series that is
  not above 0.33 is not summed. The proxy sums every series: on the fixture, query_range
  {ns=x} = 0.813333,1.06,1.23333 and {ns=y} = 0.92,1.41333,1.5 against Loki's
  {ns=x} = 0.333333 (the only pod above 0.33, at the last step) and {ns=y} =
  1.41333,1.5; at an instant {ns=x} = 1.23333 against 0.333333, {ns=y} = 1.5 on
  both. With `max_over_time` and a threshold of 35 at an instant, {ns=x} = 138
  against Loki's 36 (only the pod valued 36 passes) and {ns=y} = 154 on both. The translation drops the comparison: the inner expression it translates
  ends at the range aggregation. A comparison around the aggregation
  (`sum without (pod) (...) > 0.33`) is answered by the binary route and is right.
  Measured through the handlers on emulated VictoriaLogs v1.52.0 over 8 streams (ns x and y, pods a to d) and 40 lines (TestWithoutShapesStillDifferFromLoki, internal/proxy); Loki's answer is computed from the same rows with the evaluator of Loki v3.7.7 and was not run against a Loki here. On origin/main query_range answers the same; at an instant main answers one series `{}` (2.73333 for the rate form, 292 for `max_over_time` with the threshold 35) where this branch folds per ns without the filter ({ns=x} = 138 against Loki's 36, {ns=y} = 154 on both). Also pinned: a comparison around the aggregation drops the series on query_range for max_over_time, min_over_time, sum_over_time and rate (TestWithoutComparisonAboveEveryValueDropsEverySeries). Found while fixing semantics/unwrap-sum-without-collapses.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum without (pod) (rate({app="payment-service"} | logfmt | unwrap amount [5m]) > 0.33)'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, values]
  expect: |
    Only the series above the threshold are summed.
gap:
  status: open
  impact: explore-visible
  effort: M
  area: 'internal/translator tryTranslateMetricQueryWithout (the comparison after the range aggregation is dropped)'
  loki: 'pkg/logql/evaluator.go:451-466 VectorAggEvaluator.Next over the filtered vector of the comparison (vectorBinop)'
  proxy: 'every series of the range aggregation is summed; the filter is not applied'
  planned_test: 'TestWithoutShapesStillDifferFromLoki (internal/proxy, rate with the threshold, range and instant); an e2e test vs Loki in group semantics when fixed'
  note: 'Related: semantics/unwrap-sum-without-collapses (fixed).'
  clusters: []
