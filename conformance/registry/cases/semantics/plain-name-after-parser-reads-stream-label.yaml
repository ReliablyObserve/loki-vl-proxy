id: semantics/plain-name-after-parser-reads-stream-label
title: A filter or grouping on a name a parser also reads reads the parsed value; Loki reads the stream label (fixed)
proves:
  - parser-error-and-label-collision
  - loki_api_v1_query_range
consumer: explore
why: |
  After `| json`, a key named like a stream label is renamed `name_extracted`
  and `name` still reads the stream label (LabelsBuilder.getWithCategory,
  pkg/logql/log/labels.go:293-307, falls through to the stream label because
  the parsed one was renamed). VictoriaLogs' unpack_json overwrote the stored
  field `name` with the line's value, so `| json | level="debug"` filters on
  the parsed value: on a stream with level="info" and a JSON line holding
  "level":"debug", Loki returns no line and the proxy returns that line (seen
  on the e2e fixture of TestCompat_ExtractedSuffixOnParsedCollision, 2026-10).
  Grouping by the plain name (`sum by (level) (... | logfmt ...)`) groups by
  the parsed value where Loki has the stream label's.

  Reading the stream label for every parsed name would put a _stream lookup in
  front of every filter and grouping and stop the Drilldown fast paths that
  recognise the plain `| unpack_json | filter f:!""` shape. The proxy instead
  reads it only for a name that is a stream label of the tenant (the recent
  stream_field_names listing, cached) and that the query names after a parser.
  The stored value is copied aside before the first parser stage. A metric
  query puts it back into the field after each parser stage (metric results
  carry no entry labels); a log query filters a scratch field holding the
  stored value, or the parsed one when the entry has none, and leaves the
  stored field the parsed value the response exposes as name_extracted.

  Corpus evidence: differential run clusters 08fb5da3, 19e8f424, 35e2a101 and
  d650bcfb, 6 queries, all `sum by (level) (... | logfmt ...)` where Loki
  groups by the stream's level (info) and the proxy by the parsed one (warn);
  they were counted under semantics/extracted-suffix-collision before.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{app="x",level="info"} | json | level="debug"'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [streams.values]
  expect: |
    No line where only the parsed `level` is debug (the stream label's level is info).
gap:
  status: fixed
  fixed_by: "#676"
  impact: explore-visible
  effort: M
  area: 'internal/translator label filter and stats grouping after json / logfmt (stored field overwritten by unpack_*)'
  loki: 'pkg/logql/log/labels.go:293-307 LabelsBuilder.getWithCategory (stream label read once the parsed one was renamed)'
  proxy: 'the parsed value of a key named like a stream label'
  planned_test: 'TestCompat_PlainNameAfterParserReadsStreamLabel (test/e2e-compat, group core); translator TestPlainStreamLabel_*; proxy TestPlainStreamLabel_*'
  note: |
    Fixed for filters (=, !=, =~, !~, !="", and/or chains) after json, logfmt, regexp and pattern, for
    metric grouping (by, without), unwrap and the stages after the parser, for label_format sources and
    {{.name}} templates and a line_format a later stage reads (log queries read a scratch field), and for
    line_format the proxy renders from the entry's labels, over the buffered, streamed and windowed paths
    in both encodings. The tenant's stream label names are the last known ones from a background refresh
    that never delays a query: a query runs the plain translation until the first refresh has finished,
    and a new stream label is picked up within a minute. Not changed: a stream label no listing of the
    last hour has, a label VictoriaLogs stores under another name (dotted OTel attributes), service_name,
    structured metadata named like the parsed key, a json extraction-list expression that targets the
    name (`| json level="a.b"`), a second parser in a log query (semantics/two-parsers-keep-one), and
    bare drop/keep of the plain name in a log query and the `delete level` of `label_format x=level` that
    costs the entry its level_extracted (semantics/drop-keep-plain-name-after-parser), a same-stage
    `label_format x="{{.level}}", level="z"` and template functions (`{{ .level | ToUpper }}`).
  clusters:
    - 08fb5da3
    - 19e8f424
    - 35e2a101
    - d650bcfb
