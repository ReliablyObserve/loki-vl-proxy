id: semantics/eager-pipeline-validation
title: Invalid pipeline stages fail with 400 regardless of data; Loki answers 200 empty over a range with no data (documented)
proves:
  - loki-compatible-profile
consumer: api
evidence: needs recording
why: |
  Loki answers a pipeline stage it refuses to build (an invalid json or logfmt expression, a line_format or
  label_format template, a line filter regex or pattern, an ip() argument) with its 400 over a window ending 150
  minutes or less before now, whatever the window holds, a selector no stream matches and a line filter no line
  passes included. Over a window ending 165 minutes or more back, where Loki held no line, it answers 200 with an
  empty result, past the retention too (recorded from a Loki that serves data:
  internal/lokierr/testdata/loki_build_phase.jsonl, semantics/loki-build-phase-window). Not recorded yet: an old
  window whose store holds lines of the selector. The proxy reports the build error after Loki's other checks
  (semantics/loki-error-phase-order) and answers its 400 over any window (KNOWN_ISSUES).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{service_name="api-gateway"} | line_format "{{.a"'
    start: 'now-30d'
    end: 'now-29d'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [status]
  expect: |
    200 empty over a window ending 165 minutes or more back that holds no line; 400 over a recent window.
gap:
  status: documented
  impact: edge
  effort: S
  area: 'internal/logql semantic.go semanticPass (the build phase), internal/proxy validateQueryPhases'
  loki: '400 over a window ending 150 minutes or less back; 200 empty over an older empty window'
  proxy: '400 over any window, after the request, parse and tree checks'
  planned_test: 'TestCompat_EagerValidationEmptyRange (test/e2e-compat, group semantics)'
  clusters: []
