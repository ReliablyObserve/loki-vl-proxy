id: semantics/unary-plus-literal-rejected
title: "A number literal with a leading plus (`+1`, `+ 1`) is rejected where Loki accepts it (open)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  The Loki oracle accepts `+1` and `+ 1`. The proxy answers "parse error at line 1, col 1: syntax error: unexpected +". `+Inf` is a different case: both reject, with different text
  (semantics/parse-error-text-parity).

  Found by the grammar sweep (internal/querycorpus TestGrammarSweep, answers recorded with the Loki oracle, Loki 3.7.9, and the VictoriaLogs oracle, v1.49.0 and v1.53.0; conformance/registry/grammar-sweep.json holds the queries of each class). The sweep compares the proxy's validation and plan with Loki's parser and tree, and the texts the plan and the translator write with VictoriaLogs' parser; it sends no HTTP request, so what a client receives is for the e2e proof to confirm when the case is promoted.
request:
  scope: query-grammar
  entry: "TestGrammarSweep (internal/querycorpus): the class of conformance/registry/grammar-sweep.json cased semantics/unary-plus-literal-rejected"
  setup: "Send as the query of /loki/api/v1/query_range (start now-15m, end now, step 60s): +1 . The query is kept out of the plan corpus while the difference is open (the plan ratchets count the corpus rows); promote it to an HTTP request with the e2e proof when it is fixed."
compare:
  mode: observed
  fields: [status, error_text]
  expect: "Loki's answer for a literal query."
gap:
  status: open
  impact: edge
  effort: S
  area: "internal/logql parser (unary plus)"
  loki: "accepted"
  proxy: "syntax error at +"
  planned_test: 'TestGrammarSweep (internal/querycorpus: the class of conformance/registry/grammar-sweep.json that names this case holds the queries; it shrinks as the proxy follows Loki)'
  visual: none
  visual_reason: 'a grammar corner no Grafana panel sends, found by the grammar sweep'
  clusters: []
