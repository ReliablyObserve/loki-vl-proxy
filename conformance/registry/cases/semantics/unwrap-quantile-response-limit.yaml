id: semantics/unwrap-quantile-response-limit
title: quantile_over_time over a JSON unwrap fails at the manual metric response limit from 6 hours (open)
proves:
  - loki_api_v1_query_range
consumer: explore
why: |
  `quantile_over_time(0.95, {service_name="api-gateway"} | json | unwrap duration_ms [1m]) by (service_name)`
  answers on Loki 3.7.7 at 6h, 24h and 7d. The proxy evaluates quantiles from
  raw rows and answers 502 `manual metric response exceeds 67108864 bytes;
  narrow the query` from 6h on generator data (bench/ab set
  unwrap-conversion-error, shape E2), on main and with the unwrap
  conversion-error change alike.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'quantile_over_time(0.95, {service_name="api-gateway"} | json | unwrap duration_ms [1m]) by (service_name)'
    start: 'now-6h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [status, series]
  expect: |
    HTTP 200 with Loki's series.
gap:
  status: open
  impact: explore-visible
  effort: L
  area: 'internal/proxy raw-row quantile evaluator (manual metric response cap)'
  loki: 'pkg/logql/range_vector.go:449-487 quantileOverTime, Quantile (sorted samples of the window, linear interpolation at rank phi*(n-1)); :804-816 QuantileOverTime'
  proxy: '502 at the manual metric response limit (range_metric_compat.go collectRangeMetricSamples reads every raw row; checkManualMetricRead)'
  planned_test: 'TestUnwrapQuantileResponseLimit (internal/proxy, skipped while open; LVP_OPEN_GAP_TESTS=1 reproduces the 502); bench/ab set unwrap-conversion-error E2 at 6h/24h/7d'
  note: |
    VictoriaLogs' quantile stats function is not a drop-in: it returns the
    sorted value at index int(phi*n) with no interpolation (Loki interpolates
    at phi*(n-1)), it keeps a random 10,000-value reservoir per shard above
    that, and a quantile of buckets cannot be combined into a sliding window.
    Same code from v1.24 (VictoriaMetrics repo) through v1.50.0.
  clusters: []
