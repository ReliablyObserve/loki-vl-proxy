id: semantics/binary-literal-operation-folded-in-loki
title: "Loki folds a binary operation of two literals into a literal; the query plan keeps a binary operation (open)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  The Loki oracle (facts command) shows no binary operation in the tree of `0 / 0`, `1 + 2` or `1 + 2 / on (a, b) 0`: Loki evaluates a binary operation of literals while it parses,
  and keeps a literal (NaN or +Inf for a division by zero). The proxy's plan keeps a BinOp with its operator and modifiers. The answers agree where the proxy evaluates the literals itself; the tree differs, which
  matters to every attribute derived from the tree (a set operation with a folded literal operand is an error in Loki: semantics/set-operation-folded-literal-operand).

  Found by the grammar sweep (internal/querycorpus TestGrammarSweep, answers recorded with the Loki oracle, Loki 3.7.9, and the VictoriaLogs oracle, v1.49.0 and v1.53.0; conformance/registry/grammar-sweep.json holds the queries of each class). The sweep compares the proxy's validation and plan with Loki's parser and tree, and the texts the plan and the translator write with VictoriaLogs' parser; it sends no HTTP request, so what a client receives is for the e2e proof to confirm when the case is promoted.
request:
  scope: query-grammar
  entry: "TestGrammarSweep (internal/querycorpus): the class of conformance/registry/grammar-sweep.json cased semantics/binary-literal-operation-folded-in-loki"
  setup: "Send as the query of /loki/api/v1/query_range (start now-15m, end now, step 60s): 1 + 2 / on (a, b) 0 . The query is kept out of the plan corpus while the difference is open (the plan ratchets count the corpus rows); promote it to an HTTP request with the e2e proof when it is fixed."
compare:
  mode: observed
  fields: [status, error_text]
  expect: "The same literal as Loki's, with no binary operation left in the plan."
gap:
  status: open
  impact: edge
  effort: S
  area: "internal/queryplan Build (binary operation of two literals)"
  loki: "a literal"
  proxy: "a binary operation node"
  planned_test: 'TestGrammarSweep (internal/querycorpus: the class of conformance/registry/grammar-sweep.json that names this case holds the queries; it shrinks as the proxy follows Loki)'
  visual: none
  visual_reason: 'a grammar corner no Grafana panel sends, found by the grammar sweep'
  clusters: []
