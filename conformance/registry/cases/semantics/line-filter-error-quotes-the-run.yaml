id: semantics/line-filter-error-quotes-the-run
title: A line filter error quotes the line filter alone where Loki quotes the run it builds together (open)
pending: true
proves:
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: api
why: |
  Loki builds the line filters of a pipeline together: the adjacent ones, and
  those after a parser up to the next label filter, are one stage. Its error
  for an invalid regexp (`|~ "("`), ip() pattern or pattern line filter quotes
  that whole run and reports its last invalid filter first:
  `{app="x"} |= "x" |~ "("` answers `parse error : stage '|= "x" |~ "("' :
  error parsing regexp: missing closing ): `(``, `{app="x"} |~ "(" |~ "["`
  reports the `[`, and `{app="a"} |~ "(" | json |~ "["` quotes
  `'|~ "(" |~ "["'` (stack and Loki oracle pipeline command, Loki 3.7,
  2026-11-09). The proxy rejects the same queries with the same status but
  quotes the failing filter alone, the first one: `stage '|~ "("'`.

  The status always agrees; only the quoted stage and, with two invalid
  filters, which one is named differ. 46 queries of the pattern line filter
  grid (TestPatternLineFilterValidationMatchesLoki) differ this way, a count
  that may only fall.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{app="x"} |= "x" |~ "("'
    start: 'now-15m'
    end: 'now'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [status, error_text]
  expect: |
    400 with Loki's text, which quotes the run `|= "x" |~ "("`.
gap:
  status: open
  impact: api-only
  effort: M
  area: 'internal/logql semantic.go validateLogQuerySemantics (each line filter stage is validated alone)'
  loki: 'line filters built as runs (adjacent, and across parsers up to a label filter), checked from the last'
  proxy: 'each line filter validated alone, in order, quoting itself'
  planned_test: 'TestPatternLineFilterValidationMatchesLoki run-text ratchet (internal/logql); e2e vs Loki for |~ runs'
  clusters: []
