id: semantics/line-filter-or-alternatives
title: Line filters with `or` alternatives match like Loki
proves:
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki 3 accepts `|= "a" or "b"` and `!= "foo" or "bar"` (and `or ip(...)`) as
  one line filter with alternatives: any alternative matches for |=, |~ and |>,
  none may match for !=, !~ and !> (Loki turns a negated chain into one filter
  per alternative), an `ip(...)` alternative is plain text under |=, |~ and |>,
  and an alternative that matches every line is dropped from a positive chain.
  The proxy parses and validates the chains like Loki and sends VictoriaLogs one
  regexp per chain.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{namespace="prod"} |= "error" or "timeout"'
    start: 'now-15m'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [status, streams.values]
  expect: |
    Lines holding either string; Loki's error for a malformed chain.
gap:
  status: fixed
  fixed_by: "#669"
  impact: explore-visible
  effort: S
  area: 'internal/logql/ip_filter.go, internal/logql/stage_validate.go, internal/translator/translator.go (orLineFilter)'
  loki: 'pkg/logql/syntax/ast.go:473 newOrLineFilterExpr'
  proxy: 'parsed like syntax.y orFilter; translated to one regexp per chain'
  planned_test: 'TestCompat_LineFilterOrAlternatives (test/e2e-compat, group core)'
  clusters:
    - 147e07fb
    - 435e2f3c
    - 9d69befe
    - b349505b
    - c061fca0
    - dfe987e7
