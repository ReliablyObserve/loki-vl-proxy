id: semantics/drop-keep-matcher-ip-value-accepted
title: "`| drop a != ip(\"...\")` and `| keep a != ip(\"...\")`: Loki takes a string after the matcher, the proxy accepts ip() (open)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  A drop or keep matcher compares a label with a string. The Loki oracle answers "parse error at line 1, col 21: syntax error: unexpected ip, expecting STRING" for `{a="b"} | drop a != ip("10.0.0.0/8")`.
  The proxy's validation accepts it and both the plan and the translator write the query without the drop (`a:="b"`).

  Found by the grammar sweep (internal/querycorpus TestGrammarSweep, answers recorded with the Loki oracle, Loki 3.7.9, and the VictoriaLogs oracle, v1.49.0 and v1.53.0; conformance/registry/grammar-sweep.json holds the queries of each class). The sweep compares the proxy's validation and plan with Loki's parser and tree, and the texts the plan and the translator write with VictoriaLogs' parser; it sends no HTTP request, so what a client receives is for the e2e proof to confirm when the case is promoted.
request:
  scope: query-grammar
  entry: "TestGrammarSweep (internal/querycorpus): the class of conformance/registry/grammar-sweep.json cased semantics/drop-keep-matcher-ip-value-accepted"
  setup: "Send as the query of /loki/api/v1/query_range (start now-15m, end now, step 60s): {app=\"x\"} | drop a != ip(\"10.0.0.0/8\") . The query is kept out of the plan corpus while the difference is open (the plan ratchets count the corpus rows); promote it to an HTTP request with the e2e proof when it is fixed."
compare:
  mode: observed
  fields: [status, error_text]
  expect: "Loki's 400 syntax error at ip."
gap:
  status: open
  impact: api-only
  effort: S
  area: "internal/logql parser (drop and keep matchers)"
  loki: "string values only"
  proxy: "ip() accepted and dropped"
  planned_test: 'TestGrammarSweep (internal/querycorpus: the class of conformance/registry/grammar-sweep.json that names this case holds the queries; it shrinks as the proxy follows Loki)'
  visual: none
  visual_reason: 'a grammar corner no Grafana panel sends, found by the grammar sweep'
  clusters: []
