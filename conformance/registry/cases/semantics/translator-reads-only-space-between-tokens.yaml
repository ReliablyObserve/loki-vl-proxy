id: semantics/translator-reads-only-space-between-tokens
title: "The string translator reads only a space between tokens: a tab or newline fails the translation or gives VictoriaLogs a query it rejects (open)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  Loki's lexer reads a tab, a newline and a carriage return as white space. The proxy's validation accepts them too, but the string translator looks for `| unwrap` with a space: `quantile_over_time(0.5, {a="b"} |\tunwrap c [5m]) by (d)` fails with
  "quantile_over_time requires `| unwrap <field>` for range aggregation", `{a="b"}\t|\tline_format\t"{{.a}}"\t|\t...` gives VictoriaLogs v1.53.0 a text it rejects ("unexpected pipe name"), and
  `vector(1)\n+ 1` one with "compound token cannot start with". Loki accepts every one of them (Loki oracle, check command). The query plan reads the query as Loki does.

  Found by the grammar sweep (internal/querycorpus TestGrammarSweep, answers recorded with the Loki oracle, Loki 3.7.9, and the VictoriaLogs oracle, v1.49.0 and v1.53.0; conformance/registry/grammar-sweep.json holds the queries of each class). The sweep compares the proxy's validation and plan with Loki's parser and tree, and the texts the plan and the translator write with VictoriaLogs' parser; it sends no HTTP request, so what a client receives is for the e2e proof to confirm when the case is promoted.
request:
  scope: query-grammar
  entry: "TestGrammarSweep (internal/querycorpus): the class of conformance/registry/grammar-sweep.json cased semantics/translator-reads-only-space-between-tokens"
  setup: "Send as the query of /loki/api/v1/query_range (start now-15m, end now, step 60s): quantile_over_time(0.5, {app=\"x\"} |\tunwrap c [5m]) by (d) . The query is kept out of the plan corpus while the difference is open (the plan ratchets count the corpus rows); promote it to an HTTP request with the e2e proof when it is fixed."
compare:
  mode: observed
  fields: [status, error_text]
  expect: "The answer of the same query with spaces."
gap:
  status: open
  impact: api-only
  effort: M
  area: "internal/translator (frozen): closes when the plan serves the construct"
  loki: "any ASCII white space separates tokens"
  proxy: "the translator matches a single space; the failed translation answers Loki's fixed 500 Internal Server Error, with the translator's reason in the log line only"
  planned_test: 'TestGrammarSweep (internal/querycorpus: the class of conformance/registry/grammar-sweep.json that names this case holds the queries; it shrinks as the proxy follows Loki)'
  visual: none
  visual_reason: 'a grammar corner no Grafana panel sends, found by the grammar sweep'
  clusters: []
