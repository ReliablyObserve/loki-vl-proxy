id: semantics/translator-reads-only-space-between-tokens
title: "The string translator reads only a space between tokens: a tab or newline fails the translation or gives VictoriaLogs a query it rejects (open)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  Loki's lexer reads a tab, a newline and a carriage return as white space. The proxy's validation accepts them too, but the string translator looks for `| unwrap` with a space: `quantile_over_time(0.5, {a="b"} |\tunwrap c [5m]) by (d)` fails with
  "quantile_over_time requires `| unwrap <field>` for range aggregation", `{a="b"}\t|\tline_format\t"{{.a}}"\t|\t...` gives VictoriaLogs v1.53.0 a text it rejects ("unexpected pipe name"), and
  `vector(1)\n+ 1` one with "compound token cannot start with". Loki accepts every one of them (Loki oracle, check command). The query plan reads the query as Loki does.

  The same holds for a blank after a parser keyword or a stage name. `first_over_time({A="0"} | json<CR>A0 | unwrap A0 [5m])` (found by the metric flip gate's fuzz target, FuzzMetricFlipGate) is the same query as the spelling with a space: Loki's tree holds one json parser for both (Loki oracle, check command: the same expression, TestBlankAfterKeywordMatchesLoki, 828 recorded spellings). The string translator copies the text after `json`, `logfmt`, `regexp`, `pattern`, `unpack`, `label_format`, `line_format`, `drop`, `keep` or `unwrap` when it is not a space, and writes a pipe VictoriaLogs rejects:
    string translator  =>  A:="0" | json<CR>A0 | ...   (VictoriaLogs' parser, v1.53.0: unexpected pipe name "json")
    query plan         =>  A:="0" | unpack_json | ...   (the text both write for the spelling with a space)
  The proxy serves a log query and the metric constructs it flips from the plan, so for a tab, a line feed, a carriage return, a line break of two bytes or a run of them after any of those keywords a client gets the requests and the answer of the spaced spelling (TestBlankAfterKeywordRequestsEqualSpaced: 69 templates, six blank spellings each, on query_range for every template and on query for the metric ones; the request set of a metric keep varies from run to run for one spelling, so only its answer is compared). With `-query-plan-lowering=false` the string translator answers the log-query rows wrongly (TestBlankAfterKeywordRollbackFlagIsTheTranslatorsMisreading). The gate holds the translator to the text of the spaced spelling (a run of blanks outside quotes written as one space) and accepts, for a construct the plan leaves to the translator, the translator's own text and failure. The log flip gate (FuzzLogFlipGate, TestLogFlipGate_BlankBeforeParserExpression) holds log queries the same way. The VictoriaLogs oracle's typed-selector pairs do too (spelledAsTranslatorReads, TestTypedPairOfBlankSpellingIsTheSpacedOnes): the pairs were made on the text as sent, so the 115 blank spellings TestBlankAfterKeywordRequestsEqualSpaced puts in the query corpus read as typed filters that differ from the translator's on v1.49.0 and v1.53.0 and failed the PR quality gate wherever a base corpus was found to compare with. Its fuzz target found a tab between `{A="0"}|regexp` and a backquoted regexp. `{A="0"}|regexp<TAB>"(?<a>0)"` is Loki's spaced regexp parser (Loki oracle, pipeline and process commands: accepted, the same lines and labels as with a space) and is served from the plan as the spaced spelling's `extract_regexp "(?<a>0)"`, where the string translator copies `regexp<TAB>` and the expression as written. (The fuzz input's capture is named `0`; the label name of a capture with a leading digit, `_0` in Loki, is a separate open difference.)
  An unwrap with no parser before it (`max_over_time({A="0"} | unwrap<CR>A [1m])`), and any unwrap whose blanks around `| unwrap` are not one space or that follows its pipe with no space (`|unwrap n`), is served from the plan: the lowering reads the unwrapped label from the text with each run of those blanks outside quoted strings written as one space, so the query gets the requests and the answer of the spaced spelling where the string translator, which looks for `| unwrap ` with a space, failed with Loki's fixed 500 or, for `rate(... |<TAB>unwrap n [5m])`, read no unwrap and counted the lines (the table holds both spellings of the selector; TestUnwrapBlankUnderWrappersEqualsSpaced holds the requests and answers under topk, bottomk, sort, sort_desc, label_replace, a binary operation, a comparison, offset and an aggregation; TestUnwrapBlankSpellingsLowerAsSpaced in internal/queryplan/lower holds the lowered text for a range function, a vector aggregation, a quantile with a grouping, and a parser before the unwrap). The corpus shadows and both flip gates' fuzz targets (FuzzMetricFlipGate, FuzzLogFlipGate) hold the translator to the spaced spelling of such a query; every stage keyword (keep, drop, json, logfmt, regexp, pattern, unpack, decolorize, label_format, line_format) and a label filter after its pipe with each blank Loki skips, before or after the keyword, are the spaced query's requests and answer (TestKeywordBlankRequestsEqualSpaced, recorded Loki answers in TestKeywordBlankMatchesLoki).
  A vertical tab, a form feed, U+0085, U+00A0 or a control byte in that place is Loki's parse error, and the proxy answers the 400 before any VictoriaLogs call (TestBlankAfterKeywordRejectedNeverReachesVictoriaLogs: query_range, query and tail).

  Found by the grammar sweep (internal/querycorpus TestGrammarSweep, answers recorded with the Loki oracle, Loki 3.7.9, and the VictoriaLogs oracle, v1.49.0 and v1.53.0; conformance/registry/grammar-sweep.json holds the queries of each class). The sweep compares the proxy's validation and plan with Loki's parser and tree, and the texts the plan and the translator write with VictoriaLogs' parser; it sends no HTTP request, so what a client receives is for the e2e proof to confirm when the case is promoted.
request:
  scope: query-grammar
  entry: "TestGrammarSweep (internal/querycorpus): the class of conformance/registry/grammar-sweep.json cased semantics/translator-reads-only-space-between-tokens"
  setup: "Send as the query of /loki/api/v1/query_range (start now-15m, end now, step 60s): quantile_over_time(0.5, {app=\"x\"} |\tunwrap c [5m]) by (d) . The query is kept out of the plan corpus while the difference is open (the plan ratchets count the corpus rows); promote it to an HTTP request with the e2e proof when it is fixed."
compare:
  mode: observed
  fields: [status, error_text]
  expect: "The answer of the same query with spaces."
gap:
  status: open
  impact: api-only
  effort: M
  area: "internal/translator (frozen): closes when the plan serves the construct"
  loki: "any ASCII white space separates tokens"
  proxy: "the translator matches a single space; the failed translation answers Loki's fixed 500 Internal Server Error, with the translator's reason in the log line only"
  planned_test: 'TestGrammarSweep (internal/querycorpus: the class of conformance/registry/grammar-sweep.json that names this case holds the queries; it shrinks as the proxy follows Loki); TestBlankAfterKeywordMatchesLoki (internal/logql) and TestBlankAfterKeywordRequestsEqualSpaced (internal/proxy) for a blank after a keyword; TestUnwrapBlankSpellingsLowerAsSpaced (internal/queryplan/lower) and TestUnwrapBlankUnderWrappersEqualsSpaced (internal/proxy) for the unwrap; FuzzMetricFlipGate, FuzzLogFlipGate and TestLogFlipGate_BlankBeforeParserExpression (internal/proxy); TestTypedPairOfBlankSpellingIsTheSpacedOnes (internal/querycorpus) for the VictoriaLogs oracle typed-selector pairs'
  visual: none
  visual_reason: 'a grammar corner no Grafana panel sends, found by the grammar sweep'
  clusters: []
