id: semantics/without-nested-under-aggregation
title: a without nested under an outer aggregation folds level by level, like Loki (fixed)
proves:
  - metric-series-identity
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  `max(sum without (pod) (rate({app="payment-service"} | logfmt | unwrap amount [5m])))`
  is one series `{}` valued with the largest per-ns sum on Loki. The proxy now folds
  every level, innermost first, over the series rows of the `without`
  (semantics/nested-aggregation-outer-by-native-routes): the `max` and the
  `sum by (ns)` read the per-ns sums, on an instant query, a tumbling window and
  a sliding one over rate and count_over_time (TestWithoutNestedAggregationMatchesLoki,
  TestWithoutFoldIsLimitedToTheOperatorsItProves). What follows is the
  measurement before the fix: the proxy answered one series valued with the sum of every ns (instant 2.73333 against Loki's
  1.5, the larger of {ns=x} = 1.23333 and {ns=y} = 1.5) and 0.74,0.26 on
  query_range against Loki's 0.92,1.41333,1.5. `sum by (ns) (sum without (pod) (...))`
  is a series per ns on Loki ({ns=x} = 1.23333, {ns=y} = 1.5 at an instant);
  the proxy answers `{}` = 2.73333 (0.74,0.26 on query_range).

  The `without` fold applies only to a `without` that is the outermost
  aggregation (sum, min, max, avg or count). Under another aggregation the inner
  `sum without` is translated to an ungrouped sum (one row, the total of every
  series), so the outer `max` or `sum by (ns)` reads a single value; the query is
  answered as it was before the fold (semantics/unwrap-sum-without-collapses). Measured through the handlers on emulated VictoriaLogs v1.52.0 over 8 streams (ns x and y, pods a to d) and 40 lines (TestWithoutShapesStillDifferFromLoki, internal/proxy); Loki's answer is computed from the same rows with the evaluator of Loki v3.7.7 and was not run against a Loki here. The same on origin/main. Found while fixing semantics/unwrap-sum-without-collapses.

  Measured on generator data with `| logfmt amount` (Loki 3.7.7 and VictoriaLogs v1.52.0 on an isolated stack, instant): Loki answers 30700.83 (the larger of the two level sums, error 3912.87 and info 30700.83); the proxy answers 34613.70, the total.

  On the e2e fixtures (Loki 3.7.7 and VictoriaLogs v1.52.0 on an isolated stack, instant),
  `max(sum without (route) (rate({app=~"uwsum-lf-.+"} | logfmt amount, route | unwrap amount [5m])))`
  was 0.6917 on Loki (the largest of three streams' sums) and 2.025 on the proxy (their
  total). `min` over the same inner differed the same way (Loki 0.6583, proxy 2.025),
  while `sum`, `stddev`, `stdvar` and `topk(2, ...)` over it matched Loki.
  TestCompat_UnwrapSumWithoutUnderAnotherAggregation now holds max, min, avg and
  count over it to Loki too (pending its run against Loki).

  Covered on a sliding window (range != step) for rate and count_over_time;
  the window values of an over-time unwrap function there are the open row
  semantics/unwrap-over-time-range-windows, which a nest over one inherits.

request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'max(sum without (pod) (rate({service_name="payment-service"} | logfmt amount | unwrap amount [5m])))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, values]
  expect: |
    One series valued with the largest per-ns sum (max), and a series per ns for sum by (ns).
gap:
  status: fixed
  fixed_by: "#746"
  impact: explore-visible
  effort: M
  area: 'internal/translator tryTranslateMetricQueryWithout (nested aggregations with a without clause); internal/proxy applyWithoutGrouping'
  loki: 'pkg/logql/evaluator.go:451-466 VectorAggEvaluator.Next (the outer aggregation takes the vector the inner without produced)'
  proxy: 'every level is folded over the series rows of the without, innermost first'
  planned_test: 'TestWithoutNestedAggregationMatchesLoki (internal/proxy, max and sum by over a without, range and instant), TestWithoutFoldIsLimitedToTheOperatorsItProves; TestCompat_UnwrapSumWithoutUnderAnotherAggregation (test/e2e-compat, max, min, avg and count over a without)'
  note: 'Related: semantics/unwrap-sum-without-collapses (fixed), semantics/without-over-inner-aggregation-collapses.'
  clusters: []
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null
