id: semantics/unwrap-quantile-sum-by-group-quantile
title: sum by over quantile_over_time with unwrap adds the per-series quantiles instead of taking the group quantile, like Loki (open)
pending: true
proves:
  - metric-series-identity
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  `sum by (app) (quantile_over_time(0.5, {app=~"uwsum-lf-.+"} | logfmt | unwrap amount [5m]))`
  folds, on Loki 3.7.7, the quantile of every series (stream plus parsed labels)
  of an app with sum: 20.25, 19.625 and 20.875 for the three apps of the e2e
  fixtures at the measured instant. The proxy answers the quantile of all the
  samples of the app, 6.75 for each of them (VictoriaLogs v1.52.0; query_range and
  instant alike). On generator data an earlier measurement had the proxy at 12 and
  13 where Loki answers 36 and 39 for the same shape.

  `quantile_over_time` is evaluated per series under a vector aggregation; only
  the range aggregation's own `by (...)` groups the samples before the quantile
  (pkg/logql/syntax/extractor.go). The proxy moves the outer `by (app)` into the
  quantile's grouping (unwrapInnerGrouping), which turns "sum of quantiles of
  series" into "quantile of the group". The three route series of an app give 3 x
  6.75 = 20.25 on Loki for the first app, which is the ratio seen above.

  Measured again with the Loki engine oracle and VictoriaLogs v1.53.0 and
  v1.49.0 (TestKeepUnwrapIdentityMatchLoki, `sum by (app) (quantile_over_time(0.9,
  {job="kj"} | json | unwrap duration_ms [5m]))`, each line a Loki series of its
  own): the proxy now answers the sum of a quantile per stream, still not Loki's
  sum per series, on every request kind. With a keep before the unwrap the
  series are the kept labels and the answer is Loki's
  (semantics/keep-before-unwrap-series-identity).

  Fixed with semantics/unwrap-per-series-identity-raw-rows: the series are the
  stream and a hash of each line's parsed labels less the unwrapped one, which
  the lowered query writes; the quantile evaluator reads VictoriaLogs' value
  counts per such series, takes Loki's quantile of each and folds them by the
  clause. Proven against the Loki engine oracle and VictoriaLogs v1.53.0 and
  v1.49.0 on instant, step = range, step < range and step > range, json and
  logfmt, every line a series of its own and every line of a stream one series
  (TestKeepUnwrapIdentityMatchLoki, TestUnwrapDynamicIdentityMatchLoki).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum by (namespace) (quantile_over_time(0.95, {app="payment-service"} | logfmt | unwrap amount [5m]))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, values]
  expect: |
    Loki's sum of the per-series quantiles per namespace.
gap:
  status: open
  impact: explore-visible
  effort: M
  area: 'internal/queryplan/lower unwrap_dynamic.go (the series hash); internal/proxy quantile_histogram.go (withQuantileShape groups the counts by the stream and the hash)'
  loki: 'pkg/logql/range_vector.go:449-487 quantileOverTime; pkg/logql/syntax/extractor.go:21-60 (a range by groups the samples); pkg/logql/evaluator.go:435-529 VectorAggEvaluator.Next (a vector aggregation folds per-series values)'
  proxy: 'the sum of the quantile of each series (the stream and the hash of its parsed labels)'
  planned_test: 'TestKeepUnwrapIdentityMatchLoki, TestUnwrapDynamicIdentityMatchLoki (internal/querycorpus, Loki engine and VictoriaLogs oracles); TestDynamicIdentityHandlersReadThePlan (internal/proxy); e2e: TestCompat_UnwrapQuantileOuterSum (test/e2e-compat, group core) to add'
  note: 'Found while fixing semantics/unwrap-sum-without-collapses. The sum without form keeps its own route (semantics/unwrap-sum-without-collapses).'
  clusters: []
