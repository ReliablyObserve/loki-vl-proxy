id: semantics/stream-grouped-sum-skips-parsers
title: A sum grouped by stream labels over `| json` and `| logfmt` with the errors dropped is counted by VictoriaLogs stats with no parser, like Loki
pending: true
proves:
  - parser-json
  - parser-logfmt
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  `sum by (level) (count_over_time({env="production", app="api-gateway"} |
  json | logfmt | drop __error__, __error_details__ [5m]))` (the PS5 control
  of the parser A/B set) answered 400 "limit reached while evaluating the
  query" at 24h where Loki answers 200, and took 3.9-5.6x Loki's time at 6h:
  the ordered JSON evaluator took the query (two parsers, compiled as a mixed
  plan), its native class needs a `<key>!=""` filter and refuses `level`, so
  it read every selected row (`| fields _time, _stream, _msg, level | limit
  1000001`) and ran both parsers in the proxy, past
  -manual-range-metric-row-limit (1,000,000 rows) at 24h.

  Loki writes a parsed key named like a label the line already holds (a
  stream label, or structured metadata) as `<name>_extracted`, so neither
  parser can move a line to another group, and the drop of `__error__` after
  the last parser keeps every line. So the answer is the one of the query with
  no stage from the first parser on, which VictoriaLogs counts with stats,
  where every counted line holds every grouping label as a stream label.
  lower.StreamGroupedParsersAt (internal/queryplan/lower/stream_grouping.go)
  decides the shape from the plan; the proxy (serveStreamGroupedParsers,
  internal/proxy/stream_grouped_parsers.go) answers the cut query through the
  handler and serves it only when two checks hold, both read after the answer
  (a line written later can only fail them):
    * every series of the answer holds every grouping label with a value (a
      line without one is counted in a series that lacks it);
    * one VictoriaLogs read of at most one row finds no line of the window
      (range, offset and step included) whose stream lacks the label's
      answered values, nor, for a name the cut query reads from the stored
      field (the level names the stream value restore leaves,
      semantics/stream-label-shadowed-by-ingest-json-key), a stored field
      other than its stream label: structured metadata or a key VictoriaLogs
      unpacked at ingest can hold another value under the same name, where
      Loki groups by the stream label.
  Every other outcome goes on to the ordered JSON evaluator, as before. A
  ranking (topk, bottomk, sort, sort_desc) of such a sum is the ranking of the
  checked cut query; an operand of a binary operation or of label_replace is
  answered as a query of its own.

  The shape: a sum by labels (not without) of count_over_time, rate,
  bytes_over_time or bytes_rate; only line filters before the first parser;
  from it on bare json and logfmt parsers (at least one of each, no
  extraction list, no flag) and drops of whole labels naming no grouping
  label, the last parser followed by a drop of __error__. Kept on today's
  route, and tested: no drop (Loki answers 400 on any line its JSON parser
  rejects, which the cut query cannot see), one parser, a label filter, line
  filter after a parser, keep, format stage, conditional drop or a drop of the
  grouping label, a grouping by a parsed key (the answer check sends it on),
  without, `_extracted` names, detected_level and service_name, and data with
  a stream that lacks the label in the window or whose stored field differs.

  Evidence: TestStreamGroupedParsersMatchLoki (internal/querycorpus) against
  Loki's engine and VictoriaLogs v1.49.0 and v1.54.0 through the proxy's
  handlers, instant and three step relations: streams with the label whose
  JSON and logfmt lines carry another level, a stream without it inside the
  window and one reached only through an offset, the label as stream label and
  structured metadata, as structured metadata only, valid JSON only, logfmt
  only, both orders, rate, bytes, several labels, a line filter, a ranking,
  `* 2` and label_replace. Every served run equals Loki and reads no line;
  every other run is answered as on main (the listed open runs differ on main
  too). TestStreamGroupedParsersAt holds the shape, TestStreamGroupedParsersRoute
  the checks and the fallbacks.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum by (level) (count_over_time({env="production", app="api-gateway"} | json | logfmt | drop __error__, __error_details__ [5m]))'
    start: now-24h
    end: now
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: exact
  fields: [status, series_labels, values]
  expect: |
    HTTP 200, one series per stream level with Loki's counts, from VictoriaLogs
    stats with no unpack pipe and one stream value check of at most one row.
corpus:
  size: 4
  dimensions:
    shapes:
      - query: 'sum by (level) (count_over_time({app="x"} | json | logfmt | drop __error__, __error_details__ [5m]))'
      - query: 'sum by (level) (rate({app="x"} | logfmt | json | drop __error__ [5m]))'
      - query: 'sum by (level, pod) (count_over_time({app="x"} |= "k" | json | logfmt | drop __error__, __error_details__ [5m]))'
      - query: 'topk(2, sum by (level) (count_over_time({app="x"} | json | logfmt | drop __error__, __error_details__ [5m])))'
gap:
  status: fixed
  fixed_by: 'this PR'
  impact: explore-visible
  effort: M
  area: 'internal/queryplan/lower/stream_grouping.go StreamGroupedParsersAt; internal/proxy/stream_grouped_parsers.go serveStreamGroupedParsers, streamGroupedValuesStored'
  loki: 'a parsed key named like a stream label or structured metadata becomes name_extracted (recorded with the Loki engine, TestStreamGroupedParsersMatchLoki)'
  proxy: 'the cut query counted by VictoriaLogs stats, served after the answer and stream value checks'
  planned_test: 'TestStreamGroupedParsersMatchLoki (internal/querycorpus); TestStreamGroupedParsersAt (internal/queryplan/lower); TestStreamGroupedParsersRoute, TestStreamGroupedAnswerValues, TestStreamGroupedCutOf (internal/proxy)'
  clusters: []
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null
