id: semantics/binary-on-without-label-list-accepted
title: "A binary operation with `on` and no label list (`+ on 1`, `% on rate(...)`) is accepted (open)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  `rate({a="b"}[5m]) + on 1` is "parse error at line 1, col 24: syntax error: unexpected NUMBER, expecting (" in Loki, and `rate({a="b"}[5m]) % on rate({a="b"}[5m])` "... unexpected RATE, expecting (".
  The proxy's parser accepts both: `on` with no parentheses reads as no modifier.

  Found by the grammar sweep (internal/querycorpus TestGrammarSweep, answers recorded with the Loki oracle, Loki 3.7.9, and the VictoriaLogs oracle, v1.49.0 and v1.53.0; conformance/registry/grammar-sweep.json holds the queries of each class). The sweep compares the proxy's validation and plan with Loki's parser and tree, and the texts the plan and the translator write with VictoriaLogs' parser; it sends no HTTP request, so what a client receives is for the e2e proof to confirm when the case is promoted.
request:
  scope: query-grammar
  entry: "TestGrammarSweep (internal/querycorpus): the class of conformance/registry/grammar-sweep.json cased semantics/binary-on-without-label-list-accepted"
  setup: "Send as the query of /loki/api/v1/query_range (start now-15m, end now, step 60s): rate({app=\"x\"}[5m]) + on 1 . The query is kept out of the plan corpus while the difference is open (the plan ratchets count the corpus rows); promote it to an HTTP request with the e2e proof when it is fixed."
compare:
  mode: observed
  fields: [status, error_text]
  expect: "Loki's 400 syntax error at the token after on."
gap:
  status: open
  impact: api-only
  effort: S
  area: "internal/logql parser (vector matching modifiers)"
  loki: "on and ignoring take a parenthesized label list"
  proxy: "on without parentheses is skipped"
  planned_test: 'TestGrammarSweep (internal/querycorpus: the class of conformance/registry/grammar-sweep.json that names this case holds the queries; it shrinks as the proxy follows Loki)'
  visual: none
  visual_reason: 'a grammar corner no Grafana panel sends, found by the grammar sweep'
  clusters: []
