id: semantics/json-metric-detected-level-ingest-keyword-scan
title: detected_level of a line Loki's `| json` accepts but its ingest scans by keyword, and of the level fields beyond `level`, is not reproduced (open)
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  Loki's ingest level detection treats a line as JSON only when its first
  non-space character is `{` and its last is `}` (field_detection.go isJSON).
  A line with text after the closing brace (`{"level":"info"} trailing`) is
  not JSON there: the level comes from a keyword scan of the whole line
  (detectLevelFromLogLine), so the same line can be `unknown`, or any level
  word found first, while `| json` at query time accepts it and reads its
  level key.

  Measured on VictoriaLogs v1.52.0 against Loki v3.7.7 with 66 lines of
  `{"level":"<spelling>","n":<i>} trailing`: Loki answered five levels, with
  `unknown` for some of the spellings, while the proxy took the body's level
  key for every one of them (`info` for six spellings). Main answered
  `unknown` for all of them, so neither main nor this change reproduces Loki
  here; this change differs in the lines whose keyword scan finds no level.

  Loki's other level fields (severity, lvl, ...) are not read by either
  evaluator either (field_detection.go allowedLevelLabels).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum by (detected_level) (count_over_time({app="json-level-trailing"} | json | __error__="" [1m]))'
    start: now-10m
    end: now
    step: "60"
  headers:
    X-Scope-OrgID: "0"
  precondition: |
    The stream holds lines with text after the closing brace.
compare:
  mode: exact
  fields: [series_labels, values]
  expect: |
    The series Loki's ingest-time scan assigned (not met: the level key of the
    body is used).
gap:
  status: open
  impact: explore-visible
  effort: M
  area: 'internal/proxy ordered_json_metric.go groupLabels (row evaluator); stats pushdown level derivation'
  loki: 'pkg/distributor/field_detection.go isJSON, detectLevelFromLogLine'
  proxy: 'the level key of the parsed body, normalized'
  planned_test: 'an e2e on lines with text after the closing brace once the keyword scan is mirrored'
  clusters: []
