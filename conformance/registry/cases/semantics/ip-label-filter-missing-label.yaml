id: semantics/ip-label-filter-missing-label
title: An ip() label filter on a label the line does not have keeps the line; Loki drops it (fixed)
pending: true
proves:
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki's ip() label filter drops a line whose label is absent
  (pkg/logql/log/ip.go:123-133 filterTy: `if !ok { return false }`).

  The differential run of 2026-11-04 (proxy 69d07019, Loki v3.7.9,
  VictoriaLogs v1.53.0): `{service_name="payment-service"} | logfmt |
  addr=ip("1.2.3.4")` and three variants (`remote_addr=ip(...)`,
  `ipaddr=ip(...)`, with `level="error"`) answer 0 lines on Loki and 99 on
  the proxy; payment-service lines have no addr field. Until #995 the proxy
  rejected the filter with a 400 (semantics/proxy-rejects-valid-logql); since
  it accepts it, the filter keeps lines Loki drops. A single address and a
  range were sent as a match-all regexp, `!=` as its negation (no line), and
  a CIDR as ipv4_range, which VictoriaLogs also matches on a leading-zero
  address Loki does not read.

  Fixed (internal/translator/ip_label_filter.go): the pattern is read as
  Loki reads it (address, CIDR, range) and sent as ipv4_range or ipv6_range
  on the label, with guards for what VictoriaLogs' parsers read and Loki's
  netip scan does not (leading zeros, a two-character last octet with a
  non-digit, IPv4 text under an IPv6 pattern, a value shorter than five
  characters or a zone). `!=` keeps a present label holding no address of
  the pattern. An absent label matches neither operator. A value with an
  address inside other text is open apart
  (semantics/ip-label-filter-embedded-address). Loki also keeps a line its
  parser failed on under both operators (ip.go:124-127); the proxy drops it,
  as it has no label value (semantics/parse-error-labels-on-log-lines).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{service_name="payment-service"} | logfmt | addr=ip("1.2.3.4")'
    start: 'now-1h'
    end: 'now'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [status, streams.values]
  expect: |
    200 with no line.
gap:
  status: fixed
  fixed_by: '#1105'
  impact: explore-visible
  effort: S
  area: 'internal/translator/ip_label_filter.go ipLabelFilter (ip() label filter), internal/translator/translator.go translateSingleLabelFilter'
  loki: 'pkg/logql/log/ip.go:123-145 (absent label: line dropped under = and !=), :183-261 (address scan, pattern forms)'
  proxy: 'Loki''s lines for an absent label and for a whole-address value'
  planned_test: 'TestCompat_IPLabelFilterAbsentLabel (test/e2e-compat, group core)'
  clusters: []
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null
