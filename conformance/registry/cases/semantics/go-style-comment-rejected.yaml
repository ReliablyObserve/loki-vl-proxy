id: semantics/go-style-comment-rejected
title: "Loki reads text after `//` as a comment; the proxy rejects it (open)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  The Loki oracle accepts `rate({a="b"}[5m]) // rate({a="c"}[5m])`; its tree (facts command) is the first rate alone, so the text after `//` is not read (`/* x */` is accepted the same way). The proxy reads `//` as two divisions and answers
  "parse error at line 1, col 20: syntax error: unexpected /". The `#` comment is already read like Loki's (semantics/comments-signed-compound-offsets).

  Found by the grammar sweep (internal/querycorpus TestGrammarSweep, answers recorded with the Loki oracle, Loki 3.7.9, and the VictoriaLogs oracle, v1.49.0 and v1.53.0; conformance/registry/grammar-sweep.json holds the queries of each class). The sweep compares the proxy's validation and plan with Loki's parser and tree, and the texts the plan and the translator write with VictoriaLogs' parser; it sends no HTTP request, so what a client receives is for the e2e proof to confirm when the case is promoted.
request:
  scope: query-grammar
  entry: "TestGrammarSweep (internal/querycorpus): the class of conformance/registry/grammar-sweep.json cased semantics/go-style-comment-rejected"
  setup: "Send as the query of /loki/api/v1/query_range (start now-15m, end now, step 60s): rate({app=\"x\"}[5m]) // rate({app=\"y\"}[5m]) . The query is kept out of the plan corpus while the difference is open (the plan ratchets count the corpus rows); promote it to an HTTP request with the e2e proof when it is fixed."
compare:
  mode: observed
  fields: [status, error_text]
  expect: "Loki's answer: the query before the comment."
gap:
  status: open
  impact: edge
  effort: S
  area: "internal/logql scanner (comments)"
  loki: "// and /* */ start comments"
  proxy: "only # starts a comment"
  planned_test: 'TestGrammarSweep (internal/querycorpus: the class of conformance/registry/grammar-sweep.json that names this case holds the queries; it shrinks as the proxy follows Loki)'
  visual: none
  visual_reason: 'a grammar corner no Grafana panel sends, found by the grammar sweep'
  clusters: []
