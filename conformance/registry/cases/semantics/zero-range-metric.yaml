id: semantics/zero-range-metric
title: "A range metric over a zero range is answered with Loki's empty result (fixed; absent_over_time open)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  `rate({a="b"}[0s])` parses and evaluates in Loki, which answers 200 with an empty result (Loki oracle, check command). The proxy cannot read a range that is not a
  positive duration on its manual range metric path, so it refuses the query. A client reads Loki's fixed `500 Internal Server Error` for it (it read `invalid range metric query`,
  a 400), and the construct is named in the log line (`zero-range`). A range too large for a duration is a query Loki rejects (`parse error at line 0, col 13: duration out of range`);
  the proxy answers that with Loki's 400 and the same words without the position (semantics/range-duration-grammar-wider-than-loki).

  Fixed: a query whose answer has no series whatever the data (a range aggregation over a zero range other than
  absent_over_time, and every vector aggregation, label_replace, arithmetic, comparison or `and` of it, `or` of two
  of them, `unless` with one on the left) is answered at once on query_range and query with Loki's empty matrix or
  vector, before the cache, the plan and any VictoriaLogs call (internal/proxy/query_tree_validation.go
  emptyWhateverTheData, held by cachedQueryValidation). Loki's engine (test/oracle/loki engine) answers every one of
  them so over data with lines in every window. Not covered: absent_over_time over a zero range, which Loki answers
  with 1 at every step, still answers 500, and so does an `or` with an operand that has series.
request:
  scope: query-grammar
  entry: "internal/proxy handleQueryRange and handleQuery (answerEmptyResult), before any other work"
  setup: "Send as the query of /loki/api/v1/query_range (start now-15m, end now, step 60s): rate({app=\"x\"}[0s]) ."
compare:
  mode: observed
  fields: [status, body]
  expect: "Loki's 200 answer: an empty matrix."
gap:
  status: fixed
  fixed_by: TBD-PR
  impact: edge
  effort: S
  area: "internal/proxy manual range metric path (a zero range)"
  loki: "200, an empty result"
  proxy: "200, Loki's empty result, without a VictoriaLogs call (absent_over_time: 500)"
  planned_test: 'TestZeroRangeAnswersLikeLoki (internal/proxy, Loki engine answers recorded with the oracle), TestRangeWindowRefusal (internal/proxy)'
  visual: none
  visual_reason: 'a zero range is no panel a user builds'
  clusters: []
