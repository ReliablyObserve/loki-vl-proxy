id: semantics/proxy-rejects-valid-logql
title: 'LogQL Loki accepts that the proxy rejected: comments, signed and compound offsets, logfmt flags (fixed)'
proves:
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: api
why: |
  Loki v3.7.7 accepts and answers `# comments`, `offset -1s` and `offset
  1h2m20s`, a line filter after the range (`count_over_time({...}[12h] |=
  "error")`), `| logfmt --strict` / `--keep-empty`, `| addr=ip("1.2.3.4")`
  label filters, `topk(k, sum by (a) (sum_over_time(... | unwrap value
  [1s])))` as an instant query, and more. The proxy's parser or translator
  rejects each with 400 (its own parse error, or `unsupported instant
  aggregation target`). Each query family is a separate small parser fix; the
  differential run lists them per cluster.

  Since fixed, each with its own case: comments and negative, compound and
  fractional offsets (semantics/comments-signed-compound-offsets). The parser
  accepts these, and they answer like Loki (TestRangeMetricCompatibilityParsedSurfaceAnswers):
  a line filter after the range, ip() label filters (CIDR and range, = and
  !=), and the topk over sum_over_time instant form. Since fixed too: `| logfmt --strict` /
  `--keep-empty`, read in any order and repeated, before a field list, with
  Loki's errors for `| json --strict` and an unknown flag. The stage is
  answered as `| logfmt`, which is Loki's answer for well-formed lines; how
  malformed lines and empty values differ is semantics/logfmt-malformed-lines.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{namespace="prod"} | logfmt --strict'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [status]
  expect: |
    200 with Loki's answer.
gap:
  status: fixed
  fixed_by: 'pending'
  impact: api-only
  effort: M
  area: 'internal/logql parser (lexer: comments, signed durations, flags) + translator'
  loki: 'pkg/logql/syntax/lex.go:149 comments, :90-91 OpStrict/OpKeepEmpty; syntax.y offsetExpr; pkg/logql/log/ip.go'
  proxy: '400'
  planned_test: 'TestRangeMetricCompatibilityLogfmtFlags and TestRangeMetricCompatibilityCommentsAndOffsets (test/e2e-compat, group semantics, against Loki); TestLogfmtFlagsLikeLoki, TestCommentsAndOffsetsLikeLoki (internal/logql, Loki''s recorded answers)'
