id: semantics/json-metric-detected-level-derivation
title: sum by (detected_level) over a JSON pipeline gives every line the level Loki's ingest gave it, by level key in document order, by keyword scan, with a detected_level stream label kept as stored (fixed)
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  Loki sets detected_level once per line at ingest (pkg/distributor/
  field_detection.go extractLogLevelFromLogLine, discover_log_levels on). A
  level stream label or structured metadata decides first. Otherwise a line
  whose first non-space character is `{` and last is `}` is read as JSON: the
  first string value of an allowed key (level, LEVEL, Level, log.level,
  severity, SEVERITY, Severity, SeverityText, lvl, LVL, Lvl, severity_text,
  Severity_Text, SEVERITY_TEXT) at depth 0 or 1, in document order, counts only
  when it is a known spelling (info, INFO, inf and information are `info`).
  Anything else (a number, a boolean, `notice`, no such key, a line that is not
  JSON) falls to a keyword scan of the whole line, which finds the first
  bounded level word; `unknown` is the answer only when the scan finds none.
  The value is structured metadata present on every line, so a body key named
  detected_level is detected_level_extracted, and a detected_level stream label
  keeps its stored value (the derived one moves to detected_level_extracted).

  Measured against Loki v3.7.7 on 35 probe lines (the e2e test pins each):
  `{"level":30,"msg":"hi"}` is unknown; a pino error line
  (`{"level":50,...,"err":{"type":"Error"}}`) is error; `{"level":"notice"}` is
  unknown but `{"level":"notice","msg":"error connecting"}` is error;
  `{"level":" info"}` is info; `{"severity":"ERROR"}`, `{"Level":"Information"}`,
  `{"LEVEL":"warn"}` and `{"log":{"level":"warn"}}` are error, info, warn and
  warn; `{"msg":"x","severity":"error","level":"info"}` is error (document
  order) and `{"level":"info","severity":"error"}` is info; a line without a
  level key that says "error" is error. The proxy took the stream's spelling as
  stored, read only a body `level` key and made every other value a series of
  its own (`30`, `notice`, ` info`, `true`) or `unknown`.

  Both routes of `sum by (detected_level) (... | json ...)` now give Loki's
  value. The row evaluator (plain `| json`, `__error__!=""`, every pushdown
  fallback) gives each row Loki's structured metadata before any stage runs,
  using the derivation the log lines use (deriveRowLevel), so a body
  detected_level key is renamed and a filter on detected_level
  (`| json | detected_level="info"`) compares the derived value. The stats
  pushdown computes the level in VictoriaLogs with the pipes of the native
  metric route (translator.BuildDetectedLevelChain), placed before the unpack
  of any other label, and a guard (detectedLevelStreamRisk,
  detectedLevelKeysRisk, detectedLevelUnpackRisk, cached with the other
  pushdown probes) hands the query to the raw-row evaluator when the window
  holds a line those pipes read differently from Loki: a detected_level stream
  label, two mentions of a level key (the pipes read keys in a fixed order),
  or a level key unpack_json yields no value for (nested other than log.level,
  leading whitespace, text after the closing brace, a syntax error). A filter
  on detected_level is applied after the pipes (`!= ""` always holds), also for
  Logs Drilldown's detected_level breakdown, which is not the native histogram
  (the label translator maps detected_level to level, so
  orderedJSONNativeGroupingIsExact is false for it). With
  -detected-level-body-scan=false the raw-row evaluator answers, as only the
  stored fields decide.

  The plain and `| logfmt` logs volume shapes (`sum by (level,
  detected_level)`) take the same pipes: a stream without a level label gets
  the level of its body (a `level=warn` key or a keyword), as in Loki, where
  main answered `unknown`. The plain shape has no raw-row fallback, so it runs
  without the guard (see semantics/detected-level-pipes-known-differences).

  Cost: three extra bounded VictoriaLogs queries per uncached window, cached
  with the other probes. The guard is a superset of the lines the pipes read
  differently: a body with both `level` and `severity` (audit logs) trips it
  although the pipes might agree. One such line sends the whole query to the
  raw-row evaluator, which is exact and bounded by the row limit, so a long
  range answers 502 where the pushdown answered 200 (DLV2 and DLV3 of the A/B).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum by (detected_level) (count_over_time({app="json-level-probe"} | json | drop __error__ [1m]))'
    start: now-10m
    end: now
    step: "60"
  headers:
    X-Scope-OrgID: "0"
  precondition: |
    One stream per probe line: pino numeric levels, notice, a padded level, the
    severity, Level, LEVEL and nested log.level keys, two level keys in both
    orders, a line with the word error and no level key, a detected_level
    stream label, a body detected_level key, structured metadata level and
    detected_level.
compare:
  mode: exact
  fields: [status, series_labels, values]
  expect: |
    The series Loki answers for each probe, on `| json` (raw-row evaluator) and
    `| json | drop __error__` (pushdown or its guarded fallback).
gap:
  status: fixed
  fixed_by: "#760"
  impact: explore-visible
  visual: none
  visual_reason: 'the generator data carries one lowercase spelling, the same in the stream label and the body, so main and the branch render the same panel; the e2e probes against Loki are the proof (v1.47 and v1.52)'
  effort: M
  area: 'internal/proxy ordered_json_metric.go (withDerivedLevel, setStatsPushdown, detectedLevel*Risk), stream_processing.go stringRow'
  loki: 'pkg/distributor/field_detection.go extractLogLevelFromLogLine, detectLevelFromLogLine, normalizeLogLevel; pkg/distributor/labels.go (detected_level_extracted)'
  proxy: 'the row evaluator and the stats pushdown read the stream level or a body level key and normalized it'
  planned_test: 'TestOrderedJSONDetectedLevelLikeLoki, TestOrderedJSONDetectedLevelMixedRows (proxy); TestRangeMetricCompatibilityJSONDetectedLevelProbes and TestRangeMetricCompatibilityJSONDetectedLevel (test/e2e-compat, group semantics)'
  note: |
    Measured on VictoriaLogs v1.52.0 and v1.47.0 against Loki v3.7.7.
  clusters: []
