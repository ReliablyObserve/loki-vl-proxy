id: semantics/json-metric-detected-level-derivation
title: sum by (detected_level) over a JSON pipeline normalizes a level stream label and reads a body level key, as Loki's ingest does for those two (fixed)
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  Loki sets detected_level at ingest (pkg/distributor/field_detection.go
  extractLogLevel): a level stream label, else structured metadata, else a
  level key of the JSON body, then normalizeLogLevel folds the spellings
  (info, INFO, inf, information are `info`; a line without a level is
  `unknown`). `sum by (detected_level) (count_over_time({...} | json [1m]))`
  therefore has one series per level, whatever the spelling or the place the
  level was found in.

  The proxy's row evaluator answers every `| json` shape the stats pushdown
  does not take (plain `| json`, `__error__!=""`) and every fallback of the
  pushdown. It took the stream's level spelling as stored (INFO, inf and
  information were three series) and, with the parser hints of a
  detected_level grouping, never read a level key that only the JSON body
  holds, so those lines were `unknown`. The stats pushdown already grouped the
  stored level, else the unpacked body key, and normalized after the read. The
  row evaluator now normalizes the stream's level and adds `level` to its
  parser hints for a detected_level grouping, so both evaluate alike.

  Only the `level` stream label and a top-level `level` key of the body are
  read; Loki's allowed level fields go further (severity, lvl, ...), a case
  neither evaluator covers. A body `detected_level` key would be extracted by
  the same hint set, as before.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum by (detected_level) (count_over_time({app="json-level"} | json [1m]))'
    start: now-10m
    end: now
    step: "60"
  headers:
    X-Scope-OrgID: "0"
  precondition: |
    Lines with the level only in the JSON body, only as a level stream label in
    mixed spellings, and in both (the stream wins).
compare:
  mode: exact
  fields: [status, series_labels, values]
  expect: |
    One series per normalized level (info, warn, error, debug, unknown), as
    Loki answers.
gap:
  status: fixed
  fixed_by: "#TBD"
  impact: explore-visible
  visual: none
  visual_reason: 'the generator data carries lowercase levels, and the same in the stream label and the body, so main and the branch render the same panel; proven against Loki by the e2e on a fixture with mixed spellings and body-only levels (v1.47 and v1.52)'
  effort: S
  area: 'internal/proxy ordered_json_metric.go setParserHints and groupLabels (row evaluator)'
  loki: 'pkg/distributor/field_detection.go extractLogLevel, normalizeLogLevel'
  proxy: 'the row evaluator kept the stream level as stored and ignored a body-only level key'
  planned_test: 'TestOrderedJSONDetectedLevelLikeLoki (proxy); TestRangeMetricCompatibilityJSONDetectedLevel (test/e2e-compat, group semantics)'
  note: |
    Measured on VictoriaLogs v1.52.0 and v1.47.0 against Loki v3.7.7.
  clusters: []
