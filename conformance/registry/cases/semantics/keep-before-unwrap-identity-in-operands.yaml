id: semantics/keep-before-unwrap-identity-in-operands
title: Under label_replace, a keep before an unwrap decides the operand's series like Loki (fixed)
pending: true
proves:
  - metric-series-identity
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  semantics/keep-before-unwrap-series-identity serves a range function over an
  unwrapped label whose series a keep decides, alone, under one vector
  aggregation, under a ranking or a sort, against a number, and in a binary
  operation between two vectors. Under label_replace the operand keeps the
  stream (and each line) as its series, as before:
  `label_replace(first_over_time({job="kj"} | json | keep app, duration_ms | unwrap duration_ms [5m]), "svc", "$1", "app", "(.*)")`
  answers a series per stream on `query` and `query_range` step > range, and the
  series limit (400) on step = range and step < range, where Loki answers one
  series per app. Measured with the Loki engine oracle and VictoriaLogs v1.53.0
  and v1.49.0 (TestKeepUnwrapIdentityMatchLoki).

  Narrowed to the label_replace form (owner, 2026-11-17): the binary form
  (`stddev_over_time(K) / avg_over_time(K)` with the same keep on both sides)
  matches Loki since a binary operation over parser operands is no longer read
  as one bare parser metric by its text (semantics/json-parser-error-under-wrappers,
  TestKeepUnwrapIdentityMatchLoki lists no difference for it).

  Fixed: the plan's series identity of a keep before the unwrap
  (lower.KeepUnwrapIdentity) reads through label_replace calls at the root,
  which rewrite the labels of the evaluated series and leave the identity as it
  is, so the proxy serves the query from the plan, grouped by the labels the
  keep leaves, and applies the calls to the answer. TestKeepUnwrapIdentityMatchLoki
  holds the call around first_over_time and quantile_over_time, and two calls
  around a sum by, to Loki on query and query_range (step equal to, under and
  over the range), VictoriaLogs v1.49.0 and v1.54.0; the run that differed now
  matches. The cached answers of a query with a keep, an unwrap and a
  label_replace are fenced (@keep-unwrap-identity-label-replace-v1:).
request:
  method: GET
  path: /loki/api/v1/query
  params:
    query: 'label_replace(first_over_time({app="api-gateway"} | json | keep app, duration_ms | unwrap duration_ms [5m]), "svc", "$1", "app", "(.*)")'
    time: 'now'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, values]
  expect: |
    Loki's series (the kept labels), relabelled.
gap:
  status: fixed
  fixed_by: TBD-PR
  impact: explore-visible
  effort: M
  area: 'internal/queryplan/lower/unwrap.go KeepUnwrapIdentity (the root, one vector aggregation over it, under label_replace calls); internal/proxy/response_key_fences.go (keepUnwrapIdentityLabelReplaceResponseVersion)'
  loki: 'the operand series are the kept labels less the unwrapped one'
  proxy: 'the labels the keep leaves as the operand series, relabelled by the calls'
  planned_test: 'TestKeepUnwrapIdentityMatchLoki (internal/querycorpus); TestKeepUnwrapIdentity (internal/queryplan/lower); TestKeepIdentityServedFromPlan, TestKeepIdentityCacheKeysFenced (internal/proxy)'
  clusters: []
