id: semantics/keep-before-unwrap-identity-in-operands
title: Under label_replace, a keep before an unwrap still leaves the stream in the operand's series (open)
pending: true
proves:
  - metric-series-identity
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  semantics/keep-before-unwrap-series-identity serves a range function over an
  unwrapped label whose series a keep decides, alone, under one vector
  aggregation, under a ranking or a sort, against a number, and in a binary
  operation between two vectors. Under label_replace the operand keeps the
  stream (and each line) as its series, as before:
  `label_replace(first_over_time({job="kj"} | json | keep app, duration_ms | unwrap duration_ms [5m]), "svc", "$1", "app", "(.*)")`
  answers a series per stream on `query` and `query_range` step > range, and the
  series limit (400) on step = range and step < range, where Loki answers one
  series per app. Measured with the Loki engine oracle and VictoriaLogs v1.53.0
  and v1.49.0 (TestKeepUnwrapIdentityMatchLoki).

  Narrowed to the label_replace form (owner, 2026-11-17): the binary form
  (`stddev_over_time(K) / avg_over_time(K)` with the same keep on both sides)
  matches Loki since a binary operation over parser operands is no longer read
  as one bare parser metric by its text (semantics/json-parser-error-under-wrappers,
  TestKeepUnwrapIdentityMatchLoki lists no difference for it).
request:
  method: GET
  path: /loki/api/v1/query
  params:
    query: 'label_replace(first_over_time({app="api-gateway"} | json | keep app, duration_ms | unwrap duration_ms [5m]), "svc", "$1", "app", "(.*)")'
    time: 'now'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, values]
  expect: |
    Loki's series (the kept labels), relabelled.
gap:
  status: open
  impact: explore-visible
  effort: M
  area: 'internal/queryplan/lower unwrap.go KeepUnwrapIdentity (the root, or one vector aggregation over it); the label_replace route translates its operand another way'
  loki: 'the operand series are the kept labels less the unwrapped one'
  proxy: 'the stream (and each line) as the operand series'
  planned_test: 'TestKeepUnwrapIdentityMatchLoki (internal/querycorpus) lists the runs under this case'
  clusters: []
