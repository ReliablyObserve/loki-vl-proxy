id: semantics/unwrap-sum-by-per-series-function-extraction-list
title: sum by over max, min or avg over time with unwrap after an extraction list takes the maximum of the group, not the sum of the per-series maxima (open)
proves:
  - metric-series-identity
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  `sum by (level) (max_over_time({service_name="payment-service"} | logfmt amount | unwrap amount [5m]))`
  takes the maximum per series (the stream, since `| logfmt amount` extracts only the
  unwrapped label, which is dropped from the identity) and sums those maxima per
  level (pkg/logql/evaluator.go:435-529 VectorAggEvaluator.Next over the series
  of the range aggregation, pkg/logql/log/metrics_extraction.go:150-178 for the
  identity). The proxy groups the inner stats by `level` alone
  (unwrapInnerGrouping returns the by labels), so it answers the maximum of the
  whole level, not the sum of the per-stream maxima.

  Measured on generator data (Loki 3.7.7 and VictoriaLogs v1.52.0 on an isolated
  stack): at an instant Loki answers {level=error} = 733939.42 and {level=info} =
  1389474.20; the proxy answers 9972.23 and 9997.57. On query_range over 10
  minutes the same factor at every step. `sum_over_time` and `rate` under
  `sum by` are not affected: a sum of sums is the sum.

  Since semantics/unwrap-sum-without-collapses the series identity of a parser
  that names the keys it extracts is known (parsedSeriesLabels), so the fix is the
  same shape: group the inner stats by the by labels plus `_stream` and those keys,
  then aggregate. A bare `| logfmt` or `| json` stays under
  semantics/unwrap-per-series-identity-raw-rows.
request:
  method: GET
  path: /loki/api/v1/query
  params:
    query: 'sum by (level) (max_over_time({service_name="payment-service"} | logfmt amount | unwrap amount [5m]))'
    time: 'now'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, values]
  expect: |
    The sum of the per-series maxima per level.
gap:
  status: open
  impact: explore-visible
  effort: M
  area: 'internal/translator unwrapInnerGrouping (sum by over a per-series function: the inner stats groups by the by labels only)'
  loki: 'pkg/logql/evaluator.go:435-529 VectorAggEvaluator.Next; pkg/logql/log/metrics_extraction.go:150-178 (series = stream + parsed labels)'
  proxy: 'the maximum of the group, not the sum of the per-series maxima'
  planned_test: 'TestCompat_UnwrapSumByPerSeriesFunction (test/e2e-compat, group core) over sum by x avg/max/min, extraction list, range and instant'
  note: 'Found while fixing semantics/unwrap-sum-without-collapses; related semantics/unwrap-per-series-identity-raw-rows (the same defect for a bare parser).'
  clusters: []
