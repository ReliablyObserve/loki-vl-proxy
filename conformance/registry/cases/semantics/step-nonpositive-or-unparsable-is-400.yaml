id: semantics/step-nonpositive-or-unparsable-is-400
title: query_range with a step of 0, a negative step or an unparsable step answers 400 as Loki does, not an empty 200 (fixed)
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  Loki v3.7.9 rejects a step that does not parse with 400
  `cannot parse "<step>" to a valid duration` and a step <= 0 with 400
  `zero or negative query resolution step widths are not accepted. Try a positive integer`. The proxy's query_range handler answers
  `step=0`, `step=-1` and `step=abc` with an empty matrix and HTTP 200
  (found while testing sub-second steps, semantics/sub-second-step-grid).

  Fixed (#1419): query_range checks step with the other request parameters, before the cache and VictoriaLogs, and a step of 0 or less or one that does not parse is Loki's 400 with Loki's text (recorded rows r0564-r0566 and the same probes on the other routes).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum(count_over_time({app="api-gateway"}[1m]))'
    start: '1800000000'
    end: '1800000600'
    step: '0'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [status, errorType, message]
  expect: |
    HTTP 400 with Loki's text for step 0 and negative steps, and for an unparsable step.
gap:
  status: fixed
  fixed_by: '#1419'
  impact: api-only
  effort: S
  area: 'internal/proxy/proxy.go handleQueryRange (step validation beside exceedsLokiRangeResolution)'
  loki: 'a step that does not parse is a 400 ''cannot parse ... to a valid duration'', a step <= 0 a 400 ''zero or negative query resolution step widths are not accepted'' (live case runs of 2026-11-14, in this case)'
  proxy: '400 with Loki''s text, before any VictoriaLogs call'
  planned_test: 'TestRequestParamAnswers (replay of the recorded parameter rows) and TestStepGrammarIsLokis (internal/proxy)'
  note: 'Verified 2026-11-14 on build 726dfb48f against Loki 3.7.9 and VictoriaLogs v1.53.0 (two live case runs, same data on both sides): step=0 answers 400 `zero or negative query resolution step widths are not accepted. Try a positive integer` on both sides.'
  clusters: []
