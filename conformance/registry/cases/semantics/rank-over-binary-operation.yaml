id: semantics/rank-over-binary-operation
title: topk, bottomk, sort, sort_desc, stddev and stdvar over a binary operation answer Loki's range on query_range (fixed)
pending: true
proves:
  - loki_api_v1_query_range
  - loki_api_v1_query
consumer: explore
why: |
  Loki evaluates a ranking, stddev or stdvar on the vector its operand
  produces at each step, and a binary operation operand is evaluated like a
  binary operation at the root: each side per step, joined by its vector
  matching, with its bool modifier, set operator or chain of operations.

  Cause: the query_range handler of these wrappers (handleRangeMetricPostAggregation)
  had no branch for a binary operand, where the instant handler and a binary
  at the root evaluate the operands one by one. It translated the whole
  operation and sent the translation, the marker of its two operands' queries
  (`__binary__:<op>:<left>|||<right>`), to VictoriaLogs as one query. A
  translation that lost the bool modifier or the right side of and, or and
  unless was read as a plain stats query. Measured with the Loki engine
  oracle and the VictoriaLogs serve oracle (v1.53.0 and v1.49.0) on five
  streams: on every range request kind (step at, under and over the range)
  one of sixteen shapes answered Loki's answer: rankings over a division,
  vector matching, group_left, a bool comparison, and, or, unless and a chain
  answered other values, extra or missing series or a 500, and the many-to-one
  error answered `Internal Server Error` instead of Loki's text. Instant
  answers matched.

  Fixed: the range handler evaluates a binary operand by the binary route
  (proxyBinaryLogQL), as the instant handler does: every operand is a query
  of its own through the query handlers (and their caches), the operation is
  joined by the proxy's binary evaluator, and the ranking, stddev or stdvar
  is applied to the joined matrix per step. The answers cached before the
  fix are fenced on query_range (rankOverBinaryResponseVersion, read from the
  query's plan); instant keys keep theirs.

  A tie at the k-th place follows Loki's Go map order; the differential's
  shapes rank without ties (a bool comparison is ranked with k as large as
  its series).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'topk(2, sum by (service_name) (rate({env="production"}[1m])) / sum by (service_name) (rate({env="production"} |= "error" [1m])))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, values]
  expect: |
    A matrix with at most two series at every step: the services with the
    highest ratio of all lines to error lines at that step, as Loki answers.
corpus:
  dimensions:
    shapes:
      - query: 'topk(2, sum by (service_name) (rate({env="production"}[1m])) / sum by (service_name) (rate({env="production"} |= "error" [1m])))'
      - query: 'sort_desc(sum by (service_name) (count_over_time({env="production"}[1m])) > bool 10)'
      - query: 'bottomk(1, sum by (service_name) (count_over_time({env="production"}[1m])) and sum by (service_name) (count_over_time({env="production"} |= "error" [1m])))'
      - query: 'stddev(sum by (service_name) (count_over_time({env="production"}[1m])) / sum by (service_name) (count_over_time({env="production"} |= "error" [1m])) * 100)'
gap:
  status: fixed
  impact: explore-visible
  effort: S
  area: 'internal/proxy/metric_agg.go (handleRangeMetricPostAggregation), internal/proxy/rank_binary_fence.go, internal/proxy/response_key_fences.go'
  loki: 'a ranking, stddev or stdvar over a binary operation is evaluated on the binary operation answer of each step (recorded with the Loki engine oracle: internal/querycorpus/testdata/rank-binary-loki-diff.jsonl.gz)'
  proxy: 'the binary route evaluates each operand as its own query and joins them; the wrapper is applied to the joined matrix'
  planned_test: 'TestRankOverBinaryMatchesLoki (internal/querycorpus, recorded Loki and VictoriaLogs v1.49.0/v1.53.0 answers), TestRangeRankOverBinaryEvaluatesOperands and TestRankOverBinaryFencesRangeKeysOnly (internal/proxy), TestResponseKeyFencesFireOnTheSpellingsTheParserReads and FuzzResponseKeyFencesMatchParsedTree (rank-over-binary rows)'
