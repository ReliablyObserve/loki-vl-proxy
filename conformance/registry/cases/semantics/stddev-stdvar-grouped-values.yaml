id: semantics/stddev-stdvar-grouped-values
title: stddev and stdvar with by or without fold the series of each group, like Loki (fixed)
proves:
  - metric-series-identity
  - loki_api_v1_query_range
consumer: explore
why: |
  `stddev by (app) (count_over_time({env="production"}[5m]))` folds the per-
  stream counts of each app: Loki 28.0 for auth-service, the proxy 1829 (and
  stdvar alike), on range and instant queries. The ungrouped form matches.
  Some instant forms answered without a resultType (`stdvar without (app)
  (...)`).

  Loki's stddev and stdvar are vector aggregations: at each step every series of
  the operand falls into the group `by` keeps or `without` leaves, and the group
  takes the population standard deviation or variance of the series' VALUES by
  Welford's update, 0 for a group of one series (pkg/logql/evaluator.go
  newVectorAggEvaluator and VectorAggEvaluator.Next, :435-529 and the stddev and
  stdvar cases at :541-546 and :591-595). stddev_over_time and stdvar_over_time,
  which work over the samples inside one window, are a different function.

  Root cause: only the ungrouped `stddev(` / `stdvar(` prefix reached the
  post-aggregation route that runs the operand and folds its series
  (parseInstantMetricPostAggQuery). A `by` or `without` clause, in either
  position, went to the translator, which has no series-level form for stddev
  and stdvar and emitted the plain `stats by (app) count()` of the operand's
  range function: the group's line count. Fixed: the route reads the operand and
  the grouping from the query's AST (parseStddevStdvarQuery, either clause
  position, `by ()` and `without ()` included) and applyMatrixStddevAgg /
  applyInstantStddevAgg fold the series of each group per step with Loki's
  update (stddevAccumulator), one series per group, a group present only at the
  steps where one of its series has a point, and an empty input an empty vector
  or matrix with its resultType.

  Where it is computed: VictoriaLogs computes the per-series values with its
  native stats (the operand is the bare range query, tumbling, sliding or
  instant, with its own windows). The fold across series is the proxy's, over
  the stats output (one value per series per step; no log rows are read): VL has
  no stdvar, and its stddev stats function exists only from v1.49.0 (v1.40-v1.48
  have none) and would leave the sliding-window evaluator, which reads the first
  stats pipe, without the fold. Nothing is version-gated.

  A `by` a label a parser extracts (`stddev by (route) (count_over_time({..} |
  logfmt [5m]))`) translates the operand as the series-level form count, min, max
  and avg use (first stats pipe grouped by the listed labels and the stream, final
  pipe dropped), so the series carry the label on tumbling and instant queries.

  The series limit is counted on the groups, as Loki does (pkg/logql/engine.go):
  the operand's own answer is bounded by a ceiling (foldedGroupsSeriesCeiling)
  and max_query_series applies to the folded answer, so 600 streams in 3 apps are
  3 series. A `sort`, `topk` or `stddev` over a `without` operand merges the
  operand's series with the operand's own aggregation (withoutAggregationOp of the
  operand, not of the outer query). The ungrouped values now follow Loki's
  Welford update, so they can differ from the earlier two-pass values in the
  last digits.

  Not changed, registered open: a stddev or stdvar nested in another expression or
  under a binary operator (semantics/stddev-stdvar-nested-or-binary), and the
  parsed labels of the operand's series
  (semantics/stddev-stdvar-parsed-label-series-identity).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'stddev by (app) (count_over_time({env="production"}[5m]))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [values]
  expect: |
    Loki's values.
gap:
  status: fixed
  fixed_by: "#738"
  impact: explore-visible
  effort: S
  area: 'internal/proxy metric_agg.go (parseStddevStdvarQuery, applyMatrixStddevAgg, applyInstantStddevAgg)'
  loki: 'pkg/logql/evaluator.go:400-529 newVectorAggEvaluator / VectorAggEvaluator.Next (stddev and stdvar at :541-546, :591-595)'
  proxy: 'the per-series values of the operand from VictoriaLogs, folded per group and step'
  planned_test: 'TestCompat_StddevStdvarGrouped, TestCompat_StddevStdvarGroupedInstantResultType and TestCompat_StddevStdvarGroupedRegistryQueries (test/e2e-compat, group core; written, not yet run); TestStddevStdvarGroupedDifferential, TestStddevStdvarGroupedByParsedLabelDifferential, TestStddevStdvarFoldEdgeCases, TestParseStddevStdvarPostAgg, TestStdvarWithoutInstantAlwaysAnswersAVector, TestStddevStdvarCountsSeriesLimitOnTheGroups and TestPostAggregationMergesWithoutByTheOperandsOperator (internal/proxy)'
  note: 'Measured on origin/main 1cf58b45. The differential test runs the real handler against an emulated VictoriaLogs (v1.52, v1.40 and no version) with a reference written from Loki v3.7.7 VectorAggEvaluator; the live e2e vs Loki is written and still to be run.'
  clusters:
    - 44bf1425
    - 4b67fb14
    - 65210f05
    - 6864165c
    - ce65447e
