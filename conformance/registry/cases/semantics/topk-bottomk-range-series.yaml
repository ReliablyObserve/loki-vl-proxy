id: semantics/topk-bottomk-range-series
title: topk/bottomk on query_range rank every step in each by()/without() group, in every spelling, like Loki (fixed)
proves:
  - loki_api_v1_query_range
consumer: explore
why: |
  Loki ranks at every step, so a range topk(3, ...) returns the union of each
  step's top 3 (8 series for `topk(3, sum by (app)
  (count_over_time({env="production"}[5m])))` over an hour; 791 for `topk by
  (container) (5, ...)`). The proxy returns 3 (5) series. Instant topk
  matches.

  Measured on cf738b80 with an emulated VictoriaLogs (the real handler, the
  stats pipes of the window evaluator, 4 apps x 3 envs of generated lines with
  gaps and changing leaders, unaligned start): the plain `topk(k, expr)` and
  `bottomk(k, expr)` already ranked every step on their own (the bounded
  per-step heap of sliding_window_stats.go encodeTopK and applyTopKToMatrix, in
  place since the heavy-query protection work); the differential below found no
  difference from a port of Loki's heap. What did differ was every other
  spelling of Loki's grammar (pkg/logql/syntax/syntax.y:182-184): `topk by (l)
  (k, e)` and `topk without (l) (k, e)` were taken for a log query (a `streams`
  200 on query_range, a 400 at an instant), `topk (k, e)` with a space too, and
  `topk(k, e) by (l)` was a 400 on query_range with a mangled inner expression.
  Loki keeps one heap per grouping key and step (pkg/logql/evaluator.go:
  443-494, :551-561), so the grouped spellings rank k series per group. Fixed:
  parseTopKPostAgg reads the clause from the parsed query and the inner text as
  written; encodeTopK, applyTopKToMatrix and the instant vector rank per step
  and group (topKGroupKey: by() keeps the listed labels, a missing one is empty;
  without() drops the listed labels and __name__). NaN ranks last for both
  operators, as in Loki's heaps (pkg/logql/vector.go). Ties at the k-th place
  follow Go map order in Loki (pkg/logql/range_vector.go keeps its window in a
  map, evaluator.go's groups in another), so the series chosen there are not
  reproducible; the proxy breaks them by label order and the tests compare the
  selected values at such steps.

  What the recorded parity run (cluster examples) shows, read against that:
  `topk by (container) (5, count_over_time({namespace="prod"}[5m]))` returned 5
  series at an instant and on a range where Loki returned 45 and 791 - the
  grouped spellings, now ranked per group. `topk(3|5, ...)` and
  `bottomk(2|3, sum by (app) (...))` returned the right number of series with
  "different series, same count" at an instant, and fewer series than Loki on a
  range (2 vs 7, 3 vs 7). The log generator writes the same number of lines per
  service in every batch (LOG_BATCH lines per service every LOG_INTERVAL
  seconds), so the counts of the services tie at the k-th place in most windows:
  Loki's pick among tied values varies from step to step and its union grows,
  the proxy's pick (label order) is stable. The differential test reproduces
  the rule, not Loki's randomness; whether that explains the recorded 3 vs 8 is
  settled by the e2e run against Loki, which is owed.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'topk by (container) (5, sum by (container, pod) (count_over_time({env="production"}[5m])))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [series]
  expect: |
    At every step and for every container, the 5 best samples, and the union of
    the series that ranked at some step with their samples at those steps only.
    Where several series tie at the 5th place Loki's choice follows Go map
    order, so there the values must match and the series may differ.
gap:
  status: fixed
  fixed_by: "#736"
  impact: explore-visible
  effort: M
  area: 'internal/proxy metric_agg.go (parseTopKPostAgg, topKGroupKey), metric_binary.go (applyTopKToMatrix, applyTopKToVector), sliding_window_stats.go (encodeTopK); cases limits/top-n-ranking-not-silent'
  loki: 'pkg/logql/evaluator.go:443-494, :551-561, :596-621 VectorAggEvaluator topk/bottomk per step and grouping key; pkg/logql/vector.go heaps; pkg/logql/syntax/syntax.y:182-184'
  proxy: 'every spelling parsed; k series per step and group, bounded heap over the VictoriaLogs window stats'
  planned_test: 'TestCompat_TopkRangePerStep (test/e2e-compat, group semantics); TestTopKRangeDifferential, TestTopKRangeDifferentialRawEvaluator, TestTopKRangeResultBounds, TestTopKMatrixEdges, TestParseTopKPostAgg, TestInstantTopKPerGroup and TestInstantTopKByHandler (internal/proxy)'
  note: 'Measured on origin/main cf738b80. Fixed: the grouped spellings. The plain spelling already ranked per step; its recorded difference (fewer series than Loki on tied counts) is Loki picking among ties at random, unverified until TestCompat_TopkRangePerStep is run. The e2e is written and not yet run against Loki 3.7.7 and VictoriaLogs.'
