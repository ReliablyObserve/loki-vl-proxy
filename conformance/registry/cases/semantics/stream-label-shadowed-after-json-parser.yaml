id: semantics/stream-label-shadowed-after-json-parser
title: After `| json`, a metric plan or a log filter on a stream label that a JSON line's key shadows in VictoriaLogs reads the line's value (open)
pending: true
proves:
  - parser-error-and-label-collision
  - loki_api_v1_query_range
consumer: explore
why: |
  VictoriaLogs' Loki push API stores a JSON line's key over the stream label of
  the same name (semantics/stream-label-shadowed-by-ingest-json-key). The
  proxy's ordered `| json` metric plans build their own LogsQL and read the
  stored field, and a log query's filter after a parser copies the stored value
  aside (semantics/plain-name-after-parser-reads-stream-label), which is
  already the line's. With an emulated VictoriaLogs,
  `sum by (version) (count_over_time({service_name="api-gateway"} | json | drop __error__, __error_details__ [1m]))`
  answers version="v1" and version="v2" where Loki answers version="v2"
  (the line's key is version_extracted in Loki). A `| logfmt` metric is exact:
  it goes through the translation that restores the stream value.

  The seeded visual-bare-json-metric requests provide another concrete JSON metric
  witness: sum by (level) (max_over_time({service_name="visual-bare-json-metric"} | json
  | unwrap duration_ms | __error__="" [5m])) on both endpoints.
  seed_bare_json_metric_fixture in bench/visual/stack.py writes a stream level=info with
  JSON body levels debug/error and duration_ms. Original facets show Loki retaining the
  info group while the proxy returns debug and error groups. This is the same open
  stream-label precedence contract after JSON, not an extension to logfmt or an accepted
  identity-policy projection. The retained artifact does not contain the full point
  bodies or prove a current-head fix.

  Historical ownership evidence for these additions is the parity-refresh artifact of
  https://github.com/ReliablyObserve/loki-vl-proxy/actions/runs/44910591975
  (run/results.jsonl), source ref 4a63b99e, and the committed
  conformance/registry/generated/parity-discovery.json. Full response bodies were not
  retained. The case remains OPEN; these assignments grant no waiver, owner-kept
  projection, current runtime pass or fixed status.

request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum by (version) (count_over_time({service_name="api-gateway"} | json | drop __error__, __error_details__ [1m]))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, values]
  expect: |
    One series per stream label value with Loki's counts.
gap:
  status: open
  impact: explore-visible
  effort: M
  area: 'internal/proxy/ordered_json_metric.go (plans that build their own LogsQL); internal/translator/plain_stream_labels.go svCopyPipes (log queries)'
  loki: 'a parsed key named like a stream label is name_extracted and the stream label keeps its value (https://grafana.com/docs/loki/latest/query/log_queries/)'
  proxy: 'the stored field, the line value'
  planned_test: 'TestStreamLabelShadowedAfterJSONParser (internal/proxy) and TestCompat_StreamLabelShadowedAfterJSONParser (test/e2e-compat, group core)'
  clusters:
    - '6b0124a8'
    - '91deb392'
