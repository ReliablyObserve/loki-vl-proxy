id: semantics/unwrap-first-last-per-line-range-longer-than-step
title: first_over_time and last_over_time with unwrap over a series per line read Loki's window for a range longer than the step
pending: true
proves:
  - window-bounds-and-step-alignment
  - metric-series-identity
  - loki_api_v1_query_range
consumer: explore
why: |
  Residual of semantics/unwrap-first-last-range-longer-than-step. Over a parser
  with no keep after it, a Loki series is the stream and the labels the parser
  extracts, so lines with a key of their own (a request or transaction id) are a
  series each. The proxy names such a series by the stream and the line
  (`_stream, _msg`, semantics/unwrap-per-series-identity-raw-rows), which is no
  bounded grouping of buckets: a window would need a row per line and bucket.
  These queries keep one VictoriaLogs step bucket per point, so a point sums the
  lines of the step (t-step, t] instead of the window: with the Loki engine oracle
  and VictoriaLogs v1.53.0 and v1.49.0 (TestKeepUnwrapIdentityMatchLoki),
  `sum(first_over_time({job="kj"} | json | unwrap duration_ms [5m]))` at step 60
  answers 19011 where Loki answers 128874, for first and last, under sum and
  sum by (app), and with a keep before the parser.

  Measured on the bench/ab seed (perf-smoke, 2026-11-27, set unwrap-first-last
  F3, `sum(last_over_time({service_name="payment-service"} | logfmt | unwrap
  amount [5m]))`, every line a series by its tx_id, one batch every 10 s): at
  1h (5 s step) Loki 721 points, the proxy 360; at 6h (10 s) the points agree
  and the values are 30.4 times lower (8,188,916.8 against 268,914.8); at 24h
  (60 s) 5.8 times lower.

  Fixed: first_over_time and last_over_time are functions of the parser's
  dynamic identity (lower.DynamicUnwrapIdentity), as avg, max, min, stddev and
  stdvar were: the lowering hashes the stream and each line's parsed labels
  less the unwrapped one into __lvp_sid and keeps each series' row of the
  earliest or the latest time (row_min / row_max(_time, value)); on a range
  longer than the step the hash is written ahead of the unwrap gate
  (Profile.IdentityAhead), VictoriaLogs answers the row per series and
  anchored bucket, the window evaluator merges each series' buckets into
  (t-range, t] (mergeUnwrapBuckets) and the outer aggregation folds the
  series. A keep before the parser is not that identity and stays open under
  semantics/keep-before-parser-unwrap-identity.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'sum(last_over_time({service_name="payment-service"} | logfmt | unwrap amount [5m]))'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series, timestamps, values]
  expect: |
    Loki's window value at every step.
gap:
  status: fixed
  fixed_by: "this change"
  impact: explore-visible
  effort: M
  area: 'internal/queryplan/lower unwrap_dynamic.go (dynamicIdentity); internal/proxy unwrap_dynamic_identity.go (dynamicWindowRange), query_lowering.go (dynamicIdentityFuncs)'
  loki: 'the window (t-range, t] of every evaluation time, a series per stream and parsed labels'
  proxy: 'the series hash of the parser''s labels, each series'' window merged from its anchored buckets'
  planned_test: 'TestUnwrapDynamicIdentityMatchLoki and TestKeepUnwrapIdentityMatchLoki (internal/querycorpus, Loki engine and VictoriaLogs v1.49.0 and v1.54.0 oracles); TestDynamicUnwrapIdentity and TestDynamicUnwrapIdentityLowering (internal/queryplan/lower)'
  clusters: []
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null
