id: semantics/keep-derived-label-matcher-metric-series
title: 'A metric over a keep matcher on detected_level or service_name keeps one series per stream (open)'
pending: true
proves:
  - loki_api_v1_query
consumer: explore
why: |
  Both labels are derived on the read path, so the plan blanks no stored field for them and the series are not
  regrouped by the labels the keep leaves.
request:
  scope: keep and drop stages
  entry: "count_over_time with a keep matcher on a derived label"
  setup: "count_over_time over a keep detected_level equals error stage, and the same with service_name"
compare:
  mode: observed
  fields: [streams.stream labels, series labels, values]
  expect: "Loki's answer."
gap:
  status: open
  impact: explore-visible
  effort: M
  area: 'internal/queryplan/lower/keep_blank.go, internal/proxy/keep_series_grouping.go matcherKeepLabels'
  loki: 'series are the kept labels'
  proxy: 'one series per stream'
  planned_test: 'TestCompat_KeepNamesAndMatchersLikeLoki (test/e2e-compat, group core)'
  clusters: []
