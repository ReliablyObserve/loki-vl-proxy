id: semantics/tail-history-start-limit
title: 'Native tail ignores start and limit: Grafana Live shows no history where Loki shows its last 100 lines (open)'
proves:
  - loki_api_v1_tail
consumer: explore
why: |
  Recorded against Loki 3.7.9 on the CI stack (run 43648613839, job
  132612388406, TestTailHistory_StartLimitLikeLoki): the history is the
  newest `limit` entries, oldest first (limit 100 of 130 sent entries 030 to
  129, limit 5 sent 125 to 129, start in Unix seconds sent the entries from
  it); its entries carry detected_level="unknown" in the stream labels without
  categorize-labels, where live entries do not; start=1 upgrades the tail and
  sends no history.
  Loki's tail request takes `start` and `limit`
  and sends the entries since start, up to limit, before live lines, so
  Grafana Live shows the last 100 entries at once. The proxy's native tail
  path streams VictoriaLogs' live tail from now and ignores both, so a quiet
  stream shows nothing until new lines arrive.
request:
  method: GET
  path: /loki/api/v1/tail
  params:
    query: '{service_name="api-gateway"}'
    start: 'now-1h'
    limit: '100'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [streams.values]
  expect: |
    The last 100 entries since start, then live entries.
gap:
  status: open
  impact: explore-visible
  effort: M
  area: 'internal/proxy/tail.go openNativeTailStream (history replay before the live stream)'
  loki: 'a tail request takes start and limit and sends the entries since start, up to limit, before live lines'
  proxy: 'live entries only'
  planned_test: 'TestTailHistory_StartLimitLikeLoki (test/e2e-compat: Loki against the proxy, synthetic tail and native tail variants; group tail-multitenancy) + TestTailHistory_* (internal/proxy, every tail mode) + @explore-tail Playwright'
  note: 'Measured on main at fcaccfcc, before #652 rewrote the tail conversion; verified still present on c4ebcd98 (after #652).'
  clusters: []
