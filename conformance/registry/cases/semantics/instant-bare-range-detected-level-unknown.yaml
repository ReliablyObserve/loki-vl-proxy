id: semantics/instant-bare-range-detected-level-unknown
title: an instant bare range function carries the detected_level=unknown label Loki puts on a stream with no level
proves:
  - metric-series-identity
  - loki_api_v1_query
consumer: explore
why: |
  `rate({app="api-gateway"}[5m])` at /query, or the same function under a
  label_replace, answers one series per stream. For a stream with no `level`
  label Loki 3.7.x labels the series `detected_level="unknown"` next to the
  stream labels. The proxy now groups native stats by the derived level and
  retains this label in both instant and range answers. The no-level fixture
  and the pinned Loki differential test cover this route.
request:
  method: GET
  path: /loki/api/v1/query
  params:
    query: 'rate({app="api-gateway"}[5m])'
    time: 'now'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [series labels]
  expect: |
    detected_level="unknown" on every series of a stream with no level label.
gap:
  status: fixed
  impact: explore-visible
  effort: S
  area: 'internal/proxy instant stats answer labels (the stream-derived label set of an instant vector)'
  loki: 'detected_level is a label of every stream when log level discovery is on (unknown without a level)'
  proxy: 'the instant vector has the stream labels without detected_level'
  fixed_by: '#750'
  visual: none
  visual_reason: 'The regression is specific to the instant /query API; the visual Explore graph captures /query_range. The exact instant API response is compared with Loki in TestCompat_DetectedLevelUnknownInStatsAnswers.'
  note: 'TestInstantBareRangeHasDetectedLevelUnknown covers the native stats response and TestCompat_DetectedLevelUnknownInStatsAnswers compares the live instant route with Loki.'
  clusters: []
