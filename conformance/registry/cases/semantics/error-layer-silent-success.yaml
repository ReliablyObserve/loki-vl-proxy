id: semantics/error-layer-silent-success
title: A failed backend call is answered 200 with an empty or partial result (open)
pending: true
proves:
  - status-500
  - status-derived
consumer: any
why: |
  Several routes decode a malformed 200 body as empty, including the Drilldown
  stats route. The tail no longer closes normally: a native stream that
  ends or fails and a failed poll close with 1011 and Loki's text. Patterns now answers each of the 14
  backend failure modes with the error the other routes give it (500, 504, 499,
  429, 400) when it has no earlier answer to serve. detected_fields,
  detected_field values and detected_labels now answer each failed call (a
  timeout, a cancelled request, a body that broke off or is not VictoriaLogs
  JSON, a label whose values could not be read) with the error the other routes
  give it, apart from the Drilldown scan budget (-drilldown-scan-timeout), which
  still answers no fields when it runs out while the backend and the request
  are alive. Classified Drilldown backend failures now keep their real error
  status. The later reads of those routes (the unpack read of a field inside
  the line, the label read of a stream-label value, the line scan next to a
  working stored-field lookup) answer a failure the same way; the lookups that
  only add to an answer that already has its required read keep it, and the
  mixed-failure gate names them with the reason.
  Loki answers the same failures with an error, and Drilldown's partial
  carve-out covers max_query_series only (pkg/querier/queryrange/limits.go:507-512,
  pkg/logql/engine.go:536-548). An empty chart instead of an error hides the
  outage from the user.
request:
  scope: internal
  entry: (*Proxy).writeError, statusFromUpstreamErr, badRequestStatusOr, writeBackendError
  setup: |
    TestErrorLayer_NoVictoriaLogsLeak: a fake VictoriaLogs (and ruler) that fails
    every call in one of 14 modes (VictoriaLogs 400 parse and memory-limit
    errors, 422, 500, a 502/503 from a proxy in front, 429 queue full,
    connection refused and reset, a reply after -backend-timeout, a client
    cancellation, a 200 body cut off mid-stream, a malformed 200 body, a valid
    body above -backend-max-buffered-response-bytes), driven through 24 client
    routes (query_range log, sliding rate, stats, Drilldown stats, unwrap
    rate_counter, json; query; series; labels; label values; detected_fields,
    detected_fields with a parser filter, detected_field values, with a parser
    filter and for a field outside the stored ones, detected_labels; index
    stats, volume, volume_range, Drilldown volume_range; patterns; tail; rules;
    alerts). The cells that fail this class are listed in
    conformance/registry/error-layer-known-leaks.json.
    TestErrorLayer_NoVictoriaLogsLeakMixed fails each distinct call of a route
    in turn (a 500, a malformed body, a body cut off) while every other call
    answers with rows or without, so a route that already has one answer and
    loses a later read is seen. Its cells that still answer 200 are listed in
    conformance/registry/error-layer-known-leaks.json; the calls whose
    failure a route keeps on purpose are named, with the reason, in the test.
    TestCompat_ErrorLayerLikeLoki repeats the main modes against the stack's
    VictoriaLogs through a fault-injecting forwarder and compares with Loki.
compare:
  mode: exact
  fields: [status, errorType, body, headers]
  expect: |
    The failure mode's error (500, 504, 499, 429), never 200, except the documented max_query_series Drilldown partial reply.
gap:
  status: open
  impact: explore-visible
  effort: M
  area: 'internal/proxy http_utils.go writeGrafanaStatsFailure'
  loki: 'pkg/querier/queryrange/limits.go:441-524; pkg/util/server/error.go:124-128'
  proxy: '200 with an empty result or a warning'
  planned_test: 'TestErrorLayer_NoVictoriaLogsLeak (internal/proxy) and TestCompat_ErrorLayerLikeLoki (test/e2e-compat, group core)'
