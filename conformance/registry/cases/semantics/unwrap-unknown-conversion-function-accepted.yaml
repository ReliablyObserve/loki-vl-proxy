id: semantics/unwrap-unknown-conversion-function-accepted
title: "`unwrap foo(c)`, a conversion function Loki does not have, is accepted (open)"
pending: true
proves:
  - loki_api_v1_query_range
consumer: api
why: |
  Loki's unwrap takes a label or one of duration(), duration_seconds() and bytes(). The Loki oracle answers
  "parse error at line 1, col 26: syntax error: unexpected (, expecting RANGE or |" for `rate({a="b"} | unwrap foo(c)[5m])`. The proxy's validation
  accepts it, and both the plan and the translator write a query for it.

  Found by the grammar sweep (internal/querycorpus TestGrammarSweep, answers recorded with the Loki oracle, Loki 3.7.9, and the VictoriaLogs oracle, v1.49.0 and v1.53.0; conformance/registry/grammar-sweep.json holds the queries of each class). The sweep compares the proxy's validation and plan with Loki's parser and tree, and the texts the plan and the translator write with VictoriaLogs' parser; it sends no HTTP request, so what a client receives is for the e2e proof to confirm when the case is promoted.
request:
  scope: query-grammar
  entry: "TestGrammarSweep (internal/querycorpus): the class of conformance/registry/grammar-sweep.json cased semantics/unwrap-unknown-conversion-function-accepted"
  setup: "Send as the query of /loki/api/v1/query_range (start now-15m, end now, step 60s): rate({app=\"x\"} | unwrap foo(c) [5m]) . The query is kept out of the plan corpus while the difference is open (the plan ratchets count the corpus rows); promote it to an HTTP request with the e2e proof when it is fixed."
compare:
  mode: observed
  fields: [status, error_text]
  expect: "Loki's 400 syntax error at the opening parenthesis."
gap:
  status: open
  impact: api-only
  effort: S
  area: "internal/logql parser parseUnwrap (conversion function names)"
  loki: "only duration, duration_seconds and bytes take parentheses"
  proxy: "any name followed by parentheses"
  planned_test: 'TestGrammarSweep (internal/querycorpus: the class of conformance/registry/grammar-sweep.json that names this case holds the queries; it shrinks as the proxy follows Loki)'
  visual: none
  visual_reason: 'a grammar corner no Grafana panel sends, found by the grammar sweep'
  clusters: []
