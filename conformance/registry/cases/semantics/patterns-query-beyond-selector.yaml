id: semantics/patterns-query-beyond-selector
title: "/patterns given a metric query or a log query with a pipeline: Loki answers 200, the proxy 400 (open)"
pending: true
proves:
  - loki_api_v1_patterns
consumer: api
why: |
  A Loki that serves data answers `/loki/api/v1/patterns` given `rate({app="api-gateway"}[5m])` or
  `{app="api-gateway"} | json` with 200 (rows r1601 and r1602 of internal/lokierr/testdata/loki_error_answers.jsonl,
  recorded from a Loki 3.7.9 that held data, over a window without data: an empty data array). The proxy answers
  `400 only label matchers are supported`, as for the other selector routes. What Loki answers over a window that
  holds data (the patterns of the selector the query reads, or nothing) is asked by rows r1607 to r1609 (no start
  or end, so Loki's default window holds the recorder's fixture); the fix waits for those answers.
request:
  method: GET
  path: /loki/api/v1/patterns
  params:
    query: 'rate({app="api-gateway"}[5m])'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [status, body]
  expect: |
    Loki's 200.
gap:
  status: open
  impact: api-only
  effort: S
  area: 'internal/proxy /patterns query validation'
  loki: '200'
  proxy: '400 only label matchers are supported'
  planned_test: 'TestPatternsQueryWithoutSelectorAnswersLikeLoki (internal/proxy) extended with the recorded data-window answers'
  visual: none
  visual_reason: 'Logs Drilldown always sends a bare stream selector to /patterns'
  clusters: []
