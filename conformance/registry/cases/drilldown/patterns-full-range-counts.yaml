id: drilldown/patterns-full-range-counts
title: Logs Drilldown pattern charts covered only the end of the range and counted a sample of lines (fixed)
pending: true
proves:
  - loki_api_v1_patterns
consumer: drilldown
why: |
  Loki counts every line its pattern ingester saw, per step, over the whole
  range (pkg/pattern/drain Chunk.ForRange at the 10 s TimeResolution). The
  proxy mined a sample of lines that VictoriaLogs returned newest first: one
  fetch under 20 minutes, up to ~25 windows of 200-4000 lines beyond, so a
  chart showed samples only at the end of the range (or of each window) and
  sample counts. Its step was the range over 120 points (2 s for 5 minutes),
  re-bucketed with zero samples, so a chart showed spikes with empty steps
  between them.

  Measured on the compose stack (2026-11-06, Loki v3.7.9, VictoriaLogs
  v1.53.0), {env="production"} over 5 minutes, 22,540 lines: the proxy's
  samples covered the last 76 s with 3,661 lines; Loki's covered the range.

  Fixed: a selector's lines over Loki's pattern retention (3h) are mined as
  Loki's pattern ingester mines them and kept in a pattern state per tenant
  (internal/proxy/patterns_state.go), samples counted into Loki's 10 s samples
  then into Loki's step (the request's, or the range over 250 points, never
  under 10 s), zero-filled per stream; a refresh reads only new lines. With
  -patterns-full-range (default) a longer range is charted over all of it, the
  samples before the state's counted by VictoriaLogs per window onto the
  state's patterns (patterns_history.go, settled windows cached). Selectors
  above -patterns-state-max-build-lines, or with the state off, are counted by
  VictoriaLogs (patterns_counts.go, typed stats queries) as before.
request:
  method: GET
  path: /loki/api/v1/patterns
  params:
    query: '{env="production"}'
    start: 'now-5m'
    end: 'now'
  headers:
    X-Scope-OrgID: "0"
compare:
  mode: observed
  fields: [data]
  expect: |
    Loki's patterns and samples for a range inside Loki's retention; for a
    longer range with -patterns-full-range, the same patterns with samples over
    the whole range (Loki answers the retention's alone).
gap:
  status: fixed
  fixed_by: '#1142'
  impact: drilldown-visible
  effort: L
  area: 'internal/proxy/patterns_state.go (pattern state), patterns_history.go (counts before the state), patterns_exact.go, patterns_counts.go'
  loki: 'pkg/loghttp/patterns.go ParsePatternsQuery (step), pkg/pattern/drain/chunk.go (TimeResolution 10 s, ForRange)'
  proxy: 'Loki''s samples inside the retention; with -patterns-full-range the whole range'
  planned_test: 'TestDrilldown_Patterns_CountEveryLineAtLokisStep, TestDrilldown_Patterns_TextsMatchLokisOnTheSameLines (test/e2e-compat, group drilldown); TestPatternStateRefreshReadsOnlyNewLines, TestPatternStateFullRangeCountsTheHistoryOntoItsPatterns, TestPatternSamplesAreCountedInTenSecondSamplesThenSteps, TestPatternsFromCountsCountEveryLine, TestPatternCountsStepIsLokis (internal/proxy)'
  clusters: []
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null
