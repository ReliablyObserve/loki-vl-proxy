id: drilldown/logs-footer-query-stats
title: query and query_range answers carry Loki's stats object, so the Logs Drilldown footer shows "Total bytes processed" (the proxy's own measurement; documented)
pending: true
proves:
  - loki_api_v1_query_range
  - loki_api_v1_query
  - query-stats-envelope
consumer: drilldown
why: |
  Logs Drilldown 3.1.0 adds a footer under the logs panel
  (src/Components/ServiceScene/LogsQueryFooter.tsx). It reads the frame
  `meta.stats` entry "Summary: total bytes processed" and `meta.notices` and
  shows "Total bytes processed: <size>" plus a "Query details" drawer. Grafana
  builds those entries from `data.stats.summary` of the query_range answer,
  which Loki always fills (pkg/util/marshal/query.go:323-324 writes the
  `stats` field from the query statistics; stats.Summary carries
  totalBytesProcessed, pkg/logqlmodel/stats/stats.pb.go:205-211). The proxy
  answers `"stats":{}` for log queries (internal/proxy/stream_processing.go:320
  and the limit, multi-tenant and cold-dispatch paths), so the footer shows no
  byte count and an empty drawer where Loki direct shows both.

  Since query-stats-envelope (behaviour) the proxy answers Loki's
  data.stats summary and cache sections, in Loki's key order, on every query
  and query_range path, and Grafana shows the "Summary:" frame stats,
  including the footer's "Summary: total bytes processed". Every value is a
  measurement of the request (the decision query-stats-from-the-request-flow
  gives each field's source). totalBytesProcessed and totalLinesProcessed
  are the bytes and rows the proxy read from VictoriaLogs: for this logs
  query at most its limit (15m window on the test stack: the proxy 1,000
  rows, Loki 15,750 lines and 5,400,506 bytes, the window's lines plus
  structured-metadata bytes). Documented: totals with Loki's meaning, taken
  from the volume answers the panel requests anyway, are a follow-up change.
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: '{service_name="api-gateway"}'
    start: 'now-1h'
    end: 'now'
    limit: '1000'
    direction: 'backward'
  headers:
    X-Scope-OrgID: "0"
    X-Query-Tags: Source=grafana-lokiexplore-app
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [data.stats.summary, data.stats.cache]
  expect: |
    A stats object with Loki's summary and cache keys in Loki's order;
    totalBytesProcessed and totalLinesProcessed above 0 for a non-empty
    answer read from VictoriaLogs; Grafana's frame "Summary:" stats equal
    Loki's.
gap:
  status: documented
  impact: drilldown-visible
  effort: M
  area: 'internal/proxy/stream_processing.go (stats envelope of log query_range answers)'
  loki: 'pkg/util/marshal/query.go:323-324 stats field; pkg/logqlmodel/stats/stats.pb.go:205-211 Summary.totalBytesProcessed'
  proxy: 'data.stats summary and cache from the request flow (internal/proxy/query_stats.go); lines and bytes processed are what the proxy read from VictoriaLogs'
  planned_test: 'TestDrilldown_QueryStatsEnvelope (test/e2e-compat, drilldown group); TestQueryStats_LogQueryNumbersAreMeasured (internal/proxy)'
  clusters: []
