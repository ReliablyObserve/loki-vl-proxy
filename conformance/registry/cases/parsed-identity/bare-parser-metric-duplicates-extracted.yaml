id: parsed-identity/bare-parser-metric-duplicates-extracted
title: Bare JSON metrics cannot distinguish equal-valued metadata from ingested body fields (open)
proves:
  - parsed-label-series-identity
  - loki_api_v1_query_range
consumer: explore
why: |
  Bare `| json` metrics previously duplicated every parsed key in series
  labels because VictoriaLogs stored JSON body fields outside `_stream` at
  ingestion. The proxy now suppresses this false collision when the stored
  and parsed values agree; a dual-ingest Loki comparison checks full series
  identity. A stream-label collision or a differing structured-metadata value
  still receives `_extracted`. VictoriaLogs does not preserve provenance when
  genuine structured metadata and a JSON body key have the same name and
  value, so that indistinguishable edge remains open.
request:
  method: GET
  path: /loki/api/v1/query
  params:
    query: 'count_over_time({service_name="api-gateway"} | json [3m])'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [series labels]
  expect: |
    Loki's label sets.
gap:
  status: open
  impact: explore-visible
  effort: S
  area: 'internal/proxy/ordered_json_metric.go (stored field provenance)'
  loki: 'pkg/logql/log/parser.go:152 (suffix only on collision)'
  proxy: 'common ingested-body duplicates removed; equal-valued metadata/body collision is ambiguous'
  planned_test: 'TestCompat_BareParserMetricLabels (test/e2e-compat) and TestOrderedJSONMetricStoredBodyKeysAreNotParserCollisions; add an equal-valued metadata/body fixture when provenance is available'
