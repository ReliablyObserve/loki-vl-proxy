id: parsed-identity/bare-parser-metric-duplicates-extracted
title: Bare JSON metrics cannot distinguish equal-valued metadata from ingested body fields (open)
proves:
  - parsed-label-series-identity
  - loki_api_v1_query_range
consumer: explore
why: |
  Bare `| json` metrics previously duplicated every parsed key in series
  labels because VictoriaLogs stored JSON body fields outside `_stream` at
  ingestion. The proxy now suppresses this false collision when the VL row
  contains a complete scalar body-field projection; a dual-ingest Loki
  comparison checks full series identity. Stream-label collisions and rows
  carrying fields outside the body keep the original metadata-collision
  behaviour, including same-valued metadata/body keys. VL does not preserve
  provenance when all regular fields coincide with body keys; that edge and
  partial projections remain open.
request:
  method: GET
  path: /loki/api/v1/query
  params:
    query: 'count_over_time({service_name="api-gateway"} | json [3m])'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [series labels]
  expect: |
    Loki's label sets.
gap:
  status: open
  impact: explore-visible
  effort: S
  area: 'internal/proxy/ordered_json_metric.go (stored field provenance)'
  loki: 'pkg/logql/log/parser.go:152 (suffix only on collision)'
  proxy: 'complete scalar body projections corrected; equal-valued all-body metadata collisions and partial projections remain ambiguous'
  planned_test: 'TestCompat_BareParserMetricLabels and TestHardeningLive_ParserErrorStructuredMetadata (test/e2e-compat); add an all-body equal-metadata fixture when provenance is available'
