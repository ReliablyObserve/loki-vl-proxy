id: parsed-identity/dynamic-key-parsers
title: `| json` and `| logfmt` metric series keep the stream identity by default (owner-accepted deviation, opt-in flag)
proves:
  - parsed-label-series-identity
consumer: explore
why: |
  Loki names a metric series by every label `| json` / `| logfmt` extracted,
  so `count_over_time({app="payment-service"} | logfmt [1m])` is 22279 series
  on Loki and 1091 on the proxy, and sums of per-series max/avg differ (sum by
  (level) (max_over_time(... | unwrap status ...)): Loki 82683, proxy 503).
  Accepted deviation with -exact-parser-series-identity as the opt-in (state
  parsed-label-series-identity, waiver parsed-identity-dynamic-keys).
request:
  method: GET
  path: /loki/api/v1/query_range
  params:
    query: 'count_over_time({service_name="payment-service"} | logfmt [1m])'
    start: 'now-1h'
    end: 'now'
    step: '60'
  headers:
    X-Scope-OrgID: "0"
    X-Loki-Response-Encoding-Flags: categorize-labels
compare:
  mode: observed
  fields: [series]
  expect: |
    Loki's series (deviation accepted by default).
gap:
  status: owner-kept
  impact: explore-visible
  effort: L
  area: 'internal/translator parser series identity; -exact-parser-series-identity'
  loki: 'pkg/logql/log/parser.go label extraction into the sample labels'
  proxy: 'stream identity unless the flag is set'
  planned_test: 'differential run cluster count (bench/parity)'
