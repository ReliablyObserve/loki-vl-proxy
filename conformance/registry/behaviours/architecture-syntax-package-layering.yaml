  - id: lowering-live-shadow
    chosen: 'An opt-in, observe-only live shadow of the lowering (-translate-shadow-sample, default 0). On a translation cache miss, once the string translator''s answer is final, a sampled query is handed to a goroutine (at most 2 at once, a busy pair skips the query; 100 ms budget checked between stages; panics recovered) that runs logql.Parse, queryplan.Build and Resolve and lower.Plan under the options the translator received (label function with the stream labels, stream fields, capabilities with the detected-level body-scan cap, keepLine) and compares physical.Equal(DecodePhysical(translator output), lowered), the same comparison as the corpus shadow, now in non-test code (physical.Canon / physical.Equal) that both use. The outcome is loki_vl_proxy_lowering_shadow_total{result,construct} with a fixed result set and the plan''s node kind as construct; a mismatch logs one redacted line per second. A query the translator rejects is compared only when the lowering answers it (old_error), as in the corpus shadow, which skips a rejected row'
    over: [comparing on every translation including cache hits, a goroutine per sampled query without a bound, comparing on the request path, putting the comparison in the translator package (which the lowering cannot import), a per-query construct label, an unredacted mismatch log]
    why: |
      Step 12b of architecture B (owner 2026-11-09). The corpus shadow proves
      the lowering equals the translator on the corpus; flipping a construct
      to the lowering needs the same proof on live traffic, whose queries and
      options (stream labels, stream fields, body-scan cap, keepLine) the
      corpus only samples. The shadow runs after the translator answered and
      only on a cache miss, so it cannot delay or change the response, the
      caches or a VictoriaLogs request; the bounded slots, the budget and the
      sample keep its cost off a loaded replica, and the metric names what
      the lowering does not cover (not_lowered by construct) and what it gets
      wrong (mismatch). The comparison moved to physical (stdlib and logsql
      only) so the proxy and the corpus test share one definition and cannot
      drift.
