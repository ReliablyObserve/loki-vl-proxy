      and meaningful, is a ranking with no clause over a range aggregation: the
      translator's text is the operand's own, which is also the request the
      proxy sends (it translates the operand alone), so a native row proves the
      operand's lowering under a ranking and the screen for the spellings the
      translator reads as text. The lowered operator carries no ranking; that is
      safe because nothing serves a Rank from the plan (not a flipped
      construct) and the proxy picks the ranking route from the LogQL before
      translating.
