id: architecture-syntax-package-layering
kind: architecture
title: The LogQL and LogsQL syntax packages depend on nothing but the standard library
pending: true

loki: |
  Not client-visible: Loki's own LogQL syntax package (pkg/logql/syntax) holds
  the scanner, parser and printer apart from its engine.

victorialogs: |
  Not client-visible: VictoriaLogs keeps its LogsQL parser in lib/logstorage.

proxy: |
  internal/logql (LogQL scanner, parser, typed AST, printer, the label filter
  expression parser) and internal/logsql (LogsQL parser, typed AST, builder,
  capabilities) import only the standard library and internal/querycorpus;
  logql may import logsql, logsql imports neither. Lowering LogQL to LogsQL
  lives in internal/translator (the string translator and the typed lowering
  in ast_translate.go). depguard holds the imports and dupl the duplication
  in the two packages' non-test code.

implementation:
  - .golangci.yml
  - internal/logql/label_filter_expr.go
  - internal/translator/ast_translate.go

decisions:
  - id: syntax-packages-stdlib-only
    chosen: 'logql and logsql import the standard library and internal/querycorpus only; the translator imports them'
    over: [logql importing the translator for the label filter parser and FirstArgumentLen, one combined syntax-and-lowering package]
    why: |
      Owner 2026-11-05/07: both ASTs are libraries every layer reuses without
      duplication, and the AST work (typed label filters, parse once) comes
      before visual and performance work. A syntax package that imports the
      lowering cannot be reused below it, and the label filter parser lived in
      the translator, so the LogQL parser called back into it.
    evidence: 'go list -deps ./internal/logql ./internal/logsql (2026-11-07); depguard rejects a probe import of internal/metrics from each package'
    code: [.golangci.yml, internal/logql/label_filter_expr.go, internal/logql/canonical.go, internal/translator/ast_translate.go]
    tests: [TestParseLabelFilterExpr_Precedence, TestLabelFilterExpressionMatchesLokiGolden, TestQueryTextSites]
    quality: 'No behaviour change: every test, the conformance gate and the corpus goldens unchanged.'
    performance:
      tracked: ['benchstat: internal/translator and internal/logql benchmarks, main vs branch', 'perf-smoke: no shape slower than its base']
  - id: querycorpus-allowed-leaf
    chosen: 'internal/querycorpus is the one internal import the syntax packages keep'
    over: [a capture hook the proxy sets]
    why: |
      querycorpus imports only the standard library and its Record is an empty
      function without the corpuscapture build tag. A hook set by the proxy
      would stop the parsers' own package tests (which do not link the proxy)
      feeding the query corpus.
    evidence: 'internal/querycorpus/record.go (no-op build); TestQueryCorpusReport'
    code: [internal/logql/parser.go, internal/logsql/parser.go]
    tests: [TestQueryCorpusReport]
  - id: query-text-sites-reclassified
    chosen: 'Recount conformance/registry/query-text-sites.json after the move: deferred_raw 7 -> 9, translator_string_ops 658 -> 656'
    over: [keeping the typed lowering in internal/logql, outside the count]
    why: |
      The count covers internal/translator and internal/proxy, not the syntax
      packages. The typed lowering (two DeferredExpr literals, ten string
      operations) moved into internal/translator, so the count now sees it;
      the label filter parser's twelve string operations moved out of it into
      internal/logql. Neither is new or removed code: a move, recounted.
    evidence: 'git diff of conformance/registry/query-text-sites.json in this change'
    code: [conformance/registry/query-text-sites.json]
    tests: [TestQueryTextSites]
  - id: label-filter-readers-typed
    chosen: |
      The proxy's label filter readers (detected_fields and Drilldown relaxed
      scans, stage field exposure, unwrap conversion-error hints and keeps, the
      line_format __error__ filter) read LabelFilterStage.Expr, not Raw with
      regular expressions; a stage the parser keeps opaque (nil Expr) is still
      read as text, and the ip() exposure reading keeps its old output.
    over: [keeping regular expressions over the stage text, converting with every old reading preserved bit for bit (the AST would have to carry parentheses, separators and quote style)]
    why: |
      Owner 2026-11-07: finish the AST work and remove string handling of
      queries before visual and performance work. A differential of the old
      readers against the new over 1,200 shape queries and every real query
      in bench/ab/shapes.json and the semantics matrix found no difference on
      real queries; the synthetic differences are spellings Loki reads as one
      filter (a group, `and` or juxtaposition, a backquoted empty value),
      literals the old regexps misread (`1h30m` tokenized as `1h 30m`, `1e5`,
      `.5`, `0x10`) and non-ASCII names. Those now read like their plain
      spelling; opaque stages and ip() quirks keep the old reading because the
      new one regressed a Drilldown test or was not needed.
    evidence: 'internal/proxy/label_filter_readers_differential_test.go (2026-11-07): plain spelling 591 inputs equal to the old readers; groups 75, and/juxtaposition 40, backquoted empty 5 equal to their canonical spelling; literals 35 and non-ASCII 15 asserted'
    code: [internal/proxy/drilldown.go, internal/proxy/loki_profile.go, internal/proxy/unwrap_conversion_error.go, internal/proxy/postprocess.go]
    tests: [TestLabelFilterReadersMatchTextReaders, TestLabelFilterReadersNumericLiterals, TestDetectedFieldValues_RelaxedScanPreventsUnpackFallback, TestQueryTextSites]
    quality: 'Real queries read exactly as before; equivalent spellings read alike; query-text sites only fall (parse_calls 63 -> 62, text_built 214 -> 213).'
  - id: range-durations-typed
    chosen: 'RangeAggregation carries RangeDuration and OffsetDuration (and HasOffset) from the parser; the proxy handlers read them, and the proxy day/week/year reading delegates to logql.ParseUnitDuration'
    over: [each handler parsing Range/Offset text with one of three helpers, a second copy of the unit-sum parser in the syntax package]
    why: |
      Part of removing string handling of queries outside the syntax packages
      (owner 2026-11-05/07). A differential over every range and offset in the
      corpus and a synthetic set (250 range aggregations, 69 literals) equals
      the helpers each handler used. One literal class differs on purpose: a
      range over about 292 years, which parseLokiDuration wrapped to a negative
      value, reads as 0 (unusable); every caller treats both the same.
      Presence of an offset stays its own fact (HasOffset): `offset 0s` is an
      offset with a zero duration.
    evidence: 'internal/proxy/range_duration_differential_test.go, internal/logql/duration_test.go (2026-11-07)'
    code: [internal/logql/duration.go, internal/logql/parser.go, internal/proxy/time_utils.go, internal/proxy/query_range_steps.go, internal/proxy/ordered_json_metric.go, internal/proxy/unwrap_conversion_error.go, internal/proxy/binary_aggregation.go, internal/proxy/rate_counter_singletons.go, internal/proxy/limits_enforcement.go, internal/proxy/query_translation.go]
    tests: [TestRangeAggregationDurations, TestRangeAggregationDurationsMatchOldHelpers, TestCorpusRangeAggregationDurationsMatchOldHelpers, TestOldLokiDurationOverflowIsTheOnlyDisagreement, TestLabelFormatMentionsLineMatchesRawCheck]
    quality: 'Every handler reads the same window and offset presence as before; one unit-sum parser for the whole tree.'
  - id: logsql-reads-what-we-send
    chosen: 'internal/logsql parses every LogsQL query the proxy sends into typed nodes (opaque-but-exact only for constructs the proxy never inspects) and prints it back to a query VictoriaLogs reads the same'
    over: [leaving most sent queries unreadable (the request plan could not hold a LogsQL AST), opaque text for every unsupported pipe]
    why: |
      Owner-approved AST plan (A1.1, 2026-11-07): the request plan holds the
      lowered LogsQL as an AST, so the parser must read everything the
      translator emits before the translator can return an AST. Line-break
      values are Go-quoted so parse(print(x)) round-trips; on the compose stack
      (VictoriaLogs v1.53.0) the queries answer as before.
    evidence: 'local corpus capture (2026-11-07): goldens read 867 -> 22,060 of 24,391 (the rest are proxy-internal markers by design, 14 field names with a colon), sent queries 476 -> 9,036 of 9,044; every printed form means the same to VictoriaLogs (oracle, v1.51.1 locally); wrong accepts 54 -> 10, all semantic checks; compose stack line-break queries equal on Loki, main and this change'
    code: [internal/logsql/parser.go, internal/logsql/scanner.go, internal/logsql/ast.go]
    tests: [TestParseReadsTranslatorQueries, TestParseRejectsWhatVictoriaLogsRejects, TestParsePipesAreTyped, TestParseFiltersAreTyped, TestBuiltPipesReadBack, FuzzParseRoundTrip]
    quality: 'Every parsed query prints back to text that parses to the same AST; no corpus query loses meaning for VictoriaLogs; the oracle wrong-accept count only falls.'
  - id: physical-payloads-replace-marker-reads
    chosen: 'The post-processing the translator writes into its LogsQL text (the without fold, label_replace calls, binary expressions, scalars) is read once into typed operators (internal/queryplan/physical) by translator.DecodePhysical, the exact inverse of translator.EncodePhysical; the query and query_range handlers and the metric post-aggregation handlers read the operators instead of calling the marker parsers'
    over: [each handler stripping the without marker and then the label_replace markers with its own pair of calls, a new marker grammar or a re-parse of the LogsQL text]
    why: |
      First step of moving the proxy from in-band marker text to a typed
      physical plan (owner 2026-11-08, architecture B). The codec is built from
      the existing marker parsers only, so it reads exactly what they read: on
      2,525 queries (bench shapes, the semantics matrix, registry cases and a
      1,991-row stratified sample of the client query corpus) under 12
      translator profiles, 22,836 translated rows (6,813 with markers) decode
      and encode back byte for byte, the clean query equals the old two-step
      strip and the without and label_replace parts equal the old parsers'.
      Text the encoder cannot write back byte for byte (a padded or empty
      label list, a marker in the middle) stays Verbatim, read like before.
      The VictoriaLogs query and the answer are unchanged on 15 marker shapes
      through the real handlers.
    evidence: 'internal/querycorpus/plan_corpus_test.go TestPhysicalCodecRoundTrip, internal/proxy/physical_sites_test.go, internal/proxy/physical_sites_bench_test.go (2026-11-08)'
    code: [internal/queryplan/physical/ops.go, internal/translator/physical_codec.go, internal/translator/translator.go, internal/proxy/vector_matching.go, internal/proxy/proxy.go, internal/proxy/metric_agg.go, internal/proxy/ordered_json_metric.go]
    tests: [TestPhysicalCodecRoundTrip, TestPhysicalCodecEdgeTable, TestPhysicalCodecRoundTripsTranslatorOutput, TestMarkerSitesKeepTheirVictoriaLogsQueryAndPostProcessing, TestScalarValueMatchesParseFloat, FuzzPhysicalCodec]
    quality: 'Byte-identical VictoriaLogs queries and answers; lowering_marker_reads 41 → 34 in query-text-sites.json, may only fall.'
    performance:
      tracked: ['benchstat: BenchmarkSplitPostProcessing old vs new over the capture sample']
      bound: 'translator.SplitPost through splitPostProcessing vs the original two-step strip over the capture sample (count 10): all rows 1.23 µs vs 2.33 µs (-47%), 75 B vs 81 B, 0 allocs vs 0; rows without a marker 1.00 µs vs 2.66 µs (-62%), 0 B and 0 allocs both; locked by TestSplitPostAllocations (0 allocs without a marker, never more than the old strip with one)'
  - id: logical-plan-vl-independent-key
    chosen: 'internal/queryplan builds a logical plan from the LogQL AST (LogSelect with typed stages, RangeAgg, VectorAgg, Rank, BinOp, Scalar, Opaque for label_replace and vector until they are typed) and a binary key from it plus the request inputs that change Loki semantics (Kind, Compat, StreamLabels, Exposure); the physical inputs (VictoriaLogs name map, stream fields, capabilities, window, cache catalog, probes) never enter the logical key'
    over: [a key from the query text, a key from the translated LogsQL, a key that includes VictoriaLogs-side options]
    why: |
      Step two of architecture B (owner 2026-11-08): one Loki-semantics plan,
      independent of VictoriaLogs, that the physical planner and the cache key
      read. Build reads the parsed tree only (no parser, no String(), no
      strings or regexp on query text) and is total: every corpus row that
      parses builds (2,470 of 2,470). Two queries share a key only when the
      translator writes the same VictoriaLogs query and post-processing for
      them under each of 12 profiles (v1.49/v1.53 × identity, underscores,
      stream labels, stream fields, no body scan, keep line): 0 unsound groups.
      Two kinds of shared key are counted and may only fall. phrase_text (5):
      both texts take the translator's phrase fallback, which holds the
      query's own text. spelling_divergent (4): stddev/stdvar by (app) with
      and without extra parentheses or spacing take different translator
      routes; on the compose stack both spellings answer identically (0 of 915
      points differ, 2026-11-08), so the key is sound and the route choice is
      a translator spelling dependency, left for the lowering work.
    evidence: 'internal/querycorpus/plan_logical_test.go TestLogicalBuildTotal, TestLogicalKeySound, TestLogicalKeyDistinct; conformance/registry/query-plan.json logical and logical_key_sound sections (2026-11-08)'
    code: [internal/queryplan/nodes.go, internal/queryplan/build.go, internal/queryplan/key.go, .golangci.yml]
    tests: [TestLogicalBuildTotal, TestLogicalKeySound, TestLogicalKeyDistinct, TestBuildAllocsGate, FuzzBuild]
    history:
      - 'label_replace and vector typed (logql OpaqueMetricExpr.Typed with Inner/Args/Value, plan LabelReplace and VectorLit nodes): untyped label_replace 163 -> 8 (the eight are calls Loki rejects), vector 67 -> 0; two spellings of one label_replace now share a key, 0 unsound groups'
      - 'line_format templates typed (logql LineFormatStage.Tmpl: canonical form, fields, functions, dot use, simple; the key reads the canonical form): untyped line_format 13 -> 3 (the three are templates Loki rejects); 0 unsound groups'
    quality: 'No proxy change; the plan is built only in tests until the handlers take a Plan.'
    performance:
      tracked: ['BenchmarkBuild ns/op, B/op, allocs/op, ns/p50, ns/p99 (p50 gate with LVP_QUERYPLAN_BENCH_GATE=1)', 'TestBuildAllocLocks: allocations of Build per query shape, and of AppendKey (0)', 'TestBuildAllocsGate: allocations at most 2x logql.Parse per row', 'TestBuildResourceBounds: allocations and key bytes linear in the query']
      bound: 'Build on the 340 seed queries (2026-11-08, M5 Pro, interleaved benchstat n=10 against the first version): 238 ns/op (was 417), p50 154 ns (was 261), p99 346 ns (was 530), 504 B/op (was 1103), 2 allocs/op (was 7), against 12 allocs and 492 B for logql.Parse; the plan and its key are two allocations for a query of the usual shape'
  - id: logical-plan-resolver
    chosen: 'queryplan.Resolve, a pass over the built plan, derives from typed nodes only what the handlers read today from text: per pipeline the parser count, the error policy (NoParser, Propagate, DroppedLabel: any unconditional drop of __error__ after the last parser) and the drop stage; for the plan whether the outermost vector aggregation is ungrouped (a rank keeps its series) and how offsets apply (none, uniform, mixed, distinct); and the Loki 3.7 rule IDs it applied. A predicate_parity gate compares each attribute with the text predicate it replaces (hasOuterAggregationWithoutBy, extractLogQLOffset, hasDropErrorOnlyPostParserStage, each on the text its handler reads: the client text after keyword lowercasing and the keep-series rewrite) on every plan-corpus row that validates, and every difference must be listed with its reason'
    over: [resolving inside Build, attributes compared by exact counts, copying the text predicates' misreads into the resolver, putting rule IDs into the logical key now]
    why: |
      Step five of architecture B (owner 2026-11-08). A separate pass keeps
      Build's two-allocation locks; rule IDs are a function of the tree and the
      Inputs the key already holds, so they join the response key with the flip.
      The gate is an explained set rather than a count: a count moves with every
      registry case, while each listed difference states why the text predicate
      and Loki's meaning part. On the 2,447 validated rows offset agrees
      everywhere; ungrouped differs on 369 (213 postfix groupings
      `sum(...) by (x)` the regexp does not see, 134 ranks the regexp lists with
      the aggregations, 22 binary expressions read from their left head) and
      drop_error_only on 3 of 1,895 (a pipeline after the range, two
      parenthesised log queries). drop_error_only compares the predicate's narrow
      route condition (the drop is the only stage after the last parser and names
      only the error labels), computed from the resolved policy in the gate, so
      the resolver keeps Loki's wider meaning. The resolver follows Loki in
      each, and the call sites will move to it with route-parity proof. Only the
      predicates that read LogQL are in this step: queryUsesParserStages reads
      the translated LogsQL and leaves out logfmt, a physical fact that belongs
      to the route rules.
    evidence: 'internal/proxy/plan_predicate_parity_test.go TestPlanPredicateParity; conformance/registry/query-plan.json predicate_parity section (2026-11-08)'
    code: [internal/queryplan/resolve.go, internal/queryplan/nodes.go, internal/querycorpus/plancorpus/plancorpus.go]
    tests: [TestPlanPredicateParity, TestResolvePipelineErrors, TestResolveEveryPipelineOfABinaryExpression, TestResolveUngrouped, TestResolveOffsets, TestResolveIsIdempotentAndKeepsTheKey, TestResolveCorpus, TestResolveAllocLocks, FuzzResolve]
    history:
      - 'the handlers read Ungrouped (queryOuterUngrouped) and the drop-error opt-in (queryDropsOnlyErrorAfterParser) from the resolved plan, memoised per query text (4,096 plans, internal/proxy/query_plan.go); hasOuterAggregationWithoutBy and hasDropErrorOnlyPostParserStage are deleted, their gate rows retired, and each explained difference is a case of TestQueryOuterUngrouped or TestQueryDropsOnlyErrorAfterParser. TestPlanMatchesLokiOracle compares the resolved plan with Loki''s own tree (test/oracle/loki facts) on the 2,423 corpus queries both parsers accept: 0 differences; it found that Loki holds `by ()` like no clause, so `by ()` is ungrouped (the earlier gate had listed it as a misread). On the stack, base and PR answer the drop-error spellings and stddev/stdvar `by ()` identically, with the same VictoriaLogs requests (semantics/drop-error-pipeline-spellings pins the spellings against Loki)'
    quality: 'The outer-grouping and drop-error routes read the plan; the other resolved attributes are read in tests only.'
    performance:
      tracked: ['BenchmarkResolve ns/op, B/op, allocs/op', 'TestResolveAllocLocks: one allocation per pipeline plus the rule list']
      bound: 'Resolve on the seed plans (2026-11-08, M5 Pro, GOMAXPROCS=4, count=5): 34 ns/op, 108 B/op, 1 alloc/op, against 152 ns and 2 allocs for Build'
  - id: lowering-shadow-harness
    chosen: 'internal/queryplan/lower turns a resolved plan into the physical operators (lower.Plan with a Profile: capabilities, label translation, stream fields, keep-line); a construct it does not lower yet returns NotLoweredError naming the construct (errors.Is ErrNotLowered) and the string translator answers. TestPlanShadow runs every plan-corpus row under the 12 translator profiles and compares the lowering with the operators the string translator''s output decodes to, by structure (parsed LogsQL with default spellings folded, and the operator tree); the shadow section of query-plan.json gates mismatches at 0 and lets native rows only rise. The TranslateAST prototype, a second LogQL-to-LogsQL path no handler called, is deleted'
    over: [lowering inside internal/queryplan/physical, comparing LogsQL text, keeping TranslateAST as the native path, gating delegated counts]
    why: |
      Step six of architecture B (owner 2026-11-08). physical may import only
      the standard library and logsql, so the lowering is its own package with
      a depguard rule (stdlib, logql, logsql, queryplan, physical). Comparing
      operators instead of text lets the lowering spell LogsQL differently as
      long as VictoriaLogs reads the same query. TranslateAST covered part of
      the language with its own fall-through and its own tests; the shadow
      harness replaces it with one path held to the string translator on the
      whole corpus, so each later lowering step lands construct by construct
      with 0 mismatches. Delegated counts move with the corpus and are reported
      only. TestPlanShadowCatchesAWrongLowering proves the gate fails a
      lowering that answers a different query or adds a post-processing step.
    evidence: 'internal/querycorpus/plan_shadow_test.go TestPlanShadow; conformance/registry/query-plan.json shadow section (2026-11-08): 22,809 rows × profiles, native 0, mismatches 0'
    code: [internal/queryplan/lower/lower.go, internal/translator/ast_translate.go, .golangci.yml]
    tests: [TestPlanShadow, TestPlanShadowCatchesAWrongLowering, TestPlanDelegatesEveryConstruct]
    quality: 'No handler reads the lowering yet; every query is still translated by the string translator. The shadow holds the lowering to the string translator, the proxy''s own reading: from the first native construct, lowered queries are also checked against the VictoriaLogs oracle and, where the meaning is Loki''s, the Loki oracle, so the shadow does not lock in a translator misreading.'
  - id: route-parity-harness
    chosen: 'TestPlanRouteParity runs the real query handlers on every plan-corpus row under five request profiles (instant; range with step equal to, under and over the query''s range; a 24h chunk), each against a stub VictoriaLogs answering with data and empty, on a fresh proxy with every cache cold and windows pinned in the past. A run records its status, its VictoriaLogs requests and its route (the operations and rewrites of the request trace that the slow-query log already keeps). The route_parity section of query-plan.json gates mismatches at 0, lets native runs only rise, and holds one digest per profile and construct of every run''s status and route decisions, so a change that moves a route or a status fails until LVP_QUERY_PLAN_UPDATE=1 records it'
    over: [a new trace hook at each dispatch branch, gating the VictoriaLogs request sets, holding the stub's answers to order the races, a cache-on pass and moving the log-window cache onto cache.Now now]
    why: |
      Step seven of architecture B (owner 2026-11-08). The request trace of
      the slow-query log already records every route operation and rewrite,
      so the harness reads it instead of adding hooks. The VictoriaLogs
      request sets are recorded but not gated: on the concurrent probe routes
      (the json and logfmt metric risk probes, the detected_level derivation)
      the first answer cancels the other calls, so which of them reach
      VictoriaLogs varies run to run: 18-28 of 24,300 runs differed between
      two runs; holding each answer for 1 ms left 6-7, keeping only the calls
      whose hold ended uncancelled 44-51, since the tie only moves. The status
      and route decisions are stable (three runs and a -race run gave the
      same digests). The first native route step compares each probe group as
      a group. With windows in the past and every cache cold, no freshness
      rule reads the clock, so the cache.Now move and the cache-on pass wait
      for the step that keys the cache from the plan.
    evidence: 'internal/proxy/plan_route_parity_test.go TestPlanRouteParity; conformance/registry/query-plan.json route_parity section (2026-11-08): 2,430 rows, 24,300 runs, native 0, mismatches 0, statuses 200 23,749 and 400 551'
    code: [internal/proxy/slow_query_log.go]
    tests: [TestPlanRouteParity, TestPlanRouteParityCatchesAWrongRoute]
    quality: 'No handler reads a predicted route yet. VictoriaLogs request sets on the concurrent probe routes vary run to run in production too (which calls a probe race sends); recorded as a fleet-cost follow-up, not changed here.'
  - id: lowering-bare-selector
    chosen: 'The stream-selector filter builders move out of the string translator into internal/translate (stdlib, logql and logsql only), which the translator and the lowering both call: one builder, so the two cannot drift. lower.Plan lowers a log query with no pipeline stages to physical.VLQuery holding translate.StreamSelectorFilter, under every profile; a pipeline stays delegated (LogSelect pipeline), and route parity counts a lowered plan as delegated until the route rules land (LogSelect (route rule))'
    over: [an injected selector builder on lower.Profile, lowering line filters in the same step, giving translate its own sites category]
    why: |
      Step eight of architecture B (owner 2026-11-08). The design moves the
      builders the lowering needs out of the translator rather than handing
      them in, because the translator is deleted at the end; the moved code
      keeps its tests, the string paths call it directly, and ParseError and
      LabelTranslateFunc are aliases, so a selector error keeps its type and
      its Loki status. The moved strings and regexp calls count with
      translator_string_ops until they are typed. The lowered query is checked
      three ways: the shadow against the string translator (native 0 → 420
      of 22,809 rows × profiles, 0 mismatches), the VictoriaLogs oracle
      (VictoriaLogs' own parser accepts and reads the lowered and translated
      bare selectors alike, 176 rows on v1.49.0 and v1.53.0), and the Loki
      oracle (the stream matchers of the 2,097 corpus queries with one log
      selector under their aggregations equal Loki's tree, 0 differences; the
      other 330 of the 2,427 are binary operations and literals). The
      VictoriaLogs oracle ran locally and runs in the PR quality report.
    evidence: 'internal/querycorpus/plan_shadow_test.go TestPlanShadow and oracle_test.go TestVLOracle (typed-selector rows); internal/queryplan/loki_oracle_test.go TestPlanMatchesLokiOracle; conformance/registry/query-plan.json shadow section (2026-11-08)'
    code: [internal/translate/selector.go, internal/queryplan/lower/lower.go, internal/translator/ast_translate.go, test/oracle/loki/facts.go, .golangci.yml]
    tests: [TestSelectorFilterMatchers, TestPlanLowersBareSelectors, TestPlanDelegatesEveryConstruct, TestPlanShadow, TestVLOracle, TestPlanMatchesLokiOracle, TestPlanRouteParity]
    quality: 'No handler reads the lowering yet. The open selector difference (semantics/stream-label-selector-shadowed-by-ingest-json-key) changes the filter of every query on such a label and stays its own change: the shadow requires the lowering to equal the string translator.'
  - id: binary-handlers-read-physical-operands
    chosen: 'The binary-expression handlers carry each operand as its physical operator (translator.DecodePhysical, once per side) instead of its text: a ScalarOp is a number, a Binary a nested expression evaluated from its operands, operator and matching, and any other operator is sent to VictoriaLogs as the text the translator wrote (EncodePhysical, its exact inverse). IsScalar, the __binary__ prefix test and ParseBinaryMetricExprFull leave the handlers'
    over: [translating the whole query once and reading its operands, rebuilding the operands from the LogQL tree, evaluating a Fold or LabelMap operand natively]
    why: |
      Step nine of architecture B (owner 2026-11-08). The codec is the one
      sanctioned reader of the translator's text until the lowering produces
      the operators, so the handlers stop reading markers: lowering_marker_reads
      34 → 25. Each side is still translated from its own text (the AST's
      String), because translating the whole query and taking its operands
      would change the operand text on the rows whose reprint differs; that is
      a step with its own route proof. A Fold or LabelMap operand (78 of the
      570 corpus operands) is sent as its text as before: those queries are
      served by the binary-aggregation and range-metric routes. A nested
      expression's matching is empty, not nil, without modifiers, as the text
      reader answered.
    evidence: 'internal/proxy/binary_operand_test.go TestBinaryOperandsReadLikeTheirText (570 operands: 332 VLQuery, 142 ScalarOp, 72 Fold, 18 Binary, 6 LabelMap); route parity digests unchanged; route-parity dumps of three base runs and two PR runs: the 66 runs whose VictoriaLogs requests differ are all `| json`/`| logfmt` metric queries (none a binary expression) with identical status and route steps, the concurrent probe routes on which three base runs already differ among themselves (46 runs) (2026-11-08)'
    code: [internal/proxy/metric_binary.go, internal/proxy/query_translation.go, internal/proxy/metric_agg.go]
    tests: [TestBinaryOperandsReadLikeTheirText, TestBinaryMatchingOfNestedExpressions, TestPlanRouteParity]
    quality: 'Behaviour-neutral: the requests and answers do not change; the operands are still the string translator''s.'
  - id: stats-handlers-read-vlstats
    chosen: 'Each producer of a translated stats query decodes it once (translator.DecodeStats: the stats verdict and the shape of the first stats pipe, as text) and passes physical.VLStats down: the range and instant handlers and the two post-aggregation paths hand it to proxyStatsQueryRange, proxyStatsQuery, handleStatsCompatRange, nativeMathTumblingStatsCompatible, handleStatsCompatInstant and proxyRankedTopKRange, which read its fields instead of re-reading the text. The readers (isStatsQuery, parseStatsCompatSpec) move verbatim into the translator''s codec; three paths that rewrite the query as text before reading it keep thin wrappers over it'
