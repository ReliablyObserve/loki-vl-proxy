  - id: label-filter-control-bytes-plan-keeps-value
    pending: true
    chosen: 'The query plan keeps a label filter value that holds the string translator''s \x02 stage mark as written, and the string translator''s cut of it is recorded as a known divergence recognised by content (translatorReadsStageMarker, internal/queryplan/lower), a registry case with Loki''s recorded answers (semantics/translator-reads-marker-bytes-in-quoted-value, pending) and a seed, instead of a change to the lowering: the value is what Loki compares, the order of the stream copy is a side effect of the same cut, and the translator is the frozen reference. FuzzLabelFilterAfterParserLowering leaves out a query with a json or logfmt parser and an `_extracted` filter in which a label filter stage with no `_extracted` filter of its own holds two \x02 bytes in its decoded values.'
    over: ['changing the lowering to write the translator''s cut (the filter would match other rows than Loki''s: `o=""` keeps the rows without the label, `o="\x02\x00\x02"` the rows that hold the bytes)', 'delegating the shape to the translator under a named construct (the plan''s text is the right one and the translator serves parser queries today anyway; a delegation would keep the wrong answer after the flip)', 'changing the translator to use another mark (it is frozen as the shadows'' reference; the fix lives in the plan path)', 'leaving every \x02 byte out of the fuzz inputs (a single byte, the \x00 and \x01 bytes and the stages with an `_extracted` filter of their own are read as text and stay under test)']
    why: |
      Step 30 (owner 2026-11-11), found by the fuzz target of the label
      filters after a parser. The translator brackets the names an
      `_extracted` filter reads with \x02 in the text of its stage and later
      takes the first pair of \x02 bytes of every stage with no mark of its
      own for such a bracket, so a value that holds two of them is cut out of
      the query (`o:=""`) and the stream copy is written where the bytes were.
      Two differences came out of it: the value and the position of the
      copy. The copy's position is the cut's side effect: the same query with
      one \x02 byte is byte for byte equal. The value is a different
      filter: Loki's pipeline keeps the rows that hold the bytes and the
      translator keeps those without the label. VictoriaLogs reads a quoted
      token with strconv.QuotedPrefix and strconv.Unquote, so the plan's raw
      bytes are those bytes. Queries with a parser are served by the translator
      today, so the proxy answers the cut filter for them until they are
      served from the plan; filter-only queries are not affected, so no served
      answer changes and no response key fence is needed.
    evidence: 'TestMarkerBytesInLabelValueMeanWhatLokiMeans: 32 recorded Loki answers (test/oracle/loki process, Loki 3.7.9: four values x `=` and `!=` x a row that holds the value, an empty label, no label and the value plus a byte), the plan keeps the rows Loki keeps on all 32, the translator''s text keeps other rows on 20; TestTranslatorReadsStageMarker; the probe grid (value of one to three bytes of \x00, \x01 and \x02, in a pre-parser stage, with and without an `_extracted` filter in the same or another stage, json and logfmt, filter-only queries; 618 queries x 2 profiles): 78 differ, all with two \x02 bytes in a stage with no `_extracted` filter of its own, none with \x00, \x01, one \x02 byte per stage or filter-only; seed control-chars-in-label-value fails on main (`o:=""`, copy before the first filter) and is left out by the recogniser; TestPlanShadow rows 22,956 -> 22,968 (the case''s request joins the corpus: 12 rows known divergence semantics/translator-reads-marker-bytes-in-quoted-value, native unchanged, mismatches 0; the logical key section 2,479 -> 2,480 rows), TestPlanRouteParity 2,440 rows, 24,400 runs, native 0, mismatches 0, the LogSelect digests re-recorded for the one extra row; FuzzLabelFilterAfterParserLowering 90 s 699,327 execs and FuzzLabelFilterLowering 90 s 1,549,976 execs, no finding left (with local guards, not committed, for the findings listed under quality); the VictoriaLogs oracle (TestVLOracle) could not be built here (the module does not provide lib/logstorage in a fresh module cache, with the GOPRIVATE setting the runner uses), so VictoriaLogs'' reading of the raw bytes is from its lexer source (lib/logstorage/parser.go, v1.53.0), not run; internal/translator and internal/translate: empty diff against the base (2026-11-11)'
