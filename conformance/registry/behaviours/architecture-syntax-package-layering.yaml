  - id: route-rule-offsets
    pending: true
    chosen: 'lower.Route also decides a range aggregation or a vector aggregation over one whose range carries an offset (MetricRoute.Offset). The handlers cut the offset clause out of the query text, move start and end (or time) back by it and stamp the samples at the times asked for, so the route is the one the query has without the clause on the moved bounds; the rule adds only the shift, and the route parity harness shifts the predicted request by it. Route needs the request''s end (RouteRequest.End) for an offset other than zero, because the handlers write a moved bound as integer nanoseconds and read it back by its magnitude (from 1e18, September 2001, as nanoseconds; smaller as seconds, milliseconds or microseconds) in int64 (to April 2262), and take steps past the end: a move that leaves the times they read back as written, the end plus the step and the range included, is delegated as "<kind> route offset bounds". An offset of zero needs no end. The handlers read the clause with a regular expression over the query text, which the plan does not copy: a query their request rewrite changes (a comment, an upper-case keyword) is "<kind> route rewrite", and one whose text has the expression''s shape where the plan has no offset (a line filter), or counts range brackets another way (a line filter with a bracket), is "<kind> route offset text".'
    over: ['routing the offset query by a rule of its own (the route is the one without the clause: only the shift of the request differs, so a second rule would repeat the first)', 'predicting the handlers'' misreadings of the clause (a line filter cut by the expression, a range bracket in a line filter that makes one offset a 400, the handlers'' step loops wrapping past int64): the plan does not copy them, the harness delegates the text cases and the rule delegates the moves it cannot hold', 'a bound of one year or one decade on the offset (the real limits are the readers'' magnitude thresholds and int64, which the probes found exactly; a round number would delegate offsets the handlers answer as predicted)']
    why: |
      Route parity delegated every query with an offset under one name per root ("RangeAgg route offset" 790 runs, "VectorAgg route offset" 340)
      although the handlers' route does not depend on it beyond the request's bounds. Probing the shapes through the handlers found
      the limits of that equivalence: with a moved bound earlier than 1e18 nanoseconds both instant and range requests mismatched
      (two readers are involved, one switching its magnitude reading at 1e17 and one at 1e18, so the rule uses 1e18), and a moved end
      at the last second of int64 breaks the handlers' step loops, so the end must leave room for a step and a range.
    evidence: 'TestPlanRouteParity (CI=1, 2026-11-12): native 5,716 -> 6,226 of 25,070 runs, mismatches 0, route digests and statuses byte-identical to the base''s. Delegations: RangeAgg route offset 790 -> 0 and VectorAgg route offset 340 -> 0; 510 runs now native, the other 620 named by what else keeps them delegated (RangeAgg route pipeline +180, RangeAgg route unwrap pipeline +330, VectorAgg route pipeline +10, VectorAgg route unwrap pipeline +90, VectorAgg route rewrite +10). TestMetricRouteOffsetEdges: 51 shapes the corpus lacks (every window kind on counts, rates, byte functions, absent_over_time and the unwrap functions, zero, negative, sub-second and compound offsets, 20 years back and 190 forward, vector levels, a without clause, delegations by name, comments, upper-case OFFSET, line filters shaped like a clause or a bracket) each equal the handlers'' route on five profiles and both stub answers, or are delegated by the name asserted. TestMetricRouteOffsetBounds: 76 runs at one nanosecond either side of the early edge for each of seven shapes and three spans, and ten minutes either side of the late edge, 0 mismatches. TestMetricRouteCatchesAWrongDecision: two new mutations (offset dropped, offset read the other way) each mispredict exactly the runs whose prediction they change. TestRouteDecidesTheWindows: 27 new rows (the offset on every window kind, zero, both edges at one nanosecond for an instant and a range request, the delegations); FuzzRoute 60 s with an end argument and offset seeds and the invariants (the routed offset is the range''s, and its moved bounds fit), no finding. The rule only predicts the handlers'' route: it adds no query text and no Loki behaviour.'
