  - id: lowering-rate-detected-level-chain
    pending: true
    chosen: 'The builders of the detected_level derivation (BuildDetectedLevelChain and the stored-level, filter and keyword builders, about 1,200 lines, with the memo of the chains) live in internal/translate; internal/translator forwards to them under the names the proxy calls (type aliases, constants, one-line wrappers), so its output is byte-identical. DropCondition reaches BuildStoredLevelCopyFilter through the translate.LevelCondition interface (a generic parameter, no copy of the slice) and FirstTopLevelPipe moved with the chain; StreamLabelNames and the probe constant are shared by the lowering. lower.Plan lowers rate and bytes_rate over a log query that lowers natively (no parser, no unwrap, no grouping, no drop or keep, no detected_level filter) as the string translator writes them: the filters of the metric row''s log query, the chain once (translate.RateDetectedLevelChain, built once), the restore of the stream labels, the query''s other pipes, then typed stats pipes (translate.RateStatsPipes: stats by (_stream, level, detected_level) count() or sum_len(_msg) as __lvp_inner, math __lvp_inner/<seconds> as __lvp_rate, stats by the same keys sum(__lvp_rate)). VictoriaLogs still groups and sums per step bucket and the proxy never buffers rows. A range of no length is left to the translator. drop and keep stay delegated in a range aggregation (the translator writes them for a metric row unlike a log query: it deletes the level fields detected_level reads, and deletes level after a keep of detected_level)'
    over: ['a second writer of the chain in the lowering (two chains to keep equal)', 'copying the chain''s string calls into internal/translate while the translator keeps its own (the translator_string_ops ratchet would rise; moving it keeps the total at 674)', 'lowering a range aggregation over a detected_level label filter through BuildDetectedLevelFilter and JoinDetectedLevelFilters (the translator runs the chain once and the lowering would have to reproduce that text rule: still delegated)', 'lowering drop and keep inside a range aggregation by making the log query lowering take a metric mode (the shadow found the difference in one corpus row, and the grids had none: delegated until a grid and the rule are written)', 'a filter-pipe splice of raw text for the chain (the chain is a printed string the translator builds; the lowering prints the filters, the chain and the pipes in the order the translator''s insertion at the first pipe gives)']
    why: |
      Step 13, second part, of architecture B (owner 2026-11-09). A rate
      groups by the Loki series (the stream, its stored level and the
      detected_level Loki attaches to every entry), so the stats carry the
      chain that derives detected_level per row; the chain had to leave the
      frozen translator before the plan could write it, and the vector
      aggregations that group by the stream identity (step 14) need the same
      builder. The move is a pure forwarding: the string translator's output
      is held byte-identical by a dump of every corpus and grid row under
      the 12 profiles before and after (diff 0), plus the builders called
      over their argument matrices. The seconds of the division are the range
      the plan holds (Duration.Seconds, the number the translator formats
      from the range text); the grids cover the sub-second, compound, week
      and year spellings the translator''s own parser reads. No VictoriaLogs
      form changes, so the requests sent are the translator''s. The
      regexps in the lowered rate text are the stream-label restore''s two
      negated classes ([^=\x22] and [^\x22\\], no letters) and the chain''s,
