  - id: lowering-parser-labels
    pending: true
    chosen: 'lower.Plan lowers the metric queries whose labels the string translator reads from the text of the query, from typed data and the printed log query. (1) Parsed-key labels: a grouping or unwrapped label that is a plain identifier with an underscore behind a json or logfmt unpack (translate.ParsedLabelCandidate, not service_name or detected_level, not defined by the query: neither ` as <label>` nor `<label>` in the printed log query, searched without building the text) gets, ahead of the first stats pipe that reads it, one `format ... keep_original_fields` pipe per other spelling of the key (translate.ParsedKeyPipesText, from translate.ParsedKeyVariants), the `<name>_extracted` collision rename (translate.ExtractedStatsText: the keys unpacked again behind each plain parser into scratch fields, the first parser''s value picked, the label set where the entry has the stream label, the scratch fields deleted), and `filter <unwrapped label>:*` when a pipe resolved it or a copy pipe defines it. The sites are the translator''s: the stats pipe built with its grouping in hand (a rate, count, min, max and avg; an unwrap aggregation, after the bare logfmt unpack is narrowed to the labels it reads, spellings included) or a sum''s by clause; a count of one label behind its existence check is the Drilldown field breakdown, which the translator leaves as it is. (2) The series of a `without` fold over a parser (the innermost level, as the translator''s foldWithout): `_stream` plus the labels the parsers name (parsedSeriesLabels: json and logfmt extraction lists, a json alias of plain keys, regexp named groups, pattern captures, up to the unwrap), `_stream` alone when the set is not known (a bare parser, a logfmt alias, a flag, unpack, label_format, drop, keep, a negative line filter glued to a parser, level / detected_level / service_name / a stream selector label), and for an unwrap the outer stats group by the labels kept without the line (keepWithoutSeries). (3) The series of a rate, and of the one value per series of count, min, max and avg, behind a trailing keep (trailingKeepLabels: no matcher, only plain names, no parser, label_format, drop or unwrap after it; error labels left out): `stats by (<kept>)` through the label function, in place of the stream. Delegated with a construct name: a label filter or a drop after the parser under a resolved label, a fold over a parser or a trailing keep (`<owner> parser label cost`: the lowering of those stages allocates more than the translator spends on the same text, measured per shape over the allocation grid, the parserCostsMore precedent of the rankings), a keep that leaves no label (`<owner> keep identity`: an explicit `by ()`), a collision rename that reuses scratch fields a label filter computed or whose unpack pipes the text spells in quotes (`<owner> parser extracted label`), an existence check the printed query holds (`<owner> parser label filter`: a rate that sums a counted label behind its check, which the translator resolves in the middle of the query), and the nest over an unwrapped label (`VectorAgg nested unwrap`).'
    over: ['calling the translator''s resolveStatsKeys on the printed text from the lowering (a text rewriter inside the plan: the same bytes, but the plan would keep reading query text; the lowering reads the labels from the plan and searches the printed log query only for the names the query defines)', 'lowering a collision rename that reuses scratch fields by position (the translator finds them by the offsets of the unpack pipes in its text; delegated)', 'moving resolveStatsKeys and the extracted-label text builders out of the translator (the translator is the frozen reference and keeps its own text readers; only the pipes of a spelling are written by one function, translate.ParsedKeyPipesText, and the shadow holds the two to each other)', 'lowering the translator''s move of an existence check out of the middle of the query (only a label filter after the parser prints that check, and those shapes are delegated by cost; the printed query is searched for it and delegated)', 'lowering a nest over an unwrapped label (the nest builder has no unwrap builder yet; a follow-up)', 'an explicit empty grouping for a keep that leaves no label (the typed stats pipe has no `by ()`; the unwrap lowering writes it by text)']
    why: |
      Step 20 of architecture B (owner 2026-11-10). The constructs the string translator reads from the
      text of the query were the largest group the metric lowering still delegated: a `without` fold over a
      parser (513 rows x profiles), a grouping or unwrapped label with an underscore behind a parser (308 +
      180), and the series behind a trailing keep (63). Everything the translator reads there is data the
      plan holds: the labels a parser names, the keep list, the grouping and the unwrapped label; the only
      text it searches is the printed log query for a name the query defines, which the lowering searches
      the same way. The grid found four readings that differ from a plain port and that the lowering now
      follows: the translator narrows a bare logfmt unpack to the labels it reads before it resolves them (so
      the resolution finds no plain unpack pipe); a rate summed by labels resolves them a second time and
      finds the copy pipes the first resolution wrote; the Drilldown breakdown shape leaves a single
      counted label alone, but a rate that sums it resolves it in the middle of the query; and a negative
      line filter written after a parser belongs to that parser's stage in the translator's text, so the
      list of labels is not known. The allocation test found a fifth thing: the lowering of a label filter,
      a drop or a keep after a parser costs more allocations than the translator spends on the same text,
      so the shapes of this step that have one stay with the translator (the cost construct), as the
      rankings over a parser do.
