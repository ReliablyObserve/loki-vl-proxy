  - id: lowering-range-aggregations
    pending: true
    chosen: 'lower.Plan lowers a range aggregation root (count_over_time, bytes_over_time, absent_over_time) over a log query that lowers natively (stream selector, line filters, pattern filters, label filters; no parser, no unwrap): the log query is written as the string translator writes the inner query of a metric row (translateMetricInnerQuery: the label function alone, no capabilities, no stream fields, no kept line), then one typed stats pipe with no grouping (translate.RangeStatsPipe: count(), sum_len(_msg)). VictoriaLogs counts or sums per step bucket and the proxy never buffers rows. The offset and the range stay out of the text, as in the translator. A label function that carries the tenant''s stream labels adds the restore of their stream values before the first pipe (streamTagRestorePipes, typed pipes in the lowering, printed once per set of stream labels and shared). A selector that keeps every row (`{detected_level!="info"}`) is no filter beside other filters, as the translator writes it. rate and bytes_rate lower in the second part (lowering-rate-detected-level-chain); the unwrap functions, parsers, drop and keep, groupings and the kept-line profile stay with the string translator, named by construct'
    over: ['moving BuildDetectedLevelChain out of the string translator in this step (done in the second part, lowering-rate-detected-level-chain)', 'a copy of the chain in internal/translate (it would grow the translator_string_ops ratchet by its string calls and leave two writers of one chain)', 'returning physical.VLStats (the codec decodes a stats query as VLQuery, and the shadow compares the decoded operators)', 'lowering the by/without grouping that the parser accepts on count_over_time, bytes_over_time and absent_over_time (Loki rejects it; the translator ignores a by and appends a without marker, which the lowering would turn into a rule)', 'lowering a query whose quoted values the translator reads as syntax (" bool ", "without (": it rewrites them, so the lowering would differ from the reference; delegated as RangeAgg quoted clause, see lowering-rate-detected-level-chain), while other quoted text such as an unbalanced parenthesis is kept whole (TestPlanRangeAggregationKeepsQuotedValues)']
