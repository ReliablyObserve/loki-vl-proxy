    over: ['a separate pre-check of the query text for a comma before a closing parenthesis (it would read quoted text and need its own copy of the grammar)', 'leaving the comma accepted until the lowering reads the AST (Loki answers 400 and the plan would answer 200)']
    why: |
      Found by the Loki oracle on the binary-operation grid (step 42): Loki
      rejects `by (app,)`, `without (pod,)` and `on(app,)`, and the proxy
      answered them. The recorded grid of 916 queries (every list position of
      by, without, on, ignoring, group_left, group_right, json, logfmt, drop,
      keep and label_format against a trailing, doubled and leading comma, a
      lone comma, an empty list, white space and two names with no comma)
      showed 204 queries the proxy accepted and Loki rejects, 79 with other
      text, and the same grid after the change has none of either. The parser
      is the one place every route reads a query first, so the fail-fast rule
      (reject before the cache, the plan or VictoriaLogs) holds with no code
      on the routes: TestRejectedQueryNeverReachesVictoriaLogs counts zero
      requests. The compat edge looks its cache up before it validates, and
      its key already carries a version for every query the validation
      rejects (runeResponseKeyVersion), so an answer an older binary cached
