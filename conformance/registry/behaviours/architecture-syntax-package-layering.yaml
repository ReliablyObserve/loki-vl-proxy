    why: |
      Step 33 (owner 2026-11-11: "Outbound guard + plan fix", after the
      upstream report VictoriaMetrics/VictoriaLogs#1942). VictoriaLogs reads a
      bare _TIME (any letter case) as its own time filter and prints a quoted
      "_TIME" bare when it clones a query (lib/logstorage Query.Clone, print
