nOp bool: the translator drops it, the plan keeps it), two numbers, an operand that is a binary operation, vector(), label_replace, a ranking or a log query, a vector aggregation with a without clause (BinOp operand without: the translator folds the whole binary by it), an operand the range or vector aggregation lowering leaves out (BinOp operand RangeAgg / VectorAgg), the spellings above, a label_replace around a service_name grouping (the translator derives it twice), a NUL byte in a label_replace destination, replacement or source (the marker''s separator, which the proxy reads back as one), and more than 16 nested label_replace calls (LabelReplace nesting: the screen reads each call''s first argument, so its work grows with the length times the depth; a 120 KB query of 3,871 calls takes the screen 7 µs, the translator 435 ms).'
