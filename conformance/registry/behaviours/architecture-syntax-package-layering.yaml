  - id: lowering-range-call-blank-spelling
    pending: true
    chosen: 'lower.ScreenText turns away a range aggregation spelled with a blank, tab or newline between its function and the parenthesis (rate ({app="a"}[5m])), whether it stands at the top of the query, is an operand of a binary operation or is the first argument of a label_replace call, as the new delegated construct RangeAgg spelling (BinOp operand spelling and LabelReplace operand spelling for the other two places): the string translator finds the call with a regexp that does not skip blanks and writes the whole text as a phrase search, where Loki and the plan read the range aggregation. The screen is the leading name of the trimmed text followed by blanks and a parenthesis (paddedCall, the check the ranking screen already makes of its operand), which allocates nothing.'
    over: ['lowering the call as Loki reads it (a lowering that differs from the translator breaks the shadow and the flip''s byte-for-byte guarantee while metric queries are served by the translator)', 'changing the translator to skip the blanks (it is frozen as the shadows'' reference; the fix lives in the plan path)', 'a screen on every blank of the call (blanks after the parenthesis, around the selector and inside the range are read alike by both, and the grid asserts the screen turns away only the queries that differ)']
    why: |
      Step 25 of architecture B (owner 2026-11-10), found by the fuzz target
      of the ranking lowering: a bare range aggregation root, or a
      label_replace root or binary operand over one, spelled with a blank
      before the range function's parenthesis was lowered by the plan to a
      real query while the string translator wrote the whole text as a
      phrase search. No corpus row had the spelling, so the corpus shadow
      never saw it, and the text screen of step 14 screened only the blank
      padding of a vector aggregation's operand. Loki's parser accepts every
