  - id: lowering-escaped-spellings
    pending: true
    chosen: 'The logql scanner marks a double-quoted literal whose spelling is not the one strconv.Quote gives its value (an escape such as \x41, \101 or a Unicode escape, or a raw control character; one pass over printable ASCII with no backslash, which is nearly every literal, and the comparison with the quoting of the value on a stack buffer for the rest), and a back-quoted selector value; the parser carries the mark as Escaped on LabelMatcher, LineFilterStage and LineFilterAlt (no allocation, no struct growth: MatchOp is a uint8 so LabelMatcher stays 40 bytes, and the flag sits in padding of the other two). lower.Plan answers NotLoweredError "LogSelect escaped spelling" for the only two positions where the string translator copies the client''s spelling instead of quoting the value: a regexp line filter (|~ or !~) without an `or` chain, and an exact matcher that goes into the stream filter ({k="v"} on a stream field, translate.StreamFilterMatcher, the one decision SelectorFilter also uses). A stream-filter matcher is also delegated when the translator''s spelling of a value that Go''s quoting escapes (a tab, NUL, bell, DEL) differs from logsql.QuoteValue, which writes those raw. Every other position (substring and negated filters, `or` chains, pattern filters, label filters of every operator and ip(), field filters for labels that are no stream field, the not-equal and regexp matchers) quotes the value in the translator too, and stays native with any escape. The proxy needs no change: lowerLogSelect already falls back to the translator on NotLoweredError and the live shadow counts it as not_lowered'
    over: ['delegating every value written with a backslash (a regexp such as "\\d+" or "a\"b" is common and its text is identical)', 'storing the raw literal on the AST (16 more bytes on every matcher and line filter, for a text only these two positions read)', 'changing the translator to quote the value (frozen as the shadows'' reference; the client''s spelling is also what VictoriaLogs'' own tools show)', 'adding the flag to the logical key (the key decoder and FuzzKeyDistinctMutations treat spelling as not part of the key, and no cache keys a translation by it)', 'leaving it unfixed because VictoriaLogs reads both spellings alike (the flip''s proof and its CHANGELOG claim are byte identity)']
    why: |
      Found while re-probing the flip (v2.118.0, owner 2026-11-10): the claim
      that the lowering writes the translator's text byte for byte held on the
      corpus and the generated grids only because none of them wrote a value
      with an escape in these two positions. `{app="a"} |~ "\x41b"` was sent
      as `app:="a" ~"Ab"` where the translator sends `~"\x41b"` (all 12
      profiles), and `{app="\x41"}` as `{app="A"}` where it sends
      `{app="\x41"}` (the stream-field profiles). VictoriaLogs unquotes
      double-quoted strings with Go's rules, so both spellings are the same
      string and the answer did not change; the request text, and so
      the translation-cache entry and any request-keyed cache, did. The AST
      holds the value, as it must, so the plan has to know it cannot rebuild
      the spelling and leave those values to the translator until the
      translator itself is retired.
      The wider probe found one more case of the same kind: a back-quoted
      stream-field matcher (`{app=`a`}`), which the translator copies with its
      backquotes. It is delegated by the same rule.
      Not a registry case: no client-visible behaviour changed between v2.118.0
      and the fix (same results from VictoriaLogs), only the bytes of the
      request, which this row and the CHANGELOG entry record.
    evidence: 'escaped-spelling grid (6,076 queries: every escape kind, raw control characters, backquotes, in line filters (incl. ip(), `or` chains and pattern filters), stream selectors with and without stream fields, and label filters of every operator) x 12 profiles = 67,200 rows the translator writes: 58,168 lowered, 5,840 delegated as LogSelect escaped spelling, 0 mismatches; the same grid with the delegation disabled has 5,700 rows that differ from the translator''s text (TestEscapedSpellingGridShadow and TestLabelFilterGridShadow fail; the grid is also part of labelFilterGrid, so TestFlipScreenAdmitsEveryNativeRow covers it: 93,580 native rows admitted, 0 turned away); TestPlanShadow unchanged (22,926 rows x 12 profiles, native 1,764, 0 mismatches: the plan corpus holds no value with such a spelling, so no ratchet moved); row by row against the same grid with the delegation off, all 5,700 rows whose text differs are delegated, none leaks, and 140 rows that would have been equal are delegated too (a control character written raw inside a stream-field matcher, on 4 profiles: the flag cannot tell a raw tab from a \t escape, so the rule keeps to the safe side); TestPlanDelegatesAValueTheTranslatorCopiesAsWritten and TestPlanKeepsAValueTheTranslatorQuotes (the native side: any escape in a substring filter, an `or` chain, a label filter, a pattern filter, a not-equal or regexp matcher, a label that is no stream field, "\\d+" and "\"" in a regexp filter); TestQueryPlanLowering_EscapedSpellingStaysOnTheTranslator (`{app="a"} |~ "\x41b"` and the stream-field selector are translated as the translator does, counted not_lowered, never flipped; the plain spelling of the same query is flipped) and TestQueryPlanLowering_RouteParity rows (the escaped regexp rows fail without the fix: the upstream requests differ with the flag on and off); FuzzEscapedSpellingLowering (value in 7 spellings x 10 positions x with and without stream fields; 60 s, 201,836 execs, no divergence; Fu