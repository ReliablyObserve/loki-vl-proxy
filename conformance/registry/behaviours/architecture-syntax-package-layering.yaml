    chosen: 'lower.Plan lowers a binary operation (+, -, *, /, %, ^, ==, !=, >=, <=, >, <) between two operands it writes natively (a range aggregation rangeAgg lowers, a vector aggregation vectorAgg lowers with no without clause, or a number; not two numbers) to the physical.Binary the string translator''s `__binary__:<op>:<left>|||<right>` text decodes to: each operand is the query the lowering writes for it alone, a number is a ScalarOp written as strconv.FormatFloat(v, ''f'', -1, 64), and on, ignoring, group_left and group_right are the Matching and the modifier text (`@@@on:app, env@@@group_left:pod`, labels joined with ", ") the decoder reads, with Loki''s readings of on() (MatchOn, no labels) and ignoring() (an empty Matching). label_replace calls, nested ones too, around a range aggregation, a vector aggregation (a without clause included: LabelMap around the Fold) or such a binary operation lower to physical.LabelMap, the arguments innermost first, with the expression lowered under no capabilities and no stream fields as the translator writes it. The plan holds no text, so lower.ScreenText reads the query for the spellings the translator reads unlike the plan (screenBinOp, screenLabelReplace): a quoted string holding a parenthesis, bool, two blanks or a marker the translator writes; bool, without or two blanks anywhere; modifiers spelled unlike the lowering''s text (or group_left/group_right without a parenthesis); no operator, or more than one, at parenthesis depth 0 with a blank on each side, counted as the translator counts it; a number spelled unlike FormatFloat; an operand the range and vector aggregation screens turn away; `label_replace (` with a blank. The operator tokens moved to internal/translate (BinaryOperatorTokens) and the modifier prefix to physical (MatchingPrefix); the translator reads both, byte for byte as before. Delegated with a construct name: and, or, unless (BinOp set operator: the translator writes the left operand alone), bool (BinOp bool: the translator drops it, the plan keeps it), two numbers, an operand that is a binary operation, vector(), label_replace, a ranking or a log query, a vector aggregation with a without clause (BinOp operand without: the translator folds the whole binary by it), an operand the range or vector aggregation lowering leaves out (BinOp operand RangeAgg / VectorAgg), the spellings above, a label_replace around a service_name grouping (the translator derives it twice), a NUL byte in a label_replace destination, replacement or source (the marker''s separator, which the proxy reads back as one), and more than 16 nested label_replace calls (LabelReplace nesting: the screen reads each call''s first argument, so its work grows with the length times the depth; a 120 KB query of 3,871 calls takes the screen 7 µs, the translator 435 ms).'
    over: ['lowering bool with Bool false as the legacy encoding writes it (the plan reads bool; Canon compares it, and the proxy evaluates the operation from the LogQL anyway)', 'emulating every whole-text regexp of the translator (bool, vector matching, the without fold, the blank fold) inside quoted strings (one conservative quote guard leaves those rows to it)', 'lowering a without operand as the Fold around the whole binary the translator writes (the translator folds the binary by the operand''s labels, a reading the plan does not share)', 'rendering the modifier text from the client''s spelling (the plan holds none; the screen turns away any other spelling)', 'writing the double service_name derivation under label_replace (a second, redundant set of pipes the plan would copy)', 'a typed Binary operator over the operands'' VLStats evaluated by the proxy (the proxy evaluates binary operations by running each operand through its own handler; that is the proxy-evaluated route step)']
    why: |
      Step 16 of architecture B (owner 2026-11-10). The string translator
      writes a binary operation as one marker text and the proxy decodes it
      into physical.Binary; label_replace is a marker the proxy reads after
      the query and applies to the answer. Both are byte-comparable in the
      corpus shadow, so the lowering writes them from the typed plan and the
      shadow holds every native row to the translator's text. For a binary
      operation the text is today the gate of the whole-query translation and
      the source of its markers: the proxy evaluates the operation by
      re-dispatching each operand's LogQL through its own handler
      (binaryExprForRequest), so a native BinOp row proves the codec and the
      composition, not the requests VictoriaLogs receives for the operands
      (each is a RangeAgg or VectorAgg row of its own). The label_replace
      marker carries behaviour: the proxy reads the specs from it. The
      translator reads the whole text with regexps and scans that ignore
      quotes; the grid and the fuzz target found the readings the screen
      leaves to it, and one more: a NUL byte in a label_replace argument is
      read back by the proxy as the marker's separator.
