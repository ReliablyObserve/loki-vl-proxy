    over: ['writing the translator''s stddev and stdvar text (it is never sent: the proxy evaluates both in its post-aggregation route over the operand''s series, and the text drops the aggregation under a grouping, so a byte-identical lowering would reproduce a wrong query)', 'composing the outer levels over the unwrap lowering (its stats are built inside unwrapQuery with the gate, the conversion and the markers; a nest over an unwrapped label is its own step)', 'lowering a without level with no label (the translator''s clause regexp needs one and leaves the text as it is)', 'a second copy of the label rule in the lowering (the rule moved to translate.LevelKeeps and the translator forwards to it)']
    why: |
      Step 19 of architecture B (owner 2026-11-10). The nest is the
      largest construct the vector aggregation lowering left to the string
      translator. The translator writes it as one text of stacked stats
      pipes, so it is byte-comparable in the corpus shadow, and each level
      above the first needs only the labels its input series have, which
      Loki's VectorAggEvaluator defines and the translator already applies
      (it moved to translate.LevelKeeps, with intersect and subtract, and the
      translator forwards to it). stddev and stdvar are not a query: the
      proxy folds the operand's series per step (population variance,
      Welford) and never sends the translator's text for them, so they stay
      delegated until a typed post-aggregation operator carries them
      (follow-up). The lowering found no reading of the nest that differs
      from the translator's on the grid, including the quoted text, the
      blank spellings and the clauses at every level.
