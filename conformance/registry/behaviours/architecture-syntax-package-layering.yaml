    chosen: 'lower.Plan lowers sum, count, min, max and avg, with a by clause, a without clause or none, over a range aggregation that lowers natively (count_over_time, bytes_over_time, absent_over_time, rate, bytes_rate over a log query with line, pattern and label filters and no parser), as the string translator writes them. The metric row''s log query is the range aggregation''s (metricLogQuery, shared with rangeAgg). A sum groups the stats by the clause''s labels only (a rate first counts per those labels and divides by the range''s seconds); count, min, max and avg read one value per Loki series, so an inner stats groups by the clause''s labels then the stream identity (_stream, level) and the outer stats aggregates __lvp_inner (or the divided __lvp_rate; count skips the division). A stats that groups by both the stream and its level also groups by detected_level (the translator''s rewrite, done on the typed keys). service_name in a grouping adds translate.ServiceNameGroupingPipes (coalesce from v1.51, format pipes before) and detected_level the chain (translate.RateDetectedLevelChain), inserted before the log query''s first pipe, the chain in front of the service name''s pipes and the stream-label restore after both. A without clause writes no grouping for a sum of a count and the series (_stream, level) for the rest, and the result is a physical.Fold with the operator and the labels as the client wrote them, which is what the translator''s __without__ marker decodes to. The label function runs once on each grouping label (translate.NormalizeByLabels); the builders moved to internal/translate (ServiceNameGroupingPipes, NormalizeByLabels, JoinByLabels, RangeRowFunc, RateDivision) and the translator forwards to them with the same output and the same allocations. Delegated with a construct name: stddev and stdvar, an operand that is not a range aggregation, the cases rangeAgg delegates (unwrap, parser, drop and keep, range-level grouping, detected_level label filter, other stages, a range of no length, keepLine), a without clause with no label, a grouping label the label function removes, and a query whose text the translator reads as syntax (a without, a bool, a ||| or a | stats in a quoted value, two blanks in a value under a without, a by label named bool), and a blank between the operand''s parenthesis and the range function or between the function and its parenthesis (the translator writes the whole query as a phrase; the plan holds no text, so lower.ScreenText / PlanQuery turn the query away as VectorAgg operand spelling, and a metric wrapped whole in parentheses or an operand that is itself parenthesized (the same defect: a phrase) as parenthesized or operand spelling; the live shadow calls it before the lowering). The same quoted-text guard now applies to range aggregations, whose grid had not covered it.'
    over: ['rendering the translator''s text from the nodes (the shadow compares text byte for byte since the flip)', 'lowering stddev and stdvar (the translator writes the operand''s stats or a binary with a square, and the proxy evaluates both from its own routes: a second reading of text the proxy still owns)', 'closing the Loki differences the typed plan could close (sum without over a count writes no series identity; without () collapses every series) in this step: either changes the bytes the translator writes, so it needs a flip with its own proof', 'a second writer of the service_name and detected_level rewrites that works on text (the lowering keys the typed stats pipes, the translator keeps its text pass)', 'a map for the repeat check of grouping labels (a linear scan over a caller array allocates nothing and the lists are short)']
    why: |
