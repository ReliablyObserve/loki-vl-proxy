      filter as syntax and so writes a different series identity for rate and for
      count, min, max and avg (and a sum for a rate that holds "| unwrap"). The
      lowering of those delegates now (RangeAgg or VectorAgg quoted clause).
      Handlers do not read the lowering for metric queries yet, so behaviour
      does not change.
