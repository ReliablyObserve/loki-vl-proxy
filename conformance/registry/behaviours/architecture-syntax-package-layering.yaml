    chosen: 'A log query whose pipeline is line filters, pattern filters and label filters (no parser or formatting stage; the plan construct LogSelect) is translated by lower.Plan and written by physical.Encode instead of the string translator, when -query-plan-lowering is on (default). The decision is made on the text before any plan exists: a query that does not start with a stream selector (every metric query) is turned away by its first byte, and logql.MayHaveNonFilterStage (one allocation-free pass over the text that skips quoted strings) turns away a query with a parser or formatting stage or a detected_level / service_name label filter; only then is the query parsed (parseLogQLExpr, so the request flow counts the parse), planned and lowered. Any error, a construct outside proxy.QueryPlanFlippedConstructs, or a panic (recovered, counted as panic) falls back to the string translator, which also stays the authority on rejecting a query. The text is the translator''s byte for byte: the logsql nodes the lowering builds print the translator''s spelling (AnyOfLower, and AndExpr / OrExpr with Lower, for the lowercase `or` and `and` the translator writes), TestPlanShadow and the generated label-filter grid assert physical.Encode(lower.Plan(...)) equals the translator text for every native row under the 12 profiles, and TestQueryPlanLowering_RouteParity sends the same queries through a fake VictoriaLogs with the flag on and off under seven profiles and compares the client answers and every upstream request. The legacy text writer moved to physical.Encode (translator.EncodePhysical wraps it) so the proxy writes the text without the translator. One options-to-lower.Profile mapping (loweringProfile) serves the flip and the live shadow, and one planning function (loweringPlan) holds the parse of both. The live shadow counts a flipped query as result=flipped and keeps comparing what stays on the translator. To keep the flip from costing allocations, logsql renders a query into one pooled buffer (appendTo on the hot nodes; String is unchanged) and the shared field-name normaliser skips its regexp for a name with no dot.'
