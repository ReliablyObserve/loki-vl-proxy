  - id: lowering-numeric-equality-after-parser
    pending: true
    chosen: 'lower.Plan writes `=`, `==` and `!=` against a number, a duration or a bytes size in a label filter after a `| json` or `| logfmt` parser as a numeric comparison, not as the exact text of the literal the string translator writes. Equality is the pair `field:>=v field:<=v` in one group, inequality is `field:* -(pair)` in one group (an entry without the label is dropped under both operators, as Loki drops it), and the bound v is the plain number of the literal, of nanoseconds (a duration in Go''s syntax) or of bytes (a size whose byte count is a whole number), because VictoriaLogs reads a bound by its own unit table and turns a bound it cannot read (`100us`) into a string range. The pair is written for each key a label can be stored under (joined with OR for both operators), for a stream label from its scratch copy and for a name_extracted label from its second unpack. A literal with no single reading in Go and VictoriaLogs (hexadecimal, octal and separators, whole days, weeks and years, a fractional byte count, an exponent too large for a plain number) stays with the string translator as `LogSelect label filter numeric equality literal form`. The shadows hold the lowering to the translator for every other construct; for these queries (lower.WritesNumericEquality) they record the row as a known divergence of the translator (semantics/label-filter-numeric-equality), delegated, not native.'
    over: ['copying the translator''s exact-text equality (`status:="200"` keeps 200 and not 200.0 or 2e2, and its `-status:="200"` keeps the entries without the label)', 'a range(min,max) filter (its parentheses are exclusive and the typed node prints no inclusive bracket form)', 'the literal as written as the bound (VictoriaLogs reads `100us` as text and `5y` by its own year, which turns the pair into a string range)', 'a proxy-side filter or a per-row parse (the metric rules do not allow raw rows, and VictoriaLogs compares numerically itself)', 'leaving the label filters after a regexp or pattern parser and the ones with no parser as the exact text in this change (they are written like the translator, and the no-parser ones are served)']
    why: |
      The 48 corpus rows (57 with the range aggregations) of a numeric
      equality after a parser were the one label filter shape the lowering
      left to the string translator because its text is a defect against
      Loki: Loki parses the value (a Go float, a Go duration, a bytes size)
      and compares numbers, VictoriaLogs' exact match compares text. The
      earlier note on the open case said no exact VictoriaLogs filter exists
      and that its number parsing rejects leading zeros, signs and
      exponents; the VictoriaLogs oracle (lib/logstorage, v1.49.0 and
      v1.53.0) shows the opposite for the range filters: they read all of
      them, and a duration and a size. So the plan writes the comparison the
      client wants and the differences left are those of the two parsers,
      listed in the case and held by the test both ways.
