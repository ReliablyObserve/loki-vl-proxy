ect `_time:="a"` as VictoriaLogs does (it reads the translator''s text back in handlers; registered as a looseness in TestParseReservedFieldNamesMatchVictoriaLogs)']
    why: |
      Step 31 (owner 2026-11-11: "follow best patterns for victoria logs
      here"). Loki reads _time, _stream, _stream_id and _msg as plain labels
      (the Loki oracle accepts them in every position and keeps a stream
      labelled _time with its label). VictoriaLogs keeps these names for itself:
      the VictoriaLogs oracle's new store command (lib/logstorage, the rows
      handed over as the Loki push API, OpenTelemetry and jsonline hand them,
      v1.49.0 and v1.53.0 agree) shows a stream label called so stored only as a
      tag of _stream, a field of the entry called _time, _stream or _stream_id
      dropped, jsonline's _time read as the timestamp, and a _msg label or
      metadata replacing the line; its parser reads `_time:`, `_stream:` and
      `_stream_id:` as its own filters bare in any case and quoted in lower case,
      and `_msg:` as the line. So the string translator's field filters were
      VictoriaLogs' parse error (a 400 on the served path, "failed to parse the
      log query"), or another filter that VictoriaLogs answered: `| _time >= 5s`
      returned every line of the window (a time range), `{_msg=~".+"}` every
      line with text, `{_msg="x"}` also the lines that are "x". The stream filter
      is VictoriaLogs' own model of these labels, and it reads a missing tag as
      the empty value, as Loki reads a missing label.
