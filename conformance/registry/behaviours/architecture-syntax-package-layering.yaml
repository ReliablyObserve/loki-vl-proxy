      (physical.Binary). absent_over_time written with an unwrap stage is lowered over the query without it. The
      quantile parameter is printed from the plan's typed value (logsql.Quantile); the translator copies the
      client's text, so the text screen (lower.ScreenText) reads the literal the way the translator does and
      delegates a parameter that is not the shortest form of its value (0.50, 5e-1).
