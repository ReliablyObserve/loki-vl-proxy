    why: |
      Step ten of architecture B, first part (owner 2026-11-08). The base query
      is sent to VictoriaLogs and goes into cache keys, which stay byte for byte
      until the key step, and the LogsQL AST keeps no offsets, so the base stays
      the original text before the stats pipe and the grouping stays text (a
      bucket key such as `_time:60000000000ns offset 1ns` is one entry). The
      typed Base and the typed query building (the design's string_reads −10
      and text_built −40) are their own step, gated by byte-identical keys.
      fieldBreakdownQuery, rankedSingleFieldQuery and
      preserveMetricStreamIdentity read text they rewrote first; they move with
      the typed query building. lowering_marker_reads 25 → 15; the moved reader
      counts in translator_string_ops (646 → 664), the translator's every
      strings call, and goes with the translator.
