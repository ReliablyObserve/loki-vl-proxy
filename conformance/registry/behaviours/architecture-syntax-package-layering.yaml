      parser word, quoted strings included. The lowering writes the same
      bytes from the typed nodes and reads the query text only to check
      that the translator would have read the same label and conversion
      (lower.ScreenText); where the two can differ it delegates under a named
      construct (unwrap spelling, quoted clause, grouping).
