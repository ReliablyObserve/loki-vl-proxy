      moved out of the translator, which forwards to it), then the stats pipes built from typed nodes. Group
      keys follow the translator's choices: a function alone groups by nothing or by its clause; first and last keep
      row_min or row_max per series and take the largest per group, by the stream and its level when no clause
      says otherwise; under a vector aggregation the series identity is the stream (the stream and its level
