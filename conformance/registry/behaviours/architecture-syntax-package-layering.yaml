    why: |
      Step 28 (owner 2026-11-10). Found by running the lowering fuzz targets
      for 60 s on main: FuzzParserLowering, FuzzExtractLowering,
      FuzzLabelFilterLowering and FuzzLabelFilterAfterParserLowering failed
      after 7 to 44 s on a label called or, OR or of. The inputs fell into
      four separate causes, each fixed where it lives:
      (1) VictoriaLogs rejects a bare not, in, contains_*, equals_common_case
      and options (and and/or right after another filter), and Loki accepts a
      label with such a name, so a client got a 400 ("failed to parse the log query") from `{not="a"}` and
      `{app="a"} | in="x"` on the served path. The plan quotes them (the
      translator stays frozen, a registered known divergence by content);
      (2) the proxy's LogsQL parser was stricter than VictoriaLogs for and, or
      and not as names, so the fuzz could not read the translator's valid
      text (`filter (OR:>=1 and ...)`, `delete not`); it reads them now;
      (3) the proxy's LogQL parser accepted 15 words of Loki's lexer as label
      names (Loki answers 400) and read them in lower case, so the plan and
      the translator wrote `of` and `OF` for `{OF="a"}`; ip and label_replace
      were read in lower case without a parenthesis (Ip became ip), which Loki
      does not;
      (4) the string translator mangles a query with a json expression for a
      key called or/and, or a label name holding detected_level, or a
      non-ASCII value it reads as a name (more fuzz findings, recorded by
      content).
      Served answers change: filter-only queries with a keyword label
      (400 -> Loki's answer), keyword label names in a selector or a list
      (answer -> Loki's 400, Breaking), Ip/Label_replace (the wrong field ->
      the right one). Error answers are never cached
      (compatCacheCaptureAllowed stores a 200 only), so (1) leaves nothing
      stale. For (3) and (4) the answers cached before the change would be
      reused: the compat edge looks its cache up before the handler validates
      the query, and the history windows and settled steps live for hours. A
      response key version (keywordLabelResponseKeyVersion, in all four
      response key sites) moves the keys of a query with an Ip/Label_replace
      spelling and of a query the parser now rejects for a keyword label.
