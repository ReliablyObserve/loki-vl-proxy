  - id: route-rule-binary-operations
    pending: true
    chosen: 'lower.RouteQuery decides a binary operation whose operands are range or vector aggregations, numbers or vector(n): the handlers translate the operation once, then evaluate each aggregation operand as a query of its own over the same request, so the route is the routes of the operands together (QueryRoute.Operands, each a MetricRoute decided by Route on the operand under the plan''s inputs), a number or vector(n) adds none, and the operation adds the translation it reads again (QueryRoute.Binary). The operation keeps the lowering''s delegations for the operator, a bool modifier, constant operands and operands that are not aggregations or numbers (binOpShape); an operand the rule does not route delegates the operation as "BinOp operand <the operand''s reason>". Four shapes the handlers read another way stay delegated by name: offsets that differ across operands, or only some operands carrying one ("route mixed offsets": the handlers answer these without the time shift, or 400 for distinct offsets); operands that read one log selector with a level probe over windows that differ on a range request ("route shared level probe": a window covered by an answer already cached is not probed again, so which request reaches VictoriaLogs depends on which operand runs first); an absent_over_time operand ("route absent operand": its own route, without the second translation); and, for every operation but an aggregation against a number, an offset that moves a bound off the step''s grid ("route offset step": the handlers align each operand''s moved bounds to the step). The harness reads the operands'' texts as the handlers hand them on (the operand''s printed form) and delegates a vector(n) the handlers do not read as one by the lowering''s text screen.'
    over: ['routing a binary operation by a rule of its own (its route is the operands'' routes: only the combination differs, so a second rule would repeat the first)', 'keeping lower.Plan on the whole operation before routing the operands (it lowers every operand a second time: RouteQuery lowers each operand once, in its route, and TestRouteQueryIsWhatTheLoweringLowers holds that Plan writes every operation the rule routes)', 'predicting the shared level probe of operands over one selector (the cache that decides it is read concurrently by the operands, so the recorded request varies run to run)', 'copying the handlers'' mixed-offset answer (it skips the time shift, which Loki does not: stays delegated)']
    why: |
      Route parity delegated every binary operation under one name ("BinOp (route rule)", 2,580 runs) although the handlers evaluate its
      aggregation operands as queries of their own. Probing the shapes through the handlers showed the route is the operands' routes
      together plus one more translation step, and found the limits of that equivalence: operands sharing a selector over different
      windows (the probe is cached across them), mixed or distinct offsets (the handler's own comment: no time shift), absent_over_time
      (its own route), and the step alignment of moved bounds on every route but an aggregation against a number.
    evidence: 'TestPlanRouteParity (CI=1, 2026-11-12): native 6,226 -> 7,538 of 25,070 runs, mismatches 0, route digests and statuses byte-identical to the base''s, and unchanged on a repeat run. Delegations: BinOp (route rule) 2,580 -> 0 and BinOp operand VectorAgg 50 -> 0; 1,312 runs now native, 1,318 named by what keeps them delegated (BinOp operand VectorAgg route unwrap pipeline 480, without empty 380, route unwrap rate 290, route mixed offsets 70, and smaller groups). TestMetricRouteBinaryEdges: 101 shapes the corpus lacks (every operator against a number on either side, groupings, without operands, vector(n) either side with matching modifiers, equal and unequal ranges so one request reads each operand its own way, group_left and group_right, unwrap functions, offsets that the step divides and does not, delegations by name, comments, vector (n) spelling, a line filter shaped like a clause) each equal the handlers'' route on five profiles and both stub answers, or are delegated by the name asserted. TestMetricRouteCatchesAWrongBinaryRoute: a dropped, added or forgotten request mispredicts exactly the runs it changes. TestRouteQueryComposesTheOperands: 54 rows. TestRouteQueryIsWhatTheLoweringLowers: every routed corpus operation lowers, and each operand''s route equals its printed form''s alone. FuzzRoute 60 s with binary seeds, no finding. Two harness gaps surfaced and fixed in the harness: the stub answer''s labels are unchanged (translate_stats_response_labels noop) for any by clause that holds level, not only by (level); and the harness reads each operand''s text. The rule only predicts the handlers'' route: it adds no query text and no Loki behaviour.'
