      row's log query uses no capabilities and no stream fields, so the
      lowering writes it with the label function alone and the requests sent
      to VictoriaLogs are the string translator's. The stats pipe is typed
      (no raw text), and the stream-label restore is built from typed pipes,
      so neither adds to the text-site ratchets. Order of delegation names:
      grouping and the stages the lowering does not write come before the
