  - id: lowering-label-filters-after-parser
    pending: true
    chosen: 'lower.Plan lowers the label filters of a log query after a `| json` or `| logfmt` parser to the text the string translator writes, byte for byte. A filter is a filter pipe of its own wherever it stands after the parser (a line filter that follows joins the previous one), and its label names every key the parser can have stored it under (translate.ParsedKeysOf: the label, each underscore written as a dot, the all-hyphen spelling; a filter that accepts the empty value joins the keys with a space, any other with OR, and `!=""` keeps the label''s own key), except a label the profile''s label translation maps, one with a dot, a hyphen or a leading underscore (`__error__`), and one a json stage defines. A leaf written as `alias<operator>` after `| json alias="x.y"` is rewritten to the key it reads, as the translator rewrites the stage text. A stream label read by a single-leaf filter after a parser is read from a copy made ahead of the parser (translate.StreamValueCopies, StreamValueFills, StreamValueDelete: `__lxsv_*`), and a label `x_extracted` is read from the second unpack of the key `x` into `__lxp*` scratch fields behind each parser, picked before the filter (translate.ExtractedFilter, ExtractedUnpack, ExtractedCoalesce, ExtractedDelete). The builders moved out of the translator or added to internal/translate; the translator forwards parsedKeyVariants and parsedKeyMatchesEmpty to them. Delegated, each with a named construct: a numeric, duration or bytes value compared with `=`, `==` or `!=` (the translator writes the string form of the number: a defect, fixed later as a recorded divergence), `detected_level` and `service_name` filters (derived), a stream label inside an and/or tree, a json extraction label in the form the translator tells apart by text (`| json a_b` against `| json a_b="a_b"`), an alias whose key the translator reads differently, a label named `extract` (the translator reads `extract ="x"` as an extract pipe, also without a parser), and `x_extracted` in a query whose parsers have flags or a field list (the translator reads their text as naming the labels they extract)'
    over: ['copying the translator''s numeric equality (the string form of a number is not what Loki compares)', 'a parsed-key lookup in the plan instead of the label translation function (the plan does not know the stored fields)', 'lowering the stream-label and name_extracted scratch pipes in a later step (they are the same text-order the filter pipe needs, and the corpus holds rows of both)']
    why: |
      Step 12c-2 of architecture B (owner 2026-11-09). The label filter is the
      construct most queries after a parser hold, so it decides how much of
      the log query path the plan can serve. Every text the translator writes
      is reproduced from the typed filter and the stages around it; the shapes
