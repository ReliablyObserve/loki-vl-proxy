    chosen: 'lower.Plan lowers topk, bottomk, sort and sort_desc with no by or without clause (`by ()` is none) over a range aggregation rangeAgg lowers (count_over_time, bytes_over_time, absent_over_time, rate, bytes_rate, and the unwrap functions behind a json or logfmt parser) to the operand''s own operator, and lower.ScreenText reads the query for the spellings the string translator reads unlike the plan (screenRank: a blank between the operand''s function and its parenthesis, a parenthesized operand, a ranking wrapped whole in parentheses, the unwrap stage read from the text). The translator writes no ranking text (no marker, no pipe, k is never written), so its text for `topk(3, rate(..))` is the text of `rate(..)` and DecodePhysical reads no ranking operator from it; the proxy reads the ranking from the LogQL (parseInstantMetricPostAggQuery, before any translation), translates the operand alone and ranks each step of the answer itself. Delegated with a construct name: a clause (Rank grouping: the translator groups the operand''s stats by the clause''s labels, or appends a `without` marker with no operator, where Loki ranks the operand''s series k per group, and the proxy does not send that text), an operand that is a vector aggregation, a ranking, a binary operation or label_replace (Rank operand VectorAgg / Rank / BinOp / LabelReplace: the translator writes the whole query as a phrase search), an unwrapped value with no parser (Rank operand unwrap: a ranking is an outer name to the translator, which then groups the unwrapped stats by the stream, where the operand alone groups by nothing), a label filter after a parser, and rate or bytes_rate over a parser (Rank operand parser: the lowering of those operands allocates more than the translator does for the text, by up to 21 allocations, the same excess the bare operand has; measured per shape over the rank grid with and without stream labels), an operand rangeAgg leaves out (Rank operand RangeAgg), and the spellings above (Rank spelling, Rank parenthesized). label_replace and a binary operation around a ranking keep their own delegations (LabelReplace operand Rank, BinOp operand Rank): the proxy does not route a label_replace around a ranking as a ranking (open case semantics/label-replace-around-ranking-and-vector), so the translator''s text for it carries no ranking.'
