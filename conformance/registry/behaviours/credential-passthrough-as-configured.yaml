id: credential-passthrough-as-configured
kind: semantics
title: Credentials Grafana sends reach VictoriaLogs only as configured, and never the log or a shared cache key

loki: |
  Loki ignores Authorization and cookies (verified on Loki 3.7.9 with
  auth_enabled: a bearer or basic credential next to a tenant changes
  nothing, without a tenant it is 401 "no org id"). Grafana's Loki data source
  can send basic authentication, a forwarded OAuth access token and OIDC ID
  token (Authorization, X-Id-Token), custom HTTP headers, allowed cookies and
  the signed-in user (X-Grafana-User with send_user_header); a TLS client
  certificate ends at the listener.

victorialogs: |
  VictoriaLogs (or a vmauth in front of it) may authorise per user from
  forwarded headers.

proxy: |
  applyBackendHeaders is the one place a client header reaches VictoriaLogs:
  only the names in -forward-headers (-forward-authorization adds
  Authorization), the cookies in -forward-cookies, and with
  -metrics.trust-proxy-headers the trusted identity headers and the
  basic-auth user name (X-Loki-VL-Auth-User). Requests that forward a
  credential carry its hash in every cache key and are never pushed to peers.
  The request log never writes a credential or the basic-auth user.

implementation:
  - internal/proxy/http_utils.go
  - internal/proxy/query_translation.go

decisions:
  - id: basic-auth-user-only-with-trusted-identity
    chosen: 'X-Loki-VL-Auth-User (the basic-auth user name) is sent to VictoriaLogs only with -metrics.trust-proxy-headers'
    over: [sending it on every request (before), dropping the header]
    why: |
      The user name is part of the client's credentials; the log already
      withholds it. Owner rule 2026-11-11: nothing a client sends reaches
      VictoriaLogs unless configured. The documentation already listed it
      with the trusted identity headers.
    evidence: 'TestCredentialPassThrough_AsConfigured fails on main ("basic, nothing forwarded": X-Loki-Vl-Auth-User sent) and passes here (2026-11-11)'
    code: [internal/proxy/http_utils.go]
    tests: [TestCredentialPassThrough_AsConfigured, TestDatasourceCompat_ForwardsTrustedUserAndProxyChainHeadersAndSeparatesAuthUser]
    quality: 'No credential in a VictoriaLogs request, the log or the disk cache unless a flag forwards it.'
    pending: true
