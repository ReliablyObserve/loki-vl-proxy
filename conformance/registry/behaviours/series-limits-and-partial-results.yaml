id: series-limits-and-partial-results
kind: limits
title: Series limits: error, or partial result with a warning

loki: |
  Above max_query_series (default 500) Loki fails the query with "maximum number
  of series (N) reached for a single query". Logs Drilldown requests get a
  partial result plus a warning instead. Above the resolution limit Loki returns
  400 before parsing. The limit counts the series of the answer, after an
  aggregation such as `sum without (...)` has folded them
  (limits/series-limit-error records the answer).

victorialogs: |
  VictoriaLogs truncates or returns everything depending on the pipe; it has no
  equivalent error and no warning channel.

proxy: |
  Truncating silently where Loki errors is a correctness bug: a chart quietly
  loses series. The limit must be operator-configurable and the error must name
  the flag. A `without` aggregation is read per stream and the limit applies to
  the folded answer, so a query whose answer fits the limit is not rejected
  because its streams do not.

  Documented difference from Loki's default: the proxy's built-in
  -max-stats-query-series is 1000, above Loki's max_query_series of 500,
  because the proxy answers faster than Loki and can afford more series per
  query. A query with 501 to 1000 series that answers Loki's 400 is answered,
  and Drilldown's partial result holds 1000 series. The published
  max_query_series is the enforced value. Setting 500 (the flag or the tenant
  limit) gives Loki's default. The default is sized against
  -backend-max-buffered-response-bytes: 1000 dense series over 1000 steps is
  about 40 MB of the 64 MiB default (limits registry, sizing).

  A Drilldown range answer over the limit is cut as Loki cuts it
  (-drilldown-series-limit-mode=loki, the default): the series met first,
  every one ending at the step where the first series past the limit
  appears; -drilldown-series-limit-mode=busiest keeps the busiest series over
  the whole range instead. Instant answers keep the busiest series.

decisions:
  - id: drilldown-series-limit-mode
    chosen: 'A flag, -drilldown-series-limit-mode=loki|busiest, default loki: Loki''s cut of a Drilldown range answer over the series limit'
    over: [the busiest series over the whole range as the only answer (before this), Loki's cut as the only answer]
    why: |
      Owner 2026-11-18. Loki (3.7.9 and 3.7.10, recorded with the engine
      oracle) stops a Drilldown range evaluation at the step where a series
      past max_query_series first appears and keeps the series it met
      first; a breakdown whose series all start at once shows one step.
      Loki parity is the default; operators who prefer full-range charts of
      the busiest series choose busiest. Both modes cost one ranked read
      (limit+1 values by line count, or by first line).

      Caches: every response cache keeps the answer as sent, cut and
      warning included (the handler's own range cache is written by the
      response rewriter after the cut, the served and peer caches capture
      the sent bytes), so a repeat is the cold answer byte for byte and
      reuse is unchanged. Rejected: keeping the cut time next to each entry
      (a second format every reader must know) and not caching partial
      answers (every repeat would ask VictoriaLogs again). The stats extent
      cache keeps VictoriaLogs' buckets and is cut per request. A
      multi-tenant merge and a binary union are cut where their own merged
      answer trips the limit; the tenants' or operands' answers end at or
      after that step.
    evidence: 'TestDrilldownSeriesLimitMatchesLoki: Loki 3.7.10 engine answers (testdata/loki_engine/drilldown_series_limit.jsonl.gz) at the limit and 1, 2 and 5 over, staggered and simultaneous series, three query shapes, range and instant, VictoriaLogs v1.49.0 and v1.53.0, both modes. VictoriaLogs v1.49.0, v1.53.0 and v1.54.0 (lib/logstorage via test/oracle/vl store and roundtrip, 2026-11-18): `stats by (f) min(_time) as r | sort by (r, f) | limit n` orders by time, not by the text of an RFC3339 value whose fraction varies in length; min(_time) is written as RFC3339 with trailing zeros dropped; both ranking queries survive the clone round trip (v1.49.0 and v1.53.0 through the handler steps of test/oracle/vl roundtrip; v1.54.0, whose last-N API was renamed, print and parse again before and after the limit pipe only)'
    code: [internal/proxy/manual_metric_budget.go, internal/proxy/metric_binary.go, internal/proxy/range_metric_compat.go, internal/proxy/sliding_window_stats.go, internal/proxy/quantile_histogram.go, internal/proxy/query_translation.go, internal/proxy/multitenant.go, internal/proxy/proxy.go, cmd/proxy/main.go, internal/config/limits.go]
    tests: [TestDrilldownSeriesLimitMatchesLoki, TestCutLokiResultAfter, TestSeriesKeptForLimit, TestSeriesLimit_LokiModeEveryRangeRoute, TestSeriesLimit_LokiModeSlidingWindowStats, TestOrderedJSONResultCacheRepeatsTheCutAnswer, TestSeriesLimit_LokiModeServedAndBinaryOperandRepeat, TestSeriesLimit_LokiModeExtentCacheKeepsTheCut, TestSeriesLimit_LokiModeMultiTenantMerge, TestSeriesLimit_LokiModePeerServesTheCutAnswer, TestSeriesLimit_LokiModeRankedRefresh, TestCutLokiResultAfterMatchesReference, TestLokiPointTimeNs, FuzzCutLokiResultAfterMatchesReference]
    quality: 'loki mode: the cut step, the points and, where every series appears at a different step, the kept set equal Loki''s; busiest mode: unchanged answers'
    performance:
      tracked: ['BenchmarkCutLokiResultAfter (only a Drilldown answer over the limit pays it; 1000 series x 60 points: 5.6 ms, 1.1 MiB, 1.2k allocs, read in place)', 'BenchmarkSeriesLimitDrilldownRangeRequest (loki vs busiest mode on one over-limit Drilldown request: allocations equal, the cut the only added work)', 'no VictoriaLogs call added: the ranking read changes its order, not its count']

implementation:
