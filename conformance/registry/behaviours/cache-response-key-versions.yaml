id: cache-response-key-versions
kind: data_quality
title: An answer cached before a semantics fix is never served after it
pending: true

loki: |
  Loki's results cache keys an entry by the query, the step and the time
  interval, and never serves partial or failed answers; it is not shared
  with older code that answered differently.

victorialogs: |
  Not applicable: the proxy caches its own Loki-shaped answers.

proxy: |
  Response cache keys (the compat edge key for query and query_range, the
  inner query_range key and the log window shape) carry version "fences":
  a constant appended when the query has a shape whose answer a fix changed
  (keep projection, ip() label filter, detected_level mutation, | json
  vector and bare metric labels, | logfmt presence). A fixed answer gets a
  new key, so entries cached before the fix — in memory, on disk or on peers
  running older code — are not served. One function builds the chain for
  every key (responseKeyFences); which fences apply, and their order, is
  explicit per key site. A fence screen reads every spelling the LogQL parser
  reads: keywords and function names in any case, `#` comments between tokens,
  letters that lower case to ASCII ones, names of any Unicode letters.

implementation:
  - internal/proxy/response_key_fences.go
  - internal/proxy/response_key_fence_text.go
  - internal/proxy/middleware.go
  - internal/proxy/proxy.go
  - internal/proxy/query_range_windowing.go
  - internal/proxy/unwrap_blank_fence.go

decisions:
  - id: unwrap-blank-spelling-fence
    chosen: 'A text fence (@unwrap-blank-spelling-v1) on a query with an unwrap, in any case, outside quoted strings and comments, that is not written `| unwrap ` with one space on each side; the folded keyword spellings (U+212A, U+0130) get no fence of their own'
    over:
      - 'no fence (an unwrap written `|<TAB>unwrap n` under rate, count_over_time or another function that needs no unwrap was answered 200 by the string translator, which read no unwrap, and that answer would be served from every cache tier after the plan began serving the spelling)'
      - 'bumping the stream-level-series or unwrap-dynamic-identity fences for the fold rune spellings (every lower case query those fences key would miss the cache once, for spellings no client sends)'
    why: |
      The plan now serves an unwrap written with other blanks with the spaced
      spelling's answer. Where the string translator failed such a query the
      old answer was Loki's 500 and never cached, but where it read no unwrap
      it answered 200 with another query's data. The fence keys every such
      spelling apart from what an older binary cached; a query whose every
      unwrap is written `| unwrap ` keeps its key. A keyword written with the
      Kelvin sign or U+0130 needs no fence: the request path now writes it in
      lower case before the key is built, so it reads the lower case spelling's
      entry, and no key holds the folded text any more.
    evidence: 'internal/proxy (2026-11-16): TestUnwrapBlankSpellingFence (16 spellings, the compat key carries the fence exactly for the ones spelled otherwise); TestResponseKeyFencesKeepTheirOldKeys and FuzzResponseKeyFencesMatchParsedTree (90 s) with the fence in the screens table, justified by the printed tree''s unwrap stages; TestKeywordFoldRunesShareTheLowerCaseCacheEntry (the folded spelling after the lower case one: 0 VictoriaLogs requests, the same answer)'
    code: [internal/proxy/unwrap_blank_fence.go, internal/proxy/response_key_fences.go, internal/logql/canonical.go]
    tests: [TestUnwrapBlankSpellingFence, TestResponseKeyFencesKeepTheirOldKeys, FuzzResponseKeyFencesMatchParsedTree, TestKeywordFoldRunesShareTheLowerCaseCacheEntry]
    quality: 'An answer cached for an unwrap spelled with other blanks before the plan served it is never served after; every other key is unchanged.'
  - id: unwrap-conversion-blank-fence
    chosen: 'A text fence (@unwrap-conversion-blank-v1) on a query with an unwrap, in any case, outside quoted strings and comments, followed by a conversion (bytes, duration, duration_seconds, in any case) written with a blank before its parenthesis, right after it or right before the one that closes it'
    over:
      - 'no fence (a vector aggregation over `| unwrap duration_seconds (d)` answered no series on main, and that answer would be served from every cache tier once the plan serves the spelling with Loki''s series)'
      - 'a fence decided from the parsed tree (the tree holds no spelling; a fence on every unwrap conversion would move the key of every such query, spelled the usual way too)'
    why: |
      The lowering's text screens are gone, so the plan serves an unwrap
      conversion written with a blank around its parenthesis with the answer of
      the spelling without it. On main some of these queries were answered by
      the string translator, which read the whole call as the label's name: a
      vector aggregation over one answered no series (status 200, cached). The
      fence keys every such spelling apart from what an older binary cached; a
      query whose every conversion is written `bytes(n)` keeps its key.
    evidence: 'internal/proxy (2026-11-18): TestUnwrapConversionBlankFence (10 spellings, the compat key carries the fence exactly for the ones spelled otherwise); TestPlanSpellingsMatchLoki (main answered `sum by (pod) (max_over_time({app="qd"} | logfmt | unwrap duration_seconds (d) [5m]))` with no series, the branch with Loki''s); the fence in the fenceScreens table (TestResponseKeyFencesKeepTheirOldKeys, FuzzResponseKeyFencesMatchParsedTree)'
    code: [internal/proxy/unwrap_blank_fence.go, internal/proxy/response_key_fences.go]
    tests: [TestUnwrapConversionBlankFence, TestResponseKeyFencesKeepTheirOldKeys, FuzzResponseKeyFencesMatchParsedTree, TestPlanSpellingsMatchLoki]
    quality: 'An answer cached for an unwrap conversion spelled with a blank before the plan served it is never served after; every other key is unchanged.'
  - id: one-response-key-fence-builder
    chosen: 'One function builds every key site''s fence chain, with the site explicit (compat query, compat query_range, inner query_range, log window shape); keys byte-identical to before'
    over: [three copies of the chain in the key builders, unifying the sites' orders and logfmt rule (would change keys and cold-start every cache tier fleet-wide)]
    why: |
      Owner-approved consolidated plan (2026-11-07), phase 1 step 1: one
      source for cache keys before the request plan derives them from the AST.
      The copies already differed — the compat query_range key appends the
      logfmt fence last and the compat query key not at all, the inner key
      places it after the bare-json fence — so the differences are kept and
      named rather than unified; changing a key is a deliberate, versioned
      step of its own.
    evidence: 'internal/proxy/response_key_fences_test.go (2026-11-07): 569 corpus queries (bench/ab/shapes.json, the semantics matrix, registry query/expr rows, 36 synthetic) x 3 request shapes, new equal to old at every site; a mutated site order is caught'
    code: [internal/proxy/response_key_fences.go]
    tests: [TestResponseKeyFencesByteIdentical, TestResponseKeyFencesSiteOrder]
    quality: 'Every response key byte-identical to before; every fence fires somewhere in the corpus test, so it cannot pass vacuously.'
  - id: fence-screens-read-every-parser-spelling
    chosen: 'Each fence screen reads the spellings the LogQL parser reads (keywords in any case, comments, U+212A and U+0130 for k and i, Unicode names, grouped label filters, back-quoted empty strings) with shared allocation-free readers, and keeps firing for every spelling its older form fired for'
    over:
      - 'leaving the lower case, single-space screens (a query spelled `| KEEP a` or `TOPK(` got the key of an answer cached before the fix)'
      - 'a case-insensitive regexp per screen (allocation free but slower, and blind to U+212A, U+0130 and comments)'
      - 'deriving every fence from the parsed tree now (the compat edge looks its cache up before validation, and a plan is memoised by text only up to a size cap)'
    why: |
      A fence is a text screen that runs before any parse, so any spelling it
      misses serves an answer cached before the fix it guards. Every fence
      on main missed some spelling the parser accepts: keep, unwrap, ip(),
      json, logfmt, topk and the aggregation words in upper or mixed case;
      a grouped label filter `| (a="b")`; an empty back-quoted string after `!=`; a `#` comment with a quote
      character in it, which made the quote-skipping screens read the rest of
      the query as quoted text; U+212A and U+0130 in keywords; Unicode letters
      in names. The screens now read those, and one fuzz target compares every
      fence with the parsed tree of a re-spelled query. The two fences added
      since (stream-level-series, unwrap-dynamic-identity) are held to the same
      test: the first missed topK and bottomK written with U+212A, the second's
      text screen in front of the plan missed a function name written with
      U+0130 (`avg_over_tİme`), which the keyword lower casing leaves as it is.
    evidence: 'internal/proxy/response_key_fence_parser_test.go (2026-11-15): FuzzResponseKeyFencesMatchParsedTree, 120 s clean on the fixed screens; the same test on main finds a miss in each of the ten fences it covers (detected_level is covered by its own change), and after the merge of main in the stream-level-series fence (U+212A in topk, bottomk) and the unwrap-dynamic-identity screen (U+0130 in its function names); every fence still fires for every query its older screen fired for over the key corpus (shapes, matrix, registry rows); BenchmarkResponseKeyFences, 8 interleaved runs on Apple M5 Pro, GOMAXPROCS=4: geomean -51% (every shape faster, allocations equal or fewer)'
    code: [internal/proxy/response_key_fence_text.go, internal/proxy/proxy.go, internal/proxy/keyword_label_fence.go, internal/proxy/reserved_field_fence.go, internal/proxy/reserved_field_case_fence.go, internal/proxy/ordered_json_vector.go, internal/proxy/ordered_json_metric.go, internal/proxy/range_metric_compat.go]
    tests: [TestResponseKeyFencesFireOnEverySpelling, TestResponseKeyFencesFireOnTheSpellingsTheParserReads, TestResponseKeyFencesKeepTheirOldKeys, FuzzResponseKeyFencesMatchParsedTree, TestResponseKeyFenceScreensDoNotAllocate]
    quality: 'A query whose parsed tree holds the construct a fence guards carries the fence in every spelling the parser reads; no key written by an older binary for a spelling it fenced becomes unreachable.'
    performance:
      - 'internal/proxy/response_key_fences_bench_test.go BenchmarkResponseKeyFences: the fence chain of 10 query shapes at the compat query_range and inner query_range sites; no shape slower than main (selector 158 -> 98 ns, rate by 350 -> 245 ns, json metric 7.6 -> 4.0 us)'
  - id: plan-fences-read-the-resolved-variable-text
    chosen: 'The fences that read the query plan (rank over binary, the without () binary operand, the dynamic unwrap identity, the count over stdvar_over_time) read the plan of the query with its Grafana range variables resolved (fenceVariablesResolved: the handlers'' own resolveGrafanaRangeTemplateTokens, no window or step), and the plan''s opaque node names its call (queryplan.Opaque.Func) so a label_replace the parser could not type is read as one'
    over:
      - 'reading the plan of the text as sent (a label_replace call that holds `[$__interval]` is an opaque node there, with no function name and no inner expression, and what it wraps is hidden: the keys of its ranking, without () operand, unwrap identity and count over stdvar answers did not carry the fence the `[1m]` spelling carries)'
      - 'resolving the variables in the key builder once for every fence (it would move what the text screens and the already resolving JSON and logfmt fences read, for a defect of the plan-reading fences only)'
      - 'changing the dynamic query text the handlers read (series_fold_read and the dynamic identity helpers read it unresolved, so it would change served answers, not only keys)'
    why: |
      The parser keeps a label_replace call whose first argument holds a
      Grafana range variable as text it cannot type, and the handlers resolve
      the variable before they answer, so the answer is the typed call's. The
      fences read the plan of the unresolved text. A query with such a call
      was served (200 through the routes) and cached, and the key lacked the
      fence of its `[1m]` twin, so an answer cached before the matching fix
      could be served again for up to the history cache TTL, to the same
      tenant. The fuzz target found it through a seed whose range the parser
      cannot read (`[$0]`, which Loki rejects), then through its variable
      twins. The resolution runs after each fence's text screen and only for a
      query that holds a variable (`$__` or `${`; a `$1` reference is none), so
      no other query's key or cost changes.
    evidence: 'internal/proxy (2026-11-18): TestResponseKeyFencesFireOnTheSpellingsTheParserReads (rows for each variable spelling and its must-not-fire twins; 9 of them and 8 fuzz seeds fail on main), FuzzResponseKeyFencesMatchParsedTree (seed ce0a2477f0b9df0a kept, 120 s clean), BenchmarkResponseKeyFences and BenchmarkRankOverBinaryFence base vs PR'
    code: [internal/proxy/response_key_fences.go, internal/proxy/rank_binary_fence.go, internal/proxy/binary_empty_without.go, internal/proxy/unwrap_count_variance.go, internal/queryplan/nodes.go, internal/queryplan/build.go]
    tests: [TestResponseKeyFencesFireOnTheSpellingsTheParserReads, TestResponseKeyFencesKeepTheirOldKeys, FuzzResponseKeyFencesMatchParsedTree]
    quality: 'A query whose label_replace call holds a Grafana range variable carries the fences its resolved spelling carries; every query without a variable keeps its key.'
    performance:
      - 'internal/proxy BenchmarkResponseKeyFences and BenchmarkRankOverBinaryFence (2026-11-18, Apple M5 Pro, GOMAXPROCS=4, count 6 and 10): no allocation or byte change on any shape without a variable; the shapes that hold a variable and pass a fence screen resolve it (a ranking over a binary label_replace: 0.42 to 1.06 microseconds, 2 to 11 allocations; an unwrap identity under label_replace: 4.2 to 4.9 microseconds, 18 to 29 allocations), work the fence did not do before and needs for the key'
  - id: ip-fence-reads-unknown-character-names-from-the-tree
    chosen: 'The ip() label filter fence keeps its text screens and, when a screen meets an ip( it does not fence (after an `=` whose name it does not read, or an `or` of a line filter chain), reads the memoised parsed tree (sharedLogQLExpr of the variable-resolved text) for an ip() label filter leaf, line filter or alternative; the fence version stays v5'
    over:
      - 'widening the text look-behind to every character that starts no token (another text screen that copies the lexer, where the tree is in hand)'
      - 'reading the tree for every query with the letters ip (zipkin, client_ip: a parse on the first key of each such query, 6 allocations)'
      - 'bumping the fence to v6 (every ip() query the screens already fenced would miss every cache tier once; the newly fenced keys never existed, so nothing is cached under them)'
    why: |
      Loki's lexer and the LogQL parser read one character that starts no
      token (a control character, one of $ & ; ? \ ~, a char literal, a
      non-ASCII character that is no letter) as a label name, so
      `| json | A="x" ;=ip("10.0.0.0/8")` holds an ip() label filter. The
      operator screen accepted only a name that ends in a letter, digit, `_`
      or `.`, so these queries built their keys without the fence, and an
      answer an older binary cached for them (memory, disk, peers) stayed
      reachable after an ip() fix. FuzzResponseKeyFencesMatchParsedTree found
      it. Same tenant and credential scope only: those enter the key outside
      the fence chain.
    evidence: 'internal/proxy (2026-11-28): TestIPFenceReadsALabelNamedByAnUnknownCharacter (15 character classes x 6 joins x = != and spaced = x ip and IP x log, grouped and metric queries, and under a binary operation, topk and label_replace with and without a Grafana range variable, as sent and as RequestQueryText; 1,191 distinct query texts carry no fence on main); TestExprHoldsIPFilter (the tree walk); TestIPFenceNeverServesAnAnswerCachedUnderTheUnfencedKey (main serves an answer seeded under its key with 0 VictoriaLogs calls, the branch answers again); fuzz seed ip-label-named-by-unknown-character; recorded Loki answers accept `A=1 and <char>=1` for every class (internal/logql/testdata/label_filter_number_literals_loki.jsonl.gz); local disk-cache restart main -> branch with VictoriaLogs v1.54.0 (the new spellings miss main''s entries, the controls hit them)'
    code: [internal/proxy/response_key_fence_text.go, internal/proxy/response_key_fences.go]
    tests: [TestIPFenceReadsALabelNamedByAnUnknownCharacter, TestExprHoldsIPFilter, TestIPFenceNeverServesAnAnswerCachedUnderTheUnfencedKey, FuzzResponseKeyFencesMatchParsedTree, TestResponseKeyFencesKeepTheirOldKeys, TestResponseKeyFenceScreensDoNotAllocate]
    quality: 'A query whose parsed tree holds an ip() filter carries the ip() fence whatever single character names its label; every key the screens wrote before is unchanged.'
    performance:
      - 'internal/proxy BenchmarkResponseKeyFences and BenchmarkResponseKeyFencesColdMemo (2026-11-28, Apple M5 Pro, GOMAXPROCS=4, base and branch test binaries interleaved, count 8): no allocation or byte change on any shape, warm or with a cold plan memo; no ns/op change beyond noise (the cold no-parser query with the letters ip 249 -> 263 ns, p=0.05); a query with the letters ip and no ip() call never parses for the key'
