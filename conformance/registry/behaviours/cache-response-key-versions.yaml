id: cache-response-key-versions
kind: data_quality
title: An answer cached before a semantics fix is never served after it
pending: true

loki: |
  Loki's results cache keys an entry by the query, the step and the time
  interval, and never serves partial or failed answers; it is not shared
  with older code that answered differently.

victorialogs: |
  Not applicable: the proxy caches its own Loki-shaped answers.

proxy: |
  Response cache keys (the compat edge key for query and query_range, the
  inner query_range key and the log window shape) carry version "fences":
  a constant appended when the query has a shape whose answer a fix changed
  (keep projection, ip() label filter, detected_level mutation, | json
  vector and bare metric labels, | logfmt presence). A fixed answer gets a
  new key, so entries cached before the fix — in memory, on disk or on peers
  running older code — are not served. One function builds the chain for
  every key (responseKeyFences); which fences apply, and their order, is
  explicit per key site. A fence screen reads every spelling the LogQL parser
  reads: keywords and function names in any case, `#` comments between tokens,
  letters that lower case to ASCII ones, names of any Unicode letters.

implementation:
  - internal/proxy/response_key_fences.go
  - internal/proxy/response_key_fence_text.go
  - internal/proxy/middleware.go
  - internal/proxy/proxy.go
  - internal/proxy/query_range_windowing.go
  - internal/proxy/unwrap_blank_fence.go

decisions:
  - id: unwrap-blank-spelling-fence
    chosen: 'A text fence (@unwrap-blank-spelling-v1) on a query with an unwrap, in any case, outside quoted strings and comments, that is not written `| unwrap ` with one space on each side; the folded keyword spellings (U+212A, U+0130) get no fence of their own'
    over:
      - 'no fence (an unwrap written `|<TAB>unwrap n` under rate, count_over_time or another function that needs no unwrap was answered 200 by the string translator, which read no unwrap, and that answer would be served from every cache tier after the plan began serving the spelling)'
      - 'bumping the stream-level-series or unwrap-dynamic-identity fences for the fold rune spellings (every lower case query those fences key would miss the cache once, for spellings no client sends)'
    why: |
      The plan now serves an unwrap written with other blanks with the spaced
      spelling's answer. Where the string translator failed such a query the
      old answer was Loki's 500 and never cached, but where it read no unwrap
      it answered 200 with another query's data. The fence keys every such
      spelling apart from what an older binary cached; a query whose every
      unwrap is written `| unwrap ` keeps its key. A keyword written with the
      Kelvin sign or U+0130 needs no fence: the request path now writes it in
      lower case before the key is built, so it reads the lower case spelling's
      entry, and no key holds the folded text any more.
    evidence: 'internal/proxy (2026-11-16): TestUnwrapBlankSpellingFence (16 spellings, the compat key carries the fence exactly for the ones spelled otherwise); TestResponseKeyFencesKeepTheirOldKeys and FuzzResponseKeyFencesMatchParsedTree (90 s) with the fence in the screens table, justified by the printed tree''s unwrap stages; TestKeywordFoldRunesShareTheLowerCaseCacheEntry (the folded spelling after the lower case one: 0 VictoriaLogs requests, the same answer)'
    code: [internal/proxy/unwrap_blank_fence.go, internal/proxy/response_key_fences.go, internal/logql/canonical.go]
    tests: [TestUnwrapBlankSpellingFence, TestResponseKeyFencesKeepTheirOldKeys, FuzzResponseKeyFencesMatchParsedTree, TestKeywordFoldRunesShareTheLowerCaseCacheEntry]
    quality: 'An answer cached for an unwrap spelled with other blanks before the plan served it is never served after; every other key is unchanged.'
  - id: one-response-key-fence-builder
    chosen: 'One function builds every key site''s fence chain, with the site explicit (compat query, compat query_range, inner query_range, log window shape); keys byte-identical to before'
    over: [three copies of the chain in the key builders, unifying the sites' orders and logfmt rule (would change keys and cold-start every cache tier fleet-wide)]
    why: |
      Owner-approved consolidated plan (2026-11-07), phase 1 step 1: one
      source for cache keys before the request plan derives them from the AST.
      The copies already differed — the compat query_range key appends the
      logfmt fence last and the compat query key not at all, the inner key
      places it after the bare-json fence — so the differences are kept and
      named rather than unified; changing a key is a deliberate, versioned
      step of its own.
    evidence: 'internal/proxy/response_key_fences_test.go (2026-11-07): 569 corpus queries (bench/ab/shapes.json, the semantics matrix, registry query/expr rows, 36 synthetic) x 3 request shapes, new equal to old at every site; a mutated site order is caught'
    code: [internal/proxy/response_key_fences.go]
    tests: [TestResponseKeyFencesByteIdentical, TestResponseKeyFencesSiteOrder]
    quality: 'Every response key byte-identical to before; every fence fires somewhere in the corpus test, so it cannot pass vacuously.'
  - id: fence-screens-read-every-parser-spelling
    chosen: 'Each fence screen reads the spellings the LogQL parser reads (keywords in any case, comments, U+212A and U+0130 for k and i, Unicode names, grouped label filters, back-quoted empty strings) with shared allocation-free readers, and keeps firing for every spelling its older form fired for'
    over:
      - 'leaving the lower case, single-space screens (a query spelled `| KEEP a` or `TOPK(` got the key of an answer cached before the fix)'
      - 'a case-insensitive regexp per screen (allocation free but slower, and blind to U+212A, U+0130 and comments)'
      - 'deriving every fence from the parsed tree now (the compat edge looks its cache up before validation, and a plan is memoised by text only up to a size cap)'
    why: |
      A fence is a text screen that runs before any parse, so any spelling it
      misses serves an answer cached before the fix it guards. Every fence
      on main missed some spelling the parser accepts: keep, unwrap, ip(),
      json, logfmt, topk and the aggregation words in upper or mixed case;
      a grouped label filter `| (a="b")`; an empty back-quoted string after `!=`; a `#` comment with a quote
      character in it, which made the quote-skipping screens read the rest of
      the query as quoted text; U+212A and U+0130 in keywords; Unicode letters
      in names. The screens now read those, and one fuzz target compares every
      fence with the parsed tree of a re-spelled query. The two fences added
      since (stream-level-series, unwrap-dynamic-identity) are held to the same
      test: the first missed topK and bottomK written with U+212A, the second's
      text screen in front of the plan missed a function name written with
      U+0130 (`avg_over_tİme`), which the keyword lower casing leaves as it is.
    evidence: 'internal/proxy/response_key_fence_parser_test.go (2026-11-15): FuzzResponseKeyFencesMatchParsedTree, 120 s clean on the fixed screens; the same test on main finds a miss in each of the ten fences it covers (detected_level is covered by its own change), and after the merge of main in the stream-level-series fence (U+212A in topk, bottomk) and the unwrap-dynamic-identity screen (U+0130 in its function names); every fence still fires for every query its older screen fired for over the key corpus (shapes, matrix, registry rows); BenchmarkResponseKeyFences, 8 interleaved runs on Apple M5 Pro, GOMAXPROCS=4: geomean -51% (every shape faster, allocations equal or fewer)'
    code: [internal/proxy/response_key_fence_text.go, internal/proxy/proxy.go, internal/proxy/keyword_label_fence.go, internal/proxy/reserved_field_fence.go, internal/proxy/reserved_field_case_fence.go, internal/proxy/ordered_json_vector.go, internal/proxy/ordered_json_metric.go, internal/proxy/range_metric_compat.go]
    tests: [TestResponseKeyFencesFireOnEverySpelling, TestResponseKeyFencesFireOnTheSpellingsTheParserReads, TestResponseKeyFencesKeepTheirOldKeys, FuzzResponseKeyFencesMatchParsedTree, TestResponseKeyFenceScreensDoNotAllocate]
    quality: 'A query whose parsed tree holds the construct a fence guards carries the fence in every spelling the parser reads; no key written by an older binary for a spelling it fenced becomes unreachable.'
    performance:
      - 'internal/proxy/response_key_fences_bench_test.go BenchmarkResponseKeyFences: the fence chain of 10 query shapes at the compat query_range and inner query_range sites; no shape slower than main (selector 158 -> 98 ns, rate by 350 -> 245 ns, json metric 7.6 -> 4.0 us)'
