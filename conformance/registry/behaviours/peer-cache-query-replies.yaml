id: peer-cache-query-replies
kind: resource_control
title: Completed query replies computed on one replica answer the same request on every replica

loki: |
  Loki's results cache is shared by every query frontend: a query_range,
  instant or series answer computed once is served again whichever frontend
  receives the same request (pkg/storage/chunk/cache/resultscache).

victorialogs: |
  VictoriaLogs keeps no answer a proxy replica can share: every request is
  evaluated again.

proxy: |
  compatCacheMiddleware keeps a completed query, query_range or series reply
  of 128 KiB or less in the per-replica edge cache and, under its key plus
  the routing scope, in the shared cache with SetWithTTL
  (storeCompatSharedReply): memory, the disk of each of the key's replicas
  and a write-through push to its owner. compatCacheLookup reads the edge
  cache, then the shared tiers (memory, disk, the key's replicas in ring
  order) under the same near-now freshness rule. A reply found there answers
  the request before the handler runs, so before the stats extent buckets,
  the settled steps and the log query windows.
  Fleet proof (TestFleetPeerCacheProof, e2e-fleet, 3 replicas): the
  window-evaluated metrics computed on A are answered on B and C by one
  reply hit each, with no stats_query_range call in the fleet and no
  settled-steps lookup; after B restarts (memory lost, disk kept) it answers
  them the same; after every replica lost its caches the rebuilt replies are
  read the same way. The bucketed metric's reply is read on B and C with no
  stats_query_range call and no lookup that missed every tier.
  A reply larger than one edge cache entry (a tenth of the edge budget) is
  kept in the primary cache's memory of the replica that computed it only
  (storeCompatOversizedReply, SetLocalOnlyWithTTL): a documented known limit,
  the other replicas compute it again. Fleet proof
  (TestFleet_OversizedReplyStaysOnItsReplica): a 3.6 MB reply computed on A
  is a hit on A with no VictoriaLogs call and a miss on B.
  Not covered (open): instant and series replies have no fleet proof, and
  the disk-lost and owner-down phases do not single out the reply tier.

implementation:
  - internal/proxy/middleware.go
  - internal/cache/cache.go

decisions:
  - id: oversized-reply-local-memory
    chosen: 'A reply larger than one edge cache entry is kept once, in the primary cache memory of the replica that computed it, with the edge cache TTL and freshness rule; not on disk and not pushed to peers'
    over: [keeping such replies nowhere (before: every repeat asked VictoriaLogs again), pushing them to peers and disks like replies of 128 KiB or less, handing the capture buffer to the cache without a copy]
    why: |
      Owner decisions, 2026-11-14: keep the one copy into primary L1 on a
      miss (about 8 MiB of transient allocation for a 4 MB reply, no
      measurable change through the routes), and accept local-only copies
      for oversized replies as a documented known limit, like the larger
      replies of #984. A peer push of multi-megabyte replies would multiply
      fleet traffic and disk use; a buffer handed over without a copy would
      keep up to twice the reply in memory.
    evidence: 'Live registry run on the e2e stack (2026-11-14): the 7 largest answers (3 to 16.7 MB) were the only query repeats that called VictoriaLogs again; TestOversizedReplyRepeatAsksVictoriaLogsNothing fails on main and passes here; BenchmarkOversizedBreakdown/Repeat -94% ns/op, -92% B/op'
    code: [internal/proxy/middleware.go]
    tests: [TestOversizedReplyRepeatAsksVictoriaLogsNothing, TestOversizedReplyAbovePrimaryEntryIsNotKept, TestOversizedReplyOutlivesThePrimaryDefaultTTL, TestStoreCompatOversizedReplyOnlyBeyondEdgeEntry, TestFleet_OversizedReplyStaysOnItsReplica]
    quality: 'A repeat of an oversized reply on the same replica is a hit with the same bytes and no VictoriaLogs call; another replica computes it again.'
    pending: true
