id: instrumentation-reveals-no-secrets
kind: semantics
title: /metrics and /config reveal no secret and no more than Loki's

loki: |
  Loki 3.7.9 serves /metrics and /config without authentication. /config is
  the whole configuration with secret fields masked; /metrics carries
  per-tenant series (loki_distributor_lines_received_total{tenant=...} and
  others) and its gRPC listen address.

victorialogs: |
  Not involved.

proxy: |
  /config is a one-line stub. /metrics (with -server.register-instrumentation)
  carries no admin or peer token, backend credential or static header, tenant
  map value, peer or backend address, and no tenant or client name unless
  -metrics.export-sensitive-labels is set.

implementation:
  - internal/proxy/alerting.go
  - internal/metrics/metrics.go

decisions:
  - id: instrumentation-stays-below-loki
    chosen: 'Keep /config a stub and tenant names off /metrics by default'
    over: [serving the configuration like Loki's /config with secrets masked]
    why: 'The flags hold backend and peer secrets and tenant maps; a stub reveals nothing and no client reads it.'
    evidence: 'TestInstrumentation_RevealsNoSecrets; Loki 3.7.9 /config and /metrics read 2026-11-11'
    code: [internal/proxy/alerting.go]
    tests: [TestInstrumentation_RevealsNoSecrets]
    quality: 'No configured secret, mapping or address on either route, with and without sensitive labels.'
    pending: true
