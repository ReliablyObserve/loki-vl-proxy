id: peer-cache-query-range-windows
kind: resource_control
title: Log query windows computed by their ring owner are read by the other replicas

loki: |
  Loki splits a log query by -querier.split-queries-by-interval and caches
  the splits in its results cache, shared by every frontend.

victorialogs: |
  Each window is a /select/logsql/query call; VictoriaLogs keeps nothing for
  a replica to reuse.

proxy: |
  A query_range log query is split into windows (-query-range-split-interval).
  A settled window is stored compressed with SetWithTTL (fetchQueryRangeWindow):
  memory, the disk of each of the key's replicas and a write-through push to
  its owner, keyed by tenant, auth and routing scope, parser shape,
  direction, row limit and exact aligned bounds; recent windows keep their
  short TTL. It is read with GetSharedWithTTL: memory, disk, then the key's
  replicas in ring order.
  Fleet proof (TestFleetPeerCacheProof): the windows of log queries computed
  on A are reused by B and C, and every window hit on a replica that never
  computed it is a pushed copy in its memory, a disk read or a peer read;
  after B restarts it reuses windows from its disk or its peers; after it
  lost its disk it reads windows from their replicas; with A stopped or
  paused B and C answer the same; the rebuilt lines equal Loki's. A log
  answer of 128 KiB or less is also kept whole as an exact reply
  (peer-cache-query-replies) and is then answered before its windows.

implementation:
  - internal/proxy/query_range_windowing.go
  - internal/cache/cache.go
