id: service-name-derivation
kind: identity
title: service_name follows Loki's discovery order

loki: |
  When a stream has no service_name label, Loki derives it at ingest from the
  first non-empty of discover_service_name and falls back to "unknown_service".
  The default list has 13 entries, read from the live Loki's /config: service,
  app, application, app_name, name, app_kubernetes_io_name, container,
  container_name, k8s_container_name, component, workload, job, k8s_job_name. OTel resource
  attribute service.name becomes the service_name label. The derived value is a
  normal stream label: selectors match it, grouping returns it, and
  /label/service_name/values lists it.

victorialogs: |
  VictoriaLogs stores whatever was pushed: `service_name`, OTel-dotted
  `service.name`, or only the source label (`app`, `container`...). It has no
  derivation. `coalesce` (v1.51+) can pick the first non-empty field.

proxy: |
  Selector matching and grouping must both use the derived value. Expanding
  {service_name="x"} into an OR over candidate fields matches rows whose Loki
  service_name is something else; grouping by the stored field alone leaves
  Loki-push streams under an empty value.

cases:
  - service-name/otel-dotted   # modelled only: nothing pushes a real OTLP
                               # payload into Loki and compares
  - service-name/loki-push-label
  - service-name/derived-from-app
  - service-name/derived-from-container
  - service-name/priority-order
  - service-name/unknown-service-fallback
  - service-name/selector-exact-match
  - service-name/group-by-service-name
  - service-name/label-values-list
  - profiles/keep-removes-derived-service-name
  - semantics/service-name-stream-filter
  - semantics/service-name-stream-route

implementation:
  - internal/translate/selector.go
  - internal/queryplan/lower/lower.go
  - internal/queryplan/lower/range_agg.go
  - internal/queryplan/lower/label_replace.go
  - internal/logsql/ast.go
  - internal/logsql/parser.go
  - internal/proxy/query_translation.go
  - internal/proxy/service_name_route.go
  - internal/proxy/backend.go

decisions:
  - id: service-name-stream-filter-by-declaration
    chosen: 'An operator flag, -service-name-stream-label-only (default off): with it a positive service_name="x" selector matcher also writes the stream filter {service_name="x" or service_name="", service.name="x" or service_name="", service.name=""} beside the unchanged derived filter, only where no declared stream-field matcher writes a stream filter; answers read with it are keyed apart'
    over:
      - "proving the declaration from the data on every request: run the selector with the stream filter, then a proof read over the same window ({service_name=\"\", service.name!=\"\"} service_name:!\"\" | limit 1), and fall back to the derived filter when it finds a row; exact for rows arriving later because rows are append-only and the proof runs after the reads, but one more sequential VictoriaLogs read per request"
      - "caching such a proof: wrong for rows written later or late into an earlier window, and a shared fact a tenant's answers would depend on"
      - "an OR of stream filters ({a} OR {b} OR {c}), which VictoriaLogs does not select from its stream index"
      - "a stream filter of service.name alone, or service_name as a plain alias of service.name: other answers for rows without service.name or with a stored service_name"
      - "adding service_name:=\"x\" to the stream filter as an OR to drop the declaration: exact without it, but VictoriaLogs then reads every block again (1.0x to 2.3x)"
    why: |
      The derived filter has one OR branch per source field and no stream filter, so VictoriaLogs reads every
      block of every stream in the window (issue #1763). A stream filter is exact only if every row whose derived
      service_name is x lives in a stream it keeps, which holds when service_name is never a regular field and
      service.name never a regular field beside its own stream label (VictoriaLogs reads the regular field as the
      row's value, measured on v1.49.0 and v1.54.0). No read the proxy can make proves that for the rows of a
      request without costing about what the stream filter saves on the short windows Drilldown asks: the proof
      read on a fresh VictoriaLogs process took 4 to 12 ms at 10m and 1h where the derived filter took 5 to 14 ms,
      so the proved route was slower than today on first reads of 1h stats panels (12.8 to 18.7 ms) though faster
      on repeats (11.3 to 8.0 ms) and at 24 h. So the statement is the operator's, off by default.
    evidence: 'scratch A/B over VictoriaLogs v1.49.0 and v1.54.0 in process (their storage and query handlers), 2026-11-25, Apple M-series, GOMAXPROCS=2: 300 services x 8 streams x 2400 rows (5.8M rows, 24 h) and 1200 x 8 x 1200 (11.5M rows); one service queried; median of 3 fresh-process cold reads and 24 repeats. Size 11.5M, flag vs today, cold/repeat ms: log 1h 25.7/25.3 -> 10.1/4.0 (v1.49), 21.8/20.2 -> 9.2/4.0 (v1.54); log 24h 49.6/45.8 -> 16.5/9.2, 45.0/38.0 -> 17.7/9.9; json|logfmt 1h 32.0/27.0 -> 11.2/4.5, 25.4/21.8 -> 11.2/4.7; level stats 1h 12.8/11.3 -> 6.3/1.2, 11.1/9.2 -> 6.4/1.2; level stats 24h 40.4/33.8 -> 11.2/7.2, 56.4/47.5 -> 15.2/9.1; 10m shapes 9.3-14.5 -> 6.1-8.2 cold, 8.9-12.7 -> 1.0-1.9 repeat. service.name a regular field everywhere (nothing to gain): +1.1 to +2.0 ms cold at 10m and 1h, repeats equal. Beside a declared stream-field matcher a second stream filter: 1h stats 4.0 -> 6.8 ms cold, so none is written there. Grouping by both spellings, by (org.component, org_component), with org.component a stream field: within 0.7 ms of by (org.component), cold and repeat. Answers equal on every shape (canonical bodies).'
    code: [internal/translate/selector.go, internal/queryplan/lower/lower.go, internal/queryplan/lower/range_agg.go, internal/queryplan/lower/label_replace.go, internal/logsql/ast.go, internal/logsql/parser.go, internal/proxy/query_translation.go, internal/proxy/proxy.go, cmd/proxy/main.go]
    tests: [TestServiceNameStreamFilterAnswersOnVictoriaLogs, TestServiceNameStreamFilterRoundTripsOnVictoriaLogs, TestServiceNameStreamFilterKeepsEveryDerivedRow, FuzzServiceNameStreamFilterKeepsEveryDerivedRow, TestServiceNameStreamFilterSelectors, TestServiceNameStreamLabelOnly_SendsTheStreamFilter, TestServiceNameStreamLabelOnly_KeysApartOnlyWithTheFlag, TestServiceNameStreamLabelOnly_DeleteKeepsTheDerivedFilter, TestStreamFilterAnyPrintsAndParses]
    quality: 'Answers with the flag equal the answers without it wherever the declaration holds (real VictoriaLogs v1.49.0 and v1.54.0, single and multi-tenant, every source layout, quoted values); without the flag every query, key and read is unchanged.'
    performance: 'Off: no change (the selector builder takes one more bool; BenchmarkStreamSelectorFilterServiceName off and BenchmarkTranslateQueryMissShapes base vs branch). On: VictoriaLogs reads only the streams of the service; see evidence.'
  - id: service-name-stream-route-proven-per-read
    chosen: 'An automatic route, -service-name-stream-route (default on, owner decision 2026-11-26, beside the flag): a log query (query_range, no metric function) of a selector with a positive service_name="x" matcher and no declared stream-field matcher sends each /select/logsql/query and /select/logsql/hits read of at least -service-name-stream-route-min-window (30m) with the stream filter in extra_filters, and at the same time a proof read over the same window and tenant, translate.ServiceNameStreamFilterProof(x) | limit 1: the rows the narrowing leaves out that the derived filter keeps. The narrowed answer is used only when the proof is empty; a row, an error, a timeout or a refused narrowed read sends the read again without the stream filter (the read with the route off). A found row or refused narrowing is remembered per tenant scope and service for -service-name-stream-route-violation-ttl (memory, pushed to the peers); clean verdicts are never kept. At most two proof reads per request: the first read proves its own window, a later one the whole request. Query text, translation and every cache key are those of the route off.'
    over:
      - "reusing a clean verdict across requests (a cached per-window proof): the only form that cuts the cold first read below the derived filter, but wrong for a row written later into the proven window (late rows, ingestion lag), which the owner's zero-difference rule excludes"
      - "proving before the read, then reading (sequential): one more call in the latency of every read, slower than the derived filter at 30m and below on v1.49"
      - "writing the stream filter into the query text and falling back by re-running the handler: the query text differs from the route off (translation and VictoriaLogs-facing keys split), and a refuted attempt would record a failed request in the request metrics before its rerun; extra_filters keeps the text and lets the read itself fall back"
      - "a proof independent of the queried service (every stream compared with its labels): a stats read over every stream per window, no cheaper than the proof of one service, and it cannot be reused either"
      - "routing metric queries: their proof costs what the derived filter costs at 10m to 1h (v1.49 1.13x to 1.28x slower cold, v1.54 at par), so they keep the derived filter alone"
    why: |
      Owner decision 2026-11-26: keep the flag and add an automatic route that uses the stream index when VictoriaLogs
      shows the answer is the derived filter's, with at most one more call, falling back on any doubt. Every exact
      proof reads the blocks of every other stream in the window, so it costs about what the derived filter costs
      (five proof forms measured, all within the derived filter's band on v1.49.0 and v1.54.0); no verdict computed
      before a request may serve it, as a row written later into the window would be missed. So the proof runs with
      each read, at the same time: the read's latency becomes the slower of the narrowed read and the proof, which is
      shorter than the derived filter for log reads of 30 minutes and more (their sort and parser pipes run on the
      service's rows only) and not shorter for short reads and metric reads, which keep the derived filter alone.
      The route does not lower VictoriaLogs' work; the flag does, where its declaration holds.
    evidence: 'scratch A/B over VictoriaLogs v1.49.0 and v1.54.0 in process (their storage and query handlers), 2026-11-26, Apple M-series, GOMAXPROCS=2, 1200 services x 8 streams x 1200 rows (11.5M rows, 24 h), one service queried; cold = first read of a fresh process, median of 3; repeat = median of 24. Derived filter vs narrowed read with the proof beside it (cold / repeat ms): log 30m 16.8/13.9 -> 11.1/5.9 (v1.49), 43.5/42.1 -> 22.8/17.5 (v1.54); log 1h 24.8/17.3 -> 12.2/6.1, 63.8/60.3 -> 24.2/18.9; log 24h 28.8/25.2 -> 17.1/12.1, 57.7/54.9 -> 18.9/12.4; json|logfmt 1h 18.9/17.3 -> 11.5/6.6, 59.8/60.1 -> 27.0/19.5; log 10m 8.7 -> 10.1 (v1.49, 1.17x), 25.2 -> 22.7 (v1.54); level stats 1h 8.1 -> 9.3 (v1.49, 1.15x), 22.5 -> 21.4 (v1.54); level stats 24h 23.3 -> 16.2, 18.3 -> 16.0. Proof alone: 7-9 ms (v1.49) and 18-22 ms (v1.54) at 10m-1h, the derived filter''s band. Answers equal on every row; the proof finds a row exactly where the narrowed and derived answers differ (mixed and duplicate-field data sets, both versions).'
    code: [internal/proxy/service_name_route.go, internal/proxy/backend.go, internal/proxy/proxy.go, internal/translate/selector.go, cmd/proxy/main.go]
    tests: [TestServiceNameRouteAnswersOnVictoriaLogs, TestServiceNameStreamFilterProofFindsEveryDroppedRow, FuzzServiceNameStreamFilterProofFindsEveryDroppedRow, TestServiceNameRoute_CleanWindowIsNarrowed, TestServiceNameRoute_ViolationFallsBackAndIsRemembered, TestServiceNameRoute_DoubtKeepsTheDerivedFilter, TestServiceNameRoute_KeepsTheDerivedFilter, TestServiceNameRoute_SplitWindowsShareTheirProofs]
    quality: 'Every answer with the route equals the answer without it: real VictoriaLogs v1.49.0 and v1.54.0, clean, multi-tenant and violating tenants, every derived value, concurrent identical requests; the proof property holds on every row layout, duplicate stream label and regular field included.'
    performance: 'Log reads of 30m and more: 1.5x to 3x faster cold, 2x to 4x on repeats (evidence). One more VictoriaLogs call per narrowed read (at most two per request); on a violating tenant the first read per service and TTL costs the narrowed read, the proof and the read without the filter, then one call. Shorter reads and metric queries: unchanged (no proof).'
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: true
  locked_since: '2026-10-27'
  effort_exception: null
