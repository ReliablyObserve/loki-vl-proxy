id: peer-cache-fleet-recovery
kind: resource_control
title: With a ring owner down or every cache lost, the fleet answers like Loki from VictoriaLogs

loki: |
  Losing a results-cache node or every cache makes Loki slower, never
  different: the queriers read the store again.

victorialogs: |
  VictoriaLogs holds the data; every answer can be read again.

proxy: |
  A key has one owner and no backup copy on another replica. When the owner
  is unreachable the lookup fails (the per-peer breaker opens) and the
  replica reads VictoriaLogs (peer.go:330-376). With every replica's memory
  and disk gone the first request of each shape reads VictoriaLogs and the
  write-through layers are shared again at once.
  Fleet proof (TestFleetPeerCacheProof): with A stopped after it computed a
  fresh set of every layer's requests, B and C answer each one exactly as A
  did while their lookups to A fail; after all three replicas are recreated
  without disks the answers equal the first ones, the metric, the log lines
  and the label values equal Loki's, and B and C answer the write-through
  layers without VictoriaLogs.
  Contract bounds, asserted: with the owner stopped, paused (a peer that
  hangs until -peer-timeout) or killed while requests run, every request
  takes at most the owner's cold read plus the peer timeout and 1s; a
  replica that refilled after losing its disk holds no more resident memory
  than before the loss plus the refilled cache bytes and 64 MiB; a peer
  write above 8 MiB is refused and one below it is read back whole. Also
  covered: a disk tier that is full (answers unchanged), a disk cache path
  that cannot be created (the proxy exits non-zero naming the disk cache, or
  serves correct answers), recreating a replica under six concurrent clients
  (the other replicas never fail or change an answer) and a cold fleet asked
  everything at once. Every request's latency, VictoriaLogs calls and
  upstream time, peer hits and errors, and every phase's per-replica CPU,
  RSS and cache tier sizes and the backends' docker stats are written to the
  JSON report the e2e-fleet job uploads (fleet-peer-cache-proof).
  "No VictoriaLogs call" is counted on every running replica, not only the
  one asked. The proof reads the replicas per key the proxies report
  (loki_vl_proxy_peer_cache_replication_factor, absent: one) and, from two
  on, also requires the stronger behaviour of a backup replica: a replica
  that lost its disk gets the extent buckets it owned from their backup, and
  with the owner down the extent buckets, patterns and label stream
  inventory units it wrote cost no VictoriaLogs call.
  Open, measured on the stack (fails the proof on every build tested): with
  the owner paused (connections hang until -peer-timeout) one request waits
  for several peer timeouts in turn before the per-peer breaker opens after
  5 failures (peer.go:1621-1634): query_range log queries 4-6s, patterns 4s,
  label values 8-10s, against a 2s timeout. A stopped or killed owner fails
  fast and stays within the bound.
  Not covered (open): there is no replica copy of an owner's keys, so while
  an owner is down its keys cost a VictoriaLogs read on every other replica.

implementation:
  - internal/cache/peer.go
  - internal/cache/cache.go
