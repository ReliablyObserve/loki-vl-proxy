id: peer-cache-replication
kind: resource_control
title: Every peer-cache key has a backup replica, so losing one replica's disk or the owner costs no recompute

loki: |
  Loki's results cache (memcached, or the embedded cache with its own
  replication in a ring) keeps serving when one node is lost; losing a node
  makes queries slower, never different.

victorialogs: |
  VictoriaLogs holds the data; every cached answer can be computed again.

proxy: |
  A key's replicas are its owner on the peer ring and the next distinct
  peers clockwise, -peer-replication-factor in all (default 2). A
  write-through write is pushed to every replica other than the writer; a
  replica stores a pushed copy in memory and on disk with the TTL it was
  sent with and never pushes it on, so a write costs replication-factor
  minus one pushes and no copy bounces between replicas. A writer that is
  not a replica keeps a 30s memory shadow. A peer serves a key from memory,
  then its disk (a replica that restarted keeps its copies), and a copy with
  less than 5s left is never served. A lookup that misses memory and disk
  asks the replicas in ring order, owner first, skipping this instance and
  peers whose breaker is open: an owner that lost its disk gets its keys from
  its backup, and with the owner down or slow another replica gets them from
  the backup after at most -peer-timeout. A fetched copy is stored with the
  TTL it had left on the replica that served it (never extended), on disk
  only when this instance is a replica or write-through is off and the
  writer did not keep it in memory only (query_range windows), and is never
  pushed again. Values above the peers' body limit (8 MiB) are not pushed,
  and entries computed with a user's forwarded credentials (an auth
  fingerprint starting with fwdid.) are never pushed. SetReplicatedWithTTL
  pushes to the replicas whatever -peer-write-through says, for values a
  replica that lost its disk must find on its peers. There is no background
  reseed: a replica that lost its disk refills on first lookup, one peer
  round trip per key.
  Unit proof: a three-replica ring over loopback HTTP (internal/cache/
  peer_replication_test.go) covers the push count and the absence of loops,
  the refill after a lost disk (owner and backup), the owner down and slow,
  expired copies on memory and disk, memory-only values, filtered and
  oversized values, forced replication, and the goroutines; the proxy test
  checks that every cache key family built with forwarded credentials is
  kept off the replicas.

implementation:
  - internal/cache/peer.go
  - internal/cache/cache.go
  - internal/proxy/http_utils.go
