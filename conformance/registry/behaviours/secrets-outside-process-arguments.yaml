id: secrets-outside-process-arguments
kind: semantics
title: The proxy's secrets need no process argument, and never reach logs or admin answers

loki: |
  Loki reads secrets from its configuration file (optionally expanded from the
  environment) and is not deployed by this chart; this is an operational rule
  of the proxy with no Loki API counterpart.

victorialogs: |
  VictoriaLogs receives only the backend basic-auth credentials, as an
  Authorization header; the peer, admin and delete tokens are never sent to it.

proxy: |
  The peer, admin, delete API, backend and backend-version secrets come from
  the value flag, else the -...-file flag, else the environment variable
  (resolved right after flag parsing, before every startup check). A value flag
  next to a file flag, and an unreadable, empty or oversized file, stop
  startup. The Helm chart mounts each Secret key as a file and renders only the
  -...-file flag, so a binary too old to know it exits on the unknown flag.
  No value is in the debug-level log, a startup error, or the answers of
  /config, /metrics, /admin/capabilities and /debug/queries;
  /debug/pprof/cmdline answers 404.

implementation:
  - cmd/proxy/secret_flags.go
  - cmd/proxy/main.go
  - charts/loki-vl-proxy/templates/_helpers.tpl
  - charts/loki-vl-proxy/templates/deployment.yaml

decisions:
  - id: secrets-delivered-as-files-by-the-chart
    chosen: 'The chart mounts Secrets as files and passes -...-file flags; the binary also reads one environment variable per secret; the value flag wins'
    over: [environment variables rendered by the chart (an older binary ignores them and starts without the credential), a minimum image version check in the templates (tags, digests and mirrors do not order)]
    why: |
      A command line is readable through /proc/<pid>/cmdline. An unknown flag
      makes every older binary exit before it listens, so a chart and image of
      different releases cannot leave the peer, admin or delete routes
      unprotected, and the value is in neither the arguments nor the
      environment.
    evidence: 'TestRun_SecretSources, TestRun_SecretSourceErrors, TestRun_SecretsSatisfyStartupChecks, TestRun_SecretsStayOutOfLogsAndEndpoints, TestRun_NoSecretKeepsAdminOnLoopback, TestSecretsAreMountedFiles, TestSecretMountsNestUnderNoMount, TestSecretExtraArgs, validate_helm_secrets.sh; a binary built from main before this change (v2.367.0 code, a4c4229c7; not the released image) exits with "flag provided but not defined" on the rendered arguments of each of the five secrets (2026-11-26)'
    code: [cmd/proxy/secret_flags.go, cmd/proxy/main.go, charts/loki-vl-proxy/templates/_helpers.tpl, charts/loki-vl-proxy/templates/deployment.yaml]
    tests: [TestRun_SecretSources, TestRun_SecretSourceErrors, TestRun_SecretsSatisfyStartupChecks, TestRun_SecretsStayOutOfLogsAndEndpoints, TestRun_NoSecretKeepsAdminOnLoopback, TestSecretsAreMountedFiles, TestPeerSecretSource, TestSecretMountsNestUnderNoMount, TestSecretExtraArgs]
    quality: 'No chart-managed secret in the process arguments or environment; no secret in logs or admin answers; mixed chart and image versions fail closed.'
    performance: 'Startup only; no request path changes. BenchmarkResolveSecretFlags measures reading the five secrets once.'
    pending: true
