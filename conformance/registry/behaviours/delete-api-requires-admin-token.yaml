id: delete-api-requires-admin-token
kind: semantics
title: The delete API is closed unless the caller presents the admin token

loki: |
  Loki registers /loki/api/v1/delete only with compactor retention enabled
  (otherwise 404) and has no authentication of its own: a deployment puts an
  authenticating gateway in front of it. With auth_enabled it checks the
  tenant (no org id, tenant ID syntax, one tenant: answers recorded in
  internal/proxy/testdata/tenant_auth_loki_answers.jsonl, delete/*).

victorialogs: |
  VictoriaLogs' /select/logsql/delete is an admin endpoint; current releases
  reject the forwarded request.

proxy: |
  -delete-api-enabled registers the route; it requires -server.admin-auth-token
  (startup and proxy.New refuse the configuration without one, the Helm chart
  refuses to render). deleteAuthMiddleware answers every request without the
  token (X-Admin-Token or Authorization: Bearer, constant-time compare) with
  401 "admin authentication required" before the method, tenant, rate limit,
  confirmation and parameter checks, and removes the token from the request so
  it can never be forwarded to VictoriaLogs. After it, Loki's tenant answers
  and the existing safeguards (X-Delete-Confirmation, a stream selector, start
  and end, 30 days at most, tenant scoping, audit log lines before and after)
  apply unchanged.

implementation:
  - internal/proxy/middleware.go
  - internal/proxy/proxy.go
  - cmd/proxy/main.go
  - charts/loki-vl-proxy/templates/_helpers.tpl

decisions:
  - id: delete-needs-admin-token
    chosen: 'Delete requires the admin token: closed by default, refused at startup without a token, checked before Loki''s tenant and parameter answers'
    over: [the confirmation header alone (any client that can reach the proxy could delete), a separate delete token flag (a second secret to rotate)]
    why: |
      Owner hard rule 2026-11-11: the proxy's write and delete routes are
      protected and closed by default. Bare Loki has no auth, so the token
      check is a documented deviation that answers first; every other answer
      on the route stays Loki's.
    evidence: 'TestDeleteAuth_ClosedWithoutAdminToken, TestDeleteAuth_TokenGatesTheHandler, TestValidateDeleteAPI, TestRun_DeleteAPIWithoutAdminTokenRefusesToStart, validate_helm_secrets.sh (2026-11-11)'
    code: [internal/proxy/middleware.go, internal/proxy/proxy.go, cmd/proxy/main.go, charts/loki-vl-proxy/templates/_helpers.tpl]
    tests: [TestDeleteAuth_ClosedWithoutAdminToken, TestDeleteAuth_TokenGatesTheHandler, TestValidateDeleteAPI, TestRun_DeleteAPIWithoutAdminTokenRefusesToStart, TestTenantAuth_AnswersLikeLoki]
    quality: 'No delete reaches VictoriaLogs without the token; the token never reaches VictoriaLogs or the log.'
    pending: true
