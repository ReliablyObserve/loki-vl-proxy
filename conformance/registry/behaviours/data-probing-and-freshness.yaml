id: data-probing-and-freshness
kind: data_quality
title: Probes the proxy runs, and their cost and staleness

loki: |
  Loki needs no probes: one query answers one request.

victorialogs: |
  The proxy probes VictoriaLogs for the backend version (capability gating), for
  lines the two parsers read differently before a stats pushdown, and warms
  three separate label caches.

proxy: |
  Each probe is extra backend work and a staleness risk: a cached probe result
  must never make a later answer wrong, an unknown version must not silently
  pick a slower or unsafe path, and a probe must not double the cost of a first
  request.

cases:
  - quality/version-probe-unknown
  - quality/parse-risk-probe-scope
  - quality/parse-risk-cache-window
  - quality/label-cache-warm
  - semantics/label-inventory-exact-and-incremental
  - semantics/label-browser-latency-cold-and-refresh
  - quality/detected-metadata-proxy-cache
  - quality/stats-volume-freshness
  - quality/label-cache-aged-labels-kept
  - quality/query-range-extent-cache
  - quality/extracted-label-probe-cost
  - quality/probe-regexp-parse-cost
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: true
  locked_since: '2026-10-27'
  effort_exception: null
decisions:
  - id: probe-regexps-without-folding-closed-wide-classes
    chosen: |
      A "no quote" run inside a probe regexp is written as a run of non-letters
      and a run of letters, repeated (vlNotInRun: (?:[^setA-Za-z]*[A-Za-z]*)*),
      never as one negated class holding the ASCII letters. The detected_level
      escaped-value regexp also runs behind _msg:"\\", a filter every line it
      matches passes.
    over: ['[^set]* (a class closed under case folding: Go prints it in about 1 ms and VictoriaLogs prints each regexp several times per query parse)', 'an alternation of the two classes (the parser merges them back into [^set])', 'the alternation with ^ between (not equal to [^set] where the class may match at the start of the text or under +)', 'the alternation with \b\B between (equal and cheap to parse, but 2-2.5x the per-character match cost of the run form on lines with escapes)']
    why: |
      The partial-parse probe, the detected_level keys probe and the JSON hazard
      filter cost VictoriaLogs 7-24 ms of query parse each on v1.49.0 and
      v1.53.0, paid on every request whose window part is not covered yet (a
      moved-window refresh). The run form keeps the language and parses in
      microseconds. The extra cost per character, paid only on the lines
      holding an escape that the probes already gate on, is smaller than the
      parse cost for any window holding fewer than about 10^5 such lines.
    evidence: 'VictoriaLogs logstorage.ParseQuery v1.49.0 and v1.53.0, 2026-11-16, generated probe texts for {service_name="api-gateway"} and {env="production"}: partial-parse probe 17.3-23.7 ms -> 0.24-0.39 ms; detected_level keys probe 7.4-8.2 ms -> 0.37-0.44 ms; hazard filter 7.4-7.9 ms -> 0.07 ms. Go regexp per-line match (BenchmarkVLNotInMatch, 6 lines, with each probe''s literal gate): detected_level escaped value 6.8 us -> 2.6 us; JSON escaped key 6.9 us -> 14.7 us and hazard 6.3 us -> 14.3 us (one line of 40 escapes dominates)'
    code: [internal/proxy/vl_regexp_class.go, internal/proxy/ordered_json_metric.go, internal/proxy/ordered_json_valid_split.go]
    tests: [TestVLNotInMatchesTheNegatedClass, TestVLNotInPatternsHoldNoWideLetterClass, TestVLNotInPrintsCheaply, TestVLNotInVictoriaLogsSelectsTheSameLines, FuzzVLNotInMatchesTheNegatedClass, BenchmarkVLNotInMatch]
    history:
      - date: '2026-11-16'
        what: 'weekly A/B row keep-series-grouping K6 at 6h, warm (moved-window repeats)'
        measured: 'proxy 55-70 ms against Loki 13 ms (5.23x, above the locked 2x bound of operator-keep); four VictoriaLogs calls per repeat, the slowest a 33 ms probe'
        cause: 'a [^"]* class in the partial-parse probe: 17-24 ms of VictoriaLogs query parse per probe round'
        effect: 'every json metric refresh paid the parse; the warm rows of K6 and the json sets went above 2x Loki'
        fixed_by: '#1573'
        after: 'the probe parses in 0.24-0.39 ms; the warm rows are to be measured on the stack (see the PR)'
    quality: 'The probes select the same lines as before on both VictoriaLogs versions and in Go''s regexp (edge table, fuzz, oracle store); every answer is unchanged.'
    performance:
      tracked: ['keep-series-grouping K6', 'extracted-pushdown X1', 'extracted-suffix E7', 'level-filter-stored LS8', 'json-filter-pushdown A', 'metric-latency-gap DL2']
      bound: 'perf block max_ratio 2.0, target 1.0; green at Loki speed or below'
  - id: labels-names-only-ends-from-their-hours
    chosen: |
      /labels lists names only (sorted, without hits), so its stream_field_names
      listing is marked names-only, and a run of pieces finer than an hour
      inside one hour that ended more than an hour ago (the unaligned edge,
      minute and 5-minute buckets of a window end) is answered by that hour
      when the window's own hour and day buckets are in memory and it saves
      calls: the hour is cached and its names are all among the names of the
      window's own buckets, or the pieces span at least half the hour and need
      more than one round of -metadata-inventory-parallelism calls. A piece's
      names are a subset of its hour's names, so such an hour adds none; when
      it holds a name the rest of the window lacks, the pieces are read exactly.
      Within the live window only a countable query whose hour carries its row
      count is covered, so the run count of every listing confirms the hour.
      When a covering hour holds a name the rest of the window lacks, its
      pieces are read from VictoriaLogs whatever their own schedule says (the
      hour's names changed, so rows arrived in it). Names-only answers are
      cached under their own keys (sfn:names:, label_inventory:...:names).
    over: ['the pieces read one by one (before: about 19 calls, five rounds, per 24h window moved back an hour)', 'one call over each end (exact, but a refresh would read up to an hour per end on every request instead of its edge)', 'the enclosing hour scanned whatever the pieces span (up to 360x the rows of a 10-second edge)', 'higher parallelism (more VictoriaLogs load per request at fleet scale)']
    why: |
      A window moved back by an hour or more has new unaligned ends that no
      earlier request cached. The perf A/B shape refresh labels (label
      browser) moves its 24h window back 3617 s per run; on the CI stack each
      round of calls costs about 50 ms, so the repeats took 273-306 ms against
      Loki's 64-66 ms. The hours of the ends are cached for every later window
      and replica (ordinary hour buckets, shared through the peer tier).
    evidence: 'perf A/B 2026-11-25 (loki-defaults, runs 45611003635 and 45633797620): 24h warm 273-306 ms vs Loki 64-66 ms, 20 VictoriaLogs calls per repeat; 6h warm 21-56 ms vs 2-3 ms. BenchmarkLabelsShiftedWindow (Apple M5 Pro, GOMAXPROCS=4, 8 interleaved runs, 2026-11-25): a 24h window moved back 3617 s makes 2.7-12 calls instead of 19 and lists 70-94 minutes instead of 120 (first window ending at :05, :20, :26, :35, :50 and near now), 24-59% less time at 2 ms per call and the same time when a call costs in proportion to its range; refresh across an hour bucket 19 -> 3 calls and 120 -> 60 minutes; first load unchanged (63 calls, 1440 minutes). TestLabelsInventoryCoverOnVictoriaLogs: names equal one full-range call on VictoriaLogs v1.49.0 and v1.54.0.'
    code: [internal/proxy/metadata_inventory.go, internal/proxy/label_metadata.go]
    tests: [TestLabelsInventory_ShiftedWindowReadsTheHoursOfItsEnds, TestLabelsInventory_CoveredEndsMatchOneFullRangeCall, TestLabelsInventory_ExactListingsKeepHitsAndOrder, TestLabelsInventory_RowsBackfilledIntoACoveredEndAppearOnTheNextRequest, TestLabelsInventory_RowsBackfilledIntoAnEmptyCoveredPieceAppearOnTheNextRequest, TestLabelsInventory_CoverGates, TestLabelsInventoryCoverOnVictoriaLogs, FuzzLabelsInventoryCover, BenchmarkLabelsShiftedWindow]
    history:
      - date: '2026-11-25'
        what: 'perf A/B row metadata-inventory / refresh labels (label browser) at 24h and 6h, warm (windows moved back 3617 s and 317 s), loki-defaults'
        measured: '24h 273-306 ms against Loki 64-66 ms (4.1-4.8x, above the locked 2x bound); 6h 21-56 ms against 2-3 ms'
        cause: 'each new unaligned end of a moved window was read as an edge plus up to three minute and eleven 5-minute buckets that no request had cached: 19-20 calls, five rounds at four in parallel'
        effect: 'every label browser over an earlier window paid five rounds of VictoriaLogs calls'
        fixed_by: '#1750'
        after: 'to be measured by the perf A/B of this change'
    quality: '/labels lists exactly the names of one full-range listing (fake, random differential and fuzz; VictoriaLogs v1.49.0 and v1.54.0); label values and every other listing keep every piece with hits and order; a row backfilled into a covered end is listed on the next near-now request.'
    performance:
      tracked: ['metadata-inventory refresh labels (label browser)', 'metadata-inventory refresh labels with selector']
      bound: 'perf block max_ratio 2.0, target 1.0; green at Loki speed or below'
    pending: true
  - id: labels-memory-answers-at-loki-granularity
    chosen: |
      With -metadata-max-staleness above 0, /labels answers a window from the
      label inventory in memory, with no VictoriaLogs call, when every plan
      piece is held by its own entry or by the smallest bucket of the same UTC
      day (minute, 5-minute, hour, day) and, inside the live window, every
      entry used was read or confirmed within the bound; a holding bucket is
      used for a day only when the window's part of that day holds a non-empty
      bucket of its own. Entries past the bound are confirmed in the
      background. With -metadata-inventory-prefetch (default on, its own flag
      so background VictoriaLogs work can be turned off apart from staleness),
      after a listing the hours
      holding the window's start and end, the hour before it and, once those
      are cached or being read, the hour two before it, at most three and the
      window's width, are read in the background inventory lane.
    over: ['reading the moved ends from VictoriaLogs on every request (base: 7, 3-7 and 20 calls per moved 1h, 6h and 24h window)', 'exact answers only from memory (the new end of a window moved back has no cached piece, so every moved request still read VictoriaLogs)', 'answering from memory past -metadata-max-staleness (rows written into a used bucket would stay unlisted for the bucket schedule, up to 15 minutes)', 'filling the partly covered UTC day in the background (a 24h cold load read its day again: 2,880 listed minutes instead of 1,440)', 'background reads unbounded by the window (a 10-minute window over yesterday would read a whole day)']
    why: |
      The owner asked for the label browser's moved windows to be faster than
      Loki (2026-11-25). Loki answers them from its index in 1-5 ms on the
      e2e stack and 2-66 ms in the CI A/B. No VictoriaLogs call fits that,
      so the answer has to come from memory, and the new end of a moved window
      has to come from a bucket that holds it. Loki's own /labels lists every
      name of the window's UTC day (measured), so a holding bucket of the same
      day keeps the answer between the exact one and Loki's.
    evidence: 'Loki 3.7.10 on the e2e stack, 2026-11-25 (data of 11-24 and 11-25): 12 windows; Loki lists the whole day (26 / 86 / 92 for two days) for every window that overlaps the day''s data, none after the last row; the exact answer is a subset of Loki''s in every window. 120 random windows: memory answers between exact and Loki in all, 3 beyond exact. Local A/B harness, final build, four passes of the set metadata-inventory (ends 13:35-15:50): refresh labels warm p50 6h 0 ms and 24h 1 ms with no request-path call in 4 of 4 passes (Loki 1-3 ms, base 22-25 and 180-205 ms); 1h 1 ms in 3 of 4 (40 ms in one pass: two moved windows arrived before the background read of the hour their ends needed finished; Loki 1-2 ms, base 39-51 ms). Per-request timing, three rounds: 0.26-0.63 ms against Loki 1.07-2.39 ms. Two replicas with the peer tier, requests alternating: 0.7-0.9 ms once each replica read once; the first moved request on a replica without the entries in memory reads VictoriaLogs (1h: 78 ms in the first round). Near-now windows were not probed on Loki (no live writes on the stack); CI''s 1h and 6h windows end minutes ago.'
    code: [internal/proxy/metadata_inventory.go]
    tests: [TestLabelsInventory_MovedWindowsAreAnsweredFromMemory, TestLabelsInventory_MemoryAnswersStayBetweenTheWindowAndItsDays, TestLabelsInventory_MemoryAnswersKeepTheStalenessBound, TestLabelsInventory_MemoryAnswersOffWithoutStaleness, FuzzLabelsInventoryCover, BenchmarkLabelsShiftedWindow, TestLabelBrowserGates_MovedWindowNoRequestPathCalls, TestLabelBrowserGates_MovedWindowsAtHourAndDayBoundaries, TestLabelBrowserGates_BackToBackMovedWindows]
    history:
      - date: '2026-11-26'
        what: 'perf-smoke row refresh labels (label browser), warm, 24h, on the CI A/B of pull request runs'
        measured: '177 ms on one build against 1 ms on the other in the same run, whichever build the harness order gave the shorter gap between its own requests'
        cause: 'a window asked before the background read of the hour it starts in had finished waited -metadata-edge-refresh-budget for it, then read VictoriaLogs for its pieces (in process, row count 25 ms and listing 100 ms: 127-335 ms and 1-8 request-path calls per window back to back, 0 calls with the reads settled)'
        effect: 'the locked warm row failed on a build that did not change the label path'
        fixed_by: 'this change: the listing also reads the hour two before its start, a request ahead'
        after: 'in process with 30 ms between requests 3-94 ms and no request-path call from the second window on, with 60 ms 2-4 ms from the third on; held without timing by TestLabelBrowserGates_BackToBackMovedWindows'
      - date: '2026-11-25'
        what: 'perf A/B rows metadata-inventory / refresh labels (label browser), warm, 1h / 6h / 24h (loki-defaults)'
        measured: '15-29 ms / 21-56 ms / 273-306 ms against Loki 3 / 2-3 / 64-66 ms, with 7 / 3-7 / 20 VictoriaLogs calls per repeat'
        cause: 'each moved window read its new ends, and confirmed its live buckets by a row count, from VictoriaLogs on the request path'
        effect: 'every label browser over a moved window waited for VictoriaLogs'
        fixed_by: '#1750'
        after: 'to be measured by the perf A/B of #1750'
    quality: '/labels never drops a name of the exact answer and never lists a name of a UTC day whose part of the window holds no row; label values and every other listing are unchanged; with -metadata-max-staleness=0 every listing reads VictoriaLogs as before. A moved window still reads VictoriaLogs when its part of a UTC day is shorter than an hour with no bucket of its own in memory (no_rows_evidence), or when it starts in an hour no earlier listing read whole or in the background, which is bounded to the window width (uncached): semantics/label-browser-moved-window-from-memory.'
    performance:
      tracked: ['metadata-inventory refresh labels (label browser)', 'metadata-inventory refresh labels with selector']
      bound: 'perf block max_ratio 2.0, target 1.0; owner target for these rows: below Loki'
    pending: true
