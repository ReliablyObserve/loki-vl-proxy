id: query-stats-envelope
kind: observability
title: Every query, query_range, volume and volume_range answer carries Loki's whole data.stats object, filled with measurements of that request in Loki's accounting
pending: true

loki: |
  Loki fills data.stats in every query and query_range answer: summary
  (bytesProcessedPerSecond, linesProcessedPerSecond, totalBytesProcessed,
  totalLinesProcessed, execTime, queueTime, subqueries,
  totalEntriesReturned, splits, shards, totalPostFilterLines,
  totalStructuredMetadataBytesProcessed), querier, ingester, cache (chunk,
  index, result, statsResult, volumeResult, seriesResult, labelResult,
  instantMetricResult; each entriesFound, entriesRequested, entriesStored,
  bytesReceived, bytesSent, requests, downloadTime, queryLengthServed) and
  index (observed on Loki 3.7.7). Grafana turns the summary into the frame's
  meta.stats ("Summary: total bytes processed" and four more rows), which
  the query inspector and the Logs Drilldown footer show. A repeated query
  answered by Loki's results cache reports 0 bytes and lines processed, an
  execTime of the cache read and cache.result.entriesFound.
  Measured on the test stack (2026-11-09, {service_name="api-gateway"},
  windows ending 1 minute ago): a log query's totalLinesProcessed equals the
  window's lines at every limit (100, 1000, 5000) for 5m and 15m windows
  (5,215 and 15,715 lines), and totalBytesProcessed equals their line bytes
  plus structured-metadata bytes (1,747,598 + 41,720 = 1,789,318); for 1h
  and 6h windows (62,965 and 372,575 lines) it reports 30,100 lines at every
  limit. A 15m count_over_time reports the selector's lines (16,800) and,
  with |= "GET", 3,354 post-filter lines, both its answer's sums; at 1h,
  where Loki splits the query, its summary is not its answer's sum (answer
  64,015 lines, summary 48,304; with |= "GET" answer 12,799, post-filter
  summary 37,410).
  Observed on Loki 3.7.9 (2026-11-11, recorded in
  internal/proxy/testdata/loki_query_stats_object.json): the five sections
  in the order summary, querier, ingester, cache, index; a component that did
  no work is written zero (ingester.recvWaitTime is omitted when zero).
  Results cache (stack defaults: cache_results on, no instant cache): a
  repeated non-empty log query is computed again (same totals, a new
  execTime, cache.result requested 1 found 0); a repeated empty log query is
  a results-cache hit (all zero, found 1); a repeated instant query is
  computed again; a repeated metric query_range is a hit (0 lines and
  bytes, splits 1 or more, queryLengthServed the cached extents' ns).
  index/volume and index/volume_range answers carry the same object with
  every processed total 0, execTime, totalEntriesReturned (series) and
  splits, and cache.volumeResult. Grafana 13.3.0 shows five "Summary:" rows
  and ten "Ingester:" rows for one answer (the Ingester rows read the legacy
  flat keys, so its head-chunk and decompressed rows read 0 even for Loki);
  when it splits a long range (over one day) into one request per piece,
  its Stats tab keeps only "Summary: total bytes processed", summed over the
  pieces, and "Summary: exec time" (Grafana PR #63436 describes the merge).

victorialogs: |
  VictoriaLogs returns no per-query counters with an answer: no response
  header and no trailing statistics on /select/logsql/query or the stats
  endpoints (v1.49.0 and v1.53.0 source). Its `| query_stats` pipe (since
  v1.31.0) reports BytesReadTotal, RowsProcessed, RowsFound,
  BytesProcessedUncompressedValues and QueryDurationNsecs, but it replaces
  the query's output with one stats row, so reading it means a second
  VictoriaLogs request that repeats the query's work (1h, warm: about 58 ms,
  against about 10 ms for the limited log query itself; `stats count(),
  sum_len(_msg)` about 15 ms).

proxy: |
  One layer (queryStatsLayer) fills data.stats for every query and
  query_range answer whatever path wrote it (tested: log, categorized log,
  metric, binary, instant, literal, multi-tenant log and metric, response
  cache hits identity and gzip, small answers under the compression
  threshold; the cold-dispatch and limit answers go through the same layer
  without a test of their own). It sits inside the request logger, which
  owns the request's flow (query_flow.go), and outside the response caches;
  it holds back the last 64 bytes of the answer and writes the stats into
  the envelope's end (an empty "stats":{} is filled, an envelope without
  stats gets the key last in data, as Loki orders it). Cached bodies never
  carry stats; a cache hit reports what Loki reports in the same situation
  (decision query-stats-loki-accounting). It writes all five sections;
  querier, ingester and index have no proxy counterpart and are always in
  Loki's zero form. Since query-stats-loki-accounting it also fills volume
  and volume_range answers.
  A response-cache hit is finished without reading the body again
  (query_stats_cache.go): the cached value ends with the answer's entry
  count (a trailer behind the `qs1:` key fence, `qs2:` since
  query-stats-loki-accounting, so no code that does not
  know it reads such a value, here or on a peer), and for gzip clients a
  local sidecar holds the gzip encoding of the body up to its last 64 bytes,
  captured from the miss's own compressed answer (the compressor is
  sync-flushed where the stats begin; the CRC of the part before is unwound
  from the member's trailer). A gzip hit writes that encoding, one final
  stored deflate block with the last bytes and its stats, and the trailer:
  one gzip member. An answer under the client compression threshold is sent
  uncompressed with its stats, as before them.
  Lines and bytes processed have Loki's meaning where an answer the proxy
  computes anyway counts them (query_stats_totals.go), and are what the
  proxy read from VictoriaLogs otherwise; see the decisions.

implementation:
  - internal/proxy/query_stats.go
  - internal/proxy/query_stats_cache.go
  - internal/proxy/query_stats_totals.go
  - internal/proxy/volume.go
  - internal/middleware/compress.go
  - internal/proxy/query_flow.go
  - internal/proxy/backend_read_observation.go
  - internal/proxy/backend_heavy.go
  - internal/proxy/middleware.go
  - internal/proxy/proxy.go
  - internal/cache/cache.go

decisions:
  - id: query-stats-from-the-request-flow
    chosen: 'Fill data.stats from measurements of this request (its request flow), in one response layer outside the caches; finish cache hits from an entry-count trailer and a gzip sidecar captured at the miss'
    over: ['an extra VictoriaLogs `| query_stats` request per query', 'an empty stats object (before)', 'writing stats in each of the ~15 answer writers', 'replaying the stats stored with a cached answer', 'scanning or recompressing the cached body on every hit', 'a separate sidecar entry for the entry count (a second cache read per hit)']
    why: |
      Owner 2026-11-09: Loki's shape, real values only, no extra
      VictoriaLogs load, no performance regression against base on any
      path; compute in the proxy first, derive from answers the proxy
      computes anyway second (decision query-stats-loki-meaning-totals),
      query VictoriaLogs last and off by default (not built). Per field:
      execTime = the request's time in the proxy; totalBytesProcessed =
      decoded bytes the proxy read from VictoriaLogs for this answer, and
      totalLinesProcessed = log rows the proxy read from VictoriaLogs raw
      query bodies (one per NDJSON line), unless the totals decision gives
      them with Loki's meaning;
      bytes/linesProcessedPerSecond = those over execTime;
      queueTime = its wait for heavy-query admission; totalEntriesReturned =
      entries of a streams answer, series of a matrix or vector answer;
      splits = VictoriaLogs calls; subqueries, shards and
      totalStructuredMetadataBytesProcessed = 0, totalPostFilterLines = 0
      unless the totals decision gives it (VictoriaLogs has no shards or
      subqueries, filters before the proxy sees rows and keeps no
      structured-metadata byte count). What the proxy read is lower than
      Loki's scan: a log query reads at most its limit (15m window on the
      test stack: Loki 15,750 lines / 5,400,506 bytes, the proxy 1,000
      rows), a metric query reads aggregated rows. cache.<section> = the
      request's reads and stores by the Loki cache that plays the same
      part: result = the compat response cache, the inner query_range
      cache, the log window cache and the settled steps cache;
      instantMetricResult = the compat cache of instant queries;
      statsResult = the stats extent cache; volumeResult = volume segments;
      entriesRequested and requests count lookups (+ stores), entriesFound
      hits and stale reads used, bytesReceived the bytes found,
      downloadTime the lookup time in ns, entriesStored/bytesSent the compat
      response cache's stores; chunk, index, seriesResult, labelResult and
      queryLengthServed stay 0. The `qs1:` fence makes every query and
      query_range compat entry a cold miss once after an upgrade; during a
      rolling upgrade replicas on the old and new keys do not share those
      entries.
    evidence: |
      Stack 2026-11-09 (Loki 3.7.7, VictoriaLogs v1.53.0, Grafana 13.3.0):
      Loki's repeated metric query answered from its results cache reports
      totalBytesProcessed 0, totalLinesProcessed 0, execTime 0.00017 s,
      cache.result.entriesFound 2; the stack proxy answered "stats":{} and
      Grafana showed no stats. A local build against the stack's
      VictoriaLogs: a gzip log query miss and its hits are each one gzip
      member; a hit reports 0 / 0, splits 0, cache.result found 1,
      execTime about 40 us; the categorize-labels request carries one stats
      key and 1000 entries.
    code: [internal/proxy/query_stats.go, internal/proxy/query_stats_cache.go, internal/middleware/compress.go, internal/proxy/query_flow.go, internal/proxy/backend_read_observation.go, internal/proxy/backend_heavy.go, internal/proxy/middleware.go]
    history:
      - date: '2026-11-11'
        what: 'Grafana Explore query inspector Stats, log and metric queries, 5m to 2d, refreshes (owner report)'
        measured: 'proxy 5 rows (Loki 15); a 5m log query 1,000 lines and 1,169,864 bytes on every refresh (Loki 5,250 lines, 1,799,223 bytes, moving with the window); a cache-hit refresh 0 B; a 5m count 1 line and 944 bytes (Loki 6,300 lines, 2,159,314 bytes); a 2d split count 18.6 kB (Loki 611 MB)'
        cause: 'querier, ingester and index left out; totalBytesProcessed = decoded VictoriaLogs bytes (NDJSON rows, or aggregated stats answers) and totalLinesProcessed = raw rows read, even on metric answers; every cache hit reported 0 processed'
        effect: 'figures with a meaning Loki never has, frozen at the limit, 0 B on cached refreshes and on cached pieces of split ranges'
        fixed_by: 'fix/query-stats-like-loki (decision query-stats-loki-accounting supersedes this decision''s per-field sources for bytes, lines, cache hits and the left-out sections)'
        after: 'see query-stats-loki-accounting'
    tests: [TestQueryStats_LogQueryNumbersAreMeasured, TestQueryStats_EveryAnswerShape, TestQueryStats_CategorizedAndMultiTenantAnswers, TestQueryStats_CompressedCacheHitCarriesStats, TestQueryStats_GzipCacheHitIsOneMember, TestQueryStats_SmallAnswersStayUncompressed, TestStatsTrailerRoundTrip, TestCRC32Unappend, TestGzipPrefixFinishedWithStoredBlock, TestQueryStats_ErrorAnswerUntouched, TestPatchStatsTail, TestEntryCounter_SplitWrites, FuzzPatchStatsTail, FuzzPatchStatsTailAnyBytes, FuzzEntryCounter, TestPeekReadsFreshMemoryEntriesOnly, TestDrilldown_QueryStatsEnvelope]
    quality: |
      Every number is a measurement of this request: a differential test
      compares the stats with what a VictoriaLogs stub counted on its side
      (requests, bytes, rows) for random row counts, and a cache hit reports
      no VictoriaLogs work and the entry it found. The layer changes only
      data.stats: any other envelope ending is left byte-identical (fuzzed
      over arbitrary data objects and arbitrary bytes, every write split).
      Known limit: an answer whose data holds a stats key earlier than its
      last 64 bytes and ends with an array would get a second stats key; no
      proxy writer orders data that way. A gzip hit is one member (CRC and
      size checked) whose answer equals the identity answer; a sidecar from
      an older body, or none (a body from a peer), is rebuilt from the
      current body.
    performance:
      tracked: ['BenchmarkQueryAnswerPaths (log, metric, instant; miss and hit; identity and gzip; a shifted log refresh)', 'BenchmarkQueryStatsWriter (the layer on a 1000-entry log answer)']
      bound: 'no VictoriaLogs request added; a cache hit neither scans nor recompresses the answer and reads no extra cache entry for identity clients; per answer the stats object (~1.5 KB on the wire), no allocation in the layer (pooled writer, fixed buffers); the request flow grows by its cache-section counters'
      measured: |
        Apple M5 Pro, GOMAXPROCS=4, benchstat of interleaved runs, base
        origin/main (949e5dea2) vs this change, VictoriaLogs stub, 1000-row
        log answer (~440 KB); the machine was shared with other work. All
        rows (n=10), sec/op base -> change (p): log hit identity 5.10 ->
        5.59 us (0.011), log hit gzip 6.26 -> 6.69 us (0.075), metric hit
        identity 6.04 -> 5.63 us (-6.9%, 0.043), metric hit gzip 6.37 -> 5.99
        us (-6.0%, 0.035), instant hit identity 5.81 -> 5.34 us (-8.0%,
        0.023), instant hit gzip 6.29 -> 6.00 us (0.22), shifted log refresh
        9.34 -> 9.71 us (0.22); misses log identity 709 -> 739 us (0.25), log
        gzip 764 -> 794 us (+3.9%, 0.011), metric identity 83 -> 87 us (0.17),
        metric gzip 95 -> 87 us (0.91), instant identity 80 -> 75 us (0.91),
        instant gzip 90 -> 78 us (0.68). The log hits after writing the
        answer's end with its stats in one write (n=16): identity 4.68 ->
        4.89 us (+4.6%, p<0.001), gzip 5.74 -> 5.89 us (+2.5%, p<0.001): the
        rendering of the ~1.5 KB stats object, which a hit of a small answer
        more than offsets. allocs/op equal to base on every hit row (80, 91,
        81, 86, 79, 84); misses +5 (+0.1 to +1%). B/op +0.2 KiB on hits (the
        request flow's cache-section counters), +0.1 to +1.8% on misses. The
        hit path offsets the layer's cost with a prefilter in front of the
        ip() key-fence regexp (exactly equivalent: every match holds the text
        "ip"), outside the stats change itself. The layer alone
        (BenchmarkQueryStatsWriter, 1000-entry 79 KB answer in 32 KiB
        writes): 7.8 us, 10 GB/s, no allocation of its own. Before the
        trailer and the captured gzip sidecar (the layer scanning every hit,
        gzip hits compressed per request) the log hit was 5.3 -> 58 us
        identity and 6.2 -> 132 us gzip.
  - id: query-stats-loki-meaning-totals
    chosen: 'Lines and bytes processed from answers the proxy computes anyway: a tumbling count_over_time/bytes_over_time sums its own answer; a log query takes its window from the volume answer of the same expression (count) or selector (volume_range bytes), kept in the shared cache tiers'
    over: ['the rows and bytes the proxy read (lower than Loki''s by the limit or the aggregation)', 'a VictoriaLogs count()/sum_len or query_stats request per query (opt-in fallback, not built: 1.5x to 6x the log query''s own VictoriaLogs time)', 'estimating the uncovered edge of a refreshed window', 'reproducing Loki''s early stop on long windows']
    why: |
      Owner 2026-11-09: Loki's meaning, at no VictoriaLogs cost, from what
      the proxy already computes for the same selector and window; never
      fake Loki's scan. On the test stack Loki's log query reports exactly
      its window's lines and line plus structured-metadata bytes for 5m and
      15m windows at every limit, so the window's totals are the honest
      figure; beyond that Loki stops early (30,100 lines for 1h and 6h),
      and the proxy reports the window's totals, higher than Loki's.
      Sources: (1) `[sum [by|without]] (count_over_time(E [| drop __error__] [R]))`
      with E a selector and line/label filters (no parser), on tumbling
      windows (step = R) or instant: its answer's sum is the lines of E over
      (start - R, end], Loki's window: totalLinesProcessed and
      totalPostFilterLines without a filter, totalPostFilterLines with one
      (totalLinesProcessed then comes from a selector-only count when
      known); `bytes_over_time({selector}[R])` likewise gives line bytes.
      (2) Such range answers (not instant ones: one step is too coarse to
      stand for another window), and volume_range answers grouped only by
      labels every stream has (the selector's own when every matcher
      requires a value, service_name, detected_level) and not cut by limit,
      are kept 5 minutes (`qs-totals:v1:` + hash of tenant org, routing and
      auth scope, kind and expression) in memory and pushed asynchronously to
      the key's peer replicas, so the logs query of the same panel (Explore
      wraps the logs query's whole expression in its volume query; Logs
      Drilldown requests volume_range for the selector) takes its window's
      lines (post-filter lines with filters) and line bytes from them. The
      log query reads them from memory only (a peer read would wait on the
      network before its stats are written) and uses one when its whole
      steps inside the window span at least 90% of the window, summing those
      steps; the uncovered edge is left out, never estimated. Only answers
      computed from VictoriaLogs (a miss) carry these totals; sliding windows
      (step != R) and parsers are left out (a line is counted in several
      steps; dropped parse errors are not Loki's post-filter count).
    evidence: |
      Stack 2026-11-09, local build against the stack's VictoriaLogs,
      windows ending 2 minutes ago, Loki | proxy: 15m count_over_time
      lines 16,800 | 16,800, post-filter with |= "GET" 3,354 | 3,354;
      15m log query after its volume query lines 15,750 | 15,750, bytes
      5,400,506 | 5,274,506 (Loki adds 126,000 structured-metadata bytes);
      15m bytes_over_time 5,759,962 | 5,625,562 (structured metadata);
      1h and 3h log queries 30,381 and 30,418 | 62,965 and 189,105 (the
      window's lines; Loki stops early). Replay (one proxy, VictoriaLogs
      stub, 40 page loads each, TestQueryStatsTotals_CompanionCoverage):
      Explore first load 0/40 (the logs answer finishes before its volume
      answer), refreshes 40/40 and 40/40; Logs Drilldown first load lines
      0/40 and bytes 3-18/40, refresh 40/40 and 40/40. Behind a load
      balancer the two queries of a panel can reach different replicas;
      companions reach only the key's replicas (and the writer), so one
      proxy is the upper bound.
    code: [internal/proxy/query_stats_totals.go, internal/proxy/middleware.go, internal/proxy/volume.go]
    tests: [TestQueryStatsTotals_MetricAnswerSumsToLokisWindow, TestQueryStatsTotals_LogQueryFromItsVolumeAnswer, TestQueryStatsTotals_LogQueryBytesFromVolumeRange, TestQueryStatsTotals_CompanionCoverage, TestQueryStatsTotals_CompanionsStayInTheirTenant, TestStatsTotalsStepsWithin, TestDrilldown_QueryStatsWindowTotalsFromTheVolumeAnswer]
    quality: |
      The derived totals are the answer's own sums (a differential over
      random windows and steps against the answer the client got) and a
      companion is used only for the same tenant scope (tested with two
      mapped tenants) and expression and a window its whole steps cover to
      90% (a coarse companion never answers a short window with 0); the
      uncovered edge is left out, never estimated. Owed: the fleet proof of
      the companion entries (written on one replica, read on its peer
      replica), which needs the e2e-fleet stack.
    performance:
      tracked: ['BenchmarkQueryAnswerPaths metric/miss and instant/miss (the query and answer parse and the companion write on a miss)', 'BenchmarkVolumeHandlers range_selector_labels_300x60 (the companion kept from a volume_range miss)']
      bound: 'a miss of a qualifying metric query parses the query and its own answer once and writes one companion entry (16 bytes per step, at most 11000 steps, one asynchronous push per replica); a log query miss parses the query and reads at most three companion entries from memory; hits do none of this'
      measured: |
        Apple M5 Pro, GOMAXPROCS=4, interleaved benchstat, base origin/main
        (949e5dea2), shared machine. Misses with the totals (n=8, no sec/op
        row significant, +-30 to 60% noise): allocs/op log +47 (+0.6%),
        metric +48 (+7.9%), instant +36 (+7.2%): one query parse, one answer
        parse (pooled fastjson parser), the companion key and write. Hits
        unchanged (equal allocs). volume_range miss with a kept companion
        (300 series x 60 steps, n=8): 12.26 -> 12.79 ms (p=0.23), allocs
        +0.02%, B/op equal; the other volume rows unchanged.
  - id: query-stats-loki-accounting
    pending: true
    chosen: 'Every field in Loki''s meaning or Loki''s zero, per route and per cache tier: all five sections, the component ones in Loki''s zero form; log bytes = the returned lines'' bytes (or the window''s lines times their mean size); metric totals only from the answer''s own counts, else 0; hits of answers Loki computes on every request (a non-empty log answer, an instant answer) replay the stored computation; metric query_range hits are Loki results-cache hits; volume answers carry the object with no processed totals'
    over: ['the summary and cache sections only (before; Grafana listed 5 rows where Loki lists 15)', 'VictoriaLogs NDJSON bytes as bytes processed (about 3.5x Loki''s line bytes on the test stack)', 'VictoriaLogs aggregated rows and their size as a metric query''s lines and bytes (1 line and 944 bytes for a 5m count of 6,300 lines)', 'a second VictoriaLogs request per query (`| query_stats`, or `stats count(), sum_len(_msg)`)', 'adding sum_len(_msg) to the metric query''s own stats pipe (24h `*`: 0.09 s for count() alone, 0.55 s with sum_len)', 'zero lines and bytes on every proxy cache hit (Loki computes log and instant queries again)', 'the hit''s own time as the rate base of a replayed hit (rates of tens of GB/s)', 'emulating Loki''s early stop or its 1h time splits in splits and totalLinesProcessed']
    why: |
      Owner 2026-11-11: the Stats Grafana shows (query inspector, Logs
      Drilldown footer) must be Loki's: correct, complete, fresh on every
      refresh, right for long ranges loaded in pieces; every field Loki
      sends, in Loki's shape; values in Loki's meaning; no raw-row
      buffering, no extra VictoriaLogs request.
      Per field (Loki's value class -> proxy source): execTime (measured)
      -> this request's time, hits included; queueTime -> the heavy-query
      admission wait; totalEntriesReturned -> entries or series written;
      totalLinesProcessed (Loki's scan) -> log: the window's lines from the
      volume companion, else the rows VictoriaLogs returned; metric: the
      answer's own count (tumbling count_over_time), else 0; never below
      totalPostFilterLines; totalPostFilterLines -> the same counts after
      filters, for a log query without them the rows VictoriaLogs returned
      for the filters; totalBytesProcessed (line plus structured-metadata
      bytes) -> log: the window's bytes from volume_range, or the window's
      lines times the mean returned line size, or the returned lines'
      bytes; metric: bytes_over_time's own sum, else 0;
      bytes/linesProcessedPerSecond -> the totals over execTime (over the
      stored computation's time on a replayed hit); splits -> VictoriaLogs
      calls (Loki counts its time splits; kept, owner question); subqueries,
      shards, totalStructuredMetadataBytesProcessed -> 0 (VictoriaLogs has
      none); querier.*, ingester.*, index.* -> Loki's zero form (no such
      component); cache.<section> -> as query-stats-from-the-request-flow,
      plus result.queryLengthServed = the window (ns) of a whole metric
      answer found.
      Per cache tier: a response-cache hit of a non-empty log answer or an
      instant answer -> the stored computation's totals and rates (the stats
      trailer carries them, behind the `qs2:` key fence); an empty log
      answer and a metric query_range hit -> Loki's results-cache hit (0
      processed, the entry found); a metric answer partly from cached steps
      or extents (stats extent cache, settled steps) -> no derived totals
      (Loki counts only what it computed); the inner log window cache -> the
      entries and line bytes it returned. Volume answers -> 0 processed, the
      series returned.
      "Not refreshing" (owner report), causes found on the stack (stack
      proxy built at #1277, VictoriaLogs v1.53.0): (1) a log query without
      a companion reported its limit's rows and the NDJSON size of those
      rows, the same 1,000 lines and about 1.17 MB on every refresh whatever
      the window held (Loki moved from 32,598 to 32,796 lines over three
      refreshes); (2) a refresh answered from the proxy's response cache
      reported 0 B and 0 lines, where Loki computes the log query again; (3)
      with Explore's volume companion the lines moved but the bytes stayed
      the NDJSON size of the limit's rows; (4) a split long range sums its
      pieces' bytes, and the metric pieces carried VictoriaLogs' aggregated
      answer size (18.6 kB against Loki's 611 MB on a 2d count) while cached
      log pieces carried 0 B. Grafana itself does not cache (OSS).
    evidence: |
      Stack 2026-11-11 (Loki 3.7.9, VictoriaLogs v1.53.0, Grafana 13.3.0),
      {service_name="api-gateway"}, windows ending a minute ago; Loki |
      stack proxy (main) | this change (a local build against the stack's
      VictoriaLogs): 5m log, limit 1000: lines 5,250 | 1,000 | 1,000 (no
      companion); bytes 1,799,223 | 1,169,864 | 335,359 (Loki: 1,757,223
      line bytes plus 42,000 structured-metadata bytes, 335 line bytes per
      line on both). The same query again: Loki 5,250 lines (computed
      again) | 0 | 1,000 lines and 335,359 bytes replayed. 5m tumbling
      count: lines 6,300 | 1 | 6,300; bytes 2,159,314 | 944 | 0. 5m instant
      count: lines 5,250 | 0 | 5,250; repeated 5,250 | 0 | 5,250. 1h log
      after its Explore volume query: 61,950 lines and 20,746,497 bytes
      (estimated), where Loki's 1h volume query reports 64,204 lines and
      22,137,453 line bytes. volume_range: Loki 0 processed, 1 entry | no
      stats object | 0 processed, 1 entry. The shape (keys, order, value
      types) equals Loki's for log, metric, instant and volume_range at 5m
      and 1h, miss and repeat, once ingester.recvWaitTime (omitted by Loki
      when zero) is set aside.
    code: [internal/proxy/query_stats.go, internal/proxy/query_stats_cache.go, internal/proxy/query_stats_totals.go, internal/proxy/middleware.go]
    tests: [TestQueryStats_ObjectHasLokisRecordedShape, TestQueryStats_LokiAccountingPerRouteAndCacheTier, TestQueryStatsTotals_PartlyCachedMetricAnswerGivesNoTotals, TestEntryCounter_LineBytes, FuzzEntryCounterLineBytes, TestStatsTrailerRoundTrip, TestQueryStats_LogQueryNumbersAreMeasured, TestQueryStats_CompressedCacheHitCarriesStats, TestQueryStats_GzipCacheHitIsOneMember, TestQueryStatsTotals_LogQueryFromItsVolumeAnswer, TestDrilldown_QueryStatsLikeLoki, TestDrilldown_QueryStatsEnvelope]
    quality: |
      The shape is pinned to recorded Loki answers (keys, order, value
      types) on every route, miss and hit, and in e2e to Loki's live answer.
      Line bytes are the decoded lines' bytes (a differential against
      encoding/json over split writes, fuzzed: escapes, \u escapes counted
      as one byte, categorized entries). Each route and cache tier has a
      table row. Known differences, documented: structured-metadata bytes
      are not counted; metric bytes are 0 unless bytes_over_time; Loki's
      early stop on long log windows is not emulated; splits counts
      VictoriaLogs calls.
    performance:
      tracked: ['BenchmarkQueryAnswerPaths', 'BenchmarkQueryStatsWriter']
      bound: 'no VictoriaLogs request added; the layer allocates nothing per answer (fixed 4.5 KiB buffer for the ~3.3 KB object); the line-byte scan is IndexByte-driven like the entry count; a hit reads only the trailer it already read'
      measured: |
        Apple M5 Pro, GOMAXPROCS=4, benchstat of 10 interleaved runs (one
        base run, one branch run each), base origin/main (3d1ff9482), the
        VictoriaLogs stub of BenchmarkQueryAnswerPaths. Every request row:
        no significant sec/op change (log miss identity 714.8 -> 724.7 us
        p=0.53, gzip 799.9 -> 809.6 us p=0.85; log hit identity 5.37 -> 5.40
        us p=0.80; metric and instant misses and hits p >= 0.35);
        allocs/op equal on every hit, -2 on metric and instant misses (the
        aggregated rows no longer counted), -2 on log misses; B/op equal
        except log miss gzip +0.4% (the ~3.3 KB stats object, about 1.8 KB
        more on the wire per answer). The layer alone
        (BenchmarkQueryStatsWriter, 1000-entry 79 KB answer in 32 KiB
        writes): 7.87 -> 11.82 us (+50%, p<0.001), 0 allocations of its own
        (6 allocs/op, the benchmark's own, unchanged): the line-byte scan
        costs about 4 ns per entry (one IndexByte for the line end, a SWAR
        skip of the timestamp, one backslash lookup per write), 0.5% of the
        log miss it belongs to; a hit does not scan.
