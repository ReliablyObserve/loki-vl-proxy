id: query-stats-envelope
kind: observability
title: Every query and query_range answer carries Loki's data.stats object, filled only with measurements of that request
pending: true

loki: |
  Loki fills data.stats in every query and query_range answer: summary
  (bytesProcessedPerSecond, linesProcessedPerSecond, totalBytesProcessed,
  totalLinesProcessed, execTime, queueTime, subqueries,
  totalEntriesReturned, splits, shards, totalPostFilterLines,
  totalStructuredMetadataBytesProcessed), querier, ingester, cache (chunk,
  index, result, statsResult, volumeResult, seriesResult, labelResult,
  instantMetricResult; each entriesFound, entriesRequested, entriesStored,
  bytesReceived, bytesSent, requests, downloadTime, queryLengthServed) and
  index (observed on Loki 3.7.7). Grafana turns the summary into the frame's
  meta.stats ("Summary: total bytes processed" and four more rows), which
  the query inspector and the Logs Drilldown footer show. A repeated query
  answered by Loki's results cache reports 0 bytes and lines processed, an
  execTime of the cache read and cache.result.entriesFound.
  Measured on the test stack (2026-11-09, {service_name="api-gateway"},
  windows ending 1 minute ago): a log query's totalLinesProcessed equals the
  window's lines at every limit (100, 1000, 5000) for 5m and 15m windows
  (5,215 and 15,715 lines), and totalBytesProcessed equals their line bytes
  plus structured-metadata bytes (1,747,598 + 41,720 = 1,789,318); for 1h
  and 6h windows (62,965 and 372,575 lines) it reports 30,100 lines at every
  limit. A 15m count_over_time reports the selector's lines (16,800) and,
  with |= "GET", 3,354 post-filter lines, both its answer's sums; at 1h,
  where Loki splits the query, its summary is not its answer's sum (answer
  64,015 lines, summary 48,304; with |= "GET" answer 12,799, post-filter
  summary 37,410).

victorialogs: |
  VictoriaLogs returns no per-query counters with an answer: no response
  header and no trailing statistics on /select/logsql/query or the stats
  endpoints (v1.49.0 and v1.53.0 source). Its `| query_stats` pipe (since
  v1.31.0) reports BytesReadTotal, RowsProcessed, RowsFound,
  BytesProcessedUncompressedValues and QueryDurationNsecs, but it replaces
  the query's output with one stats row, so reading it means a second
  VictoriaLogs request that repeats the query's work (1h, warm: about 58 ms,
  against about 10 ms for the limited log query itself; `stats count(),
  sum_len(_msg)` about 15 ms).

proxy: |
  One layer (queryStatsLayer) fills data.stats for every query and
  query_range answer whatever path wrote it (tested: log, categorized log,
  metric, binary, instant, literal, multi-tenant log and metric, response
  cache hits identity and gzip, small answers under the compression
  threshold; the cold-dispatch and limit answers go through the same layer
  without a test of their own). It sits inside the request logger, which
  owns the request's flow (query_flow.go), and outside the response caches;
  it holds back the last 64 bytes of the answer and writes the stats into
  the envelope's end (an empty "stats":{} is filled, an envelope without
  stats gets the key last in data, as Loki orders it). Cached bodies never
  carry stats, so a cache hit reports its own work. It writes summary and
  cache; querier, ingester and index have no proxy counterpart and are left
  out (zero-filled they would show as measurements in Grafana).
  A response-cache hit is finished without reading the body again
  (query_stats_cache.go): the cached value ends with the answer's entry
  count (a trailer behind the `qs1:` key fence, so no code that does not
  know it reads such a value, here or on a peer), and for gzip clients a
  local sidecar holds the gzip encoding of the body up to its last 64 bytes,
  captured from the miss's own compressed answer (the compressor is
  sync-flushed where the stats begin; the CRC of the part before is unwound
  from the member's trailer). A gzip hit writes that encoding, one final
  stored deflate block with the last bytes and its stats, and the trailer:
  one gzip member. An answer under the client compression threshold is sent
  uncompressed with its stats, as before them.

implementation:
  - internal/proxy/query_stats.go
  - internal/proxy/query_stats_cache.go
  - internal/middleware/compress.go
  - internal/proxy/query_flow.go
  - internal/proxy/backend_read_observation.go
  - internal/proxy/backend_heavy.go
  - internal/proxy/middleware.go
  - internal/proxy/proxy.go
  - internal/cache/cache.go

decisions:
  - id: query-stats-from-the-request-flow
    chosen: 'Fill data.stats from measurements of this request (its request flow), in one response layer outside the caches; finish cache hits from an entry-count trailer and a gzip sidecar captured at the miss'
    over: ['an extra VictoriaLogs `| query_stats` request per query', 'an empty stats object (before)', 'writing stats in each of the ~15 answer writers', 'replaying the stats stored with a cached answer', 'scanning or recompressing the cached body on every hit', 'a separate sidecar entry for the entry count (a second cache read per hit)']
    why: |
      Owner 2026-11-09: Loki's shape, real values only, no extra
      VictoriaLogs load, no performance regression against base on any
      path; compute in the proxy first, derive from answers the proxy
      computes anyway second (a follow-up change), query VictoriaLogs last
      and off by default (not built). Per field: execTime = the request's
      time in the proxy; totalBytesProcessed = decoded bytes the proxy read
      from VictoriaLogs for this answer; totalLinesProcessed = log rows the
      proxy read from VictoriaLogs raw query bodies (one per NDJSON line);
      bytes/linesProcessedPerSecond = those over execTime;
      queueTime = its wait for heavy-query admission; totalEntriesReturned =
      entries of a streams answer, series of a matrix or vector answer;
      splits = VictoriaLogs calls; subqueries, shards, totalPostFilterLines
      and totalStructuredMetadataBytesProcessed = 0 (VictoriaLogs has no
      shards or subqueries, filters before the proxy sees rows and keeps no
      structured-metadata byte count). The processed totals are what the
      proxy read, lower than Loki's scan: a log query reads at most its limit
      (15m window on the test stack: Loki 15,750 lines / 5,400,506 bytes,
      the proxy 1,000 rows), a metric query reads aggregated rows. cache.<section> = the
      request's reads and stores by the Loki cache that plays the same
      part: result = the compat response cache, the inner query_range
      cache, the log window cache and the settled steps cache;
      instantMetricResult = the compat cache of instant queries;
      statsResult = the stats extent cache; volumeResult = volume segments;
      entriesRequested and requests count lookups (+ stores), entriesFound
      hits and stale reads used, bytesReceived the bytes found,
      downloadTime the lookup time in ns, entriesStored/bytesSent the compat
      response cache's stores; chunk, index, seriesResult, labelResult and
      queryLengthServed stay 0. The `qs1:` fence makes every query and
      query_range compat entry a cold miss once after an upgrade; during a
      rolling upgrade replicas on the old and new keys do not share those
      entries.
    evidence: |
      Stack 2026-11-09 (Loki 3.7.7, VictoriaLogs v1.53.0, Grafana 13.3.0):
      Loki's repeated metric query answered from its results cache reports
      totalBytesProcessed 0, totalLinesProcessed 0, execTime 0.00017 s,
      cache.result.entriesFound 2; the stack proxy answered "stats":{} and
      Grafana showed no stats. A local build against the stack's
      VictoriaLogs: a gzip log query miss and its hits are each one gzip
      member; a hit reports 0 / 0, splits 0, cache.result found 1,
      execTime about 40 us; the categorize-labels request carries one stats
      key and 1000 entries.
    code: [internal/proxy/query_stats.go, internal/proxy/query_stats_cache.go, internal/middleware/compress.go, internal/proxy/query_flow.go, internal/proxy/backend_read_observation.go, internal/proxy/backend_heavy.go, internal/proxy/middleware.go]
    tests: [TestQueryStats_LogQueryNumbersAreMeasured, TestQueryStats_EveryAnswerShape, TestQueryStats_CategorizedAndMultiTenantAnswers, TestQueryStats_CompressedCacheHitCarriesStats, TestQueryStats_GzipCacheHitIsOneMember, TestQueryStats_SmallAnswersStayUncompressed, TestStatsTrailerRoundTrip, TestCRC32Unappend, TestGzipPrefixFinishedWithStoredBlock, TestQueryStats_ErrorAnswerUntouched, TestPatchStatsTail, TestEntryCounter_SplitWrites, FuzzPatchStatsTail, FuzzPatchStatsTailAnyBytes, FuzzEntryCounter, TestPeekReadsFreshMemoryEntriesOnly, TestDrilldown_QueryStatsEnvelope]
    quality: |
      Every number is a measurement of this request: a differential test
      compares the stats with what a VictoriaLogs stub counted on its side
      (requests, bytes, rows) for random row counts, and a cache hit reports
      no VictoriaLogs work and the entry it found. The layer changes only
      data.stats: any other envelope ending is left byte-identical (fuzzed
      over arbitrary data objects and arbitrary bytes, every write split).
      Known limit: an answer whose data holds a stats key earlier than its
      last 64 bytes and ends with an array would get a second stats key; no
      proxy writer orders data that way. A gzip hit is one member (CRC and
      size checked) whose answer equals the identity answer; a sidecar from
      an older body, or none (a body from a peer), is rebuilt from the
      current body.
    performance:
      tracked: ['BenchmarkQueryAnswerPaths (log, metric, instant; miss and hit; identity and gzip; a shifted log refresh)', 'BenchmarkQueryStatsWriter (the layer on a 1000-entry log answer)']
      bound: 'no VictoriaLogs request added; a cache hit neither scans nor recompresses the answer and reads no extra cache entry for identity clients; per answer the stats object (~1.5 KB on the wire), no allocation in the layer (pooled writer, fixed buffers); the request flow grows by its cache-section counters'
      measured: |
        Apple M5 Pro, GOMAXPROCS=4, benchstat of interleaved runs, base
        origin/main (949e5dea2) vs this change, VictoriaLogs stub, 1000-row
        log answer (~440 KB); the machine was shared with other work. All
        rows (n=10), sec/op base -> change (p): log hit identity 5.10 ->
        5.59 us (0.011), log hit gzip 6.26 -> 6.69 us (0.075), metric hit
        identity 6.04 -> 5.63 us (-6.9%, 0.043), metric hit gzip 6.37 -> 5.99
        us (-6.0%, 0.035), instant hit identity 5.81 -> 5.34 us (-8.0%,
        0.023), instant hit gzip 6.29 -> 6.00 us (0.22), shifted log refresh
        9.34 -> 9.71 us (0.22); misses log identity 709 -> 739 us (0.25), log
        gzip 764 -> 794 us (+3.9%, 0.011), metric identity 83 -> 87 us (0.17),
        metric gzip 95 -> 87 us (0.91), instant identity 80 -> 75 us (0.91),
        instant gzip 90 -> 78 us (0.68). The log hits after writing the
        answer's end with its stats in one write (n=16): identity 4.68 ->
        4.89 us (+4.6%, p<0.001), gzip 5.74 -> 5.89 us (+2.5%, p<0.001): the
        rendering of the ~1.5 KB stats object, which a hit of a small answer
        more than offsets. allocs/op equal to base on every hit row (80, 91,
        81, 86, 79, 84); misses +5 (+0.1 to +1%). B/op +0.2 KiB on hits (the
        request flow's cache-section counters), +0.1 to +1.8% on misses. The
        hit path offsets the layer's cost with a prefilter in front of the
        ip() key-fence regexp (exactly equivalent: every match holds the text
        "ip"), outside the stats change itself. The layer alone
        (BenchmarkQueryStatsWriter, 1000-entry 79 KB answer in 32 KiB
        writes): 7.8 us, 10 GB/s, no allocation of its own. Before the
        trailer and the captured gzip sidecar (the layer scanning every hit,
        gzip hits compressed per request) the log hit was 5.3 -> 58 us
        identity and 6.2 -> 132 us gzip.
