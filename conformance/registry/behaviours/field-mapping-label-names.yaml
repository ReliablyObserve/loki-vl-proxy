  - internal/proxy/metric_binary.go
  - internal/proxy/cache_keys.go
  - internal/translate/extracted_label.go
  - internal/translate/parsed_labels.go
  - internal/queryplan/lower/label_filter_parsed.go
  - internal/queryplan/lower/parser_labels.go
  - internal/queryplan/lower/metric_screen.go
  - internal/queryplan/lower/lower.go
  - internal/queryplan/lower/range_agg.go
  - internal/queryplan/lower/label_replace.go
  - internal/proxy/query_lowering.go
