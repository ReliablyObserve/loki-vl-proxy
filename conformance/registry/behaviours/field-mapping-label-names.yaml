id: field-mapping-label-names
kind: semantics
title: 'The operator chooses the names a mapped field shows in answers: one per field, its own, its aliases or both'
pending: true

loki: |
  Loki has no field mapping: a label has the name it was written with, the
  pickers list it, and a series carries it once.

victorialogs: |
  VictoriaLogs stores one field (for example k8s.namespace.name) and lists it
  under that name only.

proxy: |
  -field-mapping may give one field several Loki names. Queries, filters,
  groupings and label values accept every one in every mode, and a grouping
  answers under the name it gives. -field-mapping-label-mode selects the names
  a mapped field shows on every answer surface (label lists, stream and series
  labels, structured metadata, detected fields): unset (default, one name per
  field, the last mapping's), original (its own name formatted by -label-style
  and -metadata-field-mode), alias (the aliases only) or both (the own names
  and the aliases; stream and series labels carry every listed name, added
  after evaluation so series and matching are the alias mode's). The names
  are derived from the VictoriaLogs listings the default reads, and the cache
  identities of original, alias and both carry the mode, its names, a names
  version and the metadata field mode. In alias and both a key a json or
  logfmt stage extracts under an alias's name is read as Loki reads a parsed
  label that collides with a stream label: alias_extracted where the entry's
  stream holds the alias's field, the alias where it does not.

implementation:
  - internal/proxy/field_mapping_labels.go
  - internal/proxy/labels.go
  - internal/proxy/drilldown.go
  - internal/proxy/volume.go
  - internal/proxy/request_scope.go
