id: parser-error-and-label-collision
kind: semantics
title: Parser errors, __error__ and _extracted collisions

loki: |
  A failed parser stage sets __error__ (JSONParserErr, LogfmtParserErr) and keeps
  keys parsed before the failure. Metric queries exclude lines carrying
  __error__ unless the pipeline drops it. A parsed key colliding with a stream
  label or structured metadata is renamed with the _extracted suffix, so the
  stored label keeps its value. Querying __error__ without dropping it is a 400
  on some shapes.

victorialogs: |
  unpack_json adds no field for a line it cannot parse and has no error marker;
  with keep_original_fields a stored field wins over a parsed key, which
  reproduces the _extracted rule for value purposes but not for the label name.

proxy: |
  Counting, grouping and filtering must match Loki line for line, including the
  lines the two parsers read differently (leading whitespace, trailing bytes,
  truncated JSON, repeated keys, arrays, escaped keys, U+FFFD, a key Loki
  sanitizes or flattens into the grouped or filtered label). Summed range
  metrics over one parser with string label filters are pushed down to
  VictoriaLogs stats over unpack_json/unpack_logfmt and filter pipes; cheap
  `| limit 1` probes over the range decline the pushdown for one such line
  and keep the exact raw-row evaluator. The probes draw their lines through
  VictoriaLogs' word index (the label or a piece of it must be a word of the
  line) and verify nested keys with unpack_json itself, so no probe needs a
  regexp VictoriaLogs is slow to prepare. A filter that rejects the empty
  value stands in for `drop __error__`, since no unparsed line has the key.
  A label filter before the parser is applied by VictoriaLogs, as for a log
  query. A metric Loki fails on an unparsed line fails with Loki's
  `pipeline error` text from one lookup, before any row is read.

