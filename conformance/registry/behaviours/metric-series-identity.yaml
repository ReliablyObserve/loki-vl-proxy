id: metric-series-identity
kind: identity
title: A metric series is named by the stream, its metadata and its parsed labels

loki: |
  The series of a range aggregation is the stream labels plus the structured
  metadata of the entry plus every label the pipeline extracted, so one stream
  can carry many series. The outer aggregation then reads one value per series:
  sum adds them, count counts them, min/max/avg fold them, and `without (...)`
  drops the named labels and folds what remains with the same operator.

victorialogs: |
  A stats pipe groups by the fields named in `by (...)`. There is no notion of
  a Loki series, and the keys `unpack_json` / `unpack_logfmt` produce are known
  only after a row is read, so they cannot appear in a `by (...)` clause. A
  second stats pipe can aggregate the rows of the first, which is how a
  per-series value is folded without leaving the backend.

proxy: |
  Translating count/min/max/avg to the same single stats pipe as sum answers
  with the line count instead of the series count. The inner pipe must keep the
  series identity (the requested labels plus the stream and its level, plus the
  captures a `| regexp` or `| pattern` stage names) and an outer pipe folds
  those per-series values. For `without (...)` the outer pipe keeps the
  identity and the proxy folds the rows of each remaining label set with the
  query's operator rather than summing them.

implementation:
  - "internal/translator/translator.go seriesLevelOuterAggregation, joinByLabels, addByClauseLast"
  - "internal/proxy/vector_matching.go applyWithoutGrouping, withoutMergeForOp"

cases:
  - metric-identity/count-by-counts-series
  - metric-identity/max-by-folds-series-values
  - metric-identity/count-without-drops-label
  - metric-identity/sum-is-row-aggregation
  - metric-identity/structured-metadata-splits-series   # deviation, see state
  - metric-identity/dynamic-key-parser-labels           # deviation, see state
  - semantics/non-sum-vector-aggregation-unreduced
  - semantics/stddev-stdvar-grouped-values
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null

decisions:
  - id: structured-metadata-series-fold
    chosen: 'with -structured-metadata-series-identity, a count_over_time or rate under vector aggregations by labels the read groups by (count, sum, avg, max, min; one or more levels, by only) is read in the time chunks of listed_window_chunks.go and folded by the series fold of series_fold_read.go: the read copies its rebuilt _stream into the fold''s series field, VictoriaLogs folds the series that lie wholly in one bucket into a row per group and bucket (their merged value and count), keeps the others as they are, and the kept series answer their stream under _stream; a folded read is never cut into slices, and one over -structured-metadata-series-max-read-rows rows is read again in smaller chunks sized by its row count'
    over:
      - 'reading every series (the identity''s first form): a series per line out of VictoriaLogs and through the proxy, 4x Loki at 6 h and 31-33 s at 24 h, most of it proxy CPU'
      - 'cutting a folded read into slices of its buckets: a series spanning two slices would be folded once in each and counted twice'
      - 'the stream fold for a binary operation''s operands or a without: their series are the answer''s or are matched by labels; the ratio of F1 is read through the existing rate/count rewrite, a count by under the fold'
    why: |
      With a per-line trace_id almost every series lies in one bucket. Loki''s answer at a step is the outer
      aggregation over the series with lines in the window; a series wholly in one bucket has its whole value in that
      bucket, so its contribution to every window that holds the bucket is its bucket value, and those of a group and
      bucket merge exactly (a sum, an extreme, a count of series). The kept series are read as before.
    evidence: 'TestStructuredMetadataSeriesMatchLoki (Loki engine oracle, VictoriaLogs v1.49.0 and v1.54.0, 2026-11-28): 88 of 88 answers equal Loki''s with the fold on (62-78 folded reads); TestStreamSeriesFold; stack (Loki 3.7.10, VictoriaLogs v1.54.0): F1-F4 at 1 h 0.12x-0.36x Loki, at 6 h 0.26x-0.75x Loki, at 24 h 11-14 s against 31-33 s before the fold, VictoriaLogs restart count unchanged'
    code: [internal/proxy/series_fold_stream.go, internal/proxy/series_fold_read.go, internal/proxy/series_fold_answer.go, internal/proxy/metadata_series.go, internal/proxy/listed_window_chunks.go, internal/queryplan/lower/series_fold.go]
    tests: [TestStructuredMetadataSeriesMatchLoki, TestStreamSeriesFold, TestSeriesFoldPipes]
    quality: 'Every answer of the oracle set is Loki''s, folded or not.'
    performance:
      tracked: ['series-level-fine-step (bench/ab, both Loki profiles, flag on)', 'the pull request''s local tables']
      bound: 'F1-F4 at or below Loki at 1 h and 6 h; VictoriaLogs holds at most -structured-metadata-series-max-read-rows rows per read'
    pending: true
  - id: structured-metadata-series-behind-declaration
    chosen: 'behind -structured-metadata-series-identity (default off, the operator''s declaration that every stored non-stream field is structured metadata): every VictoriaLogs stats read of a query or query_range metric request that reads a series per stream (logsql.ReadsStreamIdentity) rebuilds each row''s _stream with set_stream_fields from the stream fields and the metadata fields under Loki''s names (sanitized, _extracted beside a stream label of the same name, per row; a dropped field left out), listed from field_names and stream_field_names over the read''s window widened to whole hours, once per request; a rebuilt stats_query_range read over -structured-metadata-series-max-read-rows rows is read in slices of the extent cache''s bucket grid and joined; a read folded into its answer''s groups is bounded by -manual-range-metric-row-limit, Loki''s series limit applying to the folded answer'
    over:
      - 'the stream identity (kept as the default): every count/avg/min/max/stddev/topk/without and bare range answer differs where lines carry structured metadata'
      - 'adding the metadata fields to every series-identity by-list of the lowering and the handlers: many writers (the lowering, the translator, the handlers'' by-clause rewrites), where the rebuilt _stream reaches every route through the one field they all read'
      - 'pack_json or set_stream_fields over every field: VictoriaLogs has no exclusion filter, so _time and _msg would make every row a series'
      - 'one whole read of the window: a day of per-line trace_id in one read ran a 4 GiB VictoriaLogs out of memory (five restarts)'
    why: |
      Loki''s sample labels are the stream labels, the entry''s structured metadata and the parsed labels. VictoriaLogs
      stores structured metadata as the row''s other fields and nothing in a row tells them from fields an ingestion
      route parsed out of the line, so the identity holds only where the operator declares how rows are written. A
      field a row does not hold adds nothing to its _stream (VictoriaLogs skips empty tags), so the rows of a stream
      without metadata keep their series byte for byte and a superset of the window''s fields gives the same answer.
    evidence: 'TestStructuredMetadataSeriesMatchLoki (internal/proxy, Loki engine oracle, VictoriaLogs v1.49.0 and v1.54.0, 2026-11-28): 88 of 88 instant and range answers equal Loki''s over 23 shapes with the flag (56 differ without it), 86 read in slices of a 30-row bound equal Loki''s (2 refused as unsliceable with Loki''s limit status), Loki''s series-limit error where Loki refuses; bench stack (Loki 3.7.10, VictoriaLogs v1.54.0, 2026-11-28): 18 of 18 shapes at 1h and 8 of 8 at 6h equal Loki series by series; 24h at 20s F1-F4 answer 200 in 31-33 s with the bound (off 8-9 s), VictoriaLogs peak 0.9 GiB, no restart'
    code: [internal/logsql/series_metadata.go, internal/proxy/metadata_series.go, internal/proxy/backend.go]
    tests: [TestStructuredMetadataSeriesMatchLoki, TestMetadataSeriesParams, TestMetadataSeriesKeysAndReadLimit, TestNewSeriesMetadata, TestWithSeriesMetadata, TestReadsStreamIdentity, TestParseCopyPrefixToTop]
    quality: 'With the flag every answer of the oracle set is Loki''s; without it nothing changes.'
    performance:
      tracked: ['series-level-fine-step (bench/ab, both Loki profiles, flag on)', 'the pull request''s local tables (1h/6h vs Loki, 24h on vs off)']
      bound: 'series-level shapes over per-line metadata read about a VictoriaLogs group per line: 4x-5x Loki at 6h (owner decides the default)'
    pending: true
  - id: max-of-max-reads-group-rows
    chosen: 'max over max_over_time and min over min_over_time (by labels or none) after a json or logfmt parser are one stats pipe by the clause over the group''s rows: no series identity (no second unpack and hash after a parser of every key, no per-series stats after an extraction list, whose logfmt unpack reads the unwrapped key and the clause labels the list names only)'
    over:
      - 'the series identity of the other functions (a value per series, then the aggregation): exact, and up to 5x the VictoriaLogs time after a parser of every key'
      - 'leaving these shapes to the stream identity of the string translator (exact for this pair, a stats pipe per stream and line)'
    why: |
      The maximum of the series' maxima is the maximum of all their samples, and
      the minimum of their minima the minimum, whatever the series are: Loki's
      answer is the group's extreme. Owner decision 2026-11-17: the extraction
      list's series identity was accepted where exactness costs (sum by over
      max_over_time, +41-48%), and the max of max and min of min shapes, which
      need no identity, come below base. A range longer than the step already
      took the extreme of the group's lines (unwrapGroupPushdown).
      For sum by (ns) over max_over_time after an extraction list no cheaper
      exact grouping was found: _stream_id for _stream measures the same, and
      reading ns back from each series' stream instead of grouping by it 3-4%
      less, through a text extract of the stream it was not worth.
    evidence: 'TestExtractionListIdentityMatchLoki, TestUnwrapDynamicIdentityMatchLoki, TestUnwrapDynamicValueFormsMatchLoki and TestJSONLineFieldsMatchLoki (internal/querycorpus, Loki engine oracle, VictoriaLogs v1.49.0 and v1.53.0, 2026-11-17): the same runs match Loki as on base and two more (extraction lists 106 instant / 99 step=range / 73 step<range / 100 step>range of 169, base 106 / 99 / 72 / 99: the error over an unconvertible value names Loki''s line at step<range and step>range), and the new max and min rows over convertible values (17 extraction-list, 8 parser) match on every request kind but the empty-label one; TestExtractionListIdentityVictoriaLogsCost (600,000 rows, 21 interleaved runs, p50): extraction list 197 -> 126 ms (-36%), parser of every key 718 -> 140 ms (-81%), every other shape within 0.6%'
    code: [internal/queryplan/lower/unwrap_dynamic.go, internal/queryplan/lower/unwrap.go]
    tests: [TestFoldsRowsLowering, FuzzDynamicUnwrapIdentity, TestExtractionListOutsideWithoutKeepsItsGrouping, TestExtractionListIdentityMatchLoki, TestUnwrapDynamicIdentityMatchLoki, TestUnwrapDynamicValueFormsMatchLoki]
    quality: 'Every answer as before and as Loki''s recorded answer; one stats pipe for these shapes.'
    performance:
      tracked: ['TestExtractionListIdentityVictoriaLogsCost (LVP_XLIST_VLCOST=1): VictoriaLogs p50 per shape, translator vs base vs head', 'BenchmarkExtractionListIdentityLowering and BenchmarkTranslateExtractionListMiss, base vs head']
      bound: 'VictoriaLogs time of the max and min shapes at or below base on v1.49.0 and v1.53.0; no other shape slower'
    pending: true
  - id: extraction-list-sliding-windows
    chosen: 'on a range longer than the step, an extraction list''s series identity (the stream, its stored level fields and the listed labels, fields of the row) groups VictoriaLogs'' sub-step buckets, the window evaluator merges each series'' buckets into its window and the proxy folds the vector aggregation after the windows'
    over:
      - 'the stream''s series and each line''s step bucket (origin/main): each line a series of its own and each step bucket read as the window, so sum over stdvar_over_time answered 0'
      - 'the same for a parser of every key: its identity is a hash per distinct parsed label set, one series per line when lines carry a key of their own, which the window evaluator would hold in the proxy per bucket'
    why: |
      Loki evaluates a range function per series over (t-range, t] and then
      folds the vector aggregation. After an extraction list the series are
      known from the query and are fields VictoriaLogs groups by, so the
      partial aggregates (sum and count, mean, count and deviation, extremes)
      of each series' sub-step buckets merge into the series' windows exactly,
      and the fold reads one value per series. A clause by level or
      detected_level keeps the stream's series (the line's level is read from
      raw rows there).
    evidence: 'TestExtractionListIdentityMatchLoki (Loki engine oracle, VictoriaLogs v1.49.0 and v1.53.0, 2026-11-17): step<range 55 -> 82 of 149 runs match (27 queries), every other request kind unchanged; TestUnwrapDynamicValueFormsMatchLoki: the 45 extraction-list rows at step<range match; TestListedIdentityWindowsVictoriaLogsCost (600,000 rows, query_range 1h, step 60s, range 5m): VictoriaLogs time -31% to -76% on five shapes, +16% on sum by (ns) over max_over_time'
    code: [internal/proxy/unwrap_dynamic_identity.go, internal/proxy/unwrap_samples.go, internal/proxy/vector_agg_fold.go, internal/queryplan/lower/unwrap_dynamic.go]
    tests: [TestListedUnwrapIdentity, TestDynamicIdentityHandlersReadThePlan, TestExtractionListOutsideWithoutKeepsItsGrouping, TestResponseKeyFencesFireOnTheSpellingsTheParserReads, TestExtractionListIdentityMatchLoki, TestUnwrapDynamicValueFormsMatchLoki]
    quality: 'Every extraction-list run at step<range that differed now matches Loki; no run of any kind moves from matching to differing.'
    performance:
      tracked: ['TestListedIdentityWindowsVictoriaLogsCost (LVP_XLIST_WINDOWS_VLCOST=1): VictoriaLogs time of the stats calls per shape, origin/main''s route vs the windows', 'BenchmarkListedIdentityWindowsDecision, base vs head']
      bound: 'one stats_query_range per request as before; VictoriaLogs time at or below base except sum by over max_over_time (+16%, the per-series step Loki''s answer needs)'
    pending: true
  - id: extraction-list-window-chunks
    chosen: 'the windows of an extraction list''s series identity on a range longer than the step are evaluated in time chunks, as a query frontend splits a range: a chunk of steps reads its buckets from the range before its first step to its last, its windows are folded into the one fold of the request as they are read, and its partials are dropped. A chunk reads at most 11,000 buckets; -manual-range-metric-row-limit bounds the series one chunk''s read holds (and the stats body bound its bytes): a chunk over either is cut to a quarter and read again, and the next chunk is sized to half the bound from what the last one held. The size a request needed is kept for ten minutes on the replica, so the next request reads no chunk over the bound. Chunks are read one after another.'
    over:
      - 'one read of every series and bucket before the fold (the extraction-list windows as first written): a listed label of many values over a long range passed the read bound and answered 400, or fell to the raw rows and passed the response bound (500), where Loki answers 200'
      - 'raising the default bound, or a hidden ceiling: either leaves a request Loki answers refused past it'
      - 'a ring of per-series partials over rows consumed in time order: VictoriaLogs answers stats_query_range series by series (sorted by result name, then labels), each with every bucket, so one series'' partials are not adjacent and the answer is not time ordered'
      - 'splitting the request into requests of their own through the query_range handler (as the settled-steps cache evaluates its gaps): each would plan, look up caches and fence again, and the overflow would have to be read back from an answer''s text'
      - 'halving a chunk over the bound: over a tenfold overflow it threw away three VictoriaLogs reads computed in full, a quarter two (VictoriaLogs time 15-17 s against 9-10 s on avg by (ns) (stddev_over_time(... | logfmt amount, id ...)) over 6 h)'
    why: |
      A step's value at t depends only on the buckets in (t-range, t]. A chunk
      whose fetch starts a whole number of steps after the request's reads the
      same buckets on the same grid, and the fold keeps a cell per group and
      sample time and visits a step's series in sorted key order within the one
      chunk that holds the step, so the chunked answer is the one-read answer
      byte for byte. VictoriaLogs still does the aggregation (stats per series
      and bucket); the proxy merges partials and holds one chunk at a time.
      The only refusal left is a single step whose window holds more series than
      the bound, Loki's limit error naming the flag; the folded answer keeps
      Loki's series limit.
    evidence: 'TestListedWindowChunksMatchLoki (internal/querycorpus, Loki engine oracle, VictoriaLogs v1.49.0 and v1.53.0, 2026-11-17): five shapes over 6 h at 15 s and 7 s, 2,500 listed values, every run Loki''s answer; at a bound of 600 series 37-38 chunks, the result byte for byte the one-read one; at 7 s (21,900 one-second buckets) 3 chunks under the default bound. TestListedWindowChunksMatchUnchunked and FuzzListedWindowChunks: random windows, steps, ranges and bounds, byte-identical. TestListedWindowChunksMemoryBounded: series 1,534 -> 23,939 in one read, at most 3,168 per chunk (budget 6,000).'
    code: [internal/proxy/listed_window_chunks.go, internal/proxy/range_metric_compat.go]
    tests: [TestListedWindowChunksMatchLoki, TestListedWindowChunksMatchUnchunked, FuzzListedWindowChunks, TestListedWindowChunksMemoryBounded, TestExtractionListOutsideWithoutKeepsItsGrouping]
    quality: 'A long range over a listed label of many values answers 200 with Loki''s values; every request that fits one chunk reads and answers exactly as before.'
    performance:
      tracked: ['TestListedWindowChunksVictoriaLogsCost (LVP_XLIST_CHUNKS_VLCOST=1): status, VictoriaLogs time and calls per shape, one read vs chunks', 'TestListedIdentityWindowsVictoriaLogsCost (LVP_XLIST_WINDOWS_VLCOST=1)', 'BenchmarkListedWindowsRequest, base vs head']
      bound: 'a request that fits one chunk: one stats_query_range as before, proxy cost within noise; a chunked request: one stats_query_range per chunk read one after another, each reading the range before its chunk again'
    pending: true
  - id: stream-identity-window-chunks-after-overflow
    chosen: 'a folded window metric of any series identity (count, min, max or avg over a range function, also under an outer sum, and the rate/count ratio B2 is read as) whose stats_query_range read over the whole range passes the stats body bound is read again in the time chunks of extraction-list-window-chunks (listed_window_chunks.go), starting at a quarter of the steps; the replica keeps the size for ten minutes (the same memory-tier hint), so the next request of the query at that step is chunked at once. A read within the bound is not chunked.'
    over:
      - 'one read of every stream''s buckets over the whole range (main): about 320,000 short-lived streams a day passed the 64 MiB stats body bound at a 60s step, the raw rows the window evaluator fell to passed -backend-max-buffered-response-bytes, 500 where the answer is a few groups per step'
      - 'chunking every folded window metric up front: the same reads for a request that fits one chunk, but every such request would move to the chunked writer; only the requests that answered 500 move'
      - 'the range-splitting retry of the binary route (binary_aggregation_range.go) on the B2 rewrite alone: leaves the plain count by (F2) and the other series-level shapes (F3, F4) failing on the same read'
      - '_stream_id instead of _stream in the read: about half the bytes, the same cliff at twice the streams'
      - 'raising the stats body bound: a hidden ceiling a longer range passes again'
    why: |
      The answer of a count, min, max or avg over a range function is folded
      as the matrix is built (matrix_fold_sink.go), but the read before it holds
      a series per stream. Its size grows with the streams of the range, not
      with the groups of the answer. A step's value depends only on the
      buckets in (t-range, t], so reading the steps in chunks, each from the
      range before its first step, gives the one-read answer, and the fold
      holds a cell per group and step. The chunks are read only after the
      whole range's read passed the bound (or this replica saw it pass for the
      query within ten minutes), so no request that answered before changes.
    evidence: 'TestStreamIdentityWindowChunksMatchOneRead and FuzzStreamIdentityWindowChunks (internal/proxy, emulated VictoriaLogs v1.54.0): random shapes (count, min, max, avg by, a sum over a max by, the ratio), windows of 2-7m, steps of 15-90s, 1-3h spans and stream densities, the bound a third of the whole read: 8-39 chunks, every answer byte for byte the one-read answer, and a shorter request after the overflow (read through the chunks at once) a fresh proxy''s answer. Against Loki 3.7.10 on the same 24.6h seed (2026-11-25, loki-defaults): F2-F4 at 24h/20s answer 200 on both, the values equal on the services without structured metadata and apart where Loki splits a stream per structured-metadata set (metric-identity/structured-metadata-splits-series: checkout-svc count by 910 against 85, the sum of max by 1 against 26). TestStreamIdentityWindowsChunkedPastBodyBound (internal/proxy, emulated VictoriaLogs v1.54.0): B2 and count by over 3h of a new pod stream per service every 10 s at a 60 s step, the stats body bound at half the whole read: 500 ResourceExhausted on main, Loki''s active-stream counts on the branch, every chunk within the bound, the repeat chunked at once (no read thrown away), a read within the bound not chunked. Real VictoriaLogs v1.54.0 with 26 h of the bench/ab generator (322,601 streams in 24 h, 2026-11-25): B2 24h at 60 s main 500 in 13.7 s, branch 200 in 21.2 s with 12 VictoriaLogs calls, repeat 0 calls; F1-F4 of series-level-fine-step 24h at 20 s main 500 (8-12 s), branch 200 (F1 19.3 s, 11 calls; F2 and F3 answered from the bucket reads F1 left in the proxy''s caches, 0 calls; F4 21.5 s, 10 calls); the chunked 24h B2 answer equals the one-read 6h answer at 60 s on all 5,415 shared points.'
    code: [internal/proxy/listed_window_chunks.go, internal/proxy/range_metric_compat.go]
    tests: [TestStreamIdentityWindowsChunkedPastBodyBound, TestStreamIdentityWindowChunksMatchOneRead, FuzzStreamIdentityWindowChunks, TestListedWindowChunksMatchUnchunked, FuzzListedWindowChunks, TestListedWindowChunksEdges]
    quality: 'B2 and the series-level shapes answer 200 at 24h where they answered 500; every request whose read fits the bound reads and answers as before.'
    performance:
      tracked: ['BenchmarkSeriesLevelAggregationShapes (B2, countBy, avgBy, N14), base vs head', 'the 24h stack table of the pull request (B2, F1-F4)']
      bound: 'a request within the bound: one stats_query_range as before; a request past it: the thrown-away whole read plus one stats_query_range per chunk, read one after another (the first time on a replica; a repeat within ten minutes reads only the chunks)'
    pending: true
  - id: parser-identity-sliding-windows-bucket-merge
    chosen: 'A parser''s series identity over a range longer than the step (sum, avg, max or min over avg, max, min, stddev or stdvar over time after a json or logfmt parser of every key) reads one VictoriaLogs call per time chunk (listed_window_chunks.go): the function''s partials per series hash and per anchored bucket (the hash written before the unwrap gate, lower.Profile IdentityAhead), with the series that lie wholly in one bucket of the read folded in VictoriaLogs in the same scan (lower.SeriesFold), on /select/logsql/query with the bounds stats_query_range reads for the read''s grid (SeriesFoldQueryParams): the bucket stats by the bucket (_time:<step> offset <offset>), the grouping and the hash; a stats pipe by the grouping and the hash counts each series'' buckets and keeps its bucket rows (json_values); a series in one bucket whose value is finite and not a NaN line''s is folded (its hash blanked), every other series'' bucket rows are read back (unroll); the last stats pipe passes the kept series'' partials through (any) and adds up (or takes the extreme of) the folded values and counts them. The parser''s unpack writes its keys under the identity''s prefix and copies them out, so each line is unpacked once and hashed once (lower.SeriesFoldBase). The proxy reads the rows back into stats_query_range''s answer shape (seriesFoldRead.matrix); the window evaluator merges each kept series'' buckets into Loki''s windows and adds a folded row to every window holding its bucket, weighted by its count (foldAccumulator.addPartial). The unwrap check''s counting form groups the bucket stats and the last stats pipe by its flag, not the series stats (lower.SeriesFoldKeepsFlag). The reads bypass the stats extent cache; identical reads in flight share one call (seriesFoldPost).'
    over:
      - 'the stream''s series on sliding windows: the group''s pooled samples, not Loki''s values (9.0e5 where Loki answers 5.4e9 on six hours of a request id per line)'
      - 'the partials of every series per bucket, chunked by a row count of the selection: exact, but 4 s, 19 calls, 154 MB of VictoriaLogs answers and 243 MB of proxy RSS for six hours of a request id per line (rejected by the owner, 2026-11-17)'
      - 'a stats_query_range read with a subquery over the read classing each series hash (spanning, several lines in one bucket, one line), the fold of #1540: exact, but the subquery scans the read again and computes the hash twice, 2.5-2.9x the VictoriaLogs time of the per-stream read (3.0-3.3x on 24h)'
      - 'total_stats by the hash between two stats pipes: VictoriaLogs v1.53 answers 422 on stats_query_range (only pipes that keep _time may stand before the last stats), and on /select/logsql/query it buffers every row (+1.4x)'
      - 'a stats pipe by the hash alone with each line kept as JSON (json_values of the lines): one group per series but a JSON value per line, 2.2x'
      - 'a second call reading the spanning series only: the call scans and hashes every line again (1.05-1.12x of the per-stream read on its own), 2.7x in all when series span buckets, and two calls where the per-stream read has one'
      - 'a cheaper identity: a stats grouping by a wildcard (stats by (__lvp_p_*)) is refused by VictoriaLogs v1.49 and v1.53; pack_logfmt is 0.1x cheaper but writes keys unquoted, so two label sets may pack alike; a hash of the line is not the label set (formatting, number or string, escapes)'
    why: |
      Loki takes the function per series over (t-range, t] and the vector
      aggregation over the series; the series is the stream and the parsed
      labels, which only a per-row hash names in VictoriaLogs. A series whose
      lines in a read lie in one bucket has, in every window of that read,
      either all of those lines or none (a window is a run of whole buckets and
      lies in the read that answers it), so its value in every window holding
      it is its value in that bucket: the outer sum, avg, max or min needs only
      each bucket's sum or extreme of those values and their count. Telling a
      series in one bucket from one spanning buckets needs a grouping across
      buckets, which stats_query_range does not allow (it adds its bucket to
      every stats pipe): /select/logsql/query runs the same stats with the
      bucket written in the grouping, over the bounds stats_query_range reads
      (VictoriaLogs aligns them only when a step is given), so the buckets are
      the same (TestSeriesFoldBoundsMatchStatsQueryRange, v1.49.0 and v1.54.0).
      One scan then counts each series' buckets and carries the rows of the
      spanning ones; the line is unpacked once and the hash computed once. The
      answer holds a row per bucket and group for the folded series and the
      partials of the others, not a row per line. Bucket values depend on the
      read's window, so the extent cache does not keep them; identical
      concurrent reads share one call instead. A series with a NaN line keeps
      its partials (Loki's NaN rules are per series), and so does one whose
      value is not finite: VictoriaLogs' range filters read +Inf below inf, so
      the finite test is the float64 bounds. The kept partials pass through the
      last stats pipe with any(), not sum(), whose result over a NaN value
      VictoriaLogs does not keep; so no nan mark (the counting gate's flag of a
      NaN value a later sum reads, semantics/unwrap-identity-nan-partials)
      stands before that pipe.
