id: metric-series-identity
kind: identity
title: A metric series is named by the stream, its metadata and its parsed labels

loki: |
  The series of a range aggregation is the stream labels plus the structured
  metadata of the entry plus every label the pipeline extracted, so one stream
  can carry many series. The outer aggregation then reads one value per series:
  sum adds them, count counts them, min/max/avg fold them, and `without (...)`
  drops the named labels and folds what remains with the same operator.

victorialogs: |
  A stats pipe groups by the fields named in `by (...)`. There is no notion of
  a Loki series, and the keys `unpack_json` / `unpack_logfmt` produce are known
  only after a row is read, so they cannot appear in a `by (...)` clause. A
  second stats pipe can aggregate the rows of the first, which is how a
  per-series value is folded without leaving the backend.

proxy: |
  Translating count/min/max/avg to the same single stats pipe as sum answers
  with the line count instead of the series count. The inner pipe must keep the
  series identity (the requested labels plus the stream and its level, plus the
  captures a `| regexp` or `| pattern` stage names) and an outer pipe folds
  those per-series values. For `without (...)` the outer pipe keeps the
  identity and the proxy folds the rows of each remaining label set with the
  query's operator rather than summing them.

implementation:
  - "internal/translator/translator.go seriesLevelOuterAggregation, joinByLabels, addByClauseLast"
  - "internal/proxy/vector_matching.go applyWithoutGrouping, withoutMergeForOp"

cases:
  - metric-identity/count-by-counts-series
  - metric-identity/max-by-folds-series-values
  - metric-identity/count-without-drops-label
  - metric-identity/sum-is-row-aggregation
  - metric-identity/structured-metadata-splits-series   # deviation, see state
  - metric-identity/dynamic-key-parser-labels           # deviation, see state
  - semantics/non-sum-vector-aggregation-unreduced
  - semantics/stddev-stdvar-grouped-values
decisions:
  - id: parser-identity-sliding-windows-bucket-merge
    chosen: 'A parser''s series identity over a range longer than the step reads one stats_query_range call of the function''s partial aggregates per series hash and per anchored bucket (the hash written before the unwrap gate, lower.Profile IdentityAhead); the window evaluator merges each series'' buckets into Loki''s windows and the outer aggregation folds the series (foldDynamicIdentity). max by over max_over_time and min by over min_over_time keep the per-group read.'
    over:
      - 'k = range / gcd(range, step) tumbling reads at shifted phases of the step = range text, each aggregated in VictoriaLogs (k scans of the window: 60 for a [5m] range at a 5 s step)'
      - 'keeping the stream''s series on sliding windows (the values were not Loki''s: the group''s pooled samples)'
      - 'reading the raw rows of the window (proportional to data volume, refused by the metric rules)'
      - 'one bucket read of the whole range (its answer grows with the lines when every line is a series of its own: 64 MiB at 6h of the e2e generator, then a 500)'
      - 'folding the one-sample series inside VictoriaLogs (total_stats by the hash, then a stats pipe per bucket and group): far smaller answers for a series per line, but a custom fold in the window evaluator and new VictoriaLogs pipe semantics to prove on v1.49 and v1.53 (follow-up)'
    why: |
      Loki takes the function per series over (t-range, t] and the vector
      aggregation over the series; the series is the stream and the parsed
      labels, which only a per-row hash names in VictoriaLogs. The windows of a
      non-decomposable function (avg, max, min, stddev, stdvar) of each series
      cannot be folded before the series are, so VictoriaLogs answers the
      partial aggregates per series and bucket, and the proxy merges them, as it
      already does for the stream's series. One VictoriaLogs call per request,
      on the anchored bucket grid the stats extent cache reuses; the shifted
      tumbling reads would multiply VictoriaLogs scans by k. The answer the
      proxy holds is series x occupied buckets (never more than the window's
      rows), bounded by the raw-row budget of a request that folds its series.
      An extreme of extremes needs no series and keeps the cheaper read.
      The read is split by time into chunks sized by one row count of the
      selection (no parser, no hash): each chunk's bucket answer stays under an
      eighth of what the proxy reads from one stats answer, so proxy memory is
      bounded by the chunk, not by the data; the first chunk's answer measures
      the bytes a row costs, so few series of many lines are read in one or
      two chunks.
    evidence: 'internal/querycorpus (2026-11-16, Loki engine oracle, VictoriaLogs v1.53.0 and v1.49.0): step<range runs that match Loki, base -> head: TestUnwrapDynamicIdentityMatchLoki 5 -> 54 of 74, TestKeepUnwrapIdentityMatchLoki 65 -> 73 of 93, TestStddevStdvarMatchLoki 29 -> 35 of 39, TestUnwrapDynamicValueFormsMatchLoki 82 -> 200 of 200; internal/proxy TestDynamicIdentityWindowsMatchLokiReference (generated windows, v1.49.0 and v1.53.0 emulated, no raw rows), TestDynamicIdentityWindowCacheReuse (repeat 0 calls, refresh 6 of 367 buckets)'
    code: [internal/queryplan/lower/unwrap_dynamic.go, internal/queryplan/lower/unwrap.go, internal/proxy/unwrap_dynamic_identity.go, internal/proxy/range_metric_compat.go, internal/proxy/unwrap_samples.go, internal/proxy/vector_agg_fold.go]
    tests: [TestUnwrapDynamicIdentityMatchLoki, TestKeepUnwrapIdentityMatchLoki, TestStddevStdvarMatchLoki, TestUnwrapDynamicValueFormsMatchLoki, TestDynamicIdentityWindowsMatchLokiReference, TestDynamicIdentityWindowsKeepExtremes, TestDynamicIdentityWindowsFoldBeyondSeriesLimit, TestDynamicIdentityWindowsChunked, TestDynamicIdentityWindowsChunkFloor, TestDynamicIdentityWindowsChunkedRefresh, TestDynamicIdentityWindowCacheReuse, TestDynamicUnwrapIdentityAhead, FuzzDynamicUnwrapIdentity, FuzzDynamicIdentityWindowsMark, TestCompat_UnwrapPerSeriesIdentity]
    quality: 'Loki''s series and values at every step for every range and step; one VictoriaLogs call per request; no raw rows; proxy memory bounded by one chunk''s bucket answer; the hash never reaches a client.'
    performance:
      - 'internal/proxy/unwrap_dynamic_identity_window_bench_test.go BenchmarkDynamicIdentityWindows (2026-11-16, Apple M5 Pro, GOMAXPROCS=2, n=6 interleaved, VictoriaLogs answers from the emulator served again): 2,000 lines over 1h at a 1m step under [5m]; a series per line: sum by (pod) of avg 0.46 -> 13.8 ms/op, 822 -> 58,959 allocs/op; 40 series: 0.43 -> 2.0 ms/op, 766 -> 2,219 allocs/op; max by of max unchanged. The cost is the per-series bucket read the Loki answer needs (base read one group, with the wrong values); the hits collector''s per-series label map and key are the bulk of the allocations (follow-up).'
      - 'At volume (2026-11-16, VictoriaLogs v1.53.0 own handlers in process, cold, one request at a time; api-gateway json lines with a request id each): 6h of 450K lines, [5m] at 60s: main 0.18 s, 1 call, 16 KB (wrong values); head 4.0 s, 19 calls, 154 MB, peak RSS 243 MB (main 40 MB). 6h of 900K lines: head 11.0 s, 61 calls, 456 MB, peak RSS 218 MB (memory bounded by the chunk). 24h of 436K lines at 120s: head 3.6 s, 16 calls. 20 series of many lines: 2 calls, as main. Loki on the stack: pending.'
perf:
  max_ratio: 2.0
  target_ratio: 1.0
  modes: [cold, warm, refresh]
  locked: false
  locked_since: null
  effort_exception: null

decisions:
  - id: max-of-max-reads-group-rows
    chosen: 'max over max_over_time and min over min_over_time (by labels or none) after a json or logfmt parser are one stats pipe by the clause over the group''s rows: no series identity (no second unpack and hash after a parser of every key, no per-series stats after an extraction list, whose logfmt unpack reads the unwrapped key and the clause labels the list names only)'
    over:
      - 'the series identity of the other functions (a value per series, then the aggregation): exact, and up to 5x the VictoriaLogs time after a parser of every key'
      - 'leaving these shapes to the stream identity of the string translator (exact for this pair, a stats pipe per stream and line)'
    why: |
      The maximum of the series' maxima is the maximum of all their samples, and
      the minimum of their minima the minimum, whatever the series are: Loki's
      answer is the group's extreme. Owner decision 2026-11-17: the extraction
      list's series identity was accepted where exactness costs (sum by over
      max_over_time, +41-48%), and the max of max and min of min shapes, which
      need no identity, come below base. A range longer than the step already
      took the extreme of the group's lines (unwrapGroupPushdown).
      For sum by (ns) over max_over_time after an extraction list no cheaper
      exact grouping was found: _stream_id for _stream measures the same, and
      reading ns back from each series' stream instead of grouping by it 3-4%
      less, through a text extract of the stream it was not worth.
    evidence: 'TestExtractionListIdentityMatchLoki, TestUnwrapDynamicIdentityMatchLoki, TestUnwrapDynamicValueFormsMatchLoki and TestJSONLineFieldsMatchLoki (internal/querycorpus, Loki engine oracle, VictoriaLogs v1.49.0 and v1.53.0, 2026-11-17): the same runs match Loki as on base and two more (extraction lists 106 instant / 99 step=range / 73 step<range / 100 step>range of 169, base 106 / 99 / 72 / 99: the error over an unconvertible value names Loki''s line at step<range and step>range), and the new max and min rows over convertible values (17 extraction-list, 8 parser) match on every request kind but the empty-label one; TestExtractionListIdentityVictoriaLogsCost (600,000 rows, 21 interleaved runs, p50): extraction list 197 -> 126 ms (-36%), parser of every key 718 -> 140 ms (-81%), every other shape within 0.6%'
    code: [internal/queryplan/lower/unwrap_dynamic.go, internal/queryplan/lower/unwrap.go]
    tests: [TestFoldsRowsLowering, FuzzDynamicUnwrapIdentity, TestExtractionListOutsideWithoutKeepsItsGrouping, TestExtractionListIdentityMatchLoki, TestUnwrapDynamicIdentityMatchLoki, TestUnwrapDynamicValueFormsMatchLoki]
    quality: 'Every answer as before and as Loki''s recorded answer; one stats pipe for these shapes.'
    performance:
      tracked: ['TestExtractionListIdentityVictoriaLogsCost (LVP_XLIST_VLCOST=1): VictoriaLogs p50 per shape, translator vs base vs head', 'BenchmarkExtractionListIdentityLowering and BenchmarkTranslateExtractionListMiss, base vs head']
      bound: 'VictoriaLogs time of the max and min shapes at or below base on v1.49.0 and v1.53.0; no other shape slower'
    pending: true
  - id: extraction-list-sliding-windows
    chosen: 'on a range longer than the step, an extraction list''s series identity (the stream, its stored level fields and the listed labels, fields of the row) groups VictoriaLogs'' sub-step buckets, the window evaluator merges each series'' buckets into its window and the proxy folds the vector aggregation after the windows'
    over:
      - 'the stream''s series and each line''s step bucket (origin/main): each line a series of its own and each step bucket read as the window, so sum over stdvar_over_time answered 0'
      - 'the same for a parser of every key: its identity is a hash per distinct parsed label set, one series per line when lines carry a key of their own, which the window evaluator would hold in the proxy per bucket'
    why: |
      Loki evaluates a range function per series over (t-range, t] and then
      folds the vector aggregation. After an extraction list the series are
      known from the query and are fields VictoriaLogs groups by, so the
      partial aggregates (sum and count, mean, count and deviation, extremes)
      of each series' sub-step buckets merge into the series' windows exactly,
      and the fold reads one value per series. A clause by level or
      detected_level keeps the stream's series (the line's level is read from
      raw rows there).
    evidence: 'TestExtractionListIdentityMatchLoki (Loki engine oracle, VictoriaLogs v1.49.0 and v1.53.0, 2026-11-17): step<range 55 -> 82 of 149 runs match (27 queries), every other request kind unchanged; TestUnwrapDynamicValueFormsMatchLoki: the 45 extraction-list rows at step<range match; TestListedIdentityWindowsVictoriaLogsCost (600,000 rows, query_range 1h, step 60s, range 5m): VictoriaLogs time -31% to -76% on five shapes, +16% on sum by (ns) over max_over_time'
    code: [internal/proxy/unwrap_dynamic_identity.go, internal/proxy/unwrap_samples.go, internal/proxy/vector_agg_fold.go, internal/queryplan/lower/unwrap_dynamic.go]
    tests: [TestListedUnwrapIdentity, TestDynamicIdentityHandlersReadThePlan, TestExtractionListOutsideWithoutKeepsItsGrouping, TestResponseKeyFencesFireOnTheSpellingsTheParserReads, TestExtractionListIdentityMatchLoki, TestUnwrapDynamicValueFormsMatchLoki]
    quality: 'Every extraction-list run at step<range that differed now matches Loki; no run of any kind moves from matching to differing.'
    performance:
      tracked: ['TestListedIdentityWindowsVictoriaLogsCost (LVP_XLIST_WINDOWS_VLCOST=1): VictoriaLogs time of the stats calls per shape, origin/main''s route vs the windows', 'BenchmarkListedIdentityWindowsDecision, base vs head']
      bound: 'one stats_query_range per request as before; VictoriaLogs time at or below base except sum by over max_over_time (+16%, the per-series step Loki''s answer needs)'
    pending: true
  - id: extraction-list-window-chunks
    chosen: 'the windows of an extraction list''s series identity on a range longer than the step are evaluated in time chunks, as a query frontend splits a range: a chunk of steps reads its buckets from the range before its first step to its last, its windows are folded into the one fold of the request as they are read, and its partials are dropped. A chunk reads at most 11,000 buckets; -manual-range-metric-row-limit bounds the series one chunk''s read holds (and the stats body bound its bytes): a chunk over either is cut to a quarter and read again, and the next chunk is sized to half the bound from what the last one held. The size a request needed is kept for ten minutes on the replica, so the next request reads no chunk over the bound. Chunks are read one after another.'
    over:
      - 'one read of every series and bucket before the fold (the extraction-list windows as first written): a listed label of many values over a long range passed the read bound and answered 400, or fell to the raw rows and passed the response bound (500), where Loki answers 200'
      - 'raising the default bound, or a hidden ceiling: either leaves a request Loki answers refused past it'
      - 'a ring of per-series partials over rows consumed in time order: VictoriaLogs answers stats_query_range series by series (sorted by result name, then labels), each with every bucket, so one series'' partials are not adjacent and the answer is not time ordered'
      - 'splitting the request into requests of their own through the query_range handler (as the settled-steps cache evaluates its gaps): each would plan, look up caches and fence again, and the overflow would have to be read back from an answer''s text'
      - 'halving a chunk over the bound: over a tenfold overflow it threw away three VictoriaLogs reads computed in full, a quarter two (VictoriaLogs time 15-17 s against 9-10 s on avg by (ns) (stddev_over_time(... | logfmt amount, id ...)) over 6 h)'
    why: |
      A step's value at t depends only on the buckets in (t-range, t]. A chunk
      whose fetch starts a whole number of steps after the request's reads the
      same buckets on the same grid, and the fold keeps a cell per group and
      sample time and visits a step's series in sorted key order within the one
      chunk that holds the step, so the chunked answer is the one-read answer
      byte for byte. VictoriaLogs still does the aggregation (stats per series
      and bucket); the proxy merges partials and holds one chunk at a time.
      The only refusal left is a single step whose window holds more series than
      the bound, Loki's limit error naming the flag; the folded answer keeps
      Loki's series limit.
    evidence: 'TestListedWindowChunksMatchLoki (internal/querycorpus, Loki engine oracle, VictoriaLogs v1.49.0 and v1.53.0, 2026-11-17): five shapes over 6 h at 15 s and 7 s, 2,500 listed values, every run Loki''s answer; at a bound of 600 series 37-38 chunks, the result byte for byte the one-read one; at 7 s (21,900 one-second buckets) 3 chunks under the default bound. TestListedWindowChunksMatchUnchunked and FuzzListedWindowChunks: random windows, steps, ranges and bounds, byte-identical. TestListedWindowChunksMemoryBounded: series 1,534 -> 23,939 in one read, at most 3,168 per chunk (budget 6,000).'
    code: [internal/proxy/listed_window_chunks.go, internal/proxy/range_metric_compat.go]
    tests: [TestListedWindowChunksMatchLoki, TestListedWindowChunksMatchUnchunked, FuzzListedWindowChunks, TestListedWindowChunksMemoryBounded, TestExtractionListOutsideWithoutKeepsItsGrouping]
    quality: 'A long range over a listed label of many values answers 200 with Loki''s values; every request that fits one chunk reads and answers exactly as before.'
    performance:
      tracked: ['TestListedWindowChunksVictoriaLogsCost (LVP_XLIST_CHUNKS_VLCOST=1): status, VictoriaLogs time and calls per shape, one read vs chunks', 'TestListedIdentityWindowsVictoriaLogsCost (LVP_XLIST_WINDOWS_VLCOST=1)', 'BenchmarkListedWindowsRequest, base vs head']
      bound: 'a request that fits one chunk: one stats_query_range as before, proxy cost within noise; a chunked request: one stats_query_range per chunk read one after another, each reading the range before its chunk again'
    pending: true
