id: delete-api-requires-token
kind: semantics
title: The delete API is closed unless the caller presents its own delete token

loki: |
  Loki registers /loki/api/v1/delete only with compactor retention enabled
  (otherwise 404) and has no authentication of its own: a deployment puts an
  authenticating gateway in front of it. With auth_enabled it checks the
  tenant (no org id, tenant ID syntax, one tenant: answers recorded in
  internal/proxy/testdata/tenant_auth_loki_answers.jsonl, delete/*).

victorialogs: |
  VictoriaLogs' /select/logsql/delete is an admin endpoint; current releases
  reject the forwarded request.

proxy: |
  -delete-api-enabled registers the route; it requires -delete-api-auth-token
  (startup and proxy.New refuse the configuration without one; the Helm chart
  refuses to render without deleteAuth.existingSecret or the plain value).
  deleteAuthMiddleware answers every request without the token (X-Delete-Token
  or Authorization: Bearer, constant-time compare) with 401 "delete
  authentication required" before the method, tenant, rate limit, confirmation
  and parameter checks, and removes the token from the request so it is never
  forwarded to VictoriaLogs or logged. The admin token does not open the route
  and the delete token does not open the admin routes; the admin token and the
  loopback -admin-listen behave exactly as without deletes. After the token,
  Loki's tenant answers and the existing safeguards (X-Delete-Confirmation, a
  stream selector, start and end, 30 days at most, tenant scoping, audit log
  lines before and after) apply unchanged.

implementation:
  - internal/proxy/middleware.go
  - internal/proxy/proxy.go
  - cmd/proxy/main.go
  - charts/loki-vl-proxy/templates/_helpers.tpl
  - charts/loki-vl-proxy/templates/deployment.yaml

decisions:
  - id: delete-needs-its-own-token
    chosen: 'Delete requires its own token (-delete-api-auth-token, Helm deleteAuth.existingSecret): closed by default, refused at startup and Helm render without it, checked before Loki''s tenant and parameter answers'
    over: [the confirmation header alone (any client that can reach the proxy could delete), the admin token (setting it moves /admin/* and /debug/* onto the main listener; owner 2026-11-11 chose a separate token so the admin surfaces stay on loopback exactly as before)]
    why: |
      Owner hard rule 2026-11-11: the proxy's write and delete routes are
      protected and closed by default, and enabling deletes must not change
      where the admin and debug surfaces listen. Bare Loki has no auth, so the
      token check is a documented deviation that answers first; every other
      answer on the route stays Loki's.
    evidence: 'TestDeleteAuth_ClosedWithoutToken, TestDeleteAuth_TokenGatesTheHandler, TestDeleteAuth_SeparateFromAdminToken, TestValidateDeleteAPI, TestRun_DeleteAPIWithoutTokenRefusesToStart, TestRun_DeleteAPIKeepsAdminListenerOnLoopback, validate_helm_secrets.sh (2026-11-11)'
    code: [internal/proxy/middleware.go, internal/proxy/proxy.go, cmd/proxy/main.go, charts/loki-vl-proxy/templates/_helpers.tpl, charts/loki-vl-proxy/templates/deployment.yaml]
    tests: [TestDeleteAuth_ClosedWithoutToken, TestDeleteAuth_TokenGatesTheHandler, TestDeleteAuth_SeparateFromAdminToken, TestValidateDeleteAPI, TestRun_DeleteAPIWithoutTokenRefusesToStart, TestRun_DeleteAPIKeepsAdminListenerOnLoopback, TestTenantAuth_AnswersLikeLoki]
    quality: 'No delete reaches VictoriaLogs without the delete token; the token never reaches VictoriaLogs or the log; the admin listener is unchanged.'
    pending: true
