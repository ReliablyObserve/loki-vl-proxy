id: peer-cache-metadata
kind: resource_control
title: Label and detected-field answers are read from the ring owner and the disk tier

loki: |
  Loki answers labels, label values and detected fields from its index and
  ingesters, the same for every querier; nothing is lost when a querier
  restarts.

victorialogs: |
  Every field_names, field_values and stream_field_values listing is a scan
  of the requested range; VictoriaLogs keeps no listing a proxy replica can
  share.

proxy: |
  /labels, /label/{name}/values, /detected_labels, /detected_fields,
  /detected_field/{name}/values, /index/stats and /index/volume(_range) answers
  are stored with SetLocalAndDiskWithTTL (cache_keys.go:295): memory and the
  writer's disk, never pushed to the owner. They are read with
  GetSharedWithAge (cache_keys.go:313): memory, disk, then the ring owner's
  memory (peer.go:628 serves peers from memory only). The time-bucketed
  metadata inventory behind them is written with SetWithTTL and pushed to the
  owner (metadata_inventory.go:917).
  Fleet proof (TestFleetPeerCacheProof): twelve answers computed on A are read
  on B and C; every answer served from a peer or the disk costs no
  VictoriaLogs call; after a restart B serves answers from its disk; after
  it lost its disk it reads them from their owners; with A down B and C answer
  the same; the rebuilt label values equal Loki's.
  A listing that ends within -max-metadata-cache-freshness (24h) revalidates
  its recent edge from VictoriaLogs on every replica by design (Loki reads
  that window live), so the proof's fixture is older than 24h.
  Not covered (open): an answer computed by a replica that is not the key's
  owner is never pushed, so the other replicas find it only once the owner
  computed it itself; a replica that lost its disk does not refill the keys
  it owns from copies on other replicas (peer.go:326); /index/stats and
  /index/volume answers live 10s, below -disk-cache-min-ttl and close to the
  5s a peer requires (peer.go:629), so they are effectively per replica.

implementation:
  - internal/proxy/cache_keys.go
  - internal/proxy/label_handlers.go
  - internal/proxy/label_metadata.go
  - internal/proxy/metadata_inventory.go
