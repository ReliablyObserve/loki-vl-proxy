id: backend-admission-and-heavy-query-queueing
kind: limits
title: Heavy backend work is admitted, queued, then refused like Loki's scheduler

loki: |
  Loki bounds the work in flight per component rather than per query. A querier
  admits max_concurrent queries; beyond that the query scheduler enqueues, and
  when the queue is full or the wait expires the request fails with HTTP 429 and
  the body "too many outstanding requests" (pkg/queue/queue.go
  ErrTooManyRequests). The limit is per replica and operator-configurable. A
  queued request is never counted as a backend failure, and a Logs Drilldown
  request does not turn it into an empty partial result.

victorialogs: |
  VictoriaLogs has -search.maxConcurrentRequests and -search.maxQueueDuration,
  but each stats, sort or uniq pipe may take up to 40% of -memory.allowedPercent
  and nothing accounts for that across concurrent queries. A handful of parallel
  long-range metric queries can take the whole process down, and the proxy sees
  only a dropped connection.

proxy: |
  The proxy admits at most -backend-max-concurrent-heavy-queries heavy
  VictoriaLogs calls per replica, queues the rest for at most
  -backend-heavy-query-queue-wait shared across all heavy calls of one request,
  and then answers with Loki's 429 and message, naming both flags. A released
  slot goes to the waiting tenant holding the fewest slots. Short-range
  metadata lookups (labels, label values, series, detected fields) are never
  queued, so a chart under backpressure does not take the label pickers with
  it. A rejection is
  proxy backpressure, not evidence about the backend: it must not open the
  circuit breaker, must not be recorded as a VictoriaLogs response, and must
  keep its 429 even for Grafana-sourced stats queries that otherwise carry the
  Drilldown partial-result carve-out.

  Long-range metadata listings (stream_field_names, stream_field_values,
  field_names, field_values and streams spanning at least
  -backend-heavy-query-min-range, or without a time range) have an adaptive
  limiter of their own: a 7-day stream_field_names scan held 0.8 GiB of
  VictoriaLogs memory and took 9-35 s on the e2e stack, many times that on a
  large deployment, and seven at once from seven replicas OOM-killed an 8 GiB
  VictoriaLogs, as did eleven replicas warming up at a static two each
  (limits/concurrent-full-retention-scans-exhaust-backend). Label names and
  values are listed from a time-bucketed inventory
  (semantics/label-inventory-exact-and-incremental), whose day bucket
  scans of a long listing go through the same limiter, each holding its slot
  only while its own call runs. Each replica
  learns its limit between -backend-min-concurrent-metadata-scans and
  -backend-max-concurrent-metadata-scans (limits/metadata-scan-adaptive-limit):
  the selects VictoriaLogs runs for others (read from its /metrics) count
  against it, so a fleet stays near one replica's limit; scans slower than
  -backend-metadata-scan-latency-tolerance times their no-load duration
  shrink it; backend failures and VictoriaLogs' queue timeouts halve it; a
  scan starts only while VictoriaLogs' memory keeps
  -backend-metadata-scan-memory-headroom free; and a scan is stopped, its
  request answered with the 429, when VictoriaLogs' memory in use passes a
  third of the way into the headroom anyway. The limiter is separate from
  the heavy one so a 7-day label browser never waits behind 7-day charts, and
  short-range listings and inventory edges stay unqueued. A synchronous
  request waits the queue wait and then gets the same 429, naming the flags
  and the signal that closed the door; background inventory work (startup
  warm-up, keep-warm, stale refreshes) skips instead of waiting and never
  takes the last slot while a request could use it, a failed preset warm-up
  backs off, the startup warm-up covers only presets below
  -backend-heavy-query-min-range and only while VictoriaLogs has room, and
  the keep-warm interval is jittered so replicas started together drift
  apart.

