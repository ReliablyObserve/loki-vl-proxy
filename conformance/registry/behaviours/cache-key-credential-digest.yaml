id: cache-key-credential-digest
kind: semantics
title: Credentials enter cache keys only as keyed digests

loki: |
  Loki has no credential-scoped cache: it does not forward client credentials
  to its storage. This is a rule of the proxy's own cache with no Loki API
  counterpart; answers are unchanged.

victorialogs: |
  VictoriaLogs receives the forwarded headers and cookies and the backend
  basic-auth credentials as before; the digests stay inside the proxy.

proxy: |
  Cache keys are stored with the answers: the disk cache and its restart
  hand-over, pattern and label-index snapshots, peer replicas and the peers'
  hot-key index, and debug log lines. A request that forwards a credential
  (-forward-authorization, -forward-headers, -forward-cookies) gets the auth
  fingerprint fwdid.k1.<HMAC-SHA256> over its tenant scope, forwarded headers
  and forwarded cookies (length-prefixed fields); the -backend-basic-auth
  header enters the routing namespace as a keyed digest too. The key is
  HKDF-SHA256 of -cache-key-secret (file or CACHE_KEY_SECRET), else of
  -peer-auth-token, else of 32 random bytes per process; the secret is never
  written to the cache volume. Replicas and restarts with one secret share
  credential-scoped entries; different or missing secrets miss, never serving
  another caller's answer; entries of the unkeyed form (fwdid.<SHA-256>) are
  never read. The fwdid. marker stays first, so peerPushAllowed keeps such
  entries off the push path. Requests without a credential (nothing forwarded,
  only trusted proxy identity, no backend basic auth) keep their keys byte for
  byte. The restart hand-over scope leaves every basic-auth, token, password
  and secret flag out of its hash. The Helm chart keeps a generated key in
  <release>-cache-key (created on the first install, kept on upgrades via
  lookup) unless cacheKeySecret.existingSecret, cacheKeySecret.generate=false
  or an extraArgs value says otherwise; a render without cluster access
  (helm template, Argo CD) renders and mounts no key rather than a new one per
  render. Credential-scoped entries stay on their replica: every key built
  from such a request holds the fingerprint (":auth:", ":scope:" and other
  spellings) or, when it hashes it (stats extents, query-statistics
  companions, pattern windows and state), credentialScopeMark; the push
  filter matches the prefix anywhere, the hot index omits those keys,
  read-ahead never fetches them, and /patterns with credentials is answered
  locally. User information of the backend URLs enters keys only as a keyed
  digest after the bare URL and never the hand-over scope.

implementation:
  - internal/proxy/credential_digest.go
  - internal/proxy/http_utils.go
  - internal/proxy/request_scope.go
  - internal/proxy/proxy.go
  - internal/proxy/stats_extent_cache.go
  - internal/proxy/query_stats_totals.go
  - internal/proxy/patterns.go
  - internal/proxy/patterns_owner.go
  - internal/cache/peer.go
  - cmd/proxy/main.go
  - cmd/proxy/cache_handover_scope.go
  - charts/loki-vl-proxy/templates/_helpers.tpl
  - charts/loki-vl-proxy/templates/cache-key-secret.yaml

decisions:
  - id: cache-key-credential-digest-key-source
    chosen: 'HMAC-SHA256 under a key derived with HKDF-SHA256 from -cache-key-secret, else -peer-auth-token, else random bytes per process'
    over: [plain SHA-256 (a stored key confirms a guessed credential offline), a random key written to the cache volume (stored beside the keys it protects), a slow password hash per request (hot path cost for every forwarded request), a per-process key only (a peer fleet would lose credential-scoped peer reads and every restart its disk entries)]
    why: |
      The keys leave the process (disk, snapshots, peers, logs), so their
      credential part must not be computable without a secret kept elsewhere.
      A peer fleet already shares the peer token (the chart generates it), so
      deriving from it keeps fleet and restart reuse without new
      configuration; -cache-key-secret covers a single replica with a
      persistent disk cache and fleets that run without a peer token. The
      derivation separates the key from the token's own use on /_cache/*.
    evidence: 'TestCredentialFingerprintCannotBeRecomputedWithoutKey, TestBackendCredentialsCannotBeRecomputedFromNamespace and TestCacheHandoverScope fail on main (3576e4a63); TestCacheKeysWithoutCredentialsMatchRecordedKeys passes on main and on the change with keys recorded from main; TestCredentialScopedKeyReuseAcrossProcesses: 200/200 credential keys reproduced with one secret or one peer token, 0/200 with no or different keys, 200/200 keys without credentials in every case (2026-11-26)'
    code: [internal/proxy/credential_digest.go, internal/proxy/http_utils.go, internal/proxy/request_scope.go, cmd/proxy/main.go, cmd/proxy/cache_handover_scope.go]
    tests: [TestCredentialFingerprintCannotBeRecomputedWithoutKey, TestBackendCredentialsCannotBeRecomputedFromNamespace, TestCredentialDigestKeySources, TestUnkeyedFingerprintEntriesAreNeverServed, TestPeerPushRefusesKeyedCredentialEntries, TestCredentialScopedKeyReuseAcrossProcesses, TestCacheKeysWithoutCredentialsMatchRecordedKeys, FuzzCredentialFingerprintsNeverCollide, TestCacheHandoverScope, TestSecretsAreMountedFiles, TestSecretExtraArgs, TestCacheKeySecretGeneratedAndKept, TestCredentialScopedKeysAreNeverPushed, TestBackendURLUserinfoIsNotInCacheKeys, TestPeerCache_PushFilterKeepsKeysOutOfHotIndexAndReadAhead]
    quality: 'Distinct credentials never share a key (fuzz); no key without credentials changes; old-form entries are never read; no secret on the cache volume, in logs or in /config.'
    performance: 'BenchmarkForwardedAuthFingerprint: credential path 1037 -> 593 ns/op, 1.64 -> 1.11 KiB/op, 26 -> 11 allocs/op (the keyed input is length-prefixed instead of JSON); paths without credentials unchanged (Apple M5 Pro, GOMAXPROCS=4, count 8).'
    pending: true
