decisions:
  - id: restore-at-lower-priority-than-queries
    chosen: 'An adaptive governor per serving replica (start 2 MiB/s, x1.15 per 200 ms tick after five clean ticks up to the configured ceiling, halve after two pressured ticks, pause on a severe signal, end a stream paused past 30 s as throttled, refuse new streams while paused or pressured), with pressure read from the query and peer-request p99 over the last second, scheduler latency p99, CPU and GC share, heap against GOMEMLIMIT, disk lookup latency and write stalls, each against a baseline learned without pressure; batches paced to 100 ms of the rate in small bursts; a requester intake cap'
    over: ['fixed 2 streams and 64 MiB/s per serving replica (owner, 2026-11-26: not enough, it does not back off when the replica is busy)', 'a fixed low rate (restores slow on idle fleets, still harmful on busy ones)', 'OS-level priorities (not available per goroutine)']
    why: 'Owner requirement 2026-11-26: the restore must never degrade other proxies or their latency; it may use spare resources and must back off automatically when the serving proxy is busy.'
    evidence: '2026-11-26, TestFleet_PeerRestoreUnderQueryLoad (opt-in) on an 8 vCPU colima VM of an Apple M5 Pro host shared with other work, VictoriaLogs v1.54.0, both serving replicas limited to 1 CPU, a 2 GiB s2 fixture (720 MiB stored), restores by c, then d and e together, between three 45 s control phases. Final code, 1,100 req/s on the serving replica (23-32% of its core): every hit, peer and neighbour p50/p95/p99 within the worst control x 1.10 + 1 ms, 0 errors, restores complete at 60-63 MB/s; 220 req/s: pass, complete at 17-40 MB/s. Same load with the stricter peer threshold of the previous commit (replica at 37-50% CPU): pass, restores throttled to about 1.5 MB/s and partial at their 180 s deadline (61-79% of entries); 4 CPUs at 2,200 req/s: pass. Before the p99 signals (mean latency, 4 MiB bursts): the two-replica restore failed (hit p99 6.67 ms against 2.57 ms).'
    code: [internal/cache/peer_bulk_governor.go, internal/cache/peer_bulk_serve.go, internal/cache/restore_peer.go, internal/metrics/metrics.go]
    tests: [TestBulkGovernor_RampsFromLowToTheCeiling, TestBulkGovernor_HalvesUnderPressureWithDebounce, TestBulkGovernor_PausesResumesAndAborts, TestBulkGovernor_StreamsShareOneRate, TestBulkSignals_LatencyAgainstItsBaseline, TestPeerBulkServe_PausedStreamHoldsNoLock, TestPeerRestore_ThrottledStreamEndsPartial, TestPeerBulkServe_RefusesNewStreamsWhilePaused, TestPeerRestore_IntakeCap, TestFleet_PeerRestoreUnderQueryLoad]
    quality: 'Queries and peer reads first: a busy replica slows, pauses or refuses restores, which then end partial at their deadline; correctness rules of restore-from-peers-by-pull unchanged.'
    performance: 'TestFleet_PeerRestoreUnderQueryLoad (opt-in LVP_PEER_LOAD=1): p50/p95/p99 of cached query_range hits, /_cache/get and neighbour hits while a restore is served at most the worst control phase x 1.10 + 1 ms, no errors; BenchmarkPeerBulkRestore with the governor fixed off for the transfer cost.'
    pending: true
  - id: restore-from-peers-by-pull
    chosen: 'A replica with nothing local to warm from pulls the entries it owns or replicates from its peers before ready: a probe of every peer, then at most 4 streamed, checksummed bulk transfers (POST /_cache/bulk) of records as stored, each key from one designated source on the requester''s ring, admitted through admitRestoreBatch within the warm-up''s budget and timeout; on whenever -cache-startup-warm-bytes is set (-cache-startup-peer-restore, default true); serving bounded per replica to 2 streams and 64 MiB/s'
    over: ['a stopping replica pushing its hot keys to the replicas that own them (issue #1766 item 3 as written: a crash or a lost volume never pushes, and the receiver may not be up)', 'filling a new disk lazily through single-key peer reads (one round trip per key on first lookup)', 'the hot-key read-ahead (8 MiB per 30 s)', 'a separate timeout and readiness gate for the peer restore (would change the chart''s progress deadline)']
    why: 'Owner decision 2026-11-26: a replica restores from peers when needed by pulling, which also covers crashes and lost volumes; a bulk transfer moves gigabytes before ready where per-key reads cost one round trip each after ready.'
    evidence: 'BenchmarkPeerBulkRestore, 2026-11-26, Apple M5 Pro, GOMAXPROCS=4, loopback (no network limit, no rate limit), served from the serving disk, mean of 3: 2 GiB s2 in 0.80 s (1.97 s with the receiver''s disk on), raw 0.78 s (2.52 s); 4 GiB s2 2.04 s (3.61 s), raw 3.80 s (4.41 s; 1.42 s and 2.77 s in an earlier run, page cache pressure on a shared laptop). Pod networks computed: 2 GiB s2 at the default 64 MiB/s per serving replica 11 s from one peer, 5.6 s from two, 2.8 s from four.'
    code: [internal/cache/restore_peer.go, internal/cache/peer_bulk_serve.go, internal/cache/peer_bulk_wire.go, internal/proxy/cache_handover.go]
    tests: [TestPeerRestore_WipedDiskRefillsReplicatedKeys, TestPeerRestore_EachKeyCrossesTheNetworkOnce, TestPeerRestore_ServingTouchesNoCounterOrRecency, TestPeerRestore_NeverOverwritesFresherLocalData, TestPeerRestore_MemoryOnlyScopeAndPushFilter, TestPeerRestore_PurgeDuringTheRestoreWins, TestPeerRestore_OldUnreachableAndRestoringPeersFallBackFast, TestPeerRestore_AllRestartingTogetherNoDeadlock, TestPeerBulkStream_CorruptHeaderEndsTheStream, TestCachePeerRestore_InitRestoresAnEmptyDiskFromPeers, TestFleet_PeerRestoreRefillsAWipedDisk]
    quality: 'Only keys the requester replicates, never over fresher local data, expiry never lengthened, memory-only answers only for the same scope and never on disk, forwarded-credential keys never leave their replica, a purge wins, corrupt records rejected one by one; /ready never waits past -cache-startup-warm-timeout.'
    performance: 'BenchmarkPeerBulkRestore (internal/cache/restore_peer_bench_test.go); opt-in gate TestPeerRestore_ThroughputGate (200 MiB/s over loopback at 2 GiB). Serving: at most -peer-bulk-serve-max-streams streams and -peer-bulk-serve-max-bytes-per-second per replica; no VictoriaLogs call on either side.'
    pending: true
  - id: restore-targets-and-probe-window-per-storage
    chosen: 'Restore time targets per storage profile, split into the index rebuild (startup probe) and the warm-up (warm-up timeout); with a disk cache a 605 s startup window and a Deployment progress deadline derived from it; warm-up timeout 120 s and flush budget 60 s unchanged'
    over: ['one pair of targets for every disk (2 GiB in 5 s, 4 GiB in 10 s)', 'a startup probe only with the restart hand-over, 305 s']
    why: 'The index rebuild reads one record at a time, so on a network volume its time follows the read latency, which provisioned IOPS do not shorten; the liveness probe alone restarts a pod after about 35 to 50 s.'
    evidence: '2026-11-26. Measured, Apple M5 Pro SSD, cold: s2 2 GiB rebuild 1.0 s + warm-up 0.47 s. Emulated on a throttled local VM without latency (not EBS), s2 2 GiB: 11.4 s at 125 MiB/s and 3,000 IOPS, 4.6 s at 375 and 6,500; 94,000 records rebuild in 31.9 s at 3,000 IOPS. Estimated at 3 ms a read: 288 s for 94,000 records, about 306 s for 100,000.'
    code: [charts/loki-vl-proxy/templates/_helpers.tpl, charts/loki-vl-proxy/templates/deployment.yaml]
    tests: [TestDiskCacheStartupWindowAndProgressDeadline, TestCacheHandoverChartOptions]
    quality: 'Without a disk cache the rendered chart is unchanged; explicit probe and deadline values win. No restore or index rebuild code changed.'
    performance: 'No code path changed; the restore benchmarks of restore-in-batches-with-read-ahead stand.'
    pending: true
  - id: restore-in-batches-with-read-ahead
    chosen: 'Restore in batches (at most 256 entries or about 4 MiB per read transaction and per hold of the memory lock, decoded by at most min(GOMAXPROCS, 4) goroutines) with the next records read into the page cache by positioned reads in file order, at most 64 MiB ahead'
    over: ['one lookup, transaction, decode and admission per entry in one goroutine', 'batches and parallel decode without the read-ahead (a cold page cache is still read through page faults)']
    why: 'A restart restores gigabytes before the replica is ready; a cold disk read through page faults is the bottleneck.'
    evidence: 'BenchmarkRestoreWarm, 2026-11-26, Apple M5 Pro, GOMAXPROCS=4, s2: 2 GiB restored from a cold page cache in 0.47 s (one entry at a time: 4.06 s; batches without the read-ahead: 2.25 s), from a warm one in 0.42 s (0.81 s).'
    code: [internal/cache/handover.go, internal/cache/restore.go, internal/cache/disk_restore.go, internal/cache/disk_restore_readahead.go]
    tests: [TestRestore_BatchesAreBoundedByBytes, TestRestore_APurgeDuringTheWarmUpWins, TestRestore_QueuedAndRewrittenValuesWinOverTheBatch, TestHandover_WarmPeakMemoryIsOneBatch, TestRestore_ReadAheadCoversTheRecordsAndStops]
    quality: 'The same entries restored, hottest first, under the same budgets, expiry, purge and no-overwrite rules; the disk recency stays as the ranks set it.'
    performance: 'BenchmarkRestoreWarm, BenchmarkRestoreShutdownFlush and BenchmarkRestoreIndexRebuild (internal/cache/restore_bench_test.go); opt-in gate TestRestoreWarm_ThroughputGate (400 MiB/s).'
    pending: true
