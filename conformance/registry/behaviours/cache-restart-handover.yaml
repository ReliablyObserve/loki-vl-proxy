  - id: disk-reads-one-record-per-piece
    chosen: 'Keep one disk record per cached piece (one metric bucket range, one patterns window, one answer), looked up side by side by the request that needs them; no record or read that batches the buckets of a query'
    over: ['one record per query holding its buckets (issue #1802 item 2, a disk format change)', 'one read transaction for all buckets of a query (GetMany)']
    why: 'Owner decision 2026-11-28 on issue #1802 item 2: closed with this record. The measured gain is under 0.2% of request time, because the buckets of a query are already read at the same time, and a batched record is slower to read after a restart.'
    evidence: |
      2026-11-28, main 640431dfc, macOS arm64 SSD, GOMAXPROCS=4, host loaded
      by other builds (load average about 11); the proxy as a host process with
      the disk cache, an in-process VictoriaLogs v1.54.0 with 540,000 JSON rows
      over 25 h, Grafana-shaped Drilldown and Explore page loads (27 requests
      per range at 1h, 6h, 24h), traced per lookup and per disk read. Disk hits
      only after a restart without the hand-over (3-8 per request) or with a 2
      MiB memory cache (3-9); none in repeats and refreshes; with the hand-over
      1 request in 81 read the disk. Record read p50 10-15 us; disk time on a
      request's critical path p50 0.1 ms, p90 0.2-2.5 ms. Batching the buckets
      of a query (simulated on the traces): 36% fewer disk reads, at most
      1.4-6.9 ms of 5-6 s of request time; with every read taking 1 or 3 ms,
      about 2% less disk time. Prototype, 24 buckets of 8 KiB per query,
      macOS (16 KiB bbolt pages): warm 172 us batched vs 199 us separate vs
      349 us side by side; after a cold restart 384 us batched vs 131 us
      separate and 106 us with one read transaction (GetMany), because the
      index rebuild has already read the pages of the small records.
