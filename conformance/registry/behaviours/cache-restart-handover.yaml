id: cache-restart-handover
kind: resource_control
title: A replica restarted gracefully starts with its previous memory hot set, never serving an entry past its expiry or for another build

loki: |
  Loki's results cache lives in memcached or an embedded cache; a querier that
  restarts reads what the cache still holds, and losing the cache makes
  queries slower, never different.

victorialogs: |
  VictoriaLogs holds the data; every cached answer can be computed again.

proxy: |
  Off by default. With -cache-shutdown-flush-timeout a graceful shutdown,
  after the HTTP server drained and every background writer stopped, walks
  the memory cache from the most to the least recently used entry within that
  budget: it gives each entry the disk tier holds the disk recency of its rank,
  writes the ones the disk lacks (hottest first), and keeps the ranks, the
  memory hit counts and, up to -cache-startup-warm-bytes, the completed
  query, query_range and series replies kept in memory only for their size,
  in a bucket of the same bbolt file that lookups, peer reads and the index
  rebuild never read. Other memory-only entries and patterns entries are
  never kept. The disk tier's Close writes a manifest as the file's last
  transaction, holding that transaction's id: any later write (an older
  binary, a purge, a crashed process) invalidates the hand-over and the next
  start drops it whole, as it drops a corrupt or unknown manifest, a record
  whose header checksum fails and a value whose record checksum fails.
  At start the index rebuild orders ranked records by rank (the hottest is
  evicted last). With -cache-startup-warm-bytes a background warm-up loads
  ranked entries into memory, hottest first, within that budget (at most half
  of -cache-max-bytes) and -cache-startup-warm-timeout, while /ready answers
  503 `response cache warming`, never past the timeout; Shutdown cancels and
  joins it. A disk record is restored as a disk hit would promote it (its own
  expiry, unknown age, never over a fresher memory entry, not after a purge
  started); a memory-only reply only for the same scope (build version and
  revision, hash of every flag value and environment override except the pod
  identity and credentials), and it stays memory-only. Nothing is restored
  when the clock reads earlier than the flush started. Restored entries go
  behind what live requests stored and never evict them. The replica reports
  ready when the warm-up finishes, or after the timeout (default 120 s; the
  chart gives the shutdown flush 60 s), whichever comes first.
  The warm-up restores in batches of at most 256 entries or about 4 MiB of
  decoded values: one bbolt read transaction per batch with at most
  min(GOMAXPROCS, 4) goroutines reading and decoding, one hold of the memory
  lock to admit the batch, and a read-ahead of the next records into the page
  cache (positioned reads in file order, at most 64 MiB ahead, eight 512 KiB
  buffers). The deadline is checked before every batch; a purge that started
  after the warm-up began stops it; a value queued for the disk wins over its
  record, and a record queued, rewritten or dropped after the batch read it is
  not restored. The warm-up counts no disk lookup and leaves the disk recency
  as the ranks set it. Its plan, progress, estimate and outcome are metrics
  (loki_vl_proxy_cache_restart_warm_*, with source="disk"; restored_entries and
  restored_bytes are what the memory tier took, from either source, without
  skipped entries), as is the start-up
  index rebuild's duration; the log has the plan with an estimate, progress
  every 2 s, a warning when the timeout will cut it, and the end with the skips
  by reason. How cold a new process is shows in
  loki_vl_proxy_cache_startup_l1_* (memory, first 10 minutes) and in
  loki_vl_proxy_cache_hit_ratio_since_start{tier,minutes}: each tier's hit ratio
  of the tier-stack lookups in the first 1, 5 and 15 minutes, live until the
  window has passed and then frozen, absent for a tier without lookups.
  Batch proof (internal/cache/restore_test.go): batches are bounded, limits
  skip without losing later entries, queued and rewritten values win, a purge
  between batches or between a read and its admission wins, the disk order is
  unchanged, a full memory tier stops it, progress reads right mid-way, the
  read-ahead covers the records and joins its goroutines, no second copy of
  the values is held, and a batch holds the memory lock briefly. The real-size
  throughput gate is TestRestoreWarm_ThroughputGate (LVP_RESTORE_GATE=1, not in
  CI: it needs gigabytes of disk and memory).
  Unit proof (internal/cache/handover_test.go): recency order and hit counts
  survive, scope mismatch restores disk entries only, a write after the
  manifest, records without a manifest (crash before Close), a corrupt or
  unknown manifest and a missing bucket are ignored, a corrupt record is
  skipped, a clock behind the flush restores nothing and a clock ahead only
  expires, a purge after the flush or during the warm-up wins, byte budgets
  keep the hottest, an expired deadline writes or loads nothing, a full disk
  ranks what it holds, a failing disk leaves no manifest, and live entries
  are never evicted or overwritten. Proxy lifecycle
  (internal/proxy/cache_handover_test.go): Shutdown flushes and the next Init
  warms, nothing runs with the defaults, the warm-up off drops the hand-over,
  /ready never waits past the timeout, Shutdown stops a running warm-up and
  hands back every goroutine. Fleet proof
  (TestFleet_RestartHandoverKeepsTheResponseCacheWarm, test/e2e-fleet, a ring
  of two replicas with the flags on): after `docker compose restart` the
  replica reports a complete previous flush and what it restored, both of a
  disk-held answer and an oversized memory-only answer are repeated from its
  memory tier with X-Loki-VL-Backend-Calls 0 and no disk read, equal to the
  first answers, and the other replica answers the same data.

  Helm (TestCacheHandoverChartOptions): cacheHandover.enabled=true renders the
  three flags, a grace period of at least the preStop sleep + 60 s of HTTP
  drain (main, then admin and metrics listeners) + flush + 5 s (a larger
  configured one is kept), a preStop sleep on Kubernetes 1.30+ unless
  lifecycle is set (a configured sleep counts toward the grace period),
  lets extraArgs override each flag and refuses to render without a disk
  cache. It also renders a warm-up timeout of 120 s (a pod is ready when
  warm, or partly warm after it); a startup probe on /health (never /ready,
  which also checks VictoriaLogs); for a Deployment without a
  configured strategy RollingUpdate with maxSurge 0 and maxUnavailable 1 (a
  surge pod on the same file would wait for the bbolt lock; one replica has a
  rollout gap), while a StatefulSet's RollingUpdate already updates one pod
  at a time; with more than one replica or HPA a PodDisruptionBudget with
  maxUnavailable 1; and minReadySeconds 15 (one peer discovery interval).
  Explicit probe.startup, workload.deploymentStrategy,
  podDisruptionBudget and cacheHandover.minReadySeconds settings win, and
  with the hand-over off the chart renders none of these.
  A disk cache (persistence.enabled or a non-empty extraArgs.disk-cache-path),
  with or without the hand-over, renders that startup probe with 120 failures
  5 s apart (605 s) for the disk index rebuild before the listener opens, and
  on a Deployment progressDeadlineSeconds = grace period + startup window +
  (hand-over) warm-up timeout and minReadySeconds + 300 s, when above 600 (935
  without the hand-over, 1170 with it, at the defaults);
  workload.progressDeadlineSeconds replaces it, explicit probe.startup values
  win, a StatefulSet gets no deadline, and without a disk cache the output is
  unchanged (TestDiskCacheStartupWindowAndProgressDeadline).
  Restore time targets per storage profile are in docs/disk-cache.md: local SSD
  measured; EBS targets rest on a throttled local VM without added latency and
  on latency estimates, with no EBS measurement.

  Restore from peers (internal/cache/restore_peer.go, peer_bulk_serve.go,
  peer_bulk_wire.go): a replica with nothing local to warm from (no valid
  hand-over, a disk cache that held no record at start or none) and a peer
  cache pulls the entries it owns or replicates from its peers inside the same
  -cache-startup-warm-bytes and -cache-startup-warm-timeout (on whenever the
  warm-up is: -cache-startup-peer-restore, default true; chart
  cacheHandover.peerRestore), so /ready, the startup probe and the chart's
  progress deadline are unchanged; the disk warm-up and the peer restore never
  both run. Every peer is probed once (older builds without the route, serving
  off, a peer restoring itself, a wrong token, an unreachable peer after three
  quick tries: skipped at once), then at most
  -cache-startup-peer-restore-concurrency streams run (POST /_cache/bulk, the
  peer token). The requester sends its ring (peers, itself, replication
  factor); a peer sends the keys the requester replicates for which it is the
  first other replica among the sources, so each key crosses once; memory hot
  set in recency order, then its disk records, newest first, up to the
  requester's remaining budget; a busy peer (429) is asked again after
  Retry-After until the timeout. Records go as stored (native disk records
  with their CRC32C), in frames whose header and payload carry CRC32C: a bad
  payload or record skips that record, a bad header ends the stream, a missing
  end frame is truncated and keeps what arrived. Batches go through
  admitRestoreBatch (budget, never over a held entry, behind live entries, a
  purge since the start stops it) with the TTL the peer had left (clocks never
  compared, under 5 s skipped), then to the local disk while memory still holds
  the restored value and the disk nothing for the key, hottest newest; memory-
  only answers only from the same scope and kept memory-only; push-filtered
  (forwarded-credential) keys, shadows and patterns entries never sent. A
  serving replica runs at most -peer-bulk-serve-max-streams streams (429 before
  any work beyond), -peer-bulk-serve-max-bytes-per-second for all, one batch
  per stream in memory, copies disk records out of one read transaction per
  batch with at most min(GOMAXPROCS, 4) goroutines, counts no lookup and moves
  no recency, refuses while it restores itself (no deadlock when all start
  together) and ends its streams when its HTTP server starts shutting down.
  Progress is the warm-up's metrics with source="peer"; the serving side has
  loki_vl_proxy_peer_cache_bulk_serve_*.
  Lower priority than queries (peer_bulk_governor.go): one governor per
  serving replica paces all its streams, starting at 2 MiB/s, growing by 15%
  per 200 ms tick after five clean ticks up to
  -peer-bulk-serve-max-bytes-per-second (a ceiling), halving after two
  pressured ticks (floor 256 KiB/s) and pausing every stream on a severe
  signal; a stream paused past -peer-bulk-serve-max-pause ends as throttled
  (the requester counts the rest peer_busy). Signals per tick, each against
  its baseline learned without pressure and a floor: p99 over the last second
  of completed queries (metrics RequestLoad histogram, tails excluded) and of
  peer requests, Go scheduler latency p99 over the last second, busy and GC
  share of the CPU budget, live heap against GOMEMLIMIT, mean disk lookup
  latency, and a write slower than its bytes allow. While paused or pressured new streams get
  429 (Retry-After 2-10 s). Batches hold 100 ms of the current rate (at most
  512 KiB per GOMAXPROCS), are copied into a reused buffer by one goroutine
  below the ceiling, and the stream yields after every record; the plan walks the memory LRU and
  the disk index 4,096 entries per lock hold; no lock or disk transaction is
  held while a stream waits. The requester caps its intake at
  -cache-startup-peer-restore-max-bytes-per-second and sends its deadline, so
  a stream never outlives it by more than 2 s.
  Unit proof (internal/cache/restore_peer_test.go, peer_bulk_wire_test.go):
  a wiped disk refills exactly the replicated keys into memory and disk with
  the remaining TTL, each key crosses once at RF 3, serving moves no counter or
  recency, fresher local data wins, memory-only answers only for the same scope
  and never on disk, push-filtered keys stay, a purge during the restore wins,
  the deadline and the budget keep the hottest, older/unreachable/restoring
  peers fall back fast, replicas restoring together finish at once, a busy peer
  is retried, a restoring server refuses and StopBulk ends streams, no
  goroutine is left; corrupt payloads and records are skipped, a corrupt header
  ends the stream, truncation keeps whole records, too-large, near-expiry and
  out-of-scope records are skipped, oversized headers are refused
  (FuzzPeerBulkStream). Proxy lifecycle (internal/proxy/cache_peer_restore_test.go):
  Init restores an empty disk from a peer while /ready answers 503, nothing
  runs with the flag or the warm-up off, the route needs the peer token, a
  stopped server is skipped. Fleet proof TestFleet_PeerRestoreRefillsAWipedDisk
  (test/e2e-fleet, CI job e2e-fleet): replica b removed with its volume
  restores from replica a before ready (source="peer", outcome done, one
  stream served by replica a) and repeats with 0 VictoriaLogs calls from
  memory, with no disk or peer read.

