id: explore-logs-volume-json
title: Grafana Explore renders the logs volume for a `| json` query
covers:
  endpoints: [loki_api_v1_query_range]
  behaviours: [severity-detected-level-derivation, parser-error-and-label-collision, data-density-and-chart-quality]
  logql: [range_function-count-over-time, parser-json, operator-sum]
consumers: [explore]

loki_layer: |
  Explore sends `sum by (level, detected_level) (count_over_time({...} | json |
  drop __error__ [$__auto]))`. Loki parses each line, excludes lines whose parser
  failed unless the pipeline drops the error, groups by the level stream label and
  by the detected_level it assigned at ingest, and returns a sparse matrix with
  second timestamps and Loki-formatted values.

victorialogs_layer: |
  VictoriaLogs can count rows per bucket grouped by stored or unpacked fields
  (`stats_query_range` with `unpack_json ... keep_original_fields`), but it has no
  detected_level, no parser-error marker, no `_extracted` renaming, and its buckets
  are `[T, T+step)` rather than Loki's `(T-range, T]`.

execution: hybrid
native_reuse: |
  `stats_query_range` + `unpack_json fields (...) keep_original_fields` +
  `filter` for label filters, on an anchored sliding-bucket grid; the level
  grouping is merged in Go over the aggregated series, never over raw rows.

deltas:
  - id: detected-level-alias
    difference: |
      Loki returns detected_level; VictoriaLogs only has whatever level-like field was stored.
    impact: |
      Every series collapses to one unknown group, or the level breakdown disappears.
    proxy_layer: |
      Derives the Loki value from the stored field and merges the level/detected_level aliases over the aggregated series.
    where: internal/proxy/ordered_json_metric.go
    cost: |
      none beyond the grouping itself
    cases: [severity/group-by-both, severity/no-signal-is-unknown]
    state: partial
  - id: parser-error-exclusion
    difference: |
      Loki excludes lines whose JSON failed to parse unless __error__ is dropped; VictoriaLogs counts every row.
    impact: |
      Counts higher than Loki wherever a line is malformed.
    proxy_layer: |
      Accepts the stats pushdown only when the pipeline drops parser errors; otherwise keeps the exact evaluator.
    where: internal/proxy/ordered_json_metric.go
    cost: |
      none
    cases: [semantics/json-parse-error-excluded, semantics/drop-error-includes-line]
    state: proven
  - id: parser-disagreement
    difference: |
      Loki keeps keys parsed before a syntax error and tolerates leading whitespace; unpack_json yields nothing for such a line.
    impact: |
      A level silently disappears from the chart for those lines.
    proxy_layer: |
      Runs a `| limit 1` probe for lines the two parsers read differently, per field, and falls back to the exact evaluator when one exists.
    where: internal/proxy/ordered_json_metric.go
    cost: |
      one extra VictoriaLogs scan on a first request; cached per window for 5 minutes
    cases: [semantics/partial-parse-before-error, quality/parse-risk-probe-scope, quality/parse-risk-cache-window]
    state: partial
  - id: label-spelling-and-filters
    difference: |
      Loki sanitizes JSON keys (service-version, service.version) and joins nested keys with an underscore, so a label such as service_version may come from several spellings; unpack_json keeps keys raw and joins nesting with a dot. Loki also fails a metric whose sample carries __error__, and reads structured metadata before a parsed key of the same name.
    impact: |
      v1.91.0 refused the stats pushdown for any grouped or filtered label holding an underscore, any pipeline without `drop __error__` and any ungrouped sum; Explore's filtered logs volume, a user's `sum by (level) (... | json | pipeline="x" [1m])` and Drilldown field breakdowns scanned raw rows and answered 502 (row limit) over 3 h where Loki answers in seconds.
    proxy_layer: |
      Reads underscore labels through unpack_json and adds their other spellings (per Loki v3.7.7 sanitizeLabelKey and nested-key rules) to the parse-risk probe; accepts a filter that rejects the empty value in place of `drop __error__`, guarded by the partial-parse probe and a stored-field probe; unpacks only the filter keys of an ungrouped sum; reads a label VictoriaLogs stores under another spelling from the stored field with `format if`.
    where: internal/proxy/ordered_json_metric.go
    cost: |
      the existing probe (one scan, cached per window) carries the extra regexp; one more `field:*` probe when errors are not dropped
    cases: [semantics/json-filter-pushdown-underscore-label, semantics/json-filter-pushdown-without-error-drop, semantics/json-filter-pushdown-ungrouped-sum, semantics/json-filter-pushdown-translated-label, semantics/json-label-spelling-probe]
    state: proven
  - id: bucket-edges
    difference: |
      VictoriaLogs buckets are [T, T+step); Loki samples cover (T-range, T].
    impact: |
      Every point lands one window off, so the chart is shifted.
    proxy_layer: |
      Anchors the bucket grid with the offset parameter and relabels tumbling results forward by one range.
    where: internal/proxy/range_metric_compat.go
    cost: |
      none
    cases: [semantics/tumbling-relabel, semantics/lower-bound-exclusive]
    state: partial
  - id: resolution-limit
    difference: |
      Loki rejects more than 11,000 points per series before parsing; VictoriaLogs has no such rule.
    impact: |
      A 400 where Loki draws a chart, or an unbounded response.
    proxy_layer: |
      Applies Loki's limit with Loki's message before any backend work.
    where: internal/proxy/metric_eval_limits.go
    cost: |
      none
    cases: [semantics/resolution-limit-11000]
    state: proven

performance:
  verdict: acceptable
  evidence: |
    24h at 8s step: 0.39s (main returned 400). 7d uncached: 4.6-5.4s against
    Loki's 2.8-6.9s uncached, dominated by the parse-difference probe; a refreshed
    range is about 1s. The probe is the remaining cost: folding it into the stats
    query would make a first request a single VictoriaLogs scan.
