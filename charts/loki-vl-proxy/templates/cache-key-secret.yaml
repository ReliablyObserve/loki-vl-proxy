{{- /*
Cache key secret (-cache-key-secret-file): keys the digests of credentials in
cache keys (docs/security.md#cache-key-secret).

Resolution order:
  A) cacheKeySecret.existingSecret set
     → the operator's Secret is mounted; the chart renders nothing here.
  B) <release>-cache-key exists (upgrade)
     → its value is kept (lookup), so restarts and upgrades keep the key.
  C) the render reaches a cluster and finds none (first install)
     → a random 64-character value is generated into <release>-cache-key.
  D) the render has no cluster access (helm template, Argo CD)
     → nothing is rendered or mounted: a random value per render would replace
       the key on every sync. The proxy then derives the key from the peer
       token, else uses one per process; set existingSecret for such renderers.

Deleting the Secret makes the next install or upgrade generate a new key:
pods started after it miss the credential-scoped entries of the old key
(they age out), and until every pod restarted, old and new pods do not share
them. No answer is served across keys.
*/}}
{{- $mode := include "loki-vl-proxy.cacheKeyGenerated" . }}
{{- if $mode }}
{{- $secretName := printf "%s-cache-key" .Release.Name }}
{{- $value := "" }}
{{- if eq $mode "reuse" }}
{{- $value = index (lookup "v1" "Secret" .Release.Namespace (printf "%s-cache-key" .Release.Name)).data "secret" | b64dec }}
{{- else }}
{{- $value = randAlphaNum 64 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "loki-vl-proxy.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ $value | b64enc | quote }}
{{- end }}
