# osv-scanner configuration for security/requirements-semgrep.txt (also read
# by the OpenSSF Scorecard Vulnerabilities check). These packages are pinned
# by semgrep itself; remove the entries when a semgrep release allows the
# fixed versions.

[[IgnoredVulns]]
id = "GHSA-84m7-p3x7-pcfv"
ignoreUntil = 2027-01-20T00:00:00Z
reason = """mcp: semgrep 1.175.0 through 1.182.1 (the latest; 1.181.0 is \
pinned here) require mcp==1.29.0, so the fixed 1.30.0 cannot be installed \
with it. The advisory concerns the MCP \
StreamableHTTP server transport; the security-heavy workflow only runs \
`semgrep scan` on the checkout and never starts an MCP server. The package is \
installed in that CI job only and is not part of the proxy binary, image or \
Helm chart."""

[[IgnoredVulns]]
id = "GHSA-xcq7-p3pf-p88h"
ignoreUntil = 2027-01-20T00:00:00Z
reason = """opentelemetry-api: semgrep 1.160.0 through 1.182.1 (1.181.0 is \
pinned here) require opentelemetry-api~=1.37.0 (>=1.37.0,<1.38), so the fixed \
1.45.1 cannot be installed with it. The advisory concerns parsing an incoming W3C tracestate header; `semgrep \
scan` in the security-heavy workflow receives no trace context. The package \
is installed in that CI job only and is not part of the proxy binary, image or \
Helm chart."""
